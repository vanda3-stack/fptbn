<!DOCTYPE html>
<html lang="vi">

<head>
<link rel="icon" type="image/png" href="/assets/branding/favicon.png">


    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FPTBN Monitor - Học sinh
    </title>


    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #0f172a;

            color:
                #ffffff;
        }


        body {
            min-height: 100vh;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .header {

            height: 64px;

            padding:
                0
                18px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            background:
                #111827;

            border-bottom:
                1px solid
                #334155;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.25);
        }


        .brand-title {

            font-size: 19px;

            font-weight: 700;

            color:
                #ffffff;
        }


        .brand-subtitle {

            margin-top: 3px;

            font-size: 11px;

            color:
                #94a3b8;
        }


        .student-badge {

            padding:
                7px
                11px;

            font-size: 12px;

            font-weight: 700;

            color:
                #bfdbfe;

            background:
                #1e3a8a;

            border:
                1px solid
                #2563eb;

            border-radius:
                8px;
        }


        /* ==========================================
           JOIN PAGE
        ========================================== */

        #joinPage {

            min-height:
                calc(100vh - 64px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .join-card {

            width: 100%;

            max-width: 480px;

            padding:
                28px;

            background:
                #111827;

            border:
                1px solid
                #334155;

            border-radius:
                16px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);
        }


        .join-icon {

            text-align: center;

            font-size: 48px;

            margin-bottom: 12px;
        }


        .join-title {

            margin: 0;

            text-align: center;

            font-size: 24px;

            font-weight: 700;
        }


        .join-description {

            margin:
                10px
                0
                24px;

            text-align: center;

            font-size: 13px;

            line-height: 1.6;

            color:
                #94a3b8;
        }


        /* ==========================================
           INPUT
        ========================================== */

        .input-label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;

            color:
                #cbd5e1;
        }


        #studentCode {

            display: block;

            width: 100%;

            height: 46px;

            padding:
                0
                13px;

            border:
                1px solid
                #475569;

            border-radius:
                9px;

            outline: none;

            background:
                #0f172a;

            color:
                #ffffff;

            font-size: 15px;

            transition:
                border-color
                0.2s ease,
                box-shadow
                0.2s ease;
        }


        #studentCode::placeholder {

            color:
                #64748b;
        }


        #studentCode:focus {

            border-color:
                #3b82f6;

            box-shadow:
                0 0 0 3px
                rgba(59, 130, 246, 0.15);
        }


        /* ==========================================
           SHARE BUTTON
        ========================================== */

        #shareButton {

            display: block;

            width: 100%;

            min-height: 48px;

            margin-top: 14px;

            padding:
                10px
                15px;

            border: none;

            border-radius:
                9px;

            color:
                #ffffff;

            background:
                #2563eb;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                all
                0.2s ease;
        }


        #shareButton:hover {

            background:
                #1d4ed8;

            transform:
                translateY(-1px);
        }


        #shareButton:disabled {

            opacity: 0.65;

            cursor: wait;

            transform: none;
        }


        /* ==========================================
           SERVER STATUS
        ========================================== */

        #status {

            min-height: 20px;

            margin-top: 14px;

            text-align: center;

            font-size: 12px;

            color:
                #94a3b8;
        }


        /* ==========================================
           SHARE INSTRUCTION
        ========================================== */

        .instruction {

            margin-top: 20px;

            padding:
                13px;

            background:
                #172554;

            border:
                1px solid
                #1d4ed8;

            border-radius:
                9px;

            font-size: 12px;

            line-height: 1.6;

            color:
                #dbeafe;
        }


        .instruction-title {

            margin-bottom: 5px;

            font-weight: 700;

            color:
                #ffffff;
        }


        /* ==========================================
           CLASSROOM
        ========================================== */

        #classroom {

            display: none;

            width: 100%;

            min-height:
                calc(100vh - 64px);

            padding:
                14px;
        }


        /* ==========================================
           CLASSROOM TOP
        ========================================== */

        .classroom-top {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 10px;

            margin-bottom: 12px;

            padding:
                10px
                13px;

            background:
                #111827;

            border:
                1px solid
                #334155;

            border-radius:
                9px;
        }


        .classroom-title {

            font-size: 14px;

            font-weight: 700;
        }


        #studentStatus {

            font-size: 12px;

            font-weight: 700;

            color:
                #cbd5e1;
        }


        /* ==========================================
           SCREEN LAYOUT

           Màn hình GV là nội dung chính.
           Preview màn hình HS nằm nhỏ bên cạnh.
        ========================================== */

        .screen-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }


        /* ==========================================
           TEACHER SCREEN
        ========================================== */

        .teacher-panel {

            position: relative;

            min-width: 0;

            overflow: hidden;

            background:
                #020617;

            border:
                1px solid
                #334155;

            border-radius:
                12px;
        }


        .panel-header {

            min-height: 40px;

            padding:
                9px
                12px;

            display: flex;

            align-items: center;

            background:
                #111827;

            border-bottom:
                1px solid
                #334155;

            font-size: 13px;

            font-weight: 700;

            color:
                #e2e8f0;
        }


        .teacher-video-box {

            position: relative;

            width: 100%;

            min-height:
                420px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #000000;
        }


        #teacherVideo {

            display: block;

            width: 100%;

            max-height:
                calc(100vh - 155px);

            object-fit: contain;

            background:
                #000000;
        }


        /* ==========================================
           WAITING TEACHER
        ========================================== */

        #waitingTeacher {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width:
                calc(100% - 40px);

            padding: 20px;

            text-align: center;

            font-size: 15px;

            font-weight: 700;

            line-height: 1.5;

            color:
                #94a3b8;

            pointer-events: none;
        }


        /* ==========================================
           STUDENT PREVIEW
        ========================================== */


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (
            max-width: 900px
        ) {

            .screen-layout {

                grid-template-columns:
                    1fr;
            }


            .student-panel {

                max-width:
                    420px;
            }


            .teacher-video-box {

                min-height:
                    350px;
            }

        }


        @media (
            max-width: 600px
        ) {

            .header {

                height: auto;

                min-height: 64px;

                padding:
                    10px
                    13px;

                gap: 10px;
            }


            .brand-title {

                font-size: 16px;
            }


            .brand-subtitle {

                display: none;
            }


            .student-badge {

                font-size: 10px;
            }


            #joinPage {

                min-height:
                    calc(100vh - 64px);

                padding: 12px;
            }


            .join-card {

                padding:
                    22px
                    17px;
            }


            .join-title {

                font-size: 21px;
            }


            #classroom {

                padding: 8px;
            }


            .classroom-top {

                flex-direction: column;

                align-items: flex-start;
            }


            .teacher-video-box {

                min-height:
                    260px;
            }


            #teacherVideo {

                max-height:
                    60vh;
            }


            .student-panel {

                max-width: 100%;
            }

        }

    
        /* STUDENT JOIN - FRIENDLIER LOGIN */
        #joinPage {
            background:
                radial-gradient(circle at 50% 0%, rgba(37,99,235,.20), transparent 38%),
                #0f172a;
        }

        .join-card {
            max-width: 520px;
            padding: 34px;
            border: 1px solid #334155;
            border-radius: 22px;
            box-shadow: 0 24px 70px rgba(0,0,0,.34);
        }

        .join-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 14px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: #1e3a8a;
            font-size: 34px;
        }

        .join-title {
            margin-bottom: 8px;
            text-align: center;
            font-size: 28px;
        }

        .join-description {
            max-width: 390px;
            margin: 0 auto 26px;
            text-align: center;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        #studentCode {
            width: 100%;
            height: 58px;
            padding: 0 17px;
            border: 2px solid #334155;
            border-radius: 13px;
            outline: none;
            background: #0f172a;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            transition: border-color .2s, box-shadow .2s;
        }

        #studentCode:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,.14);
        }

        #studentCodeHint {
            line-height: 1.5;
        }

        #shareButton {
            width: 100%;
            min-height: 58px;
            margin-top: 22px;
            border: 0;
            border-radius: 13px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(37,99,235,.25);
        }

        #shareButton:hover { background: #1d4ed8; }
        #shareButton:disabled { opacity: .58; cursor: not-allowed; }

        #status {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
        }

        .instruction {
            margin-top: 20px;
            padding: 15px 16px;
            border: 1px solid #334155;
            border-radius: 13px;
            background: rgba(15,23,42,.72);
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 13px;
        }

        .instruction-title {
            margin-bottom: 5px;
            color: #fff;
            font-weight: 800;
        }

        @media (max-width: 600px) {
            .header { height: 58px; padding: 0 14px; }
            .brand-subtitle { display: none; }
            #joinPage { min-height: calc(100vh - 58px); padding: 14px; }
            .join-card { padding: 25px 20px; border-radius: 18px; }
            .join-title { font-size: 25px; }
            .student-badge { padding: 6px 9px; }
        }

    
.fptbn-brand-logo{display:block;width:auto;height:43px;max-width:min(260px,40vw);object-fit:contain;object-position:left center}
.fptbn-login-icon{display:block;width:65px;height:65px;object-fit:contain;margin:auto}
.join-icon:has(.fptbn-login-icon){background:transparent!important;box-shadow:none!important}
@media(max-width:650px){.fptbn-brand-logo{height:33px;max-width:180px}}

/* FPT Schools is the primary institution brand; FPTBN Monitor is the product brand. */
.school-identity{display:inline-flex;align-items:center;gap:8px;min-width:0;flex-shrink:0}.school-identity img{display:block;width:auto;height:42px;max-width:175px;object-fit:contain}.school-name-fallback{display:none;font-size:17px;color:#fff;white-space:nowrap}.school-name-fallback em{font-style:normal;color:#ff7623}.school-identity:has(img[style*="display: none"]) .school-name-fallback{display:inline}.fptbn-product-brand{display:flex;align-items:center;gap:13px;min-width:0}.fptbn-product-brand .fptbn-brand-logo{height:30px;max-width:175px}.fptbn-product-brand .brand-subtitle{font-size:11px}.school-brand-divider{width:1px;height:36px;background:rgba(148,163,184,.35);flex-shrink:0}@media(max-width:650px){.school-identity img{height:31px;max-width:112px}.fptbn-product-brand .fptbn-brand-logo{height:23px;max-width:118px}.school-brand-divider{height:28px}.fptbn-product-brand{gap:7px}}

/* Full product logo centered on sign-in; school identity in header/sidebar unchanged. */
.login-full-brand{display:flex;justify-content:center;align-items:center;width:100%;margin:0 auto 16px}.login-full-brand img{display:block;width:min(100%,290px);height:auto;max-height:124px;object-fit:contain}.join-card .login-full-brand img{max-height:128px}.teacher-login-card .login-full-brand img{max-height:128px}.login-card .login-full-brand img{max-height:128px}@media(max-width:500px){.login-full-brand img{width:min(100%,235px);max-height:100px}}

/* Student experience refresh — dark classroom, no changes to WebRTC DOM IDs. */
:root { color-scheme:dark; --student-bg:#080f1e; --student-surface:#101d31; --student-line:#273b56; --student-accent:#3b82f6; }
html,body { background:var(--student-bg); color:#eaf2ff; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
body { background:radial-gradient(ellipse at 50% -22%,#18365d 0%,transparent 55%),#080f1e; }
.header { height:68px; min-height:68px; padding:0 clamp(14px,2vw,32px); background:rgba(10,19,35,.94); border-bottom:1px solid #233751; box-shadow:0 8px 32px #0003; gap:12px; }
.header .fptbn-product-brand { display:flex; align-items:center; gap:15px; min-width:0; }
.header .school-identity img { height:40px; width:auto; max-width:125px; object-fit:contain; }
.header .brand-title { font-size:13px; font-weight:850; letter-spacing:.14em; color:#cfe2ff; }
.header .brand-subtitle { font-size:11px; color:#8099b9; margin-top:4px; }
.header .student-badge { background:#132b43; border:1px solid #315174; border-radius:100px; padding:8px 13px; font-size:12px; white-space:nowrap; }
#joinPage { min-height:calc(100dvh - 68px); display:flex; align-items:center; justify-content:center; padding:28px 16px; }
#joinPage .join-card { width:min(100%,470px); max-width:470px; margin:auto; padding:clamp(24px,4vw,42px); background:linear-gradient(155deg,#15243b,#0e192b); border:1px solid #344966; border-radius:22px; box-shadow:0 25px 90px #0007,0 0 0 1px #ffffff08 inset; }
#joinPage .login-full-brand { margin-bottom:24px; }
#joinPage .login-full-brand img { max-height:90px; }
#joinPage .join-title { font-size:clamp(26px,3vw,34px); font-weight:800; margin:0 0 26px; letter-spacing:-.03em; }
#joinPage .input-label { color:#b9cce5; font-size:13px; font-weight:700; margin-bottom:9px; }
#joinPage #studentCode { background:#091526; border:1px solid #38516f; color:#f2f7ff; border-radius:12px; min-height:52px; font-size:17px; letter-spacing:.04em; transition:border-color .2s,box-shadow .2s; }
#joinPage #studentCode:focus { border-color:#60a5fa; box-shadow:0 0 0 3px #3b82f633; outline:none; }
#joinPage #shareButton { background:linear-gradient(110deg,#1769f4,#368cf9); border:1px solid #60a5fa66; border-radius:12px; min-height:54px; box-shadow:0 10px 24px #1253c544; font-weight:750; }
#joinPage #shareButton:hover { filter:brightness(1.1); transform:translateY(-1px); }
#joinPage #status { border-radius:10px; background:#0b1a2d; border:1px solid #263e5b; font-size:12px; line-height:1.5; }
#classroom { min-height:calc(100dvh - 68px); padding:clamp(12px,1.6vw,22px); background:transparent; }
#classroom .classroom-top { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; background:#111e32; border:1px solid #283d59; border-radius:14px; padding:13px 18px; margin:0 0 14px; }
#classroom .classroom-title { font-size:16px; font-weight:800; color:#f2f7ff; }
#classroom #studentStatus { border-radius:99px; padding:8px 12px; background:#0c2930; border:1px solid #1e6b65; font-size:12px; }
#classroom .screen-layout { display:block; width:100%; max-width:none; margin:0; }
#classroom .teacher-panel { width:100%; max-width:none; margin:0; padding:0; background:#101b2e; border:1px solid #2b405e; border-radius:16px; overflow:hidden; box-shadow:0 14px 44px #0005; }
#classroom .panel-header { padding:12px 17px; background:#14243a; border-bottom:1px solid #2d425e; font-size:14px; font-weight:750; }
#classroom .teacher-video-box { position:relative; display:flex; align-items:center; justify-content:center; width:100%; height:calc(100dvh - 210px); min-height:300px; max-height:none; aspect-ratio:auto; background:#050a13; border:0; border-radius:0; overflow:hidden; }
#classroom #teacherVideo { display:block; width:100%; height:100%; max-height:100%; object-fit:contain; background:#050a13; }
#classroom #waitingTeacher { max-width:min(90%,520px); text-align:center; color:#c4d6ed; font-size:clamp(15px,2vw,21px); line-height:1.6; }
@media(max-width:650px) {
 .header { height:62px; min-height:62px; padding:0 12px; }
 .header .school-identity img { height:31px; }
 .header .brand-title { font-size:10px; }
 .header .brand-subtitle { display:none; }
 .header .student-badge { font-size:11px; padding:6px 8px; }
 #joinPage { min-height:calc(100dvh - 62px); }
 #classroom { min-height:calc(100dvh - 62px); padding:9px; }
 #classroom .classroom-top { padding:10px; }
 #classroom .teacher-video-box { height:calc(100dvh - 185px); min-height:220px; }
}

/* Minimal classroom: status remains available without a top bar. */
#classroom .classroom-top { background:transparent; border:0; padding:0; margin:0; min-height:0; justify-content:flex-end; }
#classroom #studentStatus { margin:0 0 9px; }
#classroom .teacher-video-box { height:calc(100dvh - 168px); }
@media(max-width:650px){ #classroom .teacher-video-box { height:calc(100dvh - 151px); } }

/* Classroom content begins immediately beneath the header. */
#classroom .classroom-top { display:none !important; }
#classroom { padding-top:8px; }
#classroom .teacher-video-box { height:calc(100dvh - 170px); min-height:260px; }
#classroom .learning-banner { display:flex; align-items:center; justify-content:center; gap:12px; min-height:0; height:54px; margin-top:7px; padding:5px 14px; background:linear-gradient(115deg,#102445,#172e56,#101b33); border:1px solid #294b79; border-radius:15px; }
#classroom .learning-banner svg { display:block; width:66px; height:40px; flex:0 0 66px; }
#classroom .learning-banner strong { font-size:15px; color:#fff; }
#classroom .learning-banner p { margin:2px 0 0; color:#bfd2ec; font-size:11px; line-height:1.3; }
@media(max-width:650px) { #classroom .teacher-video-box { height:calc(100dvh - 158px); min-height:180px; } #classroom .learning-banner { height:46px; gap:7px; padding:4px 8px; } #classroom .learning-banner svg { width:42px; height:34px; flex-basis:42px; } #classroom .learning-banner strong { font-size:12px; } #classroom .learning-banner p { font-size:9px; } }
/* Remove teacher-panel title and emphasize centered waiting message. */
#classroom .teacher-panel .panel-header { display:none; }
#classroom #waitingTeacher { font-size:clamp(20px,2.4vw,30px); line-height:1.5; font-weight:800; }
#classroom .teacher-video-box { height:calc(100dvh - 137px); }
@media(max-width:650px) { #classroom #waitingTeacher { font-size:clamp(18px,4.5vw,24px); } #classroom .teacher-video-box { height:calc(100dvh - 125px); } }
/* Center the waiting message and keep it on one line on desktop. */
#classroom #waitingTeacher { left:50%; top:50%; transform:translate(-50%,-50%); width:max-content; max-width:calc(100% - 24px); white-space:nowrap; padding:12px 16px; }
@media(max-width:650px) { #classroom #waitingTeacher { font-size:clamp(12px,3.5vw,18px); padding:8px; } }
</style>

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="header">


        <div class="fptbn-product-brand"><span class="school-identity"><img src="/assets/branding/logo_fpt_school.png" alt="FPT Schools" onerror="this.style.display='none'"><strong class="school-name-fallback">FPT <em>SCHOOLS</em></strong></span></div>

        <div
            class="student-badge"
            id="studentBadge"
        >
            👨‍🎓 Học sinh
        </div>


    </header>


    <!-- ==========================================
         JOIN PAGE
    =========================================== -->

    <main id="joinPage">


        <section class="join-card">


            <div class="login-full-brand"><img src="/assets/branding/logo-full.png" alt="FPTBN Monitor"></div>


            <h1 class="join-title">
                Vào lớp học
            </h1>


            <!-- ==================================
                STUDENT CODE
            =================================== -->

            <label
                class="input-label"
                for="studentCode"
            >
                Mã học sinh
            </label>

            <input
                id="studentCode"
                type="text"
                placeholder="FBN12345"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                maxlength="8"
                inputmode="text"
            >

            <!-- ==================================
                 JOIN BUTTON
            =================================== -->

            <button
                id="shareButton"
                type="button"
            >
                Vào lớp & chia sẻ toàn bộ màn hình →
            </button>


            <!-- ==================================
                 SERVER STATUS
            =================================== -->

            <div id="status">
                🟡 Đang kết nối máy chủ...
            </div>


            <!-- ==================================
                 INSTRUCTION
            =================================== -->

        </section>

<!DOCTYPE html>
<html lang="vi">

<head>
<link rel="icon" type="image/png" href="/assets/branding/favicon.png">


    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FPTBN Monitor - Học sinh
    </title>


    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #0f172a;

            color:
                #ffffff;
        }


        body {
            min-height: 100vh;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .header {

            height: 64px;

            padding:
                0
                18px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            background:
                #111827;

            border-bottom:
                1px solid
                #334155;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.25);
        }


        .brand-title {

            font-size: 19px;

            font-weight: 700;

            color:
                #ffffff;
        }


        .brand-subtitle {

            margin-top: 3px;

            font-size: 11px;

            color:
                #94a3b8;
        }


        .student-badge {

            padding:
                7px
                11px;

            font-size: 12px;

            font-weight: 700;

            color:
                #bfdbfe;

            background:
                #1e3a8a;

            border:
                1px solid
                #2563eb;

            border-radius:
                8px;
        }


        /* ==========================================
           JOIN PAGE
        ========================================== */

        #joinPage {

            min-height:
                calc(100vh - 64px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .join-card {

            width: 100%;

            max-width: 480px;

            padding:
                28px;

            background:
                #111827;

            border:
                1px solid
                #334155;

            border-radius:
                16px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);
        }


        .join-icon {

            text-align: center;

            font-size: 48px;

            margin-bottom: 12px;
        }


        .join-title {

            margin: 0;

            text-align: center;

            font-size: 24px;

            font-weight: 700;
        }


        .join-description {

            margin:
                10px
                0
                24px;

            text-align: center;

            font-size: 13px;

            line-height: 1.6;

            color:
                #94a3b8;
        }


        /* ==========================================
           INPUT
        ========================================== */

        .input-label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;

            color:
                #cbd5e1;
        }


        #studentCode {

            display: block;

            width: 100%;

            height: 46px;

            padding:
                0
                13px;

            border:
                1px solid
                #475569;

            border-radius:
                9px;

            outline: none;

            background:
                #0f172a;

            color:
                #ffffff;

            font-size: 15px;

            transition:
                border-color
                0.2s ease,
                box-shadow
                0.2s ease;
        }


        #studentCode::placeholder {

            color:
                #64748b;
        }


        #studentCode:focus {

            border-color:
                #3b82f6;

            box-shadow:
                0 0 0 3px
                rgba(59, 130, 246, 0.15);
        }


        /* ==========================================
           SHARE BUTTON
        ========================================== */

        #shareButton {

            display: block;

            width: 100%;

            min-height: 48px;

            margin-top: 14px;

            padding:
                10px
                15px;

            border: none;

            border-radius:
                9px;

            color:
                #ffffff;

            background:
                #2563eb;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                all
                0.2s ease;
        }


        #shareButton:hover {

            background:
                #1d4ed8;

            transform:
                translateY(-1px);
        }


        #shareButton:disabled {

            opacity: 0.65;

            cursor: wait;

            transform: none;
        }


        /* ==========================================
           SERVER STATUS
        ========================================== */

        #status {

            min-height: 20px;

            margin-top: 14px;

            text-align: center;

            font-size: 12px;

            color:
                #94a3b8;
        }


        /* ==========================================
           SHARE INSTRUCTION
        ========================================== */

        .instruction {

            margin-top: 20px;

            padding:
                13px;

            background:
                #172554;

            border:
                1px solid
                #1d4ed8;

            border-radius:
                9px;

            font-size: 12px;

            line-height: 1.6;

            color:
                #dbeafe;
        }


        .instruction-title {

            margin-bottom: 5px;

            font-weight: 700;

            color:
                #ffffff;
        }


        /* ==========================================
           CLASSROOM
        ========================================== */

        #classroom {

            display: none;

            width: 100%;

            min-height:
                calc(100vh - 64px);

            padding:
                14px;
        }


        /* ==========================================
           CLASSROOM TOP
        ========================================== */

        .classroom-top {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 10px;

            margin-bottom: 12px;

            padding:
                10px
                13px;

            background:
                #111827;

            border:
                1px solid
                #334155;

            border-radius:
                9px;
        }


        .classroom-title {

            font-size: 14px;

            font-weight: 700;
        }


        #studentStatus {

            font-size: 12px;

            font-weight: 700;

            color:
                #cbd5e1;
        }


        /* ==========================================
           SCREEN LAYOUT

           Màn hình GV là nội dung chính.
           Preview màn hình HS nằm nhỏ bên cạnh.
        ========================================== */

        .screen-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }


        /* ==========================================
           TEACHER SCREEN
        ========================================== */

        .teacher-panel {

            position: relative;

            min-width: 0;

            overflow: hidden;

            background:
                #020617;

            border:
                1px solid
                #334155;

            border-radius:
                12px;
        }


        .panel-header {

            min-height: 40px;

            padding:
                9px
                12px;

            display: flex;

            align-items: center;

            background:
                #111827;

            border-bottom:
                1px solid
                #334155;

            font-size: 13px;

            font-weight: 700;

            color:
                #e2e8f0;
        }


        .teacher-video-box {

            position: relative;

            width: 100%;

            min-height:
                420px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #000000;
        }


        #teacherVideo {

            display: block;

            width: 100%;

            max-height:
                calc(100vh - 155px);

            object-fit: contain;

            background:
                #000000;
        }


        /* ==========================================
           WAITING TEACHER
        ========================================== */

        #waitingTeacher {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width:
                calc(100% - 40px);

            padding: 20px;

            text-align: center;

            font-size: 15px;

            font-weight: 700;

            line-height: 1.5;

            color:
                #94a3b8;

            pointer-events: none;
        }


        /* ==========================================
           STUDENT PREVIEW
        ========================================== */


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (
            max-width: 900px
        ) {

            .screen-layout {

                grid-template-columns:
                    1fr;
            }


            .student-panel {

                max-width:
                    420px;
            }


            .teacher-video-box {

                min-height:
                    350px;
            }

        }


        @media (
            max-width: 600px
        ) {

            .header {

                height: auto;

                min-height: 64px;

                padding:
                    10px
                    13px;

                gap: 10px;
            }


            .brand-title {

                font-size: 16px;
            }


            .brand-subtitle {

                display: none;
            }


            .student-badge {

                font-size: 10px;
            }


            #joinPage {

                min-height:
                    calc(100vh - 64px);

                padding: 12px;
            }


            .join-card {

                padding:
                    22px
                    17px;
            }


            .join-title {

                font-size: 21px;
            }


            #classroom {

                padding: 8px;
            }


            .classroom-top {

                flex-direction: column;

                align-items: flex-start;
            }


            .teacher-video-box {

                min-height:
                    260px;
            }


            #teacherVideo {

                max-height:
                    60vh;
            }


            .student-panel {

                max-width: 100%;
            }

        }

    
        /* STUDENT JOIN - FRIENDLIER LOGIN */
        #joinPage {
            background:
                radial-gradient(circle at 50% 0%, rgba(37,99,235,.20), transparent 38%),
                #0f172a;
        }

        .join-card {
            max-width: 520px;
            padding: 34px;
            border: 1px solid #334155;
            border-radius: 22px;
            box-shadow: 0 24px 70px rgba(0,0,0,.34);
        }

        .join-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 14px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: #1e3a8a;
            font-size: 34px;
        }

        .join-title {
            margin-bottom: 8px;
            text-align: center;
            font-size: 28px;
        }

        .join-description {
            max-width: 390px;
            margin: 0 auto 26px;
            text-align: center;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        #studentCode {
            width: 100%;
            height: 58px;
            padding: 0 17px;
            border: 2px solid #334155;
            border-radius: 13px;
            outline: none;
            background: #0f172a;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            transition: border-color .2s, box-shadow .2s;
        }

        #studentCode:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59,130,246,.14);
        }

        #studentCodeHint {
            line-height: 1.5;
        }

        #shareButton {
            width: 100%;
            min-height: 58px;
            margin-top: 22px;
            border: 0;
            border-radius: 13px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(37,99,235,.25);
        }

        #shareButton:hover { background: #1d4ed8; }
        #shareButton:disabled { opacity: .58; cursor: not-allowed; }

        #status {
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
        }

        .instruction {
            margin-top: 20px;
            padding: 15px 16px;
            border: 1px solid #334155;
            border-radius: 13px;
            background: rgba(15,23,42,.72);
            color: #cbd5e1;
            line-height: 1.6;
            font-size: 13px;
        }

        .instruction-title {
            margin-bottom: 5px;
            color: #fff;
            font-weight: 800;
        }

        @media (max-width: 600px) {
            .header { height: 58px; padding: 0 14px; }
            .brand-subtitle { display: none; }
            #joinPage { min-height: calc(100vh - 58px); padding: 14px; }
            .join-card { padding: 25px 20px; border-radius: 18px; }
            .join-title { font-size: 25px; }
            .student-badge { padding: 6px 9px; }
        }

    
.fptbn-brand-logo{display:block;width:auto;height:43px;max-width:min(260px,40vw);object-fit:contain;object-position:left center}
.fptbn-login-icon{display:block;width:65px;height:65px;object-fit:contain;margin:auto}
.join-icon:has(.fptbn-login-icon){background:transparent!important;box-shadow:none!important}
@media(max-width:650px){.fptbn-brand-logo{height:33px;max-width:180px}}

/* FPT Schools is the primary institution brand; FPTBN Monitor is the product brand. */
.school-identity{display:inline-flex;align-items:center;gap:8px;min-width:0;flex-shrink:0}.school-identity img{display:block;width:auto;height:42px;max-width:175px;object-fit:contain}.school-name-fallback{display:none;font-size:17px;color:#fff;white-space:nowrap}.school-name-fallback em{font-style:normal;color:#ff7623}.school-identity:has(img[style*="display: none"]) .school-name-fallback{display:inline}.fptbn-product-brand{display:flex;align-items:center;gap:13px;min-width:0}.fptbn-product-brand .fptbn-brand-logo{height:30px;max-width:175px}.fptbn-product-brand .brand-subtitle{font-size:11px}.school-brand-divider{width:1px;height:36px;background:rgba(148,163,184,.35);flex-shrink:0}@media(max-width:650px){.school-identity img{height:31px;max-width:112px}.fptbn-product-brand .fptbn-brand-logo{height:23px;max-width:118px}.school-brand-divider{height:28px}.fptbn-product-brand{gap:7px}}

/* Full product logo centered on sign-in; school identity in header/sidebar unchanged. */
.login-full-brand{display:flex;justify-content:center;align-items:center;width:100%;margin:0 auto 16px}.login-full-brand img{display:block;width:min(100%,290px);height:auto;max-height:124px;object-fit:contain}.join-card .login-full-brand img{max-height:128px}.teacher-login-card .login-full-brand img{max-height:128px}.login-card .login-full-brand img{max-height:128px}@media(max-width:500px){.login-full-brand img{width:min(100%,235px);max-height:100px}}
</style>

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="header">


        <div class="fptbn-product-brand"><span class="school-identity"><img src="/assets/branding/logo_fpt_school.png" alt="FPT Schools" onerror="this.style.display='none'"><strong class="school-name-fallback">FPT <em>SCHOOLS</em></strong></span><span class="school-brand-divider" aria-hidden="true"></span><div><div class="brand-title"><img src="/assets/branding/logo-horizontal.png" alt="FPTBN Monitor" class="fptbn-brand-logo"></div>

            <div class="brand-subtitle">
                Hệ thống lớp học trực tuyến
            </div>

        </div></div>


        <div
            class="student-badge"
            id="studentBadge"
        >
            👨‍🎓 Học sinh
        </div>


    </header>


    <!-- ==========================================
         JOIN PAGE
    =========================================== -->

    <main id="joinPage">


        <section class="join-card">


            <div class="login-full-brand"><img src="/assets/branding/logo-full.png" alt="FPTBN Monitor"></div>


            <h1 class="join-title">
                Vào lớp học
            </h1>


            <!-- ==================================
                STUDENT CODE
            =================================== -->

            <label
                class="input-label"
                for="studentCode"
            >
                Mã học sinh
            </label>

            <input
                id="studentCode"
                type="text"
                placeholder="FBN12345"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                maxlength="8"
                inputmode="text"
            >

            <!-- ==================================
                 JOIN BUTTON
            =================================== -->

            <button
                id="shareButton"
                type="button"
            >
                Vào lớp & chia sẻ toàn bộ màn hình →
            </button>


            <!-- ==================================
                 SERVER STATUS
            =================================== -->

            <div id="status">
                🟡 Đang kết nối máy chủ...
            </div>


            <!-- ==================================
                 INSTRUCTION
            =================================== -->

        </section>


    </main>


    <!-- ==========================================
         CLASSROOM
    =========================================== -->

    <main id="classroom">


        <!-- ======================================
             STATUS
        ======================================= -->

        <section class="classroom-top">


            <div class="classroom-title">
                🎓 Lớp học đang hoạt động
            </div>


            <div id="studentStatus">
                🟡 Đang kết nối...
            </div>


        </section>


        <!-- ======================================
             SCREEN AREA
        ======================================= -->

        <section class="screen-layout">


            <!-- ==================================
                 TEACHER SCREEN

                 Đây là màn hình chính HS nhìn thấy.
            =================================== -->

            <div class="teacher-panel">


                <div class="panel-header">
                    👨‍🏫 Màn hình giáo viên
                </div>


                <div class="teacher-video-box">


                    <video
                        id="teacherVideo"
                        autoplay
                        playsinline
                    ></video>


                    <div id="waitingTeacher">

                        👨‍🏫 Giáo viên chưa chia sẻ màn hình

                    </div>


                </div>


            </div>


            <!-- ==================================
                 STUDENT PREVIEW

                 HS chỉ xem preview màn hình
                 của chính mình.
            =================================== -->



        </section>


    </main>


    <!-- ==========================================
         SOCKET.IO
    =========================================== -->

    <script
        src="/socket.io/socket.io.js"
    ></script>


    <!-- ==========================================
         STUDENT JS
    =========================================== -->

    <script
        src="/js/student.js"
    ></script>


</body>

</html>

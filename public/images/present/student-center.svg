<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><g font-family="Arial, sans-serif"><rect width="1200" height="680" fill="#080f1e"/><rect width="1200" height="68" fill="#0a1323"/><text x="30" y="43" fill="#ff792d" font-size="25" font-weight="800">FPT <tspan fill="white">SCHOOLS</tspan></text><rect x="1040" y="18" width="132" height="33" rx="16" fill="#132b43" stroke="#315174"/><text x="1106" y="40" text-anchor="middle" fill="#bfdbfe" font-size="15">Học sinh</text><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0b1931"/><stop offset="1" stop-color="#152e55"/></linearGradient></defs><rect x="14" y="76" width="1172" height="520" rx="12" fill="url(#g)" stroke="#334155"/><rect x="155" y="270" width="890" height="128" rx="16" fill="#142d50" stroke="#41699a"/><text x="185" y="320" fill="#f1f5f9" font-size="23">Hoàn thành câu 1–5 trong phiếu học tập.</text><text x="185" y="355" fill="#f1f5f9" font-size="23">Thời gian thực hiện: 10 phút.</text><rect x="862" y="307" width="151" height="49" rx="8" fill="#ea670d"/><text x="937" y="338" text-anchor="middle" fill="white" font-size="19">Truy cập ↗</text><rect x="14" y="609" width="1172" height="54" rx="15" fill="#172e56" stroke="#294b79"/><text x="600" y="633" text-anchor="middle" fill="white" font-size="16" font-weight="700">Tập trung học tập</text><text x="600" y="653" text-anchor="middle" fill="#bfd2ec" font-size="12">Hãy theo dõi bài giảng của giáo viên và hoàn thành các hoạt động trên lớp nhé!</text></g></svg>
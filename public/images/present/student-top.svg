<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><g font-family="Arial, sans-serif"><rect width="1200" height="680" fill="#080f1e"/><rect width="1200" height="68" fill="#0a1323"/><text x="30" y="43" fill="#ff792d" font-size="25" font-weight="800">FPT <tspan fill="white">SCHOOLS</tspan></text><rect x="1040" y="18" width="132" height="33" rx="16" fill="#132b43" stroke="#315174"/><text x="1106" y="40" text-anchor="middle" fill="#bfdbfe" font-size="15">Học sinh</text><rect x="14" y="77" width="1172" height="65" rx="10" fill="#14243a" stroke="#37516f"/><text x="34" y="117" fill="#f1f5f9" font-size="20">Hoàn thành câu 1–5 trong phiếu học tập. Thời gian: 10 phút.</text><rect x="1025" y="88" width="141" height="43" rx="8" fill="#ea670d"/><text x="1095" y="116" text-anchor="middle" fill="white" font-size="18">Truy cập ↗</text><rect x="14" y="154" width="1172" height="442" rx="12" fill="#050a13" stroke="#334155"/><rect x="200" y="174" width="800" height="400" rx="8" fill="#e5effb"/><text x="250" y="230" fill="#1662a9" font-size="18">NỘI DUNG BÀI GIẢNG · MINH HỌA</text><text x="250" y="300" fill="#17324b" font-size="42" font-weight="700">Cùng thực hành</text><text x="250" y="350" fill="#17324b" font-size="24">1. Quan sát thao tác mẫu của giáo viên</text><text x="250" y="395" fill="#17324b" font-size="24">2. Mở phiếu và hoàn thành nhiệm vụ</text><text x="250" y="440" fill="#17324b" font-size="24">3. Trao đổi khi cần hỗ trợ</text><rect x="14" y="609" width="1172" height="54" rx="15" fill="#172e56" stroke="#294b79"/><text x="600" y="633" text-anchor="middle" fill="white" font-size="16" font-weight="700">Tập trung học tập</text><text x="600" y="653" text-anchor="middle" fill="#bfd2ec" font-size="12">Hãy theo dõi bài giảng của giáo viên và hoàn thành các hoạt động trên lớp nhé!</text></g></svg>
 {id:'riengtu',emoji:'🔐',title:'Bí mật cần được giữ',short:'Xử lí tình huống',source:'SGK tr. 26–27',tag:'NHIỆM VỤ 03 • KHU VỰC BÍ MẬT',intro:'Có những thông tin không được tự ý xem hoặc chia sẻ. Hãy giúp An, Bình, Minh và Hoa biết cách cư xử đúng.',facts:[

const defaultState=()=>({name:'',completed:[],active:0,step:0,correct:false,picks:[],selectedLeft:null,matches:{},stageDone:false,feedback:null});
let state=defaultState();
try{const raw=JSON.parse(localStorage.getItem(STORAGE)||'null');if(raw&&typeof raw==='object'){
 state.name=typeof raw.name==='string'?raw.name.slice(0,30):'';
 state.completed=Array.isArray(raw.completed)?raw.completed.filter(x=>lessons.some(l=>l.id===x)):[];
 state.active=Number.isInteger(raw.active)&&raw.active>=0&&raw.active<lessons.length?raw.active:0;
 state.step=Number.isInteger(raw.step)&&raw.step>=0?raw.step:0;
 state.matches=raw.matches&&typeof raw.matches==='object'?raw.matches:{};
 }}catch(e){}
if(state.active>0&&!state.completed.includes(lessons[state.active-1].id))state.active=state.completed.length;
if(state.step>(lessons[state.active].questions||[]).length-1&&lessons[state.active].mode!=='match')state.step=0;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({name:state.name,completed:state.completed,active:state.active,step:state.step,matches:state.matches}));}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=()=>Math.round(state.completed.length/lessons.length*100);
const isUnlocked=i=>i===0||state.completed.includes(lessons[i-1].id);

function topbar(){return `<header class="topbar shell"><a class="brand" href="#" data-action="home" aria-label="Về đầu trò chơi"><span class="brand-logo">🛡️</span><span><small>TRÒ CHƠI TỰ HỌC</small><strong>Vệ binh bản quyền</strong></span></a><div class="top-actions">${state.name?`<div class="tiny-pill">🌟 <span>${pct()}</span> điểm sao</div><button class="btn-quiet" type="button" data-action="restart">Làm lại</button>`:`<div class="tiny-pill">📚 TIN HỌC 5 • BÀI 5</div>`}</div></header>`}
function footer(){return `<footer class="foot shell">Nội dung kiến thức được biên soạn theo <strong>SGK Tin học 5 – Kết nối tri thức với cuộc sống, Bài 5: Bản quyền nội dung thông tin, trang 24–28</strong> (NXB Giáo dục Việt Nam).<br>Trò chơi hoạt động ngay trên thiết bị, không cần đăng nhập, không gửi tên hay kết quả đến máy chủ.</footer>`}
function welcome(){return `${topbar()}<main class="shell"><section class="hero"><div class="hero-left"><span class="eyebrow">✨ HÀNH TRÌNH HỌC QUA TRÒ CHƠI</span><h1>TRỞ THÀNH<br><em>VỆ BINH</em><br>BẢN QUYỀN!</h1><p>Lớp 5A đang hoàn thiện báo tường. Em sẽ giúp các bạn tìm tác giả, ghi nguồn đúng, giữ bí mật và ứng xử văn minh trên môi trường số!</p><span class="eyebrow">5 nhiệm vụ · Tự học và nhận phản hồi</span></div><div class="hero-art">${illustration()}</div><span class="accent-cloud cloud-a">✦</span><span class="accent-cloud cloud-b">✧</span></section><section class="start-box"><form id="start-form"><label for="nickname">Nhà thám hiểm muốn được gọi là gì?</label><div class="start-row"><input id="nickname" maxlength="30" autocomplete="nickname" placeholder="Ví dụ: Minh Anh (có thể để trống)" aria-describedby="privacy-note"><button type="submit" class="primary">BẮT ĐẦU CHƠI <span aria-hidden="true">→</span></button></div><small class="subhead" id="privacy-note">Tên gọi chỉ lưu trong trình duyệt trên thiết bị của em, không gửi đi đâu.</small></form></section><div class="feature-list"><div class="feature"><strong>🧠</strong>Đọc – hiểu theo SGK</div><div class="feature"><strong>🎯</strong>Tự chọn và sửa sai</div><div class="feature"><strong>🏅</strong>Nhận huy hiệu cuối game</div></div></main>${footer()}`}
function dashboard(){return `<div class="dashboard"><div class="dash-title">Xin chào, ${esc(state.name)}! <small>Cùng làm biên tập viên 5A nhé ✨</small></div><div class="progress-area"><div class="progress-label"><span>Tiến độ hành trình</span><span>${state.completed.length}/5 nhiệm vụ</span></div><div class="progress-track" role="progressbar" aria-label="Tiến độ trò chơi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct()}"><div class="progress-fill" style="width:${pct()}%"></div></div></div><div class="score">⭐ ${pct()}/100</div></div>`}
function map(){return `<div class="map-head" id="missionMap"><h2>🗺️ Bản đồ nhiệm vụ</h2><p>Hoàn thành lần lượt để mở khóa</p></div><div class="map-scroll"><nav class="map-grid" aria-label="Danh sách nhiệm vụ">${lessons.map((l,i)=>{let done=state.completed.includes(l.id),current=i===state.active;return `<button type="button" class="map-tile ${done?'is-done':''} ${current?'is-current':''}" ${isUnlocked(i)?'':'disabled'} data-action="goto" data-index="${i}" aria-label="Nhiệm vụ ${i+1}: ${esc(l.title)}, ${done?'đã hoàn thành':isUnlocked(i)?'có thể chơi':'chưa mở khóa'}"><span class="tile-icon" aria-hidden="true">${isUnlocked(i)?l.emoji:'🔒'}</span><span class="tile-name">${i+1}. ${esc(l.short)}</span><span class="tile-status">${done?'✓ Đã hoàn thành':current?'● Đang khám phá':isUnlocked(i)?'Sẵn sàng':'Chưa mở khóa'}</span></button>`}).join('')}</nav></div>`}
function lessonPanel(l){return `<aside class="card lesson-panel"><div class="lesson-top"><div class="lesson-kicker">${l.emoji} ${esc(l.tag)}</div><h2>${esc(l.title)}</h2><p>${esc(l.intro)}</p></div><div class="lesson-body"><div class="fact-heading">📖 Góc tự khám phá kiến thức</div>${l.facts.map((s,i)=>`<div class="fact-item"><span class="fact-index">${i+1}</span><div>${s}</div></div>`).join('')}<div class="important">💡 Đọc các kiến thức này, rồi vận dụng ngay ở phần thử thách bên cạnh.</div><div class="mini-source">📚 ${esc(l.source)}. ${esc(l.note)}</div></div></aside>`}
function dots(total){let d=state.step;return `<div class="step-dots" aria-hidden="true">${Array.from({length:total},(_,i)=>`<i class="${i<d?'finished':i===d?'active':''}"></i>`).join('')}</div>`}
function feedback(){if(!state.feedback)return '';let f=state.feedback;return `<div class="feedback ${f.good?'':'bad'}" role="status" aria-live="polite"><strong>${f.good?'✅ Chính xác!':'💡 Em hãy thử lại nhé!'}</strong>${esc(f.text)}</div>`}
function renderQuiz(l){const q=l.questions[state.step];if(!q)return '';const multi=Array.isArray(q.answers),judge=l.mode==='judgment';const answers=judge?['🙅 Không đồng tình','👍 Đồng tình']:q.options;return `<div class="challenge-head"><strong>🎯 THỬ THÁCH CỦA EM</strong><span class="step-count">Câu ${state.step+1}/${l.questions.length}</span></div>${dots(l.questions.length)}<span class="case-tag">${esc(q.tag)}</span><h3>${esc(q.text)}</h3><p class="challenge-desc">${multi?'Chọn tất cả đáp án đúng (có 2 đáp án), sau đó nhấn “Kiểm tra”.':judge?'Em sẽ đồng tình hay không đồng tình với hành động này?':'Chọn một đáp án em cho là đúng nhất.'}</p><div class="answer-list ${judge?'yesno-grid':''}" role="group" aria-label="Các phương án trả lời">${answers.map((a,i)=>{const isChosen=state.picks.includes(i),isCorrect=state.correct&&(multi?q.answers.includes(i):(judge?q.answer===i:q.answer===i));return `<button type="button" class="answer ${isChosen?'selected':''} ${isCorrect?'correct':''}" data-action="pick" data-index="${i}" ${state.correct?'disabled':''} aria-pressed="${isChosen}" aria-label="${esc(a)}"><span class="letter" aria-hidden="true">${judge?(i?'👍':'🙅'):multi?(isChosen?'✓':'□'):String.fromCharCode(65+i)}</span><span>${esc(a)}</span></button>`}).join('')}</div>${feedback()}<div class="challenge-bottom">${state.correct?`<button class="primary" type="button" data-action="advance">${state.step===l.questions.length-1?'Nhận huy hiệu':'Câu tiếp theo'} <span aria-hidden="true">→</span></button>`:multi?`<button class="primary" type="button" data-action="check-multi" ${state.picks.length?'':'disabled'}>Kiểm tra câu trả lời ✓</button>`:`<span class="hint-text">${state.feedback?'Hãy chọn lại một đáp án khác nhé.':'Trả lời đúng để mở câu tiếp theo.'}</span>`}</div>`}
function renderMatch(l){const selected=state.selectedLeft;const matches=state.matches||{};const done=Object.keys(matches).filter(k=>k==='0'||k==='1'||k==='2').length===3;return `<div class="challenge-head"><strong>🧩 XẾP ĐÚNG TƯ LIỆU</strong><span class="step-count">${Object.keys(matches).length}/3 cặp</span></div><div class="step-dots" aria-hidden="true">${[0,1,2].map(i=>`<i class="${Object.prototype.hasOwnProperty.call(matches,i)?'finished':'active'}"></i>`).join('')}</div><span class="case-tag">THỬ THÁCH GHÉP ĐÔI</span><h3>Em ghép nhãn nguồn nào cho mỗi tư liệu?</h3><p class="challenge-desc">Chạm vào một tư liệu ở cột trái, sau đó chạm vào cách ghi nguồn phù hợp ở cột phải.</p><div class="match-layout"><div><div class="match-label">📄 Tư liệu</div><div class="match-col">${l.left.map((a,i)=>{let paired=Object.prototype.hasOwnProperty.call(matches,i);return `<button type="button" class="match-tile ${selected===i?'is-picked':''} ${paired?'is-paired':''}" data-action="match-left" data-index="${i}" ${paired?'disabled':''}><span class="match-num ${paired?'correct-num':''}">${paired?'✓ ĐÃ GHÉP':`TƯ LIỆU ${i+1}`}</span>${esc(a)}</button>`}).join('')}</div></div><div><div class="match-label">🏷️ Ghi nguồn</div><div class="match-col right">${l.right.map((a,i)=>{let used=Object.values(matches).includes(i);return `<button type="button" class="match-tile ${used?'is-paired':''}" data-action="match-right" data-index="${i}" ${used?'disabled':''}><span class="match-num ${used?'correct-num':''}">${used?'✓ ĐÃ GHÉP':'NHÃN NGUỒN'}</span>${esc(a)}</button>`}).join('')}</div></div></div>${feedback()}${done?`<div class="challenge-bottom"><button class="primary" type="button" data-action="complete-match">Nhận huy hiệu ✨ →</button></div>`:`<div class="match-hint">${selected===null?'Bước 1: Chạm chọn một tư liệu ở cột trái.':'Bước 2: Chọn nhãn ở cột phải phù hợp với tư liệu đang chọn.'}</div>`}`}
function stageWin(l){let i=lessons.indexOf(l);const msg=['Em đã phân biệt được tác giả và hiểu quyền cho phép sử dụng nội dung.','Em đã biết ghi đúng nguồn cho ảnh, bài thơ và truyện kể lại.','Em đã biết bảo vệ riêng tư và nội dung của mình, của bạn.','Em đã thể hiện được thái độ đúng trước hành vi vi phạm.','Em đã biết vận dụng kiến thức vào bài trình chiếu của lớp.'][i];return `<section class="card stage-win"><div class="badge-big" aria-hidden="true">${l.emoji}</div><span class="case-tag">NHIỆM VỤ ${i+1} HOÀN THÀNH</span><h2>Tuyệt vời, ${esc(state.name)}!</h2><p>${msg}</p><div class="win-reward">⭐ +20 điểm sao · ${state.completed.length}/5 huy hiệu</div><div class="win-buttons"><button class="btn-quiet" type="button" data-action="goto" data-index="${i}">Ôn lại nhiệm vụ</button><button class="primary" type="button" data-action="next-stage">${i===4?'Xem chứng nhận':'Mở nhiệm vụ tiếp theo'} →</button></div></section>`}
function game(){const l=lessons[state.active];let challenge=state.stageDone?stageWin(l):`<section class="card challenge" aria-label="Phần tương tác">${l.mode==='match'?renderMatch(l):renderQuiz(l)}</section>`;return `${topbar()}<main class="shell">${dashboard()}${map()}<section class="lesson-wrap" id="play-area">${lessonPanel(l)}${challenge}</section><div class="subhead" style="text-align:center;margin:10px 0 25px">💜 Được sai và được thử lại. Mỗi câu trả lời là một cơ hội để em học thêm!</div></main>${footer()}`}
function endScreen(){return `${topbar()}<main class="shell">${dashboard()}<section class="final-wrap" id="certificate"><div class="final-banner"><span class="huge" aria-hidden="true">🎉🏆🎉</span><h1>HOÀN THÀNH XUẤT SẮC!</h1><p>Em đã bảo vệ thành công bản quyền cho tờ báo tường lớp 5A!</p></div><div class="certificate"><div class="cert-kicker">GIẤY CHỨNG NHẬN · TIN HỌC 5</div><h2>🛡️ VỆ BINH BẢN QUYỀN</h2><p>Trao tặng nhà thám hiểm</p><div class="cert-name">${esc(state.name)}</div><p>Đã hoàn thành 5 nhiệm vụ tự học<br><b>Bài 5: Bản quyền nội dung thông tin</b></p><div class="cert-stamp">🌟 🌟 🌟 🌟 🌟</div><p><b>100 điểm sao · 5 huy hiệu</b></p></div><div class="final-recap"><h3>📌 4 điều em đã học được</h3><div class="recap-grid"><div class="recap-item">✅ Chỉ sử dụng nội dung của người khác khi được phép.</div><div class="recap-item">✅ Ghi rõ tên tác giả hoặc nguồn thông tin phù hợp.</div><div class="recap-item">✅ Tôn trọng thông tin riêng tư của người khác.</div><div class="recap-item">✅ Không đồng tình với việc xem trộm, sao chép khi chưa được đồng ý.</div></div></div><div class="final-actions"><button type="button" class="primary" data-action="copy-result">📋 Sao chép kết quả</button><button type="button" class="btn-quiet" data-action="print">🖨️ In chứng nhận</button><button type="button" class="btn-quiet" data-action="revisit">🔁 Ôn lại 5 nhiệm vụ</button></div><div id="copy-fallback" class="hidden copy-area"></div></section></main>${footer()}`}
function render(){const app=document.getElementById('app');app.innerHTML=!state.name?welcome():state.completed.length===lessons.length&&!state.stageDone?endScreen():game();}
function notify(text){const prev=document.querySelector('.toast');if(prev)prev.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;document.body.appendChild(t);setTimeout(()=>{if(t.parentNode)t.remove()},2800)}
function choose(i){const l=lessons[state.active];if(l.mode==='match'||state.correct)return;const q=l.questions[state.step];if(!q)return;if(q.answers){state.feedback=null;state.picks=state.picks.includes(i)?state.picks.filter(x=>x!==i):[...state.picks,i];render();return;}state.picks=[i];if(i===q.answer){state.correct=true;state.feedback={good:true,text:q.why};}else{state.feedback={good:false,text:q.hint||'Hãy suy nghĩ lại từ phần kiến thức và thử chọn đáp án khác.'};}render();}
function checkMulti(){const l=lessons[state.active],q=l.questions[state.step];if(!q.answers||state.correct)return;const correct=state.picks.length===q.answers.length&&state.picks.every(x=>q.answers.includes(x));if(correct){state.correct=true;state.feedback={good:true,text:q.why}}else{state.feedback={good:false,text:q.hint||'Em chưa chọn đủ đáp án đúng. Hãy xem lại kiến thức.'}}render()}
function advance(){if(!state.correct)return;const l=lessons[state.active];state.step++;state.correct=false;state.picks=[];state.feedback=null;save();if(state.step>=l.questions.length){completeStage()}else{render();focusChallenge()}}
function completeStage(){const id=lessons[state.active].id;if(!state.completed.includes(id))state.completed.push(id);state.stageDone=true;state.feedback=null;state.picks=[];state.selectedLeft=null;state.step=0;save();render();focusChallenge();}
function selectLeft(i){if(state.stageDone)return;const m=state.matches;if(Object.prototype.hasOwnProperty.call(m,i))return;state.selectedLeft=i;state.feedback=null;render()}
function selectRight(i){if(state.selectedLeft===null){notify('Em hãy chọn một tư liệu ở cột trái trước nhé!');return;}if(Object.values(state.matches).includes(i))return;const l=lessons[state.active],left=state.selectedLeft;if(l.answer[left]===i){state.matches[left]=i;state.feedback={good:true,text:l.explain[left]};state.selectedLeft=null;save();render()}else{state.feedback={good:false,text:'Nhãn này chưa phù hợp với tư liệu em chọn. Em hãy đối chiếu cách ghi nguồn ở phần kiến thức và chọn lại.'};render()}}
function nextStage(){if(state.active===lessons.length-1){state.stageDone=false;save();render();window.scrollTo({top:0,behavior:'smooth'});return;}state.active++;state.step=0;state.correct=false;state.matches={};state.stageDone=false;state.feedback=null;state.picks=[];state.selectedLeft=null;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function goto(i){if(!Number.isInteger(i)||!isUnlocked(i))return;state.active=i;state.step=0;state.correct=false;state.matches={};state.stageDone=false;state.feedback=null;state.picks=[];state.selectedLeft=null;save();render();focusChallenge()}
function focusChallenge(){const elem=document.getElementById('play-area');if(elem)elem.scrollIntoView({behavior:'smooth',block:'start'});}
function summary(){return `${state.name} đã hoàn thành trò chơi “Vệ binh bản quyền” – Tin học 5, Bài 5: Bản quyền nội dung thông tin (SGK Kết nối tri thức, tr. 24–28).\nKết quả: 5/5 nhiệm vụ, 100/100 điểm sao.\nEm đã học cách xin phép khi sử dụng thông tin, ghi nguồn, tôn trọng quyền riêng tư và không đồng tình với việc sao chép, xem trộm khi chưa được đồng ý.`}
async function copyResult(){const s=summary();try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(s);notify('Đã sao chép kết quả! Em có thể dán vào Zalo.');return}}catch(e){}const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();if(ok){notify('Đã sao chép kết quả!')}else{const box=document.getElementById('copy-fallback');box.classList.remove('hidden');box.textContent=s;notify('Hãy chọn và sao chép phần kết quả hiện bên dưới.')}}
function resetAll(){if(!window.confirm('Em muốn xóa tiến độ và chơi lại từ đầu chứ?'))return;state=defaultState();try{localStorage.removeItem(STORAGE)}catch(e){}render();window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='start-form'){e.preventDefault();let field=document.getElementById('nickname');state.name=(field?.value||'').trim().replace(/\s+/g,' ').slice(0,30)||'Bạn học sinh';save();render();window.scrollTo({top:0,behavior:'smooth'})}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;const i=Number(b.dataset.index);if(action==='home'){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})}else if(action==='restart')resetAll();else if(action==='goto')goto(i);else if(action==='pick')choose(i);else if(action==='check-multi')checkMulti();else if(action==='advance')advance();else if(action==='match-left')selectLeft(i);else if(action==='match-right')selectRight(i);else if(action==='complete-match'){if(Object.keys(state.matches).length===3)completeStage()}else if(action==='next-stage')nextStage();else if(action==='copy-result')copyResult();else if(action==='print')window.print();else if(action==='revisit')goto(0)});
render();
})();
</script>
</body>
</html>

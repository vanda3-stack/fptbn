<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07162a">
<meta name="description" content="CodeQuest Tin học 9. Vượt thử thách để nhận chứng nhận hoàn thành bài.">
<title>Bài 13B · Biên tập và xuất video | Tin học 9</title>
<style>:root {
  color-scheme: dark;
  --ink: #f2f8ff;
  --muted: #b4cbe0;
  --paper: #07162a;
  --panel: #132c47;
  --card: #17314d;
  --line: #46617c;
  --gold: #ffdb83;
  --accent: #64ecc9;
  --teal-ink: #102c32;
  --input: #0a2940;
}
*, *::before, *::after { box-sizing: border-box }
body {
  margin: 0;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% -20%, #284b79, #091c35 53%, #071424);
  font: 1rem/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1, h2, h3, h4, p { margin: 0 }
h1 { font-size: clamp(2rem, 5vw, 3.56rem); line-height: 1.09 }
h1 em { color: var(--accent); font-style: normal }
h2 { font-size: clamp(1.4rem, 3vw, 2.2rem); line-height: 1.2 }
h3 { font-size: 1.16rem; line-height: 1.4 }
p { max-width: 67ch }
a, button, input, textarea, select { color: inherit }
button, input, textarea, select { font: inherit }
button:not(:disabled), summary { cursor: pointer }
button:disabled { opacity: .58 }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px }
h1[tabindex="-1"]:focus-visible { outline: none }
[hidden] { display: none !important }
.muted, .tiny { color: var(--muted) }
.tiny { font-size: .86rem }
.sr-only, .skip:not(:focus) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap }
.skip:focus { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 10px 14px; background: var(--paper) }

.header-inner, main, .site-footer > div { max-width: 1130px; margin-inline: auto; padding-inline: clamp(14px, 4vw, 40px) }
.header-inner { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 15px; border-bottom: 1px solid #334b66 }
.brand { display: grid; gap: .1rem }
main { min-height: 65vh; padding-block: 20px 42px }
.site-footer { border-top: 1px solid var(--line) }
.site-footer > div { display: flex; justify-content: space-between; gap: 12px; padding-block: 16px; color: var(--muted); font-size: .82rem }
.eyebrow { color: var(--accent); font-size: .7rem; font-weight: 900; letter-spacing: .12rem; text-transform: uppercase }
.text-link, .nav-link { color: var(--accent); text-underline-offset: .2em }

.hero { position: relative; background: linear-gradient(115deg,#1e446e,#0f2948); border: 1px solid #42668d; border-radius: 25px; overflow: hidden }
.hero-copy { position: relative; z-index: 1; padding: clamp(22px, 4vw, 42px); display: grid; justify-items: start; gap: .85rem }
.hero-desc { color: #d4e6f5; max-width: 60ch }
.hero-actions, .tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem }
.btn, .chip { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 46px; padding: .6rem .9rem; border: 1px solid var(--line); border-radius: 13px; background: var(--card); font-size: .92rem; font-weight: 750; line-height: 1.3; text-align: center; text-decoration: none; overflow-wrap: anywhere }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--teal-ink); font-weight: 800 }
.btn.primary:hover:not(:disabled) { background: #a7f0de }
.btn.subtle:hover:not(:disabled), .btn.outline:hover, .chip:hover:not(:disabled) { background: #284c65; border-color: var(--accent) }
.btn.text-btn { border-color: transparent; background: transparent; color: var(--accent); text-decoration: underline; text-underline-offset: .2em; padding-inline: 0 }
.selected:not(.pixel-cell), .answer-choice:has(:checked) { border-color: var(--accent); background: #166b58 }
.badge, .mechanic { display: inline-block; padding: .18rem .5rem; border-radius: 7px; background: #2c4e69; font-size: .82rem }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 1.8rem 0 .8rem }
.section-head .muted { max-width: 40ch }
.signal-band { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-block: 1rem }
.signal-stat, .stat-tile { display: grid; padding: .65rem .85rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px }
.signal-stat strong, .stat-tile strong { color: var(--gold); font-size: 1.15rem }
.signal-stat span, .stat-tile small { color: var(--muted); font-size: .84rem }
.filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 1rem }
.course-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.course-card { display: flex; flex-direction: column; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; text-decoration: none }
.course-card:hover { border-color: var(--accent) }
.card-visual { display: flex; justify-content: space-between; align-items: center; padding: .6rem .8rem; background: var(--card-tint); color: var(--paper) }
.card-icon { font-size: 2rem }
.card-no { font-size: .8rem; font-weight: 850 }
.card-copy { flex: 1; padding: .8rem }
.card-copy p, .card-group, .card-progress { color: var(--muted); font-size: .84rem }
.mechanic { margin-top: .45rem }
.card-track { padding: 0 .8rem .8rem }
.card-progress { display: flex; justify-content: space-between; margin-top: .35rem }
.meter { height: 7px; overflow: hidden; border-radius: 8px; background: #365570 }
.meter > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#55e9c7,#ffda81) }

.stage-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0 0 1rem }
.stage-row { display: grid; align-content: start; border-radius: 17px; overflow-wrap: anywhere }
.stage-row.done .room-button { border-color: var(--accent) }
.stage-row.locked .room-button { opacity: .68 }
.side-card { display: grid; gap: .45rem; padding: 1rem; border: 1px solid var(--line); border-radius: 15px; background: var(--panel) }
.side-card > .btn { justify-self: start }
.side-card h2 { font-size: 1.4rem }

.lesson-panel { max-width: 900px; margin-inline: auto; padding: clamp(16px, 4vw, 36px); background: var(--panel); border: 1px solid var(--line); border-radius: 22px }
.view-heading { display: grid; gap: .4rem; margin-bottom: 1rem }
.view-heading > .btn { justify-self: start }
.view-heading h1, .celebration h1 { font-size: clamp(1.55rem, 5vw, 2.45rem); line-height: 1.2 }
.review-stack, .question-card { display: grid; gap: .75rem }
.progress-dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px }
.progress-dots span { height: 8px; background: #365570; border-radius: 8px }
.progress-dots .done { background: var(--accent) }
.progress-dots .current { background: var(--gold) }
.study, .question-card, .lab-stage, .review-item { min-width: 0; padding: clamp(14px, 3vw, 25px); background: var(--card); border: 1px solid var(--line); border-radius: 17px }
.study { display: grid; align-content: start; gap: .85rem; background: #23415c; border-color: #7893aa; scroll-margin-top: 1rem }
.study h2 { color: var(--gold); font-size: 1.3rem }
.study-points { display: grid; gap: .65rem; margin: 0; padding-left: 1.3rem; color: #e0ebf8 }
.study-points li::marker { color: var(--accent) }
.study-example { display: grid; gap: .25rem; padding: .7rem .85rem; background: #152e46; border-left: 3px solid var(--accent); border-radius: 8px }
.study-example strong { color: var(--accent) }
.study-source { color: var(--muted); font-size: .8rem }

.play-panel { max-width: 1130px; padding: clamp(14px, 3vw, 28px) }
.play-panel .view-heading { grid-template-columns: minmax(0, 1fr) auto; column-gap: 1rem }
.play-panel .view-heading > .btn { grid-column: 2; grid-row: 1 / span 3; align-self: start }
.play-panel .view-heading > :not(.btn) { grid-column: 1 }
.play-panel .progress-dots { margin-bottom: 1rem }
.play-grid { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); align-items: start; gap: 1rem }
.play-grid.study-only { grid-template-columns: 1fr }
.study-wait { color: var(--muted); font-size: .9rem }
.study-meter { height: 6px; margin-top: .55rem; overflow: hidden; background: #152e46; border-radius: 8px }
.study-meter-fill { display: block; height: 100%; background: var(--accent); transform-origin: left; animation: study-read var(--study-time) linear both }
@keyframes study-read { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@media (prefers-reduced-motion: reduce) {
  .study-meter { display: none }
}
.play-panel .answer-options { grid-template-columns: 1fr }
.play-panel .question-card { scroll-margin-top: 1rem }
.play-panel .study-jump { display: none }
@media (max-width: 760px) {
  .play-grid { grid-template-columns: 1fr }
  .play-panel .study-jump:not([hidden]) { display: inline-flex; margin-bottom: .45rem }
}
@media (max-width: 420px) {
  .play-panel .view-heading { display: flex; flex-direction: column; align-items: flex-start }
}
.question-card h2 { font-size: 1.35rem; overflow-wrap: anywhere }
.answer-area, .answer-options { display: grid; gap: .65rem }
.answer-options { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0; margin: 0; border: 0; min-width: 0 }
.answer-choice { min-height: 58px; display: flex; align-items: flex-start; gap: .65rem; padding: .7rem; border-radius: 13px; border: 1px solid var(--line); background: #244460; overflow-wrap: anywhere; cursor: pointer }
.answer-choice:hover { border-color: var(--accent) }
.answer-choice input, .rubric-item input { width: 1.15rem; height: 1.15rem; flex-shrink: 0; accent-color: var(--accent) }
.letter { flex: 0 0 1.6rem; text-align: center; border-radius: 7px; background: #395d76; font-weight: 800 }
.result-card, .notice, .lab-feedback { padding: .75rem 1rem; border: 1px solid var(--line); border-radius: 13px; background: var(--card); overflow-wrap: anywhere }
.result-card p { margin-top: .3rem }
.warning, .notice { background: #4c3e27; color: #ffebc5; border-color: #9d8864 }
.success { background: #24574f; border-color: #79c6b3 }
.rubric-item { display: flex; align-items: flex-start; gap: .55rem; margin-block: .4rem }
.practice-rubric { padding: .75rem; background: var(--panel); border-radius: 10px }
.review-item summary { font-weight: 800 }
.review-item p, .review-item .table-wrap { margin-top: .6rem }
.celebration { text-align: center; border-color: #bd9f64; padding-block: clamp(26px, 6vw, 58px) }
.celebration p { margin: .75rem auto }
.celebration .tool-row { justify-content: center }
.award { display: grid; place-items: center; margin: 0 auto 1rem; width: 105px; aspect-ratio: 1; border-radius: 50%; background: #f6ce77; border: 3px solid #ffe7a8; font-size: 3.3rem; animation: award-in .35s ease-out }
@keyframes award-in { from { transform: scale(.8); opacity: .4 } }

.field { min-width: 0; display: grid; gap: .35rem }
.field-label { color: var(--muted); font-size: .86rem; font-weight: 800 }
.field input, .field textarea, .field select, .edit-table input { width: 100%; max-width: 100%; min-height: 44px; padding: .45rem .65rem; border: 1px solid var(--line); border-radius: 9px; background: var(--input); color: var(--ink) }
.field textarea { resize: vertical }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.table-wrap { max-width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: 9px }
.data-table { border-collapse: collapse; width: 100%; font-size: .9rem }
.data-table th, .data-table td { padding: .4rem .6rem; border-bottom: 1px solid var(--line); text-align: left }
.data-table th { background: var(--input) }
.data-table tr:last-child td { border-bottom: 0 }

.lab-shell{display:grid;gap:12px}
.lab-tabs{display:flex;flex-wrap:wrap;gap:8px}
.lab-tabs .chip{padding:8px 13px}
.lab-stage{border-top:5px solid var(--accent);max-width:900px}
.lab-stage h3{font-size:clamp(1.25rem,3vw,1.75rem);line-height:1.15}
.lab-instruction{color:var(--muted);margin:7px 0 14px;max-width:66ch}
.lab-play{display:grid;gap:12px}
.lab-play>.btn{justify-self:start}
.lab-feedback{margin-top:13px}
.readout{padding:8px 11px;background:var(--input);border-radius:7px;font:.83rem ui-monospace,monospace;color:var(--ink);overflow-wrap:anywhere}
.sort-board,.network-board,.mind-branches,.safety-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:8px}
.sort-bin{display:grid;gap:5px;border:1px dashed var(--line);border-top:4px solid var(--accent);border-radius:9px;background:var(--input);padding:10px}
.sort-bin ul{margin:0;padding-left:16px;font-size:.8rem}
.flow-track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.flow-track span{display:grid;place-items:center;text-align:center;min-height:45px;border:1px dashed var(--line);background:var(--input);border-radius:7px;font-size:.76rem;font-weight:790}
.flow-track .filled{background:#285267;border-style:solid;border-color:var(--accent)}
.ordered-tray{min-height:38px;display:grid;gap:5px;margin:0;padding-left:26px}
.ordered-tray li{padding:6px 8px;background:var(--input);border:1px solid var(--line);border-radius:6px}
.ordered-tray li::marker{font-weight:850;color:var(--accent)}
.ordered-tray .empty-slot{border-style:dashed;color:var(--muted)}

.pixel-pair{display:flex;gap:18px;flex-wrap:wrap}
.pixel-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(36px,48px));gap:4px;margin-top:5px}
.pixel-cell{height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:#f4f8ff;font:700 1rem ui-monospace,monospace;color:var(--teal-ink)}
.pixel-cell.selected{background:#272247;color:#fff;border-color:#272247}
.device,.safety-action,.result-title{border:1px solid var(--line);border-radius:9px;background:var(--input);padding:9px;min-height:47px;font-size:.86rem;font-weight:750;overflow-wrap:anywhere}
.device{min-height:66px;background:var(--input)}
.wire-list{margin:0;padding:9px 12px 9px 28px;border-radius:8px;border:1px solid var(--line);background:var(--input)}
.dispatch,.search-results,.binder-stack{display:grid;gap:8px}
.dispatch-row{display:grid;grid-template-columns:88px 1fr;gap:9px;align-items:center;background:var(--input);border-radius:8px;border:1px solid var(--line);padding:8px}
.signal{font:800 .69rem ui-monospace,monospace;color:var(--accent);overflow-wrap:anywhere}
.mock-browser,.mock-mail{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.browser-bar,.search-bar{display:flex;align-items:end;flex-wrap:wrap;gap:7px;padding:8px;background:var(--input)}
.browser-bar .field,.search-bar .field{flex:1;min-width:min(145px,100%)}
.mock-page,.composer{padding:12px;display:grid;gap:8px}
.mock-page h4{font-size:1.22rem}
.mock-page .btn{justify-self:start}
.mock-link{color:var(--accent);text-decoration:underline;border-color:var(--line)}
.search-bar{border-radius:9px}
.search-result{display:grid;gap:4px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--input)}
.search-result button{text-align:left}
.search-result small{padding-left:5px}
.window-bar{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:9px;background:#285267;color:var(--ink)}
.incident{display:grid;gap:5px;padding:11px;border-radius:9px;background:#4c3e27;border:1px solid #9d8864}
.incident .badge{justify-self:start}
.safety-actions{grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))}
.mind-tree{background:var(--input);border:1px solid var(--line);border-radius:9px;padding:10px}
.mind-root{background:var(--accent);color:var(--teal-ink);padding:7px 13px;border-radius:8px;text-align:center;font-weight:820;max-width:330px;margin:0 auto 12px}
.mind-branch{border-top:3px solid var(--accent);background:var(--panel);border-radius:6px;padding:7px}
.mind-branch ul{padding-left:15px;margin:4px 0;font-size:.8rem}
.paper{color:#17241f;max-width:410px;min-height:174px;margin-inline:auto;background:white;box-shadow:0 7px 24px #1e292821;border:1px solid var(--line);padding:9px var(--paper-margin,10%) 14px;width:100%}
.paper.landscape{max-width:630px;min-height:123px}
.paper.preview{outline:2px solid var(--accent);outline-offset:3px}
.paper h4{font-size:1.18rem;margin-bottom:7px}
.paper-watermark{font-size:.64rem;letter-spacing:.13em;color:#52615b;margin-bottom:9px}
.edit-table input{min-width:58px;min-height:35px;padding:4px}
.edit-table th,.edit-table td{padding:5px}
.draft-text{color:#17241f;padding:13px;border:1px solid var(--line);border-radius:8px;background:#f8edcf;min-height:62px;font-family:Georgia,serif;font-size:1.08rem}
.draft-text mark{background:#ffce63;padding:2px}
.binder-shelf{display:flex;gap:6px;flex-wrap:wrap}
.binder-page{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:8px;background:var(--input)}
.page-number{display:grid;place-items:center;width:24px;height:26px;background:#285267;font-size:.78rem;font-weight:850;border-radius:4px}
.robot-map{display:grid;gap:7px}
.robot-track{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.track-cell{display:grid;place-items:center;min-height:43px;border:1px solid var(--line);border-radius:6px;background:var(--input);font-size:1.03rem}
.track-cell.target{border-color:var(--accent);background:#285267}
.scratch-stage{display:flex;gap:13px;align-items:center;min-height:91px;border-radius:10px;border:1px solid var(--line);background:repeating-linear-gradient(0deg,var(--input) 0 17px,var(--card) 18px 19px);padding:8px}
.scratch-cat{font-size:2.55rem}
.speech{color:#17241f;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:.9rem}
.scratch-script{display:grid;gap:4px;max-width:640px}
.scratch-hat,.scratch-block{border-radius:9px;padding:6px 9px}
.scratch-hat{background:#f2c65a;color:#402d0c;font-weight:820}
.scratch-block .field-label{color:#17241f}
.scratch-block.sb0{background:#9ed5f1}
.scratch-block.sb1{background:#ffc895}
.scratch-block.sb2{background:#e1c4ff}
@media (max-width: 850px) {
  .stage-list { grid-template-columns: repeat(3, minmax(0,1fr)) }
  .course-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 600px) {
  .answer-options, .form-grid { grid-template-columns: 1fr }
  .header-inner { align-items: flex-start; flex-direction: column; padding-block: 12px }
  .stage-list { grid-template-columns: repeat(2, minmax(0,1fr)) }
  .room-button { min-height: 138px }
  .site-footer > div, .section-head { flex-direction: column; align-items: flex-start }
  .signal-band { grid-template-columns: repeat(2, 1fr) }
  .binder-page { grid-template-columns: auto 1fr }
  .binder-page .tool-row { grid-column: 2 }
}
@media (max-width: 355px) {
  .brand { font-size: .85rem }
  .course-grid { grid-template-columns: 1fr }
  .dispatch-row { grid-template-columns: 1fr }
  .flow-track { grid-template-columns: repeat(2, 1fr) }
}
@media (prefers-reduced-motion: reduce) {
  .award { animation: none }
}

.logo { font-size: 1.45rem; font-weight: 950; letter-spacing: .025em; line-height: 1.2 }
.logo em { color: var(--accent); font-style: normal }
.brand-subtitle { color: var(--muted); font-size: .75rem }
.header-stats { display: flex; gap: .5rem; flex-wrap: wrap }
.stat-pill { padding: .42rem .7rem; border: 1px solid #466783; border-radius: 20px; background: #1a3857; font-size: .8rem; white-space: nowrap }
.hero-watermark { position: absolute; right: 6%; top: 0; font-size: clamp(5rem, 15vw, 10rem); opacity: .16; pointer-events: none }
.room-button {
  position: relative;
  display: grid;
  align-content: start;
  gap: .4rem;
  width: 100%;
  min-height: 158px;
  padding: 15px 12px;
  border: 1px solid #466785;
  border-radius: 17px;
  background: linear-gradient(140deg,#204365,#122740);
  text-align: left;
  overflow-wrap: anywhere;
}
.room-button:not(:disabled):hover { border-color: var(--accent) }
.room-button small { color: var(--muted) }
.room-icon { font-size: 2.35rem; line-height: 1.15 }
.room-seal { position: absolute; right: 10px; top: 8px; color: var(--gold) }
.stage-row > .btn { justify-self: start; margin-inline: .65rem }
.question-kind { font-size: .8rem; color: var(--gold); font-weight: 800 }
.lab-next { margin-top: 1rem }
.final-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1rem }
.certificate-view > .btn { margin-bottom: 1rem }
.certificate-card {
  display: grid;
  justify-items: center;
  gap: .8rem;
  padding: clamp(1rem, 5vw, 3rem);
  border: 5px double #c29a4c;
  border-radius: 15px;
  background: #fff8e7;
  color: #142a43;
  text-align: center;
}
.certificate-card .eyebrow { color: #1d6358 }
.certificate-card h1 { font-size: clamp(1.5rem, 4vw, 2.4rem) }
.certificate-icon { font-size: 3rem; line-height: 1 }
.certificate-recipient { color: #155344; font-weight: 850; font-size: 1.4rem; overflow-wrap: anywhere }
.certificate-recipient:empty { display: none }
.certificate-date { color: #41546b }

<script>
'use strict';
const BANK={"18":{"n":18,"code":"13b","title":"Biên tập và xuất video","pages":"73–75","stages":[{"goal":"Phân biệt chỉnh chữ, cài đặt xuất và xem tệp xuất.","study":{"points":["Chữ trong video có thể giới thiệu tên, cung cấp lời chú thích hoặc ghi công. Chữ cần đủ rõ, đủ lâu để đọc và không che thông tin quan trọng.","Biên tập là chỉnh bản dựng. Xuất video là tạo tệp để trình phát mở. Tệp xuất chỉ có các chỉnh sửa đã được đưa vào ở thời điểm xuất.","Sau khi xuất, dùng trình phát để kiểm đầu, cuối, tiếng và thời điểm chữ xuất hiện."],"example":"Trước khi giới thiệu người nói, nhóm đặt tên ở vùng trống trong khung hình. Sau khi xuất, nhóm mở video và đọc thử tên ở tốc độ phát bình thường."},"tasks":[{"id":"T9-B13B-C01","prompt":"Mục nào tương ứng với mô tả “Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất”?","type":"choice","choices":["Biên tập","Kiểm tra tệp xuất","Cả ba mục đều có cùng vai trò.","Định dạng xuất"],"correct":[0],"why":"Biên tập: Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất."},{"id":"T9-B13B-C02","prompt":"Mục nào có đặc điểm “Loại tệp dùng để phát hoặc chia sẻ”?","type":"choice","choices":["Định dạng xuất","Kiểm tra tệp xuất","Biên tập","Cả ba mục đều có đặc điểm này."],"correct":[0],"why":"Định dạng xuất: Loại tệp dùng để phát hoặc chia sẻ."},{"id":"T9-B13B-C03","prompt":"Chọn mô tả đúng cho “Kiểm tra tệp xuất”.","type":"choice","choices":["Phát tệp đã xuất để xác nhận hình và tiếng","Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất","Loại tệp dùng để phát hoặc chia sẻ","Ba mô tả đều đúng."],"correct":[0],"why":"Kiểm tra tệp xuất: Phát tệp đã xuất để xác nhận hình và tiếng."},{"id":"T9-B13B-C04","prompt":"Chọn hai việc nên rà trên tệp xuất.","type":"multi","choices":["Video phát có tiếng đúng","Chữ hiện rõ và đúng lúc","Tên màu giao diện dựng","Số lần bấm chuột"],"correct":[0,1],"why":"Tệp giao phải đúng nội dung và phát được."},{"id":"T9-B13B-C05","prompt":"Bạn gán mô tả “Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất” cho “Kiểm tra tệp xuất”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Biên tập”.","Mô tả đúng cho cả ba mục.","Gán đúng cho “Kiểm tra tệp xuất”.","Gán nhầm. Mô tả này thuộc “Định dạng xuất”."],"correct":[0],"why":"Mô tả thuộc mục “Biên tập”."}]},{"goal":"Giải thích mức chất lượng, kích thước và khả năng phát.","study":{"points":["Kiểm tra định dạng, dung lượng tối đa và mức chất lượng mà nơi nhận yêu cầu. Chọn thông số theo thiết bị hoặc kênh chia sẻ.","Độ phân giải cao có thể làm tệp lớn hơn nếu các thông số khác tương đương. Xuất bản nhẹ cần xem lại xem chữ và chi tiết còn rõ không.","Đổi phần đuôi tên tệp không chuyển được định dạng. Dùng chức năng xuất để tạo đúng loại tệp video."],"example":"Bản nộp tối đa 30 MB. Nhóm xuất lại với thiết lập nhẹ hơn rồi kiểm cả dung lượng và khả năng đọc chú thích trên tệp mới."},"tasks":[{"id":"T9-B13B-C06","prompt":"Ghép từng mô tả với tên phù hợp.","type":"match","groups":["Biên tập","Định dạng xuất","Kiểm tra tệp xuất"],"items":["Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất","Loại tệp dùng để phát hoặc chia sẻ","Phát tệp đã xuất để xác nhận hình và tiếng"],"assign":[0,1,2],"grouping":false,"why":"Biên tập → Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất · Định dạng xuất → Loại tệp dùng để phát hoặc chia sẻ · Kiểm tra tệp xuất → Phát tệp đã xuất để xác nhận hình và tiếng."},{"id":"T9-B13B-C07","prompt":"Tệp dự án có tên đẹp nhưng máy khác không phát. Cần làm gì?","type":"choice","choices":["Xuất tệp video có định dạng được hỗ trợ","Đổi đuôi dự án thành .mp4","Chụp tệp","Nhân đôi dự án"],"correct":[0],"why":"Đổi đuôi không chuyển định dạng."},{"id":"T9-B13B-C08","prompt":"Chọn hai thẻ có phần tên và mô tả khớp nhau.","type":"multi","choices":["Biên tập — Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất","Định dạng xuất — Phát tệp đã xuất để xác nhận hình và tiếng","Kiểm tra tệp xuất — Phát tệp đã xuất để xác nhận hình và tiếng","Kiểm tra tệp xuất — Loại tệp dùng để phát hoặc chia sẻ"],"correct":[0,2],"why":"B phải ghép với “Loại tệp dùng để phát hoặc chia sẻ”, còn D dùng mô tả của “Định dạng xuất”."},{"id":"T9-B13B-C09","prompt":"Hai mô tả lần lượt là “Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất” và “Loại tệp dùng để phát hoặc chia sẻ”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Biên tập” và “Định dạng xuất”.","Chúng đều mô tả “Kiểm tra tệp xuất”.","Hai mô tả có cùng ý nghĩa.","Chúng mô tả lần lượt “Định dạng xuất” và “Biên tập”."],"correct":[0],"why":"Chúng mô tả lần lượt “Biên tập” và “Định dạng xuất”."},{"id":"T9-B13B-C10","prompt":"Chọn lời giải thích phân biệt “Biên tập” với “Kiểm tra tệp xuất”.","type":"choice","choices":["Biên tập — Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất. Kiểm tra tệp xuất — Phát tệp đã xuất để xác nhận hình và tiếng.","Biên tập — Loại tệp dùng để phát hoặc chia sẻ. Kiểm tra tệp xuất — Phát tệp đã xuất để xác nhận hình và tiếng.","Biên tập — Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất. Kiểm tra tệp xuất — Loại tệp dùng để phát hoặc chia sẻ.","Biên tập — Phát tệp đã xuất để xác nhận hình và tiếng. Kiểm tra tệp xuất — Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất."],"correct":[0],"why":"Biên tập — Chỉnh nội dung, hình hoặc âm thanh trước khi hoàn tất. Kiểm tra tệp xuất — Phát tệp đã xuất để xác nhận hình và tiếng."}]},{"goal":"Căn nội dung, kiểu, vị trí và thời lượng chữ.","study":{"points":["Đặt nội dung chữ ở mốc liên quan, chọn màu tương phản và vùng không che mặt hay hiện vật. Phát thử để xem chữ có đủ lâu không.","Tính thời lượng chữ bằng mốc kết thúc trừ mốc bắt đầu. Khi chuyển chữ sang cảnh khác, rà lại mốc bắt đầu và kết thúc.","Xem trước bản dựng, chọn thông số rồi xuất. Sau đó mở chính tệp mới tạo để kiểm."],"example":"Tên nhân vật cần hiện từ giây 3 đến giây 8. Chữ hiện 5 giây. Nhóm đặt tên ở góc trống bên cạnh người nói và xem thử qua đoạn đó."},"tasks":[{"id":"T9-B13B-C11","prompt":"Xếp việc tạo bản nộp.","type":"order","steps":["Mở tệp xuất và xem thử","Chèn chữ và căn mốc","Xem trước bản dựng","Chọn thông số rồi xuất"],"sequence":[1,2,3,0],"why":"Rà trước khi xuất, sau đó kiểm tệp xuất."},{"id":"T9-B13B-C12","prompt":"Chọn hai điều chỉnh để tiêu đề dễ đọc.","type":"multi","choices":["Tương phản với nền","Hiện đủ thời gian","Bắt buộc dùng chữ nhỏ","Đặt đè lên dữ liệu quan trọng"],"correct":[0,1],"why":"Đọc được cần đủ độ rõ và thời lượng."},{"id":"T9-B13B-C13","prompt":"Chữ xuất hiện từ giây 2 đến giây 7. Hiện bao nhiêu giây?","type":"number","answer":5,"why":"7 − 2 = 5."},{"id":"T9-B13B-C14","prompt":"Ghép mục với chức năng.","type":"match","groups":["Text","Export","Playback"],"items":["Thêm tên chương","Tạo tệp video","Kiểm tra tệp phát"],"assign":[0,1,2],"grouping":false,"why":"Biên tập, xuất và kiểm là ba bước riêng."},{"id":"T9-B13B-C15","prompt":"Nơi nhận yêu cầu tối đa 30 MB. Bản xuất 42 MB. Xử lí?","type":"choice","choices":["Xuất lại với thiết lập phù hợp và kiểm chất lượng","Đổi tên thành 30MB","Xóa đuôi tệp","Nộp dự án thay"],"correct":[0],"why":"Cần thay thiết lập thực sự hoặc rút nội dung."}]},{"goal":"So bản dựng với tệp nộp.","study":{"points":["Khi tệp gửi còn lỗi dù bản dựng đã sửa, kiểm tên, thư mục lưu và phiên bản tệp đã xuất. Có thể em đang mở bản trước khi sửa.","Nếu bản xuất mất tiếng, rà xem âm thanh có bị tắt trong bản dựng hay thông số xuất có ảnh hưởng không. Sau đó xuất và mở lại tệp mới.","Nếu chữ quá nhanh hoặc che chi tiết, sửa mốc hoặc vị trí ngay trong dự án. Xem lại cả đoạn trước và sau vùng chỉnh."],"example":"Bản xuất “Ngày hội” còn sai tên gian. Em thấy bản dựng đã đúng, nên xuất thành “Ngay_hoi_v2”, mở kiểm ngay dòng tên rồi mới gửi."},"tasks":[{"id":"T9-B13B-C16","prompt":"Bản dựng đã sửa chính tả, video gửi vẫn sai. Kiểm tra gì?","type":"choice","choices":["Có xuất lại và gửi đúng bản mới không","Phông máy màu gì","Tệp có nằm trên màn hình không","Kích cỡ biểu tượng"],"correct":[0],"why":"Tệp xuất trước đó không tự cập nhật."},{"id":"T9-B13B-C17","prompt":"Chữ đúng nhưng che khuôn mặt và hiện quá nhanh. Chọn hai cách chỉnh.","type":"multi","choices":["Đổi vị trí chữ","Tăng thời lượng hợp lí","Thu mọi chữ về cỡ nhỏ nhất","Tăng âm lượng chữ"],"correct":[0,1],"why":"Đổi vị trí và mốc hiện xử lí hai lỗi."},{"id":"T9-B13B-C18","prompt":"Tiêu đề hiện 1–3 giây, cần kéo dài thêm 2 giây nhưng giữ mốc đầu. Mốc cuối mới?","type":"number","answer":5,"why":"3 + 2 = 5."},{"id":"T9-B13B-C19","prompt":"Ghép lỗi với nơi kiểm.","type":"match","groups":["Chữ và bố cục","Thiết lập xuất","Phiên bản"],"items":["Tiêu đề bị lõm ngoài khung","Tệp vượt giới hạn","Tệp gửi chưa có sửa mới"],"assign":[0,1,2],"grouping":false,"why":"Lỗi nội dung và lỗi tệp cần kiểm riêng."},{"id":"T9-B13B-C20","prompt":"Video xuất đủ hình nhưng không có lời. Khâu nào cần rà?","type":"choice","choices":["Rãnh tiếng, trạng thái tắt tiếng và tệp xuất mới","Tên ảnh bìa","Màu nút xuất","Danh sách ảnh tĩnh"],"correct":[0],"why":"Kiểm xem tiếng có trong bản dựng và đầu ra."}]},{"goal":"Tạo các tệp phù hợp với kênh nộp và trình chiếu.","study":{"points":["Có thể xuất hai tệp từ cùng một dự án, một bản nhẹ để nộp và một bản rõ để chiếu. Đặt tên theo mục đích và phiên bản.","Với mỗi tệp, kiểm dung lượng, khả năng phát, độ rõ chữ và tiếng. Bản vừa giới hạn dung lượng vẫn cần truyền đạt đầy đủ nội dung.","Sau khi điều chỉnh, thử trên thiết bị hoặc trình phát dự kiến nếu có. Giữ dự án và tư liệu để còn sửa về sau."],"example":"Trường cần bản dưới 30 MB, phòng chiếu có thể phát tệp lớn hơn. Nhóm xuất hai bản, thử đọc chữ của bản nhẹ và mở bản rõ trên máy chiếu."},"tasks":[{"id":"T9-B13B-C21","prompt":"Cần bản nộp nhẹ và bản trình chiếu rõ. Chọn hai việc.","type":"multi","choices":["Xuất hai cấu hình có tên phân biệt","Thử từng tệp ở mục đích tương ứng","Chỉ đổi đuôi một tệp","Dùng bản nặng cho mọi giới hạn"],"correct":[0,1],"why":"Thử riêng để đáp ứng hai yêu cầu."},{"id":"T9-B13B-C22","prompt":"Xếp chuỗi sửa rồi xuất lại.","type":"order","steps":["Kiểm và giao tệp mới","Tìm l const h=(tag,cls='',text='')=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e};
function add(parent,...children){parent.append(...children.filter(x=>x!==null&&x!==undefined));return parent}
function b(text,fn,cls='btn subtle'){const e=h('button',cls,text);e.type='button';e.addEventListener('click',fn);return e}
function field(label,control){return add(h('label','field'),h('span','field-label',label),control)}
function select(options,current,onChange){
  const e=h('select');e.append(new Option('Chọn…',''));
  options.forEach((x,i)=>e.append(new Option(x,String(i))));
  e.value=current===null||current===undefined?'':String(current);
  e.addEventListener('change',()=>onChange(e.value===''?null:Number(e.value)));return e
}
function input(value,onInput,opts={}){const e=h('input');Object.assign(e,{value,type:'text',...opts});e.addEventListener('input',()=>onInput(e.value));return e}
function pressed(label,active,fn,cls='chip'){const e=b(label,fn,cls+(active?' selected':''));e.setAttribute('aria-pressed',String(active));return e}
const same=(a,b)=>Array.isArray(a)&&a.length===b.length&&a.every((x,i)=>x===b[i]);
const folded=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').trim();
function stableOrder(n,key){
  const arr=Array.from({length:n},(_,i)=>i);
  let seed=[...key].reduce((a,c)=>Math.imul(a^c.charCodeAt(0),16777619)>>>0,2166136261);
  for(let i=n-1;i>0;i--){seed=(Math.imul(1664525,seed)+1013904223)>>>0;const j=seed%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr
}
function checkTable(rows){
 const box=h('div','table-wrap'),table=h('table','data-table');
 rows.forEach((row,i)=>{const tr=h('tr');row.forEach(v=>{const td=h(i?'td':'th','',v);if(!i)td.scope='col';tr.append(td)});table.append(tr)});return add(box,table)
}
const LABS={};
function mountLab(host,mission,initialDone,award){
  const lab=LABS[mission.mode];let caseNo=initialDone.includes(0)&&!initialDone.includes(1)?1:0;
  let state={},msg=null,done=[...initialDone];
  const ui={
    root:host,
    nextRender(){render()},
    verdict(ok,good,retry){msg={ok,text:ok?good:retry};if(ok&&!done.includes(caseNo)){done.push(caseNo);award(caseNo)}render();host.querySelector('.lab-feedback')?.focus()},
    notify(text){msg={ok:null,text};render();host.querySelector('.lab-feedback')?.focus()},
    change(fn){return()=>{fn();msg=null;render()}},
    action(text,fn){return b(text,fn,'btn primary')}
  };
  function render(){
    const current=lab[caseNo];
    const tabs=h('div','lab-tabs');
    function showCase(i){
      if(caseNo===i)return;
      caseNo=i;state={};msg=null;render();
      host.querySelector('.lab-name')?.focus();
    }
    lab.forEach((_,i)=>{
      const tab=pressed((done.includes(i)?'✓ ':'')+'Nhiệm vụ '+(i+1),i===caseNo,()=>showCase(i));
      tab.disabled=i>0&&!done.includes(i-1);
      tabs.append(tab);
    });
    const stage=h('section','lab-stage');
    const name=h('h3','lab-name',current.title);name.tabIndex=-1;
    add(stage,name,h('p','lab-instruction',current.prompt));
    const play=h('div','lab-play');stage.append(play);
    host.replaceChildren(tabs,stage);
    const aria=h('div','sr-only');aria.id='lab-current';aria.textContent='Mô phỏng '+mission.lab;stage.prepend(aria);
    current.draw(play,state,ui);
    if(msg){
      const out=h('p','lab-feedback '+(msg.ok===true?'success':msg.ok===false?'warning':'neutral'),msg.text);
      out.tabIndex=-1;out.setAttribute('role','status');stage.append(out);
      if(msg.ok&&caseNo===0&&!done.includes(1))stage.append(b('Sang nhiệm vụ 2',()=>showCase(1),'btn primary lab-next'));
    }
  }
  render();
}
function tray(box,options,picked,onPick,onUndo,onClear,label='Các bước đã lắp'){
 const src=h('div','tool-row'),out=h('ol','ordered-tray');out.tabIndex=-1;
 options.forEach((x,i)=>{const e=b(x,()=>onPick(i),'btn chip');e.disabled=picked.includes(i);src.append(e)});
 if(!picked.length)out.append(h('li','empty-slot','Chưa có bước nào.'));
 else picked.forEach(i=>{const step=h('li','',options[i]);step.tabIndex=-1;out.append(step)});
 const tools=h('div','tool-row');const undo=b('Bỏ bước cuối',onUndo),clear=b('Xếp lại',onClear);undo.disabled=clear.disabled=!picked.length;
 add(box,src,h('p','field-label',label),out,add(tools,undo,clear));
}
function makeSteps(spec){
 const {title,prompt,steps,right}=spec;
 return {title,prompt,draw(box,state,ui){
  state.picked??=[];
  const pick=index=>{
   state.picked.push(index);ui.nextRender();
   ui.root.querySelector('.ordered-tray li:last-child')?.focus();
  };
  tray(box,steps,state.picked,pick,ui.change(()=>state.picked.pop()),

 }};

function previewLab(spec, indices){
 const labels=spec.fields.map(([,options],i)=>options[indices[i]]??'—');
 const controlTable=checkTable([['Thiết lập','Đang chọn'],...spec.fields.map(([label],i)=>[label,labels[i]])]);
 if(!spec.preview||indices.includes(null))return controlTable;
 const [a,b,c]=indices;
 let results;
 if(spec.preview==='salary'){
  const limits=[[0,60],[1,60],[1,40]][a];
  results=checkTable([['Giờ nhập','Kết quả mô phỏng (nghìn đồng nếu là tiền)'],...[0,40,46,61].map(hours=>{
   if(hours<limits[0]||hours>limits[1])return [String(hours),'Yêu cầu nhập lại'];
   const overtime=Math.max(0,hours-40);
   const bonusPay=[overtime*30,hours*30,0][b];
   const regularHours=b===0?hours-overtime:b===1?0:hours;
   return [String(hours),String([hours,bonusPay,regularHours*20+bonusPay][c])];
  })]);
 }else if(spec.preview==='maximum'){
  const start=[0,1,99][a];
  const tests=[[0],[1,2,6,0],[3,9,2,0]];
  results=checkTable([['Dãy nhập','Kết quả mô phỏng'],...tests.map(numbers=>{
   let max=start,seen=false;
   for(const x of numbers){
    if(x===0)break;
    if(b===0||(b===1?x>max:x<max))max=x;
    seen=true;
   }
   return [numbers.join(', '),seen?String(max):['0','Giữ điểm cũ','Không có dữ liệu'][c]];
  })]);
 }else if(spec.preview==='count'){
  const rows=[50,80,80,120].map(value=>{
   const passes=[value>80,value>=80,value<80][a];
   return [String(value),passes?'Có':'Không'];
  });
  results=checkTable([['Khoản chi (nghìn đồng)','Được đếm'],...rows,
    ['COUNTIF',String(rows.filter(([,pass])=>pass==='Có').length)]]);
 }else if(spec.preview==='sum'){
  const rows=[80,100,130,200].map(value=>[value,[value>=100,value>100,value<100][a]?value:0]);
  results=checkTable([['Khoản chi (nghìn đồng)','Góp vào tổng'],...rows.map(row=>row.map(String)),
   ['SUMIF',String(rows.reduce((total,[,amount])=>total+amount,0))]]);
 }else if(spec.preview==='split'){
  const split=[4,7,18][a],segments=[split,18-split];
  const timeline=b===0?[['Clip trước',segments[0]],['Ảnh',4],['Clip sau',segments[1]]]:
   b===1?[['Ảnh',4],['Clip trước',segments[0]],['Clip sau',segments[1]]]:
   [['Clip trước',segments[0]],['Clip sau',segments[1]],['Ảnh',4]];
  let elapsed=0;
  results=checkTable([['Bản dựng','Bắt đầu','Kết thúc'],...timeline.map(([name,seconds])=>{
   const start=elapsed;
   elapsed+=seconds;
   return [name,start+' giây',elapsed+' giây'];
  })]);
 }else if(spec.preview==='length'){
  const start=[0,1,5][a],end=[5,3,1][b];
  const duration=end-start;
  results=h('p','',duration>0?'Chữ hiện '+duration+' giây · '+labels[2]:'Hãy đặt mốc cuối sau mốc đầu.');
 }
 return add(h('div'),controlTable,results);
}

  const legend=h('legend','sr-only',q.type==='multi'?'Chọn tất cả phương án đúng':'Chọn một phương án đúng');fields.append(legend);
  ids.forEach((idx,i)=>{
   const f=h('input');f.type=q.type==='multi'?'checkbox':'radio';f.name=q.id;f.value=String(idx);
   f.addEventListener('change',()=>{if(q.type==='choice')set.clear();if(f.checked)set.add(idx);else set.delete(idx);update()});
   fields.append(add(h('label','answer-choice'),f,h('span','letter',String.fromCharCode(65+i)),h('span','',q.choices[idx])));
  });
  area.append(fields);
  valid=()=>set.size>0;correct=()=>same([...set].sort(),[...q.correct].sort());
 }
 function grade(){
  if(attempt?.phase!=='answer'||!valid()||pane!==attempt.pane)return;
  if(correct())complete(index,q,pane,false);
  else wrong(index,q,pane,stage);
 }
}
function drawPractice(q,pane,finish){
 const intro=h('p','muted','Làm bài rồi tự đối chiếu kết quả.');
 const holder=h('div','practice-rubric');holder.hidden=true;
 const checks=[];
 const submit=b('Ghi nhận đã tự đối chiếu',()=>{if(checks.every(x=>x.checked))finish()},'btn primary');submit.disabled=true;
 q.rubric.forEach(line=>{const e=h('input');e.type='checkbox';e.addEventListener('change',()=>submit.disabled=!checks.every(x=>x.checked));checks.push(e);
  holder.append(add(h('label','rubric-item'),e,h('span','',line)))});
 holder.append(submit);
 const show=b('Mở tiêu chí tự kiểm tra',()=>{holder.hidden=false;show.hidden=true;focus(checks[0])});
 add(pane,intro,show,holder);
}
function disable(pane){pane.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=true)}
function complete(index,q,pane,self){
 if(attempt?.phase!=='answer'||index!==progress.count)return;
 attempt.phase='complete';disable(pane);
 progress.count++;
 if(!self)progress.xp+=progress.tries[index]?10:20;
 if(progress.count%5===0)progress.xp+=30;
 save(lesson.n);
 setHeader(mission);
 const end=progress.count%5===0;
 const result=add(h('div','result-card success'),h('strong','',self?'✓ Đã ghi nhận tự đối chiếu':'✓ Chính xác!'),h('p','',self?'Em đã tự kiểm tra bài theo tiêu chí.':q.why));
 result.setAttribute('role','status');
 const stageIndex=Math.floor(index/5);
 if(end&&stageIndex<4)result.append(h('p','medal',MEDALS[stageIndex]+' Huy hiệu khu vực '+(stageIndex+1)));
 const next=b(progress.count===TOTAL?'Vào thử thách thực hành':end?'Nhận huy chương':'Sang câu tiếp theo',
  ()=>end?(progress.count===TOTAL?lab():celebrateStage(stageIndex)):play(progress.count),'btn primary');
 add(pane,result,next);focus(next);
}
function wrong(index,q,pane,stage){
 attempt.phase='retry';disable(pane);
 progress.tries[index]=(progress.tries[index]||0)+1;save(lesson.n);
 const reviewNotes=b('Xem lại kiến thức',()=>{
  const study=attempt?.study;
  if(study){
   study.scrollIntoView({block:'start'});
   focus(study.querySelector('h2'));
  }
 },'btn text-btn');
 const read=add(h('div','result-card warning'),h('h3','','Đọc lại rồi thử lần nữa'),
  h('p','',hint(q,stage)),reviewNotes);
 const e=h('input');e.type='checkbox';
 const retry=b('Thử lại câu này',()=>play(index,true),'btn primary');retry.disabled=true;
 e.addEventListener('change',()=>retry.disabled=!e.checked);
 add(read,add(h('label','rubric-item'),e,h('span','','Em đã đọc lại tư liệu')),retry);pane.append(read);focus(e);
}
function solution(q){
 if(q.type==='practice')return q.rubric.join(' ');
 if(q.type==='number')return String(q.answer);
 if(q.type==='order')return q.sequence.map(i=>q.steps[i]).join(' → ');
 if(q.type==='match')return q.items.map((t,i)=>t+' → '+q.groups[q.assign[i]]).join(' · ');
 return q.correct.map(i=>q.choices[i]).join(' · ');
}
function review(i){
 attempt=null;
 const s=lesson.stages[i],solved=Math.max(0,Math.min(5,progress.count-5*i));
 const [head,title]=basePanel('BÀI '+lesson.code.toUpperCase()+' · ÔN TẬP',mission.stages[i],solved+'/5 câu đã hoàn thành.');
 const box=h('div','review-stack');box.append(drawStudy(s));
 s.tasks.slice(0,solved).forEach(q=>{
  const item=add(h('details','review-item'),h('summary','',q.prompt));
  if(q.table)item.append(checkTable(q.table));
  add(item,h('p','',solution(q)),q.why?h('p','muted',q.why):null);box.append(item);
 });
 if(!solved)box.append(h('p','muted','Lời giải sẽ xuất hiện ở đây sau khi em vượt qua từng câu.'));
 main.replaceChildren(add(h('div','lesson-panel'),head,box));focusViewStart(title);
}
function extra(){
 attempt=null;
 const q=lesson.extras[0];
 const [head,title]=basePanel('THỰC HÀNH BỔ SUNG','Bài mở rộng');
 const box=add(h('section','question-card'),h('h2','',q.prompt));
 drawPractice(q,box,()=>{
  if(!progress.extras.includes(q.id)){progress.extras.push(q.id);save(lesson.n)}
  disable(box);const result=h('p','result-card success','✓ Đã ghi nhận tự đối chiếu.');box.append(result);focus(result);
 });
 main.replaceChildren(add(h('div','lesson-panel'),head,box));focusViewStart(title);
}
function celebrateStage(i){
 attempt=null;
 const title=h('h1','','Hoàn thành khu vực '+(i+1)+'!');
 const actions=add(h('div','tool-row'),
  b('Sang khu vực tiếp theo',()=>play(progress.count),'btn primary'),
  b('Xem lời giải',()=>review(i)),
  b('Bản đồ bài này',()=>lessonPage()));
 const panel=add(h('section','lesson-panel celebration'),
  h('span','award',MEDALS[i]),title,
  h('p','muted',mission.stages[i]),actions);
 main.replaceChildren(panel);
 focusViewStart(title);
}
function certificate(){
 if(!hasCertificate(progress)){lessonPage();return}
 attempt=null;
 const title=h('h1','','Chứng nhận hoàn thành');
 const recipient=h('p','certificate-recipient');
 const name=input('',value=>{recipient.textContent=value.trim()},{maxLength:80,autocomplete:'off'});
 const date=new Intl.DateTimeFormat('vi-VN',{
  day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Ho_Chi_Minh'
 }).format(new Date(progress.certificateAt));
 const card=add(h('section','certificate-card'),
  h('span','certificate-icon','🏆'),
  h('p','eyebrow','CODEQUEST · TIN HỌC 9'),
  title,recipient,
  h('h3','','Bài '+lesson.code+' · '+lesson.title),
  h('p','','25 câu luyện tập · 2 nhiệm vụ thực hành'),
  h('p','certificate-date','Ngày hoàn thành: '+date));
 const actions=add(h('div','certificate-actions'),
  field('Tên trên chứng nhận (tùy chọn)',name),
  b('In / lưu PDF',()=>window.print(),'btn primary'));
 if(lesson.extras.length)actions.append(b('Bài mở rộng',()=>extra()));
 main.replaceChildren(add(h('div','lesson-panel certificate-view'),
  b('☰ Bản đồ bài này',()=>lessonPage()),card,actions));
 focusViewStart(title);
}
document.querySelector?.('.skip')?.addEventListener('click',e=>{e.preventDefault();main.scrollIntoView({block:'start'});focus(main)});
window.addEventListener('hashchange',route);
route();

// These controls apply to user actions in the lesson, not to browser extensions.
(() => {
 const notice=h('p','notice lesson-clipboard-notice');
 notice.setAttribute('role','status');
 notice.setAttribute('aria-atomic','true');
 document.body.append(notice);
 let hideNotice;

 function selectionTouchesLesson(){
  const selection=document.getSelection?.();
  if(!selection||selection.isCollapsed)return false;
  for(let i=0;i<selection.rangeCount;i++){
   if(selection.getRangeAt(i).intersectsNode(main))return true;
  }
  return false;
 }

 function restrictClipboard(event){
  if(!lesson||main.querySelector('.certificate-view'))return;
  const carriesSelection=['copy','cut','dragstart'].includes(event.type);
  if(!main.contains(event.target)&&!(carriesSelection&&selectionTouchesLesson()))return;
  if(event.type==='beforeinput'&&!['insertFromPaste','insertFromPasteAsQuotation','insertFromDrop'].includes(event.inputType))return;
  if(!event.cancelable)return;
  event.preventDefault();
  notice.textContent=carriesSelection
   ?'Bài học này đã tắt sao chép và cắt nội dung.'
   :'Hãy nhập câu trả lời trực tiếp. Bài học này đã tắt dán và thả nội dung.';
  clearTimeout(hideNotice);
  hideNotice=setTimeout(()=>{notice.textContent=''},4000);
 }

 for(const type of ['copy','cut','paste','dragstart','drop','beforeinput']){
  document.addEventListener(type,restrictClipboard,{capture:true});
 }
})();

</script>

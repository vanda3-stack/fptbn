<script>
'use strict';
const BANK={"5":{"n":5,"title":"Internet","pages":"20–22","stages":[{"goal":"Nhận biết Internet, đặc điểm và lợi ích.","text":"Internet kết nối các mạng trên toàn cầu, hỗ trợ nhiều dịch vụ.","tasks":[{"id":"T6-B05-C01","prompt":"Internet là gì?","type":"choice","choices":["Hệ thống kết nối nhiều mạng trên toàn cầu","Một mạng riêng của một phòng học","Một trang web duy nhất","Một phần mềm soạn thảo"],"correct":[0],"why":"Internet liên kết nhiều mạng."},{"id":"T6-B05-C02","prompt":"Hoạt động nào cần Internet trong tình huống đã nêu?","type":"choice","choices":["Họp trực tuyến với lớp ở thành phố khác","Gõ một đoạn trong tệp lưu cục bộ","Tính nhẩm trên giấy","Đọc tệp có sẵn khi ngoại tuyến"],"correct":[0],"why":"Họp trực tuyến từ xa cần kết nối."},{"id":"T6-B05-C03","prompt":"Đặc điểm nào thể hiện phạm vi của Internet?","type":"choice","choices":["Chỉ một trường được dùng","Chỉ truy cập lúc học Tin","Người dùng ở nhiều quốc gia có thể kết nối","Mọi máy đều ở cùng một phòng"],"correct":[2],"why":"Đây là tính toàn cầu."},{"id":"T6-B05-C04","prompt":"Đơn vị cung cấp dịch vụ kết nối Internet thường gọi là gì?","type":"choice","choices":["Phần mềm mạng xã hội","Trình soạn thảo","Nhà cung cấp dịch vụ Internet","Máy tìm kiếm"],"correct":[2],"why":"Nhà cung cấp giúp mạng hoặc thiết bị kết nối Internet."},{"id":"T6-B05-C05","prompt":"Việc hỏi và trả lời trực tiếp trong lớp học trực tuyến thể hiện đặc điểm nào?","type":"choice","choices":["Tính tương tác","Chỉ lưu ngoại tuyến","Chỉ đọc một chiều","Tính cục bộ"],"correct":[0],"why":"Các bên có thể phản hồi qua lại."}]},{"goal":"Phân biệt mạng nội bộ, kết nối và dịch vụ.","text":"Một mạng nội bộ có thể hoạt động khi mất Internet.","tasks":[{"id":"T6-B05-C06","prompt":"Máy A gửi tệp qua mạng phòng máy dù đường ra ngoài bị ngắt. Điều đó cho thấy gì?","type":"choice","choices":["Gửi tệp luôn phải qua website","Mạng nội bộ có thể hoạt động không cần Internet","Internet chắc chắn vẫn hoạt động","Không có mạng nào hoạt động"],"correct":[1],"why":"Trao đổi trong phòng dùng mạng nội bộ."},{"id":"T6-B05-C07","prompt":"Thư điện tử và gọi video là gì xét trong ví dụ người dùng ở xa?","type":"choice","choices":["Hai loại dây mạng","Hai bộ phận của bàn phím","Hai dịch vụ sử dụng Internet","Hai nhà cung cấp bắt buộc"],"correct":[2],"why":"Cả hai phục vụ trao đổi qua mạng."},{"id":"T6-B05-C08","prompt":"Điện thoại có biểu tượng Wi-Fi nhưng báo “không có Internet”. Kết luận nào đúng?","type":"choice","choices":["Wi-Fi luôn đồng nghĩa Internet hoạt động","Có thể đã nối Wi-Fi nhưng chưa ra được Internet","Chắc chắn mọi website đều bị xóa","Máy đang dùng cáp"],"correct":[1],"why":"Wi-Fi là kết nối không dây tới mạng gần, không bảo đảm đường ra."},{"id":"T6-B05-C09","prompt":"Nhiều tổ chức tự quản lí mạng của mình và kết nối với nhau. Điều nào đúng về Internet?","type":"choice","choices":["Một công ty luôn sở hữu mọi trang web","Một trường sở hữu mọi mạng","Không có một chủ sở hữu duy nhất của toàn bộ Internet","Chỉ một nước được quyết định ai kết nối"],"correct":[2],"why":"Mỗi tổ chức có thể quản lí phần mạng của mình."},{"id":"T6-B05-C10","prompt":"Người dùng ở hai nước cùng sửa tài liệu nhóm. Hai đặc điểm nào thể hiện rõ?","type":"choice","choices":["Cục bộ và một chiều","Ngoại tuyến và cố định","Toàn cầu và tương tác","Chỉ đọc và không kết nối"],"correct":[2],"why":"Họ làm việc từ xa và thay đổi nội dung qua lại."}]},{"goal":"Chọn dịch vụ theo nhu cầu.","text":"Xét trao đổi trực tiếp, gửi tệp hoặc cùng chỉnh sửa.","tasks":[{"id":"T6-B05-C11","prompt":"Nhóm phải thảo luận bằng tiếng nói ngay bây giờ từ ba nhà khác nhau. Chọn gì?","type":"choice","choices":["Tài liệu đã tải khi không có kênh trao đổi","Bản sao USB","Tệp in tại nhà một bạn","Cuộc gọi trực tuyến"],"correct":[3],"why":"Cuộc gọi hỗ trợ trao đổi tức thời."},{"id":"T6-B05-C12","prompt":"Cô cần nhận một tệp và có thể xem tối nay. Công cụ nào phù hợp?","type":"choice","choices":["Máy tính bỏ túi","Sao vào thư mục riêng trên máy em","Chỉ gọi rồi cúp máy","Thư điện tử hoặc cổng nộp bài theo yêu cầu"],"correct":[3],"why":"Công cụ phải chuyển được tệp."},{"id":"T6-B05-C13","prompt":"Muốn tránh ba bản chỉnh sửa song song, nhóm đã có mạng và tài khoản. Chọn gì?","type":"choice","choices":["Chỉ gửi tên tài liệu","Cùng làm trên tài liệu trực tuyến được cấp quyền","In bản cũ trước khi chỉnh","Mỗi bạn giữ một bản riêng không trao đổi"],"correct":[1],"why":"Một bản chung giảm phân tán phiên bản."},{"id":"T6-B05-C14","prompt":"Nêu một việc em có thể làm khi mất Internet và một việc cần kết nối. Giải thích theo nơi lấy dữ liệu hoặc người nhận.","type":"practice","rubric":["1 điểm mỗi ví dụ phù hợp kèm lí do, như đọc tệp đã tải và gửi thư cho bạn ở xa."]},{"id":"T6-B05-C15","prompt":"Chọn hai lợi ích khác nhau của Internet cho lớp học và nêu một hoạt động cụ thể cho mỗi lợi ích.","type":"practice","rubric":["1 điểm mỗi cặp lợi ích–hoạt động phù hợp, như học trực tuyến–tham gia tiết học và chia sẻ–nộp tệp cho cô."]}]},{"goal":"Khoanh vùng lỗi và bác bỏ suy luận vội.","text":"So sánh thiết bị, dịch vụ và phạm vi kết nối.","tasks":[{"id":"T6-B05-C16","prompt":"Ba máy mở được hai website khác, chỉ một website báo lỗi. Kết luận hợp lý?","type":"choice","choices":["Internet vẫn dùng được; kiểm tra riêng website hoặc địa chỉ đó","Cả ba cáp chắc chắn đứt","Toàn bộ Internet đã mất","Tệp trong máy đều hỏng"],"correct":[0],"why":"Các website khác vẫn mở."},{"id":"T6-B05-C17","prompt":"Hai máy trong phòng trao đổi tệp nhưng không máy nào mở được các website đã biết. Kiểm tra trước gì?","type":"choice","choices":["Đường kết nối từ mạng phòng ra Internet","Đổi bàn phím cả phòng","Mực máy in","Tên tệp chia sẻ"],"correct":[0],"why":"Mạng cục bộ còn chạy; lỗi có thể ở đường ra."},{"id":"T6-B05-C18","prompt":"Máy B họp được trên cùng Wi-Fi, máy A không mở được bất cứ dịch vụ Internet nào. Xem gì trước?","type":"choice","choices":["Thông báo Internet toàn cầu ngừng","Kết nối và cấu hình trên máy A","Đổi giờ học của cả lớp","Xóa tài liệu của B"],"correct":[1],"why":"Dấu hiệu tập trung vào A."},{"id":"T6-B05-C19","prompt":"Bạn thấy tên Wi-Fi rồi kết luận “chắc chắn vào Internet được”. Nêu phản ví dụ và một phép thử.","type":"practice","rubric":["1 điểm: Wi-Fi còn nhưng đường ra Internet hỏng.","1 điểm: thử mở địa chỉ Internet đáng tin đã biết."]},{"id":"T6-B05-C20","prompt":"Trang có tiêu đề đúng nhưng thông tin chưa có nguồn. Vì sao tính phổ biến của Internet không đủ bảo đảm thông tin đúng?","type":"practice","rubric":["1 điểm: nhiều người có thể đăng/chia sẻ.","1 điểm: đề xuất kiểm tra nguồn hoặc đối chiếu nguồn độc lập phù hợp."]}]},{"goal":"Lập phương án làm việc trực tuyến có dự phòng.","text":"Ghép công cụ với ràng buộc thời gian và kết nối.","tasks":[{"id":"T6-B05-C21","prompt":"Nhóm cần xem chung hướng dẫn tối nay, một bạn mạng chập chờn. Cách nào hợp lý?","type":"choice","choices":["Chỉ chiếu hướng dẫn tại trường","Chỉ gửi một ảnh không đọc được","Chỉ gọi video độ phân giải cao","Gửi tệp nhẹ để tải trước và có bản tóm tắt bằng chữ"],"correct":[3],"why":"Bản tải trước giúp tiếp tục đọc khi mạng ngắt."},{"id":"T6-B05-C22","prompt":"Nhóm muốn họp rồi nộp tệp đã thống nhất. Chọn kế hoạch phù hợp?","type":"choice","choices":["Nộp từng bản nháp trước cuộc họp","Chia sẻ tệp riêng mà cô không truy cập được","Chỉ gọi, không lưu tệp","Gọi khi đủ người; lưu và nộp một bản cuối qua kênh lớp"],"correct":[3],"why":"Hai công cụ phục vụ hai việc, cần bản cuối và quyền đọc."},{"id":"T6-B05-C23","prompt":"Mất Internet trước hạn nhưng máy còn tệp. Kế hoạch nào giữ được tiến độ?","type":"choice","choices":["Đánh dấu đã nộp dù chưa gửi","Lưu bản cuối; dùng kết nối được phép khi có lại để nộp và kiểm tra xác nhận","Xóa bản cuối rồi soạn lại","Chờ mà không lưu bài"],"correct":[1],"why":"Giữ tệp và kiểm tra gửi thành công."},{"id":"T6-B05-C24","prompt":"Lập kế hoạch làm bài nhóm từ xa: thảo luận, chia sẻ bản chung, nộp bản cuối; nêu phương án khi một bạn tạm mất mạng.","type":"practice","rubric":["1 điểm: kênh thảo luận const h=(tag,cls='',text='')=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e};
function add(parent,...children){parent.append(...children.filter(x=>x!==null&&x!==undefined));return parent}
function b(text,fn,cls='btn subtle'){const e=h('button',cls,text);e.type='button';e.addEventListener('click',fn);return e}
function field(label,control){return add(h('label','field'),h('span','field-label',label),control)}
function select(options,current,onChange){
  const e=h('select');e.append(new Option('Chọn…',''));
  options.forEach((x,i)=>e.append(new Option(x,String(i))));
  e.value=current===null||current===undefined?'':String(current);
  e.addEventListener('change',()=>onChange(e.value===''?null:Number(e.value)));return e
}
function input(value,onInput,opts={}){const e=h('input');Object.assign(e,{value,type:'text',...opts});e.addEventListener('input',()=>onInput(e.value));return e}
function pressed(label,active,fn,cls='chip'){const e=b(label,fn,cls+(active?' selected':''));e.setAttribute('aria-pressed',String(active));return e}
const same=(a,b)=>Array.isArray(a)&&a.length===b.length&&a.every((x,i)=>x===b[i]);
const folded=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').trim();
function stableOrder(n,key){
  const arr=Array.from({length:n},(_,i)=>i);
  let seed=[...key].reduce((a,c)=>Math.imul(a^c.charCodeAt(0),16777619)>>>0,2166136261);
  for(let i=n-1;i>0;i--){seed=(Math.imul(1664525,seed)+1013904223)>>>0;const j=seed%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr
}
function checkTable(rows){
 const box=h('div','table-wrap'),table=h('table','data-table');
 rows.forEach((row,i)=>{const tr=h('tr');row.forEach(v=>{const td=h(i?'td':'th','',v);if(!i)td.scope='col';tr.append(td)});table.append(tr)});return add(box,table)
}
const LABS={};
function mountLab(host,mission,initialDone,award){
  const lab=LABS[mission.mode];let caseNo=initialDone.includes(0)&&!initialDone.includes(1)?1:0;
  let state={},msg=null,done=[...initialDone];
  const ui={
    root:host,
    nextRender(){render()},
    verdict(ok,good,retry){msg={ok,text:ok?good:retry};if(ok&&!done.includes(caseNo)){done.push(caseNo);award(caseNo)}render();host.querySelector('.lab-feedback')?.focus()},
    notify(text){msg={ok:null,text};render();host.querySelector('.lab-feedback')?.focus()},
    change(fn){return()=>{fn();msg=null;render()}},
    action(text,fn){return b(text,fn,'btn primary')}
  };
  function render(){
    const current=lab[caseNo];
    const tabs=h('div','lab-tabs');
    lab.forEach((x,i)=>tabs.append(pressed((done.includes(i)?'✓ ':'')+(i===0?'01 · Làm quen':'02 · Thử thách'),i===caseNo,()=>{
      if(caseNo===i)return;caseNo=i;state={};msg=null;render();host.querySelector('.lab-name')?.focus();
    })));
    const stage=h('section','lab-stage');
    const name=h('h3','lab-name',current.title);name.tabIndex=-1;
    add(stage,name,h('p','lab-instruction',current.prompt));
    const play=h('div','lab-play');stage.append(play);
    host.replaceChildren(tabs,stage);
    const aria=h('div','sr-only');aria.id='lab-current';aria.textContent='Mô phỏng '+mission.lab;stage.prepend(aria);
    current.draw(play,state,ui);
    if(msg){const out=h('p','lab-feedback '+(msg.ok===true?'success':msg.ok===false?'warning':'neutral'),msg.text);out.tabIndex=-1;out.setAttribute('role','status');stage.append(out)}
  }
  render();
}
function sortedLab(title,prompt,groups,items,expect,good,retry,appearance=''){
 return {title,prompt,draw(box,s,u){
  s.answers??=Array(items.length).fill(null);
  const cols=h('div','sort-board '+appearance);
  groups.forEach((g,i)=>{const bin=h('div','sort-bin'),list=h('ul');items.forEach((t,j)=>{if(s.answers[j]===i)list.append(h('li','',t))});add(bin,h('strong','',g),list.children.length?list:h('span','tiny','Chưa có mục'));cols.append(bin)});
  const rows=h('div','form-grid');
  items.forEach((x,i)=>rows.append(field(x,select(groups,s.answers[i],v=>{s.answers[i]=v;u.nextRender();u.root.querySelectorAll('select')[i]?.focus()}))));
  add(box,cols,rows,u.action('Kiểm tra cách xếp',()=>u.verdict(same(s.answers,expect),good,retry)));
 }}
}

function tray(box,options,picked,onPick,onUndo,onClear,label='Các bước đã lắp'){
 const src=h('div','tool-row'),out=h('ol','ordered-tray');out.tabIndex=-1;
 options.forEach((x,i)=>{const e=b(x,()=>onPick(i),'btn chip');e.disabled=picked.includes(i);src.append(e)});
 if(!picked.length)out.append(h('li','empty-slot','Chưa có bước nào.'));
 else picked.forEach(i=>{const step=h('li','',options[i]);step.tabIndex=-1;out.append(step)});
 const tools=h('div','tool-row');const undo=b('Bỏ bước cuối',onUndo),clear=b('Xếp lại',onClear);undo.disabled=clear.disabled=!picked.length;
 add(box,src,h('p','field-label',label),out,add(tools,undo,clear));
}

function pixelCase(title,prompt,pattern){
 const w=pattern[0].length,answer=pattern.join('').split('').map(Number);
 return {title,prompt,draw(box,s,u){
  s.bits??=answer.map(()=>0);
  const grids=h('div','pixel-pair');
  function makeGrid(values,editable){
   const grid=h('div','pixel-grid');grid.style.setProperty('--cols',w);
   values.forEach((v,i)=>{
    const label='Hàng '+(Math.floor(i/w)+1)+', cột '+(i%w+1)+': '+v;
    const e=editable?pressed(String(v),!!v,()=>{s.bits[i]=1-v;u.nextRender();u.root.querySelectorAll('.pixel-grid button')[i]?.focus()},'pixel-cell'):h('span','pixel-cell '+(v?'selected':''),String(v));
    e.setAttribute('aria-label',label);grid.append(e);
   });return grid
  }
  add(grids,add(h('div'),h('p','field-label','Ảnh đích · 1 là ô tối'),makeGrid(answer,false)),add(h('div'),h('p','field-label','Bảng em đang mã hóa'),makeGrid(s.bits,true)));
  add(box,grids,h('p','readout','Mã theo hàng: '+pattern.map((_,r)=>s.bits.slice(r*w,(r+1)*w).join('')).join(' / ')),
  u.action('So ảnh và dãy bit',()=>u.verdict(same(s.bits,answer),'Khớp! Có '+answer.length+' bit, đọc lần lượt theo từng hàng.','So từng ô với ảnh đích. Chỉ bật 1 tại ô tối, bắt đầu từ hàng đầu.')));
 }}
}

function networkCase(title,prompt,nodes,edges,solution){
 return {title,prompt,draw(box,s,u){
  s.wires??=[];s.pick??=null;
  const board=h('div','network-board');
  const kinds=['Máy bàn','Bộ chuyển mạch','Máy in','Điểm Wi-Fi','Máy bảng','Màn hình'];
  const icons=['🖥️','🔀','🖨️','📶','📱','🖼️'];
  nodes.forEach((t,i)=>{const x=pressed(icons[kinds.indexOf(t)]+' '+t,s.pick===i,()=>{
   if(s.pick===null)s.pick=i;
   else if(s.pick===i)s.pick=null;
   else {
    const key=[s.pick,i].sort((a,b)=>a-b).join('-');
    const pos=s.wires.indexOf(key);
    if(pos<0)s.wires.push(key);else s.wires.splice(pos,1);
    s.pick=null;
   }
   u.nextRender();u.root.querySelectorAll('.network-board button')[i]?.focus();
  },'device');board.append(x)});
  const links=h('ul','wire-list');
  s.wires.forEach(key=>{const [a,b]=key.split('-').map(Number);links.append(h('li','',nodes[a]+' '+(edges[key]==='wifi'?'⋯ Wi-Fi ⋯':'⟷ cáp ⟷')+' '+nodes[b]))});
  if(!s.wires.length)links.append(h('li','tiny','Chưa có kết nối.'));
  add(box,board,h('p','field-label','Kết nối hiện có · chọn lại hai thiết bị để gỡ dây'),links,
   u.action('Thử gửi trang in',()=>u.verdict(same([...s.wires].sort(),[...solution].sort()),'Máy in đã nhận trang thử qua mạng đã thiết kế.','Hãy đưa các thiết bị về cùng mạng qua bộ chuyển mạch; máy bảng cần điểm Wi-Fi. Bỏ các đường không phục vụ yêu cầu.')));
 }}
}

function searchCase(title,prompt,goal,type,required,good){
 return {title,prompt,draw(box,s,u){
  s.query??='';s.filter??='Tất cả';s.view??=null;
  const q=input(s.query,v=>s.query=v,{placeholder:'Nhập từ khóa…'});
  const run=()=>{s.view=s.query;s.result=null;u.nextRender();u.root.querySelector('input')?.focus()};
  q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});
  add(box,add(h('div','search-bar'),field('Từ khóa',q),b('Tìm kiếm',run,'btn primary')));
  const tabs=h('div','tool-row');['Tất cả','Hình ảnh','Video','Bài viết'].forEach(t=>tabs.append(pressed(t,s.filter===t,()=>{s.filter=t;s.result=null;u.nextRender();[...u.root.querySelectorAll('.tool-row button')||[]].find(e=>e.textContent===t)?.focus()})));box.append(tabs);
  const list=h('div','search-results');
  if(s.view===null)list.append(h('p','muted','Nhập từ khóa rồi bấm Tìm kiếm.'));
  else {
   const terms=folded(s.view).match(/[a-z0-9]+/g)||[];
   const found=results.map(([t,name,source,keys],i)=>({i,t,name,source,score:terms.filter(x=>folded(keys).split(/[^a-z0-9]+/).includes(x)).length})).filter(r=>r.score>0&&(s.filter==='Tất cả'||s.filter===r.t)).sort((a,b)=>b.score-a.score||a.i-b.i);
   if(!found.length)list.append(h('p','muted','Chưa có kết quả trong mô phỏng. Thử tên đối tượng hoặc ngày cụ thể.'));
   found.forEach(r=>list.append(add(h('article','search-result'),pressed(r.name,s.result===r.i,()=>{s.result=r.i;u.nextRender();[...u.root.querySelectorAll('.search-result button')||[]].find(e=>e.textContent===r.name)?.focus()},'result-title'),h('small','muted',r.t+' · '+r.source))));
  }
  add(box,list,u.action('Nộp kết quả đã chọn',()=>u.verdict(s.result===goal&&s.filter===type&&required.every(t=>(folded(s.view||'').match(/[a-z0-9]+/g)||[]).includes(t)),good,'Kiểm tra lại từ khóa, thẻ kết quả và ngày của nguồn. Truy vấn nên có đối tượng cùng chi tiết mà đề yêu cầu.')));
 }}
}

function replaceCase(title,prompt,original,target){
 return {title,prompt,draw(box,s,u){
  s.text??=original;s.find??='';s.into??='';s.position??=-1;s.history??=[];
  const form=h('div','form-grid');
  const f=input(s.find,v=>{s.find=v;s.position=-1},{placeholder:'Mẫu cần tìm',maxLength:60});
  const r=input(s.into,v=>s.into=v,{placeholder:'Nội dung mới',maxLength:60});
  add(form,field('Tìm',f),field('Thay bằng',r));
  function seek(){return s.find?s.text.indexOf(s.find,s.position<0?0:s.position+s.find.length):-1}
  function mark(){if(!s.find){u.notify('Hãy nhập cụm từ cần tìm.');return}
   const i=seek();s.position=i<0?s.text.indexOf(s.find):i;u.notify(s.position<0?'Không thấy mẫu trong văn bản.':'Đã đánh dấu một kết quả. Kiểm tra ngữ cảnh trước khi thay.')}
  function replace(all){
   if(!s.find||!s.text.includes(s.find)){u.notify('Không có kết quả cho mẫu hiện tại.');return}
   const i=s.position;
   if(!all&&(i<0||s.text.slice(i,i+s.find.length)!==s.find)){u.notify('Bấm Tìm tiếp để đánh dấu đúng một chỗ trước khi thay.');return}
   s.history.push(s.text);
   s.text=all?s.text.split(s.find).join(s.into):s.text.slice(0,i)+s.into+s.text.slice(i+s.find.length);
   s.position=-1;u.notify(all?'Đã thay tất cả vị trí khớp.':'Đã thay vị trí vừa chọn.');
  }
  const tools=add(h('div','tool-row'),b('Tìm tiếp',mark),b('Thay chỗ này',()=>replace(false)),b('Thay tất cả',()=>replace(true)));
  const undo=b('Hoàn tác',()=>{s.text=s.history.pop();s.position=-1;u.notify('Đã hoàn tác lượt thay vừa rồi.')});undo.disabled=!s.history.length;tools.append(undo);
  const doc=h('div','draft-text');
  if(s.position>=0&&s.find){add(doc,document.createTextNode(s.text.slice(0,s.position)),h('mark','',s.find),document.createTextNode(s.text.slice(s.position+s.find.length)))}
  else doc.textContent=s.text;
  add(box,form,tools,doc,u.action('Kiểm tra bản cuối',()=>u.verdict(s.text===target,'Bản thảo khớp yêu cầu; phần cần giữ vẫn nguyên vẹn.','Đọc lại toàn văn. Nếu thay nhầm, hoàn tác và tìm cụm đủ cụ thể hoặc thay từng chỗ.')));
 }}
}

function scratchCase(title,prompt,mode){
 const cases=mode==='sum'?[[3,8,11],[9,0,9]]:[[4,5,'Thiếu'],[4,6,'Đủ'],[4,7,'Đủ']];
 return {title,prompt,draw(box,s,u){
  s.blocks??=[null,null,null];
  const choices=[
   ['Hỏi a → lưu a → hỏi b → lưu b','Hỏi hai lần → lưu cả a, b bằng trả lời cuối','Đặt a và b thành 0'],
   ['Đặt tổng thành a + b','Đặt tổng thành a − b','Đặt tổng thành b'],
   mode==='sum'?['Nói tổng','Nói a','Nói b']:['Nếu tổng ≥ 10: nói Đủ; nếu không: nói Thiếu','Nếu tổng > 10: nói Đủ; nếu không: nói Thiếu','Luôn nói Đủ']
  ];
  const stage=add(h('div','scratch-stage'),h('span','scratch-cat','🐱'),h('span','speech',s.outputs?s.outputs.join(' · '):'Đang chờ bấm cờ xanh…'));
  const script=add(h('div','scratch-script'),h('div','scratch-hat','⚑ Khi bấm cờ xanh'));
  choices.forEach((ops,i)=>script.append(add(h('div','scratch-block sb'+i),field(['Nhập và lưu','Tính toán','Thông báo'][i],select(ops,s.blocks[i],v=>s.blocks[i]=v)))));
  add(box,stage,script,checkTable([['a','b','Kết quả mong đợi'],...cases.map(r=>r.map(String))]),u.action('⚑ Chạy chương trình',()=>{
   if(s.blocks.some(v=>v===null)){u.notify('Lắp đủ cả ba khối trước khi bấm cờ xanh.');return}
   s.outputs=cases.map(([a,b])=>{
    const [enter,op,out]=s.blocks;
    if(enter===1)a=b;else if(enter===2){a=0;b=0}
    const sum=[a+b,a-b,b][op];
    if(mode==='sum')return [sum,a,b][out];
    return out===2?'Đủ':(out===0?sum>=10:sum>10)?'Đủ':'Thiếu';
   });
   u.verdict(same(s.outputs,cases.map(r=>r[2])),'Nhân vật trả lời đúng: '+s.outputs.join(' · ')+'.','Nhân vật nói '+s.outputs.join(' · ')+'. So từng ca, kiểm tra khối lưu dữ liệu, phép tính và điều kiện.');
  }));
 }}
}

 else{
  const deadline=performance.now()+READ_MS;const time=gate.querySelector('.gate-time');
  const tick=()=>{const remain=Math.max(0,deadline-performance.now());time.textContent=Math.ceil(remain/1000)+'s';study.style.setProperty('--read',360*(1-remain/READ_MS)+'deg');
   if(remain){timer=requestAnimationFrame(tick)}else{study.classList.remove('reading');unlock()}};
  study.classList.add('reading');tick();
 }
 focusViewStart(title);
 if(retry)focus(pane.querySelector('h2'));
}
function drawQuestion(q,pane,stage,index){
 const head=add(h('div','question-meta'),h('span','badge',q.id),h('span','tiny',modes[q.type]));
 const prompt=h('h2','question-prompt',q.prompt);
 add(pane,head,prompt);
 if(q.table)pane.append(checkTable(q.table));
 if(q.type==='practice'){drawPractice(q,pane,()=>complete(index,q,pane,true));return}
 const area=h('div','answer-area');pane.append(area);
 const toolbar=h('div','tool-row');pane.append(toolbar);
 const submit=b('Kiểm tra',grade,'btn primary');submit.disabled=true;toolbar.append(submit);
 let valid=()=>false,correct=()=>false;
 const update=()=>submit.disabled=!valid();
 if(q.type==='order'){
  const local=[];const order=stableOrder(q.steps.length,q.id);
  function drawOrder(){
   area.replaceChildren(h('p','muted','Bấm từng bước theo thứ tự. Có thể bỏ bước cuối hoặc xếp lại.'));
   tray(area,order.map(i=>q.steps[i]),local,i=>{local.push(i);drawOrder();focus(area.querySelector('.ordered-tray li:last-child'))},()=>{local.pop();drawOrder();focus(area.querySelector('.ordered-tray'))},()=>{local.splice(0);drawOrder();focus(area.querySelector('.tool-row button'))},'Thứ tự của em');
   update();
  }
  valid=()=>local.length===q.steps.length;
  correct=()=>same(local.map(i=>order[i]),q.sequence);drawOrder();
 }else if(q.type==='match'){
  const chosen=Array(q.items.length).fill(null);
  const order=stableOrder(q.groups.length,q.id);
  q.items.forEach((x,i)=>area.append(field(x,select(order.map(k=>q.groups[k]),null,v=>{chosen[i]=v;update()}))));
  valid=()=>chosen.every(x=>x!==null);correct=()=>same(chosen.map(i=>order[i]),q.assign);
 }else{
  const ids=stableOrder(q.choices.length,q.id),set=new Set(),fields=h('fieldset','answer-options');
  const legend=h('legend','sr-only',q.type==='multi'?'Chọn tất cả phương án đúng':'Chọn một phương án đúng');fields.append(legend);
  ids.forEach((idx,i)=>{
   const f=h('input');f.type=q.type==='multi'?'checkbox':'radio';f.name=q.id;f.value=String(idx);
   f.addEventListener('change',()=>{if(q.type==='choice')set.clear();if(f.checked)set.add(idx);else set.delete(idx);update()});
   fields.append(add(h('label','answer-choice'),f,h('span','letter',String.fromCharCode(65+i)),h('span','',q.choices[idx])));
  });
  area.append(fields);
  valid=()=>set.size>0;correct=()=>same([...set].sort(),[...q.correct].sort());
 }
 function grade(){
  if(attempt?.phase!=='answer'||!valid()||pane!==attempt.pane)return;
  if(correct())complete(index,q,pane,false);
  else wrong(index,q,pane,stage);
 }
}
function drawPractice(q,pane,finish){
 const intro=h('p','muted','Thực hiện trên giấy hoặc trong công cụ phù hợp. Sau đó tự đối chiếu từng tiêu chí. Phần này không được máy chấm.');
 const entry=h('textarea');entry.rows=3;entry.placeholder='Có thể ghi nháp tại đây. Bản nháp sẽ không được lưu.';
 const holder=h('div','practice-rubric');holder.hidden=true;
 const checks=[];
 const submit=b('Ghi nhận đã tự đối chiếu',()=>{if(checks.every(x=>x.checked))finish()},'btn primary');submit.disabled=true;
 q.rubric.forEach(line=>{const e=h('input');e.type='checkbox';e.addEventListener('change',()=>submit.disabled=!checks.every(x=>x.checked));checks.push(e);
  holder.append(add(h('label','rubric-item'),e,h('span','',line)))});
 holder.append(submit);
 const show=b('Mở tiêu chí tự kiểm tra',()=>{holder.hidden=false;show.hidden=true;focus(checks[0])});
 add(pane,intro,field('Ghi nháp nếu cần',entry),show,holder);
}
function disable(pane){pane.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=true)}
function complete(index,q,pane,self){
 if(attempt?.phase!=='answer'||index!==progress.count)return;
 attempt.phase='complete';disable(pane);
 progress.count++;
 if(!self)progress.xp+=progress.tries[index]?10:20;
 if(progress.count%5===0)progress.xp+=30;
 save(lesson.n);
 const end=progress.count%5===0;
 const result=add(h('div','result-card success'),h('strong','',self?'✓ Đã ghi nhận tự đối chiếu':'✓ Chính xác!'),h('p','',self?'Em đã tự kiểm tra bài theo tiêu chí.':q.why));
 result.setAttribute('role','status');
 if(end)result.append(h('p','medal','◇ Huy chương chặng '+(Math.floor(index/5)+1)+' · '+mission.stages[Math.floor(index/5)]));
 const next=b(progress.count===TOTAL?'Xem tổng kết':end?'Về bản đồ chặng':'Sang câu tiếp theo',()=>end?(progress.count===TOTAL?summary():lessonPage()):play(progress.count),'btn primary');
 add(pane,result,next);focus(next);
}
function wrong(index,q,pane,stage){
 attempt.phase='retry';disable(pane);
 progress.tries[index]=(progress.tries[index]||0)+1;save(lesson.n);
 const read=add(h('div','result-card warning'),h('h3','','Đọc lại rồi thử lần nữa'),h('p','',hint(q,stage)),h('p','',stage.text),h('span','tiny','SGK · trang '+lesson.pages));
 const e=h('input');e.type='checkbox';
 const retry=b('Thử lại câu này',()=>play(index,true),'btn primary');retry.disabled=true;
 e.addEventListener('change',()=>retry.disabled=!e.checked);
 add(read,add(h('label','rubric-item'),e,h('span','','Em đã đọc lại tư liệu')),retry);pane.append(read);focus(e);
}
function solution(q){
 if(q.type==='practice')return q.rubric.join(' ');
 if(q.type==='order')return q.sequence.map(i=>q.steps[i]).join(' → ');
 if(q.type==='match')return q.items.map((t,i)=>t+' → '+q.groups[q.assign[i]]).join(' · ');
 return q.correct.map(i=>q.choices[i]).join(' · ');
}
function review(i){
 cancel();attempt=null;
 const s=lesson.stages[i],solved=Math.max(0,Math.min(5,progress.count-5*i));
 const [head,title]=basePanel('BÀI '+number(lesson.n)+' · ÔN TẬP',mission.stages[i],solved+'/5 câu đã hoàn thành.');
 const box=h('div','review-stack');box.append(drawStudy(s,i));
 s.tasks.slice(0,solved).forEach(q=>{
  const item=add(h('details','review-item'),h('summary','',q.id+' · '+q.prompt));
  if(q.table)item.append(checkTable(q.table));
  add(item,h('p','',solution(q)),q.why?h('p','muted',q.why):null);box.append(item);
 });
 if(!solved)box.append(h('p','muted','Lời giải sẽ xuất hiện ở đây sau khi em vượt qua từng câu.'));
 main.replaceChildren(head,box);focusViewStart(title);
}
function extra(){
 cancel();attempt=null;
 const q=lesson.extras[0];
 const [head,title]=basePanel('BÀI '+number(lesson.n)+' · THỰC HÀNH BỔ SUNG','Làm thử ngoài mô phỏng','Tự đối chiếu với tiêu chí khi hoàn thành.');
 const box=add(h('section','question-card'),h('h2','',q.prompt));
 drawPractice(q,box,()=>{
  if(!progress.extras.includes(q.id)){progress.extras.push(q.id);save(lesson.n)}
  disable(box);const result=h('p','result-card success','✓ Đã ghi nhận tự đối chiếu.');box.append(result);focus(result);
 });
 main.replaceChildren(head,box);focusViewStart(title);
}
function summary(){
 cancel();attempt=null;
 const [head,title]=basePanel('BÀI '+number(lesson.n)+' · TỔNG KẾT','Hoàn thành '+mission.title,'Em đã vượt qua đủ 5 chặng.');
 const box=add(h('section','side-card summary-box'),stats(mission),h('p','muted',progress.lab.length+'/2 nhiệm vụ mô phỏng đã đạt.'),b('Mở khu mô phỏng',()=>lab(),'btn primary'),courseLink('Chọn bài khác →','btn subtle'));
 const weak=weakStage();if(weak!==null)box.append(b('Ôn lại '+mission.stages[weak],()=>review(weak)));
 main.replaceChildren(head,box);focusViewStart(title);
}
document.querySelector?.('.skip')?.addEventListener('click',e=>{e.preventDefault();main.scrollIntoView({block:'start'});focus(main)});
window.addEventListener('hashchange',route);
route();

</script>

là thiết bị."},{"id":"T6-B04-C10","prompt":"Hai máy tính và một máy in mạng cùng nối với bộ chuyển mạch. Mạng nội bộ đang hoạt động và máy in đã được cài trên hai máy. Điều nào đúng?","type":"multi","choices":["Hai máy tính có thể gửi lệnh tới máy in","Tắt Internet đồng nghĩa máy in mạng nội bộ phải ngừng hoạt động","Máy in đang nhận lệnh qua đường có dây","Bộ chuyển mạch biến máy in thành thiết bị lưu trữ"],"correct":[0,2],"why":"Máy in nằm trong cùng mạng có dây. Việc in nội bộ có thể tiếp tục khi mất Internet."}]},{"goal":"Áp dụng để kết nối và chia sẻ.","study":{"points":["Mỗi máy bàn dùng cáp cần một đường nối đến thiết bị mạng phù hợp. Thiết bị chỉ có Wi-Fi cần điểm truy cập.","Để chia sẻ tệp, chọn người được đọc hay sửa. Có kết nối mạng chưa đồng nghĩa với có quyền mở mọi tệp.","Khi thêm máy in dùng chung, kiểm tra các thiết bị cần in có thể tìm thấy máy in qua mạng."],"example":"Máy tính bảng nối điểm truy cập Wi-Fi. Điểm truy cập nối bộ chuyển mạch, cùng mạng với máy in có cáp."},"tasks":[{"id":"T6-B04-C11","prompt":"Hai máy đã kết nối mạng; cả lớp cần đọc tài liệu từ một bản cập nhật. Cách nào phù hợp?","type":"choice","choices":["Chia sẻ một tệp với quyền đọc cho lớp","Đổi tên mạng theo tên tệp","Phát từng bản cũ rời nhau","Cắm USB chuyển lần lượt mà không giữ bản chính"],"correct":[0],"why":"Một bản dùng chung giúp mở cùng nội dung."},{"id":"T6-B04-C12","prompt":"Máy tính và máy in có cổng mạng nhưng chưa kết nối. Xếp các bước để thử in qua bộ chuyển mạch.","type":"order","steps":["Gửi một lệnh in thử","Nối máy tính và máy in vào bộ chuyển mạch","Thêm máy in mạng trên máy tính khi hai thiết bị đã vào mạng"],"sequence":[1,2,0],"why":"Cần kết nối trước để máy tính có thể thêm đúng máy in, rồi mới gửi lệnh kiểm tra."},{"id":"T6-B04-C13","prompt":"Máy bảng có Wi-Fi, không có cổng cáp mạng. Thêm gì để máy kết nối không dây với mạng lớp?","type":"choice","choices":["Điểm truy cập Wi-Fi kết nối vào mạng lớp","Màn hình ngoài","Bộ chuyển mạch không có Wi-Fi, dùng một mình","Ổ lưu trữ USB"],"correct":[0],"why":"Điểm truy cập cung cấp kết nối không dây."},{"id":"T6-B04-C14","prompt":"Vẽ sơ đồ hai máy bàn nối bằng cáp qua một bộ chuyển mạch. Ghi nhãn thiết bị đầu cuối và thiết bị kết nối.","type":"practice","rubric":["Hai đầu cuối đúng.","Bộ chuyển mạch và hai dây đúng."]},{"id":"T6-B04-C15","prompt":"Hai máy trong lớp đã nối mạng. Nêu cách để thử rằng cả hai cùng đọc được một tệp của nhóm.","type":"practice","rubric":["Chia sẻ tệp với quyền đọc phù hợp.","Mở đúng tệp từ hai máy và kiểm tra nội dung."]}]},{"goal":"Khoanh vùng lỗi từ dấu hiệu.","study":{"points":["Hãy xác định lỗi ảnh hưởng một máy, cả mạng hay chỉ một tài nguyên. Phạm vi lỗi giúp chọn bước kiểm tra đầu tiên.","Nếu máy báo rút cáp, kiểm tra dây và cổng của máy đó. Nếu báo không có quyền, kiểm tra quyền chia sẻ thay vì thay cáp.","Khi mọi máy còn trao đổi tệp nhưng không tìm được máy in, kiểm tra nguồn và kết nối của máy in trước."],"example":"Máy A mở được tệp X nhưng tệp Y báo không có quyền. Kết nối vẫn hoạt động. Em cần hỏi người quản lí tệp Y về quyền mở."},"tasks":[{"id":"T6-B04-C16","prompt":"Ba máy in được; riêng máy A báo dây mạng bị ngắt. Nên kiểm tra gì trước?","type":"choice","choices":["Dây và cổng kết nối của máy A","Mực của máy in","Dây màn hình của mọi máy","Tắt toàn bộ mạng ngay"],"correct":[0],"why":"Các máy khác in được; A có dấu hiệu lỗi riêng."},{"id":"T6-B04-C17","prompt":"Máy A in qua máy in mạng được, còn máy B vừa bị tuột cáp khỏi cổng mạng. Việc nào phù hợp để kiểm tra riêng máy B?","type":"multi","choices":["Gắn lại cáp của máy B và kiểm tra trạng thái kết nối","Khởi động lại toàn bộ máy của lớp trước","In thử từ máy B sau khi kết nối trở lại","Xóa máy in đã dùng được trên máy A"],"correct":[0,2],"why":"Dấu hiệu cho thấy cần xử lí kết nối của B trước. Lệnh in thử xác nhận B đã dùng được máy in."},{"id":"T6-B04-C18","prompt":"Các máy vẫn trao đổi tệp với nhau nhưng tất cả đều không tìm thấy một máy in mạng. Kiểm tra gì trước?","type":"choice","choices":["Đổi màn hình các máy","Nguồn và kết nối mạng của máy in","Rút dây của tất cả máy đang chia sẻ tệp","Gõ lại tên mọi tệp"],"correct":[1],"why":"Dấu hiệu tập trung ở máy in."},{"id":"T6-B04-C19","prompt":"Máy bảng mất kết nối ở cuối hành lang nhưng dùng được cạnh điểm phát. Nêu giả thuyết và phép thử đơn giản.","type":"practice","rubric":["Tín hiệu yếu ngoài vùng phủ tốt.","Thử lại cùng thiết bị, cùng tác vụ gần điểm phát."]},{"id":"T6-B04-C20","prompt":"Sơ đồ ghi máy B nối bộ chuyển mạch, nhưng dây thật đang cắm sang màn hình qua cổng hình ảnh. Sửa sơ đồ hoặc cách nối để B tham gia mạng có dây.","type":"practice","rubric":["Phân biệt cáp hình ảnh và cáp mạng.","Nối cổng mạng B tới bộ chuyển mạch bằng cáp mạng."]}]},{"goal":"Chọn và kiểm tra mô hình kết nối.","study":{"points":["Bắt đầu từ nhu cầu: thiết bị nào cần nối, dùng cáp hay Wi-Fi, và dùng chung tài nguyên nào.","Vẽ đường nối rõ ràng, rồi thử từ từng loại thiết bị. Kiểm tra cả quyền đọc lẫn quyền sửa khi chia sẻ tệp.","Có thể dùng một máy in mạng cho nhiều nhóm nếu máy in đáp ứng nhu cầu và các nhóm được phép truy cập."],"example":"Thiết kế cho hai máy bàn dùng cáp, một máy bảng dùng Wi-Fi và một máy in chung. Thử in từ máy bàn lẫn máy bảng."},"tasks":[{"id":"T6-B04-C21","prompt":"Phòng có máy bàn cố định và máy bảng di động, cả hai cần in chung. Chọn mô hình nào?","type":"choice","choices":["Chỉ đặt máy in cạnh máy bảng","Mỗi máy dùng một mạng tách biệt không có đường tới máy in","Máy bàn nối cáp; máy bảng nối Wi-Fi cùng mạng với máy in","Chỉ nối cáp máy bàn; để máy bảng ngoại tuyến"],"correct":[2],"why":"Hai loại kết nối có thể đưa thiết bị vào cùng mạng."},{"id":"T6-B04-C22","prompt":"Phòng có máy tính để bàn và máy in mạng dùng cáp, còn máy tính bảng chỉ kết nối Wi-Fi. Muốn cả ba cùng vào mạng nội bộ, cần làm gì?","type":"multi","choices":["Nối máy tính và máy in với bộ chuyển mạch","Nối máy tính bảng bằng dây dù máy không có cổng phù hợp","Cho máy tính bảng vào điểm truy cập của cùng mạng","Đưa máy in sang một mạng khác để dùng chung dễ hơn"],"correct":[0,2],"why":"Máy bàn và máy in dùng cáp; máy tính bảng dùng điểm truy cập nối với cùng mạng nội bộ."},{"id":"T6-B04-C23","prompt":"Trước khi mua máy in riêng cho mỗi nhóm, cách nào tận dụng mạng sẵn có?","type":"choice","choices":["Tháo các thiết bị kết nối","Kết nối mỗi nhóm với một tệp khác","Thử kết nối và chia sẻ một máy in đủ công suất cho các nhóm","Gửi tệp qua USB rồi xóa tệp gốc"],"correct":[2],"why":"Chia sẻ thiết bị giúp tránh mua trùng nếu đáp ứng nhu cầu."},{"id":"T6-B04-C24","prompt":"Vẽ mạng lớp có hai máy bàn dùng cáp, một máy bảng dùng Wi-Fi và máy in dùng chung. Ghi cách thử in từ máy bảng.","type":"practice","rubric":["Hai máy bàn nối đúng.","Điểm Wi-Fi và máy in cùng mạng.","Gửi trang thử từ máy bảng và kiểm tra bản in."]},{"id":"T6-B04-C25","prompt":"Cả lớp cần xem tệp kế hoạch; chỉ tổ trưởng được sửa. Đề xuất cách chia sẻ và hai phép thử với tài khoản khác nhau.","type":"practice","rubric":["Cấp quyền theo vai trò.","Người xem mở được nhưng không sửa.","Tổ trưởng sửa và lưu được bản thử."]}]}],"extras":[]},"1":{"n":1,"title":"Thông tin và dữ liệu","pages":"5–7","stages":[{"goal":"Nhận ra thông tin, dữ liệu và vật mang tin.","study":{"points":["Thông tin là điều em hiểu được từ những gì nhìn, nghe hoặc đọc. Nó có thể giúp em trả lời một câu hỏi hoặc quyết định việc cần làm.","Dữ liệu là dạng biểu diễn thông tin, chẳng hạn số, chữ, hình ảnh hoặc âm thanh.","Vật mang tin là thứ chứa hoặc truyền tải dữ liệu, như tờ giấy, tấm biển hay bộ nhớ."],"example":"Trên tờ thông báo có dòng “Thư viện mở lúc 8 giờ”. Tờ giấy là vật mang tin, dòng chữ là dữ liệu, còn giờ mở cửa là thông tin em hiểu được."},"tasks":[{"id":"T6-B01-C01","prompt":"Thứ gì là vật mang tin?","type":"choice","choices":["Tấm biển tên lớp","Tên gọi “lớp”","Ý hiểu rằng đây là lớp 6A","Dòng chữ “6A”"],"correct":[0],"why":"Tấm biển là vật chứa dòng chữ."},{"id":"T6-B01-C02","prompt":"Dữ liệu nào được biểu diễn bằng âm thanh?","type":"choice","choices":["Bản ghi tiếng trống","Ảnh chiếc trống","Số lần gõ ghi trên bảng","Dòng chữ “đến giờ vào lớp”"],"correct":[0],"why":"Bản ghi lưu tín hiệu âm thanh."},{"id":"T6-B01-C03","prompt":"Những mục nào là dữ liệu mà lớp trưởng đã ghi được trong buổi điểm danh?","type":"multi","choices":["Con số “28” ghi trong ô Có mặt","Bản ghi âm lời báo sĩ số","Cuốn sổ chứa bản ghi","Chiếc máy dùng để ghi âm"],"correct":[0,1],"why":"Con số và tín hiệu âm thanh được ghi lại là dữ liệu. Cuốn sổ và thiết bị là vật mang tin trong tình huống này."},{"id":"T6-B01-C04","prompt":"Thông tin giúp em làm việc gì khi xem thời khóa biểu?","type":"choice","choices":["Tự thay đổi lịch học","Biết cần chuẩn bị sách môn nào","Tăng số tiết trên giấy","Tự xác nhận lớp khác có cùng lịch"],"correct":[1],"why":"Hiểu lịch giúp chuẩn bị đúng sách."},{"id":"T6-B01-C05","prompt":"Dòng chữ “Lối ra” trên biển gồm dữ liệu dạng nào?","type":"choice","choices":["Mùi","Âm thanh","Chữ","Video"],"correct":[2],"why":"Hai từ được biểu diễn bằng chữ."}]},{"goal":"Phân biệt ba vai trò trong ví dụ.","study":{"points":["Cùng một thông tin có thể được biểu diễn bằng nhiều dạng dữ liệu. Một lịch học có thể được viết, đọc thành tiếng hoặc trình bày bằng hình.","Cùng một dữ liệu có thể được hiểu khác nhau nếu thiếu ngữ cảnh. Hãy tìm tên mục, đơn vị hoặc chú thích để xác định ý nghĩa.","Khi phân loại, hỏi lần lượt: vật nào chứa tin, dấu hiệu nào được ghi lại, và em hiểu được điều gì?"],"example":"Số 12 đứng một mình chưa cho biết gì về thời gian. Ghi “12 phút” cho biết thời lượng, còn “12 giờ trưa” cho biết thời điểm."},"tasks":[{"id":"T6-B01-C06","prompt":"Trên tờ giấy có ghi “Thư viện mở lúc 8 giờ”. Vật mang tin và thông tin lần lượt là gì?","type":"choice","choices":["Dòng chữ; tờ giấy","Thư viện; con số 8","Tờ giấy; thư viện mở lúc 8 giờ","Giờ mở cửa; dòng chữ"],"correct":[2],"why":"Giấy mang dòng chữ, người đọc hiểu giờ mở cửa."},{"id":"T6-B01-C07","prompt":"Trên màn hình ở cổng trường có dòng “6A tập trung tại thư viện”. Ghép mỗi mục với vai trò của nó.","type":"match","grouping":false,"items":["Dòng chữ trên màn hình","Ý hiểu rằng lớp 6A phải đến thư viện","Màn hình ở cổng trường"],"groups":["Vật mang tin","Dữ liệu","Thông tin"],"assign":[1,2,0],"why":"Màn hình mang dòng chữ. Người đọc hiểu từ dòng chữ rằng lớp 6A cần tập trung tại thư viện."},{"id":"T6-B01-C08","prompt":"Cùng nhìn ảnh sân ướt, An nghĩ trời vừa mưa, Bình nghĩ sân vừa được tưới. Hai bạn có gì giống nhau?","type":"choice","choices":["Dữ liệu quan sát được","Kết luận về nguyên nhân","Mục đích chụp ảnh","Thông tin chắc chắn về thời tiết"],"correct":[0],"why":"Cùng ảnh nhưng hai cách suy luận khác nhau."},{"id":"T6-B01-C09","prompt":"Tờ lịch và bảng điện tử cùng ghi 12/11. Điều nào có thể thay đổi mà nội dung ngày vẫn giữ nguyên?","type":"choice","choices":["Số ngày được thông báo","Ngày được thông báo","Vật mang tin","Tháng của sự kiện"],"correct":[2],"why":"Đổi vật hiển thị không bắt buộc đổi nội dung."},{"id":"T6-B01-C10","prompt":"Chỉ có dòng “15” trong bản ghi nhiệt độ của nhóm. Những chi tiết nào giúp em biết chính xác con số này nói về phép đo nào?","type":"multi","choices":["Màu viền của phiếu","Đơn vị đo là °C","Tên đối tượng được đo, chẳng hạn nước trong cốc A","Kiểu chữ của số 15"],"correct":[1,2],"why":"Đơn vị cho biết cách đọc giá trị. Tên đối tượng cho biết nhiệt độ đó thuộc vật nào."}]},{"goal":"Áp dụng vào một tình huống cụ thể.","study":{"points":["Đọc cả nhãn và giá trị để lấy thông tin. Trong bảng, đối chiếu tên hàng với tên cột trước khi đọc ô giao nhau.","Thông tin có ích khi phù hợp với việc cần làm. Muốn tìm nơi học, em cần đọc tên phòng thay vì chỉ đọc tên môn.","Có thể chuyển dữ liệu sang dạng khác để người nhận dễ tiếp cận, miễn là giữ đúng nội dung."],"example":"Nếu loa báo “Họp lúc 9 giờ tại phòng 101”, em có thể viết lại đúng nội dung để bạn không nghe được loa vẫn biết nơi và giờ họp."},"tasks":[{"id":"T6-B01-C11","prompt":"Trên lịch lớp ghi “Thứ Tư: Tin học, phòng máy 2”. Em cần biết nơi đến. Chi tiết nào trả lời trực tiếp?","type":"choice","choices":["Vị trí của tờ lịch trên tường","Thứ Tư","Phòng máy 2","Tin học"],"correct":[2],"why":"Tên phòng cho biết nơi đến."},{"id":"T6-B01-C12","prompt":"Xếp các bước từ lúc loa phát “Lớp 6A tập trung ở sân” đến khi một bạn lớp 6A đi đúng nơi.","type":"order","steps":["Đi tới sân","Nghe thông báo","Hiểu lớp mình cần tập trung ở sân"],"sequence":[1,2,0],"why":"Bạn nghe lời báo, hiểu nội dung dành cho lớp mình rồi mới quyết định đi tới sân."},{"id":"T6-B01-C13","prompt":"Trên thẻ mượn sách ghi 15/11 ở cột “Hạn trả”. Đọc được thông tin nào?","type":"choice","choices":["Sách cần được trả vào hoặc trước 15/11","Thẻ được in ngày 15/11","Thư viện đóng cửa ngày 15/11","Sách được mượn đúng ngày 15/11"],"correct":[0],"why":"Tên cột giúp diễn giải ngày."},{"id":"T6-B01-C14","prompt":"Một bảng ở cổng ghi “Lớp 6B học phòng 203”. Chỉ ra vật mang tin, dữ liệu và thông tin giúp một bạn 6B đi đúng phòng.","type":"practice","rubric":["Bảng; dòng chữ có số 203; lớp 6B cần đến phòng 203."]},{"id":"T6-B01-C15","prompt":"Chuyển thông báo miệng “Tập trung lúc 7 giờ tại sân trường” thành tin nhắn. Giữ đủ chi tiết để bạn đến đúng nơi, đúng giờ.","type":"practice","rubric":["Viết thành tin nhắn; giữ 7 giờ; giữ sân trường."]}]},{"goal":"Phát hiện thiếu hoặc hiểu sai ngữ cảnh.","study":{"points":["Khi hai nguồn không khớp, so sánh người gửi, thời điểm và phạm vi áp dụng. Đừng chọn một nguồn chỉ vì em nhìn thấy nó trước.","Cùng một số có thể có nghĩa khác nhau khi đổi đơn vị hoặc đối tượng đo. Không nên bỏ nhãn khi chép dữ liệu.","Nếu dữ liệu thiếu, nêu phần cần xác nhận thay vì điền vào chỗ trống bằng suy đoán."],"example":"Tờ giấy chỉ ghi “Nộp ngày 15”. Em cần hỏi bài nào và ngày 15 của tháng nào trước khi ghi vào lịch."},"tasks":[{"id":"T6-B01-C16","prompt":"Tờ giấy chỉ ghi “Nộp ngày 15”. Học sinh biết có hai môn cùng giao bài. Cần bổ sung gì để tránh nhầm bài và hạn?","type":"choice","choices":["Chỉ chữ “Nộp” in đậm","Tên bài hoặc môn và ngày, tháng đầy đủ","Chỉ màu giấy khác","Chỉ tên người viết"],"correct":[1],"why":"Thiếu cả đối tượng cần nộp và tháng."},{"id":"T6-B01-C17","prompt":"Nhóm dán hai tờ giấy ghi “Tập trung lúc 7 giờ” và “Tập trung lúc 8 giờ” cho cùng một hoạt động. Những cách nào giúp giải quyết mâu thuẫn?","type":"multi","choices":["Chọn tờ có chữ to hơn","Hỏi người phụ trách giờ đã chốt","Thông báo lại giờ đã xác nhận và gỡ tờ cũ","Lấy 7 giờ 30 vì nằm giữa hai giờ"],"correct":[1,2],"why":"Cần xác nhận nội dung đúng rồi thay thông báo cũ để tránh người đọc hiểu hai giờ khác nhau."},{"id":"T6-B01-C18","prompt":"Hai bảng ghi 24: một bảng đo nhiệt độ, một bảng đếm người. Vì sao không thể gộp thành hai phép đo giống nhau?","type":"choice","choices":["Hai số giống nhau thì bắt buộc cùng ý nghĩa","Chỉ bảng nhiệt độ là vật mang tin","Dữ liệu dạng số không dùng để đếm","Đơn vị và đối tượng đo khác nhau"],"correct":[3],"why":"Giá trị số giống nhau vẫn có thể mang ý nghĩa khác."},{"id":"T6-B01-C19","prompt":"Bạn đọc “25” trên tờ ghi chép và kết luận “lớp có 25 học sinh”. Chỉ ra điều chưa đủ và cách ghi để kết luận có căn cứ.","type":"practice","rubric":["Chỉ ra thiếu nhãn/ngữ cảnh.","Đề xuất ghi “Sĩ số lớp …: 25 học sinh” khi đã kiểm tra con số."]},{"id":"T6-B01-C20","prompt":"Tờ giấy ghi “họp thứ Sáu” nhưng loa thông báo “thứ Năm”. Nêu hai việc cần xác minh trước khi nhắn lại.","type":"practice","rubric":["Xác định hai thông báo có cùng lớp/sự kiện/ngày tuần không.","Hỏi người phụ trách hoặc đối chiếu thông báo mới nhất."]}]},{"goal":"Tạo thông báo và kiểm tra khả năng sử dụng.","study":{"points":["Một thông báo cần đủ các chi tiết để người nhận hành động: ai, làm gì, khi nào, ở đâu. Với thay đổi, nêu rõ thông tin mới.","Chọn cách trình bày theo người nhận. Bảng phù hợp khi nhiều nhóm có nhiều mốc khác nhau, còn chữ lớn và bản đọc hỗ trợ các nhu cầu khác nhau.","So bản em viết với nguồn và đọc lại từ góc nhìn người nhận. Người mới đọc phải hiểu mà không cần đoán."],"example":"Lớp 6B chuyển tiết Tin sáng thứ Tư từ phòng 201 sang phòng 204. Thông báo phải ghi cả lớp, tiết, buổi và phòng mới."},"tasks":[{"id":"T6-B01-C21","prompt":"Lớp 6A đổi phòng tiết Tin thứ Hai từ 203 sang 205. Tin nào giúp người nhận hành động đúng?","type":"choice","choices":["Thứ Hai có phòng 205.","6A: tiết Tin thứ Hai chuyển từ phòng 203 sang 205.","Phòng 203 có thay đổi.","6A chuyển phòng; xem lại lịch cũ."],"correct":[1],"why":"Tin nêu đủ lớp, tiết, ngày và phòng mới."},{"id":"T6-B01-C22","prompt":"Chọn các cách truyền đủ cùng một thông tin “6A đến thư viện lúc 7 giờ 15”.","type":"multi","choices":["Phát qua loa đúng lớp, nơi và giờ","Treo ảnh thư viện chỉ có chú thích “7 giờ 15”","Gửi tin nhắn ghi đủ lớp, nơi và giờ","Chỉ chiếu số “7:15” trên màn hình dùng chung"],"correct":[0,2],"why":"Lời phát qua loa và tin nhắn mang cùng nội dung vì đều nêu lớp, nơi và giờ."},{"id":"T6-B01-C23","prompt":"Cần thông báo cho cả bạn khiếm thính và bạn khó đọc chữ nhỏ. Phương án nào phục vụ cả hai?","type":"choice","choices":["Chỉ phát tờ chữ nhỏ","Chỉ phát bản đọc","Dòng chữ lớn và bản đọc cùng nội dung","Chỉ gửi ảnh vật trang trí"],"correct":[2],"why":"Hai cách biểu diễn cùng thông tin giúp nhiều người tiếp nhận."},{"id":"T6-B01-C24","prompt":"Soạn một thông báo tập trung cho lớp 6C lúc 7 giờ 15 ngày 20/11 ở sân trường. Nêu vật hoặc phương tiện sẽ mang thông báo và một cách kiểm tra người nhận hiểu đúng.","type":"practice","rubric":["Đủ lớp, ngày, giờ, nơi.","Vật/phương tiện phù hợp.","Kiểm tra được giờ và nơi người nhận hiểu."]},{"id":"T6-B01-C25","prompt":"Một nhiệt kế hiển thị 38 °C. Viết hai cách biểu diễn cùng nội dung, rồi nêu vì sao cần ghi rõ đang đo thân nhiệt hay nhiệt độ ngoài trời.","type":"practice","rubric":["Biểu diễn thứ nhất; biểu diễn khác dạng; giải thích khác đối tượng làm đổi ý nghĩa của giá trị."]}]}],"extras":[]},"7":{"n":7,"title":"Tìm kiếm thông tin trên Internet","pages":"28–31","stages":[{"goal":"Phân biệt công cụ tìm kiếm, từ khóa và kết quả.","study":{"points":["Máy tìm kiếm giúp tìm thông tin từ từ khóa. Từ khóa là chữ hoặc cụm chữ mô tả điều em cần tìm.","Kết quả có thể gồm liên kết, hình ảnh, video và đoạn mô tả. Kết quả đầu tiên chưa chắc phù hợp nhất.","Phân biệt ô từ khóa với nội dung trang kết quả. Đọc tiêu đề và đoạn mô tả để chọn nơi mở."],"example":"Muốn tìm cách trồng rau mầm, nhập “cách trồng rau mầm trong khay” rồi xem những trang được gợi ý."},"tasks":[{"id":"B07-C01","prompt":"Công cụ nào giúp tìm thông tin theo từ khóa?","type":"choice","choices":["Trình soạn thảo văn bản","Máy tính bỏ túi","Máy tìm kiếm","Phần mềm vẽ"],"correct":[2],"why":"Máy tìm kiếm truy xuất thông tin liên quan đến từ khóa."},{"id":"B07-C02","prompt":"Nhận xét nào đúng về các dạng kết quả tìm kiếm?","type":"choice","choices":["Chỉ có thể là văn bản.","Chỉ có thể là ảnh.","Chỉ có thể là địa chỉ của máy tìm kiếm.","Có thể gồm liên kết, hình ảnh hoặc video."],"correct":[3],"why":"Kết quả có thể gồm liên kết, hình ảnh hoặc video."},{"id":"B07-C03","prompt":"Từ hoặc cụm từ em nhập để mô tả điều cần tìm gọi là gì?","type":"choice","choices":["Tên miền","Từ khóa","Đoạn mô tả","Tiêu đề kết quả"],"correct":[1],"why":"Từ khóa thể hiện nhu cầu tìm kiếm."},{"id":"B07-C04","prompt":"Ghép mỗi mục với vai trò.","type":"match","choices":["1–X · 2–Y · 3–Z","1–Z · 2–Y · 3–X","1–Y · 2–X · 3–Z","1–X · 2–Z · 3–Y"],"correct":[2],"why":"Công cụ nhận từ khóa rồi trả kết quả.","items":["Máy tìm kiếm","Từ khóa","Kết quả"],"groups":["Nội dung mô tả điều cần tìm","Công cụ xử lí truy vấn","Danh sách tìm được"],"assign":[1,0,2]},{"id":"B07-C05","prompt":"Những mục nào có thể xuất hiện trên trang kết quả?","type":"multi","choices":["Liên kết bài viết","Ảnh thu nhỏ","Dây sạc","Đoạn mô tả"],"correct":[0,1,3],"why":"Trang kết quả hiển thị các nội dung số."}]},{"goal":"Chọn từ khóa cụ thể và thẻ phù hợp với dạng thông tin.","study":{"points":["Từ khóa tốt có đối tượng chính và chi tiết phân biệt, chẳng hạn tên trường, địa điểm, thời gian hoặc loại thông tin.","Nếu có quá nhiều kết quả, thêm chi tiết cần thiết. Nếu không thấy kết quả, bỏ bớt từ không quan trọng hoặc dùng cách gọi khác.","Chọn thẻ Hình ảnh hoặc Video khi em cần đúng loại nội dung đó."],"example":"Thay từ “lịch” bằng “lịch hội sách thư viện A tháng 11”. Nếu cần ảnh hoa sen trắng, nhập tên hoa và chọn thẻ Hình ảnh."},"tasks":[{"id":"B07-C06","prompt":"Em tìm giờ mở cửa của Thư viện tỉnh Bắc Ninh vào cuối tuần. Từ khóa nào thể hiện rõ cả nơi và nội dung cần tìm?","type":"multi","choices":["thư viện","giờ mở cửa cuối tuần Thư viện tỉnh Bắc Ninh","Thư viện tỉnh Bắc Ninh lịch mở cửa thứ Bảy Chủ nhật","bản đồ Bắc Ninh"],"correct":[1,2],"why":"Hai cụm từ khóa nêu tên thư viện, thông tin cần tìm và khoảng thời gian cụ thể."},{"id":"B07-C07","prompt":"Phân loại các từ khóa khi cần tìm cách trồng đậu xanh trong cốc. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["1 – 1 – 1","2 – 2 – 1","1 – 2 – 2","1 – 2 – 1"],"correct":[3],"why":"Chi tiết về loại cây và vật chứa làm rõ mục tiêu.","grouping":true,"items":["Cây","Cách trồng đậu xanh trong cốc","Trồng cây"],"groups":["Quá rộng","Sát nhu cầu"],"assign":[0,1,0]},{"id":"B07-C08","prompt":"Em cần lịch triển lãm sách tại Bắc Ninh tháng 11. Chi tiết nào nên có trong từ khóa?","type":"multi","choices":["Triển lãm sách","Bắc Ninh","Tháng 11","Màu cặp sách"],"correct":[0,1,2],"why":"Ba chi tiết xác định sự kiện, nơi và thời gian."},{"id":"B07-C09","prompt":"Em cần tìm hình ảnh hoa sen trắng, không cần video hay bài viết. Chọn truy vấn và thẻ kết quả phù hợp.","type":"choice","choices":["hoa sen trắng → Video","hoa sen trắng → Hình ảnh","cây sen → Tin tức","hoa màu trắng → Bản đồ"],"correct":[1],"why":"Từ khóa đủ cụ thể và thẻ Hình ảnh lọc đúng loại nội dung."},{"id":"B07-C10","prompt":"Tìm “cầu” ra nhiều kết quả về môn thể thao. Em muốn biết cây cầu Long Biên được xây năm nào. Tìm lại thế nào?","type":"choice","choices":["Cầu Long Biên xây năm nào","Thể thao cầu","Lịch sử các cây cầu ở Việt Nam","Cầu đẹp"],"correct":[0],"why":"Tên riêng và chi tiết cần tìm giúp loại kết quả lệch chủ đề."}]},{"goal":"Thực hiện tìm kiếm và mở kết quả phù hợp.","study":{"points":["Quy trình cơ bản là mở máy tìm kiếm, nhập từ khóa, gửi truy vấn rồi đọc kết quả và mở trang phù hợp.","Với máy tìm kiếm hỗ trợ ngoặc kép, đặt cả cụm cần tìm trong một cặp ngoặc để tìm theo đúng thứ tự từ.","Đoạn mô tả chỉ là phần trích. Hãy mở nguồn để đọc đoạn liên quan trước khi dùng thông tin."],"example":"Nhập “Bảo tàng Bắc Ninh” trong một cặp ngoặc kép nếu em cần cụm từ đó liền nhau. Sau đó mở kết quả có nguồn và nội dung phù hợp."},"tasks":[{"id":"B07-C11","prompt":"Xếp các bước tìm thông tin.","type":"order","choices":["3 → 1 → 4 → 2","3 → 2 → 4 → 1","3 → 1 → 2 → 4","1 → 3 → 2 → 4"],"correct":[1],"why":"Nhập truy vấn trước khi yêu cầu công cụ tìm.","steps":["Đọc danh sách kết quả","Nhập từ khóa","Mở máy tìm kiếm","Nhấn Enter"],"sequence":[2,1,3,0]},{"id":"B07-C12","prompt":"Máy tìm kiếm hỗ trợ dấu ngoặc kép. Em nhập thế nào để tìm đúng cụm từ Bảo tàng Bắc Ninh?","type":"choice","choices":["bảo tàng","“Bảo tàng” “Bắc Ninh”","Bắc Ninh bảo","“Bảo tàng Bắc Ninh”"],"correct":[3],"why":"Ngoặc kép yêu cầu tìm cụm từ liền nhau."},{"id":"B07-C13","prompt":"Ghép mục tiêu với thao tác phù hợp.","type":"match","choices":["1–Z · 2–Y · 3–X","1–Y · 2–X · 3–Z","1–X · 2–Y · 3–Z","1–Y · 2–Z · 3–X"],"correct":[3],"why":"Mỗi thao tác phục vụ một mục tiêu khác nhau.","items":["Xem hình minh họa","Tìm cụm chính xác","Xem bài gốc"],"groups":["Mở liên kết","Chọn mục Hình ảnh","Đặt cụm trong ngoặc kép"],"assign":[1,2,0]},{"id":"B07-C14","prompt":"Cần nội quy mượn sách. Chọn kết quả nên mở trước.","type":"choice","choices":["Thư viện trường – Nội quy mượn và trả sách","Sách mới tháng 11","Cuộc thi vẽ bìa sách","Thư viện trường – Danh sách bạn đọc"],"correct":[0],"why":"Tiêu đề cho biết trang đề cập trực tiếp nội quy."},{"id":"B07-C15","prompt":"Nhóm cần ảnh chụp thật về cây bàng ở sân trường để minh họa. Kết quả nào đáng mở xem trước?","type":"multi","choices":["Trang album hoạt động có chú thích “Cây bàng ở sân trường”","Bài chỉ giải nghĩa tên cây bàng và không có ảnh","Kết quả hình ảnh có mô tả “Ảnh chụp cây bàng trong sân trường”","Video hướng dẫn vẽ cây bàng bằng bút chì"],"correct":[0,2],"why":"Hai kết quả có dấu hiệu phù hợp với loại tư liệu cần tìm. Mở ra để kiểm tra hình và nguồn trước khi dùng."}]},{"goal":"Nhận ra truy vấn chưa hiệu quả và biết sửa.","study":{"points":["Khi truy vấn ra nhiều kết quả không liên quan, xem chi tiết nào còn thiếu. Thêm tên riêng, phạm vi hoặc năm để thu hẹp.","Khi không có kết quả, bỏ ngoặc kép nếu không cần đúng nguyên văn. Có thể thử từ đồng nghĩa hoặc cách viết khác.","Xem ngày đăng và ngày sự kiện. Bài đăng có tiêu đề đúng nhưng của năm trước có thể không giúp cho việc hiện tại."],"example":"Tìm “lịch thi” thấy nhiều trường. Thêm tên trường và học kì rồi đối chiếu ngày trên trang trước khi ghi lịch."},"tasks":[{"id":"B07-C16","prompt":"Ghép dấu hiệu với cách xử lí.","type":"match","choices":["1–Z · 2–Y · 3–X","1–Y · 2–Z · 3–X","1–X · 2–Z · 3–Y","1–Y · 2–X · 3–Z"],"correct":[2],"why":"Chọn cách sửa theo dấu hiệu cụ thể.","items":["Nhiều kết quả về các tỉnh khác","Gõ “thư việbn”","Chỉ thấy lịch năm trước"],"groups":["Thêm tên tỉnh","Thêm năm cần tìm","Sửa lỗi gõ"],"assign":[0,2,1]},{"id":"B07-C17","prompt":"Tìm “lịch thi” cho nhiều trường khác. Em nên thêm gì để tìm đúng?","type":"multi","choices":["Tên trường","Khối lớp","Học kì hoặc năm học","Tên món ăn"],"correct":[0,1,2],"why":"Ba chi tiết giúp khoanh vùng lịch thi."},{"id":"B07-C18","prompt":"Tìm cả câu dài trong ngoặc kép không ra kết quả. Em chỉ cần biết chủ đề chính. Thử gì trước?","type":"choice","choices":["Dùng vài từ khóa chính, bỏ ngoặc kép","Gõ lại y nguyên","Thêm nhiều từ nữa","Đổi sang một chủ đề khác"],"correct":[0],"why":"Bớt ràng buộc có thể tìm được trang diễn đạt khác."},{"id":"B07-C19","prompt":"Xếp các chỉnh sửa theo mục đích. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["2 – 2 – 1","1 – 1 – 1","1 – 2 – 1","1 – 2 – 2"],"correct":[2],"why":"Thêm chi tiết thường làm kết quả tập trung hơn.","grouping":true,"items":["Thêm tên trường","Bỏ một chi tiết chưa chắc chắn","Thêm năm học"],"groups":["Thu hẹp","Mở rộng"],"assign":[0,1,0]},{"id":"B07-C20","prompt":"Bản tin kết quả có tiêu đề đúng nhưng ngày đăng năm ngoái. Em cần lịch năm nay. Làm gì?","type":"choice","choices":["Thêm năm nay vào từ khóa và kiểm tra ngày của kết quả","Chọn kết quả nhiều ảnh nhất","Dùng bài cũ vì tiêu đề khớp","Dùng lịch cũ"],"correct":[0],"why":"Đúng chủ đề vẫn cần đúng thời gian."}]},{"goal":"Đối chiếu nguồn, thời gian và phạm vi trước khi dùng.","study":{"points":["Đối chiếu đơn vị đăng, ngày cập nhật và phạm vi thông báo. Ưu tiên nguồn trực tiếp phụ trách sự kiện hoặc dịch vụ cần tìm.","Khi hai nguồn khác nhau, mở thông báo gốc để xem thông tin nào hiện hành. Ghi lại tên nguồn và đường dẫn.","Nếu muốn dùng ảnh trong sản phẩm, kiểm tra điều kiện sử dụng và ghi nguồn khi được phép."],"example":"Lịch mở cửa thường lệ có thể thay đổi trong đợt sửa chữa. Hãy tìm thông báo tạm thời đúng thư viện và đúng ngày cần đến."},"tasks":[{"id":"B07-C21","prompt":"Nhóm tìm lịch chiếu phim tại thư viện vào thứ Bảy 21/11. Kết quả đầu là bài cũ, kết quả sau là thông báo mới của thư viện. Chọn các căn cứ giúp xác định đúng lịch.","type":"multi","choices":["Lịch ghi đúng thứ Bảy 21/11 của đợt này","Bài đứng đầu danh sách kết quả","Lịch đăng trên kênh chính thức của thư viện","Tiêu đề có nhiều biểu tượng hơn"],"correct":[0,2],"why":"Thời gian của sự kiện và nguồn công bố có giá trị hơn vị trí hay kiểu trình bày của kết quả."},{"id":"B07-C22","prompt":"Hai kết quả ghi giờ khác nhau. Nên kiểm tra gì?","type":"multi","choices":["Đơn vị đăng","Ngày cập nhật","Đúng cơ sở hay không","Kết quả có nhiều biểu tượng hay không"],"correct":[0,1,2],"why":"Các yếu tố này giúp xác định thông tin có áp dụng được."},{"id":"B07-C23","prompt":"Xếp quy trình tìm và ghi lại lịch triển lãm.","type":"order","choices":["2 → 3 → 4 → 1","1 → 2 → 3 → 4","3 → 1 → 4 → 2","1 → 2 → 4 → 3"],"correct":[0],"why":"Tìm, mở nguồn, kiểm tra rồi lưu lại.","steps":["Ghi lịch kèm liên kết nguồn","Nhập từ khóa có tên triển lãm và địa điểm","Mở trang ban tổ chức","Đối chiếu ngày và địa điểm"],"sequence":[1,2,3,0]},{"id":"B07-C24","prompt":"Em muốn dùng một ảnh tìm được trong sản phẩm lớp. Em làm gì?","type":"choice","choices":["Kiểm tra nguồn, điều kiện sử dụng và ghi nguồn","Bỏ tên tác giả","Cho rằng ảnh tìm được đều dùng tự do","Dùng ảnh rồi chỉ ghi “lấy từ Internet”"],"correct":[0],"why":"Tìm thấy ảnh không tự động cấp quyền sử dụng."},{"id":"B07-C25","prompt":"Website ban tổ chức cập nhật chuyển giờ khai mạc từ 8 giờ sang 9 giờ. Bài đăng cũ vẫn hiện đầu trang tìm kiếm. Em báo gì?","type":"choice","choices":["8 giờ 30 vì ở giữa hai mốc","8 giờ vì kết quả đứng đầu","9 giờ theo ảnh chia sẻ trong nhóm, không kiểm tra thông báo","9 giờ theo thông báo cập nhật, kèm liên kết"],"correct":[3],"why":"Bản cập nhật của ban tổ chức trực tiếp thay đổi giờ khai mạc."}]}],"extras":[{"id":"B07-TH01","prompt":"Tìm thông báo hoạt động ở trường bằng hai truy vấn: truy vấn rộng và truy vấn thêm tên trường, thời gian. Ghi hai truy vấn và chọn một kết quả dùng được, kèm liên kết và lí do.","type":"practice","rubric":["Hai truy vấn có khác biệt rõ.","Dẫn đúng nguồn, đối chiếu thời gian và đối tượng.","Giải thích kết quả phù hợp; nếu chưa có, ghi cách thu hẹp hoặc xác minh tiếp."]}]},"15":{"n":15,"title":"Thuật toán","pages":"63–66","stages":[{"goal":"Nhận biết thuật toán và cách mô tả.","study":{"points":["Thuật toán là dãy bước rõ ràng để giải một nhiệm vụ. Đầu vào là dữ liệu đã có, đầu ra là kết quả cần nhận.","Có thể mô tả bằng lời hoặc sơ đồ khối. Mũi tên chỉ thứ tự thực hiện.","Trong sơ đồ khối thông dụng, hình chữ nhật biểu diễn bước xử lí, hình bình hành biểu diễn nhập hoặc xuất dữ liệu."],"example":"Tính tổng hai số: nhập hai số, cộng chúng rồi xuất tổng. Hai số là đầu vào, tổng là đầu ra."},"tasks":[{"id":"T6-B15-C01","prompt":"Thuật toán là gì?","type":"choice","choices":["Bất kì danh sách đồ vật","Dãy bước rõ ràng để giải một nhiệm vụ","Chỉ dữ liệu được đưa vào","Chỉ kết quả cuối cùng"],"correct":[1],"why":"Cần có các bước thực hiện."},{"id":"T6-B15-C02","prompt":"Thông tin được cho trước khi chạy gọi là gì?","type":"choice","choices":["Bước in","Đầu vào","Kết thúc","Đầu ra"],"correct":[1],"why":"Đầu vào là dữ liệu ban đầu."},{"id":"T6-B15-C03","prompt":"Thuật toán nhận chiều dài và chiều rộng rồi đưa ra chu vi và diện tích hình chữ nhật. Những giá trị nào là đầu ra?","type":"multi","choices":["Chiều dài được nhập","Chu vi tính được","Chiều rộng được nhập","Diện tích tính được"],"correct":[1,3],"why":"Chiều dài và chiều rộng là dữ liệu cho trước. Chu vi và diện tích là kết quả thuật toán tạo ra."},{"id":"T6-B15-C04","prompt":"Trong sơ đồ khối, mũi tên dùng để làm gì?","type":"choice","choices":["Thay đầu vào bằng đầu ra","Chỉ hướng thực hiện tiếp","Chứa mọi kết quả","Đánh dấu lỗi chính tả"],"correct":[1],"why":"Mũi tên nối các bước theo thứ tự."},{"id":"T6-B15-C05","prompt":"Hình chữ nhật trong sơ đồ khối thường biểu diễn gì?","type":"choice","choices":["Bắt đầu hoặc kết thúc","Bước xử lí","Điều kiện đúng hay sai","Đầu vào hoặc đầu ra"],"correct":[1],"why":"Hình chữ nhật dùng cho bước thực hiện."}]},{"goal":"Phân biệt đầu vào, đầu ra và bước xử lí.","study":{"points":["Tách ba phần: nhập dữ liệu, xử lí và xuất kết quả. Viết đủ dữ liệu cần cho phép tính.","Một bước rõ ràng phải cho biết làm gì, với giá trị nào. “Làm cho xong” chưa đủ để người khác thực hiện giống em.","Cùng một thuật toán có thể được viết bằng câu hoặc vẽ thành sơ đồ nếu thứ tự và các phép xử lí tương ứng."],"example":"Đổi phút thành giây: đầu vào là số phút, xử lí bằng phép nhân 60, đầu ra là số giây."},"tasks":[{"id":"T6-B15-C06","prompt":"Tính chu vi hình vuông từ cạnh a. Đầu vào và đầu ra là gì?","type":"choice","choices":["Chu vi và độ dài a","Tên tệp và diện tích","Số 4 và tên hình","Độ dài a và chu vi"],"correct":[3],"why":"Cạnh được cho; chu vi cần tính."},{"id":"T6-B15-C07","prompt":"Thuật toán đổi số phút m sang số giây s. Ghép từng thành phần với vai trò.","type":"match","grouping":false,"items":["Kết quả s mà thuật toán đưa ra","Số phút m được nhập","Phép tính s = m × 60"],"groups":["Đầu vào","Bước xử lí","Đầu ra"],"assign":[2,0,1],"why":"Thuật toán nhận m, tính s bằng cách nhân m với 60, rồi đưa ra s."},{"id":"T6-B15-C08","prompt":"Mô tả “Làm cho xong bài” chưa đủ vì sao?","type":"choice","choices":["Không nêu các bước rõ để thực hiện","Có quá nhiều đầu ra cụ thể","Vì dùng tiếng Việt","Chỉ vì không vẽ hình"],"correct":[0],"why":"Có thể dùng lời, nhưng phải rõ bước."},{"id":"T6-B15-C09","prompt":"Hình bình hành “Nhập a, b” có vai trò gì?","type":"choice","choices":["Đánh giá điều kiện","Đưa dữ liệu vào","Kết thúc","Tính tổng"],"correct":[1],"why":"Hình bình hành biểu diễn vào/ra; từ “Nhập” xác định vai trò vào."},{"id":"T6-B15-C10","prompt":"Hai bản mô tả đều phải tính tổng số sách của hai tổ. Để kiểm tra bản liệt kê và bản sơ đồ khối mô tả cùng thuật toán, cần đối chiếu điều gì?","type":"multi","choices":["Dữ liệu hai bản nhận vào","Các bước xử lí và thứ tự của chúng","Màu chữ và khung có giống nhau không","Kết quả mà hai bản đưa ra"],"correct":[0,1,3],"why":"Hai cách biểu diễn có thể khác hình thức. Nội dung cần khớp ở dữ liệu vào, các bước và kết quả ra."}]},{"goal":"Lần theo dãy bước hoặc sơ đồ.","study":{"points":["Lần theo thứ tự các bước. Ghi giá trị mới sau mỗi phép tính rồi mới chuyển sang bước tiếp theo.","Giữ tên biến nhất quán, chẳng hạn a là dữ liệu nhập và p là kết quả. Xuất giá trị của biến cần trả lời.","Chạy thử với một bộ số nhỏ mà em tính tay được để kiểm tra thứ tự."],"example":"Nhập 5, cộng 2 được 7, rồi nhân kết quả với 3 được 21. Giá trị xuất ra là 21."},"tasks":[{"id":"T6-B15-C11","prompt":"Nhập 7 và 5; cộng hai số; xuất tổng. Kết quả là gì?","type":"choice","choices":["35","2","12","75"],"correct":[2],"why":"7 + 5 = 12."},{"id":"T6-B15-C12","prompt":"Thuật toán tính trung bình cộng của hai số a và b. Xếp các bước sao cho mỗi bước chỉ dùng giá trị đã có.","type":"order","steps":["Chia tổng vừa tính cho 2 để có kết quả","Đưa ra kết quả","Nhập a và b","Tính tổng a + b"],"sequence":[2,3,0,1],"why":"Phải có a và b trước khi tính tổng, có tổng trước khi chia và có kết quả trước khi đưa ra."},{"id":"T6-B15-C13","prompt":"Cần tính tổng số sách của hai tổ. Thứ tự nào đúng?","type":"choice","choices":["Cộng, thông báo, nhập","Thông báo, cộng, nhập","Nhập hai số, cộng, thông báo tổng","Nhập, thông báo, cộng"],"correct":[2],"why":"Phải có dữ liệu trước khi tính và tính trước khi báo."},{"id":"T6-B15-C14","prompt":"Sơ đồ chạy lần lượt: nhập 4, cộng 3, nhân kết quả với 2, rồi xuất kết quả. Sau mỗi phép tính em nhận được số nào?","type":"practice","rubric":["Sau cộng là 7.","Sau nhân và khi xuất là 14."]},{"id":"T6-B15-C15","prompt":"Viết dãy bước đổi số giờ nguyên thành số phút. Chạy thử với 3 giờ.","type":"practice","rubric":["Nhập giờ, nhân 60, xuất phút.","180 phút."]}]},{"goal":"Phát hiện bước sai, thiếu hoặc sai thứ tự.","study":{"points":["Nếu kết quả sai, tìm bước đầu tiên khác với phép tính tay. Kiểm tra thứ tự, dữ liệu còn thiếu và phép toán.","Không xuất biến trước khi tính nó. Không cộng khi bài toán cần nhân, và không chia trung bình trước khi có tổng.","Sau khi sửa, chạy lại ca đã sai và thử một ca khác để chắc đã sửa đúng nguyên nhân."],"example":"Muốn tính trung bình của 6 và 10, cộng thành 16 rồi chia 2 được 8. Nếu bỏ bước cộng, kết quả sẽ sai."},"tasks":[{"id":"T6-B15-C16","prompt":"Sơ đồ xuất tổng trước bước cộng. Sửa thế nào?","type":"choice","choices":["Xóa bước cộng","Giữ thứ tự rồi đổi màu khối","Đưa bước nhập xuống cuối","Đưa bước xuất xuống sau bước cộng"],"correct":[3],"why":"Kết quả phải có trước khi xuất."},{"id":"T6-B15-C17","prompt":"Thuật toán cần đổi phút sang giây nhưng lại cộng 60. Với đầu vào 2, thuật toán cho 62. Chọn các nhận định đúng.","type":"multi","choices":["Kết quả mong đợi là 120 giây","Cần thay phép cộng bằng phép nhân số phút với 60","Đổi nhãn đầu ra từ “giây” sang “phút” là đủ để sửa","Cần thêm 60 một lần nữa vào kết quả 62"],"correct":[0,1],"why":"Hai phút có 2 × 60 = 120 giây. Lỗi nằm ở phép tính, không nằm ở nhãn."},{"id":"T6-B15-C18","prompt":"Tính chu vi từ chiều dài và rộng nhưng chỉ nhập chiều dài. Thiếu gì?","type":"choice","choices":["Dữ liệu chiều rộng","Một bước xuất thứ hai","Tên người vẽ","Số màu"],"correct":[0],"why":"Cả hai kích thước cần cho phép tính."},{"id":"T6-B15-C19","prompt":"Thuật toán diện tích hình chữ nhật nhập dài 5, rộng 3; cộng hai số; xuất 8. Tìm lỗi và sửa.","type":"practice","rubric":["Sai ở bước cộng.","Nhân 5 × 3, xuất 15."]},{"id":"T6-B15-C20","prompt":"Sơ đồ ghi “Nhập 2 số → chia cho 2 → xuất trung bình”. Nêu bước thiếu và kiểm tra với 6, 10.","type":"practice","rubric":["Cần tính tổng rồi chia tổng cho 2.","Kết quả 8."]}]},{"goal":"Mô tả thuật toán và thử với dữ liệu mới.","study":{"points":["Từ đề bài, viết rõ đầu vào, đầu ra và cách tính. Chọn thứ tự xử lí rồi mới lập sơ đồ hoặc chạy thử.","Chọn ít nhất hai bộ số. Thêm trường hợp biên nếu có, như không còn chỗ trống hoặc hai giá trị bằng nhau.","So kết quả chạy với kết quả tính tay. Nếu khác, sửa phép xử lí hoặc thứ tự khối."],"example":"Có 20 ghế, 13 ghế đã có người thì còn 7. Nếu đủ 20 người thì còn 0. Hai ca giúp kiểm tra phép trừ."},"tasks":[{"id":"T6-B15-C21","prompt":"Cần biết số chỗ còn trống, có tổng chỗ và số đã đăng kí. Mô tả nào đủ?","type":"choice","choices":["Lấy đăng kí trừ tổng rồi xuất","Cộng hai số và xuất","Nhập hai số, lấy tổng chỗ trừ đã đăng kí, xuất chỗ trống","Chỉ nhập rồi xuất tổng chỗ"],"correct":[2],"why":"Cần số còn lại, không phải tổng hoặc hiệu đảo."},{"id":"T6-B15-C22","prompt":"Thuật toán tính số ghế trống bằng tổng số ghế trừ số người đã ngồi. Chọn các ca có cả đầu vào hợp lệ và kết quả đúng.","type":"multi","choices":["20 ghế, 13 người đã ngồi → 7 ghế trống","20 ghế, 20 người đã ngồi → 0 ghế trống","20 ghế, 0 người đã ngồi → 20 ghế trống","20 ghế, 13 người đã ngồi → 33 ghế trống"],"correct":[0,1,2],"why":"Ba ca đúng kiểm tra còn ghế, vừa kín chỗ và chưa có người ngồi. Không cộng số ghế với số người."},{"id":"T6-B15-C23","prompt":"Tính tổng 2 chai mỗi bạn cho n bạn. Sơ đồ đúng cần thứ tự nào?","type":"choice","choices":["Nhập n → tính 2 × n → xuất tổng","Nhập n → xuất 2 → tính n","Nhập n → chia 2 → xuất tổng","Xuất n → nhập n → cộng 2"],"correct":[0],"why":"Mỗi bạn đóng góp hai chai."},{"id":"T6-B15-C24","prompt":"Vẽ sơ đồ tính số ghế trống từ số ghế và số người ngồi, giả sử số người không vượt số ghế. Thử (20, 13) và (20, 20).","type":"practice","rubric":["Sơ đồ đủ vào, xử lí, ra và mũi tên.","Phép trừ đúng.","7 và 0."]},{"id":"T6-B15-C25","prompt":"Viết thuật toán tính số trang cần đọc mỗi ngày khi số trang chia hết cho số ngày. Thử (60, 5) và (60, 3).","type":"practice","rubric":["Xác định vào và ra.","Chia số trang cho số ngày dương.","12 và 20."]}]}],"extras":[]},"9":{"n":9,"title":"An toàn thông tin trên Internet","pages":"37–41","stages":[{"goal":"Nhận diện nguy cơ và quy tắc an toàn.","study":{"points":["Thông tin cá nhân như địa chỉ nhà, mật khẩu và mã đăng nhập cần được bảo vệ. Chỉ cung cấp thông tin cần thiết qua kênh đã xác minh.","Rủi ro trên mạng gồm tin giả, phần mềm độc hại, lừa lấy tài khoản và bắt nạt. Hành vi chế giễu hoặc đe dọa lặp lại có thể gây tổn thương.","Dùng mật khẩu dài, khó đoán và riêng cho từng tài khoản. Không gặp riêng người chỉ quen trên mạng."],"example":"Người lạ hẹn em gặp và yêu cầu giữ bí mật. Em từ chối và báo một người lớn đáng tin."},"tasks":[{"id":"T6-B09-C01","prompt":"Mục nào cần giữ riêng?","type":"choice","choices":["Mật khẩu hộp thư","Tên một loài cây","Tên một tỉnh","Tên một môn học"],"correct":[0],"why":"Mật khẩu bảo vệ quyền truy cập tài khoản."},{"id":"T6-B09-C02","prompt":"Tin nhắn nào có dấu hiệu bắt nạt?","type":"choice","choices":["Gửi tài liệu theo yêu cầu","Chúc mừng sinh nhật","Nhắc giờ học lịch sự","Liên tục chế giễu và đe dọa bạn"],"correct":[3],"why":"Chế giễu và đe dọa có thể gây tổn thương."},{"id":"T6-B09-C03","prompt":"Những thông tin nào cần giữ kín khi dùng tài khoản học tập?","type":"multi","choices":["Mật khẩu đăng nhập","Tên môn học","Mã xác nhận đăng nhập vừa nhận","Tên công cụ soạn thảo"],"correct":[0,2],"why":"Mật khẩu và mã xác nhận có thể dùng để truy cập tài khoản. Không cung cấp hai thông tin này cho người khác."},{"id":"T6-B09-C04","prompt":"Việc nào giúp bảo vệ tài khoản?","type":"choice","choices":["Dùng mật khẩu dài, khó đoán và riêng cho tài khoản","Ghi mật khẩu vào bài đăng","Dùng tên lớp làm mật khẩu","Dùng chung mật khẩu cả nhóm"],"correct":[0],"why":"Mật khẩu riêng và khó đoán làm giảm nguy cơ bị đoán hoặc lộ dây chuyền."},{"id":"T6-B09-C05","prompt":"Phần mềm độc hại có thể gây hậu quả nào?","type":"choice","choices":["Làm hỏng hoặc lấy cắp dữ liệu","Tự sửa mọi lỗi","Tăng quyền riêng tư","Bảo đảm thông tin đúng"],"correct":[0],"why":"Phần mềm độc hại có thể gây mất an toàn dữ liệu."}]},{"goal":"Giải thích dấu hiệu và biện pháp phù hợp.","study":{"points":["Nhiều lượt chia sẻ không chứng minh thông tin đúng. Hãy xem ai đăng, thời điểm và nguồn gốc.","Ảnh có thể tiết lộ tên, trường, địa chỉ hoặc số điện thoại. Xin phép người trong ảnh và kiểm tra chi tiết nhạy cảm trước khi đăng.","Không mở tệp cài đặt hoặc tệp đính kèm bất ngờ từ người lạ. Xác minh người gửi qua kênh đã biết."],"example":"Trước khi đăng ảnh lớp, em nhận ra một bảng tên có số điện thoại. Hãy xin phép và che số trước khi chia sẻ."},"tasks":[{"id":"T6-B09-C06","prompt":"Bạn thân xin mật khẩu để làm hộ bài. Vì sao vẫn không nên đưa?","type":"choice","choices":["Đổi hình nền sẽ bảo vệ được dữ liệu","Bạn cùng lớp nên tài khoản tự khóa","Người khác có thể đọc dữ liệu và hành động bằng tài khoản em","Mật khẩu chỉ dùng cho máy tính ở trường"],"correct":[2],"why":"Chia sẻ mật khẩu là chia sẻ quyền truy cập."},{"id":"T6-B09-C07","prompt":"Phân loại các hành động trong nhóm học trực tuyến.","type":"match","grouping":true,"items":["Đăng ảnh thẻ học sinh có địa chỉ nhà vào nhóm công khai","Đăng xuất tài khoản trên máy dùng chung","Gửi mật khẩu vào nhóm chat","Che thông tin cá nhân trước khi đăng ảnh"],"groups":["Giúp bảo vệ thông tin","Làm lộ thông tin"],"assign":[1,0,1,0],"why":"Đăng xuất và che thông tin làm giảm nguy cơ lộ dữ liệu. Mật khẩu và địa chỉ nhà không nên đưa vào nhóm công khai."},{"id":"T6-B09-C08","prompt":"Bạn đăng ảnh có bảng tên và số điện thoại. Điều nào có thể xảy ra?","type":"choice","choices":["Chỉ người chụp mới thấy thông tin","Người ngoài có thể nhận diện và liên lạc ngoài ý muốn","Ảnh tự ẩn mọi chữ","Đăng ảnh làm số điện thoại tự đổi"],"correct":[1],"why":"Ảnh có thể để lộ thông tin cá nhân."},{"id":"T6-B09-C09","prompt":"Nhận tệp cài đặt ngoài dự kiến từ người lạ. Dấu hiệu nào đáng ngờ nhất?","type":"choice","choices":["Tên tệp có một chữ viết hoa","Tên tệp ngắn","Nguồn không rõ và em không yêu cầu tệp","Thư đến vào buổi sáng"],"correct":[2],"why":"Nên kiểm tra nguồn qua kênh đáng tin trước khi mở."},{"id":"T6-B09-C10","prompt":"Tin nhắn tự xưng là của nhà trường yêu cầu em “xác nhận ngay để không mất tài khoản”. Dấu hiệu nào đáng cảnh giác?","type":"multi","choices":["Tin nhắn yêu cầu nhập mật khẩu qua đường dẫn lạ","Tin nhắn gọi đúng tên trường nên chắc chắn đáng tin","Tin nhắn thúc ép làm ngay và dọa khóa tài khoản","Tin nhắn được bạn khác chuyển tiếp nên đã được xác minh"],"correct":[0,2],"why":"Liên kết lạ đòi mật khẩu và lời đe dọa gây áp lực đều là dấu hiệu đáng ngờ. Tên trường hoặc người chuyển tiếp không xác thực người gửi."}]},{"goal":"Chọn hành động an toàn trong từng tình huống.","study":{"points":["Với tin xin mã hoặc mật khẩu, không bấm liên kết và không cung cấp dữ liệu. Nếu chưa rõ, hỏi người lớn hoặc liên hệ nơi được nhắc đến bằng kênh chính thức.","Khi bị xúc phạm hay đe dọa, không đáp trả. Giữ bằng chứng riêng nếu an toàn, chặn hoặc báo cáo và nhờ người lớn giúp.","Trên máy dùng chung, không lưu mật khẩu. Đăng xuất khỏi tài khoản sau khi dùng."],"example":"Tin “gửi mã để nhận quà” đòi dữ liệu đăng nhập. Em giữ kín mã và báo người lớn thay vì thử gửi."},"tasks":[{"id":"T6-B09-C11","prompt":"Một tin yêu cầu gửi mã đăng nhập để nhận quà. Em làm gì?","type":"choice","choices":["Chụp mã đăng lên nhóm","Thử bằng tài khoản bạn","Không gửi mã; báo người lớn tin cậy","Gửi mã rồi hỏi sau"],"correct":[2],"why":"Mã đăng nhập phải giữ kín."},{"id":"T6-B09-C12","prompt":"Tài khoản lạ gửi yêu cầu cung cấp mã đăng nhập. Xếp các bước để báo cho người lớn và xử lí theo hướng dẫn.","type":"order","steps":["Làm theo hướng dẫn chặn hoặc báo cáo tài khoản","Dừng tương tác và không gửi mã","Báo cho người lớn tin cậy về tin nhắn vừa nhận"],"sequence":[1,2,0],"why":"Giữ kín mã và dừng tương tác trước. Sau đó báo người lớn để được hướng dẫn xử lí."},{"id":"T6-B09-C13","prompt":"Một người liên tục nhắn xúc phạm. Phản ứng nào phù hợp?","type":"choice","choices":["Đáp trả bằng lời xúc phạm","Dừng đáp trả, lưu bằng chứng để báo người lớn, chặn/báo cáo","Công khai thông tin riêng của họ","Gửi thêm ảnh cá nhân"],"correct":[1],"why":"Giảm tiếp xúc và nhờ hỗ trợ."},{"id":"T6-B09-C14","prompt":"Viết hai câu em có thể nói với người lớn khi nhận tin nhắn đe dọa trong trò chơi.","type":"practice","rubric":["Mô tả sự việc.","Xin trợ giúp và đề nghị cho xem bằng chứng riêng."]},{"id":"T6-B09-C15","prompt":"Trước khi gửi ảnh nhóm cho lớp, chỉ ra hai việc kiểm tra liên quan đến quyền riêng tư.","type":"practice","rubric":["Xin phép người có mặt; che/bỏ chi tiết riêng tư hoặc hạn chế đúng người xem."]}]},{"goal":"Phân tích dấu hiệu rủi ro và cách kiểm chứng.","study":{"points":["Ảnh đại diện và tên quen không chứng minh người gửi là thật. Hỏi trực tiếp qua kênh lớp hoặc số liên hệ đã lưu.","Nếu đã nhập mật khẩu ở nơi đáng ngờ, báo người lớn hoặc người quản lí ngay. Đổi mật khẩu trên dịch vụ chính thức và kiểm tra các phiên đăng nhập với người hỗ trợ.","Nếu ảnh đăng nhầm dữ liệu riêng, hạn chế người xem hoặc gỡ ảnh và báo người phụ trách. Không chuyển tiếp ảnh để cảnh báo."],"example":"Một tài khoản giống tên cô giáo gửi liên kết xin mật khẩu. Em hỏi cô qua kênh lớp đã biết để xác minh."},"tasks":[{"id":"T6-B09-C16","prompt":"Tin nhắn hiện ảnh cô giáo nhưng đòi nhập mật khẩu ở liên kết lạ. Cách xác minh nào đáng tin?","type":"choice","choices":["Chuyển liên kết cho cả lớp bấm thử","Hỏi đúng tài khoản vừa gửi rồi nhập mật khẩu","Hỏi cô qua số hoặc kênh lớp đã biết","Tin ảnh đại diện và mở ngay"],"correct":[2],"why":"Kênh đã biết tránh dựa vào chính nơi đáng ngờ."},{"id":"T6-B09-C17","prompt":"Một bạn đã nhập mật khẩu tài khoản học tập vào trang giả. Khi vẫn còn truy cập được tài khoản, bạn nên làm gì?","type":"multi","choices":["Vào trang chính thức bằng địa chỉ đã biết để đổi mật khẩu","Gửi lại mật khẩu vào trang giả để thử xem có bị lưu không","Báo cho giáo viên hoặc người quản lí tài khoản","Đăng mật khẩu cũ lên nhóm lớp để cảnh báo"],"correct":[0,2],"why":"Đổi mật khẩu qua kênh chính thức giúp bảo vệ tài khoản. Báo người phụ trách để được hỗ trợ kiểm tra và xử lí."},{"id":"T6-B09-C18","prompt":"Bạn vô tình công khai số điện thoại trong ảnh lớp. Bước nào giúp giảm lộ thông tin ngay?","type":"choice","choices":["Chỉ đổi tên ảnh","Hạn chế hoặc gỡ ảnh, báo người phụ trách","Nhờ nhiều nhóm chia sẻ tiếp","Đăng lại ảnh để hỏi ý kiến"],"correct":[1],"why":"Hạn chế khả năng người khác tiếp tục xem."},{"id":"T6-B09-C19","prompt":"Tài khoản lạ mạo danh bạn, yêu cầu ảnh thẻ học sinh và giục giữ bí mật. Nêu hai dấu hiệu và cách xử lí.","type":"practice","rubric":["Nêu hai dấu hiệu như đòi ảnh riêng tư, giục giữ bí mật.","Không gửi, xác minh độc lập và báo người lớn."]},{"id":"T6-B09-C20","prompt":"Bạn đã nhập mật khẩu vào trang đáng ngờ. Nêu hai việc ưu tiên sau khi rời trang.","type":"practice","rubric":["Báo người lớn/người quản lí ngay.","Đổi mật khẩu qua dịch vụ chính thức và kiểm tra phiên đăng nhập với người hỗ trợ."]}]},{"goal":"Tổng hợp cách bảo vệ và hỗ trợ người khác.","study":{"points":["Chỉ chia sẻ thông tin cần thiết và trong phạm vi được phép. Xin phép trước khi đăng ảnh người khác.","Khi cần nhờ giúp, lưu bằng chứng riêng để người lớn hoặc quản trị viên xử lí. Tránh phát tán lại nội dung gây hại.","Muốn xác nhận một tin liên quan tới trường, mở kênh chính thức thay vì điền dữ liệu vào bài đăng lạ."],"example":"Bảng thi đua có số liên lạc. Trước khi đăng, tạo bản chỉ có những cột được phép công bố và kiểm tra lại."},"tasks":[{"id":"T6-B09-C21","prompt":"Một bạn bị đe dọa trong nhóm, tin còn chứa địa chỉ nhà. Cách nào bảo vệ bạn và giúp xử lí?","type":"choice","choices":["Chụp và đăng lên nhóm khác","Xóa bằng chứng trước khi nói với người lớn","Thách người đe dọa gặp mặt","Giữ bằng chứng riêng để báo người lớn, không chuyển tiếp công khai"],"correct":[3],"why":"Chia sẻ riêng đúng người hỗ trợ giảm việc phát tán địa chỉ."},{"id":"T6-B09-C22","prompt":"Nhóm chuẩn bị đăng ảnh tổng kết công khai. Chọn các cách giúp bảo vệ thông tin của người trong ảnh.","type":"multi","choices":["Hỏi ý kiến người có mặt trước khi chia sẻ ảnh nhận diện được họ","Che số điện thoại và địa chỉ nếu chúng vô tình lọt vào ảnh","Đăng cả danh sách số điện thoại vì chỉ để minh họa","Dùng ảnh khác được phép chia sẻ nếu ảnh gốc lộ thông tin khó che"],"correct":[0,1,3],"why":"Xin phép và loại bỏ thông tin riêng tư trước khi đăng. Có thể thay ảnh khi không xử lí được phần lộ thông tin."},{"id":"T6-B09-C23","prompt":"Một bài đăng yêu cầu số điện thoại để xem lịch nghỉ học. Em làm gì để biết lịch chính xác và giữ kín số điện thoại?","type":"choice","choices":["Nhập số rồi xóa bài","Không nhập số; kiểm tra lịch trên kênh chính thức của trường","Chuyển tiếp để cả lớp kiểm tra hộ","Tin ngay vì tiêu đề nói về trường"],"correct":[1],"why":"Xác minh thông tin mà không để lộ dữ liệu."},{"id":"T6-B09-C24","prompt":"Lập hướng dẫn ba bước cho bạn gặp tài khoản lạ giả danh giáo viên, gửi liên kết và yêu cầu mật khẩu.","type":"practice","rubric":["Không bấm/không cung cấp.","Kiểm tra qua kênh trường đã biết.","Báo người lớn hoặc quản trị viên và lưu bằng chứng riêng."]},{"id":"T6-B09-C25","prompt":"Soạn quy tắc cho nhóm lớp về đăng ảnh và xử lí bình luận xúc phạm. Có cách báo cáo cụ thể.","type":"practice","rubric":["Xin phép và hạn chế chi tiết riêng tư.","Không đáp trả/phát tán.","Báo giáo viên hoặc quản trị viên và gửi bằng chứng riêng."]}]}],"extras":[]},"3":{"n":3,"title":"Thông tin trong máy tính","pages":"12–15","stages":[{"goal":"Nhận ra đơn vị và cách biểu diễn trong máy tính.","study":{"points":["Bit là đơn vị thông tin nhỏ nhất trong máy tính và có hai giá trị là 0 hoặc 1. Một byte bằng 8 bit.","Máy tính biểu diễn chữ, hình và âm thanh dưới dạng các dãy bit theo quy ước.","KB, MB và GB dùng để nói về dung lượng. GB lớn hơn MB, MB lớn hơn KB. Dung lượng trống quyết định em còn lưu được bao nhiêu."],"example":"Dãy 10110010 có 8 bit, tức 1 byte. USB và thẻ nhớ là các thiết bị dùng để lưu tệp."},"tasks":[{"id":"T6-B03-C01","prompt":"Bit có thể mang giá trị nào?","type":"choice","choices":["Mọi chữ cái","1 hoặc 2","0 hoặc 1","Bất kì số nguyên nào"],"correct":[2],"why":"Hai trạng thái được biểu diễn bằng 0 và 1."},{"id":"T6-B03-C02","prompt":"Một byte gồm mấy bit?","type":"choice","choices":["4","2","16","8"],"correct":[3],"why":"Một byte bằng 8 bit."},{"id":"T6-B03-C03","prompt":"Những dãy nào gồm toàn các kí hiệu có thể dùng trong dãy bit?","type":"multi","choices":["01010","12001","11100","10A01"],"correct":[0,2],"why":"Mỗi bit chỉ có thể là 0 hoặc 1. Các kí hiệu 2 và A không phải giá trị của bit."},{"id":"T6-B03-C04","prompt":"Đơn vị nào lớn hơn MB?","type":"choice","choices":["KB","Byte","GB","Bit"],"correct":[2],"why":"GB biểu thị lượng dữ liệu lớn hơn MB."},{"id":"T6-B03-C05","prompt":"Thiết bị nào thường dùng để lưu và mang tệp sang máy khác?","type":"choice","choices":["Máy chiếu","Chuột","USB lưu trữ","Loa"],"correct":[2],"why":"USB lưu trữ giữ dữ liệu để dùng trên máy khác."}]},{"goal":"Đọc biểu diễn và so sánh dung lượng.","study":{"points":["Muốn đọc dãy bit cần biết quy ước. Cùng dãy 01 có thể mang ý nghĩa khác trong hai bảng mã khác nhau.","Khi đọc mã theo nhóm, đếm đúng số bit của mỗi kí hiệu rồi đọc lần lượt. Khi mã hóa hình, đọc theo thứ tự hàng và cột đã quy định.","Phân biệt dung lượng của thiết bị với lượng dữ liệu chiếm chỗ của tệp hay thư mục."],"example":"Nếu sáng là 1 và tắt là 0, ba đèn theo thứ tự tắt, sáng, sáng được ghi là 011."},"tasks":[{"id":"T6-B03-C06","prompt":"Quy ước sáng = 1, tắt = 0. Dãy sáng, tắt, sáng biểu diễn thế nào?","type":"choice","choices":["110","101","010","011"],"correct":[1],"why":"Đổi từng trạng thái theo đúng thứ tự."},{"id":"T6-B03-C07","prompt":"Ghép mỗi lượng dữ liệu với cách ghi tương đương. Trong câu này lấy 1 KB = 1024 B và 1 MB = 1024 KB.","type":"match","grouping":false,"items":["1 KB","1 MB","1 B"],"groups":["8 bit","1024 B","1024 KB"],"assign":[2,0,1],"why":"Một byte bằng 8 bit. Theo quy ước của câu, 1024 B là 1 KB và 1024 KB là 1 MB."},{"id":"T6-B03-C08","prompt":"Vì sao cùng dãy 01 có thể biểu diễn hai ý khác nhau trong hai bài?","type":"choice","choices":["Bit 0 luôn có hai giá trị cùng lúc","Hai bài có thể dùng bảng mã khác nhau","Dãy bit tự mang nghĩa cố định","Dãy ngắn không thể biểu diễn dữ liệu"],"correct":[1],"why":"Bảng mã quy định ý nghĩa của dãy."},{"id":"T6-B03-C09","prompt":"Thiết bị ghi 16 GB; thư mục ghi 12 MB. Hai số dùng để mô tả gì?","type":"choice","choices":["Sức chứa thiết bị và lượng dữ liệu của thư mục","Số tệp thiết bị chứa và số tệp thư mục","Tốc độ mạng và thời gian tải","Thời gian dùng và thời gian tạo"],"correct":[0],"why":"Đây là hai giá trị dung lượng, ở hai đơn vị khác nhau."},{"id":"T6-B03-C10","prompt":"Một hàng có 4 ô, mã hóa từ trái sang phải với ô đen là 1, ô trắng là 0. Với mã 1010, nhận định nào đúng?","type":"multi","choices":["Ô thứ nhất màu đen","Ô thứ hai màu đen","Ô thứ ba màu đen","Ô thứ tư màu trắng"],"correct":[0,2,3],"why":"Đọc từng bit từ trái sang phải được đen, trắng, đen, trắng."}]},{"goal":"Mã hóa, giải mã và tính dung lượng đơn giản.","study":{"points":["Để mã hóa nhiều kí hiệu, tra mã từng kí hiệu rồi nối theo thứ tự. Để giải mã, tách đúng độ dài mỗi mã trước khi tra.","Đổi bit sang byte bằng cách chia cho 8 khi số bit chia hết cho 8.","Khi chép nhiều tệp, cộng dung lượng của tất cả tệp và so với phần còn trống. Kiểm tra cùng đơn vị."],"example":"Với X = 00 và Y = 11, chuỗi YXY được ghi là 11 00 11. Hai tệp 3 MB và 4 MB cần ít nhất 7 MB trống."},"tasks":[{"id":"T6-B03-C11","prompt":"Mã X = 00, Y = 01, Z = 10. Chuỗi YZX là gì?","type":"choice","choices":["010010","011000","001001","100100"],"correct":[1],"why":"Ghép 01, 10, 00."},{"id":"T6-B03-C12","prompt":"Xếp các bước để giải mã dãy 101001 thành ảnh có 2 hàng, mỗi hàng 3 ô, tô lần lượt từ trên xuống. Biết 1 là đen, 0 là trắng và mã được ghi theo thứ tự đó.","type":"order","steps":["Tô hàng dưới theo nhóm thứ hai","Chia dãy thành hai nhóm 101 và 001","Tô hàng trên theo nhóm thứ nhất"],"sequence":[1,2,0],"why":"Tách đủ 3 bit cho mỗi hàng rồi dùng 101 ở hàng trên, 001 ở hàng dưới."},{"id":"T6-B03-C13","prompt":"Dãy 16 bit chiếm mấy byte nếu chỉ tính dãy bit đó?","type":"choice","choices":["8 byte","2 byte","1 byte","16 byte"],"correct":[1],"why":"16 chia 8 bằng 2."},{"id":"T6-B03-C14","prompt":"Mã trắng = 0, đen = 1. Viết mã cho hai hàng ô: trắng–đen–đen; đen–trắng–đen. Ghi rõ mã từng hàng.","type":"practice","rubric":["011 và 101."]},{"id":"T6-B03-C15","prompt":"Thẻ còn 15 MB. Em chép hai tệp 6 MB và 4 MB; còn bao nhiêu? Tệp tiếp theo 7 MB có chép được không?","type":"practice","rubric":["Còn 5 MB.","Không, vì 7 > 5."]}]},{"goal":"Phát hiện lỗi bảng mã, cách tách nhóm và đơn vị.","study":{"points":["Nếu hai kí hiệu dùng chung một mã, người đọc không biết mã ấy đại diện cho kí hiệu nào. Mỗi kí hiệu phải có mã riêng.","Với mã dài 2 bit, một dãy có số bit lẻ có thể đã bị thiếu hoặc thừa bit. Hãy kiểm tra dãy trước khi giải mã.","Khi so dung lượng, đổi cùng đơn vị. Khi chép tệp, so với dung lượng trống thay vì dung lượng ghi trên vỏ thiết bị."],"example":"Thẻ 8 GB chỉ còn 20 MB trống. Dù thẻ có dung lượng lớn, tệp 25 MB vẫn chưa chép vừa nếu không giải phóng chỗ."},"tasks":[{"id":"T6-B03-C16","prompt":"Bảng mã A = 00, B = 00, C = 10. Lỗi gì xuất hiện khi đọc 00?","type":"choice","choices":["Không phân biệt A với B","Không thể đọc C","Mọi mã phải dài 8 bit","Không phân biệt A với C"],"correct":[0],"why":"A và B trùng mã."},{"id":"T6-B03-C17","prompt":"Lan dùng quy ước 1 là đen, 0 là trắng. Bình đọc cùng dãy nhưng tô màu ngược. Những việc nào giúp hai bạn tìm và sửa lỗi?","type":"multi","choices":["Đổi chiều đọc mà không đối chiếu quy ước","Kiểm tra hai bạn đã thống nhất ý nghĩa của 0 và 1 chưa","Thử cùng một hàng mẫu 10 và so vị trí ô đen","Thêm một số 0 vào cuối dãy để màu tự khớp"],"correct":[1,2],"why":"Cùng một dãy cho ảnh khác nếu quy ước màu khác nhau. Hàng mẫu giúp phát hiện ngay cách đọc ngược."},{"id":"T6-B03-C18","prompt":"Bạn so 900 KB với 2 MB và nói 900 lớn hơn 2 nên tệp đầu lớn hơn. Sửa gì?","type":"choice","choices":["Chỉ đổi tên hai tệp","Đổi về cùng đơn vị trước khi so","So số chữ số","Nhân cả hai số với 2, giữ nguyên đơn vị"],"correct":[1],"why":"Phải xét đơn vị, không chỉ số đứng trước đơn vị."},{"id":"T6-B03-C19","prompt":"Bảng mã A = 00, B = 01, C = 10. Bạn giải 0100 thành AC. Khoanh nhóm bit và sửa kết quả.","type":"practice","rubric":["Tách 01 và 00.","BA."]},{"id":"T6-B03-C20","prompt":"Một USB ghi 8 GB nhưng máy báo chỉ còn trống 30 MB. Bạn cần chép tệp 40 MB. Giải thích vì sao nhìn nhãn 8 GB chưa đủ.","type":"practice","rubric":["8 GB là dung lượng toàn thiết bị.","Chỉ còn 30 MB, thiếu 10 MB."]}]},{"goal":"Kết hợp quy ước và kiểm tra bằng ví dụ mới.","study":{"points":["Khi tạo bảng mã, chọn đủ số mã khác nhau và giữ độ dài nhất quán để dễ tách khi đọc.","Để người khác dựng lại ảnh từ bit, gửi cả dãy bit, quy ước màu, số ô mỗi hàng và thứ tự đọc.","Nếu phải giữ một số tệp, cộng dung lượng của chúng trước rồi tính dung lượng còn lại cho các tệp khác."],"example":"Ảnh đen trắng 3 cột có hai hàng 101 và 010. Nếu quy ước 1 là đen, hàng đầu có hai ô đen ở hai đầu."},"tasks":[{"id":"T6-B03-C21","prompt":"Cần mã hóa bốn màu khác nhau bằng các mã dài bằng nhau. Phương án nào đủ và không trùng?","type":"choice","choices":["00, 01, 10, 11","1, 10, 11, 100","00, 01, 01, 11","0, 1, 0, 1"],"correct":[0],"why":"Bốn mã 2 bit khác nhau đủ cho bốn màu."},{"id":"T6-B03-C22","prompt":"Thiết bị còn trống 5 MB. Có ảnh 2 MB, đoạn ghi âm 3 MB và video 4 MB. Những gói tệp nào vừa dung lượng trống?","type":"multi","choices":["Ảnh và đoạn ghi âm","Ảnh và video","Chỉ video","Đoạn ghi âm và video"],"correct":[0,2],"why":"Ảnh và âm thanh dùng đúng 5 MB. Video đứng riêng dùng 4 MB. Hai gói còn lại cần 6 hoặc 7 MB."},{"id":"T6-B03-C23","prompt":"Nhóm chia sẻ dãy bit cho ảnh đen trắng. Kèm gì để người khác dựng lại đúng?","type":"choice","choices":["Quy ước màu, số ô mỗi hàng và thứ tự đọc","Chỉ số lượng bit 1","Chỉ tên tệp ảnh","Chỉ số lượng màu"],"correct":[0],"why":"Cần cả cách giải màu và cách xếp vị trí."},{"id":"T6-B03-C24","prompt":"Đặt bảng mã dài 2 bit cho ba kí hiệu N, T, V, rồi mã hóa VNT và tách lại để kiểm tra.","type":"practice","rubric":["Ba mã 2 bit khác nhau.","Ghép đúng VNT theo bảng.","Tách và giải lại đúng."]},{"id":"T6-B03-C25","prompt":"Bộ nhớ còn 18 MB. Bắt buộc chép bản trình bày 6 MB và âm thanh 5 MB. Chọn giữa ảnh A 8 MB và ảnh B 7 MB để chép thêm một ảnh; giải thích.","type":"practice","rubric":["Còn 7 MB sau tệp bắt buộc.","Chọn B vừa đủ.","A vượt 1 MB."]}]}],"extras":[]},"16":{"n":16,"title":"Các cấu trúc điều khiển","pages":"67–70","stages":[{"goal":"Nhận ra tuần tự, rẽ nhánh và lặp.","study":{"points":["Tuần tự là thực hiện các bước theo thứ tự. Rẽ nhánh chọn bước dựa vào điều kiện. Lặp thực hiện một nhóm bước nhiều lần.","Hình thoi trong sơ đồ khối ghi điều kiện cần kiểm tra. Hai nhánh có thể biểu diễn kết quả đúng và sai.","Rẽ nhánh dạng đủ nêu việc cho cả hai trường hợp. Dạng thiếu chỉ nêu việc cần làm khi điều kiện đúng."],"example":"“Nếu mưa thì mang áo mưa, nếu không thì mang mũ” là rẽ nhánh dạng đủ. “Vỗ tay 5 lần” là lặp."},"tasks":[{"id":"T6-B16-C01","prompt":"“Mở hộp, lấy bút, đóng hộp” là cấu trúc nào?","type":"choice","choices":["Rẽ nhánh","Tuần tự","Lặp","Không có thứ tự"],"correct":[1],"why":"Các việc lần lượt, không có lựa chọn hay lặp."},{"id":"T6-B16-C02","prompt":"“Nếu mưa thì mang áo mưa” dùng gì?","type":"choice","choices":["Chỉ tuần tự","Lặp","Định dạng","Rẽ nhánh"],"correct":[3],"why":"Điều kiện mưa quyết định có làm hay không."},{"id":"T6-B16-C03","prompt":"Những mô tả nào dùng cấu trúc lặp?","type":"multi","choices":["Vỗ tay đúng 5 lần","Nếu mưa thì mang áo mưa","Khi còn vở chưa phát, tiếp tục phát từng quyển","Mở hộp, lấy bút rồi đóng hộp"],"correct":[0,2],"why":"Vỗ tay nhiều lần và phát vở cho đến khi hết đều lặp lại một thao tác. Hai mô tả kia dùng rẽ nhánh hoặc tuần tự."},{"id":"T6-B16-C04","prompt":"Khối hình thoi ghi điều gì?","type":"choice","choices":["Điều kiện cần kiểm tra","Tên tệp","Chỉ tên thuật toán","Phép in"],"correct":[0],"why":"Điều kiện cho đường đúng/sai."},{"id":"T6-B16-C05","prompt":"Câu nào có rẽ nhánh đủ hai trường hợp?","type":"choice","choices":["Gõ cửa ba lần","Nếu mở cửa thì vào, nếu không thì đợi","Vào rồi ngồi","Ghi tên và cất bút"],"correct":[1],"why":"Cả đúng và sai đều có việc riêng."}]},{"goal":"Phân biệt đường đi và điều kiện.","study":{"points":["Đọc chính xác điều kiện. “Ít nhất 5” gồm cả 5, còn “lớn hơn 5” không gồm 5.","Vòng lặp kiểm tra trước có thể chạy 0 lần nếu điều kiện sai ngay từ đầu. Khi điều kiện không còn đúng thì thoát.","“Nếu còn bài thì làm một bài” xét một lần. “Trong khi còn bài, làm một bài” kiểm tra lại sau mỗi lượt."],"example":"Nếu đã hết sách trước khi bắt đầu, vòng lặp “trong khi còn sách thì xếp” không chạy lượt nào."},"tasks":[{"id":"T6-B16-C06","prompt":"Nếu điểm ít nhất 5 thì báo “Đạt”; không thì báo “Chưa đạt”. Với 5 đi nhánh nào?","type":"choice","choices":["Đạt","Chưa đạt","Không nhánh nào","Cả hai"],"correct":[0],"why":"“Ít nhất” bao gồm bằng."},{"id":"T6-B16-C07","prompt":"Phân loại theo cấu trúc điều khiển chính của từng mô tả.","type":"match","grouping":true,"items":["Nếu trời mưa thì ở trong lớp, nếu không thì ra sân","Mở sách rồi đọc lời dẫn","Gõ cửa đúng 3 lần","Khi còn giấy vụn, tiếp tục nhặt mỗi lần một mẩu"],"groups":["Tuần tự","Rẽ nhánh","Lặp"],"assign":[1,0,2,2],"why":"Tuần tự thực hiện lần lượt, rẽ nhánh chọn theo điều kiện và lặp thực hiện lại một thao tác."},{"id":"T6-B16-C08","prompt":"“Nếu còn ghế thì ngồi” không quy định việc khi hết ghế. Đây là gì?","type":"choice","choices":["Rẽ nhánh dạng thiếu","Lặp vô hạn","Rẽ nhánh dạng đủ","Dãy không có điều kiện"],"correct":[0],"why":"Chỉ nhánh đúng có việc được nêu."},{"id":"T6-B16-C09","prompt":"Vòng lặp kiểm tra điều kiện trước thân; điều kiện sai ngay từ đầu. Thân chạy mấy lần?","type":"choice","choices":["1","Không dừng","0","2"],"correct":[2],"why":"Chưa vào thân đã thoát."},{"id":"T6-B16-C10","prompt":"Vòng lặp kiểm tra điều kiện “còn bài chưa làm” trước mỗi lượt. Mỗi lượt làm xong đúng một bài. Những nhận định nào đúng?","type":"multi","choices":["Nếu không còn bài ngay từ đầu thì không có lượt nào","Nếu còn hai bài thì thân vòng lặp chạy hai lượt","Điều kiện chỉ được kiểm tra một lần khi bắt đầu","Thân vòng lặp phải chạy thêm một lượt sau khi đã hết bài"],"correct":[0,1],"why":"Vòng lặp kiểm tra trước từng lượt. Khi số bài còn lại bằng 0, điều kiện sai và vòng lặp dừng."}]},{"goal":"Lần theo từng bước điều khiển.","study":{"points":["Theo dõi giá trị trước và sau mỗi lượt. Kiểm tra điều kiện bằng giá trị hiện tại, không dùng giá trị ban đầu mãi.","Trong rẽ nhánh, chỉ thực hiện nhánh phù hợp. Sau đó tiếp tục ở bước chung nếu có.","Ghi bảng chạy thử gồm số lượt, điều kiện và giá trị để tránh đếm thừa."],"example":"Bắt đầu x = 0. Trong khi x \u003c 6, tăng x thêm 2. Sau các lượt x là 2, 4, 6. Tại 6 điều kiện sai nên dừng."},"tasks":[{"id":"T6-B16-C11","prompt":"Bắt đầu x = 1; lặp ba lần thao tác cộng 2 vào x. Kết quả?","type":"choice","choices":["5","7","6","8"],"correct":[1],"why":"1 + 3 × 2 = 7."},{"id":"T6-B16-C12","prompt":"Robot xuất phát ở ô 0. Khi vị trí còn nhỏ hơn 2, robot đi thêm một ô. Xếp các sự kiện từ lúc bắt đầu đến lúc vòng lặp dừng.","type":"order","steps":["Kiểm tra ở ô 1 và đi sang ô 2","Kiểm tra ở ô 2, điều kiện sai nên dừng","Kiểm tra ở ô 0 và đi sang ô 1"],"sequence":[2,0,1],"why":"Điều kiện đúng ở ô 0 và 1 nên robot đi tiếp. Ở ô 2, điều kiện sai và không có bước đi nữa."},{"id":"T6-B16-C13","prompt":"Còn 3 trang, mỗi lượt đọc một trang và giảm số trang còn lại. Lặp đến khi hết. Mấy lượt?","type":"choice","choices":["2","3","0","4"],"correct":[1],"why":"3 → 2 → 1 → 0."},{"id":"T6-B16-C14","prompt":"Cho x = 0. Khi x \u003c 6, tăng x thêm 2. Ghi các giá trị x sau từng lượt và giá trị lúc dừng.","type":"practice","rubric":["2, 4, 6.","Dừng ở 6 do điều kiện sai."]},{"id":"T6-B16-C15","prompt":"Nếu n ≥ 4 thì báo “Đủ”, ngược lại báo “Thiếu”. Cho kết quả với n = 3 và n = 4.","type":"practice","rubric":["Thiếu; Đủ."]}]},{"goal":"Chẩn đoán điều kiện và lỗi dừng.","study":{"points":["Vòng lặp có thể không dừng nếu không có bước thay đổi dữ liệu dùng trong điều kiện. Mỗi lượt phải tiến tới điểm dừng.","Kiểm tra dấu so sánh ở ngưỡng. Chênh lệch giữa \u003c và ≤ có thể khiến chạy thêm một lượt.","Trong sơ đồ, nhánh sai của điều kiện lặp đi tới bước sau vòng lặp. Nhánh đúng thực hiện thân rồi quay lại kiểm tra."],"example":"Nếu x bắt đầu bằng 1 và em lặp khi x \u003c 5 nhưng chỉ hiển thị x, x không đổi nên điều kiện luôn đúng."},"tasks":[{"id":"T6-B16-C16","prompt":"Trong khi x \u003c 5, chỉ hiển thị x; ban đầu x = 1. Vì sao có thể không dừng?","type":"choice","choices":["Sơ đồ có hai nhánh","x bằng 5 ngay từ đầu","x không đổi nên điều kiện luôn đúng","Khối hiển thị luôn làm x tăng"],"correct":[2],"why":"Không có bước làm x tiến tới ngưỡng."},{"id":"T6-B16-C17","prompt":"Ban đầu còn 3 lượt. Yêu cầu là thực hiện đúng 3 lần rồi dừng. Những thay đổi nào cần có trong vòng lặp kiểm tra trước mỗi lượt?","type":"multi","choices":["Dùng điều kiện “số lượt còn lại > 0”","Giảm số lượt còn lại đi 1 sau mỗi lần thực hiện","Đặt lại số lượt thành 3 sau mỗi lần thực hiện","Dùng điều kiện “số lượt còn lại = 0”"],"correct":[0,1],"why":"Điều kiện cho chạy khi còn lượt. Giảm dần 3 → 2 → 1 → 0 làm điều kiện sai sau đúng ba lần."},{"id":"T6-B16-C18","prompt":"Quy định “từ 10 trở lên”, sơ đồ dùng x > 10. Thử giá trị nào bộc lộ lỗi?","type":"choice","choices":["10","9","20","11"],"correct":[0],"why":"10 cần được nhận nhưng bị loại."},{"id":"T6-B16-C19","prompt":"Vòng lặp “khi còn việc, đánh dấu xong một việc” nhưng danh sách chờ không đổi. Nêu lỗi và cách bảo đảm dừng.","type":"practice","rubric":["Số việc chờ không giảm.","Bỏ hoặc chuyển đúng một việc khỏi danh sách chờ mỗi lượt, dừng khi rỗng."]},{"id":"T6-B16-C20","prompt":"Sơ đồ giảm x từ 3 về 0, nhưng nhánh “x > 0” sai lại quay về bước giảm. Sửa đường đi và giải thích.","type":"practice","rubric":["Sai đi tới kết thúc.","Đúng giảm rồi quay lại kiểm tra; x về 0 thì dừng."]}]},{"goal":"Thiết kế và thử thuật toán kết hợp cấu trúc.","study":{"points":["Điều kiện kết hợp “và” chỉ đúng khi cả hai điều kiện đúng. Với “hoặc”, chỉ cần ít nhất một điều kiện đúng.","Để dừng sớm khi đạt mục tiêu, kiểm tra mục tiêu ở từng lượt và vẫn giữ giới hạn số lượt nếu đề yêu cầu.","Thử ca ngay tại ngưỡng, ca phải chạy nhiều lượt và ca không chạy. Kiểm tra robot dừng đúng vị trí."],"example":"Phát một thẻ cho mỗi bạn trong khi còn thẻ và còn người chờ. Sau mỗi lượt, giảm cả hai số lượng rồi kiểm tra lại."},"tasks":[{"id":"T6-B16-C21","prompt":"Phát mỗi bạn một thẻ khi còn thẻ và còn bạn chưa nhận. Điều kiện tiếp tục là gì?","type":"choice","choices":["Còn thẻ hoặc còn bạn chưa nhận","Số thẻ luôn lớn hơn số bạn","Hết thẻ và hết bạn","Còn thẻ và còn bạn chưa nhận"],"correct":[3],"why":"Cả hai điều kiện cần đúng để phát thêm."},{"id":"T6-B16-C22","prompt":"Robot được dò tối đa 4 lượt và phải dừng ngay khi tìm thấy sách. Những kết quả chạy thử nào đúng với yêu cầu?","type":"multi","choices":["Tìm thấy ở lượt 1 → dừng sau lượt 1","Không tìm thấy trong cả 4 lượt → dừng sau lượt 4","Tìm thấy ở lượt 2 → vẫn chạy đến hết lượt 4","Chưa tìm thấy sau lượt 4 → tiếp tục lượt 5"],"correct":[0,1],"why":"Vòng lặp dừng theo điều kiện nào đến trước: tìm thấy sách hoặc hết 4 lượt."},{"id":"T6-B16-C23","prompt":"Muốn nhắc “Hết giấy” nếu hết, nếu còn thì in từng trang khi còn việc và còn giấy. Dùng gì?","type":"choice","choices":["Chỉ rẽ nhánh nhưng in đúng một trang","Chỉ lặp không kiểm tra","Rẽ nhánh và lặp có điều kiện","Chỉ tuần tự"],"correct":[2],"why":"Cần quyết định ban đầu và kiểm tra trong khi in."},{"id":"T6-B16-C24","prompt":"Mô tả bằng lời hoặc sơ đồ: nếu trời mưa thì làm 2 việc trong nhà lần lượt; nếu không thì tưới từng chậu trong 3 chậu. Chạy thử cả hai trường hợp.","type":"practice","rubric":["Nhánh đủ và điều kiện rõ.","Hai việc tuần tự; tưới đúng 3 chậu.","Hai lượt thử đúng."]},{"id":"T6-B16-C25","prompt":"Có 4 thẻ và 6 bạn. Viết thuật toán phát từng thẻ, dừng khi hết thẻ hoặc không còn bạn chờ. Thử thêm trường hợp 6 thẻ, 4 bạn.","type":"practice","rubric":["Điều kiện tiếp tục cần cả thẻ và bạn.","Mỗi lượt giảm hai số.","Mỗi ca phát 4 thẻ và chỉ ra điều kiện dừng tương ứng."]}]}],"extras":[]},"6":{"n":6,"title":"Mạng thông tin toàn cầu","pages":"23–27","stages":[{"goal":"Nhận ra WWW, trình duyệt, nội dung trang web và dấu trang.","study":{"points":["World Wide Web (WWW) gồm các trang web được liên kết với nhau. Trình duyệt là phần mềm dùng để mở trang web.","Trang web có thể chứa chữ, hình, âm thanh, video và liên kết. Một website thường tập hợp các trang liên quan.","Dấu trang lưu địa chỉ để em mở lại nhanh. Dấu trang không sửa nội dung của website."],"example":"Em dùng trình duyệt mở trang thư viện của trường, sau đó đánh dấu trang để lần sau mở lại mà không cần gõ địa chỉ."},"tasks":[{"id":"B06-C01","prompt":"Em dùng phần mềm nào để mở và xem một trang web?","type":"choice","choices":["Phần mềm trình chiếu","Máy tính bỏ túi","Phần mềm vẽ","Trình duyệt web"],"correct":[3],"why":"Trình duyệt web mở và hiển thị trang web."},{"id":"B06-C02","prompt":"Trang web giới thiệu trường có thể kết hợp những nội dung nào trong cùng một trang?","type":"choice","choices":["Chỉ văn bản","Chỉ video","Phải tách văn bản và video sang hai website","Cả văn bản và video"],"correct":[3],"why":"Một trang web có thể kết hợp nhiều loại nội dung."},{"id":"B06-C03","prompt":"Khi mở trang lịch hoạt động của trường bằng trình duyệt, em có thể gặp những nội dung nào ngay trên trang?","type":"multi","choices":["Dòng chữ ghi giờ khai mạc","Ảnh minh họa hoạt động","Mục “Xem địa điểm” dẫn sang trang bản đồ","Dây cáp mạng đang cắm sau máy tính"],"correct":[0,1,2],"why":"Một trang web có thể chứa chữ, ảnh và siêu liên kết. Dây cáp là thiết bị vật lí, không phải nội dung trang."},{"id":"B06-C04","prompt":"Muốn lưu địa chỉ một trang để lần sau mở nhanh trong trình duyệt, em dùng chức năng nào?","type":"choice","choices":["Thêm dấu trang (đánh dấu trang)","Tải lại trang","Quay lại trang trước","Mở trang trong thẻ mới"],"correct":[0],"why":"Dấu trang lưu địa chỉ để mở lại."},{"id":"B06-C05","prompt":"Nhận xét nào mô tả đúng WWW?","type":"choice","choices":["Một dịch vụ chỉ dùng để gửi thư điện tử","Một phần mềm duy nhất để xem trang web","Hệ thống các trang web được liên kết với nhau","Một trang chủ chung của mọi trường"],"correct":[2],"why":"WWW là hệ thống các trang web được liên kết với nhau."}]},{"goal":"Phân biệt website, trang web và siêu liên kết.","study":{"points":["Trang chủ là nơi thường dùng để bắt đầu khám phá một website. Từ đó em có thể đến nhiều trang con.","Siêu liên kết có thể gắn với chữ, ảnh hoặc nút. Khi bấm, nó đưa em tới một vị trí hay trang khác.","Phân biệt địa chỉ web, trang web và trình duyệt. Địa chỉ chỉ nơi mở, trang là nội dung được mở, trình duyệt là công cụ mở."],"example":"Website trường có Trang chủ, Tin tức và Thư viện. Thư viện là một trang trong website, còn nút “Xem lịch” trên đó là liên kết."},"tasks":[{"id":"B06-C06","prompt":"Ghép từng thuật ngữ với mô tả phù hợp.","type":"match","choices":["1–Z · 2–X · 3–Y","1–Y · 2–Z · 3–X","1–Z · 2–Y · 3–X","1–X · 2–Y · 3–Z"],"correct":[1],"why":"Website gồm các trang có liên quan. Trang chủ giúp điều hướng, siêu liên kết giúp chuyển đến nội dung khác.","items":["Website","Trang chủ","Siêu liên kết"],"groups":["Thành phần có thể bấm để chuyển đến trang hoặc nội dung khác","Tập hợp các trang web có liên quan","Trang mở đầu thường dùng để giới thiệu và điều hướng trong website"],"assign":[1,2,0]},{"id":"B06-C07","prompt":"Website trường có các trang Trang chủ, Tin tức và Thư viện. Em đang xem riêng trang Thư viện. Em đang xem gì?","type":"choice","choices":["Toàn bộ website trường","Một trang web thuộc website trường","Một trình duyệt","Địa chỉ của trang Thư viện"],"correct":[1],"why":"Thư viện là một trang thuộc website trường."},{"id":"B06-C08","prompt":"Trên website trường, đối tượng nào có thể được gắn siêu liên kết?","type":"multi","choices":["Dòng chữ “Xem lịch”","Ảnh biểu trưng của trường","Nút “Về trang chủ”","Nút nguồn vật lí của máy tính"],"correct":[0,1,2],"why":"Chữ, ảnh và nút trên trang web có thể gắn siêu liên kết."},{"id":"B06-C09","prompt":"Xếp ba mục vào nhóm Phần mềm hoặc Trang web thuộc website trường. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["1 – 1 – 2","1 – 2 – 2","1 – 2 – 1","2 – 2 – 2"],"correct":[1],"why":"Firefox là phần mềm. Tin tức và Thư viện là các trang thuộc website.","grouping":true,"items":["Firefox","Trang Tin tức của trường","Trang Thư viện của trường"],"groups":["Phần mềm","Trang web thuộc website trường"],"assign":[0,1,1]},{"id":"B06-C10","prompt":"Em bấm vào ảnh biểu trưng và website đưa em về Trang chủ. Thành phần gắn vào ảnh giúp em chuyển trang được gọi là gì?","type":"choice","choices":["Siêu liên kết","Hộp tìm kiếm","Tên miền","Thanh địa chỉ"],"correct":[0],"why":"Siêu liên kết gắn vào ảnh giúp em chuyển trang."}]},{"goal":"Dùng địa chỉ và liên kết để đến đúng trang.","study":{"points":["Khi biết địa chỉ, mở trình duyệt, nhập vào thanh địa chỉ rồi nhấn Enter. Khi đã ở website, chọn liên kết đúng mục tiêu.","Dùng mục lục hoặc thanh điều hướng để chọn đúng nhánh. Nút Quay lại giúp trở về trang vừa xem.","Đọc tên liên kết trước khi bấm. Những liên kết có tên gần giống nhau có thể dẫn đến thông tin khác nhau."],"example":"Muốn biết ngày thi, mở mục “Lịch thi”, không mở “Kết quả thi”. Nếu vào nhầm, quay lại rồi chọn liên kết đúng."},"tasks":[{"id":"B06-C11","prompt":"Em đã biết địa chỉ trang web. Hãy xếp các thao tác theo đúng thứ tự.","type":"order","choices":["3 → 2 → 1","2 → 1 → 3","1 → 2 → 3","3 → 1 → 2"],"correct":[0],"why":"Mở trình duyệt, gõ địa chỉ rồi nhấn Enter.","steps":["Nhấn Enter","Gõ địa chỉ vào thanh địa chỉ","Mở trình duyệt"],"sequence":[2,1,0]},{"id":"B06-C12","prompt":"Website có hai liên kết “Lịch thi học kì” và “Kết quả thi học kì”. Em cần biết ngày thi môn Tin học. Em mở liên kết nào trước?","type":"choice","choices":["Kết quả thi học kì","Mục Liên hệ","Lịch thi học kì","Mục Thư viện"],"correct":[2],"why":"Lịch thi cho biết ngày thi."},{"id":"B06-C13","prompt":"Ghép mục đích với thao tác phù hợp.","type":"match","choices":["1–Y · 2–X · 3–Z","1–X · 2–Y · 3–Z","1–Z · 2–Y · 3–X","1–Z · 2–X · 3–Y"],"correct":[1],"why":"Dùng thanh địa chỉ, nút Quay lại hoặc liên kết tùy mục đích.","items":["Mở một địa chỉ web đã biết","Trở lại trang vừa xem","Mở bài viết có tên hiện trên trang"],"groups":["Nhập địa chỉ vào thanh địa chỉ rồi nhấn Enter","Dùng nút Quay lại của trình duyệt","Bấm tên bài viết nếu đó là liên kết"],"assign":[0,1,2]},{"id":"B06-C14","prompt":"Trang chủ thư viện có liên kết “Lịch mở cửa” và “Nội quy”. Em muốn tìm lịch rồi lưu để mở lại. Những thao tác nào phù hợp?","type":"multi","choices":["Bấm liên kết “Lịch mở cửa”","Thêm dấu trang sau khi đã mở đúng trang lịch","Lưu liên kết “Nội quy” vì cùng website","Gõ tên trang vào chỗ nhập mật khẩu"],"correct":[0,1],"why":"Cần mở đúng trang bằng liên kết và đánh dấu chính trang lịch để lần sau quay lại nhanh."},{"id":"B06-C15","prompt":"Em đang đọc bài “Lịch thi” và cần tìm lịch tham quan. Nút Quay lại sẽ đưa em về trang Tin tức. Hãy xếp các bước.","type":"order","choices":["3 → 2 → 1","2 → 1 → 3","2 → 3 → 1","3 → 1 → 2"],"correct":[0],"why":"Quay lại Tin tức, mở Lịch tham quan rồi đọc thời gian.","steps":["Đọc thời gian trong thông báo tham quan","Mở liên kết “Lịch tham quan”","Bấm Quay lại"],"sequence":[2,1,0]}]},{"goal":"Dựa vào dấu hiệu để sửa lỗi địa chỉ, kết nối hoặc điều hướng.","study":{"points":["Nếu trang không mở, xác định lỗi kết nối hay lỗi riêng của địa chỉ. Thử mở một trang khác đã biết để so sánh.","Trong địa chỉ, tên miền cho biết website. Phần sau tên miền có thể chỉ tới một trang cụ thể. Thiếu dấu gạch hoặc gõ sai chữ có thể mở nhầm trang.","So địa chỉ với nguồn được cung cấp, rồi thử lại. Nếu liên kết cũ lỗi, tìm liên kết cập nhật từ trang chủ."],"example":"Trang chủ vẫn mở được nhưng đường dẫn /thu-vine không tồn tại. So với phiếu và sửa thành /thu-vien trước khi kiểm tra lại."},"tasks":[{"id":"B06-C16","prompt":"Ghép mỗi dấu hiệu với việc nên thử trước.","type":"match","choices":["1–Z · 2–Y · 3–X","1–X · 2–Z · 3–Y","1–Y · 2–X · 3–Z","1–Z · 2–X · 3–Y"],"correct":[3],"why":"Đối chiếu dấu hiệu trước khi chọn cách xử lí.","items":["Địa chỉ đã nhập thiếu một chữ","Em bấm nhầm sang mục Thư viện","Máy báo chưa kết nối Wi-Fi"],"groups":["Quay lại trang trước","Kiểm tra kết nối Wi-Fi","Sửa địa chỉ đã nhập"],"assign":[2,0,1]},{"id":"B06-C17","prompt":"Địa chỉ minh họa đúng là https://truong.example/lich-thi. Em nhập https://truong.example/lichthi. Nhận xét nào đúng?","type":"multi","choices":["Hai địa chỉ có cùng tên miền.","Phần đường dẫn em gõ thiếu dấu gạch nối.","Hai địa chỉ chắc chắn mở cùng một trang.","Đổi trình duyệt sẽ tự thêm dấu gạch nối."],"correct":[0,1],"why":"Tên miền giống nhau nhưng đường dẫn đã nhập thiếu dấu gạch nối."},{"id":"B06-C18","prompt":"Xếp mỗi tình huống vào nhóm Lỗi địa chỉ, Lỗi kết nối hoặc Bấm nhầm liên kết. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["1 – 2 – 3","3 – 1 – 2","1 – 3 – 2","2 – 3 – 1"],"correct":[0],"why":"Mỗi dấu hiệu chỉ ra một nguyên nhân khác nhau.","grouping":true,"items":["Địa chỉ trên màn hình có một kí tự khác địa chỉ giáo viên cung cấp.","Máy báo đang ngoại tuyến.","Website mở được, nhưng em bấm “Sách mới” khi đang tìm lịch thi."],"groups":["Lỗi địa chỉ","Lỗi kết nối","Bấm nhầm liên kết"],"assign":[0,1,2]},{"id":"B06-C19","prompt":"Máy vẫn mở được Trang chủ. Phiếu ghi https://truong.example/thu-vien; thanh địa chỉ hiển thị https://truong.example/thu-vine và trang báo không tìm thấy. Dấu hiệu và cách thử nào phù hợp nhất?","type":"choice","choices":["Trang chủ cũng không mở; kết nối lại Wi-Fi.","Tên miền sai; đổi truong.example sang lop.example.","Trình duyệt không hỗ trợ website; cài trình duyệt khác.","Đường dẫn khác phiếu; sửa thành /thu-vien rồi mở lại."],"correct":[3],"why":"Trang chủ vẫn mở và tên miền giống nhau; phần sau dấu gạch chéo bị gõ đảo chữ."},{"id":"B06-C20","prompt":"Em mở được Trang chủ và Tin tức. Khi bấm “Lịch thi cũ”, trình duyệt báo “Không tìm thấy trang”. Quay lại Tin tức, em thấy liên kết “Lịch thi học kì – bản cập nhật”. Em nên thử gì trước?","type":"choice","choices":["Khởi động lại bộ phát Wi-Fi","Cài một trình duyệt khác rồi mở lại liên kết cũ","Mở liên kết “Lịch thi học kì – bản cập nhật”","Tải lại liên kết “Lịch thi cũ” nhiều lần"],"correct":[2],"why":"Website vẫn truy cập được và có liên kết cập nhật phù hợp."}]},{"goal":"Đối chiếu ngày cập nhật, lớp và sự kiện trước khi chia sẻ.","study":{"points":["Khi có hai bản thông báo, đối chiếu đơn vị đăng, ngày cập nhật và đối tượng áp dụng. Bản mới nhất chỉ hữu ích nếu nói đúng lớp hoặc sự kiện cần tìm.",

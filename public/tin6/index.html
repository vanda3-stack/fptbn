<script>
'use strict';
const BANK={"8":{"n":8,"title":"Thư điện tử","pages":"32–36","stages":[{"goal":"Nhận biết thư điện tử, địa chỉ và tệp đính kèm.","text":"Thư điện tử được gửi và nhận qua Internet. Địa chỉ thường có dạng tên_hộp_thư@tên_miền. Thư có thể kèm tệp.","tasks":[{"id":"B08-C01","prompt":"Thư điện tử dùng để làm gì?","type":"choice","choices":["Trao đổi thư qua Internet","In ảnh trực tiếp","Tổ chức cuộc gọi video trực tiếp","Đo nhiệt độ"],"correct":[0],"why":"Đây là phương tiện trao đổi thư qua Internet."},{"id":"B08-C02","prompt":"Khi gửi thư điện tử, em có thể gửi ảnh theo cách nào?","type":"choice","choices":["Lưu ảnh vào máy rồi gửi thư mà không đính kèm.","Gõ tên tệp ở ô Chủ đề là đủ.","Đính kèm tệp ảnh vào thư.","Nhập tên tệp vào ô Đến."],"correct":[2],"why":"Thư có thể kèm ảnh hoặc tài liệu."},{"id":"B08-C03","prompt":"Ký hiệu nào ngăn cách tên hộp thư và tên miền?","type":"choice","choices":["#","&","/","@"],"correct":[3],"why":"Ký hiệu @ phân cách hai phần."},{"id":"B08-C04","prompt":"Địa chỉ nào có cấu trúc thư điện tử?","type":"choice","choices":["mai.truong.example","mai@truong.example","mai@truong@example","https://truong.example"],"correct":[1],"why":"mai@truong.example có tên hộp thư, kí hiệu @ và tên miền."},{"id":"B08-C05","prompt":"Cần tạo hộp thư của riêng mình để gửi và nhận thư. Em cần làm gì trước khi đăng nhập lần đầu vào hộp thư đó?","type":"choice","choices":["Chỉ nghĩ ra một địa chỉ rồi nhập vào thư","Đăng kí tài khoản theo hướng dẫn của dịch vụ và giáo viên hoặc người lớn","Dùng tài khoản người khác để thay cho tài khoản của em","Lưu một tệp văn bản mang tên hộp thư"],"correct":[1],"why":"Tài khoản cần được tạo trước khi dùng để đăng nhập và mở hộp thư."}]},{"goal":"Phân biệt các khu vực hộp thư và giải thích ưu, nhược điểm khi trao đổi bằng thư.","text":"Ô Đến ghi người nhận. Chủ đề tóm tắt mục đích thư. Hộp thư đến chứa thư nhận, Thư đã gửi chứa thư đã gửi, Thư nháp lưu bản chưa gửi.","tasks":[{"id":"B08-C06","prompt":"Ghép trường với vai trò.","type":"match","choices":["1–Y · 2–Z · 3–X","1–Z · 2–X · 3–Y","1–X · 2–Y · 3–Z","1–X · 2–Z · 3–Y"],"correct":[0],"why":"Các trường cho biết gửi cho ai, về việc gì và kèm gì.","items":["Đến","Chủ đề","Tệp đính kèm"],"groups":["Tệp gửi cùng thư","Địa chỉ người nhận","Dòng tóm tắt mục đích"],"assign":[1,2,0]},{"id":"B08-C07","prompt":"Em muốn đọc thư cô vừa gửi. Em mở khu vực nào?","type":"choice","choices":["Thư đã gửi","Hộp thư đến","Thư nháp","Thư đã xóa"],"correct":[1],"why":"Thư nhận được xuất hiện trong Hộp thư đến."},{"id":"B08-C08","prompt":"Xếp ba thư vào đúng khu vực. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["1 – 2 – 3","2 – 3 – 1","1 – 3 – 2","3 – 1 – 2"],"correct":[0],"why":"Vị trí tùy theo thư đến, đã đi hay đang soạn.","items":["Thư cô gửi cho em","Thư em đã gửi bạn","Thư viết dở chưa gửi"],"groups":["Hộp thư đến","Thư đã gửi","Thư nháp"],"assign":[0,1,2]},{"id":"B08-C09","prompt":"Những đặc điểm nào là ưu điểm của thư điện tử?","type":"multi","choices":["Gửi nội dung nhanh khi có kết nối","Có thể gửi tài liệu kèm theo","Có thể gửi cho nhiều người","Người nhận chắc chắn đọc ngay"],"correct":[0,1,2],"why":"Gửi nhanh không bảo đảm người nhận mở ngay."},{"id":"B08-C10","prompt":"So với gặp trực tiếp, hạn chế nào của thư điện tử có thể ảnh hưởng đến lời nhắn gấp?","type":"choice","choices":["Thư chỉ được gửi cho người ở cùng nơi","Thư điện tử không thể có chủ đề","Người nhận có thể chưa mở hộp thư dù thư đã đến","Người gửi không thể kèm tài liệu"],"correct":[2],"why":"Gửi nhanh không bảo đảm người nhận đọc ngay."}]},{"goal":"Chọn thao tác phù hợp khi gửi bài hoặc tiếp tục trao đổi.","text":"Soạn thư mới để bắt đầu trao đổi. Dùng Trả lời khi phản hồi thư đã nhận. Kiểm tra người nhận, chủ đề, nội dung và tệp trước khi gửi.","tasks":[{"id":"B08-C11","prompt":"Xếp các thao tác gửi bài thực hành.","type":"order","choices":["3 → 4 → 2 → 1","1 → 4 → 3 → 2","3 → 1 → 4 → 2","2 → 3 → 4 → 1"],"correct":[3],"why":"Hoàn thiện và kiểm tra trước khi gửi.","steps":["Bấm Gửi","Soạn thư mới","Điền người nhận, chủ đề, nội dung và đính kèm bài","Kiểm tra thư và tệp"],"sequence":[1,2,3,0]},{"id":"B08-C12","prompt":"Ghép mục đích với thao tác.","type":"match","choices":["1–X · 2–Y · 3–Z","1–Y · 2–Z · 3–X","1–Z · 2–Y · 3–X","1–Y · 2–X · 3–Z"],"correct":[3],"why":"Thao tác thay đổi tùy mục đích trao đổi.","items":["Bắt đầu thư mới","Phản hồi cô trong cuộc trao đổi hiện tại","Gửi tiếp thông báo cho bạn khi được phép"],"groups":["Trả lời","Soạn thư","Chuyển tiếp"],"assign":[1,0,2]},{"id":"B08-C13","prompt":"Cô yêu cầu gửi bài thực hành Bài 8. Chọn chủ đề có đủ tên bài, tên học sinh và lớp.","type":"choice","choices":["Nộp bài thực hành Bài 8 – Minh 6A","Nộp bài thực hành Bài 7 – Minh 6A","Minh – Lớp 6A","Nộp bài thực hành Bài 8"],"correct":[0],"why":"Chủ đề nêu đúng bài, tên học sinh và lớp."},{"id":"B08-C14","prompt":"Trước khi bấm Gửi bài cho cô, cần đối chiếu gì?","type":"multi","choices":["Địa chỉ của cô","Tên và nội dung tệp","Chủ đề và lời nhắn","Màu hình nền máy"],"correct":[0,1,2],"why":"Kiểm tra đủ thông tin giúp giảm lỗi gửi nhầm."},{"id":"B08-C15","prompt":"Cô gửi thư hỏi em có tham gia buổi thực hành không. Em muốn xác nhận trong cùng cuộc trao đổi. Em dùng gì?","type":"choice","choices":["Trả lời","Xóa thư","Chuyển tiếp cho bạn","Soạn một thư mới với chủ đề khác"],"correct":[0],"why":"Trả lời giữ nội dung trong cùng cuộc trao đổi."}]},{"goal":"Dựa vào dấu hiệu để xử lí lỗi người nhận hoặc tệp.","text":"So sánh địa chỉ với thông tin được cung cấp. Nếu quên tệp, gửi bổ sung trong cùng cuộc trao đổi và nói rõ nội dung bổ sung.","tasks":[{"id":"B08-C16","prompt":"Địa chỉ trên phiếu là cohoa@truong.example. Em gõ cohao@truong.example. Chọn địa chỉ đã sửa đúng.","type":"choice","choices":["cohao@truong.example","cohoa@trunog.example","cohoa@truong.example","cohoa@lop.example"],"correct":[2],"why":"Hai chữ cuối tên hộp thư đã bị đảo vị trí."},{"id":"B08-C17","prompt":"Ghép dấu hiệu với cách xử lí.","type":"match","choices":["1–Y · 2–X · 3–Z","1–Z · 2–Y · 3–X","1–Z · 2–X · 3–Y","1–Y · 2–Z · 3–X"],"correct":[0],"why":"Mỗi dấu hiệu cần cách xử lí khác nhau.","items":["Quên gắn tệp sau khi gửi","Địa chỉ báo không tồn tại","Thư còn trong Nháp"],"groups":["Kiểm tra địa chỉ chính xác","Gắn tệp và gửi bổ sung","Mở nháp, kiểm tra và gửi"],"assign":[1,0,2]},{"id":"B08-C18","prompt":"Bản nháp đã đính kèm bai8-cu.pdf. Cô yêu cầu đúng một tệp là bai8-sua.pdf. Làm gì trước khi gửi?","type":"choice","choices":["Giữ tệp cũ, sửa lời nhắn thành “bản mới”","Đính kèm cả hai rồi để cô chọn","Gỡ tệp cũ, đính kèm và mở kiểm tra bai8-sua.pdf","Đổi tên tệp cũ thành bai8-sua.pdf"],"correct":[2],"why":"Cần đúng nội dung, phiên bản và số lượng tệp."},{"id":"B08-C19","prompt":"Xếp các lỗi theo phần cần sửa. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["1 – 2 – 3","2 – 1 – 3","3 – 1 – 2","3 – 2 – 1"],"correct":[0],"why":"Xác định trường sai giúp sửa đúng chỗ.","items":["Gõ sai một ký tự trong địa chỉ","Gắn nhầm bài của tuần trước","Chủ đề ghi sai tên bài"],"groups":["Người nhận","Tệp đính kèm","Chủ đề"],"assign":[0,1,2]},{"id":"B08-C20","prompt":"Em đã gửi bài nhưng phát hiện tệp là bản cũ. Cô chưa phản hồi. Em làm gì?","type":"choice","choices":["Xóa thư ở máy mình rồi cho rằng cô không thấy","Chuyển tiếp bản cũ cho cả lớp","Gửi nhiều lần mà không ghi gì","Gửi bản đúng trong cùng cuộc trao đổi và nói rõ dùng bản mới"],"correct":[3],"why":"Lời nhắn giúp cô phân biệt bản cần dùng."}]},{"goal":"Kiểm tra ngữ cảnh, người nhận và dấu hiệu bất thường.","text":"Chỉ gửi nội dung cho người phù hợp. Với thư lạ yêu cầu mật khẩu hoặc mở tệp không rõ nguồn, xác minh qua kênh đã biết và báo người lớn nếu cần.","tasks":[{"id":"B08-C21","prompt":"Danh bạ lớp ghi cohoa@truong.example. Một thư tên hiển thị “Cô Hoa” đến từ cohoa@lop.example và bảo gửi bài có thông tin cá nhân vào địa chỉ mới. Em xử lí thế nào?","type":"choice","choices":["Gửi ngay vì tên hiển thị trùng.","Tạm chưa gửi; xác minh địa chỉ mới qua kênh lớp đã biết.","Trả lời địa chỉ mới và kèm bài để hỏi có phải cô không.","Gửi cho cả hai địa chỉ để chắc một nơi nhận."],"correct":[1],"why":"Tên hiển thị không xác minh người gửi; chỉ dùng địa chỉ được xác nhận qua kênh độc lập."},{"id":"B08-C22","prompt":"Một thư lạ yêu cầu nhập mật khẩu để xem điểm. Em nên làm gì?","type":"multi","choices":["Không nhập mật khẩu theo yêu cầu trong thư","Hỏi cô qua kênh liên lạc đã biết","Chuyển tiếp liên kết cho cả lớp để thử","Báo người lớn hoặc giáo viên"],"correct":[0,1,3],"why":"Xác minh qua kênh tin cậy và giữ kín mật khẩu."},{"id":"B08-C23","prompt":"Xếp các thao tác khi dùng thư điện tử trên máy dùng chung. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["2 – 2 – 1","1 – 1 – 1","1 – 2 – 1","1 – 2 – 2"],"correct":[2],"why":"Đăng xuất bảo vệ hộp thư. Kiểm tra trước giúp tránh gửi sai.","items":["Đăng xuất khi dùng xong","Lưu mật khẩu trên máy","Kiểm tra tệp và người nhận trước khi gửi"],"groups":["Nên làm","Không nên làm"],"assign":[0,1,0]},{"id":"B08-C24","prompt":"Em cần trả lời cô bằng bản bài đã chỉnh sửa. Xếp các bước.","type":"order","choices":["1 → 2 → 3 → 4","4 → 1 → 3 → 2","2 → 4 → 1 → 3","4 → 3 → 2 → 1"],"correct":[2],"why":"Mở đúng cuộc trao đổi, soạn phản hồi rồi kiểm tra trước khi gửi.","steps":["Kiểm tra người nhận, lời nhắn và tệp","Mở thư góp ý và chọn Trả lời","Bấm Gửi","Nêu bản đã sửa và đính kèm tệp mới"],"sequence":[1,3,0,2]},{"id":"B08-C25","prompt":"Cô chỉ yêu cầu gửi bản sửa cho cô. Thư nào phù hợp nhất?","type":"choice","choices":["Trả lời tất cả để bạn nào cũng nhận bài","Gửi cô nhưng chỉ kèm bản cũ","Gửi đúng tệp cho nhóm lớp để nhờ một bạn chuyển cho cô","Gửi riêng cô, ghi rõ bản đã sửa và kèm đúng tệp"],"correct":[3],"why":"Thư đúng người nhận, nêu rõ mục đích và kèm đúng bản."}]}],"extras":[{"id":"B08-TH01","prompt":"Đăng nhập bằng tài khoản thực hành do giáo viên cấp hoặc dùng bản mô phỏng. Soạn thư nộp bài cho cô Hoa với địa chỉ cohoa@truong.example. Ghi chủ đề có tên bài, tên giả định và lớp; đính kèm đúng một tệp mẫu. Lưu nháp để kiểm tra, rồi mô tả cách đăng xuất trên máy dùng chung.","type":"practice","rubric":["1 điểm: đúng người nhận và chủ đề.","1 điểm: lời nhắn phù hợp, đúng một tệp mẫu.","1 điểm: có bản nháp để kiểm tra và thực hiện hoặc mô tả thao tác đăng xuất. Không gửi thư thật đến địa chỉ mô phỏng."]}]},"5":{"n":5,"title":"Internet","pages":"20–22","stages":[{"goal":"Nhận biết Internet, đặc điểm và lợi ích.","text":"Internet kết nối các mạng trên toàn cầu, hỗ trợ nhiều dịch vụ.","tasks":[{"id":"T6-B05-C01","prompt":"Internet là gì?","type":"choice","choices":["Hệ thống kết nối nhiều mạng trên toàn cầu","Một mạng riêng của một phòng học","Một trang web duy nhất","Một phần mềm soạn thảo"],"correct":[0],"why":"Internet liên kết nhiều mạng."},{"id":"T6-B05-C02","prompt":"Hoạt động nào cần Internet trong tình huống đã nêu?","type":"choice","choices":["Họp trực tuyến với lớp ở thành phố khác","Gõ một đoạn trong tệp lưu cục bộ","Tính nhẩm trên giấy","Đọc tệp có sẵn khi ngoại tuyến"],"correct":[0],"why":"Họp trực tuyến từ xa cần kết nối."},{"id":"T6-B05-C03","prompt":"Đặc điểm nào thể hiện phạm vi của Internet?","type":"choice","choices":["Chỉ một trường được dùng","Chỉ truy cập lúc học Tin","Người dùng ở nhiều quốc gia có thể kết nối","Mọi máy đều ở cùng một phòng"],"correct":[2],"why":"Đây là tính toàn cầu."},{"id":"T6-B05-C04","prompt":"Đơn vị cung cấp dịch vụ kết nối Internet thường gọi là gì?","type":"choice","choices":["Phần mềm mạng xã hội","Trình soạn thảo","Nhà cung cấp dịch vụ Internet","Máy tìm kiếm"],"correct":[2],"why":"Nhà cung cấp giúp mạng hoặc thiết bị kết nối Internet."},{"id":"T6-B05-C05","prompt":"Việc hỏi và trả lời trực tiếp trong lớp học trực tuyến thể hiện đặc điểm nào?","type":"choice","choices":["Tính tương tác","Chỉ lưu ngoại tuyến","Chỉ đọc một chiều","Tính cục bộ"],"correct":[0],"why":"Các bên có thể phản hồi qua lại."}]},{"goal":"Phân biệt mạng nội bộ, kết nối và dịch vụ.","text":"Một mạng nội bộ có thể hoạt động khi mất Internet.","tasks":[{"id":"T6-B05-C06","prompt":"Máy A gửi tệp qua mạng phòng máy dù đường ra ngoài bị ngắt. Điều đó cho thấy gì?","type":"choice","choices":["Gửi tệp luôn phải qua website","Mạng nội bộ có thể hoạt động không cần Internet","Internet chắc chắn vẫn hoạt động","Không có mạng nào hoạt động"],"correct":[1],"why":"Trao đổi trong phòng dùng mạng nội bộ."},{"id":"T6-B05-C07","prompt":"Thư điện tử và gọi video là gì xét trong ví dụ người dùng ở xa?","type":"choice","choices":["Hai loại dây mạng","Hai bộ phận của bàn phím","Hai dịch vụ sử dụng Internet","Hai nhà cung cấp bắt buộc"],"correct":[2],"why":"Cả hai phục vụ trao đổi qua mạng."},{"id":"T6-B05-C08","prompt":"Điện thoại có biểu tượng Wi-Fi nhưng báo “không có Internet”. Kết luận nào đúng?","type":"choice","choices":["Wi-Fi luôn đồng nghĩa Internet hoạt động","Có thể đã nối Wi-Fi nhưng chưa ra được Internet","Chắc chắn mọi website đều bị xóa","Máy đang dùng cáp"],"correct":[1],"why":"Wi-Fi là kết nối không dây tới mạng gần, không bảo đảm đường ra."},{"id":"T6-B05-C09","prompt":"Nhiều tổ chức tự quản lí mạng của mình và kết nối với nhau. Điều nào đúng về Internet?","type":"choice","choices":["Một công ty luôn sở hữu mọi trang web","Một trường sở hữu mọi mạng","Không có một chủ sở hữu duy nhất của toàn bộ Internet","Chỉ một nước được quyết định ai kết nối"],"correct":[2],"why":"Mỗi tổ chức có thể quản lí phần mạng của mình."},{"id":"T6-B05-C10","prompt":"Người dùng ở hai nước cùng sửa tài liệu nhóm. Hai đặc điểm nào thể hiện rõ?","type":"choice","choices":["Cục bộ và một chiều","Ngoại tuyến và cố định","Toàn cầu và tương tác","Chỉ đọc và không kết nối"],"correct":[2],"why":"Họ làm việc từ xa và thay đổi nội dung qua lại."}]},{"goal":"Chọn dịch vụ theo nhu cầu.","text":"Xét trao đổi trực tiếp, gửi tệp hoặc cùng chỉnh sửa.","tasks":[{"id":"T6-B05-C11","prompt":"Nhóm phải thảo luận bằng tiếng nói ngay bây giờ từ ba nhà khác nhau. Chọn gì?","type":"choice","choices":["Tài liệu đã tải khi không có kênh trao đổi","Bản sao USB","Tệp in tại nhà một bạn","Cuộc gọi trực tuyến"],"correct":[3],"why":"Cuộc gọi hỗ trợ trao đổi tức thời."},{"id":"T6-B05-C12","prompt":"Cô cần nhận một tệp và có thể xem tối nay. Công cụ nào phù hợp?","type":"choice","choices":["Máy tính bỏ túi","Sao vào thư mục riêng trên máy em","Chỉ gọi rồi cúp máy","Thư điện tử hoặc cổng nộp bài theo yêu cầu"],"correct":[3],"why":"Công cụ phải chuyển được tệp."},{"id":"T6-B05-C13","prompt":"Muốn tránh ba bản chỉnh sửa song song, nhóm đã có mạng và tài khoản. Chọn gì?","type":"choice","choices":["Chỉ gửi tên tài liệu","Cùng làm trên tài liệu trực tuyến được cấp quyền","In bản cũ trước khi chỉnh","Mỗi bạn giữ một bản riêng không trao đổi"],"correct":[1],"why":"Một bản chung giảm phân tán phiên bản."},{"id":"T6-B05-C14","prompt":"Nêu một việc em có thể làm khi mất Internet và một việc cần kết nối. Giải thích theo nơi lấy dữ liệu hoặc người nhận.","type":"practice","rubric":["1 điểm mỗi ví dụ phù hợp kèm lí do, như đọc tệp đã tải và gửi thư cho bạn ở xa."]},{"id":"T6-B05-C15","prompt":"Chọn hai lợi ích khác nhau của Internet cho lớp học và nêu một hoạt động cụ thể cho mỗi lợi ích.","type":"practice","rubric":["1 điểm mỗi cặp lợi ích–hoạt động phù hợp, như học trực tuyến–tham gia tiết học và chia sẻ–nộp tệp cho cô."]}]},{"goal":"Khoanh vùng lỗi và bác bỏ suy luận vội.","text":"So sánh thiết bị, dịch vụ và phạm vi kết nối.","tasks":[{"id":"T6-B05-C16","prompt":"Ba máy mở được hai website khác, chỉ một website báo lỗi. Kết luận hợp lý?","type":"choice","choices":["Internet vẫn dùng được; kiểm tra riêng website hoặc địa chỉ đó","Cả ba cáp chắc chắn đứt","Toàn bộ Internet đã mất","Tệp trong máy đều hỏng"],"correct":[0],"why":"Các website khác vẫn mở."},{"id":"T6-B05-C17","prompt":"Hai máy trong phòng trao đổi tệp nhưng không máy nào mở được các website đã biết. Kiểm tra trước gì?","type":"choice","choices":["Đường kết nối từ mạng phòng ra Internet","Đổi bàn phím cả phòng","Mực máy in","Tên tệp chia sẻ"],"correct":[0],"why":"Mạng cục bộ còn chạy; lỗi có thể ở đường ra."},{"id":"T6-B05-C18","prompt":"Máy B họp được trên cùng Wi-Fi, máy A không mở được bất cứ dịch vụ Internet nào. Xem gì trước?","type":"choice","choices":["Thông báo Internet toàn cầu ngừng","Kết nối và cấu hình trên máy A","Đổi giờ học của cả lớp","Xóa tài liệu của B"],"correct":[1],"why":"Dấu hiệu tập trung vào A."},{"id":"T6-B05-C19","prompt":"Bạn thấy tên Wi-Fi rồi kết luận “chắc chắn vào Internet được”. Nêu phản ví dụ và một phép thử.","type":"practice","rubric":["1 điểm: Wi-Fi còn nhưng đường ra Internet hỏng.","1 điểm: thử mở địa chỉ Internet đáng tin đã biết."]},{"id":"T6-B05-C20","prompt":"Trang có tiêu đề đúng nhưng thông tin chưa có nguồn. Vì sao tính phổ biến của Internet không đủ bảo đảm thông tin đúng?","type":"practice","rubric":["1 điểm: nhiều người có thể đăng/chia sẻ.","1 điểm: đề xuất kiểm tra nguồn hoặc đối chiếu nguồn độc lập phù hợp."]}]},{"goal":"Lập phương án làm việc trực tuyến có dự phòng.","text":"Ghép công cụ với ràng buộc thời gian và kết nối.","tasks":[{"id":"T6-B05-C21","prompt":"Nhóm cần xem chung hướng dẫn tối nay, một bạn mạng chập chờn. Cách nào hợp lý?","type":"choice","choices":["Chỉ chiếu hướng dẫn tại trường","Chỉ gửi một ảnh không đọc được","Chỉ gọi video độ phân giải cao","Gửi tệp nhẹ để tải trước và có bản tóm tắt bằng chữ"],"correct":[3],"why":"Bản tải trước giúp tiếp tục đọc khi mạng ngắt."},{"id":"T6-B05-C22","prompt":"Nhóm muốn họp rồi nộp tệp đã thống nhất. Chọn kế hoạch phù hợp?","type":"choice","choices":["Nộp từng bản nháp trước cuộc họp","Chia sẻ tệp riêng mà cô không truy cập được","Chỉ gọi, không lưu tệp","Gọi khi đủ người; lưu và nộp một bản cuối qua kênh lớp"],"correct":[3],"why":"Hai công cụ phục vụ hai việc, cần bản cuối và quyền đọc."},{"id":"T6-B05-C23","prompt":"Mất Internet trước hạn nhưng máy còn tệp. Kế hoạch nào giữ được tiến độ?","type":"choice","choices":["Đánh dấu đã nộp dù chưa gửi","Lưu bản cuối; dùng kết nối được phép khi có lại để nộp và kiểm tra xác nhận","Xóa bản cuối rồi soạn lại","Chờ mà không lưu bài"],"correct":[1],"why":"Giữ tệp và kiểm tra gửi thành công."},{"id":"T6-B05-C24","prompt":"Lập kế hoạch làm bài nhóm từ xa: thảo luận, chia sẻ bản chung, nộp bản cuối; nêu phương án khi một bạn tạm mất mạng.","type":"practice","rubric":["1 điểm: kênh thảo luận.","1 điểm: chia sẻ và nộp bản cuối.","1 điểm: dự phòng phù hợp, như tải bản đọc trước và gửi góp ý khi có mạng."]},{"id":"T6-B05-C25","prompt":"Lớp cần học trực tuyến nhưng có bạn kết nối yếu. Đề xuất hai cách nhận nội dung và cách kiểm tra bạn đã nhận được.","type":"practice","rubric":["1 điểm mỗi cách khả thi, như video trực tiếp và bản tóm tắt nhẹ.","1 điểm: phản hồi hoặc xác nhận nhận được."]}]}],"extras":[]},"17":{"n":17,"title":"Chương trình máy tính","pages":"71–74","stages":[{"goal":"Nhận diện chương trình và các khối Scratch.","text":"Chương trình mô tả thuật toán để máy thực hiện.","tasks":[{"id":"T6-B17-C01","prompt":"Chương trình máy tính là gì?","type":"choice","choices":["Chỉ hình minh họa","Chỉ kết quả in ra","Chỉ tên tệp","Mô tả thuật toán để máy tính hiểu và thực hiện"],"correct":[3],"why":"Máy cần các lệnh có thể thực hiện."},{"id":"T6-B17-C02","prompt":"Khối Scratch nào thường khởi động kịch bản khi bấm cờ?","type":"choice","choices":["Nói “Xin chào”","Hỏi và đợi","Đặt x thành 0","Khi bấm vào cờ xanh"],"correct":[3],"why":"Khối sự kiện mở đầu kịch bản."},{"id":"T6-B17-C03","prompt":"Khối “hỏi … và đợi” giúp làm gì?","type":"choice","choices":["Luôn nhân hai số","Nhận dữ liệu người dùng nhập","Tự in ra giấy","Đóng tệp dự án"],"correct":[1],"why":"Câu trả lời dùng làm đầu vào."},{"id":"T6-B17-C04","prompt":"Trong Scratch, biến a dùng để làm gì?","type":"choice","choices":["Lưu giá trị có thể dùng lại hoặc thay đổi","Vẽ khung cửa sổ","Tạo kết nối mạng","Chỉ đặt tên dự án"],"correct":[0],"why":"Biến giữ dữ liệu của chương trình."},{"id":"T6-B17-C05","prompt":"Khối nào làm nhân vật hiển thị kết quả?","type":"choice","choices":["Nói kết quả","Đặt biến a","Hỏi và đợi","Khi bấm cờ"],"correct":[0],"why":"Khối nói đưa kết quả ra màn hình."}]},{"goal":"Đối chiếu bước thuật toán với khối lệnh.","text":"Nhìn vai trò sự kiện, nhập, biến, xử lí và đầu ra.","tasks":[{"id":"T6-B17-C06","prompt":"“Hỏi số thứ nhất, rồi lưu lại” tương ứng thế nào?","type":"choice","choices":["Nói a rồi bấm cờ","Chỉ đổi hình nhân vật","Hỏi và đợi, rồi đặt a thành Trả lời","Đặt a thành 0 sau khi hiển thị"],"correct":[2],"why":"Cần lưu câu trả lời trước khi hỏi câu khác."},{"id":"T6-B17-C07","prompt":"“Tính tổng a và b” tương ứng khối nào?","type":"choice","choices":["Đặt tổng thành a","Đặt tổng thành (a + b)","Hỏi tổng rồi đợi","Nói “a + b” dưới dạng chữ cố định"],"correct":[1],"why":"Phải dùng phép toán trên hai biến."},{"id":"T6-B17-C08","prompt":"Vì sao cần lưu câu trả lời thứ nhất vào a trước khi hỏi tiếp?","type":"choice","choices":["Giá trị Trả lời sẽ cập nhật khi có câu trả lời mới","Lệnh nói xóa mọi biến","Scratch không cho nhập hai lần","Cờ xanh chỉ nhận số chẵn"],"correct":[0],"why":"Lưu riêng để giữ cả hai đầu vào."},{"id":"T6-B17-C09","prompt":"Thuật toán nói “nếu a > b thì nói a, nếu không thì nói b”. Dùng khối nào cho hai nhánh?","type":"choice","choices":["Lặp lại 2 lần","Đợi 1 giây","Đặt a thành 0","Nếu … thì … nếu không"],"correct":[3],"why":"Cần chọn đúng một trong hai nhánh."},{"id":"T6-B17-C10","prompt":"Cách nào giúp biết chương trình thực hiện đúng thuật toán?","type":"choice","choices":["So kết quả chạy với kết quả dự kiến trên cùng dữ liệu","Chỉ lưu tên dự án","Chỉ đếm số khối","Chỉ nhìn màu khối"],"correct":[0],"why":"Chạy thử đối chiếu kết quả."}]},{"goal":"Lắp và chạy thử chương trình ngắn.","text":"Nhập giá trị, theo dõi biến, so kết quả.","tasks":[{"id":"T6-B17-C11","prompt":"Chương trình đặt a = 6, b = 4 rồi nói a + b. Nhân vật nói gì?","type":"choice","choices":["64","24","10","2"],"correct":[2],"why":"Khối cộng cho 10."},{"id":"T6-B17-C12","prompt":"Nhập 9, đặt n bằng Trả lời; nếu n > 5 thì nói “Lớn”, nếu không nói “Nhỏ hoặc bằng”. Kết quả?","type":"choice","choices":["9","Không nói gì","Lớn","Nhỏ hoặc bằng"],"correct":[2],"why":"9 thỏa điều kiện."},{"id":"T6-B17-C13","prompt":"Đặt x = 0, lặp 3 lần “thay đổi x một lượng 2”, rồi nói x. Kết quả?","type":"choice","choices":["3","6","8","2"],"correct":[1],"why":"Ba lần tăng 2 từ 0."},{"id":"T6-B17-C14","prompt":"Tạo chương trình hỏi hai số, lưu vào a và b, rồi nói tổng. Chạy với 3 và 8.","type":"practice","rubric":["1 điểm: hỏi và lưu riêng hai số.","1 điểm: khối cộng và nói đúng.","1 điểm: chạy cho 11."]},{"id":"T6-B17-C15","prompt":"Lắp kịch bản đặt điểm = 0, lặp 4 lần tăng điểm thêm 1, rồi nói điểm. Chạy và ghi kết quả.","type":"practice","rubric":["1 điểm: khởi tạo đúng.","1 điểm: lặp tăng đúng.","1 điểm: kết quả 4."]}]},{"goal":"Phát hiện sai ở phép tính, khối lệnh hoặc điều kiện.","text":"Dùng kết quả mong đợi để tìm chỗ lệch.","tasks":[{"id":"T6-B17-C16","prompt":"Nhập 8, 3; chương trình cần cộng nhưng nói 5. Trong khối tính đang dùng a − b. Sửa gì?","type":"choice","choices":["Xóa khối lưu b","Đổi phép trừ thành phép cộng","Đổi thứ tự bấm cờ và nhập","Chỉ đổi chữ hiển thị"],"correct":[1],"why":"5 là hiệu; cần tổng 11."},{"id":"T6-B17-C17","prompt":"Hỏi hai số liên tiếp rồi đặt cả a lẫn b bằng Trả lời. Với 2 và 7, lỗi nào xảy ra?","type":"choice","choices":["Cả a và b nhận 2","a nhận 2 và b nhận 7","Cả a và b nhận 7","a nhận 7, b nhận 0"],"correct":[2],"why":"Sau hai lượt, Trả lời giữ giá trị cuối."},{"id":"T6-B17-C18","prompt":"Muốn đếm từ 1 đến 3 nhưng đặt x = 0 trong mỗi lượt trước khi tăng 1. Chương trình nói gì trong ba lượt?","type":"choice","choices":["1, 2, 3","0, 1, 2","1, 1, 1","3, 2, 1"],"correct":[2],"why":"Khởi tạo lại trong thân làm mất tích lũy."},{"id":"T6-B17-C19","prompt":"Kịch bản đặt tổng = 0, lặp 3 lần “đặt tổng thành 2”, rồi nói tổng. Sửa để kết quả là 6 và giải thích.","type":"practice","rubric":["1 điểm: thay bằng tăng tổng thêm 2.","1 điểm: kết quả 0 → 2 → 4 → 6."]},{"id":"T6-B17-C20","prompt":"Quy tắc điểm từ 5 là “Đạt” nhưng chương trình dùng > 5. Nêu ca sai, sửa khối và chạy lại.","type":"practice","rubric":["1 điểm: ca 5 sai.","1 điểm: dùng “không nhỏ hơn 5” hoặc điều kiện tương đương.","1 điểm: ca 5 trả “Đạt”."]}]},{"goal":"Tạo chương trình và kiểm chứng nhiều trường hợp.","text":"Chuyển thuật toán thành khối lệnh; thử đủ đường đi.","tasks":[{"id":"T6-B17-C21","prompt":"Chương trình báo số lớn hơn của a, b. Bộ dữ liệu nào kiểm tra cả a lớn hơn, b lớn hơn và bằng nhau?","type":"choice","choices":["(8, 3), (3, 8), (4, 4)","(4, 4), (3, 3), (2, 2)","(8, 3), (8, 3), (8, 3)","(8, 3), (9, 4), (5, 2)"],"correct":[0],"why":"Ba ca bao phủ các quan hệ khác nhau."},{"id":"T6-B17-C22","prompt":"Cần hỏi số thẻ và số bạn rồi báo số có thể phát, mỗi bạn một thẻ. Phép xử lí nào đúng?","type":"choice","choices":["Luôn lấy số bạn","Luôn lấy số thẻ","Cộng hai số","Lấy số nhỏ hơn trong hai số"],"correct":[3],"why":"Giới hạn bởi cả thẻ lẫn số bạn."},{"id":"T6-B17-C23","prompt":"Chương trình đọc a, b rồi báo “Bằng nhau” hoặc giá trị lớn hơn. Với (4, 4), (2, 6), (8, 1), kết quả đúng lần lượt là gì?","type":"choice","choices":["8; 8; 9","Bằng nhau; 6; 8","Bằng nhau; 2; 1","4; 2; 1"],"correct":[1],"why":"Ca bằng nhau phải báo riêng; hai ca khác lấy số lớn hơn."},{"id":"T6-B17-C24","prompt":"Tạo chương trình Scratch nhập a, b, báo số nhỏ hơn; nếu bằng nhau, báo “Hai số bằng nhau”. Chạy với (3, 8), (8, 3), (5, 5).","type":"practice","rubric":["1 điểm: lưu hai đầu vào riêng.","1 điểm: xử lí đúng cả ba trường hợp.","1 điểm: ghi kết quả 3, 3 và thông báo bằng nhau."]},{"id":"T6-B17-C25","prompt":"Tạo chương trình hỏi số quyển vở không âm của hai tổ. Tính tổng; nếu tổng từ 10 trở lên nói “Đủ”, nếu không nói “Thiếu”. Thử (4, 5), (4, 6), (4, 7).","type":"practice","rubric":["1 điểm: nhập riêng và tính tổng đúng.","1 điểm: nhánh bao gồm ngưỡng 10.","1 điểm: kết quả Thiếu, Đủ, Đủ."]}]}],"extras":[]},"10":{"n":10,"title":"Sơ đồ tư duy","pages":"42–47","stages":[{"goal":"Nhận ra thành phần và ích lợi của sơ đồ tư duy.","text":"Chủ đề ở trung tâm, ý lớn tỏa thành nhánh, chi tiết đi từ ý lớn.","tasks":[{"id":"T6-B10-C01","prompt":"Nội dung nào thường đặt ở giữa sơ đồ?","type":"choice","choices":["Số trang","Chủ đề chính","Mọi chi tiết nhỏ","Tên tệp"],"correct":[1],"why":"Trung tâm nêu nội dung bao quát."},{"id":"T6-B10-C02","prompt":"Nhánh nối trực tiếp từ chủ đề thường là gì?","type":"choice","choices":["Lề trái","Chú thích trang","Tên tệp","Nhánh chính"],"correct":[3],"why":"Nhánh chính biểu diễn các ý lớn."},{"id":"T6-B10-C03","prompt":"Thành phần nào giúp sơ đồ dễ nhìn?","type":"choice","choices":["Mỗi nhánh là một đoạn dài","Mọi ý nằm trong một dòng","Từ khóa ngắn và hình ảnh phù hợp","Chỉ dùng tên tệp"],"correct":[2],"why":"Từ khóa và hình làm nổi bật ý."},{"id":"T6-B10-C04","prompt":"Sơ đồ tư duy đặc biệt hữu ích khi nào?","type":"choice","choices":["Tóm tắt và tổ chức ý theo nhóm","Cần lưu bản thu âm nguyên vẹn","Cần gửi tệp qua thư","Cần đo độ dài vật"],"correct":[0],"why":"Sơ đồ biểu diễn mối liên hệ giữa các ý."},{"id":"T6-B10-C05","prompt":"Sau khi tạo sơ đồ bằng phần mềm, thao tác nào giữ bản để sửa tiếp?","type":"choice","choices":["Chỉ đổi màu nền","Chỉ thu nhỏ cửa sổ","Lưu tệp sơ đồ","Chỉ phóng to màn hình"],"correct":[2],"why":"Lưu định dạng sơ đồ giữ cấu trúc có thể sửa."}]},{"goal":"Phân biệt ý lớn và chi tiết.","text":"Đặt chi tiết dưới nhánh chứa nó, ở mức khái quát phù hợp.","tasks":[{"id":"T6-B10-C06","prompt":"Chủ đề “Sổ lưu niệm lớp”. Mục nào bao quát để làm nhánh chính?","type":"choice","choices":["Ảnh tập thể trong chuyến đi","Hoạt động của lớp","Chuyến dã ngoại ngày 12/11","Tên trò chơi kéo co"],"correct":[1],"why":"Các ví dụ còn lại cụ thể hơn."},{"id":"T6-B10-C07","prompt":"Dưới “Hoạt động”, mục nào cùng nhóm với “Hội khỏe”?","type":"choice","choices":["Số trang in","Ngày hội đọc sách","Tên cô chủ nhiệm","Bìa màu xanh"],"correct":[1],"why":"Cả hai là sự kiện của lớp."},{"id":"T6-B10-C08","prompt":"“Giáo viên” → “Cô chủ nhiệm” thể hiện quan hệ nào?","type":"choice","choices":["Hai mục không liên quan","Hai chủ đề trung tâm","Nhóm và một thành viên cụ thể","Một tệp và phần mở rộng"],"correct":[2],"why":"Chi tiết cụ thể hóa nhánh."},{"id":"T6-B10-C09","prompt":"Vì sao không đưa cả đoạn văn dài vào nhánh?","type":"choice","choices":["Mọi nhánh chỉ được có hình","Sơ đồ không được có chữ","Từ khóa giúp nhận ra ý và mối liên hệ nhanh hơn","Phần mềm không lưu được chữ"],"correct":[2],"why":"Sơ đồ dùng để tóm tắt."},{"id":"T6-B10-C10","prompt":"Một ảnh tập thể có thể thêm ở đâu để hỗ trợ nhánh “Chuyến đi”?","type":"choice","choices":["Gắn với nhánh “Chuyến đi”","Thay toàn bộ chủ đề bằng tên tệp ảnh","Đặt dưới nhánh “Lời chúc” dù không liên quan","Thêm như nhánh chính duy nhất"],"correct":[0],"why":"Ảnh nên đi cùng ý được minh họa."}]},{"goal":"Nhóm dữ liệu và tạo nhánh.","text":"Biến một danh sách nhỏ thành sơ đồ có thứ bậc.","tasks":[{"id":"T6-B10-C11","prompt":"Chủ đề “Ngày hội đọc”. Nhánh “Chuẩn bị” nên chứa mục nào?","type":"choice","choices":["Bản tổng kết sau ngày hội","Chọn sách trưng bày","Chấm giải sau ngày hội","Ảnh đã chụp ngày hôm đó"],"correct":[1],"why":"Chọn sách diễn ra trong khâu chuẩn bị."},{"id":"T6-B10-C12","prompt":"Muốn thêm “Ảnh kéo co” dưới “Hội khỏe”, chọn thao tác nào?","type":"choice","choices":["Chọn “Hội khỏe”, thêm chủ đề con","Chọn trung tâm, tạo thêm chủ đề trung tâm","Chọn nhánh khác rồi thêm nhánh ngang cấp","Xóa nhánh Hội khỏe"],"correct":[0],"why":"Chủ đề con tạo đúng quan hệ."},{"id":"T6-B10-C13","prompt":"Thứ tự nào giúp dựng sơ đồ từ danh sách?","type":"choice","choices":["Tô màu mọi mục trước khi xác định ý","Xác định chủ đề, nhóm ý lớn, thêm chi tiết, lưu","Lưu tên tệp, bỏ các nhóm","Thêm chi tiết ngẫu nhiên, xóa trung tâm, lưu"],"correct":[1],"why":"Thứ bậc quyết định vị trí các nội dung."},{"id":"T6-B10-C14","prompt":"Vẽ sơ đồ “Góc học tập” từ bốn mục: sách giáo khoa, truyện, bút chì, thước. Dùng hai nhánh chính.","type":"practice","rubric":["1 điểm: trung tâm đúng.","1 điểm: hai nhóm hợp lý, mỗi mục đặt đúng nhánh."]},{"id":"T6-B10-C15","prompt":"Tạo sơ đồ số “Kế hoạch trồng cây” với nhánh Chuẩn bị và Chăm sóc; thêm một chi tiết cho mỗi nhánh rồi lưu.","type":"practice","rubric":["1 điểm: đủ cấu trúc.","1 điểm: hai chi tiết phù hợp.","1 điểm: tệp lưu mở lại được."]}]},{"goal":"Phát hiện lỗi phân nhóm và mức khái quát.","text":"Kiểm tra một chi tiết có trả lời đúng nội dung nhánh mẹ hay không.","tasks":[{"id":"T6-B10-C16","prompt":"Sơ đồ có “Ảnh lớp” đặt dưới “Lời chúc”, trong khi có nhánh “Ảnh kỉ niệm”. Sửa thế nào?","type":"choice","choices":["Tạo hai bản ảnh giống nhau ở hai nhánh","Xóa ảnh dù cần giữ","Đổi chủ đề trung tâm thành “Lời chúc”","Chuyển “Ảnh lớp” sang “Ảnh kỉ niệm”"],"correct":[3],"why":"Đặt chi tiết theo vai trò của nó."},{"id":"T6-B10-C17","prompt":"Hai nhánh chính “Hội khỏe” và “Ảnh kéo co” cùng nói về một sự kiện. Sửa cấu trúc thế nào?","type":"choice","choices":["Đặt ảnh kéo co dưới Hội khỏe","Đặt Hội khỏe dưới ảnh kéo co","Xóa Hội khỏe","Tách thành hai sơ đồ không còn liên hệ"],"correct":[0],"why":"Sự kiện bao quát ảnh cụ thể."},{"id":"T6-B10-C18","prompt":"Một nhánh “Chuẩn bị” chứa đoạn văn liệt kê giấy, bút, ảnh. Cách sửa dễ đọc?","type":"choice","choices":["Đưa cả đoạn vào trung tâm","Nối đoạn văn thêm dài","Giữ đoạn và xóa nhãn nhánh","Tách thành ba từ khóa dưới “Chuẩn bị”"],"correct":[3],"why":"Từ khóa giúp đọc nhanh từng mục."},{"id":"T6-B10-C19","prompt":"Sơ đồ “Ngày tham quan” đặt “Xe buýt” dưới “Địa điểm” và “Bảo tàng” dưới “Di chuyển”. Chỉ ra và sửa hai mục.","type":"practice","rubric":["1 điểm: Xe buýt → Di chuyển.","1 điểm: Bảo tàng → Địa điểm."]},{"id":"T6-B10-C20","prompt":"Bạn gửi ảnh chụp sơ đồ; nhóm cần sửa tiếp nhưng không có tệp gốc. Giải thích và đề xuất bản cần gửi.","type":"practice","rubric":["1 điểm: ảnh không giữ nhánh dưới dạng chỉnh sửa được.","1 điểm: gửi tệp gốc hoặc bản có quyền chỉnh sửa phù hợp."]}]},{"goal":"Thiết kế sơ đồ cho người dùng cụ thể.","text":"Tổ chức sao cho người xem tìm được nội dung và nhóm có thể sửa tiếp.","tasks":[{"id":"T6-B10-C21","prompt":"Sổ lớp cần tra hoạt động theo sự kiện và tìm thành viên theo tổ. Sơ đồ nào hợp lý?","type":"choice","choices":["Chỉ nhóm theo màu ảnh","Một nhánh duy nhất là tất cả tên bạn","Đặt từng ảnh làm trung tâm riêng","Hai nhánh Hoạt động và Thành viên, chia theo sự kiện và tổ tương ứng"],"correct":[3],"why":"Cấu trúc phục vụ hai cách tra."},{"id":"T6-B10-C22","prompt":"Khi cần vừa trình chiếu vừa chỉnh sửa sau, nên giữ gì?","type":"choice","choices":["Chỉ ảnh chụp mờ","Chỉ bản in đã cắt nhánh","Tệp gốc và bản xuất để xem","Chỉ tên phần mềm"],"correct":[2],"why":"Tệp gốc dùng để sửa; bản xuất để trình chiếu."},{"id":"T6-B10-C23","prompt":"Cách kiểm tra nhanh sơ đồ dễ tra cứu?","type":"choice","choices":["Nhờ bạn tìm một chi tiết và nói đường từ trung tâm đến đó","Chỉ kiểm tra trang đầu phần mềm","Chỉ xem tên tệp","Đếm màu càng nhiều càng tốt"],"correct":[0],"why":"Thử tra cứu cho thấy cấu trúc có rõ không."},{"id":"T6-B10-C24","prompt":"Tạo sơ đồ cho “Sổ lưu niệm lớp” có ít nhất ba nhánh chính, mỗi nhánh hai chi tiết. Chỉ đường tìm một chi tiết và lưu tệp.","type":"practice","rubric":["1 điểm: đủ nhánh và chi tiết.","1 điểm: phân nhóm và đường tìm đúng.","1 điểm: lưu tệp mở lại được."]},{"id":"T6-B10-C25","prompt":"Thiết kế sơ đồ “An toàn trên mạng” cho bạn mới học. Dùng ít nhất ba nhóm nguy cơ/biện pháp phù hợp và giải thích cách làm nổi một quy tắc quan trọng.","type":"practice","rubric":["1 điểm: trung tâm, ít nhất ba nhóm hợp lý.","1 điểm: chi tiết an toàn đúng.","1 điểm: giải thích cách nhấn giúp người đọc thấy quy tắc."]}]}],"extras":[]},"2":{"n":2,"title":"Xử lí thông tin","pages":"8–11","stages":[{"goal":"Gọi tên bốn hoạt động thông tin.","text":"Phân biệt thu nhận, xử lí, lưu trữ và truyền.","tasks":[{"id":"T6-B02-C01","prompt":"Việc nhìn con số trên nhiệt kế là hoạt động nào?","type":"choice","choices":["Truyền","Xử lí","Lưu trữ","Thu nhận"],"correct":[3],"why":"Người quan sát nhận dữ liệu qua mắt."},{"id":"T6-B02-C02","prompt":"Lưu ảnh vào thư mục để hôm sau xem lại là gì?","type":"choice","choices":["So sánh","Thu nhận","Truyền","Lưu trữ"],"correct":[3],"why":"Ảnh được giữ để dùng lại."},{"id":"T6-B02-C03","prompt":"Tính tổng số bạn đi tham quan từ danh sách từng tổ là gì?","type":"choice","choices":["Thu nhận","Truyền","Xử lí","Lưu trữ"],"correct":[2],"why":"Phép tính biến dữ liệu thành kết quả mới."},{"id":"T6-B02-C04","prompt":"Đọc kết quả cho cả lớp nghe chủ yếu là hoạt động gì?","type":"choice","choices":["Truyền","Xử lí","Ghi nhớ","Lưu trữ"],"correct":[0],"why":"Kết quả được đưa đến người nghe."},{"id":"T6-B02-C05","prompt":"Thiết bị nào giúp đưa tiếng nói vào máy tính?","type":"choice","choices":["Màn hình","Micrô","Máy in","Loa"],"correct":[1],"why":"Micrô thu âm để đưa vào máy tính."}]},{"goal":"Phân biệt vai trò của từng thao tác và thiết bị.","text":"Xét việc thao tác làm trong tình huống đã nêu.","tasks":[{"id":"T6-B02-C06","prompt":"Đo nhiệt độ rồi ghi vào sổ. Hai hoạt động chính lần lượt là gì?","type":"choice","choices":["Truyền, xử lí","Xử lí, truyền","Thu nhận, lưu trữ","Lưu trữ, thu nhận"],"correct":[2],"why":"Đo để lấy số liệu; ghi để giữ số liệu."},{"id":"T6-B02-C07","prompt":"Đọc tin nhắn cô gửi rồi nhắn lại cho nhóm. Xét riêng em, hai hoạt động là gì?","type":"choice","choices":["Xử lí rồi lưu trữ","Lưu trữ rồi xử lí","Thu nhận rồi truyền","Truyền rồi thu nhận"],"correct":[2],"why":"Em nhận tin trước, gửi thông tin sau."},{"id":"T6-B02-C08","prompt":"Chụp ảnh bảng và sao ảnh đó vào một thư mục. Thao tác thứ hai có mục đích chính gì?","type":"choice","choices":["Giữ ảnh để mở lại","Thông báo cho người khác","Tính toán từ ảnh","Đo thêm dữ liệu"],"correct":[0],"why":"Sao vào thư mục là lưu một bản ảnh."},{"id":"T6-B02-C09","prompt":"Máy tính giúp gì khi cần tính tổng số liệu của 30 dòng theo cùng một cách?","type":"choice","choices":["Chỉ hiển thị dữ liệu, không thể tính","Tự biết số liệu nào đúng mà không cần kiểm tra","Tính nhanh và có thể tính lại khi số liệu thay đổi","Luôn cho kết quả đúng dù nhập sai"],"correct":[2],"why":"Máy thực hiện phép tính nhanh; vẫn phải kiểm tra dữ liệu và công thức."},{"id":"T6-B02-C10","prompt":"Lọc danh sách theo lớp 6A khác với gửi danh sách ở điểm nào?","type":"choice","choices":["Gửi luôn tự lọc đúng lớp","Lọc là gửi; gửi là thu nhận","Cả hai chỉ lưu tệp","Lọc tạo tập kết quả theo điều kiện; gửi chuyển kết quả đến người nhận"],"correct":[3],"why":"Lọc là xử lí; gửi là truyền."}]},{"goal":"Thực hiện một chuỗi thao tác có đầu vào và kết quả.","text":"Dùng dữ liệu đã cho để tính, ghi và báo kết quả.","tasks":[{"id":"T6-B02-C11","prompt":"Ba tổ báo có 8, 7 và 9 bạn đăng kí. Kết quả xử lí để biết tổng là gì?","type":"choice","choices":["3 bạn","8079 bạn","24 bạn","9 bạn"],"correct":[2],"why":"Cộng 8 + 7 + 9 = 24."},{"id":"T6-B02-C12","prompt":"Muốn máy tính tính trung bình ba lần đo, cần đưa vào dữ liệu gì?","type":"choice","choices":["Ba giá trị đo cùng đơn vị","Tên lớp và ngày sinh","Chỉ lần đo cao nhất","Chỉ giá trị cần báo cáo sau cùng"],"correct":[0],"why":"Trung bình cần đủ các giá trị đầu vào."},{"id":"T6-B02-C13","prompt":"Muốn mai cả nhóm mở lại kết quả đã tính, cách nào đáp ứng cả lưu và truyền?","type":"choice","choices":["Lưu tệp kết quả rồi gửi tệp cho nhóm","Chỉ tính lại trên giấy rồi bỏ giấy","Chỉ ghi nhớ kết quả","Chỉ xem kết quả trên màn hình"],"correct":[0],"why":"Lưu tạo bản dùng lại; gửi chuyển bản đó cho nhóm."},{"id":"T6-B02-C14","prompt":"Tổ 1 đọc 3 chai, tổ 2 đọc 5 chai, tổ 3 đọc 4 chai. Tính tổng và ghi một dòng thông báo cho lớp.","type":"practice","rubric":["1 điểm: tổng 12 chai.","1 điểm: thông báo ghi rõ 12 là tổng của ba tổ."]},{"id":"T6-B02-C15","prompt":"Với bài thu tiếng chim, nêu thiết bị để thu, cách lưu và cách chuyển bản ghi cho giáo viên.","type":"practice","rubric":["1 điểm mỗi ý: thiết bị có micrô; lưu tệp âm thanh; gửi tệp qua kênh cô quy định."]}]},{"goal":"Chẩn đoán sai sót trong luồng thông tin.","text":"Tách lỗi đầu vào, lỗi xử lí và lỗi chuyển kết quả.","tasks":[{"id":"T6-B02-C16","prompt":"Các tổ báo 8, 7, 9 nhưng bảng ghi 8, 7, 6 rồi tính 21 đúng theo bảng. Lỗi bắt đầu ở đâu?","type":"choice","choices":["Đọc tên ba tổ","Ghi sai dữ liệu tổ 3","Phép cộng theo bảng","Truyền kết quả cho lớp"],"correct":[1],"why":"Đầu vào bị chép nhầm 9 thành 6."},{"id":"T6-B02-C17","prompt":"Bảng ghi đúng 8, 7, 9 nhưng báo tổng 23. Cần kiểm tra trước bước nào?","type":"choice","choices":["Đo lại nhiệt độ","Tính tổng","Gọi tên lớp","Chọn nơi cất tệp"],"correct":[1],"why":"Dữ liệu đúng nhưng kết quả xử lí sai."},{"id":"T6-B02-C18","prompt":"Tệp đúng còn trong máy; bạn cùng nhóm chưa có bản nào. Thiếu bước gì?","type":"choice","choices":["Tính tổng lần nữa","Chuyển tệp hoặc chia sẻ đúng quyền cho bạn","Nhập dữ liệu khác","Đổi tên máy tính"],"correct":[1],"why":"Đã lưu nhưng chưa truyền tới người cần."},{"id":"T6-B02-C19","prompt":"Bạn đo 18 °C, 20 °C và 19 °C, nhưng báo 20 °C là trung bình. Tìm lỗi và sửa kết quả.","type":"practice","rubric":["1 điểm: dùng giá trị lớn nhất thay vì trung bình.","1 điểm: (18 + 20 + 19) : 3 = 19 °C."]},{"id":"T6-B02-C20","prompt":"Sáng mai dùng lại kết quả khảo sát nhưng máy sắp tắt, kết quả chỉ hiện trên màn hình. Nêu việc cần làm ngay và cách kiểm tra.","type":"practice","rubric":["1 điểm: lưu tệp.","1 điểm: mở lại tệp đúng nơi và đối chiếu dữ liệu/kết quả."]}]},{"goal":"Thiết kế quy trình và kiểm tra kết quả.","text":"Lập chuỗi từ thu nhận đến truyền, kèm cách tránh sai.","tasks":[{"id":"T6-B02-C21","prompt":"Cần báo số sách quyên góp từng tổ và tổng của lớp. Quy trình nào dễ kiểm tra?","type":"choice","choices":["Chỉ gửi tổng trước khi nhập bảng","Nhận số từng tổ, lưu bảng, tính tổng, so lại rồi gửi bảng","Hỏi một tổ, đoán các tổ khác rồi báo","Xóa số từng tổ ngay khi ghi tổng"],"correct":[1],"why":"Giữ số gốc cho phép kiểm tra kết quả."},{"id":"T6-B02-C22","prompt":"Hai tổ ghi “12” nhưng một tổ đếm quyển, một tổ đếm thùng. Làm gì trước khi cộng?","type":"choice","choices":["Gửi hai số với cùng nhãn “quyển”","Lấy trung bình 12","Cộng ngay thành 24 quyển","Xác nhận và quy đổi về cùng đơn vị"],"correct":[3],"why":"Chỉ cộng được khi hai số biểu thị cùng đơn vị."},{"id":"T6-B02-C23","prompt":"Cần báo nhanh và cho người nhận tự kiểm tra tổng. Nội dung gửi nào đủ nhất?","type":"choice","choices":["Tổng kèm bảng số theo tổ và đơn vị","Chỉ ảnh chụp người đếm","Chỉ số tổng không có đơn vị","Chỉ tên các tổ"],"correct":[0],"why":"Bảng nguồn và đơn vị cho phép kiểm tra phép cộng."},{"id":"T6-B02-C24","prompt":"Lập quy trình đếm số bạn đến trường bằng xe đạp trong từng tổ. Nêu bốn hoạt động và một cách tránh đếm trùng.","type":"practice","rubric":["1 điểm: thu nhận và lưu số từng tổ.","1 điểm: xử lí tổng và truyền kết quả.","1 điểm: cách tránh trùng phù hợp, như mỗi bạn chỉ khai ở tổ mình."]},{"id":"T6-B02-C25","prompt":"Nhóm ghi số cây sống của ba luống là 12, 15, 11. Soạn bản báo cáo ngắn, nêu dữ liệu gốc, tổng và cách lưu để ngày mai so sánh.","type":"practice","rubric":["1 điểm mỗi ý: giữ đủ ba giá trị; tổng 38 cây; lưu bảng có ngày và tên luống."]}]}],"extras":[]},"4":{"n":4,"title":"Mạng máy tính","pages":"16–19","stages":[{"goal":"Nhận ra mạng và các thành phần.","text":"Thiết bị đầu cuối trao đổi dữ liệu qua phương tiện, thiết bị kết nối và phần mềm mạng.","tasks":[{"id":"T6-B04-C01","prompt":"Mạng máy tính cần có đặc điểm nào?","type":"choice","choices":["Mọi máy phải có máy in riêng","Các thiết bị được kết nối để trao đổi dữ liệu","Mọi máy phải ở cùng một bàn","Mọi máy phải cùng hãng"],"correct":[1],"why":"Khả năng kết nối và trao đổi là dấu hiệu chính."},{"id":"T6-B04-C02","prompt":"Thiết bị nào là đầu cuối khi học sinh gửi bài?","type":"choice","choices":["Dây mạng","Điểm truy cập không dây","Bộ chuyển mạch","Máy tính của học sinh"],"correct":[3],"why":"Máy học sinh là nơi người dùng gửi dữ liệu."},{"id":"T6-B04-C03","prompt":"Ví dụ nào dùng đường truyền có dây?","type":"choice","choices":["Máy tính dùng điểm phát không dây","Máy bảng dùng Wi-Fi","Máy nối bộ chuyển mạch bằng cáp mạng","Điện thoại nối Wi-Fi"],"correct":[2],"why":"Cáp là phương tiện truyền có dây."},{"id":"T6-B04-C04","prompt":"Việc nào minh họa chia sẻ thiết bị qua mạng?","type":"choice","choices":["Nhiều máy gửi lệnh đến cùng một máy in mạng","Cùng đọc một cuốn sách giấy","Mỗi bạn in trên một máy riêng","Sao tệp bằng USB giữa hai máy không nối mạng"],"correct":[0],"why":"Máy in mạng là tài nguyên dùng chung."},{"id":"T6-B04-C05","prompt":"Thành phần nào điều khiển việc truyền thông tin theo quy tắc của mạng?","type":"choice","choices":["Tờ giấy hướng dẫn","Phần mềm mạng","Bàn phím","Vỏ máy tính"],"correct":[1],"why":"Phần mềm mạng hỗ trợ việc trao đổi dữ liệu."}]},{"goal":"Phân biệt vai trò qua sơ đồ và ví dụ.","text":"Xác định nơi sử dụng, thiết bị chuyển tiếp và cách kết nối.","tasks":[{"id":"T6-B04-C06","prompt":"Trong sơ đồ máy A — bộ chuyển mạch — máy B, thiết bị nào kết nối hai máy?","type":"choice","choices":["Máy A","Bộ chuyển mạch","Máy B","Màn hình của A"],"correct":[1],"why":"Bộ chuyển mạch liên kết các đầu cuối."},{"id":"T6-B04-C07","prompt":"Máy tính bảng đi quanh lớp và vẫn kết nối. Phương án nào phù hợp?","type":"choice","choices":["USB lưu tệp","Wi-Fi","Cáp máy chiếu","Cáp cố định đến một bàn"],"correct":[1],"why":"Wi-Fi không buộc thiết bị cắm cáp mạng."},{"id":"T6-B04-C08","prompt":"Hai máy nằm cạnh nhau nhưng không kết nối hoặc trao đổi dữ liệu. Có đủ căn cứ gọi là mạng không?","type":"choice","choices":["Có, nếu dùng cùng màu vỏ","Có, nếu cùng hãng","Không, ở gần chưa chứng minh kết nối","Có, vì có hai máy"],"correct":[2],"why":"Mạng đòi hỏi kết nối chứ không phải khoảng cách gần."},{"id":"T6-B04-C09","prompt":"Một bạn đọc tệp dùng chung; bạn khác in từ máy in mạng. Hai việc chia sẻ gì?","type":"choice","choices":["Tệp và thiết bị","Hai tệp","Hai thiết bị","Hai đường truyền"],"correct":[0],"why":"Tệp là dữ liệu; máy in là thiết bị."},{"id":"T6-B04-C10","prompt":"Máy in có kết nối mạng trong sơ đồ thuộc nhóm nào?","type":"choice","choices":["Phần mềm mạng","Bộ chuyển mạch","Dây dẫn","Thiết bị đầu cuối"],"correct":[3],"why":"Máy in nhận yêu cầu in như một đầu cuối."}]},{"goal":"Áp dụng để kết nối và chia sẻ.","text":"Chọn phương án phù hợp với thiết bị và nhiệm vụ.","tasks":[{"id":"T6-B04-C11","prompt":"Hai máy đã kết nối mạng; cả lớp cần đọc tài liệu từ một bản cập nhật. Cách nào phù hợp?","type":"choice","choices":["Chia sẻ một tệp với quyền đọc cho lớp","Đổi tên mạng theo tên tệp","Phát từng bản cũ rời nhau","Cắm USB chuyển lần lượt mà không giữ bản chính"],"correct":[0],"why":"Một bản dùng chung giúp mở cùng nội dung."},{"id":"T6-B04-C12","prompt":"Phòng có bốn máy bàn và một bộ chuyển mạch đủ cổng. Cần thêm gì để nối các máy bằng dây?","type":"choice","choices":["Một máy in cho từng máy","Bốn ổ USB","Bốn màn hình phụ","Cáp mạng cho từng máy"],"correct":[3],"why":"Mỗi máy cần đường cáp đến bộ chuyển mạch."},{"id":"T6-B04-C13","prompt":"Máy bảng có Wi-Fi, không có cổng cáp mạng. Thêm gì để máy kết nối không dây với mạng lớp?","type":"choice","choices":["Điểm truy cập Wi-Fi kết nối vào mạng lớp","Màn hình ngoài","Bộ chuyển mạch không có Wi-Fi, dùng một mình","Ổ lưu trữ USB"],"correct":[0],"why":"Điểm truy cập cung cấp kết nối không dây."},{"id":"T6-B04-C14","prompt":"Vẽ sơ đồ hai máy bàn nối bằng cáp qua một bộ chuyển mạch. Ghi nhãn thiết bị đầu cuối và thiết bị kết nối.","type":"practice","rubric":["1 điểm: hai đầu cuối đúng.","1 điểm: bộ chuyển mạch và hai dây đúng."]},{"id":"T6-B04-C15","prompt":"Hai máy trong lớp đã nối mạng. Nêu cách để thử rằng cả hai cùng đọc được một tệp của nhóm.","type":"practice","rubric":["1 điểm: chia sẻ tệp với quyền đọc phù hợp.","1 điểm: mở đúng tệp từ hai máy và kiểm tra nội dung."]}]},{"goal":"Khoanh vùng lỗi từ dấu hiệu.","text":"So thiết bị hoạt động với thiết bị lỗi trước khi kiểm tra chung.","tasks":[{"id":"T6-B04-C16","prompt":"Ba máy in được; riêng máy A báo dây mạng bị ngắt. Nên kiểm tra gì trước?","type":"choice","choices":["Dây và cổng kết nối của máy A","Mực của máy in","Dây màn hình của mọi máy","Tắt toàn bộ mạng ngay"],"correct":[0],"why":"Các máy khác in được; A có dấu hiệu lỗi riêng."},{"id":"T6-B04-C17","prompt":"Máy A mở được tệp X của nhóm nhưng không mở được tệp Y và báo “không có quyền”. Kiểm tra gì?","type":"choice","choices":["Pin bàn phím","Mực in","Quyền truy cập tệp Y","Đổi tất cả dây mạng"],"correct":[2],"why":"Mạng vẫn hoạt động với tệp X; thông báo chỉ rõ quyền Y."},{"id":"T6-B04-C18","prompt":"Các máy vẫn trao đổi tệp với nhau nhưng tất cả đều không tìm thấy một máy in mạng. Kiểm tra gì trước?","type":"choice","choices":["Đổi màn hình các máy","Nguồn và kết nối mạng của máy in","Rút dây của tất cả máy đang chia sẻ tệp","Gõ lại tên mọi tệp"],"correct":[1],"why":"Dấu hiệu tập trung ở máy in."},{"id":"T6-B04-C19","prompt":"Máy bảng mất kết nối ở cuối hành lang nhưng dùng được cạnh điểm phát. Nêu giả thuyết và phép thử đơn giản.","type":"practice","rubric":["1 điểm: tín hiệu yếu ngoài vùng phủ tốt.","1 điểm: thử lại cùng thiết bị, cùng tác vụ gần điểm phát."]},{"id":"T6-B04-C20","prompt":"Sơ đồ ghi máy B nối bộ chuyển mạch, nhưng dây thật đang cắm sang màn hình qua cổng hình ảnh. Sửa sơ đồ hoặc cách nối để B tham gia mạng có dây.","type":"practice","rubric":["1 điểm: phân biệt cáp hình ảnh và cáp mạng.","1 điểm: nối cổng mạng B tới bộ chuyển mạch bằng cáp mạng."]}]},{"goal":"Chọn và kiểm tra mô hình kết nối.","text":"Đáp ứng đồng thời thiết bị cố định, di động và tài nguyên chung.","tasks":[{"id":"T6-B04-C21","prompt":"Phòng có máy bàn cố định và máy bảng di động, cả hai cần in chung. Chọn mô hình nào?","type":"choice","choices":["Chỉ đặt máy in cạnh máy bảng","Mỗi máy dùng một mạng tách biệt không có đường tới máy in","Máy bàn nối cáp; máy bảng nối Wi-Fi cùng mạng với máy in","Chỉ nối cáp máy bàn; để máy bảng ngoại tuyến"],"correct":[2],"why":"Hai loại kết nối có thể đưa thiết bị vào cùng mạng."},{"id":"T6-B04-C22","prompt":"Muốn xác nhận mọi nhóm có thể đọc mà không sửa tệp mẫu, thử gì?","type":"choice","choices":["Chỉ xem dây đã cắm","Chỉ đổi tên tệp","Chỉ mở bằng tài khoản chủ sở hữu","Dùng tài khoản nhóm, thử mở và thử sửa tệp mẫu"],"correct":[3],"why":"Cần thử cả quyền được cấp và thao tác bị hạn chế."},{"id":"T6-B04-C23","prompt":"Trước khi mua máy in riêng cho mỗi nhóm, cách nào tận dụng mạng sẵn có?","type":"choice","choices":["Tháo các thiết bị kết nối","Kết nối mỗi nhóm với một tệp khác","Thử kết nối và chia sẻ một máy in đủ công suất cho các nhóm","Gửi tệp qua USB rồi xóa tệp gốc"],"correct":[2],"why":"Chia sẻ thiết bị giúp tránh mua trùng nếu đáp ứng nhu cầu."},{"id":"T6-B04-C24","prompt":"Vẽ mạng lớp có hai máy bàn dùng cáp, một máy bảng dùng Wi-Fi và máy in dùng chung. Ghi cách thử in từ máy bảng.","type":"practice","rubric":["1 điểm: hai máy bàn nối đúng.","1 điểm: điểm Wi-Fi và máy in cùng mạng.","1 điểm: gửi trang thử từ máy bảng và kiểm tra bản in."]},{"id":"T6-B04-C25","prompt":"Cả lớp cần xem tệp kế hoạch; chỉ tổ trưởng được sửa. Đề xuất cách chia sẻ và hai phép thử với tài khoản khác nhau.","type":"practice","rubric":["1 điểm: cấp quyền theo vai trò.","1 điểm: người xem mở được nhưng không sửa.","1 điểm: tổ trưởng sửa và lưu được bản thử."]}]}],"extras":[]},"1":{"n":1,"title":"Thông tin và dữ liệu","pages":"5–7","stages":[{"goal":"Nhận ra thông tin, dữ liệu và vật mang tin.","text":"Tách nội dung hiểu được khỏi cách ghi và vật chứa nội dung.","tasks":[{"id":"T6-B01-C01","prompt":"Thứ gì là vật mang tin?","type":"choice","choices":["Tấm biển tên lớp","Tên gọi “lớp”","Ý hiểu rằng đây là lớp 6A","Dòng chữ “6A”"],"correct":[0],"why":"Tấm biển là vật chứa dòng chữ."},{"id":"T6-B01-C02","prompt":"Dữ liệu nào được biểu diễn bằng âm thanh?","type":"choice","choices":["Bản ghi tiếng trống","Ảnh chiếc trống","Số lần gõ ghi trên bảng","Dòng chữ “đến giờ vào lớp”"],"correct":[0],"why":"Bản ghi lưu tín hiệu âm thanh."},{"id":"T6-B01-C03","prompt":"Số 29 trên nhiệt kế điện tử thuộc loại nào nếu xét riêng con số hiển thị?","type":"choice","choices":["Một nhận xét về thời tiết","Thiết bị lưu trữ","Vật mang tin","Dữ liệu"],"correct":[3],"why":"Con số là dữ liệu; ý nghĩa còn phụ thuộc đơn vị và ngữ cảnh."},{"id":"T6-B01-C04","prompt":"Thông tin giúp em làm việc gì khi xem thời khóa biểu?","type":"choice","choices":["Tự thay đổi lịch học","Biết cần chuẩn bị sách môn nào","Tăng số tiết trên giấy","Tự xác nhận lớp khác có cùng lịch"],"correct":[1],"why":"Hiểu lịch giúp chuẩn bị đúng sách."},{"id":"T6-B01-C05","prompt":"Dòng chữ “Lối ra” trên biển gồm dữ liệu dạng nào?","type":"choice","choices":["Mùi","Âm thanh","Chữ","Video"],"correct":[2],"why":"Hai từ được biểu diễn bằng chữ."}]},{"goal":"Phân biệt ba vai trò trong ví dụ.","text":"Xem lần lượt vật chứa, dấu hiệu ghi được và điều người nhận hiểu.","tasks":[{"id":"T6-B01-C06","prompt":"Trên tờ giấy có ghi “Thư viện mở lúc 8 giờ”. Vật mang tin và thông tin lần lượt là gì?","type":"choice","choices":["Dòng chữ; tờ giấy","Thư viện; con số 8","Tờ giấy; thư viện mở lúc 8 giờ","Giờ mở cửa; dòng chữ"],"correct":[2],"why":"Giấy mang dòng chữ, người đọc hiểu giờ mở cửa."},{"id":"T6-B01-C07","prompt":"Ảnh và đoạn ghi âm đều báo trời đang mưa. Nhận xét nào đúng?","type":"choice","choices":["Cùng vật mang tin, chắc chắn khác thông tin","Cùng thông tin, khác dạng dữ liệu","Cùng dữ liệu vì cùng nói về mưa","Ảnh mới là dữ liệu, đoạn ghi âm không phải"],"correct":[1],"why":"Một nội dung có thể được biểu diễn bằng nhiều dạng."},{"id":"T6-B01-C08","prompt":"Cùng nhìn ảnh sân ướt, An nghĩ trời vừa mưa, Bình nghĩ sân vừa được tưới. Hai bạn có gì giống nhau?","type":"choice","choices":["Dữ liệu quan sát được","Kết luận về nguyên nhân","Mục đích chụp ảnh","Thông tin chắc chắn về thời tiết"],"correct":[0],"why":"Cùng ảnh nhưng hai cách suy luận khác nhau."},{"id":"T6-B01-C09","prompt":"Tờ lịch và bảng điện tử cùng ghi 12/11. Điều nào có thể thay đổi mà nội dung ngày vẫn giữ nguyên?","type":"choice","choices":["Số ngày được thông báo","Ngày được thông báo","Vật mang tin","Tháng của sự kiện"],"correct":[2],"why":"Đổi vật hiển thị không bắt buộc đổi nội dung."},{"id":"T6-B01-C10","prompt":"Nhìn thấy “6” trên một thẻ, vì sao chưa biết đó là số phòng hay số thứ tự?","type":"choice","choices":["Mỗi chữ số chỉ có một cách hiểu","Chữ số không thể là dữ liệu","Thẻ không thể chứa thông tin","Thiếu ngữ cảnh để hiểu con số"],"correct":[3],"why":"Cần biết thẻ dùng vào việc gì."}]},{"goal":"Áp dụng vào một tình huống cụ thể.","text":"Chọn dữ liệu đủ để người đọc quyết định.","tasks":[{"id":"T6-B01-C11","prompt":"Trên lịch lớp ghi “Thứ Tư: Tin học, phòng máy 2”. Em cần biết nơi đến. Chi tiết nào trả lời trực tiếp?","type":"choice","choices":["Vị trí của tờ lịch trên tường","Thứ Tư","Phòng máy 2","Tin học"],"correct":[2],"why":"Tên phòng cho biết nơi đến."},{"id":"T6-B01-C12","prompt":"Muốn giúp bạn không nghe được loa biết giờ họp, em có thể làm gì?","type":"choice","choices":["Chỉ nhắn “Có thông báo”","Ghi giờ họp thành chữ và gửi cho bạn","Gửi ảnh chiếc loa","Phát lại cùng âm thanh to hơn"],"correct":[1],"why":"Chữ biểu diễn giờ họp theo dạng bạn đọc được."},{"id":"T6-B01-C13","prompt":"Trên thẻ mượn sách ghi 15/11 ở cột “Hạn trả”. Đọc được thông tin nào?","type":"choice","choices":["Sách cần được trả vào hoặc trước 15/11","Thẻ được in ngày 15/11","Thư viện đóng cửa ngày 15/11","Sách được mượn đúng ngày 15/11"],"correct":[0],"why":"Tên cột giúp diễn giải ngày."},{"id":"T6-B01-C14","prompt":"Một bảng ở cổng ghi “Lớp 6B học phòng 203”. Chỉ ra vật mang tin, dữ liệu và thông tin giúp một bạn 6B đi đúng phòng.","type":"practice","rubric":["1 điểm mỗi ý: bảng; dòng chữ có số 203; lớp 6B cần đến phòng 203."]},{"id":"T6-B01-C15","prompt":"Chuyển thông báo miệng “Tập trung lúc 7 giờ tại sân trường” thành tin nhắn. Giữ đủ chi tiết để bạn đến đúng nơi, đúng giờ.","type":"practice","rubric":["1 điểm mỗi ý: viết thành tin nhắn; giữ 7 giờ; giữ sân trường."]}]},{"goal":"Phát hiện thiếu hoặc hiểu sai ngữ cảnh.","text":"Tìm chi tiết gây nhầm và chỉ ra cần kiểm tra gì.","tasks":[{"id":"T6-B01-C16","prompt":"Tờ giấy chỉ ghi “Nộp ngày 15”. Học sinh biết có hai môn cùng giao bài. Cần bổ sung gì để tránh nhầm bài và hạn?","type":"choice","choices":["Chỉ chữ “Nộp” in đậm","Tên bài hoặc môn và ngày, tháng đầy đủ","Chỉ màu giấy khác","Chỉ tên người viết"],"correct":[1],"why":"Thiếu cả đối tượng cần nộp và tháng."},{"id":"T6-B01-C17","prompt":"Bạn gọi tờ phiếu in “17 điểm” là dữ liệu số. Sửa thế nào?","type":"choice","choices":["Cả tờ phiếu lẫn 17 đều là thiết bị số","17 là vật mang tin; tờ phiếu là dữ liệu số","17 là thông tin về thời gian","Tờ phiếu là vật mang tin; 17 là dữ liệu số"],"correct":[3],"why":"Cần tách vật chứa khỏi giá trị ghi trên vật."},{"id":"T6-B01-C18","prompt":"Hai bảng ghi 24: một bảng đo nhiệt độ, một bảng đếm người. Vì sao không thể gộp thành hai phép đo giống nhau?","type":"choice","choices":["Hai số giống nhau thì bắt buộc cùng ý nghĩa","Chỉ bảng nhiệt độ là vật mang tin","Dữ liệu dạng số không dùng để đếm","Đơn vị và đối tượng đo khác nhau"],"correct":[3],"why":"Giá trị số giống nhau vẫn có thể mang ý nghĩa khác."},{"id":"T6-B01-C19","prompt":"Bạn đọc “25” trên tờ ghi chép và kết luận “lớp có 25 học sinh”. Chỉ ra điều chưa đủ và cách ghi để kết luận có căn cứ.","type":"practice","rubric":["1 điểm: chỉ ra thiếu nhãn/ngữ cảnh.","1 điểm: đề xuất ghi “Sĩ số lớp …: 25 học sinh” khi đã kiểm tra con số."]},{"id":"T6-B01-C20","prompt":"Tờ giấy ghi “họp thứ Sáu” nhưng loa thông báo “thứ Năm”. Nêu hai việc cần xác minh trước khi nhắn lại.","type":"practice","rubric":["1 điểm: xác định hai thông báo có cùng lớp/sự kiện/ngày tuần không.","1 điểm: hỏi người phụ trách hoặc đối chiếu thông báo mới nhất."]}]},{"goal":"Tạo thông báo và kiểm tra khả năng sử dụng.","text":"Kết hợp đối tượng, việc cần làm, thời gian và nơi chốn.","tasks":[{"id":"T6-B01-C21","prompt":"Lớp 6A đổi phòng tiết Tin thứ Hai từ 203 sang 205. Tin nào giúp người nhận hành động đúng?","type":"choice","choices":["Thứ Hai có phòng 205.","6A: tiết Tin thứ Hai chuyển từ phòng 203 sang 205.","Phòng 203 có thay đổi.","6A chuyển phòng; xem lại lịch cũ."],"correct":[1],"why":"Tin nêu đủ lớp, tiết, ngày và phòng mới."},{"id":"T6-B01-C22","prompt":"Hai nhóm dùng cùng phòng: nhóm 1 vào 8 giờ, nhóm 2 vào 9 giờ. Dạng ghi nào dễ kiểm tra nhất?","type":"choice","choices":["Bảng có cột Nhóm và Giờ, mỗi nhóm một hàng","Ghi tên nhóm ở tờ khác, không đánh dấu thứ tự","Chỉ gửi tên phòng","Ghi hai giờ trên một tờ không có tên nhóm"],"correct":[0],"why":"Bảng gắn từng giờ với đúng nhóm."},{"id":"T6-B01-C23","prompt":"Cần thông báo cho cả bạn khiếm thính và bạn khó đọc chữ nhỏ. Phương án nào phục vụ cả hai?","type":"choice","choices":["Chỉ phát tờ chữ nhỏ","Chỉ phát bản đọc","Dòng chữ lớn và bản đọc cùng nội dung","Chỉ gửi ảnh vật trang trí"],"correct":[2],"why":"Hai cách biểu diễn cùng thông tin giúp nhiều người tiếp nhận."},{"id":"T6-B01-C24","prompt":"Soạn một thông báo tập trung cho lớp 6C lúc 7 giờ 15 ngày 20/11 ở sân trường. Nêu vật hoặc phương tiện sẽ mang thông báo và một cách kiểm tra người nhận hiểu đúng.","type":"practice","rubric":["1 điểm: đủ lớp, ngày, giờ, nơi.","1 điểm: vật/phương tiện phù hợp.","1 điểm: kiểm tra được giờ và nơi người nhận hiểu."]},{"id":"T6-B01-C25","prompt":"Một nhiệt kế hiển thị 38 °C. Viết hai cách biểu diễn cùng nội dung, rồi nêu vì sao cần ghi rõ đang đo thân nhiệt hay nhiệt độ ngoài trời.","type":"practice","rubric":["1 điểm mỗi ý: biểu diễn thứ nhất; biểu diễn khác dạng; giải thích khác đối tượng làm đổi ý nghĩa của giá trị."]}]}],"extras":[]},"7":{"n":7,"title":"Tìm kiếm thông tin trên Internet","pages":"28–31","stages":[{"goal":"Phân biệt công cụ tìm kiếm, từ khóa và kết quả.","text":"Máy tìm kiếm nhận từ khóa và trả về các kết quả như liên kết, hình ảnh hoặc video. Từ khóa diễn đạt nội dung cần tìm.","tasks":[{"id":"B07-C01","prompt":"Công cụ nào giúp tìm thông tin the

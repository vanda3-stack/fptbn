ràng buộc có thể tìm được trang diễn đạt khác."},{"id":"B07-C19","prompt":"Xếp các chỉnh sửa theo mục đích. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["2 – 2 – 1","1 – 1 – 1","1 – 2 – 1","1 – 2 – 2"],"correct":[2],"why":"Thêm chi tiết thường làm kết quả tập trung hơn.","items":["Thêm tên trường","Bỏ một chi tiết chưa chắc chắn","Thêm năm học"],"groups":["Thu hẹp","Mở rộng"],"assign":[0,1,0]},{"id":"B07-C20","prompt":"Bản tin kết quả có tiêu đề đúng nhưng ngày đăng năm ngoái. Em cần lịch năm nay. Làm gì?","type":"choice","choices":["Thêm năm nay vào từ khóa và kiểm tra ngày của kết quả","Chọn kết quả nhiều ảnh nhất","Dùng bài cũ vì tiêu đề khớp","Dùng lịch cũ"],"correct":[0],"why":"Đúng chủ đề vẫn cần đúng thời gian."}]},{"goal":"Đối chiếu nguồn, thời gian và phạm vi trước khi dùng.","text":"Xem ai đăng, đăng khi nào và thông tin áp dụng cho ai. Khi dùng tài liệu cho bài học, ghi nguồn và kiểm tra quyền sử dụng hình ảnh.","tasks":[{"id":"B07-C21","prompt":"Cần biết thư viện A có mở Chủ nhật 17/11 trong dịp sửa chữa hay không. Nguồn nào trực tiếp trả lời cho ngày đó?","type":"choice","choices":["Giờ mở cửa Chủ nhật thông thường trên trang giới thiệu của thư viện","Thông báo trên website thư viện ghi lịch phục vụ tạm thời ngày 17/11","Bản đồ do người dùng cập nhật tháng trước","Bài đăng mới nhất của một thư viện khác cùng tên"],"correct":[1],"why":"Thông báo chính thức áp dụng đúng địa điểm, thời gian và ngoại lệ."},{"id":"B07-C22","prompt":"Hai kết quả ghi giờ khác nhau. Nên kiểm tra gì?","type":"multi","choices":["Đơn vị đăng","Ngày cập nhật","Đúng cơ sở hay không","Kết quả có nhiều biểu tượng hay không"],"correct":[0,1,2],"why":"Các yếu tố này giúp xác định thông tin có áp dụng được."},{"id":"B07-C23","prompt":"Xếp quy trình tìm và ghi lại lịch triển lãm.","type":"order","choices":["2 → 3 → 4 → 1","1 → 2 → 3 → 4","3 → 1 → 4 → 2","1 → 2 → 4 → 3"],"correct":[0],"why":"Tìm, mở nguồn, kiểm tra rồi lưu lại.","steps":["Ghi lịch kèm liên kết nguồn","Nhập từ khóa có tên triển lãm và địa điểm","Mở trang ban tổ chức","Đối chiếu ngày và địa điểm"],"sequence":[1,2,3,0]},{"id":"B07-C24","prompt":"Em muốn dùng một ảnh tìm được trong sản phẩm lớp. Em làm gì?","type":"choice","choices":["Kiểm tra nguồn, điều kiện sử dụng và ghi nguồn","Bỏ tên tác giả","Cho rằng ảnh tìm được đều dùng tự do","Dùng ảnh rồi chỉ ghi “lấy từ Internet”"],"correct":[0],"why":"Tìm thấy ảnh không tự động cấp quyền sử dụng."},{"id":"B07-C25","prompt":"Website ban tổ chức cập nhật chuyển giờ khai mạc từ 8 giờ sang 9 giờ. Bài đăng cũ vẫn hiện đầu trang tìm kiếm. Em báo gì?","type":"choice","choices":["8 giờ 30 vì ở giữa hai mốc","8 giờ vì kết quả đứng đầu","9 giờ theo ảnh chia sẻ trong nhóm, không kiểm tra thông báo","9 giờ theo thông báo cập nhật, kèm liên kết"],"correct":[3],"why":"Bản cập nhật của ban tổ chức trực tiếp thay đổi giờ khai mạc."}]}],"extras":[{"id":"B07-TH01","prompt":"Tìm thông báo hoạt động ở trường bằng hai truy vấn: truy vấn rộng và truy vấn thêm tên trường, thời gian. Ghi hai truy vấn và chọn một kết quả dùng được, kèm liên kết và lí do.","type":"practice","rubric":["1 điểm: hai truy vấn có khác biệt rõ.","1 điểm: dẫn đúng nguồn, đối chiếu thời gian và đối tượng.","1 điểm: giải thích kết quả phù hợp; nếu chưa có, ghi cách thu hẹp hoặc xác minh tiếp."]}]},"15":{"n":15,"title":"Thuật toán","pages":"63–66","stages":[{"goal":"Nhận biết thuật toán và cách mô tả.","text":"Thuật toán là dãy bước rõ ràng để giải quyết một nhiệm vụ.","tasks":[{"id":"T6-B15-C01","prompt":"Thuật toán là gì?","type":"choice","choices":["Bất kì danh sách đồ vật","Dãy bước rõ ràng để giải một nhiệm vụ","Chỉ dữ liệu được đưa vào","Chỉ kết quả cuối cùng"],"correct":[1],"why":"Cần có các bước thực hiện."},{"id":"T6-B15-C02","prompt":"Thông tin được cho trước khi chạy gọi là gì?","type":"choice","choices":["Bước in","Đầu vào","Kết thúc","Đầu ra"],"correct":[1],"why":"Đầu vào là dữ liệu ban đầu."},{"id":"T6-B15-C03","prompt":"Kết quả nhận được sau khi thực hiện gọi là gì?","type":"choice","choices":["Mũi tên","Bắt đầu","Đầu ra","Đầu vào"],"correct":[2],"why":"Đầu ra là kết quả."},{"id":"T6-B15-C04","prompt":"Trong sơ đồ khối, mũi tên dùng để làm gì?","type":"choice","choices":["Thay đầu vào bằng đầu ra","Chỉ hướng thực hiện tiếp","Chứa mọi kết quả","Đánh dấu lỗi chính tả"],"correct":[1],"why":"Mũi tên nối các bước theo thứ tự."},{"id":"T6-B15-C05","prompt":"Hình chữ nhật trong sơ đồ khối thường biểu diễn gì?","type":"choice","choices":["Bắt đầu hoặc kết thúc","Bước xử lí","Điều kiện đúng hay sai","Đầu vào hoặc đầu ra"],"correct":[1],"why":"Hình chữ nhật dùng cho bước thực hiện."}]},{"goal":"Phân biệt đầu vào, đầu ra và bước xử lí.","text":"Xét dữ liệu được cho, việc cần làm và kết quả thu được.","tasks":[{"id":"T6-B15-C06","prompt":"Tính chu vi hình vuông từ cạnh a. Đầu vào và đầu ra là gì?","type":"choice","choices":["Chu vi và độ dài a","Tên tệp và diện tích","Số 4 và tên hình","Độ dài a và chu vi"],"correct":[3],"why":"Cạnh được cho; chu vi cần tính."},{"id":"T6-B15-C07","prompt":"Nhiệm vụ đổi phút sang giây. Đâu là bước xử lí?","type":"choice","choices":["Kết thúc","Nhận số phút","Thông báo số giây","Nhân số phút với 60"],"correct":[3],"why":"Phép nhân tạo kết quả mới."},{"id":"T6-B15-C08","prompt":"Mô tả “Làm cho xong bài” chưa đủ vì sao?","type":"choice","choices":["Không nêu các bước rõ để thực hiện","Có quá nhiều đầu ra cụ thể","Vì dùng tiếng Việt","Chỉ vì không vẽ hình"],"correct":[0],"why":"Có thể dùng lời, nhưng phải rõ bước."},{"id":"T6-B15-C09","prompt":"Hình bình hành “Nhập a, b” có vai trò gì?","type":"choice","choices":["Đánh giá điều kiện","Đưa dữ liệu vào","Kết thúc","Tính tổng"],"correct":[1],"why":"Hình bình hành biểu diễn vào/ra; từ “Nhập” xác định vai trò vào."},{"id":"T6-B15-C10","prompt":"Hai mô tả bằng lời và sơ đồ có cùng thứ tự và phép tính. Nhận xét nào hợp lý?","type":"choice","choices":["Chỉ sơ đồ mới có đầu vào","Chỉ dạng lời mới có bước","Chắc chắn cho hai kết quả khác","Có thể mô tả cùng thuật toán"],"correct":[3],"why":"Cách trình bày có thể khác, ý nghĩa giống nhau."}]},{"goal":"Lần theo dãy bước hoặc sơ đồ.","text":"Thực hiện từng bước theo mũi tên rồi đọc kết quả.","tasks":[{"id":"T6-B15-C11","prompt":"Nhập 7 và 5; cộng hai số; xuất tổng. Kết quả là gì?","type":"choice","choices":["35","2","12","75"],"correct":[2],"why":"7 + 5 = 12."},{"id":"T6-B15-C12","prompt":"Nhập a = 4; nhân a với 4 để được p; xuất p. Đầu ra là gì?","type":"choice","choices":["16","4","8","12"],"correct":[0],"why":"Chu vi bằng 4 × 4."},{"id":"T6-B15-C13","prompt":"Cần tính tổng số sách của hai tổ. Thứ tự nào đúng?","type":"choice","choices":["Cộng, thông báo, nhập","Thông báo, cộng, nhập","Nhập hai số, cộng, thông báo tổng","Nhập, thông báo, cộng"],"correct":[2],"why":"Phải có dữ liệu trước khi tính và tính trước khi báo."},{"id":"T6-B15-C14","prompt":"Cho sơ đồ: Bắt đầu → nhập 4 → cộng 3 → nhân 2 → xuất → kết thúc. Ghi kết quả sau từng phép tính.","type":"practice","rubric":["1 điểm: sau cộng là 7.","1 điểm: sau nhân và khi xuất là 14."]},{"id":"T6-B15-C15","prompt":"Viết dãy bước đổi số giờ nguyên thành số phút. Chạy thử với 3 giờ.","type":"practice","rubric":["1 điểm: nhập giờ, nhân 60, xuất phút.","1 điểm: 180 phút."]}]},{"goal":"Phát hiện bước sai, thiếu hoặc sai thứ tự.","text":"Chạy thử một ví dụ để tìm chỗ kết quả lệch.","tasks":[{"id":"T6-B15-C16","prompt":"Sơ đồ xuất tổng trước bước cộng. Sửa thế nào?","type":"choice","choices":["Xóa bước cộng","Giữ thứ tự rồi đổi màu khối","Đưa bước nhập xuống cuối","Đưa bước xuất xuống sau bước cộng"],"correct":[3],"why":"Kết quả phải có trước khi xuất."},{"id":"T6-B15-C17","prompt":"Đổi phút sang giây bằng cách cộng 60. Với 2 phút, kết quả sai nào xuất hiện?","type":"choice","choices":["62 thay vì 120","120 thay vì 62","30 thay vì 120","2 thay vì 60"],"correct":[0],"why":"Sai phép tính làm 2 + 60 = 62."},{"id":"T6-B15-C18","prompt":"Tính chu vi từ chiều dài và rộng nhưng chỉ nhập chiều dài. Thiếu gì?","type":"choice","choices":["Dữ liệu chiều rộng","Một bước xuất thứ hai","Tên người vẽ","Số màu"],"correct":[0],"why":"Cả hai kích thước cần cho phép tính."},{"id":"T6-B15-C19","prompt":"Thuật toán diện tích hình chữ nhật nhập dài 5, rộng 3; cộng hai số; xuất 8. Tìm lỗi và sửa.","type":"practice","rubric":["1 điểm: sai ở bước cộng.","1 điểm: nhân 5 × 3, xuất 15."]},{"id":"T6-B15-C20","prompt":"Sơ đồ ghi “Nhập 2 số → chia cho 2 → xuất trung bình”. Nêu bước thiếu và kiểm tra với 6, 10.","type":"practice","rubric":["1 điểm: cần tính tổng rồi chia tổng cho 2.","1 điểm: kết quả 8."]}]},{"goal":"Mô tả thuật toán và thử với dữ liệu mới.","text":"Ghi đầu vào, đầu ra, bước rõ ràng và kiểm tra kết quả.","tasks":[{"id":"T6-B15-C21","prompt":"Cần biết số chỗ còn trống, có tổng chỗ và số đã đăng kí. Mô tả nào đủ?","type":"choice","choices":["Lấy đăng kí trừ tổng rồi xuất","Cộng hai số và xuất","Nhập hai số, lấy tổng chỗ trừ đã đăng kí, xuất chỗ trống","Chỉ nhập rồi xuất tổng chỗ"],"correct":[2],"why":"Cần số còn lại, không phải tổng hoặc hiệu đảo."},{"id":"T6-B15-C22","prompt":"Thuật toán tính tiền 3 quyển vở cùng giá p. Bộ thử nào kiểm tra được hai mức giá khác nhau?","type":"choice","choices":["Chỉ thử p = 5 và bỏ kết quả","p = 5 cho 15 hai lần","p = 5 cho 15; p = 7 cho 21","p = 5 cho 8; p = 7 cho 10"],"correct":[2],"why":"Hai giá và kết quả mong đợi cho phép đối chiếu."},{"id":"T6-B15-C23","prompt":"Tính tổng 2 chai mỗi bạn cho n bạn. Sơ đồ đúng cần thứ tự nào?","type":"choice","choices":["Nhập n → tính 2 × n → xuất tổng","Nhập n → xuất 2 → tính n","Nhập n → chia 2 → xuất tổng","Xuất n → nhập n → cộng 2"],"correct":[0],"why":"Mỗi bạn đóng góp hai chai."},{"id":"T6-B15-C24","prompt":"Vẽ sơ đồ tính số ghế trống từ số ghế và số người ngồi, giả sử số người không vượt số ghế. Thử (20, 13) và (20, 20).","type":"practice","rubric":["1 điểm: sơ đồ đủ vào, xử lí, ra và mũi tên.","1 điểm: phép trừ đúng.","1 điểm: 7 và 0."]},{"id":"T6-B15-C25","prompt":"Viết thuật toán tính số trang cần đọc mỗi ngày khi số trang chia hết cho số ngày. Thử (60, 5) và (60, 3).","type":"practice","rubric":["1 điểm: xác định vào và ra.","1 điểm: chia số trang cho số ngày dương.","1 điểm: 12 và 20."]}]}],"extras":[]},"9":{"n":9,"title":"An toàn thông tin trên Internet","pages":"37–41","stages":[{"goal":"Nhận diện nguy cơ và quy tắc an toàn.","text":"Giữ kín thông tin cá nhân, kiểm tra độ tin cậy và nói với người lớn khi cần.","tasks":[{"id":"T6-B09-C01","prompt":"Mục nào cần giữ riêng?","type":"choice","choices":["Mật khẩu hộp thư","Tên một loài cây","Tên một tỉnh","Tên một môn học"],"correct":[0],"why":"Mật khẩu bảo vệ quyền truy cập tài khoản."},{"id":"T6-B09-C02","prompt":"Tin nhắn nào có dấu hiệu bắt nạt?","type":"choice","choices":["Gửi tài liệu theo yêu cầu","Chúc mừng sinh nhật","Nhắc giờ học lịch sự","Liên tục chế giễu và đe dọa bạn"],"correct":[3],"why":"Chế giễu và đe dọa có thể gây tổn thương."},{"id":"T6-B09-C03","prompt":"Người lạ hẹn gặp riêng. Quy tắc nào phù hợp?","type":"choice","choices":["Không đi gặp, nói với người lớn tin cậy","Gửi địa chỉ nhà trước","Giữ bí mật với gia đình","Đến một mình"],"correct":[0],"why":"Không tự gặp người chỉ quen trên mạng."},{"id":"T6-B09-C04","prompt":"Việc nào giúp bảo vệ tài khoản?","type":"choice","choices":["Dùng mật khẩu dài, khó đoán và riêng cho tài khoản","Ghi mật khẩu vào bài đăng","Dùng tên lớp làm mật khẩu","Dùng chung mật khẩu cả nhóm"],"correct":[0],"why":"Mật khẩu riêng và khó đoán làm giảm nguy cơ bị đoán hoặc lộ dây chuyền."},{"id":"T6-B09-C05","prompt":"Phần mềm độc hại có thể gây hậu quả nào?","type":"choice","choices":["Làm hỏng hoặc lấy cắp dữ liệu","Tự sửa mọi lỗi","Tăng quyền riêng tư","Bảo đảm thông tin đúng"],"correct":[0],"why":"Phần mềm độc hại có thể gây mất an toàn dữ liệu."}]},{"goal":"Giải thích dấu hiệu và biện pháp phù hợp.","text":"Tách dấu hiệu rủi ro khỏi điều đã được kiểm chứng.","tasks":[{"id":"T6-B09-C06","prompt":"Bạn thân xin mật khẩu để làm hộ bài. Vì sao vẫn không nên đưa?","type":"choice","choices":["Đổi hình nền sẽ bảo vệ được dữ liệu","Bạn cùng lớp nên tài khoản tự khóa","Người khác có thể đọc dữ liệu và hành động bằng tài khoản em","Mật khẩu chỉ dùng cho máy tính ở trường"],"correct":[2],"why":"Chia sẻ mật khẩu là chia sẻ quyền truy cập."},{"id":"T6-B09-C07","prompt":"Một bài đăng nhiều lượt chia sẻ nhưng thiếu nguồn. Điều gì đúng?","type":"choice","choices":["Phải chia sẻ trước để hỏi","Tin thiếu nguồn chắc chắn đúng nếu có ảnh","Số lượt chia sẻ không chứng minh tin đúng","Tin phổ biến luôn đúng"],"correct":[2],"why":"Cần đối chiếu nguồn và nội dung."},{"id":"T6-B09-C08","prompt":"Bạn đăng ảnh có bảng tên và số điện thoại. Điều nào có thể xảy ra?","type":"choice","choices":["Chỉ người chụp mới thấy thông tin","Người ngoài có thể nhận diện và liên lạc ngoài ý muốn","Ảnh tự ẩn mọi chữ","Đăng ảnh làm số điện thoại tự đổi"],"correct":[1],"why":"Ảnh có thể để lộ thông tin cá nhân."},{"id":"T6-B09-C09","prompt":"Nhận tệp cài đặt ngoài dự kiến từ người lạ. Dấu hiệu nào đáng ngờ nhất?","type":"choice","choices":["Tên tệp có một chữ viết hoa","Tên tệp ngắn","Nguồn không rõ và em không yêu cầu tệp","Thư đến vào buổi sáng"],"correct":[2],"why":"Nên kiểm tra nguồn qua kênh đáng tin trước khi mở."},{"id":"T6-B09-C10","prompt":"Vì sao nên hỏi ý kiến bạn trước khi đăng ảnh có bạn?","type":"choice","choices":["Để tăng dung lượng ảnh","Để ảnh tự biến thành ảnh công khai hợp lệ","Để đổi mật khẩu của bạn","Để tôn trọng quyền riêng tư và lựa chọn của bạn"],"correct":[3],"why":"Người có mặt có quyền cân nhắc việc ảnh được chia sẻ."}]},{"goal":"Chọn hành động an toàn trong từng tình huống.","text":"Ưu tiên dừng tương tác và dùng kênh đã biết.","tasks":[{"id":"T6-B09-C11","prompt":"Một tin yêu cầu gửi mã đăng nhập để nhận quà. Em làm gì?","type":"choice","choices":["Chụp mã đăng lên nhóm","Thử bằng tài khoản bạn","Không gửi mã; báo người lớn tin cậy","Gửi mã rồi hỏi sau"],"correct":[2],"why":"Mã đăng nhập phải giữ kín."},{"id":"T6-B09-C12","prompt":"Máy thư viện dùng chung. Khi dùng xong tài khoản, làm gì?","type":"choice","choices":["Lưu mật khẩu cho lần sau","Chỉ đóng cửa sổ, để tài khoản vẫn đăng nhập","Gửi mật khẩu cho người ngồi kế tiếp","Đăng xuất và không lưu mật khẩu trên máy"],"correct":[3],"why":"Đăng xuất giúp ngăn người dùng tiếp theo mở tài khoản."},{"id":"T6-B09-C13","prompt":"Một người liên tục nhắn xúc phạm. Phản ứng nào phù hợp?","type":"choice","choices":["Đáp trả bằng lời xúc phạm","Dừng đáp trả, lưu bằng chứng để báo người lớn, chặn/báo cáo","Công khai thông tin riêng của họ","Gửi thêm ảnh cá nhân"],"correct":[1],"why":"Giảm tiếp xúc và nhờ hỗ trợ."},{"id":"T6-B09-C14","prompt":"Viết hai câu em có thể nói với người lớn khi nhận tin nhắn đe dọa trong trò chơi.","type":"practice","rubric":["1 điểm: mô tả sự việc.","1 điểm: xin trợ giúp và đề nghị cho xem bằng chứng riêng."]},{"id":"T6-B09-C15","prompt":"Trước khi gửi ảnh nhóm cho lớp, chỉ ra hai việc kiểm tra liên quan đến quyền riêng tư.","type":"practice","rubric":["1 điểm mỗi việc: xin phép người có mặt; che/bỏ chi tiết riêng tư hoặc hạn chế đúng người xem."]}]},{"goal":"Phân tích dấu hiệu rủi ro và cách kiểm chứng.","text":"Xác minh bằng kênh độc lập đã biết, không dựa vào tên hoặc ảnh đại diện.","tasks":[{"id":"T6-B09-C16","prompt":"Tin nhắn hiện ảnh cô giáo nhưng đòi nhập mật khẩu ở liên kết lạ. Cách xác minh nào đáng tin?","type":"choice","choices":["Chuyển liên kết cho cả lớp bấm thử","Hỏi đúng tài khoản vừa gửi rồi nhập mật khẩu","Hỏi cô qua số hoặc kênh lớp đã biết","Tin ảnh đại diện và mở ngay"],"correct":[2],"why":"Kênh đã biết tránh dựa vào chính nơi đáng ngờ."},{"id":"T6-B09-C17","prompt":"Một tin gây hoang mang có ảnh chụp, nhưng không ghi thời gian, địa điểm. Cách xử lí nào tốt?","type":"choice","choices":["Chỉ đếm lượt thích","Tạm không chia sẻ; đối chiếu thông báo chính thức đúng nơi và thời gian","Cắt ảnh làm mất phần ngữ cảnh","Đăng lại và ghi “có thể đúng”"],"correct":[1],"why":"Cần ngữ cảnh và nguồn tin trước khi lan truyền."},{"id":"T6-B09-C18","prompt":"Bạn vô tình công khai số điện thoại trong ảnh lớp. Bước nào giúp giảm lộ thông tin ngay?","type":"choice","choices":["Chỉ đổi tên ảnh","Hạn chế hoặc gỡ ảnh, báo người phụ trách","Nhờ nhiều nhóm chia sẻ tiếp","Đăng lại ảnh để hỏi ý kiến"],"correct":[1],"why":"Hạn chế khả năng người khác tiếp tục xem."},{"id":"T6-B09-C19","prompt":"Tài khoản lạ mạo danh bạn, yêu cầu ảnh thẻ học sinh và giục giữ bí mật. Nêu hai dấu hiệu và cách xử lí.","type":"practice","rubric":["1 điểm: nêu hai dấu hiệu như đòi ảnh riêng tư, giục giữ bí mật.","1 điểm: không gửi, xác minh độc lập và báo người lớn."]},{"id":"T6-B09-C20","prompt":"Bạn đã nhập mật khẩu vào trang đáng ngờ. Nêu hai việc ưu tiên sau khi rời trang.","type":"practice","rubric":["1 điểm: báo người lớn/người quản lí ngay.","1 điểm: đổi mật khẩu qua dịch vụ chính thức và kiểm tra phiên đăng nhập với người hỗ trợ."]}]},{"goal":"Tổng hợp cách bảo vệ và hỗ trợ người khác.","text":"Giữ bằng chứng riêng, hạn chế lộ dữ liệu và tìm trợ giúp.","tasks":[{"id":"T6-B09-C21","prompt":"Một bạn bị đe dọa trong nhóm, tin còn chứa địa chỉ nhà. Cách nào bảo vệ bạn và giúp xử lí?","type":"choice","choices":["Chụp và đăng lên nhóm khác","Xóa bằng chứng trước khi nói với người lớn","Thách người đe dọa gặp mặt","Giữ bằng chứng riêng để báo người lớn, không chuyển tiếp công khai"],"correct":[3],"why":"Chia sẻ riêng đúng người hỗ trợ giảm việc phát tán địa chỉ."},{"id":"T6-B09-C22","prompt":"Nhóm cần công bố kết quả thi đua nhưng bảng gốc có số liên lạc. Đăng bản nào?","type":"choice","choices":["Chỉ các dữ liệu cần công bố, bỏ số liên lạc và theo phạm vi được phép","Bảng kèm mật khẩu tài khoản","Bảng đầy đủ để ai cũng xem","Ảnh chụp toàn màn hình chứa dữ liệu gốc"],"correct":[0],"why":"Chỉ công bố dữ liệu cần thiết."},{"id":"T6-B09-C23","prompt":"Có bài đăng nêu lịch nghỉ học và đòi số điện thoại để đọc bản đầy đủ. Phương án nào đáp ứng cả hai việc?","type":"choice","choices":["Nhập số rồi xóa bài","Không nhập số; kiểm tra lịch trên kênh chính thức của trường","Chuyển tiếp để cả lớp kiểm tra hộ","Tin ngay vì tiêu đề nói về trường"],"correct":[1],"why":"Xác minh thông tin mà không để lộ dữ liệu."},{"id":"T6-B09-C24","prompt":"Lập hướng dẫn ba bước cho bạn gặp tài khoản lạ giả danh giáo viên, gửi liên kết và yêu cầu mật khẩu.","type":"practice","rubric":["1 điểm: không bấm/không cung cấp.","1 điểm: kiểm tra qua kênh trường đã biết.","1 điểm: báo người lớn hoặc quản trị viên và lưu bằng chứng riêng."]},{"id":"T6-B09-C25","prompt":"Soạn quy tắc cho nhóm lớp về đăng ảnh và xử lí bình luận xúc phạm. Có cách báo cáo cụ thể.","type":"practice","rubric":["1 điểm: xin phép và hạn chế chi tiết riêng tư.","1 điểm: không đáp trả/phát tán.","1 điểm: báo giáo viên hoặc quản trị viên và gửi bằng chứng riêng."]}]}],"extras":[]},"3":{"n":3,"title":"Thông tin trong máy tính","pages":"12–15","stages":[{"goal":"Nhận ra đơn vị và cách biểu diễn trong máy tính.","text":"Nhớ bit, byte, dạng dãy bit và thiết bị lưu trữ.","tasks":[{"id":"T6-B03-C01","prompt":"Bit có thể mang giá trị nào?","type":"choice","choices":["Mọi chữ cái","1 hoặc 2","0 hoặc 1","Bất kì số nguyên nào"],"correct":[2],"why":"Hai trạng thái được biểu diễn bằng 0 và 1."},{"id":"T6-B03-C02","prompt":"Một byte gồm mấy bit?","type":"choice","choices":["4","2","16","8"],"correct":[3],"why":"Một byte bằng 8 bit."},{"id":"T6-B03-C03","prompt":"Dãy nào chỉ gồm các bit?","type":"choice","choices":["10,5","01A110","010110","012110"],"correct":[2],"why":"Chỉ dãy đầu dùng hai kí hiệu 0 và 1."},{"id":"T6-B03-C04","prompt":"Đơn vị nào lớn hơn MB?","type":"choice","choices":["KB","Byte","GB","Bit"],"correct":[2],"why":"GB biểu thị lượng dữ liệu lớn hơn MB."},{"id":"T6-B03-C05","prompt":"Thiết bị nào thường dùng để lưu và mang tệp sang máy khác?","type":"choice","choices":["Máy chiếu","Chuột","USB lưu trữ","Loa"],"correct":[2],"why":"USB lưu trữ giữ dữ liệu để dùng trên máy khác."}]},{"goal":"Đọc biểu diễn và so sánh dung lượng.","text":"Cần biết bảng quy ước để giải mã, cùng đơn vị để so sánh.","tasks":[{"id":"T6-B03-C06","prompt":"Quy ước sáng = 1, tắt = 0. Dãy sáng, tắt, sáng biểu diễn thế nào?","type":"choice","choices":["110","101","010","011"],"correct":[1],"why":"Đổi từng trạng thái theo đúng thứ tự."},{"id":"T6-B03-C07","prompt":"Hai tệp 6 MB và 600 KB. Tệp nào có dung lượng lớn hơn?","type":"choice","choices":["Không thể so sánh hai đơn vị này","Tệp 600 KB","Hai tệp bằng nhau","Tệp 6 MB"],"correct":[3],"why":"6 MB tương đương hàng nghìn KB."},{"id":"T6-B03-C08","prompt":"Vì sao cùng dãy 01 có thể biểu diễn hai ý khác nhau trong hai bài?","type":"choice","choices":["Bit 0 luôn có hai giá trị cùng lúc","Hai bài có thể dùng bảng mã khác nhau","Dãy bit tự mang nghĩa cố định","Dãy ngắn không thể biểu diễn dữ liệu"],"correct":[1],"why":"Bảng mã quy định ý nghĩa của dãy."},{"id":"T6-B03-C09","prompt":"Thiết bị ghi 16 GB; thư mục ghi 12 MB. Hai số dùng để mô tả gì?","type":"choice","choices":["Sức chứa thiết bị và lượng dữ liệu của thư mục","Số tệp thiết bị chứa và số tệp thư mục","Tốc độ mạng và thời gian tải","Thời gian dùng và thời gian tạo"],"correct":[0],"why":"Đây là hai giá trị dung lượng, ở hai đơn vị khác nhau."},{"id":"T6-B03-C10","prompt":"Mã A = 00, B = 01, C = 10. Dãy 01 biểu diễn gì?","type":"choice","choices":["B","A","AB","C"],"correct":[0],"why":"Đối chiếu cả cặp bit với bảng mã."}]},{"goal":"Mã hóa, giải mã và tính dung lượng đơn giản.","text":"Đọc nhóm bit hoặc tính các tệp trong cùng đơn vị.","tasks":[{"id":"T6-B03-C11","prompt":"Mã X = 00, Y = 01, Z = 10. Chuỗi YZX là gì?","type":"choice","choices":["010010","011000","001001","100100"],"correct":[1],"why":"Ghép 01, 10, 00."},{"id":"T6-B03-C12","prompt":"Thẻ nhớ còn 9 MB; hai ảnh là 4 MB và 6 MB. Có chép cả hai được không?","type":"choice","choices":["Không, vì hai tệp luôn cần hai thẻ","Có, vì từng ảnh nhỏ hơn 9 MB","Có, vì tổng bằng 9 MB","Không, cần 10 MB"],"correct":[3],"why":"Dung lượng cần là tổng 10 MB."},{"id":"T6-B03-C13","prompt":"Dãy 16 bit chiếm mấy byte nếu chỉ tính dãy bit đó?","type":"choice","choices":["8 byte","2 byte","1 byte","16 byte"],"correct":[1],"why":"16 chia 8 bằng 2."},{"id":"T6-B03-C14","prompt":"Mã trắng = 0, đen = 1. Viết mã cho hai hàng ô: trắng–đen–đen; đen–trắng–đen. Ghi rõ mã từng hàng.","type":"practice","rubric":["1 điểm cho mỗi hàng: 011 và 101."]},{"id":"T6-B03-C15","prompt":"Thẻ còn 15 MB. Em chép hai tệp 6 MB và 4 MB; còn bao nhiêu? Tệp tiếp theo 7 MB có chép được không?","type":"practice","rubric":["1 điểm: còn 5 MB.","1 điểm: không, vì 7 > 5."]}]},{"goal":"Phát hiện lỗi bảng mã, cách tách nhóm và đơn vị.","text":"Dò điều kiện nào khiến dữ liệu không thể đọc đúng.","tasks":[{"id":"T6-B03-C16","prompt":"Bảng mã A = 00, B = 00, C = 10. Lỗi gì xuất hiện khi đọc 00?","type":"choice","choices":["Không phân biệt A với B","Không thể đọc C","Mọi mã phải dài 8 bit","Không phân biệt A với C"],"correct":[0],"why":"A và B trùng mã."},{"id":"T6-B03-C17","prompt":"Mỗi kí hiệu chiếm 2 bit. Nhận dãy 01100, điều gì cần kiểm tra?","type":"choice","choices":["Máy chỉ cho phép dãy toàn 1","Dãy chắc chắn gồm năm kí hiệu","Số bit lẻ, có thể thiếu hoặc thừa bit","Bit đầu phải luôn là 0"],"correct":[2],"why":"Không chia 5 bit thành các nhóm 2 bit trọn vẹn."},{"id":"T6-B03-C18","prompt":"Bạn so 900 KB với 2 MB và nói 900 lớn hơn 2 nên tệp đầu lớn hơn. Sửa gì?","type":"choice","choices":["Chỉ đổi tên hai tệp","Đổi về cùng đơn vị trước khi so","So số chữ số","Nhân cả hai số với 2, giữ nguyên đơn vị"],"correct":[1],"why":"Phải xét đơn vị, không chỉ số đứng trước đơn vị."},{"id":"T6-B03-C19","prompt":"Bảng mã A = 00, B = 01, C = 10. Bạn giải 0100 thành AC. Khoanh nhóm bit và sửa kết quả.","type":"practice","rubric":["1 điểm: tách 01 và 00.","1 điểm: BA."]},{"id":"T6-B03-C20","prompt":"Một USB ghi 8 GB nhưng máy báo chỉ còn trống 30 MB. Bạn cần chép tệp 40 MB. Giải thích vì sao nhìn nhãn 8 GB chưa đủ.","type":"practice","rubric":["1 điểm: 8 GB là dung lượng toàn thiết bị.","1 điểm: chỉ còn 30 MB, thiếu 10 MB."]}]},{"goal":"Kết hợp quy ước và kiểm tra bằng ví dụ mới.","text":"Tự đặt bảng mã hoặc chọn dữ liệu vừa sức chứa.","tasks":[{"id":"T6-B03-C21","prompt":"Cần mã hóa bốn màu khác nhau bằng các mã dài bằng nhau. Phương án nào đủ và không trùng?","type":"choice","choices":["00, 01, 10, 11","1, 10, 11, 100","00, 01, 01, 11","0, 1, 0, 1"],"correct":[0],"why":"Bốn mã 2 bit khác nhau đủ cho bốn màu."},{"id":"T6-B03-C22","prompt":"Thẻ còn 13 MB; cần giữ hai tệp bắt buộc 5 MB và 4 MB. Có thể thêm tệp nào nếu chỉ chọn một?","type":"choice","choices":["Tệp 6 MB","Tệp 5 MB","Tệp 7 MB","Tệp 4 MB"],"correct":[3],"why":"Sau hai tệp còn 4 MB."},{"id":"T6-B03-C23","prompt":"Nhóm chia sẻ dãy bit cho ảnh đen trắng. Kèm gì để người khác dựng lại đúng?","type":"choice","choices":["Quy ước màu, số ô mỗi hàng và thứ tự đọc","Chỉ số lượng bit 1","Chỉ tên tệp ảnh","Chỉ số lượng màu"],"correct":[0],"why":"Cần cả cách giải màu và cách xếp vị trí."},{"id":"T6-B03-C24","prompt":"Đặt bảng mã dài 2 bit cho ba kí hiệu N, T, V, rồi mã hóa VNT và tách lại để kiểm tra.","type":"practice","rubric":["1 điểm: ba mã 2 bit khác nhau.","1 điểm: ghép đúng VNT theo bảng.","1 điểm: tách và giải lại đúng."]},{"id":"T6-B03-C25","prompt":"Bộ nhớ còn 18 MB. Bắt buộc chép bản trình bày 6 MB và âm thanh 5 MB. Chọn giữa ảnh A 8 MB và ảnh B 7 MB để chép thêm một ảnh; giải thích.","type":"practice","rubric":["1 điểm: còn 7 MB sau tệp bắt buộc.","1 điểm: chọn B vừa đủ.","1 điểm: A vượt 1 MB."]}]}],"extras":[]},"16":{"n":16,"title":"Các cấu trúc điều khiển","pages":"67–70","stages":[{"goal":"Nhận ra tuần tự, rẽ nhánh và lặp.","text":"Nhìn thứ tự, điều kiện chọn việc và hành động lặp lại.","tasks":[{"id":"T6-B16-C01","prompt":"“Mở hộp, lấy bút, đóng hộp” là cấu trúc nào?","type":"choice","choices":["Rẽ nhánh","Tuần tự","Lặp","Không có thứ tự"],"correct":[1],"why":"Các việc lần lượt, không có lựa chọn hay lặp."},{"id":"T6-B16-C02","prompt":"“Nếu mưa thì mang áo mưa” dùng gì?","type":"choice","choices":["Chỉ tuần tự","Lặp","Định dạng","Rẽ nhánh"],"correct":[3],"why":"Điều kiện mưa quyết định có làm hay không."},{"id":"T6-B16-C03","prompt":"“Vỗ tay 5 lần” dùng gì?","type":"choice","choices":["Lặp","Thay thế","Chỉ tuần tự không lặp","Chỉ rẽ nhánh"],"correct":[0],"why":"Cùng hành động được thực hiện nhiều lần."},{"id":"T6-B16-C04","prompt":"Khối hình thoi ghi điều gì?","type":"choice","choices":["Điều kiện cần kiểm tra","Tên tệp","Chỉ tên thuật toán","Phép in"],"correct":[0],"why":"Điều kiện cho đường đúng/sai."},{"id":"T6-B16-C05","prompt":"Câu nào có rẽ nhánh đủ hai trường hợp?","type":"choice","choices":["Gõ cửa ba lần","Nếu mở cửa thì vào, nếu không thì đợi","Vào rồi ngồi","Ghi tên và cất bút"],"correct":[1],"why":"Cả đúng và sai đều có việc riêng."}]},{"goal":"Phân biệt đường đi và điều kiện.","text":"Dựa vào dữ liệu để chọn nhánh hoặc quyết định lặp tiếp.","tasks":[{"id":"T6-B16-C06","prompt":"Nếu điểm ít nhất 5 thì báo “Đạt”; không thì báo “Chưa đạt”. Với 5 đi nhánh nào?","type":"choice","choices":["Đạt","Chưa đạt","Không nhánh nào","Cả hai"],"correct":[0],"why":"“Ít nhất” bao gồm bằng."},{"id":"T6-B16-C07","prompt":"Lặp khi còn sách để xếp. Khi hết sách làm gì?","type":"choice","choices":["Tự thêm sách","Quay lại bắt đầu dù không còn sách","Thoát vòng lặp","Xếp tiếp một quyển"],"correct":[2],"why":"Điều kiện tiếp tục đã sai."},{"id":"T6-B16-C08","prompt":"“Nếu còn ghế thì ngồi” không quy định việc khi hết ghế. Đây là gì?","type":"choice","choices":["Rẽ nhánh dạng thiếu","Lặp vô hạn","Rẽ nhánh dạng đủ","Dãy không có điều kiện"],"correct":[0],"why":"Chỉ nhánh đúng có việc được nêu."},{"id":"T6-B16-C09","prompt":"Vòng lặp kiểm tra điều kiện trước thân; điều kiện sai ngay từ đầu. Thân chạy mấy lần?","type":"choice","choices":["1","Không dừng","0","2"],"correct":[2],"why":"Chưa vào thân đã thoát."},{"id":"T6-B16-C10","prompt":"Điểm khác nhau giữa “nếu còn bài thì làm một bài” và “trong khi còn bài, làm một bài” là gì?","type":"choice","choices":["Cả hai luôn thực hiện đúng một lần","Câu sau không kiểm tra điều kiện","Câu sau kiểm tra lại sau mỗi bài để có thể làm tiếp","Câu đầu luôn làm hết bài"],"correct":[2],"why":"Lặp trở lại kiểm tra; rẽ nhánh chỉ chọn một lần ở đây."}]},{"goal":"Lần theo từng bước điều khiển.","text":"Theo dõi giá trị sau mỗi nhánh hoặc lần lặp.","tasks":[{"id":"T6-B16-C11","prompt":"Bắt đầu x = 1; lặp ba lần thao tác cộng 2 vào x. Kết quả?","type":"choice","choices":["5","7","6","8"],"correct":[1],"why":"1 + 3 × 2 = 7."},{"id":"T6-B16-C12","prompt":"Nếu x > 10 thì trừ 1, nếu không cộng 1. Với x = 10, kết quả?","type":"choice","choices":["10","9","12","11"],"correct":[3],"why":"10 không lớn hơn 10, đi nhánh cộng."},{"id":"T6-B16-C13","prompt":"Còn 3 trang, mỗi lượt đọc một trang và giảm số trang còn lại. Lặp đến khi hết. Mấy lượt?","type":"choice","choices":["2","3","0","4"],"correct":[1],"why":"3 → 2 → 1 → 0."},{"id":"T6-B16-C14","prompt":"Cho x = 0. Khi x \u003c 6, tăng x thêm 2. Ghi các giá trị x sau từng lượt và giá trị lúc dừng.","type":"practice","rubric":["1 điểm: 2, 4, 6.","1 điểm: dừng ở 6 do điều kiện sai."]},{"id":"T6-B16-C15","prompt":"Nếu n ≥ 4 thì báo “Đủ”, ngược lại báo “Thiếu”. Cho kết quả với n = 3 và n = 4.","type":"practice","rubric":["1 điểm cho mỗi ca: Thiếu; Đủ."]}]},{"goal":"Chẩn đoán điều kiện và lỗi dừng.","text":"Thử sát ngưỡng, lúc đầu và khi điều kiện đổi.","tasks":[{"id":"T6-B16-C16","prompt":"Trong khi x \u003c 5, chỉ hiển thị x; ban đầu x = 1. Vì sao có thể không dừng?","type":"choice","choices":["Sơ đồ có hai nhánh","x bằng 5 ngay từ đầu","x không đổi nên điều kiện luôn đúng","Khối hiển thị luôn làm x tăng"],"correct":[2],"why":"Không có bước làm x tiến tới ngưỡng."},{"id":"T6-B16-C17","prompt":"Muốn lặp khi còn lượt, nhưng điều kiện đang viết “số lượt = 0”. Sửa gì?","type":"choice","choices":["Số lượt \u003c 0","Số lượt > 0","Số lượt = 0 hoặc \u003c 0","Giữ nguyên và xóa bước giảm lượt"],"correct":[1],"why":"Chỉ làm tiếp khi vẫn còn lượt."},{"id":"T6-B16-C18","prompt":"Quy định “từ 10 trở lên”, sơ đồ dùng x > 10. Thử giá trị nào bộc lộ lỗi?","type":"choice","choices":["10","9","20","11"],"correct":[0],"why":"10 cần được nhận nhưng bị loại."},{"id":"T6-B16-C19","prompt":"Vòng lặp “khi còn việc, đánh dấu xong một việc” nhưng danh sách chờ không đổi. Nêu lỗi và cách bảo đảm dừng.","type":"practice","rubric":["1 điểm: số việc chờ không giảm.","1 điểm: bỏ hoặc chuyển đúng một việc khỏi danh sách chờ mỗi lượt, dừng khi rỗng."]},{"id":"T6-B16-C20","prompt":"Sơ đồ giảm x từ 3 về 0, nhưng nhánh “x > 0” sai lại quay về bước giảm. Sửa đường đi và giải thích.","type":"practice","rubric":["1 điểm: sai đi tới kết thúc.","1 điểm: đúng giảm rồi quay lại kiểm tra; x về 0 thì dừng."]}]},{"goal":"Thiết kế và thử thuật toán kết hợp cấu trúc.","text":"Mô tả nhánh/lặp, rồi dùng dữ liệu kiểm tra các đường đi.","tasks":[{"id":"T6-B16-C21","prompt":"Phát mỗi bạn một thẻ khi còn thẻ và còn bạn chưa nhận. Điều kiện tiếp tục là gì?","type":"choice","choices":["Còn thẻ hoặc còn bạn chưa nhận","Số thẻ luôn lớn hơn số bạn","Hết thẻ và hết bạn","Còn thẻ và còn bạn chưa nhận"],"correct":[3],"why":"Cả hai điều kiện cần đúng để phát thêm."},{"id":"T6-B16-C22","prompt":"Giới hạn tối đa 4 lượt, nhưng dừng sớm khi tìm thấy sách. Trường hợp nào cho thấy dừng sớm hoạt động?","type":"choice","choices":["Không bắt đầu dù chưa tìm","Không thấy sau lượt 4","Chạy đủ 4 khi đã thấy lượt 2","Tìm thấy ngay lượt 2 và không chạy lượt 3"],"correct":[3],"why":"Ca tìm thấy trước ngưỡng kiểm tra dừng sớm."},{"id":"T6-B16-C23","prompt":"Muốn nhắc “Hết giấy” nếu hết, nếu còn thì in từng trang khi còn việc và còn giấy. Dùng gì?","type":"choice","choices":["Chỉ rẽ nhánh nhưng in đúng một trang","Chỉ lặp không kiểm tra","Rẽ nhánh và lặp có điều kiện","Chỉ tuần tự"],"correct":[2],"why":"Cần quyết định ban đầu và kiểm tra trong khi in."},{"id":"T6-B16-C24","prompt":"Mô tả bằng lời hoặc sơ đồ: nếu trời mưa thì làm 2 việc trong nhà lần lượt; nếu không thì tưới từng chậu trong 3 chậu. Chạy thử cả hai trường hợp.","type":"practice","rubric":["1 điểm: nhánh đủ và điều kiện rõ.","1 điểm: hai việc tuần tự; tưới đúng 3 chậu.","1 điểm: hai lượt thử đúng."]},{"id":"T6-B16-C25","prompt":"Có 4 thẻ và 6 bạn. Viết thuật toán phát từng thẻ, dừng khi hết thẻ hoặc không còn bạn chờ. Thử thêm trường hợp 6 thẻ, 4 bạn.","type":"practice","rubric":["1 điểm: điều kiện tiếp tục cần cả thẻ và bạn.","1 điểm: mỗi lượt giảm hai số.","1 điểm: mỗi ca phát 4 thẻ và chỉ ra điều kiện dừng tương ứng."]}]}],"extras":[]},"6":{"n":6,"title":"Mạng thông tin toàn cầu","pages":"23–27","stages":[{"goal":"Nhận ra WWW, trình duyệt, nội dung trang web và dấu trang.","text":"WWW là hệ thống các trang web liên kết với nhau. Trình duyệt là phần mềm dùng để mở và xem trang web. Một trang web có thể chứa văn bản, hình ảnh, âm thanh hoặc video. Dấu trang lưu địa chỉ để mở lại.","tasks":[{"id":"B06-C01","prompt":"Em dùng phần mềm nào để mở và xem một trang web?","type":"choice","choices":["Phần mềm trình chiếu","Máy tính bỏ túi","Phần mềm vẽ","Trình duyệt web"],"correct":[3],"why":"Trình duyệt web mở và hiển thị trang web."},{"id":"B06-C02","prompt":"Trang web giới thiệu trường có thể kết hợp những nội dung nào trong cùng một trang?","type":"choice","choices":["Chỉ văn bản","Chỉ video","Phải tách văn bản và video sang hai website","Cả văn bản và video"],"correct":[3],"why":"Một trang web có thể kết hợp nhiều loại nội dung."},{"id":"B06-C03","prompt":"Tên World Wide Web thường được viết tắt bằng ba chữ cái nào?","type":"choice","choices":["WWW","WWB","W3B","WEB"],"correct":[0],"why":"World Wide Web viết tắt là WWW."},{"id":"B06-C04","prompt":"Muốn lưu địa chỉ một trang để lần sau mở nhanh trong trình duyệt, em dùng chức năng nào?","type":"choice","choices":["Thêm dấu trang (đánh dấu trang)","Tải lại trang","Quay lại trang trước","Mở trang trong thẻ mới"],"correct":[0],"why":"Dấu trang lưu địa chỉ để mở lại."},{"id":"B06-C05","prompt":"Nhận xét nào mô tả đúng WWW?","type":"choice","choices":["Một dịch vụ chỉ dùng để gửi thư điện viện của trường"],"groups":["Phần mềm","Trang web thuộc website trường"],"assign":[0,1,1]},{"id":"B06-C10","prompt":"Em bấm vào ảnh biểu trưng và website đưa em về Trang chủ. Thành phần gắn vào ảnh giúp em chuyển trang được gọi là gì?","type":"choice","choices":["Siêu liên kết","Hộp tìm kiếm","Tên miền","Thanh địa chỉ"],"correct":[0],"why":"Siêu liên kết gắn vào ảnh giúp em chuyển trang."}]},{"goal":"Dùng địa chỉ và liên kết để đến đúng trang.","text":"Khi biết địa chỉ web, mở trình duyệt, gõ địa chỉ vào thanh địa chỉ rồi nhấn Enter. Khi trang đã mở, bấm vào liên kết phù hợp để chuyển tới nội dung cần xem.","tasks":[{"id":"B06-C11","prompt":"Em đã biết địa chỉ trang web. Hãy xếp các thao tác theo đúng thứ tự.","type":"order","choices":["3 → 2 → 1","2 → 1 → 3","1 → 2 → 3","3 → 1 → 2"],"correct":[0],"why":"Mở trình duyệt, gõ địa chỉ rồi nhấn Enter.","steps":["Nhấn Enter","Gõ địa chỉ vào thanh địa chỉ","Mở trình duyệt"],"sequence":[2,1,0]},{"id":"B06-C12","prompt":"Website có hai liên kết “Lịch thi học kì” và “Kết quả thi học kì”. Em cần biết ngày thi môn Tin học. Em mở liên kết nào trước?","type":"choice","choices":["Kết quả thi học kì","Mục Liên hệ","Lịch thi học kì","Mục Thư viện"],"correct":[2],"why":"Lịch thi cho biết ngày thi."},{"id":"B06-C13","prompt":"Ghép mục đích với thao tác phù hợp.","type":"match","choices":["1–Y · 2–X · 3–Z","1–X · 2–Y · 3–Z","1–Z · 2–Y · 3–X","1–Z · 2–X · 3–Y"],"correct":[1],"why":"Dùng thanh địa chỉ, nút Quay lại hoặc liên kết tùy mục đích.","items":["Mở một địa chỉ web đã biết","Trở lại trang vừa xem","Mở bài viết có tên hiện trên trang"],"groups":["Nhập địa chỉ vào thanh địa chỉ rồi nhấn Enter","Dùng nút Quay lại của trình duyệt","Bấm tên bài viết nếu đó là liên kết"],"assign":[0,1,2]},{"id":"B06-C14","prompt":"Trang chủ có hai mục Tin tức và Thư viện. Trong Tin tức có các liên kết Lịch thi và Lịch tham quan. Thư viện có mục Sách mới. Em đang ở Trang chủ và cần tìm ngày tham quan. Em bấm hai liên kết nào theo thứ tự?","type":"choice","choices":["Tin tức → Lịch thi","Thư viện → Lịch tham quan","Thư viện → Sách mới","Tin tức → Lịch tham quan"],"correct":[3],"why":"Từ Trang chủ, vào Tin tức rồi mở Lịch tham quan."},{"id":"B06-C15","prompt":"Em đang đọc bài “Lịch thi” và cần tìm lịch tham quan. Nút Quay lại sẽ đưa em về trang Tin tức. Hãy xếp các bước.","type":"order","choices":["3 → 2 → 1","2 → 1 → 3","2 → 3 → 1","3 → 1 → 2"],"correct":[0],"why":"Quay lại Tin tức, mở Lịch tham quan rồi đọc thời gian.","steps":["Đọc thời gian trong thông báo tham quan","Mở liên kết “Lịch tham quan”","Bấm Quay lại"],"sequence":[2,1,0]}]},{"goal":"Dựa vào dấu hiệu để sửa lỗi địa chỉ, kết nối hoặc điều hướng.","text":"Nếu trang không mở, kiểm tra địa chỉ đã nhập và kết nối Internet. Nếu mở được website nhưng đến nhầm mục, đọc tên liên kết và quay lại trang trước khi cần.","tasks":[{"id":"B06-C16","prompt":"Ghép mỗi dấu hiệu với việc nên thử trước.","type":"match","choices":["1–Z · 2–Y · 3–X","1–X · 2–Z · 3–Y","1–Y · 2–X · 3–Z","1–Z · 2–X · 3–Y"],"correct":[3],"why":"Đối chiếu dấu hiệu trước khi chọn cách xử lí.","items":["Địa chỉ đã nhập thiếu một chữ","Em bấm nhầm sang mục Thư viện","Máy báo chưa kết nối Wi-Fi"],"groups":["Quay lại trang trước","Kiểm tra kết nối Wi-Fi","Sửa địa chỉ đã nhập"],"assign":[2,0,1]},{"id":"B06-C17","prompt":"Địa chỉ minh họa đúng là https://truong.example/lich-thi. Em nhập https://truong.example/lichthi. Nhận xét nào đúng?","type":"multi","choices":["Hai địa chỉ có cùng tên miền.","Phần đường dẫn em gõ thiếu dấu gạch nối.","Hai địa chỉ chắc chắn mở cùng một trang.","Đổi trình duyệt sẽ tự thêm dấu gạch nối."],"correct":[0,1],"why":"Tên miền giống nhau nhưng đường dẫn đã nhập thiếu dấu gạch nối."},{"id":"B06-C18","prompt":"Xếp mỗi tình huống vào nhóm Lỗi địa chỉ, Lỗi kết nối hoặc Bấm nhầm liên kết. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["1 – 2 – 3","3 – 1 – 2","1 – 3 – 2","2 – 3 – 1"],"correct":[0],"why":"Mỗi dấu hiệu chỉ ra một nguyên nhân khác nhau.","items":["Địa chỉ trên màn hình có một kí tự khác địa chỉ giáo viên cung cấp.","Máy báo đang ngoại tuyến.","Website mở được, nhưng em bấm “Sách mới” khi đang tìm lịch thi."],"groups":["Lỗi địa chỉ","Lỗi kết nối","Bấm nhầm liên kết"],"assign":[0,1,2]},{"id":"B06-C19","prompt":"Máy vẫn mở được Trang chủ. Phiếu ghi https://truong.example/thu-vien; thanh địa chỉ hiển thị https://truong.example/thu-vine và trang báo không tìm thấy. Dấu hiệu và cách thử nào phù hợp nhất?","type":"choice","choices":["Trang chủ cũng không mở; kết nối lại Wi-Fi.","Tên miền sai; đổi truong.example sang lop.example.","Trình duyệt không hỗ trợ website; cài trình duyệt khác.","Đường dẫn khác phiếu; sửa thành /thu-vien rồi mở lại."],"correct":[3],"why":"Trang chủ vẫn mở và tên miền giống nhau; phần sau dấu gạch chéo bị gõ đảo chữ."},{"id":"B06-C20","prompt":"Em mở được Trang chủ và Tin tức. Khi bấm “Lịch thi cũ”, trình duyệt báo “Không tìm thấy trang”. Quay lại Tin tức, em thấy liên kết “Lịch thi học kì – bản cập nhật”. Em nên thử gì trước?","type":"choice","choices":["Khởi động lại bộ phát Wi-Fi","Cài một trình duyệt khác rồi mở lại liên kết cũ","Mở liên kết “Lịch thi học kì – bản cập nhật”","Tải lại liên kết “Lịch thi cũ” nhiều lần"],"correct":[2],"why":"Website vẫn truy cập được và có liên kết cập nhật phù hợp."}]},{"goal":"Đối chiếu ngày cập nhật, lớp và sự kiện trước khi chia sẻ.","text":"Khi có hai thông báo khác nhau, xem bản cập nhật trên website chính thức, kiểm tra ngày đăng và đối chiếu đúng lớp, đúng sự kiện. Nếu vẫn chưa rõ, hỏi giáo viên phụ trách.","tasks":[{"id":"B06-C21","prompt":"Ảnh trong nhóm chat ghi giờ tập trung là 7 giờ. Website trường ghi 7 giờ 30 và có liên kết “Cập nhật lịch tham quan”. Em nên làm những việc nào?","type":"multi","choices":["Mở liên kết cập nhật.","Báo ngay 7 giờ theo ảnh trong nhóm.","Kiểm tra ngày đăng, lớp và chuyến đi của thông báo.","Hỏi giáo viên phụ trách nếu hai nguồn vẫn mâu thuẫn."],"correct":[0,2,3],"why":"Hãy kiểm tra bản cập nhật và hỏi giáo viên nếu vẫn còn mâu thuẫn."},{"id":"B06-C22","prompt":"Em cần giờ tập trung của lớp 6A cho chuyến tham quan ngày 12/11. Website trường có bốn thông báo sau. Chọn thông báo phù hợp nhất.","type":"choice","choices":["Thông báo B","Thông báo A","Thông báo C","Thông báo D"],"correct":[0],"why":"B là thông báo mới nhất dành cho đúng lớp và đúng chuyến đi.","table":[["Thông báo","Ngày đăng","Chuyến tham quan","Lớp","Giờ tập trung"],["A","02/11","12/11","6A","7 giờ"],["B","05/11","12/11","6A","7 giờ 30"],["C","06/11","12/11","6B","8 giờ"],["D","07/11","19/11","6A","8 giờ 30"]]},{"id":"B06-C23","prompt":"Xếp các dấu hiệu vào nhóm Thông tin để đối chiếu hoặc Chỉ phản ánh mức độ lan truyền. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["1 – 2 – 1 – 1","2 – 2 – 1 – 2","1 – 1 – 1 – 2","1 – 2 – 1 – 2"],"correct":[3],"why":"Ngày cập nhật, tên lớp và ngày tham quan giúp xác minh nội dung.","items":["Ngày cập nhật hiển thị trên thông báo của trường.","Ảnh chụp có nhiều lượt thích.","Tên lớp và ngày tham quan ghi trong thông báo.","Ảnh được gửi lại nhiều lần trong nhóm."],"groups":["Thông tin để đối chiếu","Chỉ phản ánh mức độ lan truyền"],"assign":[0,1,0,1]},{"id":"B06-C24","prompt":"Em mới có địa chỉ Trang chủ. Hãy xếp các bước để tìm và gửi giờ tập trung có căn cứ cho nhóm.","type":"order","choices":["4 → 3 → 2 → 1","2 → 4 → 1 → 3","2 → 3 → 1 → 4","4 → 2 → 1 → 3"],"correct":[0],"why":"Truy cập Trang chủ, tìm bản cập nhật rồi đối chiếu trước khi gửi.","steps":["Đối chiếu ngày đăng, lớp và chuyến đi rồi gửi giờ cùng liên kết.","Mở liên kết cập nhật lịch tham quan.","Mở mục Tin tức.","Truy cập Trang chủ bằng trình duyệt."],"sequence":[3,2,1,0]},{"id":"B06-C25","prompt":"Mai học lớp 6A. Bản cập nhật ngày 05/11 trên website trường ghi 6A tập trung lúc 7 giờ 30, 6B lúc 8 giờ. Lịch cũ ngày 02/11 ghi 6A tập trung lúc 7 giờ. Mai nên gửi tin nào vào nhóm lớp?","type":"choice","choices":["6A tập trung lúc 8 giờ. Đây là giờ ở dòng cuối của bản cập nhật.","6 ua kiểm tra","In trước, ghép tệp sau"],"correct":[0],"why":"Tập hợp trước khi kiểm tra sản phẩm."},{"id":"T6-B14-C12","prompt":"Cần đưa một bài vào bản tổng hợp, giữ bản riêng. Làm gì?","type":"choice","choices":["Chỉ chụp tên tệp","Đổi tên bài thành sổ chung","Cắt và xóa bản nguồn ngay","Sao nội dung vào đúng mục của bản tổng hợp"],"correct":[3],"why":"Sao vào bản chung giữ được nguồn."},{"id":"T6-B14-C13","prompt":"Sau khi thêm bìa, làm gì để chắc nội dung cũ còn đủ?","type":"choice","choices":["Chỉ đếm số ảnh gốc","Chỉ nhìn dòng tiêu đề","Xem từ trang bìa tới các phần sau và kiểm tra bản xem trước","Xóa trang sau bìa"],"correct":[2],"why":"Cần kiểm tra bìa và các trang nội dung."},{"id":"T6-B14-C14","prompt":"Tạo bản sổ hai trang: bìa ghi tên sổ và lớp giả định, trang sau có một bài ngắn và bảng hai bạn giả định.","type":"practice","rubric":["1 điểm: bìa đúng.","1 điểm: bài và bảng đúng trang.","1 điểm: lưu tệp mở lại được."]},{"id":"T6-B14-C15","prompt":"Ghép hai đoạn kỉ niệm vào mục “Hoạt động”, đặt mỗi đoạn một tiêu đề cùng kiểu và lưu bản tổng hợp mới.","type":"practice","rubric":["1 điểm: đủ hai đoạn đúng mục.","1 điểm: tiêu đề cùng kiểu.","1 điểm: có bản mới."]}]},{"goal":"Rà soát lỗi khi hợp nhất.","text":"Đối chiếu bìa, bài viết, bảng, ảnh và bản xem trước.","tasks":[{"id":"T6-B14-C16","prompt":"Bìa ghi 6B, mọi nội dung được xác nhận thuộc 6A. Sửa gì?","type":"choice","choices":["Sửa tên lớp trên bìa và rà các vị trí ghi tên lớp","Bỏ trang bìa","Đổi tất cả nội dung thành 6B không kiểm tra","Đổi chỉ tên thư mục"],"correct":[0],"why":"Sửa vị trí sai và kiểm tra nhất quán."},{"id":"T6-B14-C17","prompt":"Bản xem trước cho thấy ảnh che đoạn văn. Cách sửa nào giữ cả hai?","type":"choice","choices":["Đổi phông chữ toàn sổ","In hai lần","Chỉnh kích thước và cách bố trí ảnh rồi xem trước lại","Xóa đoạn văn"],"correct":[2],"why":"Điều chỉnh bố cục thay vì mất nội dung."},{"id":"T6-B14-C18","prompt":"Trong danh sách, hai hàng trùng tên nhưng thuộc hai tổ. Làm gì trư "Gõ đè từng đoạn","Tìm và duyệt kết quả"],"correct":[3],"why":"Chỉ tìm đáp ứng yêu cầu đọc."},{"id":"T6-B13-C07","prompt":"Cùng một cụm xuất hiện trong lời kể và trích dẫn; chỉ sửa lời kể. Chọn gì?","type":"choice","choices":["Đổi khổ giấy","Thay tất cả toàn tệp","Xem từng kết quả và thay có chọn lọc","Xóa trích dẫn"],"correct":[2],"why":"Cần xét ngữ cảnh."},{"id":"T6-B13-C08","prompt":"Mọi chỗ có mẫu đặc trưng “LỚP-CŨ” đều cần sửa. Lệnh nào tiết kiệm thời gian sau khi kiểm tra?","type":"choice","choices":["Tìm nhưng không sửa","Thay thế tất cả","In từng trang","Chọn toàn bộ rồi gõ đè"],"correct":[1],"why":"Mẫu đã xác minh đủ cụ thể."},{"id":"T6-B13-C09","prompt":"Vì sao tìm “an” có thể thấy cả “ban”? Giả sử tìm chuỗi con.","type":"choice","choices":["Công cụ chỉ tìm chữ đầu","Vì hai từ luôn đồng nghĩa","“ban” là từ viết tắt của “an”","“an” xuất hiện liền nhau trong “ban”"],"correct":[3],"why":"Tìm chuỗi con không yêu cầu khớp cả từ."},{"id":"T6-B13-C10","prompt":"Làm gì để giữ bản trước khi chỉnh nhiều chỗ?","type":"choice","choices":["In một trang rồi ghi đè tệp gốc","Xóa bản đang có","Lưu một bản sao rồi sửa trên bản sao","Chỉ đổi màu chữ"],"correct":[2],"why":"Bản sao cho phép so lại và phục hồi."}]},{"goal":"Thực hiện tìm và sửa có kiểm tra.","text":"Xem từng kết quả hoặc thay hàng loạt khi mẫu đủ cụ thể.","tasks":[{"id":"T6-B13-C11","prompt":"Sửa “thư viẹn” thành “thư viện” ở mọi chỗ đã kiểm tra. Điền hai ô thế nào?","type":"choice","choices":["Tìm “thư viẹn”, thay bằng “thư viện”","Cả hai ô nhập “thư viện”","Ô Tìm để trống","Tìm “thư viện”, thay bằng “thư viẹn”"],"correct":[0],"why":"Tìm lỗi hiện có, thay bằng dạng đúng."},{"id":"T6-B13-C12","prompt":"Cần đổi lần đầu của “Tổ 2” thành “Tổ 3” và giữ lần sau. Thao tác nào đúng?","type":"choice","choices":["Chọn lần sau và thay","Thay tất cả","Đến lần đầu, thay một chỗ rồi dừng","Xóa cả hai lần"],"correct":[2],"why":"Yêu cầu giới hạn một kết quả."},{"id":"T6-B13-C13","prompt":"Đã thay hết “HỌC-KÌ-I” thành “HỌC-KÌ o ô Tìm và từ sai vào ô Thay bằng. Nêu hệ quả có thể xảy ra và trình tự sửa.","type":"practice","rubric":["1 điểm: dạng đúng có thể bị đổi thành dạng sai.","1 điểm: hoàn tác, đảo lại hai ô và kiểm tra kết quả trước khi thay."]}]},{"goal":"Thiết kế cách sửa nhiều lỗi cùng lúc.","text":"Tách các yêu cầu thành lượt thay với phạm vi riêng.","tasks":[{"id":"T6-B13-C21","prompt":"Sửa mọi “thông bao” và chỉ đổi ngày trong tiêu đề. Phương án nào phù hợp?","type":"choice","choices":["Thay mẫu lỗi đã kiểm tra hàng loạt, đổi ngày đúng một chỗ rồi rà lại","Xóa đoạn chứa ngày","Đổi ngày trong mọi tệp trước khi kiểm tra","Thay hàng loạt mọi ngày"],"correct":[0],"why":"Hai yêu cầu có phạm vi khác nhau."},{"id":"T6-B13-C22","prompt":"Cần giữ cả tệp gốc và tệp đã sửa để đối chiếu. Chọn cách nào?","type":"choice","choices":["Đổi tên nhưng ghi đè cùng đường dẫn","Lưu bản sửa dưới tên khác, rồi mở lại cả hai","Xóa tệp gốc","Lưu đè và đóng tệp"],"correct":[1],"why":"Hai tệp riêng giữ được hai phiên bản."},{"id":"T6-B13-C23","prompt":"Phát hiện còn một lỗi khác dạng sau khi thay hết mẫu đầu. Làm gì?","type":"choice","choices":["In mà không sửa","Tìm mẫu khác, kiểm tra rồi xử lí một lượt riêng","Thay toàn bộ chữ giống một phần của lỗi","Kết luận lệnh bị hỏng"],"correct":[1],"why":"Các dạng lỗi khác nhau có mẫu khác nhau."},{"id":"T6-B13-C24","prompt":"Tạo tệp chứa “Nhóm A mượn sach thứ Ba. Nhóm B mượn sach thứ Ba. Mã: sach01.” Sửa hai cụm chính tả và đổi riêng hạn Nhóm B sang thứ Tư; lưu bản sửa.","type":"practice","rubric":["1 điểm: hai cụm “mượn sách”.","1 điểm: chỉ đổi hạn Nhóm B.","1 điểm: mã giữ nguyên và lưu bản sửa."]},{"id":"T6-B13-C25","prompt":"Đề xuất và thực hiện hai lượt sửa trong bản tin mẫu của em: một lỗi giống nhau ở mọi chỗ và một cụm chỉ đổi ở một chỗ. Báo cách kiểm tra.","type":"practice","rubric":["1 điểm: thay hàng loạt sau khi đối chiếu.","1 điểm: thay chọn lọc đúng vị trí.","1 điểm: có kiểm tra cả chỗ sửa và chỗ giữ."]}]}],"extras":[]},"12":{"n":12,"title":"Trình bày thông tin ở dạng bảng","pages":"53–57","stages":[{"goal":"Nhận diện hàng, cột, ô và công dụng của bảng.","text":"Hàng đi ngang, cột đi dọc, ô nằm tại giao điểm.","tasks":[{"id":"T6-B12-C01","prompt":"Ô trong bảng là gì?","type":"choice","choices":["Toàn bộ một hàng","Giao của một hàng và một cột","Toàn bộ một cột","Tên của cả bảng"],"correct":[1],"why":"Mỗi ô có một vị trí hàng và cột."},{"id":"T6-B12-C02","prompt":"Bảng nào thích hợp nhất để so sánh điểm theo môn của nhiều bạn?","type":"choice","choices":["Danh sách chỉ có tên bạn","Một đoạn không có tên môn","Bảng có hàng theo bạn và cột theo môn","Một ảnh lớp không có số liệu"],"correct":[2],"why":"Các cột chung giúp so sánh cùng môn."},{"id":"T6-B12-C03","prompt":"Hàng đầu ghi “Họ tên” và “Tổ” có tác dụng gì?","type":"choice","choices":["Chỉ đánh số trang","Đặt tên cho các cột","Gộp toàn bộ dữ liệu","Xóa cột"],"correct":[1],"why":"Tên cột giúp đọc đúng ý nghĩa của ô bên dưới."},{"id":"T6-B12-C04","prompt":"Muốn thêm một bảng vào văn bản, dùng nhóm lệnh nào?","type":"choice","choices":["In văn bản","Đổi hướng trang","Chèn bảng","Thay thế từ"],"correct":[2],"why":"Lệnh chèn bảng tạo các ô."},{"id":"T6-B12-C05","prompt":"Chọn nhiều ô liền nhau rồi hợp thành một ô gọi là gì?","type":"choice","choices":["Xóa hàng","Tách trang","Chèn cột","Gộp ô"],"correct":[3],"why":"Gộp ô thay nhóm ô bằng một ô chung."}]},{"goal":"Đọc cấu trúc và chọn thao tác.","text":"Đếm riêng số cột, số hàng tiêu đề và hàng dữ liệu.","tasks":[{"id":"T6-B12-C06","prompt":"Bảng có ba cột: Tên, Tổ, Số sách. Mỗi bạn nằm ở đâu?","type":"choice","choices":["Một hàng dữ liệu","Ba bảng riêng","Chỉ một ô tiêu đề","Một cột mới"],"correct":[0],"why":"Mỗi hàng lưu một bản ghi."},{"id":"T6-B12-C07","prompt":"Có bốn bạn và cần một hàng tiêu đề. Tối thiểu mấy hàng?","type":"choice","choices":["5","8","4","3"],"correct":[0],"why":"Bốn hàng dữ liệu cộng một hàng tiêu đề."},{"id":"T6-B12-C08","prompt":"Muốn thêm trường “Ghi chú” cho mọi bạn thì thêm gì?","type":"choice","choices":["Một hàng","Một cột","Một trang trống","Một tiêu đề phụ ngoài bảng"],"correct":[1],"why":"Trường mới ứng với một cột."},{"id":"T6-B12-C09","prompt":"Bảng ghi hàng Mai, cột Số sách = 4. Đọc thế nào?","type":"choice","choices":["Bảng có 4 cột","Có 4 bạn tên Mai","Mai ở tổ 4","Mai có 4 sách theo bảng"],"correct":[3],"why":"Cần đọc đồng thời nhãn hàng và cột."},{"id":"T6-B12-C10","prompt":"Muốn bỏ toàn bộ trường “Số điện thoại”, dùng thao tác nào?","type":"choice","choices":["Xóa cột đó","Chỉ đổi màu cột","Xóa hàng cuối","Gộp với cột Họ tên"],"correct":[0],"why":"Một trường chiếm toàn bộ một cột."}]},{"goal":"Tạo, nhập và chỉnh bảng.","text":"Chọn số hàng, số cột và bố trí ô theo yêu cầu.","tasks":[{"id":"T6-B12-C11","prompt":"Có ba bạn, mỗi bạn ghi tên, tổ và số sách. Tính cả tiêu đề, tạo bảng nào?","type":"choice","choices":["3 cột, 4 hàng","3 cột, 3 hàng","4 cột, 3 hàng","4 cột, 4 hàng"],"correct":[0],"why":"Ba trường, ba bản ghi, một hàng tiêu đề."},{"id":"T6-B12-C12","prompt":"Bảng 3 cột cần thêm hàng trên cùng để đặt một tên chung. Làm gì?","type":"choice","choices":["Tạo ba bảng một cột","Xóa ba cột trước","Chèn hàng trên, chọn ba ô của hàng mới rồi gộp","Gộp các ô dữ liệu dưới cùng"],"correct":[2],"why":"Tên chung có thể nằm trong một ô phủ cả hàng."},{"id":"T6-B12-C13","prompt":"Tên dài bị xuống nhiều dòng trong cột hẹp, cột bên cạnh còn dư. Sửa gì?","type":"choice","choices":["Đổi tên tệp","Điều chỉnh độ rộng hai cột phù hợp","Xóa bớt tên","Thêm hàng trắng cho mọi người"],"correct":[1],"why":"Điều chỉnh kích thước để giữ dữ liệu và dễ đọc."},{"id":"T6-B12-C14","prompt":"Tạo bảng ba cột Tên, Tổ, Sách với hai dòng An–1–3 và Bình–2–5. Ghi lại ô ở hàng Bình, cột Sách.","type":"practice","rubric":["1 điểm: đủ bảng và dữ liệu.","1 điểm: đọc đúng 5."]},{"id":"T6-B12-C15","prompt":"Thêm một hàng dữ liệu cho Chi–1–4 ở cuối bảng có tiêu đề và thêm cột Ghi chú. Lưu bản mới.","type":"practice","rubric":["1 điểm: thêm hàng đúng.","1 điểm: thêm cột đúng.","1 điểm: lưu được tệp."]}]},{"goal":"Phân tích lỗi cấu trúc và nội dung.","text":"Kiểm tra liệu chỉnh sửa có làm mất hàng, cột hoặc ý nghĩa dữ liệu.","tasks":[{"id":"T6-B12-C16","prompt":"Bảng thiếu bạn Chi, nhưng ba trường hiện có đã đủ. Sửa gì?","type":"choice","choices":["Gộp tên Chi vào hàng An","Thêm một cột mang tên Chi","Xóa tiêu đề","Thêm một hàng dữ liệu cho Chi"],"correct":[3],"why":"Thêm bản ghi, không thêm trường."},{"id":"T6-B12-C17","prompt":"Sau khi gộp, tiêu đề của từng cột biến mất vì chọn nhầm hàng. Sửa thế nào?","type":"choice","choices":["Gộp thêm toàn bộ bảng","Nhập mọi giá trị vào ô đầu","Đổi màu hàng dữ liệu","Hoàn tác, chèn hàng riêng rồi chỉ gộp hàng đó"],"correct":[3],"why":"Giữ hàng tên cột và tạo hàng tên bảng riêng."},{"id":"T6-B12-C18","prompt":"Sau khi xóa một ô, các giá trị trên hàng bị dịch và gắn nhầm tên cột. Sửa trước tiên thế nào?","type":"choice","choices":["Hoàn tác, đối chiếu nhãn cột rồi xóa nội dung ô nếu chỉ cần làm trống","Xóa hàng tiêu đề","Xóa toàn bộ cột","Điền đại số vào các ô"],"correct":[0],"why":"Xóa nội dung khác với xóa ô và dịch các ô."},{"id":"T6-B12-C19","prompt":"Bảng có hai hàng tiêu đề giống nhau và một bạn bị thiếu. Nêu cách sửa mà vẫn giữ một hàng tiêu đề.","type":"practice","rubric":["1 điểm: xóa hàng tiêu đề lặp.","1 điểm: thêm một hàng dữ liệu đủ các trường cho bạn thiếu."]},{"id":"T6-B12-C20","prompt":"Bảng in bị cắt cột Ghi chú ở mép phải. Nêu cách chỉnh độ rộng hoặc hướng trang và cách xác nhận sửa thành công.","type":"practice","rubric":["1 điểm: chỉnh hợp lý mà giữ dữ liệu.","1 điểm: xem trước xác nhận đủ cột và đọc được."]}]},{"goal":"Thiết kế bảng để tra cứu và so sánh.","text":"Chọn cấu trúc đáp ứng yêu cầu và kiểm tra dữ liệu bằng một phép đọc.","tasks":[{"id":"T6-B12-C21","prompt":"Cần theo dõi số sách theo từng tổ trong hai tuần. Cấu trúc nào dễ so sánh?","type":"choice","choices":["Mỗi tuần chỉ ghi tên tệp","Hàng theo tổ, cột Tổ, Tuần 1, Tuần 2","Hai số đặt ngẫu nhiên cạnh tên tổ","Một ô chứa tất cả số không nhãn"],"correct":[1],"why":"Các cột theo tuần cho phép so cùng tổ."},{"id":"T6-B12-C22","prompt":"Lập danh sách phát sách, cần thấy nhanh bạn nào chưa nhận. Thêm trường nào hữu ích nhất?","type":"choice","choices":["Màu bìa tệp","Tên máy in","Trạng thái nhận","Kích thước màn hình"],"correct":[2],"why":"Trạng thái trả lời trực tiếp câu hỏi."},{"id":"T6-B12-C23","prompt":"Hai tổ có cùng số sách tuần 1. Muốn biết tổ nào tăng nhiều hơn, cần gì?","type":"choice","choices":["Chỉ lấy số tuần 1","Chỉ so tên tổ","Đọc đủ số của cả hai tuần rồi so mức tăng","Chỉ nhìn hàng cuối"],"correct":[2],"why":"Mức tăng là số tuần 2 trừ tuần 1."},{"id":"T6-B12-C24","prompt":"Tạo bảng cho tổ 1 có 7 và 10 sách, tổ 2 có 8 và 9 sách theo tuần 1, tuần 2. Cho biết tổ nào tăng nhiều hơn.","type":"practice","rubric":["1 điểm: cột và hàng đúng.","1 điểm: dữ liệu đúng.","1 điểm: tổ 1 tăng 3, tổ 2 tăng 1."]},{"id":"T6-B12-C25","prompt":"Thiết kế bảng lịch trực nhật cho hai ngày, mỗi ngày hai nhiệm vụ và một người phụ trách cho mỗi nhiệm vụ. Nêu cách tìm người làm một nhiệm vụ cụ thể.","type":"practice","rubric":["1 điểm: trường Ngày, Nhiệm vụ, Người phụ trách hoặc cấu trúc tương đương.","1 điểm: đủ bốn nhiệm vụ và người.","1 điểm: chỉ đúng cách tra theo ngày và việc."]}]}],"extras":[]},"11":{"n":11,"title":"Định dạng văn bản","pages":"48–52","stages":[{"goal":"Nhận diện chức năng soạn thảo, định dạng và in.","text":"Xét phần được thay đổi: chữ, đoạn hoặc cả trang.","tasks":[{"id":"T6-B11-C01","prompt":"Phần mềm soạn thảo giúp làm gì?","type":"choice","choices":["Nhập, sửa, trình bày và in văn bản","Chỉ xem video","Chỉ vẽ tự do","Đo nhiệt độ"],"correct":[0],"why":"Soạn thảo hỗ trợ toàn bộ quá trình làm văn bản."},{"id":"T6-B11-C02","prompt":"Lệnh nào đặt tiêu đề vào giữa hai lề?","type":"choice","choices":["Căn giữa đoạn","Đổi hướng trang","Chèn ngắt dòng","Đổi phông chữ"],"correct":[0],"why":"Căn giữa tác động đến vị trí đoạn."},{"id":"T6-B11-C03","prompt":"Kiểu trang nào có chiều rộng lớn hơn chiều cao?","type":"choice","choices":["Trang ngang","Căn trái","Trang dọc","Lề hẹp"],"correct":[0],"why":"Hướng ngang làm trang rộng theo chiều ngang."},{"id":"T6-B11-C04","prompt":"Vùng trống quanh nội dung trang gọi là gì?","type":"choice","choices":["Đầu đề","Giãn dòng","Lề trang","Khoảng cách kí tự"],"correct":[2],"why":"Lề nằm giữa nội dung và mép trang."},{"id":"T6-B11-C05","prompt":"Trước khi in, dùng gì để nhìn bố cục các trang?","type":"choice","choices":["Xem trước khi in","Đếm từ","Đổi tên tệp","Tìm kiếm"],"correct":[0],"why":"Bản xem trước phản ánh cách nội dung lên giấy."}]},{"goal":"Phân biệt định dạng theo phạm vi.","text":"Kiểu chữ tác động đến kí tự; căn lề đoạn và thiết lập trang có phạm vi khác.","tasks":[{"id":"T6-B11-C06","prompt":"Đổi riêng hai từ sang chữ đậm thuộc loại nào?","type":"choice","choices":["Thay nội dung từ","Xóa đoạn","Định dạng trang","Định dạng kí tự"],"correct":[3],"why":"Đổi kiểu chữ mà không đổi từ."},{"id":"T6-B11-C07","prompt":"Giãn dòng trong một đoạn thuộc loại nào?","type":"choice","choices":["Định dạng trang","Đổi khổ giấy","Định dạng đoạn","Đổi tên tệp"],"correct":[2],"why":"Giãn dòng điều chỉnh khoảng cách các dòng của đoạn."},{"id":"T6-B11-C08","prompt":"Đặt lề trái 2 cm thuộc loại nào?","type":"choice","choices":["Chỉnh chủ đề tệp","Thiết lập trang","Định dạng kí tự","Đổi màu đoạn"],"correct":[1],"why":"Lề trái đo từ mép giấy đến vùng nội dung."},{"id":"T6-B11-C09","prompt":"Tiêu đề cần đậm và giữa trang. Cần hai thao tác nào?","type":"choice","choices":["Đổi tên tệp và in","Đổi lề trang và đổi khổ giấy","Chèn dấu cách và thu nhỏ trang","In đậm chữ và căn giữa đoạn"],"correct":[3],"why":"Đậm và căn giữa điều khiển hai thuộc tính riêng."},{"id":"T6-B11-C10","prompt":"Dòng bị xuống hàng khi lề trái và phải cùng tăng. Vì sao?","type":"choice","choices":["Mỗi chữ tự đổi màu","Chiều dài văn bản tăng","Vùng chứa chữ hẹp hơn","Tên tệp dài hơn"],"correct":[2],"why":"Lề rộng làm chiều rộng vùng nội dung nh const h=(tag,cls='',text='')=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e};
function add(parent,...children){parent.append(...children.filter(x=>x!==null&&x!==undefined));return parent}
function b(text,fn,cls='btn subtle'){const e=h('button',cls,text);e.type='button';e.addEventListener('click',fn);return e}
function field(label,control){return add(h('label','field'),h('span','field-label',label),control)}
function select(options,current,onChange){
  const e=h('select');e.append(new Option('Chọn…',''));
  options.forEach((x,i)=>e.append(new Option(x,String(i))));
  e.value=current===null||current===undefined?'':String(current);
  e.addEventListener('change',()=>onChange(e.value===''?null:Number(e.value)));return e
}
function input(value,onInput,opts={}){const e=h('input');Object.assign(e,{value,type:'text',...opts});e.addEventListener('input',()=>onInput(e.value));return e}
function pressed(label,active,fn,cls='chip'){const e=b(label,fn,cls+(active?' selected':''));e.setAttribute('aria-pressed',String(active));return e}
const same=(a,b)=>Array.isArray(a)&&a.length===b.length&&a.every((x,i)=>x===b[i]);
const folded=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').trim();
function stableOrder(n,key){
  const arr=Array.from({length:n},(_,i)=>i);
  let seed=[...key].reduce((a,c)=>Math.imul(a^c.charCodeAt(0),16777619)>>>0,2166136261);
  for(let i=n-1;i>0;i--){seed=(Math.imul(1664525,seed)+1013904223)>>>0;const j=seed%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr
}
function checkTable(rows){
 const box=h('div','table-wrap'),table=h('table','data-table');
 rows.forEach((row,i)=>{const tr=h('tr');row.forEach(v=>{const td=h(i?'td':'th','',v);if(!i)td.scope='col';tr.append(td)});table.append(tr)});return add(box,table)
}
const LABS={};
function mountLab(host,mission,initialDone,award){
  const lab=LABS[mission.mode];let caseNo=initialDone.includes(0)&&!initialDone.includes(1)?1:0;
  let state={},msg=null,done=[...initialDone];
  const ui={
    root:host,
    nextRender(){render()},
    verdict(ok,good,retry){msg={ok,text:ok?good:retry};if(ok&&!done.includes(caseNo)){done.push(caseNo);award(caseNo)}render();host.querySelector('.lab-feedback')?.focus()},
    notify(text){msg={ok:null,text};render();host.querySelector('.lab-feedback')?.focus()},
    change(fn){return()=>{fn();msg=null;render()}},
    action(text,fn){return b(text,fn,'btn primary')}
  };
  function render(){
    const current=lab[caseNo];
    const tabs=h('div','lab-tabs');
    lab.forEach((x,i)=>tabs.append(pressed((done.includes(i)?'✓ ':'')+(i===0?'01 · Làm quen':'02 · Thử thách'),i===caseNo,()=>{
      if(caseNo===i)return;caseNo=i;state={};msg=null;render();host.querySelector('.lab-name')?.focus();
    })));
    const stage=h('section','lab-stage');
    const name=h('h3','lab-name',current.title);name.tabIndex=-1;
    add(stage,name,h('p','lab-instruction',current.prompt));
    const play=h('div','lab-play');stage.append(play);
    host.replaceChildren(tabs,stage);
    const aria=h('div','sr-only');aria.id='lab-current';aria.textContent='Mô phỏng '+mission.lab;stage.prepend(aria);
    current.draw(play,state,ui);
    if(msg){const out=h('p','lab-feedback '+(msg.ok===true?'success':msg.ok===false?'warning':'neutral'),msg.text);out.tabIndex=-1;out.setAttribute('role','status');stage.append(out)}
  }
  render();
}
function sortedLab(title,prompt,groups,items,expect,good,retry,appearance=''){
 return {title,prompt,draw(box,s,u){
  s.answers??=Array(items.length).fill(null);
  const cols=h('div','sort-board '+appearance);
  groups.forEach((g,i)=>{const bin=h('div','sort-bin'),list=h('ul');items.forEach((t,j)=>{if(s.answers[j]===i)list.append(h('li','',t))});add(bin,h('strong','',g),list.children.length?list:h('span','tiny','Chưa có mục'));cols.append(bin)});
  const rows=h('div','form-grid');
  items.forEach((x,i)=>rows.append(field(x,select(groups,s.answers[i],v=>{s.answers[i]=v;u.nextRender();u.root.querySelectorAll('select')[i]?.focus()}))));
  add(box,cols,rows,u.action('Kiểm tra cách xếp',()=>u.verdict(same(s.answers,expect),good,retry)));
 }}
}

function tray(box,options,picked,onPick,onUndo,onClear,label='Các bước đã lắp'){
 const src=h('div','tool-row'),out=h('ol','ordered-tray');out.tabIndex=-1;
 options.forEach((x,i)=>{const e=b(x,()=>onPick(i),'btn chip');e.disabled=picked.includes(i);src.append(e)});
 if(!picked.length)out.append(h('li','empty-slot','Chưa có bước nào.'));
 else picked.forEach(i=>{const step=h('li','',options[i]);step.tabIndex=-1;out.append(step)});
 const tools=h('div','tool-row');const undo=b('Bỏ bước cuối',onUndo),clear=b('Xếp lại',onClear);undo.disabled=clear.disabled=!picked.length;
 add(box,src,h('p','field-label',label),out,add(tools,undo,clear));
}

function pixelCase(title,prompt,pattern){
 const w=pattern[0].length,answer=pattern.join('').split('').map(Number);
 return {title,prompt,draw(box,s,u){
  s.bits??=answer.map(()=>0);
  const grids=h('div','pixel-pair');
  function makeGrid(values,editable){
   const grid=h('div','pixel-grid');grid.style.setProperty('--cols',w);
   values.forEach((v,i)=>{
    const label='Hàng '+(Math.floor(i/w)+1)+', cột '+(i%w+1)+': '+v;
    const e=editable?pressed(String(v),!!v,()=>{s.bits[i]=1-v;u.nextRender();u.root.querySelectorAll('.pixel-grid button')[i]?.focus()},'pixel-cell'):h('span','pixel-cell '+(v?'selected':''),String(v));
    e.setAttribute('aria-label',label);grid.append(e);
   });return grid
  }
  add(grids,add(h('div'),h('p','field-label','Ảnh đích · 1 là ô tối'),makeGrid(answer,false)),add(h('div'),h('p','field-label','Bảng em đang mã hóa'),makeGrid(s.bits,true)));
  add(box,grids,h('p','readout','Mã theo hàng: '+pattern.map((_,r)=>s.bits.slice(r*w,(r+1)*w).join('')).join(' / ')),
  u.action('So ảnh và dãy bit',()=>u.verdict(same(s.bits,answer),'Khớp! Có '+answer.length+' bit, đọc lần lượt theo từng hàng.','So từng ô với ảnh đích. Chỉ bật 1 tại ô tối, bắt đầu từ hàng đầu.')));
 }}
}

function networkCase(title,prompt,nodes,edges,solution){
 return {title,prompt,draw(box,s,u){
  s.wires??=[];s.pick??=null;
  const board=h('div','network-board');
  const kinds=['Máy bàn','Bộ chuyển mạch','Máy in','Điểm Wi-Fi','Máy bảng','Màn hình'];
  const icons=['🖥️','🔀','🖨️','📶','📱','🖼️'];
  nodes.forEach((t,i)=>{const x=pressed(icons[kinds.indexOf(t)]+' '+t,s.pick===i,()=>{
   if(s.pick===null)s.pick=i;
   else if(s.pick===i)s.pick=null;
   else {
    const key=[s.pick,i].sort((a,b)=>a-b).join('-');
    const pos=s.wires.indexOf(key);
    if(pos<0)s.wires.push(key);else s.wires.splice(pos,1);
    s.pick=null;
   }
   u.nextRender();u.root.querySelectorAll('.network-board button')[i]?.focus();
  },'device');board.append(x)});
  const links=h('ul','wire-list');
  s.wires.forEach(key=>{const [a,b]=key.split('-').map(Number);links.append(h('li','',nodes[a]+' '+(edges[key]==='wifi'?'⋯ Wi-Fi ⋯':'⟷ cáp ⟷')+' '+nodes[b]))});
  if(!s.wires.length)links.append(h('li','tiny','Chưa có kết nối.'));
  add(box,board,h('p','field-label','Kết nối hiện có · chọn lại hai thiết bị để gỡ dây'),links,
   u.action('Thử gửi trang in',()=>u.verdict(same([...s.wires].sort(),[...solution].sort()),'Máy in đã nhận trang thử qua mạng đã thiết kế.','Hãy đưa các thiết bị về cùng mạng qua bộ chuyển mạch; máy bảng cần điểm Wi-Fi. Bỏ các đường không phục vụ yêu cầu.')));
 }}
}

function searchCase(title,prompt,goal,type,required,good){
 return {title,prompt,draw(box,s,u){
  s.query??='';s.filter??='Tất cả';s.view??=null;
  const q=input(s.query,v=>s.query=v,{placeholder:'Nhập từ khóa…'});
  const run=()=>{s.view=s.query;s.result=null;u.nextRender();u.root.querySelector('input')?.focus()};
  q.addEventListener('keydown',e=>{if(e.key==='Enter')run()});
  add(box,add(h('div','search-bar'),field('Từ khóa',q),b('Tìm kiếm',run,'btn primary')));
  const tabs=h('div','tool-row');['Tất cả','Hình ảnh','Video','Bài viết'].forEach(t=>tabs.append(pressed(t,s.filter===t,()=>{s.filter=t;s.result=null;u.nextRender();[...u.root.querySelectorAll('.tool-row button')||[]].find(e=>e.textContent===t)?.focus()})));box.append(tabs);
  const list=h('div','search-results');
  if(s.view===null)list.append(h('p','muted','Nhập từ khóa rồi bấm Tìm kiếm.'));
  else {
   const terms=folded(s.view).match(/[a-z0-9]+/g)||[];
   const found=results.map(([t,name,source,keys],i)=>({i,t,name,source,score:terms.filter(x=>folded(keys).split(/[^a-z0-9]+/).includes(x)).length})).filter(r=>r.score>0&&(s.filter==='Tất cả'||s.filter===r.t)).sort((a,b)=>b.score-a.score||a.i-b.i);
   if(!found.length)list.append(h('p','muted','Chưa có kết quả trong mô phỏng. Thử tên đối tượng hoặc ngày cụ thể.'));
   found.forEach(r=>list.append(add(h('article','search-result'),pressed(r.name,s.result===r.i,()=>{s.result=r.i;u.nextRender();[...u.root.querySelectorAll('.search-result button')||[]].find(e=>e.textContent===r.name)?.focus()},'result-title'),h('small','muted',r.t+' · '+r.source))));
  }
  add(box,list,u.action('Nộp kết quả đã chọn',()=>u.verdict(s.result===goal&&s.filter===type&&required.every(t=>(folded(s.view||'').match(/[a-z0-9]+/g)||[]).includes(t)),good,'Kiểm tra lại từ khóa, thẻ kết quả và ngày của nguồn. Truy vấn nên có đối tượng cùng chi tiết mà đề yêu cầu.')));
 }}
}

function replaceCase(title,prompt,original,target){
 return {title,prompt,draw(box,s,u){
  s.text??=original;s.find??='';s.into??='';s.position??=-1;s.history??=[];
  const form=h('div','form-grid');
  const f=input(s.find,v=>{s.find=v;s.position=-1},{placeholder:'Mẫu cần tìm',maxLength:60});
  const r=input(s.into,v=>s.into=v,{placeholder:'Nội dung mới',maxLength:60});
  add(form,field('Tìm',f),field('Thay bằng',r));
  function seek(){return s.find?s.text.indexOf(s.find,s.position<0?0:s.position+s.find.length):-1}
  function mark(){if(!s.find){u.notify('Hãy nhập cụm từ cần tìm.');return}
   const i=seek();s.position=i<0?s.text.indexOf(s.find):i;u.notify(s.position<0?'Không thấy mẫu trong văn bản.':'Đã đánh dấu một kết quả. Kiểm tra ngữ cảnh trước khi thay.')}
  function replace(all){
   if(!s.find||!s.text.includes(s.find)){u.notify('Không có kết quả cho mẫu hiện tại.');return}
   const i=s.position;
   if(!all&&(i<0||s.text.slice(i,i+s.find.length)!==s.find)){u.notify('Bấm Tìm tiếp để đánh dấu đúng một chỗ trước khi thay.');return}
   s.history.push(s.text);
   s.text=all?s.text.split(s.find).join(s.into):s.text.slice(0,i)+s.into+s.text.slice(i+s.find.length);
   s.position=-1;u.notify(all?'Đã thay tất cả vị trí khớp.':'Đã thay vị trí vừa chọn.');
  }
  const tools=add(h('div','tool-row'),b('Tìm tiếp',mark),b('Thay chỗ này',()=>replace(false)),b('Thay tất cả',()=>replace(true)));
  const undo=b('Hoàn tác',()=>{s.text=s.history.pop();s.position=-1;u.notify('Đã hoàn tác lượt thay vừa rồi.')});undo.disabled=!s.history.length;tools.append(undo);
  const doc=h('div','draft-text');
  if(s.position>=0&&s.find){add(doc,document.createTextNode(s.text.slice(0,s.position)),h('mark','',s.find),document.createTextNode(s.text.slice(s.position+s.find.length)))}
  else doc.textContent=s.text;
  add(box,form,tools,doc,u.action('Kiểm tra bản cuối',()=>u.verdict(s.text===target,'Bản thảo khớp yêu cầu; phần cần giữ vẫn nguyên vẹn.','Đọc lại toàn văn. Nếu thay nhầm, hoàn tác và tìm cụm đủ cụ thể hoặc thay từng chỗ.')));
 }}
}

function scratchCase(title,prompt,mode){
 const cases=mode==='sum'?[[3,8,11],[9,0,9]]:[[4,5,'Thiếu'],[4,6,'Đủ'],[4,7,'Đủ']];
 return {title,prompt,draw(box,s,u){
  s.blocks??=[null,null,null];
  const choices=[
   ['Hỏi a → lưu a → hỏi b → lưu b','Hỏi hai lần → lưu cả a, b bằng trả lời cuối','Đặt a và b thành 0'],
   ['Đặt tổng thành a + b','Đặt tổng thành a − b','Đặt tổng thành b'],
   mode==='sum'?['Nói tổng','Nói a','Nói b']:['Nếu tổng ≥ 10: nói Đủ; nếu không: nói Thiếu','Nếu tổng > 10: nói Đủ; nếu không: nói Thiếu','Luôn nói Đủ']
  ];
  const stage=add(h('div','scratch-stage'),h('span','scratch-cat','🐱'),h('span','speech',s.outputs?s.outputs.join(' · '):'Đang chờ bấm cờ xanh…'));
  const script=add(h('div','scratch-script'),h('div','scratch-hat','⚑ Khi bấm cờ xanh'));
  choices.forEach((ops,i)=>script.append(add(h('div','scratch-block sb'+i),field(['Nhập và lưu','Tính toán','Thông báo'][i],select(ops,s.blocks[i],v=>s.blocks[i]=v)))));
  add(box,stage,script,checkTable([['a','b','Kết quả mong đợi'],...cases.map(r=>r.map(String))]),u.action('⚑ Chạy chương trình',()=>{
   if(s.blocks.some(v=>v===null)){u.notify('Lắp đủ cả ba khối trước khi bấm cờ xanh.');return}
   s.outputs=cases.map(([a,b])=>{
    const [enter,op,out]=s.blocks;
    if(enter===1)a=b;else if(enter===2){a=0;b=0}
    const sum=[a+b,a-b,b][op];
    if(mode==='sum')return [sum,a,b][out];
    return out===2?'Đủ':(out===0?sum>=10:sum>10)?'Đủ':'Thiếu';
   });
   u.verdict(same(s.outputs,cases.map(r=>r[2])),'Nhân vật trả lời đúng: '+s.outputs.join(' · ')+'.','Nhân vật nói '+s.outputs.join(' · ')+'. So từng ca, kiểm tra khối lưu dữ liệu, phép tính và điều kiện.');
  }));
 }}
}

 else{
  const deadline=performance.now()+READ_MS;const time=gate.querySelector('.gate-time');
  const tick=()=>{const remain=Math.max(0,deadline-performance.now());time.textContent=Math.ceil(remain/1000)+'s';study.style.setProperty('--read',360*(1-remain/READ_MS)+'deg');
   if(remain){timer=requestAnimationFrame(tick)}else{study.classList.remove('reading');unlock()}};
  study.classList.add('reading');tick();
 }
 focusViewStart(title);
 if(retry)focus(pane.querySelector('h2'));
}
function drawQuestion(q,pane,stage,index){
 const head=add(h('div','question-meta'),h('span','badge',q.id),h('span','tiny',modes[q.type]));
 const prompt=h('h2','question-prompt',q.prompt);
 add(pane,head,prompt);
 if(q.table)pane.append(checkTable(q.table));
 if(q.type==='practice'){drawPractice(q,pane,()=>complete(index,q,pane,true));return}
 const area=h('div','answer-area');pane.append(area);
 const toolbar=h('div','tool-row');pane.append(toolbar);
 const submit=b('Kiểm tra',grade,'btn primary');submit.disabled=true;toolbar.append(submit);
 let valid=()=>false,correct=()=>false;
 const update=()=>submit.disabled=!valid();
 if(q.type==='order'){
  const local=[];const order=stableOrder(q.steps.length,q.id);
  function drawOrder(){
   area.replaceChildren(h('p','muted','Bấm từng bước theo thứ tự. Có thể bỏ bước cuối hoặc xếp lại.'));
   tray(area,order.map(i=>q.steps[i]),local,i=>{local.push(i);drawOrder();focus(area.querySelector('.ordered-tray li:last-child'))},()=>{local.pop();drawOrder();focus(area.querySelector('.ordered-tray'))},()=>{local.splice(0);drawOrder();focus(area.querySelector('.tool-row button'))},'Thứ tự của em');
   update();
  }
  valid=()=>local.length===q.steps.length;
  correct=()=>same(local.map(i=>order[i]),q.sequence);drawOrder();
 }else if(q.type==='match'){
  const chosen=Array(q.items.length).fill(null);
  const order=stableOrder(q.groups.length,q.id);
  q.items.forEach((x,i)=>area.append(field(x,select(order.map(k=>q.groups[k]),null,v=>{chosen[i]=v;update()}))));
  valid=()=>chosen.every(x=>x!==null);correct=()=>same(chosen.map(i=>order[i]),q.assign);
 }else{
  const ids=stableOrder(q.choices.length,q.id),set=new Set(),fields=h('fieldset','answer-options');
  const legend=h('legend','sr-only',q.type==='multi'?'Chọn tất cả phương án đúng':'Chọn một phương án đúng');fields.append(legend);
  ids.forEach((idx,i)=>{
   const f=h('input');f.type=q.type==='multi'?'checkbox':'radio';f.name=q.id;f.value=String(idx);
   f.addEventListener('change',()=>{if(q.type==='choice')set.clear();if(f.checked)set.add(idx);else set.delete(idx);update()});
   fields.append(add(h('label','answer-choice'),f,h('span','letter',String.fromCharCode(65+i)),h('span','',q.choices[idx])));
  });
  area.append(fields);
  valid=()=>set.size>0;correct=()=>same([...set].sort(),[...q.correct].sort());
 }
 function grade(){
  if(attempt?.phase!=='answer'||!valid()||pane!==attempt.pane)return;
  if(correct())complete(index,q,pane,false);
  else wrong(index,q,pane,stage);
 }
}
function drawPractice(q,pane,finish){
 const intro=h('p','muted','Thực hiện trên giấy hoặc trong công cụ phù hợp. Sau đó tự đối chiếu từng tiêu chí. Phần này không được máy chấm.');
 const entry=h('textarea');entry.rows=3;entry.placeholder='Có thể ghi nháp tại đây. Bản nháp sẽ không được lưu.';
 const holder=h('div','practice-rubric');holder.hidden=true;
 const checks=[];
 const submit=b('Ghi nhận đã tự đối chiếu',()=>{if(checks.every(x=>x.checked))finish()},'btn primary');submit.disabled=true;
 q.rubric.forEach(line=>{const e=h('input');e.type='checkbox';e.addEventListener('change',()=>submit.disabled=!checks.every(x=>x.checked));checks.push(e);
  holder.append(add(h('label','rubric-item'),e,h('span','',line)))});
 holder.append(submit);
 const show=b('Mở tiêu chí tự kiểm tra',()=>{holder.hidden=false;show.hidden=true;focus(checks[0])});
 add(pane,intro,field('Ghi nháp nếu cần',entry),show,holder);
}
function disable(pane){pane.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=true)}
function complete(index,q,pane,self){
 if(attempt?.phase!=='answer'||index!==progress.count)return;
 attempt.phase='complete';disable(pane);
 progress.count++;
 if(!self)progress.xp+=progress.tries[index]?10:20;
 if(progress.count%5===0)progress.xp+=30;
 save(lesson.n);
 const end=progress.count%5===0;
 const result=add(h('div','result-card success'),h('strong','',self?'✓ Đã ghi nhận tự đối chiếu':'✓ Chính xác!'),h('p','',self?'Em đã tự kiểm tra bài theo tiêu chí.':q.why));
 result.setAttribute('role','status');
 if(end)result.append(h('p','medal','◇ Huy chương chặng '+(Math.floor(index/5)+1)+' · '+mission.stages[Math.floor(index/5)]));
 const next=b(progress.count===TOTAL?'Xem tổng kết':end?'Về bản đồ chặng':'Sang câu tiếp theo',()=>end?(progress.count===TOTAL?summary():lessonPage()):play(progress.count),'btn primary');
 add(pane,result,next);focus(next);
}
function wrong(index,q,pane,stage){
 attempt.phase='retry';disable(pane);
 progress.tries[index]=(progress.tries[index]||0)+1;save(lesson.n);
 const read=add(h('div','result-card warning'),h('h3','','Đọc lại rồi thử lần nữa'),h('p','',hint(q,stage)),h('p','',stage.text),h('span','tiny','SGK · trang '+lesson.pages));
 const e=h('input');e.type='checkbox';
 const retry=b('Thử lại câu này',()=>play(index,true),'btn primary');retry.disabled=true;
 e.addEventListener('change',()=>retry.disabled=!e.checked);
 add(read,add(h('label','rubric-item'),e,h('span','','Em đã đọc lại tư liệu')),retry);pane.append(read);focus(e);
}
function solution(q){
 if(q.type==='practice')return q.rubric.join(' ');
 if(q.type==='order')return q.sequence.map(i=>q.steps[i]).join(' → ');
 if(q.type==='match')return q.items.map((t,i)=>t+' → '+q.groups[q.assign[i]]).join(' · ');
 return q.correct.map(i=>q.choices[i]).join(' · ');
}
function review(i){
 cancel();attempt=null;
 const s=lesson.stages[i],solved=Math.max(0,Math.min(5,progress.count-5*i));
 const [head,title]=basePanel('BÀI '+number(lesson.n)+' · ÔN TẬP',mission.stages[i],solved+'/5 câu đã hoàn thành.');
 const box=h('div','review-stack');box.append(drawStudy(s,i));
 s.tasks.slice(0,solved).forEach(q=>{
  const item=add(h('details','review-item'),h('summary','',q.id+' · '+q.prompt));
  if(q.table)item.append(checkTable(q.table));
  add(item,h('p','',solution(q)),q.why?h('p','muted',q.why):null);box.append(item);
 });
 if(!solved)box.append(h('p','muted','Lời giải sẽ xuất hiện ở đây sau khi em vượt qua từng câu.'));
 main.replaceChildren(head,box);focusViewStart(title);
}
function extra(){
 cancel();attempt=null;
 const q=lesson.extras[0];
 const [head,title]=basePanel('BÀI '+number(lesson.n)+' · THỰC HÀNH BỔ SUNG','Làm thử ngoài mô phỏng','Tự đối chiếu với tiêu chí khi hoàn thành.');
 const box=add(h('section','question-card'),h('h2','',q.prompt));
 drawPractice(q,box,()=>{
  if(!progress.extras.includes(q.id)){progress.extras.push(q.id);save(lesson.n)}
  disable(box);const result=h('p','result-card success','✓ Đã ghi nhận tự đối chiếu.');box.append(result);focus(result);
 });
 main.replaceChildren(head,box);focusViewStart(title);
}
function summary(){
 cancel();attempt=null;
 const [head,title]=basePanel('BÀI '+number(lesson.n)+' · TỔNG KẾT','Hoàn thành '+mission.title,'Em đã vượt qua đủ 5 chặng.');
 const box=add(h('section','side-card summary-box'),stats(mission),h('p','muted',progress.lab.length+'/2 nhiệm vụ mô phỏng đã đạt.'),b('Mở khu mô phỏng',()=>lab(),'btn primary'),courseLink('Chọn bài khác →','btn subtle'));
 const weak=weakStage();if(weak!==null)box.append(b('Ôn lại '+mission.stages[weak],()=>review(weak)));
 main.replaceChildren(head,box);focusViewStart(title);
}
document.querySelector?.('.skip')?.addEventListener('click',e=>{e.preventDefault();main.scrollIntoView({block:'start'});focus(main)});
window.addEventListener('hashchange',route);
route();

</script>

"Ưu tiên thông báo hiện hành trên kênh chính thức. Khi chia sẻ, gửi kèm đường dẫn để người khác tự kiểm tra.","Thực hành đi từ trang chủ tới thông báo, đọc chi tiết rồi lưu dấu trang. Kiểm tra đã lưu đúng trang thay vì chỉ lưu trang chủ."],"example":"Có bản ngày 2/11 cho lớp 6A và bản ngày 5/11 cập nhật giờ của lớp 6A. Nếu cả hai cùng nói về chuyến đi đó, dùng bản ngày 5/11."},"tasks":[{"id":"B06-C21","prompt":"Ảnh trong nhóm chat ghi giờ tập trung là 7 giờ. Website trường ghi 7 giờ 30 và có liên kết “Cập nhật lịch tham quan”. Em nên làm những việc nào?","type":"multi","choices":["Mở liên kết cập nhật.","Báo ngay 7 giờ theo ảnh trong nhóm.","Kiểm tra ngày đăng, lớp và chuyến đi của thông báo.","Hỏi giáo viên phụ trách nếu hai nguồn vẫn mâu thuẫn."],"correct":[0,2,3],"why":"Hãy kiểm tra bản cập nhật và hỏi giáo viên nếu vẫn còn mâu thuẫn."},{"id":"B06-C22","prompt":"Em cần giờ tập trung của lớp 6A cho chuyến tham quan ngày 12/11. Website trường có bốn thông báo sau. Chọn thông báo phù hợp nhất.","type":"choice","choices":["Thông báo B","Thông báo A","Thông báo C","Thông báo D"],"correct":[0],"why":"B là thông báo mới nhất dành cho đúng lớp và đúng chuyến đi.","table":[["Thông báo","Ngày đăng","Chuyến tham quan","Lớp","Giờ tập trung"],["A","02/11","12/11","6A","7 giờ"],["B","05/11","12/11","6A","7 giờ 30"],["C","06/11","12/11","6B","8 giờ"],["D","07/11","19/11","6A","8 giờ 30"]]},{"id":"B06-C23","prompt":"Xếp các dấu hiệu vào nhóm Thông tin để đối chiếu hoặc Chỉ phản ánh mức độ lan truyền. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["1 – 2 – 1 – 1","2 – 2 – 1 – 2","1 – 1 – 1 – 2","1 – 2 – 1 – 2"],"correct":[3],"why":"Ngày cập nhật, tên lớp và ngày tham quan giúp xác minh nội dung.","grouping":true,"items":["Ngày cập nhật hiển thị trên thông báo của trường.","Ảnh chụp có nhiều lượt thích.","Tên lớp và ngày tham quan ghi trong thông báo.","Ảnh được gửi lại nhiều lần trong nhóm."],"groups":["Thông tin để đối chiếu","Chỉ phản ánh mức độ lan truyền"],"assign":[0,1,0,1]},{"id":"B06-C24","prompt":"Em mới có địa chỉ Trang chủ. Hãy xếp các bước để tìm và gửi giờ tập trung có căn cứ cho nhóm.","type":"order","choices":["4 → 3 → 2 → 1","2 → 4 → 1 → 3","2 → 3 → 1 → 4","4 → 2 → 1 → 3"],"correct":[0],"why":"Truy cập Trang chủ, tìm bản cập nhật rồi đối chiếu trước khi gửi.","steps":["Đối chiếu ngày đăng, lớp và chuyến đi rồi gửi giờ cùng liên kết.","Mở liên kết cập nhật lịch tham quan.","Mở mục Tin tức.","Truy cập Trang chủ bằng trình duyệt."],"sequence":[3,2,1,0]},{"id":"B06-C25","prompt":"Trang chủ nhà trường có hai thông báo cùng tên “Ngày hội đọc”. Em định chia sẻ giờ dành cho lớp 6A. Cần kiểm tra gì trên thông báo trước khi gửi?","type":"multi","choices":["Thông báo áp dụng cho khối hoặc lớp nào","Thông báo có thuộc đợt tổ chức hiện tại không","Tên thông báo có được viết bằng chữ lớn không","Có lịch cập nhật mới hơn cho cùng sự kiện không"],"correct":[0,1,3],"why":"Tiêu đề giống nhau chưa đủ để xác định đúng lịch. Cần đối chiếu đối tượng, đợt tổ chức và bản cập nhật."}]}],"extras":[{"id":"B06-TH01","prompt":"Dùng trình duyệt mở website trường do giáo viên cung cấp. Từ trang chủ, theo liên kết đến một thông báo của đúng khối lớp. Ghi đường đi, tiêu đề và ngày cập nhật, lưu dấu trang rồi mở lại.","type":"practice","rubric":["Mở đúng trang và ghi đúng đường đi.","Ghi tiêu đề, ngày hoặc ghi rõ không thấy ngày.","Lưu dấu trang và mở lại đúng thông báo."]}]},"14":{"n":14,"title":"Thực hành tổng hợp: Hoàn thiện sổ lưu niệm","pages":"61–62","stages":[{"goal":"Nhận ra các phần của một sổ lưu niệm.","study":{"points":["Sổ lưu niệm có thể gồm bìa, bài viết, ảnh và bảng thành viên. Chỉ dùng ảnh đã được phép sử dụng.","Bìa giới thiệu tên sổ và lớp. Bài viết lưu kỉ niệm. Bảng giúp tìm họ tên, tổ hoặc thông tin cần thiết.","Tìm kiếm giúp phát hiện lỗi lặp lại. Xem trước khi in giúp kiểm tra bố cục của toàn bộ sổ."],"example":"Một sổ lớp có bìa “Kỉ niệm 6A”, bài viết về hội khỏe và bảng thành viên theo tổ."},"tasks":[{"id":"T6-B14-C01","prompt":"Trang nào giới thiệu cuốn sổ và lớp?","type":"choice","choices":["Tên thư mục tải xuống","Trang bìa","Bản xem trước không có nội dung","Ô ghi chú cuối bảng"],"correct":[1],"why":"Bìa nhận diện sản phẩm."},{"id":"T6-B14-C02","prompt":"Thành phần nào phù hợp để lưu kỉ niệm hoạt động?","type":"choice","choices":["Mật khẩu nhóm","Bài viết ngắn kèm ảnh được phép dùng","Chỉ biểu tượng phần mềm","Tệp tạm trống"],"correct":[1],"why":"Bài và ảnh ghi lại hoạt động."},{"id":"T6-B14-C03","prompt":"Những nội dung nào phù hợp để ghi trên bìa sổ lưu niệm lớp?","type":"multi","choices":["Tên cuốn sổ","Tên lớp hoặc năm học","Toàn bộ bảng thành viên chi tiết","Tất cả bài viết và ảnh của từng hoạt động"],"correct":[0,1],"why":"Bìa giúp nhận ra cuốn sổ và lớp hoặc năm học. Nội dung chi tiết thuộc các trang bên trong."},{"id":"T6-B14-C04","prompt":"Lệnh nào giúp tìm một lỗi chính tả xuất hiện nhiều lần?","type":"choice","choices":["Chèn bìa","Đổi màu nền","Chọn hướng trang","Tìm kiếm"],"correct":[3],"why":"Tìm kiếm định vị các chỗ cần kiểm tra."},{"id":"T6-B14-C05","prompt":"Nên dùng gì để kiểm tra tệp sẽ lên trang thế nào?","type":"choice","choices":["Xem danh sách phông chữ","Xem trước khi in","Xem giờ hệ thống","Chỉ xem tên tệp"],"correct":[1],"why":"Bản xem trước cho biết bố cục trang."}]},{"goal":"Chọn công cụ phù hợp từng phần.","study":{"points":["Chọn dạng trình bày theo nội dung: bài viết thành đoạn, danh sách thành bảng, ảnh đặt gần bài liên quan.","Dùng kiểu tiêu đề nhất quán cho các phần cùng cấp. Kiểm tra tên lớp trên bìa và trong lời giới thiệu.","Tạo tệp tổng hợp riêng để giữ các bản nguồn. Thống nhất tên tệp để nhóm nhận ra bản đang dùng."],"example":"Đặt ảnh kéo co cạnh bài viết “Hội khỏe” và thêm chú thích ngắn, thay vì để ảnh ở phần không liên quan."},"tasks":[{"id":"T6-B14-C06","prompt":"Bài viết và danh sách thành viên có cấu trúc nào phù hợp?","type":"choice","choices":["Bài viết theo đoạn; danh sách theo bảng","Bài viết chỉ trong tên tệp; danh sách trong lề","Đưa mọi nội dung vào bìa","Cả hai chỉ là ảnh chụp"],"correct":[0],"why":"Dạng trình bày theo loại nội dung."},{"id":"T6-B14-C07","prompt":"Đưa mỗi nội dung về đúng phần của sổ lưu niệm.","type":"match","grouping":true,"items":["Tên cuốn “Dấu ấn lớp 6A”","Đoạn kể chuyến tham quan","Hàng thông tin “Minh – Tổ 2”","Ảnh và chú thích buổi trồng cây"],"groups":["Bìa","Mục Kỉ niệm","Bảng thành viên"],"assign":[0,1,2,1],"why":"Bìa nêu tên sổ, mục Kỉ niệm lưu bài và ảnh hoạt động, bảng thành viên chứa từng hàng dữ liệu."},{"id":"T6-B14-C08","prompt":"Muốn giữ tệp từng bạn và có bản chung để sửa, chọn gì?","type":"choice","choices":["Chỉ gửi thư mục trống","Tạo tệp tổng hợp riêng","Xóa tệp con trước khi tập hợp","Lưu đè lên mọi tệp con"],"correct":[1],"why":"Bản riêng bảo toàn nội dung nguồn."},{"id":"T6-B14-C09","prompt":"Ảnh minh họa kéo co nên đặt ở đâu?","type":"choice","choices":["Chỉ làm nền cho bảng","Gần bài viết về Hội khỏe","Ở mục lời chúc không liên quan","Giữa hai ô tên và tổ"],"correct":[1],"why":"Đặt gần nội dung giúp hiểu ảnh."},{"id":"T6-B14-C10","prompt":"Nhóm tạo một bản tổng hợp từ tệp của nhiều bạn. Những việc nào giúp sản phẩm thống nhất và còn đối chiếu được nguồn?","type":"multi","choices":["Giữ các bản riêng của từng bạn","Dùng cùng một kiểu cho các tiêu đề cùng cấp trong bản chung","Để mỗi phần ghi tên lớp khác nhau theo bản gốc","Dùng bản tổng hợp để ghi đè lên tệp riêng của từng bạn"],"correct":[0,1],"why":"Giữ bản riêng để đối chiếu. Thống nhất kiểu tiêu đề giúp người đọc nhận ra cấu trúc của bản chung."}]},{"goal":"Tập hợp và trình bày các thành phần.","study":{"points":["Tập hợp tài liệu, sắp xếp thứ tự, tạo bìa rồi rà soát. Chèn từng bài vào đúng mục của bản tổng hợp.","Giữ bản riêng của từng bạn. Sửa trên bản tổng hợp, không ghi đè tệp nguồn nếu còn cần đối chiếu.","Sau khi ghép, mở từ bìa tới trang cuối và xem trước để chắc ảnh, bảng và chữ đều còn đủ."],"example":"Ghép hai đoạn kể về hoạt động lớp vào cùng mục. Đặt hai tiêu đề theo một kiểu rồi lưu bản tổng hợp."},"tasks":[{"id":"T6-B14-C11","prompt":"Nhóm có bài viết, ảnh và danh sách. Thứ tự làm nào hợp lý?","type":"choice","choices":["Tập hợp, bố trí, tạo bìa, rà soát","Tạo bìa rồi xóa tài liệu nguồn","Đổi tên tệp, bỏ qua kiểm tra","In trước, ghép tệp sau"],"correct":[0],"why":"Tập hợp trước khi kiểm tra sản phẩm."},{"id":"T6-B14-C12","prompt":"Xếp các bước để ghép hai bài viết đã chọn vào sổ lưu niệm và kiểm tra bố cục sau khi ghép.","type":"order","steps":["Xem trước các trang sau khi ghép","Mở bản tổng hợp của nhóm","Chèn hai bài và định dạng tiêu đề cùng cấp theo cùng kiểu"],"sequence":[1,2,0],"why":"Cần mở đúng bản chung để chèn bài. Sau khi ghép và định dạng, xem trước để kiểm tra."},{"id":"T6-B14-C13","prompt":"Sau khi thêm bìa, làm gì để chắc nội dung cũ còn đủ?","type":"choice","choices":["Chỉ đếm số ảnh gốc","Chỉ nhìn dòng tiêu đề","Xem từ trang bìa tới các phần sau và kiểm tra bản xem trước","Xóa trang sau bìa"],"correct":[2],"why":"Cần kiểm tra bìa và các trang nội dung."},{"id":"T6-B14-C14","prompt":"Tạo bản sổ hai trang: bìa ghi tên sổ và lớp giả định, trang sau có một bài ngắn và bảng hai bạn giả định.","type":"practice","rubric":["Bìa đúng.","Bài và bảng đúng trang.","Lưu tệp mở lại được."]},{"id":"T6-B14-C15","prompt":"Ghép hai đoạn kỉ niệm vào mục “Hoạt động”, đặt mỗi đoạn một tiêu đề cùng kiểu và lưu bản tổng hợp mới.","type":"practice","rubric":["Đủ hai đoạn đúng mục.","Tiêu đề cùng kiểu.","Có bản mới."]}]},{"goal":"Rà soát lỗi khi hợp nhất.","study":{"points":["Nếu bìa sai tên lớp, so với nội dung đã xác nhận và rà mọi nơi có tên lớp.","Khi ảnh che chữ, chỉnh kích thước hoặc cách bố trí ảnh rồi xem trước. Thêm chú thích nếu người xem chưa biết ảnh nói về việc gì.","Hai bạn có thể trùng tên. Kiểm tra thêm tổ hoặc dữ liệu nguồn trước khi xóa một dòng."],"example":"Bản ghép thiếu bảng thành viên. So với bản nguồn, chèn lại bảng đúng mục rồi mở xem trước lần nữa."},"tasks":[{"id":"T6-B14-C16","prompt":"Bìa ghi 6B, mọi nội dung được xác nhận thuộc 6A. Sửa gì?","type":"choice","choices":["Sửa tên lớp trên bìa và rà các vị trí ghi tên lớp","Bỏ trang bìa","Đổi tất cả nội dung thành 6B không kiểm tra","Đổi chỉ tên thư mục"],"correct":[0],"why":"Sửa vị trí sai và kiểm tra nhất quán."},{"id":"T6-B14-C17","prompt":"Bản xem trước cho thấy ảnh đè lên đoạn kể chuyện. Những cách chỉnh nào có thể giữ được cả ảnh và đoạn văn?","type":"multi","choices":["Đặt ảnh cùng dòng với văn bản để ảnh chiếm chỗ riêng","Chuyển ảnh sang một đoạn riêng và xem trước lại","Đặt ảnh nổi phía trước đúng vị trí đang che chữ","Xóa đoạn kể chuyện để chừa chỗ cho ảnh"],"correct":[0,1],"why":"Cách đặt ảnh phù hợp hoặc tách ảnh sang đoạn riêng giúp ảnh và chữ đều hiển thị. Xem trước để xác nhận."},{"id":"T6-B14-C18","prompt":"Trong danh sách, hai hàng trùng tên nhưng thuộc hai tổ. Làm gì trước khi xóa?","type":"choice","choices":["Gộp hai tổ thành một","Giữ hàng cuối vì xuất hiện sau","Đối chiếu nguồn để biết là trùng người hay trùng tên","Xóa cả hai"],"correct":[2],"why":"Tên giống chưa đủ để xác định trùng bản ghi."},{"id":"T6-B14-C19","prompt":"Rà một bản có tiêu đề lúc căn trái lúc căn giữa ở cùng cấp và hai ảnh thiếu chú thích. Nêu và thực hiện hai chỉnh sửa.","type":"practice","rubric":["Thống nhất kiểu tiêu đề.","Thêm chú thích đúng cho cả hai ảnh."]},{"id":"T6-B14-C20","prompt":"Trang bìa đúng nhưng sau ghép tệp, bản xem trước bị thiếu bảng thành viên. Mô tả cách dò và khôi phục.","type":"practice","rubric":["So bản gốc với bản ghép, tìm vị trí thiếu.","Chèn lại bảng đúng mục và kiểm tra bản xem trước."]}]},{"goal":"Hoàn thiện và bàn giao sản phẩm.","study":{"points":["Trước khi gửi, kiểm tra có đủ bìa, các mục, ảnh được phép và bảng. Mở thử tệp bàn giao.","Lưu tệp soạn thảo để còn sửa. Xuất thêm bản đọc nếu người nhận chỉ cần xem hoặc in.","Chỉ chia sẻ thông tin cần cho mục đích của sổ. Xóa số liên lạc hoặc chi tiết riêng tư không cần thiết."],"example":"Bản gửi lớp có tên và tổ nhưng không cần số điện thoại. Giữ bản chỉnh sửa riêng và xuất bản đọc đã rà."},"tasks":[{"id":"T6-B14-C21","prompt":"Bản nào đủ điều kiện để nhóm gửi cô xem thử?","type":"choice","choices":["Bản chỉ có bìa","Bản sao còn ảnh chưa được phép dùng","Bản thiếu bảng nhưng đã đổi tên","Bản đủ bìa, mục, bảng; đã mở lại và xem trước"],"correct":[3],"why":"Cần đủ nội dung, kiểm tra được và dùng ảnh phù hợp."},{"id":"T6-B14-C22","prompt":"Cô cần một bản dễ đọc, nhóm cần một bản còn sửa được và sổ sắp gửi đang chứa số điện thoại không cần thiết. Chọn các việc phù hợp.","type":"multi","choices":["Giữ một tệp văn bản có thể chỉnh sửa","Xuất PDF đã rà soát để cô xem","Loại bỏ số điện thoại không cần thiết khỏi bản gửi","Chỉ gửi tệp nén chứa mọi bản nháp của nhóm"],"correct":[0,1,2],"why":"Tệp chỉnh sửa phục vụ làm tiếp, PDF phục vụ đọc. Loại thông tin riêng tư không cần dùng trước khi gửi."},{"id":"T6-B14-C23","prompt":"Tệp chuẩn bị gửi chứa số liên lạc thật không cần thiết. Nên làm gì?","type":"choice","choices":["Gửi hết vì đây là sổ lớp","Đăng công khai cho dễ tải","Bỏ số khỏi bản gửi, kiểm tra lại rồi mới chia sẻ","Che ở bản in nhưng giữ trong bản gửi"],"correct":[2],"why":"Chỉ chia sẻ dữ liệu cần cho mục đích."},{"id":"T6-B14-C24","prompt":"Hoàn thiện sổ có bìa, hai mục bài viết, một bảng và một ảnh được phép dùng. Nộp tệp sửa được và ghi ba điều đã rà.","type":"practice","rubric":["Đủ thành phần.","Trình bày nhất quán, ảnh phù hợp.","Tệp mở được và ghi ba kiểm tra cụ thể."]},{"id":"T6-B14-C25","prompt":"Cô cần bản dễ xem, nhóm cần bản sửa tiếp, bản nguồn có một trường riêng tư. Tạo hai bản bàn giao và ghi cách kiểm tra trước khi gửi.","type":"practice","rubric":["Có bản xem và bản sửa đúng.","Trường riêng tư được bỏ khỏi bản gửi.","Mở và đối chiếu bìa, nội dung, bảng hoặc bố cục."]}]}],"extras":[]},"13":{"n":13,"title":"Thực hành: Tìm kiếm và thay thế","pages":"58–60","stages":[{"goal":"Nhận ra lệnh tìm và thay thế.","study":{"points":["Tìm kiếm đánh dấu chỗ văn bản khớp mẫu mà không sửa. Thay thế từng chỗ chỉ sửa kết quả đã chọn.","Ô “Tìm” chứa chữ đang có. Ô “Thay bằng” chứa chữ mới. “Thay thế tất cả” sửa mọi kết quả khớp trong phạm vi đang tìm.","Hãy xem một số kết quả trước khi chọn thay hàng loạt. Từ quá ngắn dễ khớp cả một phần của từ khác."],"example":"Muốn biết từ “thư viện” xuất hiện ở đâu mà không sửa văn bản, dùng Tìm kiếm."},"tasks":[{"id":"T6-B13-C01","prompt":"Muốn biết từ “sách” xuất hiện ở đâu mà chưa sửa, dùng lệnh nào?","type":"choice","choices":["Tìm kiếm","Thay thế tất cả","Chèn bảng","In"],"correct":[0],"why":"Tìm kiếm chỉ định vị."},{"id":"T6-B13-C02","prompt":"Lệnh nào sửa một kết quả đang được chọn?","type":"choice","choices":["Căn giữa","Thay thế từng chỗ","Tìm tiếp","In trang"],"correct":[1],"why":"Thay thế tác động đến kết quả hiện tại."},{"id":"T6-B13-C03","prompt":"Trong hộp thoại Thay thế, muốn sửa cụm “thư viẹn” thành “thư viện”. Những thiết lập nào đúng?","type":"multi","choices":["Nhập “thư viẹn” vào ô Tìm","Nhập “thư viện” vào ô Thay bằng","Nhập “thư viện” vào ô Tìm","Bỏ trống ô Thay bằng"],"correct":[0,1],"why":"Ô Tìm chứa cụm hiện có cần sửa. Ô Thay bằng chứa cụm đúng sẽ xuất hiện sau khi sửa."},{"id":"T6-B13-C04","prompt":"Ô “Thay bằng” nhập gì?","type":"choice","choices":["Văn bản mới","Tên tệp đang mở","Chuỗi cũ","Vị trí con trỏ"],"correct":[0],"why":"Ô này chứa nội dung dùng để thay."},{"id":"T6-B13-C05","prompt":"Lệnh nào thay mọi chỗ khớp trong phạm vi đang tìm?","type":"choice","choices":["Thay một chỗ","Tìm tiếp","Xem trước khi in","Thay thế tất cả"],"correct":[3],"why":"Lệnh áp dụng cho tất cả kết quả khớp trong phạm vi."}]},{"goal":"Lựa chọn phạm vi thay.","study":{"points":["Khi chỉ sửa lời kể và giữ nguyên trích dẫn, duyệt từng kết quả. Chỉ bấm thay tại chỗ được phép sửa.","Nếu mọi kết quả khớp đều cần sửa, có thể thay tất cả sau khi kiểm tra mẫu tìm đủ cụ thể.","Khi dùng kiểu tìm chuỗi con, mẫu “an” có thể khớp một phần của “ban”. Nên lưu bản sao nếu sửa nhiều chỗ."],"example":"Tìm cụm “lớp 6A” rõ hơn tìm riêng “6A” nếu em cần giữ một mã có chứa “6A”."},"tasks":[{"id":"T6-B13-C06","prompt":"Cần xem các chỗ có “Hà” nhưng giữ nguyên văn bản. Chọn gì?","type":"choice","choices":["Thay tất cả bằng “Hoa”","Xóa các kết quả","Gõ đè từng đoạn","Tìm và duyệt kết quả"],"correct":[3],"why":"Chỉ tìm đáp ứng yêu cầu đọc."},{"id":"T6-B13-C07","prompt":"Ghép nhu cầu với lệnh phù hợp.","type":"match","grouping":false,"items":["Xem vị trí cụm từ, giữ nguyên văn bản","Chỉ đổi hạn nộp ở đoạn dành cho Tổ 2","Sửa mọi chỗ đã xác nhận đều mắc cùng một lỗi"],"groups":["Tìm kiếm","Thay thế từng kết quả","Thay thế tất cả"],"assign":[0,1,2],"why":"Tìm kiếm chỉ xác định vị trí. Thay từng chỗ bảo vệ phần cần giữ, còn thay tất cả phù hợp khi mọi chỗ khớp đều cần sửa."},{"id":"T6-B13-C08","prompt":"Mọi chỗ có mẫu đặc trưng “LỚP-CŨ” đều cần sửa. Lệnh nào tiết kiệm thời gian sau khi kiểm tra?","type":"choice","choices":["Tìm nhưng không sửa","Thay thế tất cả","In từng trang","Chọn toàn bộ rồi gõ đè"],"correct":[1],"why":"Mẫu đã xác minh đủ cụ thể."},{"id":"T6-B13-C09","prompt":"Vì sao tìm “an” có thể thấy cả “ban”? Giả sử tìm chuỗi con.","type":"choice","choices":["Công cụ chỉ tìm chữ đầu","Vì hai từ luôn đồng nghĩa","“ban” là từ viết tắt của “an”","“an” xuất hiện liền nhau trong “ban”"],"correct":[3],"why":"Tìm chuỗi con không yêu cầu khớp cả từ."},{"id":"T6-B13-C10","prompt":"Em muốn giữ một bản gốc có thể mở lại sau khi đã lưu và đóng bản sửa. Chọn các thao tác giúp đạt mục tiêu.","type":"multi","choices":["Lưu một bản sao với tên khác trước khi sửa","Chỉnh và lưu thay đổi trong bản sao","Chỉnh trực tiếp và lưu đè lên bản duy nhất","Đổi tên bản gốc thành tên mới rồi chỉnh ngay tệp đó, không tạo bản sao"],"correct":[0,1],"why":"Tạo bản sao rồi chỉnh ở đó giúp giữ hai tệp độc lập, kể cả sau khi đóng phần mềm."}]},{"goal":"Thực hiện tìm và sửa có kiểm tra.","study":{"points":["Nhập cụm cũ vào “Tìm” và cụm mới vào “Thay bằng”. Duyệt đến kết quả cần sửa, rồi chọn thay một hoặc tất cả theo yêu cầu.","Nếu chỉ sửa lần đầu, dừng sau lần thay đó. Kiểm tra lại các chỗ cần giữ.","Sau thay hàng loạt, tìm lại mẫu cũ để phát hiện chỗ còn sót và đọc vài câu xung quanh cụm mới."],"example":"Muốn sửa “thư viẹn” thành “thư viện”, tìm đúng cụm sai trước, rồi thay bằng cụm đã sửa."},"tasks":[{"id":"T6-B13-C11","prompt":"Sửa “thư viẹn” thành “thư viện” ở mọi chỗ đã kiểm tra. Điền hai ô thế nào?","type":"choice","choices":["Tìm “thư viẹn”, thay bằng “thư viện”","Cả hai ô nhập “thư viện”","Ô Tìm để trống","Tìm “thư viện”, thay bằng “thư viẹn”"],"correct":[0],"why":"Tìm lỗi hiện có, thay bằng dạng đúng."},{"id":"T6-B13-C12","prompt":"Cụm “Tổ 2” xuất hiện nhiều lần. Chỉ một chỗ nói về nhóm trực nhật cần đổi thành “Tổ 3”. Xếp thao tác để sửa đúng chỗ.","type":"order","steps":["Thay kết quả đang được chọn rồi kiểm tra lại đoạn","Nhập cụm cần tìm và cụm thay thế","Duyệt kết quả để chọn lần xuất hiện nói về nhóm trực nhật"],"sequence":[1,2,0],"why":"Điền hai cụm, tìm đúng ngữ cảnh và dùng lệnh thay một kết quả thay vì thay cả văn bản."},{"id":"T6-B13-C13","prompt":"Đã thay hết “HỌC-KÌ-I” thành “HỌC-KÌ-II”. Kiểm tra trực tiếp gì?","type":"choice","choices":["Tìm lại mẫu cũ và đối chiếu vị trí mẫu mới","Chỉ nhìn màu cửa sổ","Chỉ đổi tên tệp","Chỉ đếm trang"],"correct":[0],"why":"Kiểm tra cả sót mẫu cũ lẫn kết quả mới."},{"id":"T6-B13-C14","prompt":"Gõ “Tổ 1 nộp thứ Sáu. Tổ 2 nộp thứ Sáu.” Đổi riêng hạn tổ 2 sang thứ Hai bằng lệnh thay thế.","type":"practice","rubric":["Dùng tìm/thay có chọn lọc.","Tổ 1 giữ thứ Sáu, tổ 2 là thứ Hai."]},{"id":"T6-B13-C15","prompt":"Trong một văn bản có ba lần viết “mượn sach”, dùng lệnh tìm và thay bằng “mượn sách”, rồi ghi số kết quả cũ còn lại.","type":"practice","rubric":["Sửa đủ ba chỗ.","Tìm lại mẫu cũ cho 0 kết quả."]}]},{"goal":"Phát hiện tác dụng ngoài ý muốn.","study":{"points":["Nếu thay nhầm chữ trong tên hoặc mã, hoàn tác ngay khi có thể. Sau đó dùng mẫu dài hơn hoặc thay từng chỗ.","Đọc lại cả ô Tìm và ô Thay bằng. Đảo hai ô có thể sửa chữ đúng thành chữ sai.","Thử trên một kết quả trước nếu chưa chắc phạm vi. Đối chiếu các chỗ phải sửa và các chỗ phải giữ."],"example":"Thay “Lan” bằng “Mai” có thể làm “Lan Anh” thành “Mai Anh” khi tìm chuỗi con. Hãy kiểm tra cách tìm hoặc chọn từng kết quả."},"tasks":[{"id":"T6-B13-C16","prompt":"Đổi “Lan” thành “Mai” khiến “Lan Anh” thành “Mai Anh”, trong khi đó là người khác. Vì sao?","type":"choice","choices":["Vì định dạng đoạn thay tên","Lệnh in chọn sai trang","Vì Mai Anh và Lan Anh cùng một người","Mẫu khớp cả một phần của tên dài hơn"],"correct":[3],"why":"Cần xét tên trong ngữ cảnh."},{"id":"T6-B13-C17","prompt":"Em vừa dùng Thay thế tất cả để đổi “Lan” thành “Mai”, nhưng tên “Lan Anh” cũng bị sửa nhầm. Chọn các việc phù hợp để khắc phục.","type":"multi","choices":["Hoàn tác lượt thay vừa làm","Duyệt từng kết quả và chỉ thay những chỗ thật sự nói về Lan","Dùng Thay thế tất cả từ “Mai” về “Lan” kể cả ở những chỗ đã có tên Mai từ trước","Xóa mọi dòng chứa tên Lan Anh"],"correct":[0,1],"why":"Hoàn tác khôi phục cả những chỗ bị đổi nhầm. Duyệt từng kết quả giúp giữ tên người khác."},{"id":"T6-B13-C18","prompt":"Muốn đổi “lớp 6A” thành “lớp 6B” mà giữ mã “B6A”. Tìm gì an toàn hơn?","type":"choice","choices":["Chỉ “6”","Chỉ “A”","Cụm đầy đủ “lớp 6A”","Chỉ “6A”"],"correct":[2],"why":"Cụm cụ thể tránh khớp mã không liên quan."},{"id":"T6-B13-C19","prompt":"Nếu tìm chuỗi con và thay “sach” bằng “sách” trong cả “mượn sach” và mã “sach01”, lỗi gì xảy ra? Nêu cách tránh.","type":"practice","rubric":["Mã thành “sách01”.","Tìm cụm cụ thể hoặc thay từng chỗ, giữ nguyên mã."]},{"id":"T6-B13-C20","prompt":"Bạn vô tình điền từ mới vào ô Tìm và từ sai vào ô Thay bằng. Nêu hệ quả có thể xảy ra và trình tự sửa.","type":"practice","rubric":["Dạng đúng có thể bị đổi thành dạng sai.","Hoàn tác, đảo lại hai ô và kiểm tra kết quả trước khi thay."]}]},{"goal":"Thiết kế cách sửa nhiều lỗi cùng lúc.","study":{"points":["Tách công việc thành hai lượt: sửa lỗi lặp lại và chỉnh riêng một chỗ có ngữ cảnh đặc biệt.","Lưu bản mới để giữ bản gốc. Kiểm tra các mã, tên và ngày phải giữ trước khi bàn giao.","Nếu còn lỗi khác, đặt mẫu tìm riêng cho lỗi đó. Không kéo dài phạm vi thay chỉ để tiết kiệm thao tác."],"example":"Trong bản tin có nhiều chữ “thông bao” và một tiêu đề sai ngày, sửa lỗi chính tả theo lượt, rồi đổi ngày đúng một chỗ."},"tasks":[{"id":"T6-B13-C21","prompt":"Sửa mọi “thông bao” và chỉ đổi ngày trong tiêu đề. Phương án nào phù hợp?","type":"choice","choices":["Thay mẫu lỗi đã kiểm tra hàng loạt, đổi ngày đúng một chỗ rồi rà lại","Xóa đoạn chứa ngày","Đổi ngày trong mọi tệp trước khi kiểm tra","Thay hàng loạt mọi ngày"],"correct":[0],"why":"Hai yêu cầu có phạm vi khác nhau."},{"id":"T6-B13-C22","prompt":"Tệp có lỗi “mượn sach”, mã “sach01” và hai dòng ghi cùng hạn nộp. Chỉ Tổ 2 được đổi hạn. Chọn các cách sửa đúng phạm vi.","type":"multi","choices":["Tìm cụm “mượn sach” thay vì tìm riêng “sach”","Thay mọi chỗ có chuỗi “sach”, kể cả trong mã","Dùng lệnh thay một kết quả ở dòng của Tổ 2","Kiểm tra mã “sach01” còn nguyên sau khi sửa"],"correct":[0,2,3],"why":"Mẫu tìm đủ cụ thể bảo vệ mã. Sửa từng kết quả để giữ hạn của tổ còn lại và kiểm tra lại mã sau khi sửa."},{"id":"T6-B13-C23","prompt":"Phát hiện còn một lỗi khác dạng sau khi thay hết mẫu đầu. Làm gì?","type":"choice","choices":["In mà không sửa","Tìm mẫu khác, kiểm tra rồi xử lí một lượt riêng","Thay toàn bộ chữ giống một phần của lỗi","Kết luận lệnh bị hỏng"],"correct":[1],"why":"Các dạng lỗi khác nhau có mẫu khác nhau."},{"id":"T6-B13-C24","prompt":"Tạo tệp chứa “Nhóm A mượn sach thứ Ba. Nhóm B mượn sach thứ Ba. Mã: sach01.” Sửa hai cụm chính tả và đổi riêng hạn Nhóm B sang thứ Tư; lưu bản sửa.","type":"practice","rubric":["Hai cụm “mượn sách”.","Chỉ đổi hạn Nhóm B.","Mã giữ nguyên và lưu bản sửa."]},{"id":"T6-B13-C25","prompt":"Đề xuất và thực hiện hai lượt sửa trong bản tin mẫu của em: một lỗi giống nhau ở mọi chỗ và một cụm chỉ đổi ở một chỗ. Báo cách kiểm tra.","type":"practice","rubric":["Thay hàng loạt sau khi đối chiếu.","Thay chọn lọc đúng vị trí.","Có kiểm tra cả chỗ sửa và chỗ giữ."]}]}],"extras":[]},"12":{"n":12,"title":"Trình bày thông tin ở dạng bảng","pages":"53–57","stages":[{"goal":"Nhận diện hàng, cột, ô và công dụng của bảng.","study":{"points":["Bảng gồm hàng, cột và ô. Một ô nằm tại giao điểm của một hàng và một cột.","Tiêu đề cột cho biết loại dữ liệu, như Tên, Tổ hay Số sách. Mỗi hàng thường là một bản ghi.","Dùng lệnh Chèn bảng để tạo bảng. Có thể gộp các ô liền nhau thành một ô khi cần tiêu đề chung."],"example":"Trong bảng mượn sách, ô ở hàng Mai và cột Số sách ghi số sách của Mai."},"tasks":[{"id":"T6-B12-C01","prompt":"Ô trong bảng là gì?","type":"choice","choices":["Toàn bộ một hàng","Giao của một hàng và một cột","Toàn bộ một cột","Tên của cả bảng"],"correct":[1],"why":"Mỗi ô có một vị trí hàng và cột."},{"id":"T6-B12-C02","prompt":"Bảng nào thích hợp nhất để so sánh điểm theo môn của nhiều bạn?","type":"choice","choices":["Danh sách chỉ có tên bạn","Một đoạn không có tên môn","Bảng có hàng theo bạn và cột theo môn","Một ảnh lớp không có số liệu"],"correct":[2],"why":"Các cột chung giúp so sánh cùng môn."},{"id":"T6-B12-C03","prompt":"Những mục nào có thể đặt làm tiêu đề cột cho bảng theo dõi số sách từng bạn?","type":"multi","choices":["Họ và tên","Số sách đã đọc","Lan","3"],"correct":[0,1],"why":"Tiêu đề cột cho biết loại dữ liệu. “Lan” và “3” là các giá trị có thể nằm trong ô của một hàng dữ liệu."},{"id":"T6-B12-C04","prompt":"Muốn thêm một bảng vào văn bản, dùng nhóm lệnh nào?","type":"choice","choices":["In văn bản","Đổi hướng trang","Chèn bảng","Thay thế từ"],"correct":[2],"why":"Lệnh chèn bảng tạo các ô."},{"id":"T6-B12-C05","prompt":"Chọn nhiều ô liền nhau rồi hợp thành một ô gọi là gì?","type":"choice","choices":["Xóa hàng","Tách trang","Chèn cột","Gộp ô"],"correct":[3],"why":"Gộp ô thay nhóm ô bằng một ô chung."}]},{"goal":"Đọc cấu trúc và chọn thao tác.","study":{"points":["Đếm riêng hàng tiêu đề và hàng dữ liệu. Nếu có một tiêu đề và bốn bạn, cần năm hàng.","Thêm một người thường cần thêm hàng. Thêm một loại thông tin thường cần thêm cột.","Khi đọc, chỉ đúng hàng của đối tượng và cột của thuộc tính. Xóa cột sẽ bỏ thông tin của cột đó ở mọi hàng."],"example":"Bảng có hai cột Tên và Tổ. Muốn ghi thêm số sách cho từng bạn, thêm một cột “Số sách”."},"tasks":[{"id":"T6-B12-C06","prompt":"Bảng có ba cột: Tên, Tổ, Số sách. Mỗi bạn nằm ở đâu?","type":"choice","choices":["Một hàng dữ liệu","Ba bảng riêng","Chỉ một ô tiêu đề","Một cột mới"],"correct":[0],"why":"Mỗi hàng lưu một bản ghi."},{"id":"T6-B12-C07","prompt":"Bảng có cột “Tên”, “Tổ” và “Số sách”. Ghép mỗi yêu cầu với thao tác phù hợp.","type":"match","grouping":false,"items":["Ghi thêm bạn Chi với đủ ba thông tin","Ghi thêm lớp cho mọi bạn","Sửa số sách của Bình từ 4 thành 5"],"groups":["Chèn hàng","Chèn cột","Sửa nội dung một ô"],"assign":[0,1,2],"why":"Thêm một bạn cần thêm hàng, thêm một trường cần thêm cột. Chỉnh một giá trị chỉ cần sửa ô tương ứng."},{"id":"T6-B12-C08","prompt":"Muốn thêm trường “Ghi chú” cho mọi bạn thì thêm gì?","type":"choice","choices":["Một hàng","Một cột","Một trang trống","Một tiêu đề phụ ngoài bảng"],"correct":[1],"why":"Trường mới ứng với một cột."},{"id":"T6-B12-C09","prompt":"Bảng ghi hàng Mai, cột Số sách = 4. Đọc thế nào?","type":"choice","choices":["Bảng có 4 cột","Có 4 bạn tên Mai","Mai ở tổ 4","Mai có 4 sách theo bảng"],"correct":[3],"why":"Cần đọc đồng thời nhãn hàng và cột."},{"id":"T6-B12-C10","prompt":"Cần bỏ trường “Số điện thoại” khỏi bảng trước khi trình chiếu. Chọn các thao tác đúng.","type":"multi","choices":["Xác định cột qua hàng tiêu đề rồi đặt con trỏ vào cột cần bỏ","Xóa cột “Số điện thoại” bằng lệnh xóa cột","Xóa một hàng học sinh bất kì","Chỉ xóa chữ “Số điện thoại” và giữ các số bên dưới"],"correct":[0,1],"why":"Xóa đúng cột loại bỏ cả tên trường và các giá trị. Xóa tiêu đề riêng vẫn để lộ số điện thoại."}]},{"goal":"Tạo, nhập và chỉnh bảng.","study":{"points":["Trước khi chèn, tính số hàng và số cột cần có. Mỗi tiêu đề cột cần một ô ở hàng tiêu đề.","Nếu cần tên chung trên đầu bảng, chèn một hàng riêng rồi gộp các ô của hàng đó. Giữ nguyên các tiêu đề cột bên dưới.","Điều chỉnh độ rộng cột để tên và số liệu dễ đọc. Giữ dữ liệu đúng hàng, đúng cột."],"example":"Ba bạn, mỗi bạn có Tên, Tổ và Số sách. Cần ba cột và bốn hàng nếu có một hàng tiêu đề."},"tasks":[{"id":"T6-B12-C11","prompt":"Có ba bạn, mỗi bạn ghi tên, tổ và số sách. Tính cả tiêu đề, tạo bảng nào?","type":"choice","choices":["3 cột, 4 hàng","3 cột, 3 hàng","4 cột, 3 hàng","4 cột, 4 hàng"],"correct":[0],"why":"Ba trường, ba bản ghi, một hàng tiêu đề."},{"id":"T6-B12-C12","prompt":"Bảng đã có tiêu đề cột ở hàng đầu. Xếp thao tác để tạo một ô tên bảng nằm trên hàng tiêu đề, không sửa hàng cũ.","type":"order","steps":["Gộp các ô của hàng mới thành một ô","Nhập tên bảng vào ô vừa gộp","Chèn một hàng trống trên hàng tiêu đề"],"sequence":[2,0,1],"why":"Tạo hàng riêng trước, gộp các ô trong hàng mới rồi nhập tên vào ô đã gộp."},{"id":"T6-B12-C13","prompt":"Tên dài bị xuống nhiều dòng trong cột hẹp, cột bên cạnh còn dư. Sửa gì?","type":"choice","choices":["Đổi tên tệp","Điều chỉnh độ rộng hai cột phù hợp","Xóa bớt tên","Thêm hàng trắng cho mọi người"],"correct":[1],"why":"Điều chỉnh kích thước để giữ dữ liệu và dễ đọc."},{"id":"T6-B12-C14","prompt":"Tạo bảng ba cột Tên, Tổ, Sách với hai dòng An–1–3 và Bình–2–5. Ghi lại ô ở hàng Bình, cột Sách.","type":"practice","rubric":["Đủ bảng và dữ liệu.","Đọc đúng 5."]},{"id":"T6-B12-C15","prompt":"Thêm một hàng dữ liệu cho Chi–1–4 ở cuối bảng có tiêu đề và thêm cột Ghi chú. Lưu bản mới.","type":"practice","rubric":["Thêm hàng đúng.","Thêm cột đúng.","Lưu được tệp."]}]},{"goal":"Phân tích lỗi cấu trúc và nội dung.","study":{"points":["Nếu thiếu một bản ghi nhưng đủ loại thông tin, thêm hàng thay vì thêm cột. Xóa dữ liệu trong ô khác với xóa ô làm các giá trị bị dịch.","Nếu gộp nhầm, hoàn tác rồi chọn đúng các ô. Sau thao tác, so dữ liệu với nhãn cột để phát hiện lệch.","Khi bảng in bị cắt, kiểm tra độ rộng cột, lề và hướng trang trong bản xem trước."],"example":"Nếu hai ô ở hàng tiêu đề bị gộp nhầm, hoàn tác. Chèn hàng riêng phía trên nếu em cần một tiêu đề chung."},"tasks":[{"id":"T6-B12-C16","prompt":"Bảng thiếu bạn Chi, nhưng ba trường hiện có đã đủ. Sửa gì?","type":"choice","choices":["Gộp tên Chi vào hàng An","Thêm một cột mang tên Chi","Xóa tiêu đề","Thêm một hàng dữ liệu cho Chi"],"correct":[3],"why":"Thêm bản ghi, không thêm trường."},{"id":"T6-B12-C17","prompt":"Sau khi gộp ô, các tiêu đề “Tên”, “Tổ”, “Số sách” mất vì em chọn nhầm hàng. Lỗi vừa xảy ra. Những việc nào giúp sửa đúng?","type":"multi","choices":["Hoàn tác thao tác vừa thực hiện","Gộp luôn hàng dữ liệu đầu tiên để lấy chỗ","Kiểm tra lại ba tiêu đề đã hiện đủ trước khi tiếp tục","Xóa cột đầu để tạo lại bảng từ đầu"],"correct":[0,2],"why":"Hoàn tác khôi phục cấu trúc trước khi gộp. Kiểm tra đủ tiêu đề để tránh tiếp tục trên bảng sai."},{"id":"T6-B12-C18","prompt":"Sau khi xóa một ô, các giá trị trên hàng bị dịch và gắn nhầm tên cột. Sửa trước tiên thế nào?","type":"choice","choices":["Hoàn tác, đối chiếu nhãn cột rồi xóa nội dung ô nếu chỉ cần làm trống","Xóa hàng tiêu đề","Xóa toàn bộ cột","Điền đại số vào các ô"],"correct":[0],"why":"Xóa nội dung khác với xóa ô và dịch các ô."},{"id":"T6-B12-C19","prompt":"Bảng có hai hàng tiêu đề giống nhau và một bạn bị thiếu. Nêu cách sửa mà vẫn giữ một hàng tiêu đề.","type":"practice","rubric":["Xóa hàng tiêu đề lặp.","Thêm một hàng dữ liệu đủ các trường cho bạn thiếu."]},{"id":"T6-B12-C20","prompt":"Bảng in bị cắt cột Ghi chú ở mép phải. Nêu cách chỉnh độ rộng hoặc hướng trang và cách xác nhận sửa thành công.","type":"practice","rubric":["Chỉnh hợp lý mà giữ dữ liệu.","Xem trước xác nhận đủ cột và đọc được."]}]},{"goal":"Thiết kế bảng để tra cứu và so sánh.","study":{"points":["Thiết kế bảng theo câu hỏi em muốn trả lời. Để so theo thời gian, dùng cột riêng cho từng tuần hoặc ghi thời điểm rõ ràng.","Thêm cột trạng thái nếu cần tìm người đã nhận hoặc chưa nhận. Dùng nhãn nhất quán để dễ so sánh.","Sau khi nhập, kiểm tra vài ô bằng tên hàng và cột. Muốn biết tăng bao nhiêu, lấy giá trị sau trừ giá trị trước."],"example":"Tổ 1 có 7 sách tuần trước và 10 sách tuần này. Mức tăng là 3 sách. Hãy đặt hai số ở hai cột có nhãn rõ."},"tasks":[{"id":"T6-B12-C21","prompt":"Cần theo dõi số sách theo từng tổ trong hai tuần. Cấu trúc nào dễ so sánh?","type":"choice","choices":["Mỗi tuần chỉ ghi tên tệp","Hàng theo tổ, cột Tổ, Tuần 1, Tuần 2","Hai số đặt ngẫu nhiên cạnh tên tổ","Một ô chứa tất cả số không nhãn"],"correct":[1],"why":"Các cột theo tuần cho phép so cùng tổ."},{"id":"T6-B12-C22","prompt":"Bảng theo dõi phát sách cần giúp cô lọc nhanh những bạn chưa nhận và phân biệt hai bạn trùng tên ở hai tổ. Cần có những cột nào ngoài “Họ và tên”?","type":"multi","choices":["Tình trạng nhận sách","Tổ","Màu bìa cuốn sách","Giờ soạn bảng"],"correct":[0,1],"why":"Tình trạng nhận sách giúp lọc người chưa nhận. Cột Tổ giúp phân biệt hai bạn trùng tên trong tình huống này."},{"id":"T6-B12-C23","prompt":"Hai tổ có cùng số sách tuần 1. Muốn biết tổ nào tăng nhiều hơn, cần gì?","type":"choice","choices":["Chỉ lấy số tuần 1","Chỉ so tên tổ","Đọc đủ số của cả hai tuần rồi so mức tăng","Chỉ nhìn hàng cuối"],"correct":[2],"why":"Mức tăng là số tuần 2 trừ tuần 1."},{"id":"T6-B12-C24","prompt":"Tạo bảng cho tổ 1 có 7 và 10 sách, tổ 2 có 8 và 9 sách theo tuần 1, tuần 2. Cho biết tổ nào tăng nhiều hơn.","type":"practice","rubric":["Cột và hàng đúng.","Dữ liệu đúng.","Tổ 1 tăng 3, tổ 2 tăng 1."]},{"id":"T6-B12-C25","prompt":"Thiết kế bảng lịch trực nhật cho hai ngày, mỗi ngày hai nhiệm vụ và một người phụ trách cho mỗi nhiệm vụ. Nêu cách tìm người làm một nhiệm vụ cụ thể.","type":"practice","rubric":["Trường Ngày, Nhiệm vụ, Người phụ trách hoặc cấu trúc tương đương.","Đủ bốn nhiệm vụ và người.","Chỉ đúng cách tra theo ngày và việc."]}]}],"extras":[]},"11":{"n":11,"title":"Định dạng văn bản","pages":"48–52","stages":[{"goal":"Nhận diện chức năng soạn thảo, định dạng và in.","study":{"points":["Phần mềm soạn thảo dùng để nhập, sửa, trình bày và in văn bản. Trước khi in, mở bản xem trước.","Định dạng kí tự đổi dáng chữ. Định dạng đoạn đổi cách căn hoặc giãn dòng. Thiết lập trang đổi lề, khổ giấy và hướng trang.","Trang ngang có chiều rộng lớn hơn chiều cao. Lề là vùng trống giữa nội dung và mép giấy."],"example":"Muốn tiêu đề ở giữa hai lề, chọn đoạn tiêu đề và dùng căn giữa thay vì thêm dấu cách."},"tasks":[{"id":"T6-B11-C01","prompt":"Phần mềm soạn thảo giúp làm gì?","type":"choice","choices":["Nhập, sửa, trình bày và in văn bản","Chỉ xem video","Chỉ vẽ tự do","Đo nhiệt độ"],"correct":[0],"why":"Soạn thảo hỗ trợ toàn bộ quá trình làm văn bản."},{"id":"T6-B11-C02","prompt":"Lệnh nào đặt tiêu đề vào giữa hai lề?","type":"choice","choices":["Căn giữa đoạn","Đổi hướng trang","Chèn ngắt dòng","Đổi phông chữ"],"correct":[0],"why":"Căn giữa tác động đến vị trí đoạn."},{"id":"T6-B11-C03","prompt":"Những thao tác nào thay đổi hình thức của kí tự đã chọn?","type":"multi","choices":["Đổi cỡ chữ","Đặt hướng trang ngang","Đổi màu chữ","Đặt lề dưới của trang"],"correct":[0,2],"why":"Cỡ và màu chữ thuộc định dạng kí tự. Hướng và lề thuộc định dạng trang."},{"id":"T6-B11-C04","prompt":"Vùng trống quanh nội dung trang gọi là gì?","type":"choice","choices":["Đầu đề","Giãn dòng","Lề trang","Khoảng cách kí tự"],"correct":[2],"why":"Lề nằm giữa nội dung và mép trang."},{"id":"T6-B11-C05","prompt":"Trước khi in, dùng gì để nhìn bố cục các trang?","type":"choice","choices":["Xem trước khi in","Đếm từ","Đổi tên tệp","Tìm kiếm"],"correct":[0],"why":"Bản xem trước phản ánh cách nội dung lên giấy."}]},{"goal":"Phân biệt định dạng theo phạm vi.","study":{"points":["Chữ đậm, cỡ chữ và kiểu chữ tác động lên kí tự đã chọn. Căn lề và giãn dòng tác động lên đoạn.","Thay lề hoặc hướng trang ảnh hưởng cả bố cục. Khi lề trái và phải lớn hơn, vùng chứa chữ hẹp đi.","Một yêu cầu có thể cần nhiều thao tác. Tiêu đề đậm và căn giữa cần định dạng cả kí tự lẫn đoạn."],"example":"Muốn chỉ làm đậm hai từ trong một đoạn, chọn đúng hai từ. Không cần đổi kiểu của toàn đoạn."},"tasks":[{"id":"T6-B11-C06","prompt":"Đổi riêng hai từ sang chữ đậm thuộc loại nào?","type":"choice","choices":["Thay nội dung từ","Xóa đoạn","Định dạng trang","Định dạng kí tự"],"correct":[3],"why":"Đổi kiểu chữ mà không đổi từ."},{"id":"T6-B11-C07","prompt":"Ghép mỗi thao tác với phạm vi định dạng của nó.","type":"match","grouping":false,"items":["Đặt lề phải 2 cm","In đậm cụm đã bôi đen","Căn giữa đoạn đang đặt con trỏ"],"groups":["Kí tự","Đoạn văn","Trang"],"assign":[2,0,1],"why":"Lề là thuộc tính trang. Chữ đậm tác động tới phần kí tự đã chọn. Căn giữa tác động ở mức đoạn."},{"id":"T6-B11-C08","prompt":"Đặt lề trái 2 cm thuộc loại nào?","type":"choice","choices":["Chỉnh chủ đề tệp","Thiết lập trang","Định dạng kí tự","Đổi màu đoạn"],"correct":[1],"why":"Lề trái đo từ mép giấy đến vùng nội dung."},{"id":"T6-B11-C09","prompt":"Tiêu đề cần đậm và giữa trang. Cần hai thao tác nào?","type":"choice","choices":["Đổi tên tệp và in","Đổi lề trang và đổi khổ giấy","Chèn dấu cách và thu nhỏ trang","In đậm chữ và căn giữa đoạn"],"correct":[3],"why":"Đậm và căn giữa điều khiển hai thuộc tính riêng."},{"id":"T6-B11-C10","prompt":"Một tiêu đề đang ở đoạn riêng. Cô yêu cầu chữ đậm và cả đoạn tiêu đề nằm giữa hai lề. Những thao tác nào đáp ứng yêu cầu?","type":"multi","choices":["Chọn chữ trong tiêu đề rồi bật In đậm","Căn giữa đoạn chứa tiêu đề","Chèn nhiều dấu cách ở đầu dòng để đẩy tiêu đề sang phải","Đổi cả tài liệu sang hướng ngang"],"correct":[0,1],"why":"In đậm thay đổi kiểu chữ, còn căn giữa đặt đoạn ở giữa khoảng giữa hai lề."}]},{"goal":"Thực hiện định dạng theo yêu cầu.","study":{"points":["Chọn đúng phần văn bản trước khi định dạng. Muốn đổi cả trang sang ngang, dùng thiết lập hướng trang.","Xem trước để kiểm tra có mất chữ hay phát sinh trang thừa. Nếu chỉ in trang 2, chọn phạm vi trang 2 trong hộp in.","Lưu tệp đã chỉnh và mở lại đúng bản trước khi nộp hoặc in."],"example":"Tạo tiêu đề “Ngày hội đọc”. Chọn chữ để in đậm, căn giữa đoạn tiêu đề và xem trước trang."},"tasks":[{"id":"T6-B11-C11","prompt":"Chỉ cần in đậm cụm “Ngày hội đọc”. Bước đầu là gì?","type":"choice","choices":["Mở máy in","Đổi hướng giấy","Chọn toàn văn bản","Chọn đúng cụm từ"],"correct":[3],"why":"Cần khoanh đúng phạm vi."},{"id":"T6-B11-C12","prompt":"Xếp thao tác từ lúc bản tin chưa được định dạng đến lúc quyết định có in hay không. Cần kiểm tra bản tin sau khi chỉnh tiêu đề và đặt lề.","type":"order","steps":["Quyết định in nếu bản xem trước đạt yêu cầu","Định dạng tiêu đề và đặt lề","Mở xem trước để kiểm tra bố cục"],"sequence":[1,2,0],"why":"Xem trước sau khi định dạng để phát hiện lệch lề hoặc tràn trang trước khi in."},{"id":"T6-B11-C13","prompt":"Chỉ in trang 2 của tài liệu ba trang. Chọn gì trong phần in?","type":"choice","choices":["Đặt hai bản sao","Đổi lề trang 2","In tất cả","Chỉ định phạm vi trang 2"],"correct":[3],"why":"Phạm vi in chọn trang, không phải số bản."},{"id":"T6-B11-C14","prompt":"Tạo tài liệu có tiêu đề “Góc đọc lớp 6A” và hai đoạn tự viết. Đặt tiêu đề đậm, giữa; đoạn căn trái; trang dọc.","type":"practice","rubric":["Tiêu đề đúng cả hai thuộc tính.","Đoạn căn trái.","Trang dọc, xem trước và lưu."]},{"id":"T6-B11-C15","prompt":"Trên một tệp mẫu, đặt lề trái 2 cm, phải 2 cm, sau đó kiểm tra bản xem trước và ghi số trang.","type":"practice","rubric":["Hai lề đúng.","Đã xem trước và ghi đúng số trang tệp thực tế."]}]},{"goal":"Chẩn đoán lỗi trình bày và in.","study":{"points":["Khi tiêu đề lệch do nhiều dấu cách, xóa các dấu cách thừa rồi dùng căn giữa đoạn.","Nếu chỉ một đoạn bị giãn bất thường, kiểm tra giãn dòng hoặc khoảng cách đoạn của chính đoạn đó.","Nếu xuất hiện trang trống, kiểm tra đoạn rỗng, ngắt trang và lề. Xem trước sau mỗi lần chỉnh."],"example":"Tăng lề làm dòng cuối sang trang mới. Có thể giảm lề trong giới hạn yêu cầu hoặc điều chỉnh const h=(tag,cls='',text='')=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e};
function add(parent,...children){parent.append(...children.filter(x=>x!==null&&x!==undefined));return parent}
function b(text,fn,cls='btn subtle'){const e=h('button',cls,text);e.type='button';e.addEventListener('click',fn);return e}

function select(options,current,onChange){
  const e=h('select');e.append(new Option('Chọn…',''));
  options.forEach((x,i)=>e.append(new Option(x,String(i))));
  e.value=current===null||current===undefined?'':String(current);

const same=(a,b)=>Array.isArray(a)&&a.length===b.length&&a.every((x,i)=>x===b[i]);
const folded=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').trim();
function stableOrder(n,key){
  const arr=Array.from({length:n},(_,i)=>i);
  let seed=[...key].reduce((a,c)=>Math.imul(a^c.charCodeAt(0),16777619)>>>0,2166136261);
  for(let i=n-1;i>0;i--){seed=(Math.imul(1664525,seed)+1013904223)>>>0;const j=seed%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr
}

const LABS={};
function mountLab(host,mission,initialDone,award){
  const lab=LABS[mission.mode];let caseNo=initialDone.includes(0)&&!initialDone.includes(1)?1:0;
  let state={},msg=null,done=[...initialDone];
  const ui={
    root:host,
    nextRender(){render()},
    verdict(ok,good,retry){msg={ok,text:ok?good:retry};if(ok&&!done.includes(caseNo)){done.push(caseNo);award(caseNo)}render();host.querySelector('.lab-feedback')?.focus()},
    notify(text){msg={ok:null,text};render();host.querySelector('.lab-feedback')?.focus()},
    change(fn){return()=>{fn();msg=null;render()}},
    action(text,fn){return b(text,fn,'btn primary')}
  };
  function render(){
    const current=lab[caseNo];
    const tabs=h('div','lab-tabs');
    function showCase(i){
      if(caseNo===i)return;
      caseNo=i;state={};msg=null;render();
      host.querySelector('.lab-name')?.focus();
    }
    lab.forEach((_,i)=>{
      const tab=pressed((done.includes(i)?'✓ ':'')+'Nhiệm vụ '+(i+1),i===caseNo,()=>showCase(i));
      tab.disabled=i>0&&!done.includes(i-1);
      tabs.append(tab);
    });
    const stage=h('section','lab-stage');
    const name=h('h3','lab-name',current.title);name.tabIndex=-1;
    add(stage,name,h('p','lab-instruction',current.prompt));
    const play=h('div','lab-play');stage.append(play);
    host.replaceChildren(tabs,stage);
    const aria=h('div','sr-only');aria.id='lab-current';aria.textContent='Mô phỏng '+mission.lab;stage.prepend(aria);
    current.draw(play,state,ui);
    if(msg){
      const out=h('p','lab-feedback '+(msg.ok===true?'success':msg.ok===false?'warning':'neutral'),msg.text);
      out.tabIndex=-1;out.setAttribute('role','status');stage.append(out);
      if(msg.ok&&caseNo===0&&!done.includes(1))stage.append(b('Sang nhiệm vụ 2',()=>showCase(1),'btn primary lab-next'));
    }
  }
  render();
}

function replaceCase(title,prompt,original,target){
 return {title,prompt,draw(box,s,u){
  s.text??=original;s.find??='';s.into??='';s.position??=-1;s.history??=[];
  const form=h('div','form-grid');
  const f=input(s.find,v=>{s.find=v;s.position=-1},{placeholder:'Mẫu cần tìm',maxLength:60});
  const r=input(s.into,v=>s.into=v,{placeholder:'Nội dung mới',maxLength:60});
  add(form,field('Tìm',f),field('Thay bằng',r));
  function seek(){return s.find?s.text.indexOf(s.find,s.position<0?0:s.position+s.find.length):-1}
  function mark(){if(!s.find){u.notify('Hãy nhập cụm từ cần tìm.');return}
   const i=seek();s.position=i<0?s.text.indexOf(s.find):i;u.notify(s.position<0?'Không thấy mẫu trong văn bản.':'Đã đánh dấu một kết quả. Kiểm tra ngữ cảnh trước khi thay.')}
  function replace(all){
   if(!s.find||!s.text.includes(s.find)){u.notify('Không có kết quả cho mẫu hiện tại.');return}
   const i=s.position;
   if(!all&&(i<0||s.text.slice(i,i+s.find.length)!==s.find)){u.notify('Bấm Tìm tiếp để đánh dấu đúng một chỗ trước khi thay.');return}
   s.history.push(s.text);
   s.text=all?s.text.split(s.find).join(s.into):s.text.slice(0,i)+s.into+s.text.slice(i+s.find.length);

   add(map,h('p','field-label','Ca '+(i+1)+' · bắt đầu ô '+start+' · đích ô '+goal+(battery===undefined?'':' · pin '+battery)),track);
  });

     const cond=[()=>x<c.goal,()=>x<=c.goal,()=>x>c.goal][s.cond];

  }));

}

 const hero=add(h('section','hero mission-hero'),copy,art(mission.icon));
 const titleRow=add(h('div','section-head'),
  add(h('div'),h('p','eyebrow','BẢN ĐỒ NHIỆM VỤ'),h('h2','','5 cánh cửa tri thức')),
  h('span','tiny',roomsDone(p)+'/5 khu vực đã hoàn thành'));
 const list=h('ol','stage-list');
 mission.stages.forEach((name,i)=>{
  const final=i===4;
  const solved=Math.max(0,Math.min(5,p.count-i*5));
  const open=p.count>=i*5;
  const done=final?hasCertificate(p):solved===5;
  const roomName=final?'Thử thách cuối':name;
  const state=done?'✓':open?'✨':'🔒';
  const details=final?(solved===5?'Thực hành '+p.finalCases.length+'/2':'5 câu + thực hành'):'5 câu';
  const row=h('li','stage-row'+(done?' done':'')+(!open?' locked':''));
  const room=b('',()=>{
   if(done){if(final)certificate();else review(i)}
   else if(final&&solved===5)lab();
   else play(p.count);
  },'room-button');
  room.disabled=!open;
  const seal=h('span','room-seal',state);
  seal.setAttribute('aria-hidden','true');
  const icon=h('span','room-icon',ROOM_ICONS[i]);
  icon.setAttribute('aria-hidden','true');
  add(room,seal,icon,h('strong','',roomName),h('small','',details));
  if(!open)room.setAttribute('aria-label',roomName+' · Chưa mở');
  row.append(room);
  if(solved&&(final||!done))row.append(b('Xem lời giải',()=>review(i),'btn text-btn'));
  list.append(row);
 });
 main.replaceChildren(hero,titleRow,list);
 if(storageProblem)main.append(h('p','notice','Tiến độ sẽ mất khi em đóng trang vì trình duyệt đang chặn lưu.'));
 if(scroll)focusViewStart(title);
}
function resetLesson(){
 if(!confirm('Chơi lại từ đầu? Tiến độ và chứng nhận của bài này sẽ bị xóa trên trình duyệt.'))return;
 progress=empty();
 mem.set(lesson.n,progress);
 save(lesson.n);
 lessonPage();
}
function route(){
 attempt=null;
 const hash=location.hash;
 const match=hash.match(/^#bai-(\d+)$/);
 const n=STANDALONE||(match?+match[1]:0);
 if(BANK[n]){
  lesson=BANK[n];mission=MISSIONS[n-1];progress=get(n);
  document.title='Bài '+n+' · '+lesson.title+' | Tin học 6';
  lessonPage();
 }else{
  lesson=mission=progress=null;
  document.title='Tin học 6 · Phòng nhiệm vụ';
  home(hash==='#chuong-trinh');
 }
}
function basePanel(label,title,desc,back=()=>lessonPage()){
 const head=h('div','view-heading');
 const titleNode=h('h1','',title);
 add(head,b('☰ Bản đồ bài này',back,'btn subtle'),h('p','eyebrow',label),titleNode,desc?h('p','muted',desc):null);
 return [head,titleNode];
}
function lab(){
 if(progress.count!==TOTAL){lessonPage();return}
 if(hasCertificate(progress)){certificate();return}
 attempt=null;
 const [head,title]=basePanel('KHU VỰC 05 · THỬ THÁCH CUỐI',mission.lab,'Hoàn thành cả hai nhiệm vụ để nhận chứng nhận.');
 const box=h('div','lab-shell');
 const actions=h('div','final-actions');
 main.replaceChildren(add(h('div','lesson-panel'),head,box,actions));
 mountLab(box,mission,progress.finalCases,i=>{
  if(progress.finalCases.includes(i))return;
  progress.finalCases.push(i);
  if(!progress.lab.includes(i)){progress.lab.push(i);progress.xp+=30}
  if(progress.finalCases.length===2)progress.certificateAt=new Date().toISOString();
  save(lesson.n);
  setHeader(mission);
  if(hasCertificate(progress)){
   actions.replaceChildren(b('🏆 Nhận chứng nhận',()=>certificate(),'btn primary'));
  }
 });
 if(lesson.extras.length)actions.append(b('Bài mở rộng',()=>extra(),'btn text-btn'));
 focusViewStart(title);
}
function drawStudy(stage){
 const heading=h('h2','','Kiến thức cần nhớ');
 heading.id='study-title';
 const points=h('ul','study-points');
 for(const point of stage.study.points)points.append(h('li','',point));
 const example=add(h('div','study-example'),h('strong','','Ví dụ'),h('p','',stage.study.example));
 const panel=add(h('section','study'),heading,points,example,h('p','study-source','SGK · trang '+lesson.pages));
 panel.setAttribute('aria-labelledby',heading.id);
 return panel;
}
function hint(q,stage){
 if(q.type==='order')return 'Tìm việc phải làm trước khi có thể thực hiện bước kế tiếp.';
 if(q.type==='match')return 'Đọc từng dòng và dựa vào vai trò hoặc dấu hiệu riêng để chọn.';
 if(q.type==='multi')return 'Đối chiếu từng lựa chọn với câu hỏi. Có thể có hơn một ý đúng.';
 return stage.goal;
}
function play(index,retry=false){
 if(!Number.isInteger(index)||index<0||index>=TOTAL||index!==progress.count){lessonPage();return}
 const i=Math.floor(index/5),stage=lesson.stages[i],q=stage.tasks[index%5];
 const [head,title]=basePanel('KHU VỰC '+number(i+1)+' / 05',i===4?'Thử thách cuối':mission.stages[i],'Câu '+(index%5+1)+' / 5');
 const dots=h('div','progress-dots');
 dots.setAttribute('aria-hidden','true');
 for(let j=0;j<5;j++)dots.append(h('span',j<index%5?'done':j===index%5?'current':''));
 const study=drawStudy(stage);
 const pane=h('section','question-card');
 const jump=b('Đến câu hỏi ↓',()=>{
  pane.scrollIntoView({block:'start'});
  focus(pane.querySelector('h2'));
 },'btn text-btn study-jump');
 const grid=add(h('div','play-grid'),study);
 const session={index,q,stage,i,phase:'study',pane,study};
 attempt=session;
 const mustRead=lesson.n>=2&&!retry;
 jump.hidden=mustRead;
 const status=h('p','sr-only');
 status.setAttribute('role','status');
 main.replaceChildren(add(h('div','lesson-panel play-panel'),head,dots,jump,grid,status));
 focusViewStart(title);
 if(!mustRead){
  showQuestion();
  if(retry)focus(pane.querySelector('h2'));
  return;
 }

 grid.classList.add('study-only');
 const fill=h('span','study-meter-fill');
 fill.style.setProperty('--study-time',STUDY_SECONDS+'s');
 const meter=add(h('div','study-meter'),fill);
 meter.setAttribute('aria-hidden','true');
 const notice=h('p','','Đọc kiến thức trong '+STUDY_SECONDS+' giây. Câu hỏi sẽ tự mở.');
 const wait=add(h('div','study-wait'),notice,meter);
 study.append(wait);
 setTimeout(()=>{
  if(attempt!==session)return;
  wait.hidden=true;
  grid.classList.remove('study-only');
  showQuestion();
  status.textContent='Câu hỏi đã mở.';
 },STUDY_SECONDS*1000);

 function showQuestion(){
  session.phase='answer';
  drawQuestion(q,pane,stage,index);
  grid.append(pane);
  jump.hidden=false;
 }
}
function drawQuestion(q,pane,stage,index){
 const head=h('p','question-kind',q.grouping?'Phân loại':modes[q.type]);
 const prompt=h('h2','question-prompt',q.prompt);
 add(pane,head,prompt);
 if(q.table)pane.append(checkTable(q.table));
 if(q.type==='practice'){drawPractice(q,pane,()=>complete(index,q,pane,true));return}
 const area=h('div','answer-area');pane.append(area);
 const toolbar=h('div','tool-row');pane.append(toolbar);
 const submit=b('Kiểm tra',grade,'btn primary');submit.disabled=true;toolbar.append(submit);
 let valid=()=>false,correct=()=>false;
 const update=()=>submit.disabled=!valid();
 if(q.type==='order'){
  const local=[];const order=stableOrder(q.steps.length,q.id);
  function drawOrder(){
   area.replaceChildren(h('p','muted','Bấm từng bước theo thứ tự. Có thể bỏ bước cuối hoặc xếp lại.'));
   tray(area,order.map(i=>q.steps[i]),local,i=>{local.push(i);drawOrder();focus(area.querySelector('.ordered-tray li:last-child'))},()=>{local.pop();drawOrder();focus(area.querySelector('.ordered-tray'))},()=>{local.splice(0);drawOrder();focus(area.querySelector('.tool-row button'))},'Thứ tự của em');
   update();
  }
  valid=()=>local.length===q.steps.length;
  correct=()=>same(local.map(i=>order[i]),q.sequence);drawOrder();
 }else if(q.type==='match'){
  const chosen=Array(q.items.length).fill(null);
  const order=stableOrder(q.groups.length,q.id);
  q.items.forEach((x,i)=>area.append(field(x,select(order.map(k=>q.groups[k]),null,v=>{chosen[i]=v;update()}))));
  valid=()=>chosen.every(x=>x!==null);correct=()=>same(chosen.map(i=>order[i]),q.assign);
 }else{
  const ids=stableOrder(q.choices.length,q.id),set=new Set(),fields=h('fieldset','answer-options');
  const legend=h('legend','sr-only',q.type==='multi'?'Chọn tất cả phương án đúng':'Chọn một phương án đúng');fields.append(legend);
  ids.forEach((idx,i)=>{
   const f=h('input');f.type=q.type==='multi'?'checkbox':'radio';f.name=q.id;f.value=String(idx);
   f.addEventListener('change',()=>{if(q.type==='choice')set.clear();if(f.checked)set.add(idx);else set.delete(idx);update()});
   fields.append(add(h('label','answer-choice'),f,h('span','letter',String.fromCharCode(65+i)),h('span','',q.choices[idx])));
  });
  area.append(fields);
  valid=()=>set.size>0;correct=()=>same([...set].sort(),[...q.correct].sort());
 }
 function grade(){
  if(attempt?.phase!=='answer'||!valid()||pane!==attempt.pane)return;
  if(correct())complete(index,q,pane,false);
  else wrong(index,q,pane,stage);
 }
}
function drawPractice(q,pane,finish){
 const intro=h('p','muted','Làm bài rồi tự đối chiếu kết quả.');
 const holder=h('div','practice-rubric');holder.hidden=true;
 const checks=[];
 const submit=b('Ghi nhận đã tự đối chiếu',()=>{if(checks.every(x=>x.checked))finish()},'btn primary');submit.disabled=true;
 q.rubric.forEach(line=>{const e=h('input');e.type='checkbox';e.addEventListener('change',()=>submit.disabled=!checks.every(x=>x.checked));checks.push(e);
  holder.append(add(h('label','rubric-item'),e,h('span','',line)))});
 holder.append(submit);
 const show=b('Mở tiêu chí tự kiểm tra',()=>{holder.hidden=false;show.hidden=true;focus(checks[0])});
 add(pane,intro,show,holder);
}
function disable(pane){pane.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=true)}
function complete(index,q,pane,self){
 if(attempt?.phase!=='answer'||index!==progress.count)return;
 attempt.phase='complete';disable(pane);
 progress.count++;
 if(!self)progress.xp+=progress.tries[index]?10:20;
 if(progress.count%5===0)progress.xp+=30;
 save(lesson.n);
 setHeader(mission);
 const end=progress.count%5===0;
 const result=add(h('div','result-card success'),h('strong','',self?'✓ Đã ghi nhận tự đối chiếu':'✓ Chính xác!'),h('p','',self?'Em đã tự kiểm tra bài theo tiêu chí.':q.why));
 result.setAttribute('role','status');
 const stageIndex=Math.floor(index/5);
 if(end&&stageIndex<4)result.append(h('p','medal',MEDALS[stageIndex]+' Huy hiệu khu vực '+(stageIndex+1)));
 const next=b(progress.count===TOTAL?'Vào thử thách thực hành':end?'Nhận huy chương':'Sang câu tiếp theo',
  ()=>end?(progress.count===TOTAL?lab():celebrateStage(stageIndex)):play(progress.count),'btn primary');
 add(pane,result,next);focus(next);
}
function wrong(index,q,pane,stage){
 attempt.phase='retry';disable(pane);
 progress.tries[index]=(progress.tries[index]||0)+1;save(lesson.n);
 const reviewNotes=b('Xem lại kiến thức',()=>{
  const study=attempt?.study;
  if(study){
   study.scrollIntoView({block:'start'});
   focus(study.querySelector('h2'));
  }
 },'btn text-btn');
 const read=add(h('div','result-card warning'),h('h3','','Đọc lại rồi thử lần nữa'),
  h('p','',hint(q,stage)),reviewNotes);
 const e=h('input');e.type='checkbox';
 const retry=b('Thử lại câu này',()=>play(index,true),'btn primary');retry.disabled=true;
 e.addEventListener('change',()=>retry.disabled=!e.checked);
 add(read,add(h('label','rubric-item'),e,h('span','','Em đã đọc lại tư liệu')),retry);pane.append(read);focus(e);
}
function solution(q){
 if(q.type==='practice')return q.rubric.join(' ');
 if(q.type==='order')return q.sequence.map(i=>q.steps[i]).join(' → ');
 if(q.type==='match')return q.items.map((t,i)=>t+' → '+q.groups[q.assign[i]]).join(' · ');
 return q.correct.map(i=>q.choices[i]).join(' · ');
}
function review(i){
 attempt=null;
 const s=lesson.stages[i],solved=Math.max(0,Math.min(5,progress.count-5*i));
 const [head,title]=basePanel('BÀI '+number(lesson.n)+' · ÔN TẬP',mission.stages[i],solved+'/5 câu đã hoàn thành.');
 const box=h('div','review-stack');box.append(drawStudy(s));
 s.tasks.slice(0,solved).forEach(q=>{
  const item=add(h('details','review-item'),h('summary','',q.prompt));
  if(q.table)item.append(checkTable(q.table));
  add(item,h('p','',solution(q)),q.why?h('p','muted',q.why):null);box.append(item);
 });
 if(!solved)box.append(h('p','muted','Lời giải sẽ xuất hiện ở đây sau khi em vượt qua từng câu.'));
 main.replaceChildren(add(h('div','lesson-panel'),head,box));focusViewStart(title);
}
function extra(){
 attempt=null;
 const q=lesson.extras[0];
 const [head,title]=basePanel('THỰC HÀNH BỔ SUNG','Bài mở rộng');
 const box=add(h('section','question-card'),h('h2','',q.prompt));
 drawPractice(q,box,()=>{
  if(!progress.extras.includes(q.id)){progress.extras.push(q.id);save(lesson.n)}
  disable(box);const result=h('p','result-card success','✓ Đã ghi nhận tự đối chiếu.');box.append(result);focus(result);
 });
 main.replaceChildren(add(h('div','lesson-panel'),head,box));focusViewStart(title);
}
function celebrateStage(i){
 attempt=null;
 const title=h('h1','','Hoàn thành khu vực '+(i+1)+'!');
 const actions=add(h('div','tool-row'),
  b('Sang khu vực tiếp theo',()=>play(progress.count),'btn primary'),
  b('Xem lời giải',()=>review(i)),
  b('Bản đồ bài này',()=>lessonPage()));
 const panel=add(h('section','lesson-panel celebration'),
  h('span','award',MEDALS[i]),title,
  h('p','muted',mission.stages[i]),actions);
 main.replaceChildren(panel);
 focusViewStart(title);
}
function certificate(){
 if(!hasCertificate(progress)){lessonPage();return}
 attempt=null;
 const title=h('h1','','Chứng nhận hoàn thành');
 const recipient=h('p','certificate-recipient');
 const name=input('',value=>{recipient.textContent=value.trim()},{maxLength:80,autocomplete:'off'});
 const date=new Intl.DateTimeFormat('vi-VN',{
  day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Ho_Chi_Minh'
 }).format(new Date(progress.certificateAt));
 const card=add(h('section','certificate-card'),
  h('span','certificate-icon','🏆'),
  h('p','eyebrow','CODEQUEST · TIN HỌC 6'),
  title,recipient,
  h('h3','','Bài '+lesson.n+' · '+lesson.title),
  h('p','','25 câu luyện tập · 2 nhiệm vụ thực hành'),
  h('p','certificate-date','Ngày hoàn thành: '+date));
 const actions=add(h('div','certificate-actions'),
  field('Tên trên chứng nhận (tùy chọn)',name),
  b('In / lưu PDF',()=>window.print(),'btn primary'));
 if(lesson.extras.length)actions.append(b('Bài mở rộng',()=>extra()));
 main.replaceChildren(add(h('div','lesson-panel certificate-view'),
  b('☰ Bản đồ bài này',()=>lessonPage()),card,actions));
 focusViewStart(title);
}
document.querySelector?.('.skip')?.addEventListener('click',e=>{e.preventDefault();main.scrollIntoView({block:'start'});focus(main)});
window.addEventListener('hashchange',route);
route();

// These controls apply to user actions in the lesson, not to browser extensions.
(() => {
 const notice=h('p','notice lesson-clipboard-notice');
 notice.setAttribute('role','status');
 notice.setAttribute('aria-atomic','true');
 document.body.append(notice);
 let hideNotice;

 function selectionTouchesLesson(){
  const selection=document.getSelection?.();
  if(!selection||selection.isCollapsed)return false;
  for(let i=0;i<selection.rangeCount;i++){
   if(selection.getRangeAt(i).intersectsNode(main))return true;
  }
  return false;
 }

 function restrictClipboard(event){
  if(!lesson||main.querySelector('.certificate-view'))return;
  const carriesSelection=['copy','cut','dragstart'].includes(event.type);
  if(!main.contains(event.target)&&!(carriesSelection&&selectionTouchesLesson()))return;
  if(event.type==='beforeinput'&&!['insertFromPaste','insertFromPasteAsQuotation','insertFromDrop'].includes(event.inputType))return;
  if(!event.cancelable)return;
  event.preventDefault();
  notice.textContent=carriesSelection
   ?'Bài học này đã tắt sao chép và cắt nội dung.'
   :'Hãy nhập câu trả lời trực tiếp. Bài học này đã tắt dán và thả nội dung.';
  clearTimeout(hideNotice);
  hideNotice=setTimeout(()=>{notice.textContent=''},4000);
 }

 for(const type of ['copy','cut','paste','dragstart','drop','beforeinput']){
  document.addEventListener(type,restrictClipboard,{capture:true});
 }
})();

</script>

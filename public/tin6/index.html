<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07162a">
<meta name="description" content="CodeQuest Tin học 6. Vượt thử thách để nhận chứng nhận hoàn thành bài.">
<title>Tin học 6 · Phòng nhiệm vụ</title>
<style>:root {
  color-scheme: dark;
  --ink: #f2f8ff;
  --muted: #b4cbe0;
  --paper: #07162a;
  --panel: #132c47;
  --card: #17314d;
  --line: #46617c;
  --gold: #ffdb83;
  --accent: #64ecc9;
  --teal-ink: #102c32;
  --input: #0a2940;
}
*, *::before, *::after { box-sizing: border-box }
body {
  margin: 0;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% -20%, #284b79, #091c35 53%, #071424);
  font: 1rem/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1, h2, h3, h4, p { margin: 0 }
h1 { font-size: clamp(2rem, 5vw, 3.56rem); line-height: 1.09 }
h1 em { color: var(--accent); font-style: normal }
h2 { font-size: clamp(1.4rem, 3vw, 2.2rem); line-height: 1.2 }
h3 { font-size: 1.16rem; line-height: 1.4 }
p { max-width: 67ch }
a, button, input, textarea, select { color: inherit }
button, input, textarea, select { font: inherit }
button:not(:disabled), summary { cursor: pointer }
button:disabled { opacity: .58 }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px }
h1[tabindex="-1"]:focus-visible { outline: none }
[hidden] { display: none !important }
.muted, .tiny { color: var(--muted) }
.tiny { font-size: .86rem }
.sr-only, .skip:not(:focus) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap }
.skip:focus { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 10px 14px; background: var(--paper) }

.header-inner, main, .site-footer > div { max-width: 1130px; margin-inline: auto; padding-inline: clamp(14px, 4vw, 40px) }
.header-inner { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 15px; border-bottom: 1px solid #334b66 }
.brand { display: grid; gap: .1rem }
main { min-height: 65vh; padding-block: 20px 42px }
.site-footer { border-top: 1px solid var(--line) }
.site-footer > div { display: flex; justify-content: space-between; gap: 12px; padding-block: 16px; color: var(--muted); font-size: .82rem }
.eyebrow { color: var(--accent); font-size: .7rem; font-weight: 900; letter-spacing: .12rem; text-transform: uppercase }
.text-link, .nav-link { color: var(--accent); text-underline-offset: .2em }

.hero { position: relative; background: linear-gradient(115deg,#1e446e,#0f2948); border: 1px solid #42668d; border-radius: 25px; overflow: hidden }
.hero-copy { position: relative; z-index: 1; padding: clamp(22px, 4vw, 42px); display: grid; justify-items: start; gap: .85rem }
.hero-desc { color: #d4e6f5; max-width: 60ch }
.hero-actions, .tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem }
.btn, .chip { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 46px; padding: .6rem .9rem; border: 1px solid var(--line); border-radius: 13px; background: var(--card); font-size: .92rem; font-weight: 750; line-height: 1.3; text-align: center; text-decoration: none; overflow-wrap: anywhere }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--teal-ink); font-weight: 800 }
.btn.primary:hover:not(:disabled) { background: #a7f0de }
.btn.subtle:hover:not(:disabled), .btn.outline:hover, .chip:hover:not(:disabled) { background: #284c65; border-color: var(--accent) }
.btn.text-btn { border-color: transparent; background: transparent; color: var(--accent); text-decoration: underline; text-underline-offset: .2em; padding-inline: 0 }
.selected:not(.pixel-cell), .answer-choice:has(:checked) { border-color: var(--accent); background: #166b58 }
.badge, .mechanic { display: inline-block; padding: .18rem .5rem; border-radius: 7px; background: #2c4e69; font-size: .82rem }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 1.8rem 0 .8rem }
.section-head .muted { max-width: 40ch }
.signal-band { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-block: 1rem }
.signal-stat, .stat-tile { display: grid; padding: .65rem .85rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px }
.signal-stat strong, .stat-tile strong { color: var(--gold); font-size: 1.15rem }
.signal-stat span, .stat-tile small { color: var(--muted); font-size: .84rem }
.filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 1rem }
.course-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.course-card { display: flex; flex-direction: column; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; text-decoration: none }
.course-card:hover { border-color: var(--accent) }
.card-visual { display: flex; justify-content: space-between; align-items: center; padding: .6rem .8rem; background: var(--card-tint); color: var(--paper) }
.card-icon { font-size: 2rem }
.card-no { font-size: .8rem; font-weight: 850 }
.card-copy { flex: 1; padding: .8rem }
.card-copy p, .card-group, .card-progress { color: var(--muted); font-size: .84rem }
.mechanic { margin-top: .45rem }
.card-track { padding: 0 .8rem .8rem }
.card-progress { display: flex; justify-content: space-between; margin-top: .35rem }
.meter { height: 7px; overflow: hidden; border-radius: 8px; background: #365570 }
.meter > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#55e9c7,#ffda81) }

.stage-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0 0 1rem }
.stage-row { display: grid; align-content: start; border-radius: 17px; overflow-wrap: anywhere }
.stage-row.done .room-button { border-color: var(--accent) }
.stage-row.locked .room-button { opacity: .68 }
.side-card { display: grid; gap: .45rem; padding: 1rem; border: 1px solid var(--line); border-radius: 15px; background: var(--panel) }
.side-card > .btn { justify-self: start }
.side-card h2 { font-size: 1.4rem }

.lesson-panel { max-width: 900px; margin-inline: auto; padding: clamp(16px, 4vw, 36px); background: var(--panel); border: 1px solid var(--line); border-radius: 22px }
.view-heading { display: grid; gap: .4rem; margin-bottom: 1rem }
.view-heading > .btn { justify-self: start }
.view-heading h1, .celebration h1 { font-size: clamp(1.55rem, 5vw, 2.45rem); line-height: 1.2 }
.review-stack, .question-card { display: grid; gap: .75rem }
.progress-dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px }
.progress-dots span { height: 8px; background: #365570; border-radius: 8px }
.progress-dots .done { background: var(--accent) }
.progress-dots .current { background: var(--gold) }
.study, .question-card, .lab-stage, .review-item { min-width: 0; padding: clamp(14px, 3vw, 25px); background: var(--card); border: 1px solid var(--line); border-radius: 17px }
.study { display: grid; align-content: start; gap: .85rem; background: #23415c; border-color: #7893aa; scroll-margin-top: 1rem }
.study h2 { color: var(--gold); font-size: 1.3rem }
.study-points { display: grid; gap: .65rem; margin: 0; padding-left: 1.3rem; color: #e0ebf8 }
.study-points li::marker { color: var(--accent) }
.study-example { display: grid; gap: .25rem; padding: .7rem .85rem; background: #152e46; border-left: 3px solid var(--accent); border-radius: 8px }
.study-example strong { color: var(--accent) }
.study-source { color: var(--muted); font-size: .8rem }

.play-panel { max-width: 1130px; padding: clamp(14px, 3vw, 28px) }
.play-panel .view-heading { grid-template-columns: minmax(0, 1fr) auto; column-gap: 1rem }
.play-panel .view-heading > .btn { grid-column: 2; grid-row: 1 / span 3; align-self: start }
.play-panel .view-heading > :not(.btn) { grid-column: 1 }
.play-panel .progress-dots { margin-bottom: 1rem }
.play-grid { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); align-items: start; gap: 1rem }
.play-grid.study-only { grid-template-columns: 1fr }
.study-wait { color: var(--muted); font-size: .9rem }
.study-meter { height: 6px; margin-top: .55rem; overflow: hidden; background: #152e46; border-radius: 8px }
.study-meter-fill { display: block; height: 100%; background: var(--accent); transform-origin: left; animation: study-read var(--study-time) linear both }
@keyframes study-read { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@media (prefers-reduced-motion: reduce) {
  .study-meter { display: none }
}
.play-panel .answer-options { grid-template-columns: 1fr }
.play-panel .question-card { scroll-margin-top: 1rem }
.play-panel .study-jump { display: none }
@media (max-width: 760px) {
  .play-grid { grid-template-columns: 1fr }
  .play-panel .study-jump:not([hidden]) { display: inline-flex; margin-bottom: .45rem }
}
@media (max-width: 420px) {
  .play-panel .view-heading { display: flex; flex-direction: column; align-items: flex-start }
}
.question-card h2 { font-size: 1.35rem; overflow-wrap: anywhere }
.answer-area, .answer-options { display: grid; gap: .65rem }
.answer-options { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0; margin: 0; border: 0; min-width: 0 }
.answer-choice { min-height: 58px; display: flex; align-items: flex-start; gap: .65rem; padding: .7rem; border-radius: 13px; border: 1px solid var(--line); background: #244460; overflow-wrap: anywhere; cursor: pointer }
.answer-choice:hover { border-color: var(--accent) }
.answer-choice input, .rubric-item input { width: 1.15rem; height: 1.15rem; flex-shrink: 0; accent-color: var(--accent) }
.letter { flex: 0 0 1.6rem; text-align: center; border-radius: 7px; background: #395d76; font-weight: 800 }
.result-card, .notice, .lab-feedback { padding: .75rem 1rem; border: 1px solid var(--line); border-radius: 13px; background: var(--card); overflow-wrap: anywhere }
.result-card p { margin-top: .3rem }
.warning, .notice { background: #4c3e27; color: #ffebc5; border-color: #9d8864 }
.success { background: #24574f; border-color: #79c6b3 }
.rubric-item { display: flex; align-items: flex-start; gap: .55rem; margin-block: .4rem }
.practice-rubric { padding: .75rem; background: var(--panel); border-radius: 10px }
.review-item summary { font-weight: 800 }
.review-item p, .review-item .table-wrap { margin-top: .6rem }
.celebration { text-align: center; border-color: #bd9f64; padding-block: clamp(26px, 6vw, 58px) }
.celebration p { margin: .75rem auto }
.celebration .tool-row { justify-content: center }
.award { display: grid; place-items: center; margin: 0 auto 1rem; width: 105px; aspect-ratio: 1; border-radius: 50%; background: #f6ce77; border: 3px solid #ffe7a8; font-size: 3.3rem; animation: award-in .35s ease-out }
@keyframes award-in { from { transform: scale(.8); opacity: .4 } }

.field { min-width: 0; display: grid; gap: .35rem }
.field-label { color: var(--muted); font-size: .86rem; font-weight: 800 }
.field input, .field textarea, .field select, .edit-table input { width: 100%; max-width: 100%; min-height: 44px; padding: .45rem .65rem; border: 1px solid var(--line); border-radius: 9px; background: var(--input); color: var(--ink) }
.field textarea { resize: vertical }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.table-wrap { max-width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: 9px }
.data-table { border-collapse: collapse; width: 100%; font-size: .9rem }
.data-table th, .data-table td { padding: .4rem .6rem; border-bottom: 1px solid var(--line); text-align: left }
.data-table th { background: var(--input) }
.data-table tr:last-child td { border-bottom: 0 }

.lab-shell{display:grid;gap:12px}
.lab-tabs{display:flex;flex-wrap:wrap;gap:8px}
.lab-tabs .chip{padding:8px 13px}
.lab-stage{border-top:5px solid var(--accent);max-width:900px}
.lab-stage h3{font-size:clamp(1.25rem,3vw,1.75rem);line-height:1.15}
.lab-instruction{color:var(--muted);margin:7px 0 14px;max-width:66ch}
.lab-play{display:grid;gap:12px}
.lab-play>.btn{justify-self:start}
.lab-feedback{margin-top:13px}
.readout{padding:8px 11px;background:var(--input);border-radius:7px;font:.83rem ui-monospace,monospace;color:var(--ink);overflow-wrap:anywhere}
.sort-board,.network-board,.mind-branches,.safety-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:8px}
.sort-bin{display:grid;gap:5px;border:1px dashed var(--line);border-top:4px solid var(--accent);border-radius:9px;background:var(--input);padding:10px}
.sort-bin ul{margin:0;padding-left:16px;font-size:.8rem}
.flow-track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.flow-track span{display:grid;place-items:center;text-align:center;min-height:45px;border:1px dashed var(--line);background:var(--input);border-radius:7px;font-size:.76rem;font-weight:790}
.flow-track .filled{background:#285267;border-style:solid;border-color:var(--accent)}
.ordered-tray{min-height:38px;display:grid;gap:5px;margin:0;padding-left:26px}
.ordered-tray li{padding:6px 8px;background:var(--input);border:1px solid var(--line);border-radius:6px}
.ordered-tray li::marker{font-weight:850;color:var(--accent)}
.ordered-tray .empty-slot{border-style:dashed;color:var(--muted)}

.pixel-pair{display:flex;gap:18px;flex-wrap:wrap}
.pixel-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(36px,48px));gap:4px;margin-top:5px}
.pixel-cell{height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:#f4f8ff;font:700 1rem ui-monospace,monospace;color:var(--teal-ink)}
.pixel-cell.selected{background:#272247;color:#fff;border-color:#272247}
.device,.safety-action,.result-title{border:1px solid var(--line);border-radius:9px;background:var(--input);padding:9px;min-height:47px;font-size:.86rem;font-weight:750;overflow-wrap:anywhere}
.device{min-height:66px;background:var(--input)}
.wire-list{margin:0;padding:9px 12px 9px 28px;border-radius:8px;border:1px solid var(--line);background:var(--input)}
.dispatch,.search-results,.binder-stack{display:grid;gap:8px}
.dispatch-row{display:grid;grid-template-columns:88px 1fr;gap:9px;align-items:center;background:var(--input);border-radius:8px;border:1px solid var(--line);padding:8px}
.signal{font:800 .69rem ui-monospace,monospace;color:var(--accent);overflow-wrap:anywhere}
.mock-browser,.mock-mail{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.browser-bar,.search-bar{display:flex;align-items:end;flex-wrap:wrap;gap:7px;padding:8px;background:var(--input)}
.browser-bar .field,.search-bar .field{flex:1;min-width:min(145px,100%)}
.mock-page,.composer{padding:12px;display:grid;gap:8px}
.mock-page h4{font-size:1.22rem}
.mock-page .btn{justify-self:start}
.mock-link{color:var(--accent);text-decoration:underline;border-color:var(--line)}
.search-bar{border-radius:9px}
.search-result{display:grid;gap:4px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--input)}
.search-result button{text-align:left}
.search-result small{padding-left:5px}
.window-bar{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:9px;background:#285267;color:var(--ink)}
.incident{display:grid;gap:5px;padding:11px;border-radius:9px;background:#4c3e27;border:1px solid #9d8864}
.incident .badge{justify-self:start}
.safety-actions{grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))}
.mind-tree{background:var(--input);border:1px solid var(--line);border-radius:9px;padding:10px}
.mind-root{background:var(--accent);color:var(--teal-ink);padding:7px 13px;border-radius:8px;text-align:center;font-weight:820;max-width:330px;margin:0 auto 12px}
.mind-branch{border-top:3px solid var(--accent);background:var(--panel);border-radius:6px;padding:7px}
.mind-branch ul{padding-left:15px;margin:4px 0;font-size:.8rem}
.paper{color:#17241f;max-width:410px;min-height:174px;margin-inline:auto;background:white;box-shadow:0 7px 24px #1e292821;border:1px solid var(--line);padding:9px var(--paper-margin,10%) 14px;width:100%}
.paper.landscape{max-width:630px;min-height:123px}
.paper.preview{outline:2px solid var(--accent);outline-offset:3px}
.paper h4{font-size:1.18rem;margin-bottom:7px}
.paper-watermark{font-size:.64rem;letter-spacing:.13em;color:#52615b;margin-bottom:9px}
.edit-table input{min-width:58px;min-height:35px;padding:4px}
.edit-table th,.edit-table td{padding:5px}
.draft-text{color:#17241f;padding:13px;border:1px solid var(--line);border-radius:8px;background:#f8edcf;min-height:62px;font-family:Georgia,serif;font-size:1.08rem}
.draft-text mark{background:#ffce63;padding:2px}
.binder-shelf{display:flex;gap:6px;flex-wrap:wrap}
.binder-page{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:8px;background:var(--input)}
.page-number{display:grid;place-items:center;width:24px;height:26px;background:#285267;font-size:.78rem;font-weight:850;border-radius:4px}
.robot-map{display:grid;gap:7px}
.robot-track{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.track-cell{display:grid;place-items:center;min-height:43px;border:1px solid var(--line);border-radius:6px;background:var(--input);font-size:1.03rem}
.track-cell.target{border-color:var(--accent);background:#285267}
.scratch-stage{display:flex;gap:13px;align-items:center;min-height:91px;border-radius:10px;border:1px solid var(--line);background:repeating-linear-gradient(0deg,var(--input) 0 17px,var(--card) 18px 19px);padding:8px}
.scratch-cat{font-size:2.55rem}
.speech{color:#17241f;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:.9rem}
.scratch-script{display:grid;gap:4px;max-width:640px}
.scratch-hat,.scratch-block{border-radius:9px;padding:6px 9px}
.scratch-hat{background:#f2c65a;color:#402d0c;font-weight:820}
.scratch-block .field-label{color:#17241f}
.scratch-block.sb0{background:#9ed5f1}
.scratch-block.sb1{background:#ffc895}
.scratch-block.sb2{background:#e1c4ff}
@media (max-width: 850px) {
  .stage-list { grid-template-columns: repeat(3, minmax(0,1fr)) }
  .course-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 600px) {
  .answer-options, .form-grid { grid-template-columns: 1fr }
  .header-inner { align-items: flex-start; flex-direction: column; padding-block: 12px }
  .stage-list { grid-template-columns: repeat(2, minmax(0,1fr)) }
  .room-button { min-height: 138px }
  .site-footer > div, .section-head { flex-direction: column; align-items: flex-start }
  .signal-band { grid-template-columns: repeat(2, 1fr) }
  .binder-page { grid-template-columns: auto 1fr }
  .binder-page .tool-row { grid-column: 2 }
}
@media (max-width: 355px) {
  .brand { font-size: .85rem }
  .course-grid { grid-template-columns: 1fr }
  .dispatch-row { grid-template-columns: 1fr }
  .flow-track { grid-template-columns: repeat(2, 1fr) }
}
@media (prefers-reduced-motion: reduce) {
  .award { animation: none }
}

.logo { font-size: 1.45rem; font-weight: 950; letter-spacing: .025em; line-height: 1.2 }
.logo em { color: var(--accent); font-style: normal }
.brand-subtitle { color: var(--muted); font-size: .75rem }
.header-stats { display: flex; gap: .5rem; flex-wrap: wrap }
.stat-pill { padding: .42rem .7rem; border: 1px solid #466783; border-radius: 20px; background: #1a3857; font-size: .8rem; white-space: nowrap }
.hero-watermark { position: absolute; right: 6%; top: 0; font-size: clamp(5rem, 15vw, 10rem); opacity: .16; pointer-events: none }
.room-button {
  position: relative;
  display: grid;
  align-content: start;
  gap: .4rem;
  width: 100%;
  min-height: 158px;
  padding: 15px 12px;
  border: 1px solid #466785;
  border-radius: 17px;
  background: linear-gradient(140deg,#204365,#122740);
  text-align: left;
  overflow-wrap: anywhere;
}
.room-button:not(:disabled):hover { border-color: var(--accent) }
.room-button small { color: var(--muted) }
.room-icon { font-size: 2.35rem; line-height: 1.15 }
.room-seal { position: absolute; right: 10px; top: 8px; color: var(--gold) }
.stage-row > .btn { justify-self: start; margin-inline: .65rem }
.question-kind { font-size: .8rem; color: var(--gold); font-weight: 800 }
.lab-next { margin-top: 1rem }
.final-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1rem }
.certificate-view > .btn { margin-bottom: 1rem }
.certificate-card {
  display: grid;
  justify-items: center;
  gap: .8rem;
  padding: clamp(1rem, 5vw, 3rem);
  border: 5px double #c29a4c;
  border-radius: 15px;
  background: #fff8e7;
  color: #142a43;
  text-align: center;
}
.certificate-card .eyebrow { color: #1d6358 }
.certificate-card h1 { font-size: clamp(1.5rem, 4vw, 2.4rem) }
.certificate-icon { font-size: 3rem; line-height: 1 }
.certificate-recipient { color: #155344; font-weight: 850; font-size: 1.4rem; overflow-wrap: anywhere }
.certificate-recipient:empty { display: none }
.certificate-date { color: #41546b }

'use strict';
const BANK={"8":{"n":8,"title":"Thư điện tử","pages":"32–36","stages":[{"goal":"Nhận biết thư điện tử, địa chỉ và tệp đính kèm.","study":{"points":["Thư điện tử dùng để gửi nhận thư qua Internet. Có thể gửi chữ và đính kèm tệp như ảnh hoặc tài liệu.","Địa chỉ thư điện tử có dạng tên hộp thư, dấu @, rồi tên miền. Địa chỉ phải đúng từng kí tự.","Dùng tài khoản do trường cấp hoặc đăng kí theo hướng dẫn phù hợp. Giữ mật khẩu riêng."],"example":"Trong địa chỉ minh họa an@truong.example, “an” là tên hộp thư và “truong.example” là phần tên miền."},"tasks":[{"id":"B08-C01","prompt":"Thư điện tử dùng để làm gì?","type":"choice","choices":["Trao đổi thư qua Internet","In ảnh trực tiếp","Tổ chức cuộc gọi video trực tiếp","Đo nhiệt độ"],"correct":[0],"why":"Đây là phương tiện trao đổi thư qua Internet."},{"id":"B08-C02","prompt":"Khi gửi thư điện tử, em có thể gửi ảnh theo cách nào?","type":"choice","choices":["Lưu ảnh vào máy rồi gửi thư mà không đính kèm.","Gõ tên tệp ở ô Chủ đề là đủ.","Đính kèm tệp ảnh vào thư.","Nhập tên tệp vào ô Đến."],"correct":[2],"why":"Thư có thể kèm ảnh hoặc tài liệu."},{"id":"B08-C03","prompt":"Những phần nào luôn có trong một địa chỉ thư điện tử thông dụng như to1@example.com?","type":"multi","choices":["Tên hộp thư đứng trước dấu @","Dấu @","Tên miền đứng sau dấu @","Mật khẩu đăng nhập viết ở cuối"],"correct":[0,1,2],"why":"Địa chỉ có dạng tên hộp thư @ tên miền. Mật khẩu dùng khi đăng nhập và không nằm trong địa chỉ."},{"id":"B08-C04","prompt":"Địa chỉ nào có cấu trúc thư điện tử?","type":"choice","choices":["mai.truong.example","mai@truong.example","mai@truong@example","https://truong.example"],"correct":[1],"why":"mai@truong.example có tên hộp thư, kí hiệu @ và tên miền."},{"id":"B08-C05","prompt":"Cần tạo hộp thư của riêng mình để gửi và nhận thư. Em cần làm gì trước khi đăng nhập lần đầu vào hộp thư đó?","type":"choice","choices":["Chỉ nghĩ ra một địa chỉ rồi nhập vào thư","Đăng kí tài khoản theo hướng dẫn của dịch vụ và giáo viên hoặc người lớn","Dùng tài khoản người khác để thay cho tài khoản của em","Lưu một tệp văn bản mang tên hộp thư"],"correct":[1],"why":"Tài khoản cần được tạo trước khi dùng để đăng nhập và mở hộp thư."}]},{"goal":"Phân biệt các khu vực hộp thư và giải thích ưu, nhược điểm khi trao đổi bằng thư.","study":{"points":["Trường “Đến” ghi địa chỉ người nhận. “Chủ đề” cho biết thư nói về việc gì. “Nội dung” là lời nhắn. Tệp đính kèm đi cùng thư.","Hộp thư đến chứa thư đã nhận, thư đã gửi chứa thư đã chuyển đi, còn thư nháp là thư chưa gửi.","Thư có thể đến nhanh khi có kết nối, nhưng người nhận có thể đọc vào lúc khác."],"example":"Nếu em soạn thư và lưu nháp để kiểm tra sau, cô giáo chưa nhận được thư đó."},"tasks":[{"id":"B08-C06","prompt":"Ghép trường với vai trò.","type":"match","choices":["1–Y · 2–Z · 3–X","1–Z · 2–X · 3–Y","1–X · 2–Y · 3–Z","1–X · 2–Z · 3–Y"],"correct":[0],"why":"Các trường cho biết gửi cho ai, về việc gì và kèm gì.","items":["Đến","Chủ đề","Tệp đính kèm"],"groups":["Tệp gửi cùng thư","Địa chỉ người nhận","Dòng tóm tắt mục đích"],"assign":[1,2,0]},{"id":"B08-C07","prompt":"Em muốn đọc thư cô vừa gửi. Em mở khu vực nào?","type":"choice","choices":["Thư đã gửi","Hộp thư đến","Thư nháp","Thư đã xóa"],"correct":[1],"why":"Thư nhận được xuất hiện trong Hộp thư đến."},{"id":"B08-C08","prompt":"Xếp ba thư vào đúng khu vực. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["1 – 2 – 3","2 – 3 – 1","1 – 3 – 2","3 – 1 – 2"],"correct":[0],"why":"Vị trí tùy theo thư đến, đã đi hay đang soạn.","grouping":true,"items":["Thư cô gửi cho em","Thư em đã gửi bạn","Thư viết dở chưa gửi"],"groups":["Hộp thư đến","Thư đã gửi","Thư nháp"],"assign":[0,1,2]},{"id":"B08-C09","prompt":"Những đặc điểm nào là ưu điểm của thư điện tử?","type":"multi","choices":["Gửi nội dung nhanh khi có kết nối","Có thể gửi tài liệu kèm theo","Có thể gửi cho nhiều người","Người nhận chắc chắn đọc ngay"],"correct":[0,1,2],"why":"Gửi nhanh không bảo đảm người nhận mở ngay."},{"id":"B08-C10","prompt":"So với gặp trực tiếp, hạn chế nào của thư điện tử có thể ảnh hưởng đến lời nhắn gấp?","type":"choice","choices":["Thư chỉ được gửi cho người ở cùng nơi","Thư điện tử không thể có chủ đề","Người nhận có thể chưa mở hộp thư dù thư đã đến","Người gửi không thể kèm tài liệu"],"correct":[2],"why":"Gửi nhanh không bảo đảm người nhận đọc ngay."}]},{"goal":"Chọn thao tác phù hợp khi gửi bài hoặc tiếp tục trao đổi.","study":{"points":["Khi gửi bài, chọn người nhận, ghi chủ đề cụ thể, viết lời nhắn ngắn, rồi đính kèm đúng tệp.","Trước khi gửi, kiểm tra địa chỉ, chủ đề, lời nhắn và mở thử tệp. Đừng chỉ nhìn tên tệp vì các bản có thể giống nhau.","Dùng Trả lời để tiếp tục cuộc trao đổi với người gửi. Chỉ dùng Trả lời tất cả khi những người còn lại cũng cần nhận."],"example":"Chủ đề “Bài 8 – Lan 6B” giúp giáo viên biết đây là bài nào và của ai. Nội dung thư cần nói rõ tệp gửi kèm."},"tasks":[{"id":"B08-C11","prompt":"Xếp các thao tác gửi bài thực hành.","type":"order","choices":["3 → 4 → 2 → 1","1 → 4 → 3 → 2","3 → 1 → 4 → 2","2 → 3 → 4 → 1"],"correct":[3],"why":"Hoàn thiện và kiểm tra trước khi gửi.","steps":["Bấm Gửi","Soạn thư mới","Điền người nhận, chủ đề, nội dung và đính kèm bài","Kiểm tra thư và tệp"],"sequence":[1,2,3,0]},{"id":"B08-C12","prompt":"Ghép mục đích với thao tác.","type":"match","choices":["1–X · 2–Y · 3–Z","1–Y · 2–Z · 3–X","1–Z · 2–Y · 3–X","1–Y · 2–X · 3–Z"],"correct":[3],"why":"Thao tác thay đổi tùy mục đích trao đổi.","items":["Bắt đầu thư mới","Phản hồi cô trong cuộc trao đổi hiện tại","Gửi tiếp thông báo cho bạn khi được phép"],"groups":["Trả lời","Soạn thư","Chuyển tiếp"],"assign":[1,0,2]},{"id":"B08-C13","prompt":"Cô yêu cầu gửi bảng kế hoạch của tổ qua thư điện tử. Trước khi bấm Gửi, cần kiểm tra những gì?","type":"multi","choices":["Địa chỉ người nhận đúng hộp thư của cô","Đã đính kèm đúng bản kế hoạch cần nộp","Tiêu đề cho biết đây là kế hoạch của tổ nào","Nội dung thư ghi kèm mật khẩu của tổ"],"correct":[0,1,2],"why":"Đúng người nhận, tệp và tiêu đề giúp cô nhận được đúng bài và nhận ra thư của tổ."},{"id":"B08-C14","prompt":"Trước khi bấm Gửi bài cho cô, cần đối chiếu gì?","type":"multi","choices":["Địa chỉ của cô","Tên và nội dung tệp","Chủ đề và lời nhắn","Màu hình nền máy"],"correct":[0,1,2],"why":"Kiểm tra đủ thông tin giúp giảm lỗi gửi nhầm."},{"id":"B08-C15","prompt":"Cô gửi thư hỏi em có tham gia buổi thực hành không. Em muốn xác nhận trong cùng cuộc trao đổi. Em dùng gì?","type":"choice","choices":["Trả lời","Xóa thư","Chuyển tiếp cho bạn","Soạn một thư mới với chủ đề khác"],"correct":[0],"why":"Trả lời giữ nội dung trong cùng cuộc trao đổi."}]},{"goal":"Dựa vào dấu hiệu để xử lí lỗi người nhận hoặc tệp.","study":{"points":["Khi thư báo không gửi được, so địa chỉ với danh bạ chính thức để tìm chữ sai hoặc thiếu. Không tự đoán địa chỉ mới.","Nếu nháp kèm bản cũ, gỡ tệp cũ, thêm tệp đúng rồi mở thử trước khi gửi.","Nếu đã gửi nhầm, gửi bản đúng trong cùng cuộc trao đổi và ghi rõ bản nào cần dùng."],"example":"Bản nháp đang kèm bai8-cu.pdf. Em gỡ tệp này, thêm bai8-sua.pdf, mở kiểm tra rồi mới gửi."},"tasks":[{"id":"B08-C16","prompt":"Địa chỉ trên phiếu là cohoa@truong.example. Em gõ cohao@truong.example. Chọn địa chỉ đã sửa đúng.","type":"choice","choices":["cohao@truong.example","cohoa@trunog.example","cohoa@truong.example","cohoa@lop.example"],"correct":[2],"why":"Hai chữ cuối tên hộp thư đã bị đảo vị trí."},{"id":"B08-C17","prompt":"Ghép dấu hiệu với cách xử lí.","type":"match","choices":["1–Y · 2–X · 3–Z","1–Z · 2–Y · 3–X","1–Z · 2–X · 3–Y","1–Y · 2–Z · 3–X"],"correct":[0],"why":"Mỗi dấu hiệu cần cách xử lí khác nhau.","items":["Quên gắn tệp sau khi gửi","Địa chỉ báo không tồn tại","Thư còn trong Nháp"],"groups":["Kiểm tra địa chỉ chính xác","Gắn tệp và gửi bổ sung","Mở nháp, kiểm tra và gửi"],"assign":[1,0,2]},{"id":"B08-C18","prompt":"Bản nháp đã đính kèm bai8-cu.pdf. Cô yêu cầu đúng một tệp là bai8-sua.pdf. Làm gì trước khi gửi?","type":"choice","choices":["Giữ tệp cũ, sửa lời nhắn thành “bản mới”","Đính kèm cả hai rồi để cô chọn","Gỡ tệp cũ, đính kèm và mở kiểm tra bai8-sua.pdf","Đổi tên tệp cũ thành bai8-sua.pdf"],"correct":[2],"why":"Cần đúng nội dung, phiên bản và số lượng tệp."},{"id":"B08-C19","prompt":"Xếp các lỗi theo phần cần sửa. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["1 – 2 – 3","2 – 1 – 3","3 – 1 – 2","3 – 2 – 1"],"correct":[0],"why":"Xác định trường sai giúp sửa đúng chỗ.","grouping":true,"items":["Gõ sai một ký tự trong địa chỉ","Gắn nhầm bài của tuần trước","Chủ đề ghi sai tên bài"],"groups":["Người nhận","Tệp đính kèm","Chủ đề"],"assign":[0,1,2]},{"id":"B08-C20","prompt":"Em đã gửi bài nhưng phát hiện tệp là bản cũ. Cô chưa phản hồi. Em làm gì?","type":"choice","choices":["Xóa thư ở máy mình rồi cho rằng cô không thấy","Chuyển tiếp bản cũ cho cả lớp","Gửi nhiều lần mà không ghi gì","Gửi bản đúng trong cùng cuộc trao đổi và nói rõ dùng bản mới"],"correct":[3],"why":"Lời nhắn giúp cô phân biệt bản cần dùng."}]},{"goal":"Kiểm tra ngữ cảnh, người nhận và dấu hiệu bất thường.","study":{"points":["Tên hiển thị của người gửi có thể bị giả mạo. Xem địa chỉ đầy đủ và xác minh qua kênh đã biết nếu thư có yêu cầu lạ.","Không nhập mật khẩu qua liên kết lạ, không gửi thông tin cá nhân cho người chưa xác minh. Có thể hỏi giáo viên hoặc người lớn đáng tin.","Khi dùng máy chung, không lưu mật khẩu và đăng xuất sau khi làm xong. Trong trò chơi chỉ dùng địa chỉ và tệp minh họa."],"example":"Một thư hiện tên cô giáo nhưng đến từ địa chỉ lạ và hỏi mật khẩu. Em không mở liên kết, liên hệ cô qua kênh quen thuộc và báo người lớn nếu cần."},"tasks":[{"id":"B08-C21","prompt":"Một thư tự xưng là của giáo viên yêu cầu gửi mật khẩu và nói phải trả lời ngay. Những hành động nào phù hợp?","type":"multi","choices":["Gửi mật khẩu để tránh bị khóa tài khoản","Không cung cấp mật khẩu qua thư","Hỏi lại giáo viên qua kênh liên lạc em đã biết","Chuyển tiếp thư cho cả lớp để các bạn bấm thử"],"correct":[1,2],"why":"Yêu cầu gửi mật khẩu và thúc ép là dấu hiệu đáng ngờ. Xác minh bằng kênh quen thuộc giúp kiểm tra người gửi."},{"id":"B08-C22","prompt":"Một thư lạ yêu cầu nhập mật khẩu để xem điểm. Em nên làm gì?","type":"multi","choices":["Không nhập mật khẩu theo yêu cầu trong thư","Hỏi cô qua kênh liên lạc đã biết","Chuyển tiếp liên kết cho cả lớp để thử","Báo người lớn hoặc giáo viên"],"correct":[0,1,3],"why":"Xác minh qua kênh tin cậy và giữ kín mật khẩu."},{"id":"B08-C23","prompt":"Xếp các thao tác khi dùng thư điện tử trên máy dùng chung. Chọn dãy số nhóm tương ứng với các mục theo thứ tự.","type":"match","choices":["2 – 2 – 1","1 – 1 – 1","1 – 2 – 1","1 – 2 – 2"],"correct":[2],"why":"Đăng xuất bảo vệ hộp thư. Kiểm tra trước giúp tránh gửi sai.","grouping":true,"items":["Đăng xuất khi dùng xong","Lưu mật khẩu trên máy","Kiểm tra tệp và người nhận trước khi gửi"],"groups":["Nên làm","Không nên làm"],"assign":[0,1,0]},{"id":"B08-C24","prompt":"Em cần trả lời cô bằng bản bài đã chỉnh sửa. Xếp các bước.","type":"order","choices":["1 → 2 → 3 → 4","4 → 1 → 3 → 2","2 → 4 → 1 → 3","4 → 3 → 2 → 1"],"correct":[2],"why":"Mở đúng cuộc trao đổi, soạn phản hồi rồi kiểm tra trước khi gửi.","steps":["Kiểm tra người nhận, lời nhắn và tệp","Mở thư góp ý và chọn Trả lời","Bấm Gửi","Nêu bản đã sửa và đính kèm tệp mới"],"sequence":[1,3,0,2]},{"id":"B08-C25","prompt":"Cô chỉ yêu cầu gửi bản sửa cho cô. Thư nào phù hợp nhất?","type":"choice","choices":["Trả lời tất cả để bạn nào cũng nhận bài","Gửi cô nhưng chỉ kèm bản cũ","Gửi đúng tệp cho nhóm lớp để nhờ một bạn chuyển cho cô","Gửi riêng cô, ghi rõ bản đã sửa và kèm đúng tệp"],"correct":[3],"why":"Thư đúng người nhận, nêu rõ mục đích và kèm đúng bản."}]}],"extras":[{"id":"B08-TH01","prompt":"Đăng nhập bằng tài khoản thực hành do giáo viên cấp hoặc dùng bản mô phỏng. Soạn thư nộp bài cho cô Hoa với địa chỉ cohoa@truong.example. Ghi chủ đề có tên bài, tên giả định và lớp; đính kèm đúng một tệp mẫu. Lưu nháp để kiểm tra, rồi mô tả cách đăng xuất trên máy dùng chung.","type":"practice","rubric":["Đúng người nhận và chủ đề.","Lời nhắn phù hợp, đúng một tệp mẫu.","Có bản nháp để kiểm tra và thực hiện hoặc mô tả thao tác đăng xuất. Không gửi thư thật đến địa chỉ mô phỏng."]}]},"5":{"n":5,"title":"Internet","pages":"20–22","stages":[{"goal":"Nhận biết Internet, đặc điểm và lợi ích.","study":{"points":["Internet là hệ thống kết nối nhiều mạng trên toàn cầu. Nhiều tổ chức quản lí từng phần của hệ thống.","Nhà cung cấp dịch vụ Internet giúp người dùng kết nối. Các dịch vụ như thư điện tử, gọi video và web dùng kết nối đó.","Internet hỗ trợ học tập, tìm thông tin, trao đổi và làm việc chung giữa người ở xa."],"example":"Một lớp ở Bắc Ninh gọi video với một lớp ở nơi khác. Hai lớp dùng Internet để trao đổi hình ảnh và tiếng nói."},"tasks":[{"id":"T6-B05-C01","prompt":"Internet là gì?","type":"choice","choices":["Hệ thống kết nối nhiều mạng trên toàn cầu","Một mạng riêng của một phòng học","Một trang web duy nhất","Một phần mềm soạn thảo"],"correct":[0],"why":"Internet liên kết nhiều mạng."},{"id":"T6-B05-C02","prompt":"Hoạt động nào cần Internet trong tình huống đã nêu?","type":"choice","choices":["Họp trực tuyến với lớp ở thành phố khác","Gõ một đoạn trong tệp lưu cục bộ","Tính nhẩm trên giấy","Đọc tệp có sẵn khi ngoại tuyến"],"correct":[0],"why":"Họp trực tuyến từ xa cần kết nối."},{"id":"T6-B05-C03","prompt":"Những việc nào trong tình huống này sử dụng Internet?","type":"multi","choices":["Tải tài liệu từ website nhà trường ở một máy chủ bên ngoài","Mở tệp đã tải trên máy khi đang ngoại tuyến","Gọi video với một bạn ở tỉnh khác qua ứng dụng trực tuyến","Gõ và lưu một đoạn văn trên máy khi không có mạng"],"correct":[0,2],"why":"Truy cập website ở xa và gọi video trực tuyến cần kết nối Internet. Làm việc với tệp cục bộ có thể thực hiện ngoại tuyến."},{"id":"T6-B05-C04","prompt":"Đơn vị cung cấp dịch vụ kết nối Internet thường gọi là gì?","type":"choice","choices":["Phần mềm mạng xã hội","Trình soạn thảo","Nhà cung cấp dịch vụ Internet","Máy tìm kiếm"],"correct":[2],"why":"Nhà cung cấp giúp mạng hoặc thiết bị kết nối Internet."},{"id":"T6-B05-C05","prompt":"Việc hỏi và trả lời trực tiếp trong lớp học trực tuyến thể hiện đặc điểm nào?","type":"choice","choices":["Tính tương tác","Chỉ lưu ngoại tuyến","Chỉ đọc một chiều","Tính cục bộ"],"correct":[0],"why":"Các bên có thể phản hồi qua lại."}]},{"goal":"Phân biệt mạng nội bộ, kết nối và dịch vụ.","study":{"points":["Wi-Fi là cách kết nối không dây vào một mạng. Mạng đó có thể có hoặc không có đường ra Internet.","Mạng nội bộ vẫn có thể chia sẻ tệp hoặc máy in khi mất Internet, nếu các thiết bị trong mạng còn kết nối với nhau.","Tính toàn cầu nói về phạm vi kết nối. Tính tương tác thể hiện khi người dùng phản hồi hoặc cùng làm việc."],"example":"Máy tính vẫn mở được tệp trên máy bên cạnh nhưng không vào được website ngoài trường. Mạng nội bộ còn hoạt động."},"tasks":[{"id":"T6-B05-C06","prompt":"Máy A gửi tệp qua mạng phòng máy dù đường ra ngoài bị ngắt. Điều đó cho thấy gì?","type":"choice","choices":["Gửi tệp luôn phải qua website","Mạng nội bộ có thể hoạt động không cần Internet","Internet chắc chắn vẫn hoạt động","Không có mạng nào hoạt động"],"correct":[1],"why":"Trao đổi trong phòng dùng mạng nội bộ."},{"id":"T6-B05-C07","prompt":"Phân loại các việc theo phạm vi kết nối nêu trong từng tình huống.","type":"match","grouping":true,"items":["Đọc website của thư viện đặt ngoài trường","In tới máy in cùng phòng qua mạng nội bộ","Gọi video cho bạn qua dịch vụ trực tuyến","Mở thư mục dùng chung trên máy cùng phòng"],"groups":["Chỉ cần mạng nội bộ","Cần Internet trong tình huống này"],"assign":[1,0,1,0],"why":"In và mở thư mục trong cùng mạng có thể làm nội bộ. Website bên ngoài và cuộc gọi qua dịch vụ trực tuyến dùng Internet."},{"id":"T6-B05-C08","prompt":"Điện thoại có biểu tượng Wi-Fi nhưng báo “không có Internet”. Kết luận nào đúng?","type":"choice","choices":["Wi-Fi luôn đồng nghĩa Internet hoạt động","Có thể đã nối Wi-Fi nhưng chưa ra được Internet","Chắc chắn mọi website đều bị xóa","Máy đang dùng cáp"],"correct":[1],"why":"Wi-Fi là kết nối không dây tới mạng gần, không bảo đảm đường ra."},{"id":"T6-B05-C09","prompt":"Nhiều tổ chức tự quản lí mạng của mình và kết nối với nhau. Điều nào đúng về Internet?","type":"choice","choices":["Một công ty luôn sở hữu mọi trang web","Một trường sở hữu mọi mạng","Không có một chủ sở hữu duy nhất của toàn bộ Internet","Chỉ một nước được quyết định ai kết nối"],"correct":[2],"why":"Mỗi tổ chức có thể quản lí phần mạng của mình."},{"id":"T6-B05-C10","prompt":"Một máy vẫn in được qua mạng của phòng, nhưng không mở được nhiều website bên ngoài. Những kết luận nào có căn cứ?","type":"multi","choices":["Máy vẫn kết nối được tới máy in trong phòng","Máy in chắc chắn là nguyên nhân khiến website không mở","Cần kiểm tra đường Internet của phòng để tìm nguyên nhân","Mọi máy ở trường chắc chắn đang mất mạng"],"correct":[0,2],"why":"In được cho thấy ít nhất đường nội bộ tới máy in còn hoạt động. Cần kiểm tra thêm đường ra Internet trước khi kết luận về phạm vi lỗi."}]},{"goal":"Chọn dịch vụ theo nhu cầu.","study":{"points":["Chọn công cụ theo việc cần làm. Gọi trực tuyến phù hợp khi cần trao đổi ngay, còn thư hoặc cổng nộp bài phù hợp để gửi tệp xem sau.","Nếu nhiều người cần sửa một bản, dùng tài liệu trực tuyến với quyền chỉnh sửa phù hợp. Chốt một bản cuối để nộp.","Khi không có Internet, em vẫn có thể làm tiếp với tệp đã lưu trên máy."],"example":"Ba bạn cần bàn nhanh về dàn ý rồi cùng viết. Các bạn có thể gọi trước và dùng chung một tài liệu để soạn."},"tasks":[{"id":"T6-B05-C11","prompt":"Nhóm phải thảo luận bằng tiếng nói ngay bây giờ từ ba nhà khác nhau. Chọn gì?","type":"choice","choices":["Tài liệu đã tải khi không có kênh trao đổi","Bản sao USB","Tệp in tại nhà một bạn","Cuộc gọi trực tuyến"],"correct":[3],"why":"Cuộc gọi hỗ trợ trao đổi tức thời."},{"id":"T6-B05-C12","prompt":"Nhóm muốn gửi tài liệu cho bạn ở xa và sau đó đọc ngoại tuyến. Xếp bước từ lúc tài liệu chỉ có trên máy người gửi.","type":"order","steps":["Bạn mở bản đã lưu khi không còn mạng","Người gửi gửi tài liệu qua Internet","Bạn nhận rồi lưu tài liệu vào máy"],"sequence":[1,2,0],"why":"Tài liệu phải được gửi, nhận và lưu cục bộ trước khi mở lúc ngoại tuyến."},{"id":"T6-B05-C13","prompt":"Muốn tránh ba bản chỉnh sửa song song, nhóm đã có mạng và tài khoản. Chọn gì?","type":"choice","choices":["Chỉ gửi tên tài liệu","Cùng làm trên tài liệu trực tuyến được cấp quyền","In bản cũ trước khi chỉnh","Mỗi bạn giữ một bản riêng không trao đổi"],"correct":[1],"why":"Một bản chung giảm phân tán phiên bản."},{"id":"T6-B05-C14","prompt":"Nêu một việc em có thể làm khi mất Internet và một việc cần kết nối. Giải thích theo nơi lấy dữ liệu hoặc người nhận.","type":"practice","rubric":["1 điểm mỗi ví dụ phù hợp kèm lí do, như đọc tệp đã tải và gửi thư cho bạn ở xa."]},{"id":"T6-B05-C15","prompt":"Chọn hai lợi ích khác nhau của Internet cho lớp học và nêu một hoạt động cụ thể cho mỗi lợi ích.","type":"practice","rubric":["1 điểm mỗi cặp lợi ích–hoạt động phù hợp, như học trực tuyến–tham gia tiết học và chia sẻ–nộp tệp cho cô."]}]},{"goal":"Khoanh vùng lỗi và bác bỏ suy luận vội.","study":{"points":["So sánh các thiết bị và dịch vụ trước khi kết luận. Một trang lỗi chưa đủ để nói cả Internet đã ngắt.","Nếu nhiều máy cùng mạng nội bộ đều không vào được các trang bên ngoài, kiểm tra đường ra Internet. Nếu chỉ một máy lỗi, kiểm tra máy đó trước.","Thông tin có trên Internet chưa chắc đúng. Đọc nguồn và đối chiếu khi thông tin chưa rõ."],"example":"Máy B vẫn gọi video trên cùng Wi-Fi, máy A không vào được trang nào. Hãy kiểm tra kết nối và cấu hình của máy A."},"tasks":[{"id":"T6-B05-C16","prompt":"Ba máy mở được hai website khác, chỉ một website báo lỗi. Kết luận hợp lý?","type":"choice","choices":["Internet vẫn dùng được; kiểm tra riêng website hoặc địa chỉ đó","Cả ba cáp chắc chắn đứt","Toàn bộ Internet đã mất","Tệp trong máy đều hỏng"],"correct":[0],"why":"Các website khác vẫn mở."},{"id":"T6-B05-C17","prompt":"Mạng của một bạn chập chờn khi họp video. Nhóm vẫn cần bạn nhận đủ nội dung. Những cách nào phù hợp?","type":"multi","choices":["Gửi bản tóm tắt dạng chữ khi kết nối đủ để nhận","Yêu cầu bạn mở thêm nhiều luồng video cùng lúc","Gửi tài liệu nhẹ để bạn tải rồi đọc lại ngoại tuyến","Chỉ nói nhanh hơn trong lúc bạn đã mất kết nối"],"correct":[0,2],"why":"Văn bản và tệp nhẹ phù hợp hơn khi kết nối yếu, còn bản lưu có thể đọc lại khi ngoại tuyến."},{"id":"T6-B05-C18","prompt":"Máy B họp được trên cùng Wi-Fi, máy A không mở được bất cứ dịch vụ Internet nào. Xem gì trước?","type":"choice","choices":["Thông báo Internet toàn cầu ngừng","Kết nối và cấu hình trên máy A","Đổi giờ học của cả lớp","Xóa tài liệu của B"],"correct":[1],"why":"Dấu hiệu tập trung vào A."},{"id":"T6-B05-C19","prompt":"Bạn thấy tên Wi-Fi rồi kết luận “chắc chắn vào Internet được”. Nêu phản ví dụ và một phép thử.","type":"practice","rubric":["Wi-Fi còn nhưng đường ra Internet hỏng.","Thử mở địa chỉ Internet đáng tin đã biết."]},{"id":"T6-B05-C20","prompt":"Trang có tiêu đề đúng nhưng thông tin chưa có nguồn. Vì sao tính phổ biến của Internet không đủ bảo đảm thông tin đúng?","type":"practice","rubric":["Nhiều người có thể đăng/chia sẻ.","Đề xuất kiểm tra nguồn hoặc đối chiếu nguồn độc lập phù hợp."]}]},{"goal":"Lập phương án làm việc trực tuyến có dự phòng.","study":{"points":["Lập kế hoạch làm nhóm gồm kênh họp, nơi giữ tài liệu chung và nơi nộp bản cuối.","Chuẩn bị phương án cho mạng yếu: tải tệp nhẹ trước, ghi góp ý khi ngoại tuyến và gửi khi có mạng.","Sau khi nộp, kiểm tra xác nhận và giữ lại bản cuối để có thể gửi lại nếu cần."],"example":"Một bạn mạng chập chờn. Nhóm gửi trước bản hướng dẫn ngắn, bạn ấy đọc ngoại tuyến rồi gửi góp ý bằng chữ khi kết nối lại."},"tasks":[{"id":"T6-B05-C21","prompt":"Nhóm cần xem chung hướng dẫn tối nay, một bạn mạng chập chờn. Cách nào hợp lý?","type":"choice","choices":["Chỉ chiếu hướng dẫn tại trường","Chỉ gửi một ảnh không đọc được","Chỉ gọi video độ phân giải cao","Gửi tệp nhẹ để tải trước và có bản tóm tắt bằng chữ"],"correct":[3],"why":"Bản tải trước giúp tiếp tục đọc khi mạng ngắt."},{"id":"T6-B05-C22","prompt":"Nhóm cần chốt việc gấp và gửi một tệp để các bạn xem lại. Có bạn không thể họp đúng giờ. Chọn cách phù hợp.","type":"multi","choices":["Dùng cuộc họp trực tuyến ngắn nếu các thành viên cần trao đổi ngay và tham gia được","Gửi tệp và kết luận bằng kênh mà bạn vắng có thể mở sau","Yêu cầu bạn đã mất mạng tải tệp ngay lúc đó","Chỉ nêu tên tệp trong cuộc gọi và không gửi tệp"],"correct":[0,1],"why":"Trao đổi trực tiếp giúp chốt việc nhanh. Gửi tệp và kết luận giúp người vắng theo dõi sau."},{"id":"T6-B05-C23","prompt":"Mất Internet trước hạn nhưng máy còn tệp. Kế hoạch nào giữ được tiến độ?","type":"choice","choices":["Đánh dấu đã nộp dù chưa gửi","Lưu bản cuối; dùng kết nối được phép khi có lại để nộp và kiểm tra xác nhận","Xóa bản cuối rồi soạn lại","Chờ mà không lưu bài"],"correct":[1],"why":"Giữ tệp và kiểm tra gửi thành công."},{"id":"T6-B05-C24","prompt":"Lập kế hoạch làm bài nhóm từ xa: thảo luận, chia sẻ bản chung, nộp bản cuối; nêu phương án khi một bạn tạm mất mạng.","type":"practice","rubric":["Kênh thảo luận.","Chia sẻ và nộp bản cuối.","Dự phòng phù hợp, như tải bản đọc trước và gửi góp ý khi có mạng."]},{"id":"T6-B05-C25","prompt":"Lớp cần học trực tuyến nhưng có bạn kết nối yếu. Đề xuất hai cách nhận nội dung và cách kiểm tra bạn đã nhận được.","type":"practice","rubric":["1 điểm mỗi cách khả thi, như video trực tiếp và bản tóm tắt nhẹ.","Phản hồi hoặc xác nhận nhận được."]}]}],"extras":[]},"17":{"n":17,"title":"Chương trình máy tính","pages":"71–74","stages":[{"goal":"Nhận diện chương trình và các khối Scratch.","study":{"points":["Thuật toán là các bước giải bài toán. Chương trình diễn đạt các bước đó bằng những lệnh máy tính thực hiện được.","Trong Scratch, khối “Khi bấm vào cờ xanh” bắt đầu kịch bản. Khối “hỏi … và đợi” nhận dữ liệu, khối “nói …” hiển thị thông tin.","Biến là nơi giữ giá trị để dùng lại hoặc thay đổi. Có thể dùng biến a cho số thứ nhất và b cho số thứ hai."],"example":"Bấm cờ xanh, nhân vật hỏi tên và chờ. Sau khi em nhập tên, nhân vật có thể dùng giá trị Trả lời để chào em."},"tasks":[{"id":"T6-B17-C01","prompt":"Chương trình máy tính là gì?","type":"choice","choices":["Chỉ hình minh họa","Chỉ kết quả in ra","Chỉ tên tệp","Mô tả thuật toán để máy tính hiểu và thực hiện"],"correct":[3],"why":"Máy cần các lệnh có thể thực hiện."},{"id":"T6-B17-C02","prompt":"Khối Scratch nào thường khởi động kịch bản khi bấm cờ?","type":"choice","choices":["Nói “Xin chào”","Hỏi và đợi","Đặt x thành 0","Khi bấm vào cờ xanh"],"correct":[3],"why":"Khối sự kiện mở đầu kịch bản."},{"id":"T6-B17-C03","prompt":"Những khối hoặc giá trị nào tham gia lấy số mà học sinh gõ vào Scratch?","type":"multi","choices":["Khối “hỏi … và đợi”","Giá trị “Trả lời”","Khối “di chuyển 10 bước”","Khối “đổi phông nền”"],"correct":[0,1],"why":"Khối hỏi nhận nội dung người dùng nhập. Giá trị “Trả lời” cho phép các khối khác dùng nội dung đó."},{"id":"T6-B17-C04","prompt":"Trong Scratch, biến a dùng để làm gì?","type":"choice","choices":["Lưu giá trị có thể dùng lại hoặc thay đổi","Vẽ khung cửa sổ","Tạo kết nối mạng","Chỉ đặt tên dự án"],"correct":[0],"why":"Biến giữ dữ liệu của chương trình."},{"id":"T6-B17-C05","prompt":"Khối nào làm nhân vật hiển thị kết quả?","type":"choice","choices":["Nói kết quả","Đặt biến a","Hỏi và đợi","Khi bấm cờ"],"correct":[0],"why":"Khối nói đưa kết quả ra màn hình."}]},{"goal":"Đối chiếu bước thuật toán với khối lệnh.","study":{"points":["Mỗi bước trong thuật toán cần khối lệnh phù hợp. Bước nhập dùng khối hỏi, bước tính dùng khối toán tử, bước xuất có thể dùng khối nói.","Giá trị Trả lời thay đổi sau mỗi câu hỏi. Lưu câu trả lời thứ nhất vào a trước khi hỏi số thứ hai, rồi lưu câu sau vào b.","Dùng rẽ nhánh dạng đủ khi cần hai hành động khác nhau. Chạy thử và so với kết quả dự kiến."],"example":"Nhập 3 rồi 5. Nếu lưu đúng thứ tự, a = 3 và b = 5. Nhân vật nói tổng a + b là 8."},"tasks":[{"id":"T6-B17-C06","prompt":"“Hỏi số thứ nhất, rồi lưu lại” tương ứng thế nào?","type":"choice","choices":["Nói a rồi bấm cờ","Chỉ đổi hình nhân vật","Hỏi và đợi, rồi đặt a thành Trả lời","Đặt a thành 0 sau khi hiển thị"],"correct":[2],"why":"Cần lưu câu trả lời trước khi hỏi câu khác."},{"id":"T6-B17-C07","prompt":"Ghép mỗi yêu cầu với khối hoặc biểu thức phù hợp trong kịch bản cộng hai số đã lưu vào a và b.","type":"match","grouping":false,"items":["Tính giá trị a + b","Lưu một giá trị vào biến tổng","Hiển thị giá trị của tổng qua lời thoại"],"groups":["Khối đặt biến","Phép cộng","Khối nói"],"assign":[1,0,2],"why":"Phép cộng tính giá trị. Khối đặt biến lưu giá trị, còn khối nói hiển thị kết quả."},{"id":"T6-B17-C08","prompt":"Vì sao cần lưu câu trả lời thứ nhất vào a trước khi hỏi tiếp?","type":"choice","choices":["Giá trị Trả lời sẽ cập nhật khi có câu trả lời mới","Lệnh nói xóa mọi biến","Scratch không cho nhập hai lần","Cờ xanh chỉ nhận số chẵn"],"correct":[0],"why":"Lưu riêng để giữ cả hai đầu vào."},{"id":"T6-B17-C09","prompt":"Thuật toán nói “nếu a > b thì nói a, nếu không thì nói b”. Dùng khối nào cho hai nhánh?","type":"choice","choices":["Lặp lại 2 lần","Đợi 1 giây","Đặt a thành 0","Nếu … thì … nếu không"],"correct":[3],"why":"Cần chọn đúng một trong hai nhánh."},{"id":"T6-B17-C10","prompt":"Chương trình Scratch cần nói tổng của hai số. Chọn những cách thử có thể giúp phát hiện chương trình đã viết nhầm phép trừ.","type":"multi","choices":["Nhập 8 và 3 rồi so lời thoại với 11","Nhập 3 và 8 rồi so lời thoại với 11","Chỉ kiểm tra nhân vật có xuất hiện trên sân khấu","Chỉ nhập 8 và 0 rồi kết luận chắc chắn đang dùng phép cộng"],"correct":[0,1],"why":"Với 8 và 3 hoặc 3 và 8, tổng đều là 11 còn hiệu thì khác. Với số thứ hai là 0, cộng và trừ có thể cho cùng kết quả."}]},{"goal":"Lắp và chạy thử chương trình ngắn.","study":{"points":["Đặt giá trị ban đầu cho biến khi bắt đầu kịch bản. Phân biệt “đặt biến thành” với “thay đổi biến một lượng”.","Với lặp, xác định khối nào nằm trong thân và khối nào chỉ chạy một lần. Với rẽ nhánh, kiểm tra giá trị ở thời điểm xét điều kiện.","Ghi kết quả em dự đoán trước khi bấm cờ. Sau khi chạy, so kết quả xuất ra và giá trị biến."],"example":"Đặt điểm = 0. Lặp 4 lần thao tác tăng điểm thêm 1. Sau vòng lặp, khối “nói điểm” hiển thị 4."},"tasks":[{"id":"T6-B17-C11","prompt":"Chương trình đặt a = 6, b = 4 rồi nói a + b. Nhân vật nói gì?","type":"choice","choices":["64","24","10","2"],"correct":[2],"why":"Khối cộng cho 10."},{"id":"T6-B17-C12","prompt":"Xếp các bước Scratch để hỏi hai số và nói tổng. Biến a lưu số thứ nhất, b lưu số thứ hai.","type":"order","steps":["Hỏi số thứ hai và đặt b bằng “Trả lời”","Nói giá trị a + b","Hỏi số thứ nhất và đặt a bằng “Trả lời”","Bắt đầu khi bấm cờ xanh"],"sequence":[3,2,0,1],"why":"Cờ xanh khởi động kịch bản. Phải lưu từng câu trả lời ngay sau khi hỏi rồi mới cộng a và b."},{"id":"T6-B17-C13","prompt":"Đặt x = 0, lặp 3 lần “thay đổi x một lượng 2”, rồi nói x. Kết quả?","type":"choice","choices":["3","6","8","2"],"correct":[1],"why":"Ba lần tăng 2 từ 0."},{"id":"T6-B17-C14","prompt":"Tạo chương trình hỏi hai số, lưu vào a và b, rồi nói tổng. Chạy với 3 và 8.","type":"practice","rubric":["Hỏi và lưu riêng hai số.","Khối cộng và nói đúng.","Chạy cho 11."]},{"id":"T6-B17-C15","prompt":"Lắp kịch bản đặt điểm = 0, lặp 4 lần tăng điểm thêm 1, rồi nói điểm. Chạy và ghi kết quả.","type":"practice","rubric":["Khởi tạo đúng.","Lặp tăng đúng.","Kết quả 4."]}]},{"goal":"Phát hiện sai ở phép tính, khối lệnh hoặc điều kiện.","study":{"points":["Nếu chương trình cho kết quả sai, kiểm tra lần lượt dữ liệu nhập, thứ tự lưu biến, phép toán và điều kiện.","Nếu hỏi hai lần rồi mới lưu cả a và b, cả hai có thể nhận cùng câu trả lời cuối. Nếu đặt x về 0 trong vòng lặp, giá trị tích lũy bị mất.","Chạy lại đúng bộ số đã phát hiện lỗi sau khi sửa. Thử thêm một bộ số khác để kiểm tra."],"example":"Kịch bản cần cộng 8 và 3 nhưng nói 5. Kiểm tra khối toán tử, thay phép trừ bằng phép cộng rồi thử lại."},"tasks":[{"id":"T6-B17-C16","prompt":"Nhập 8, 3; chương trình cần cộng nhưng nói 5. Trong khối tính đang dùng a − b. Sửa gì?","type":"choice","choices":["Xóa khối lưu b","Đổi phép trừ thành phép cộng","Đổi thứ tự bấm cờ và nhập","Chỉ đổi chữ hiển thị"],"correct":[1],"why":"5 là hiệu; cần tổng 11."},{"id":"T6-B17-C17","prompt":"Scratch hỏi lần lượt hai số rồi mới đặt cả a và b bằng “Trả lời”. Em nhập 2 rồi 7. Nhận định nào đúng?","type":"multi","choices":["Cả a và b nhận 7 trong kịch bản hiện tại","a tự giữ số 2 vì câu hỏi đầu xuất hiện trước","Cần đặt a bằng “Trả lời” ngay sau câu hỏi đầu để giữ số 2","Đổi lời thoại cuối sang màu khác sẽ khôi phục số 2"],"correct":[0,2],"why":"“Trả lời” giữ nội dung nhập gần nhất. Lưu ngay sau câu hỏi đầu giúp biến a giữ giá trị 2."},{"id":"T6-B17-C18","prompt":"Muốn đếm từ 1 đến 3 nhưng đặt x = 0 trong mỗi lượt trước khi tăng 1. Chương trình nói gì trong ba lượt?","type":"choice","choices":["1, 2, 3","0, 1, 2","1, 1, 1","3, 2, 1"],"correct":[2],"why":"Khởi tạo lại trong thân làm mất tích lũy."},{"id":"T6-B17-C19","prompt":"Kịch bản đặt tổng = 0, lặp 3 lần “đặt tổng thành 2”, rồi nói tổng. Sửa để kết quả là 6 và giải thích.","type":"practice","rubric":["Thay bằng tăng tổng thêm 2.","Kết quả 0 → 2 → 4 → 6."]},{"id":"T6-B17-C20","prompt":"Quy tắc điểm từ 5 là “Đạt” nhưng chương trình dùng > 5. Nêu ca sai, sửa khối và chạy lại.","type":"practice","rubric":["Ca 5 sai.","Dùng “không nhỏ hơn 5” hoặc điều kiện tương đương.","Ca 5 trả “Đạt”."]}]},{"goal":"Tạo chương trình và kiểm chứng nhiều trường hợp.","study":{"points":["Khi thử chương trình có rẽ nhánh, chọn dữ liệu để đi qua mọi nhánh. Với ngưỡng “từ 10”, thử dưới 10, đúng 10 và trên 10.","Tách khối nhập, khối tính và khối xuất để dễ kiểm tra. Với bài so sánh hai số, nhớ thử cả trường hợp hai số bằng nhau.","Chỉ xem bài chạy đúng khi kết quả của mọi ca thử khớp với dự kiến. Nếu một ca sai, sửa rồi thử lại tất cả."],"example":"Với quy tắc tổng từ 10 là “Đủ”, tổng 9 cho “Thiếu”, tổng 10 và 11 cho “Đủ”. Ca 10 giúp phát hiện dùng nhầm > thay vì ≥."},"tasks":[{"id":"T6-B17-C21","prompt":"Chương trình báo số lớn hơn của a, b. Bộ dữ liệu nào kiểm tra cả a lớn hơn, b lớn hơn và bằng nhau?","type":"choice","choices":["(8, 3), (3, 8), (4, 4)","(4, 4), (3, 3), (2, 2)","(8, 3), (8, 3), (8, 3)","(8, 3), (9, 4), (5, 2)"],"correct":[0],"why":"Ba ca bao phủ các quan hệ khác nhau."},{"id":"T6-B17-C22","prompt":"Kịch bản nói “Đạt” nếu điểm từ 5 trở lên, nếu không nói “Chưa đạt”. Chọn các ca có kết quả mong đợi đúng.","type":"multi","choices":["Điểm 4 → “Chưa đạt”","Điểm 5 → “Đạt”","Điểm 6 → “Đạt”","Điểm 5 → “Chưa đạt”"],"correct":[0,1,2],"why":"Quy tắc bao gồm cả điểm 5. Thử 4, 5 và 6 giúp kiểm tra dưới, đúng và trên ngưỡng."},{"id":"T6-B17-C23","prompt":"Chương trình đọc a, b rồi báo “Bằng nhau” hoặc giá trị lớn hơn. Với (4, 4), (2, 6), (8, 1), kết quả đúng lần lượt là gì?","type":"choice","choices":["8; 8; 9","Bằng nhau; 6; 8","Bằng nhau; 2; 1","4; 2; 1"],"correct":[1],"why":"Ca bằng nhau phải báo riêng; hai ca khác lấy số lớn hơn."},{"id":"T6-B17-C24","prompt":"Tạo chương trình Scratch nhập a, b, báo số nhỏ hơn; nếu bằng nhau, báo “Hai số bằng nhau”. Chạy với (3, 8), (8, 3), (5, 5).","type":"practice","rubric":["Lưu hai đầu vào riêng.","Xử lí đúng cả ba trường hợp.","Ghi kết quả 3, 3 và thông báo bằng nhau."]},{"id":"T6-B17-C25","prompt":"Tạo chương trình hỏi số quyển vở không âm của hai tổ. Tính tổng; nếu tổng từ 10 trở lên nói “Đủ”, nếu không nói “Thiếu”. Thử (4, 5), (4, 6), (4, 7).","type":"practice","rubric":["Nhập riêng và tính tổng đúng.","Nhánh bao gồm ngưỡng 10.","Kết quả Thiếu, Đủ, Đủ."]}]}],"extras":[]},"10":{"n":10,"title":"Sơ đồ tư duy","pages":"42–47","stages":[{"goal":"Nhận ra thành phần và ích lợi của sơ đồ tư duy.","study":{"points":["Sơ đồ tư duy tổ chức ý quanh một chủ đề trung tâm. Từ trung tâm tỏa ra các nhánh chính, rồi nhánh phụ ghi chi tiết.","Dùng từ khóa ngắn, hình ảnh hoặc màu phù hợp. Mục đích là nhìn ra các ý chính và quan hệ giữa chúng.","Lưu tệp sơ đồ có thể chỉnh sửa. Bản xuất thành ảnh thường thuận tiện để xem, nhưng khó sửa từng nhánh."],"example":"Chủ đề “Vườn trường” có thể có các nhánh chính “Cây”, “Chăm sóc” và “Dụng cụ”."},"tasks":[{"id":"T6-B10-C01","prompt":"Nội dung nào thường đặt ở giữa sơ đồ?","type":"choice","choices":["Số trang","Chủ đề chính","Mọi chi tiết nhỏ","Tên tệp"],"correct":[1],"why":"Trung tâm nêu nội dung bao quát."},{"id":"T6-B10-C02","prompt":"Nhánh nối trực tiếp từ chủ đề thường là gì?","type":"choice","choices":["Lề trái","Chú thích trang","Tên tệp","Nhánh chính"],"correct":[3],"why":"Nhánh chính biểu diễn các ý lớn."},{"id":"T6-B10-C03","prompt":"Những thành phần nào có thể dùng để biểu diễn ý trong sơ đồ tư duy?","type":"multi","choices":["Từ khóa ngắn","Nhánh nối các ý liên quan","Lề trang thay cho toàn bộ nhánh","Hình ảnh minh họa một ý"],"correct":[0,1,3],"why":"Từ khóa, nhánh nối và hình ảnh đều có thể biểu diễn hoặc làm rõ ý. Lề trang không thể hiện mối liên hệ giữa các ý."},{"id":"T6-B10-C04","prompt":"Sơ đồ tư duy đặc biệt hữu ích khi nào?","type":"choice","choices":["Tóm tắt và tổ chức ý theo nhóm","Cần lưu bản thu âm nguyên vẹn","Cần gửi tệp qua thư","Cần đo độ dài vật"],"correct":[0],"why":"Sơ đồ biểu diễn mối liên hệ giữa các ý."},{"id":"T6-B10-C05","prompt":"Sau khi tạo sơ đồ bằng phần mềm, thao tác nào giữ bản để sửa tiếp?","type":"choice","choices":["Chỉ đổi màu nền","Chỉ thu nhỏ cửa sổ","Lưu tệp sơ đồ","Chỉ phóng to màn hình"],"correct":[2],"why":"Lưu định dạng sơ đồ giữ cấu trúc có thể sửa."}]},{"goal":"Phân biệt ý lớn và chi tiết.","study":{"points":["Nhánh chính ghi nhóm lớn. Nhánh phụ ghi ví dụ, hoạt động hoặc ý nhỏ thuộc nhóm đó.","Khi đặt một ý, tự hỏi ý này nói rõ hơn về nhánh nào. Nếu ý có thể hợp với hai nhánh, dùng tên nhóm rõ hơn.","Thay đoạn văn dài bằng vài từ khóa nhưng giữ đủ nghĩa. Hình ảnh nên đặt cạnh ý mà nó minh họa."],"example":"Trong sơ đồ “Sổ lưu niệm”, “Hoạt động lớp” là nhánh chính. “Ngày hội đọc” có thể là nhánh phụ."},"tasks":[{"id":"T6-B10-C06","prompt":"Chủ đề “Sổ lưu niệm lớp”. Mục nào bao quát để làm nhánh chính?","type":"choice","choices":["Ảnh tập thể trong chuyến đi","Hoạt động của lớp","Chuyến dã ngoại ngày 12/11","Tên trò chơi kéo co"],"correct":[1],"why":"Các ví dụ còn lại cụ thể hơn."},{"id":"T6-B10-C07","prompt":"Sơ đồ “Hội khỏe” có ba nhánh chính. Đưa mỗi chi tiết về đúng nhánh.","type":"match","grouping":true,"items":["Bóng đá","Chiều thứ Sáu","Dây kéo co","Cầu lông"],"groups":["Môn thi","Lịch thi","Dụng cụ"],"assign":[0,1,2,0],"why":"Bóng đá và cầu lông là môn thi. Chiều thứ Sáu là thời điểm, dây kéo co là dụng cụ."},{"id":"T6-B10-C08","prompt":"“Giáo viên” → “Cô chủ nhiệm” thể hiện quan hệ nào?","type":"choice","choices":["Hai mục không liên quan","Hai chủ đề trung tâm","Nhóm và một thành viên cụ thể","Một tệp và phần mở rộng"],"correct":[2],"why":"Chi tiết cụ thể hóa nhánh."},{"id":"T6-B10-C09","prompt":"Vì sao không đưa cả đoạn văn dài vào nhánh?","type":"choice","choices":["Mọi nhánh chỉ được có hình","Sơ đồ không được có chữ","Từ khóa giúp nhận ra ý và mối liên hệ nhanh hơn","Phần mềm không lưu được chữ"],"correct":[2],"why":"Sơ đồ dùng để tóm tắt."},{"id":"T6-B10-C10","prompt":"Sơ đồ có ý trung tâm “Góc đọc lớp em” và nhánh chính “Hoạt động”. Những mục nào hợp làm ý con trực tiếp của nhánh này?","type":"multi","choices":["Đọc sách theo nhóm","Số hiệu của kệ sách","Giới thiệu sách vào thứ Sáu","Tên người thiết kế tấm biển góc đọc"],"correct":[0,2],"why":"Đọc theo nhóm và giới thiệu sách là các hoạt động. Hai mục còn lại mô tả đồ vật hoặc người thực hiện việc khác."}]},{"goal":"Nhóm dữ liệu và tạo nhánh.","study":{"points":["Tạo chủ đề trung tâm trước. Tiếp theo, nhóm những ý có quan hệ để tạo nhánh chính, rồi thêm chi tiết.","Để thêm ý vào đúng chỗ, chọn nhánh mẹ rồi thêm nhánh con. Đặt tên ngắn đủ phân biệt các nhóm.","Kiểm tra sơ đồ từ trung tâm đến từng chi tiết, sau đó lưu tệp."],"example":"Sơ đồ “Trồng cây” có nhánh “Chuẩn bị” với “hạt giống” và “đất”, nhánh “Chăm sóc” với “tưới nước”."},"tasks":[{"id":"T6-B10-C11","prompt":"Chủ đề “Ngày hội đọc”. Nhánh “Chuẩn bị” nên chứa mục nào?","type":"choice","choices":["Bản tổng kết sau ngày hội","Chọn sách trưng bày","Chấm giải sau ngày hội","Ảnh đã chụp ngày hôm đó"],"correct":[1],"why":"Chọn sách diễn ra trong khâu chuẩn bị."},{"id":"T6-B10-C12","prompt":"Em muốn tạo đúng đường đi “Hội sách → Chuẩn bị → Bảng tên”. Mỗi thao tác thêm nhánh cần có sẵn ý cha. Hãy xếp các thao tác.","type":"order","steps":["Thêm “Bảng tên” dưới “Chuẩn bị”","Tạo ý trung tâm “Hội sách”","Thêm “Chuẩn bị” từ ý trung tâm"],"sequence":[1,2,0],"why":"Tạo ý trung tâm, rồi tạo nhánh chính. Khi nhánh chính đã có mới gắn ý con."},{"id":"T6-B10-C13","prompt":"Thứ tự nào giúp dựng sơ đồ từ danh sách?","type":"choice","choices":["Tô màu mọi mục trước khi xác định ý","Xác định chủ đề, nhóm ý lớn, thêm chi tiết, lưu","Lưu tên tệp, bỏ các nhóm","Thêm chi tiết ngẫu nhiên, xóa trung tâm, lưu"],"correct":[1],"why":"Thứ bậc quyết định vị trí các nội dung."},{"id":"T6-B10-C14","prompt":"Vẽ sơ đồ “Góc học tập” từ bốn mục: sách giáo khoa, truyện, bút chì, thước. Dùng hai nhánh chính.","type":"practice","rubric":["Trung tâm đúng.","Hai nhóm hợp lý, mỗi mục đặt đúng nhánh."]},{"id":"T6-B10-C15","prompt":"Tạo sơ đồ số “Kế hoạch trồng cây” với nhánh Chuẩn bị và Chăm sóc; thêm một chi tiết cho mỗi nhánh rồi lưu.","type":"practice","rubric":["Đủ cấu trúc.","Hai chi tiết phù hợp.","Tệp lưu mở lại được."]}]},{"goal":"Phát hiện lỗi phân nhóm và mức khái quát.","study":{"points":["Nếu một nhánh đặt nhầm, chuyển nó sang nhóm phù hợp thay vì chép lại ở nhiều chỗ.","Nếu hai ý nói về cùng sự kiện, đặt chúng dưới một nhánh chung. Nếu nhánh quá dài, tách thành các từ khóa.","Nếu nhóm muốn sửa chung, chia sẻ tệp gốc hoặc tài liệu có quyền chỉnh sửa thay vì chỉ gửi ảnh chụp."],"example":"“Ảnh kéo co” đặt cạnh “Hội khỏe” để người đọc biết ảnh thuộc sự kiện nào."},"tasks":[{"id":"T6-B10-C16","prompt":"Sơ đồ có “Ảnh lớp” đặt dưới “Lời chúc”, trong khi có nhánh “Ảnh kỉ niệm”. Sửa thế nào?","type":"choice","choices":["Tạo hai bản ảnh giống nhau ở hai nhánh","Xóa ảnh dù cần giữ","Đổi chủ đề trung tâm thành “Lời chúc”","Chuyển “Ảnh lớp” sang “Ảnh kỉ niệm”"],"correct":[3],"why":"Đặt chi tiết theo vai trò của nó."},{"id":"T6-B10-C17","prompt":"Sơ đồ “Sổ lớp” đặt “Lớp 6A” làm trung tâm. Nhánh “Kỉ niệm” chứa lịch kiểm tra, còn nhánh “Lịch học” chứa ảnh dã ngoại. Cần sửa gì?","type":"multi","choices":["Chuyển lịch kiểm tra vào “Lịch học”","Chuyển ảnh dã ngoại vào “Kỉ niệm”","Đổi chỗ hai nhánh trên màn hình nhưng giữ nguyên mục con","Xóa tên lớp ở trung tâm"],"correct":[0,1],"why":"Cần chuyển từng chi tiết về nhánh có nội dung phù hợp. Đổi vị trí trên màn hình không sửa quan hệ giữa nhánh và ý con."},{"id":"T6-B10-C18","prompt":"Một nhánh “Chuẩn bị” chứa đoạn văn liệt kê giấy, bút, ảnh. Cách sửa dễ đọc?","type":"choice","choices":["Đưa cả đoạn vào trung tâm","Nối đoạn văn thêm dài","Giữ đoạn và xóa nhãn nhánh","Tách thành ba từ khóa dưới “Chuẩn bị”"],"correct":[3],"why":"Từ khóa giúp đọc nhanh từng mục."},{"id":"T6-B10-C19","prompt":"Sơ đồ “Ngày tham quan” đặt “Xe buýt” dưới “Địa điểm” và “Bảo tàng” dưới “Di chuyển”. Chỉ ra và sửa hai mục.","type":"practice","rubric":["Xe buýt → Di chuyển.","Bảo tàng → Địa điểm."]},{"id":"T6-B10-C20","prompt":"Bạn gửi ảnh chụp sơ đồ; nhóm cần sửa tiếp nhưng không có tệp gốc. Giải thích và đề xuất bản cần gửi.","type":"practice","rubric":["Ảnh không giữ nhánh dưới dạng chỉnh sửa được.","Gửi tệp gốc hoặc bản có quyền chỉnh sửa phù hợp."]}]},{"goal":"Thiết kế sơ đồ cho người dùng cụ thể.","study":{"points":["Thiết kế nhánh theo cách người dùng sẽ tra cứu. Với sổ lớp, có thể tách “Hoạt động” và “Thành viên” rồi chia nhỏ theo sự kiện hoặc tổ.","Giữ tệp gốc để sửa và xuất bản xem nếu cần trình bày. Kiểm tra nhãn, màu và hình có giúp hiểu quan hệ hay không.","Nhờ một bạn tìm một chi tiết. Nếu bạn phải đoán qua nhiều nhánh, hãy sửa cách đặt tên hoặc vị trí."],"example":"Muốn tìm bạn ở tổ 3, đường tra có thể là “Sổ lớp → Thành viên → Tổ 3”."},"tasks":[{"id":"T6-B10-C21","prompt":"Sổ lớp cần tra hoạt động theo sự kiện và tìm thành viên theo tổ. Sơ đồ nào hợp lý?","type":"choice","choices":["Chỉ nhóm theo màu ảnh","Một nhánh duy nhất là tất cả tên bạn","Đặt từng ảnh làm trung tâm riêng","Hai nhánh Hoạt động và Thành viên, chia theo sự kiện và tổ tương ứng"],"correct":[3],"why":"Cấu trúc phục vụ hai cách tra."},{"id":"T6-B10-C22","prompt":"Cô muốn học sinh dùng sơ đồ “Hội sách” để tìm nhanh giờ khai mạc, đồ cần mang và việc được giao. Chọn những cách giúp sơ đồ dễ tra.","type":"multi","choices":["Đặt các nhánh rõ như “Lịch”, “Chuẩn bị”, “Phân công”","Gom mọi chi tiết thành một đoạn dài ở giữa","Đặt “8 giờ khai mạc” dưới “Lịch”","Đặt “Tổ 2 đón khách” dưới “Phân công”"],"correct":[0,2,3],"why":"Tên nhánh rõ và ý con đúng nhóm giúp người đọc lần từ chủ đề đến chi tiết cần tìm."},{"id":"T6-B10-C23","prompt":"Cách kiểm tra nhanh sơ đồ dễ tra cứu?","type":"choice","choices":["Nhờ bạn tìm một chi tiết và nói đường từ trung tâm đến đó","Chỉ kiểm tra trang đầu phần mềm","Chỉ xem tên tệp","Đếm màu càng nhiều càng tốt"],"correct":[0],"why":"Thử tra cứu cho thấy cấu trúc có rõ không."},{"id":"T6-B10-C24","prompt":"Tạo sơ đồ cho “Sổ lưu niệm lớp” có ít nhất ba nhánh chính, mỗi nhánh hai chi tiết. Chỉ đường tìm một chi tiết và lưu tệp.","type":"practice","rubric":["Đủ nhánh và chi tiết.","Phân nhóm và đường tìm đúng.","Lưu tệp mở lại được."]},{"id":"T6-B10-C25","prompt":"Thiết kế sơ đồ “An toàn trên mạng” cho bạn mới học. Dùng ít nhất ba nhóm nguy cơ/biện pháp phù hợp và giải thích cách làm nổi một quy tắc quan trọng.","type":"practice","rubric":["Trung tâm, ít nhất ba nhóm hợp lý.","Chi tiết an toàn đúng.","Giải thích cách nhấn giúp người đọc thấy quy tắc."]}]}],"extras":[]},"2":{"n":2,"title":"Xử lí thông tin","pages":"8–11","stages":[{"goal":"Gọi tên bốn hoạt động thông tin.","study":{"points":["Thu nhận là đưa thông tin vào. Lưu trữ là giữ lại để dùng sau. Xử lí là tính toán, sắp xếp hoặc rút ra kết quả. Truyền là đưa thông tin đến người hay thiết bị khác.","Một công việc có thể gồm nhiều hoạt động. Hãy xét từng thao tác riêng để gọi đúng tên.","Thiết bị vào giúp máy thu nhận dữ liệu. Micrô nhận âm thanh, bàn phím nhận phím gõ, máy ảnh nhận hình."],"example":"Em nghe bạn báo số sách là thu nhận. Em ghi con số vào tệp là lưu trữ. Cộng số sách là xử lí, rồi gửi tổng cho lớp là truyền."},"tasks":[{"id":"T6-B02-C01","prompt":"Việc nhìn con số trên nhiệt kế là hoạt động nào?","type":"choice","choices":["Truyền","Xử lí","Lưu trữ","Thu nhận"],"correct":[3],"why":"Người quan sát nhận dữ liệu qua mắt."},{"id":"T6-B02-C02","prompt":"Lưu ảnh vào thư mục để hôm sau xem lại là gì?","type":"choice","choices":["So sánh","Thu nhận","Truyền","Lưu trữ"],"correct":[3],"why":"Ảnh được giữ để dùng lại."},{"id":"T6-B02-C03","prompt":"Thao tác nào có mục đích lưu lại thông tin để dùng về sau?","type":"multi","choices":["Lưu tệp ghi số liệu vào máy","Tính tổng các số đã nhập","Chép bản ghi vào sổ để ngày mai mở xem","Đọc kết quả cho cả nhóm nghe"],"correct":[0,2],"why":"Lưu tệp và chép vào sổ đều giúp giữ bản ghi. Tính tổng là xử lí, đọc cho nhóm nghe là truyền thông tin."},{"id":"T6-B02-C04","prompt":"Đọc kết quả cho cả lớp nghe chủ yếu là hoạt động gì?","type":"choice","choices":["Truyền","Xử lí","Ghi nhớ","Lưu trữ"],"correct":[0],"why":"Kết quả được đưa đến người nghe."},{"id":"T6-B02-C05","prompt":"Thiết bị nào giúp đưa tiếng nói vào máy tính?","type":"choice","choices":["Màn hình","Micrô","Máy in","Loa"],"correct":[1],"why":"Micrô thu âm để đưa vào máy tính."}]},{"goal":"Phân biệt vai trò của từng thao tác và thiết bị.","study":{"points":["Một thao tác có thể vừa đưa thông tin vào máy vừa giữ nó lại. Câu hỏi thường yêu cầu xác định mục đích chính của thao tác trong tình huống.","Máy tính có thể xử lí lặp lại nhanh khi dữ liệu thay đổi, với điều kiện dữ liệu và cách tính đã được nhập đúng.","Lọc dữ liệu làm thay đổi tập kết quả hiển thị theo điều kiện. Gửi dữ liệu chuyển kết quả đó đến người nhận."],"example":"Em lọc danh sách để lấy các bạn lớp 6C, rồi gửi danh sách đã lọc cho tổ trưởng. Hai thao tác lần lượt là xử lí và truyền."},"tasks":[{"id":"T6-B02-C06","prompt":"Đo nhiệt độ rồi ghi vào sổ. Hai hoạt động chính lần lượt là gì?","type":"choice","choices":["Truyền, xử lí","Xử lí, truyền","Thu nhận, lưu trữ","Lưu trữ, thu nhận"],"correct":[2],"why":"Đo để lấy số liệu; ghi để giữ số liệu."},{"id":"T6-B02-C07","prompt":"Phân loại theo mục đích chính của từng thao tác trong buổi khảo sát cây xanh.","type":"match","grouping":true,"items":["Gửi bảng tổng hợp cho cô","Đếm số cây trong sân","Tính tổng số cây từ các bản ghi của từng tổ","Lưu bảng đếm vào tệp"],"groups":["Thu nhận","Lưu trữ","Xử lí","Truyền"],"assign":[3,0,2,1],"why":"Đếm để thu nhận số liệu, giữ bảng đếm để lưu trữ, cộng để xử lí và gửi để truyền."},{"id":"T6-B02-C08","prompt":"Chụp ảnh bảng và sao ảnh đó vào một thư mục. Thao tác thứ hai có mục đích chính gì?","type":"choice","choices":["Giữ ảnh để mở lại","Thông báo cho người khác","Tính toán từ ảnh","Đo thêm dữ liệu"],"correct":[0],"why":"Sao vào thư mục là lưu một bản ảnh."},{"id":"T6-B02-C09","prompt":"Máy tính giúp gì khi cần tính tổng số liệu của 30 dòng theo cùng một cách?","type":"choice","choices":["Chỉ hiển thị dữ liệu, không thể tính","Tự biết số liệu nào đúng mà không cần kiểm tra","Tính nhanh và có thể tính lại khi số liệu thay đổi","Luôn cho kết quả đúng dù nhập sai"],"correct":[2],"why":"Máy thực hiện phép tính nhanh; vẫn phải kiểm tra dữ liệu và công thức."},{"id":"T6-B02-C10","prompt":"Nhóm đo chiều cao của cây từng tuần. Những thao tác nào là xử lí thông tin?","type":"multi","choices":["Gõ từng kết quả đo vào bảng để ghi lại","Tính mức tăng so với tuần trước","So sánh hai mức tăng để tìm tuần cây tăng nhiều hơn","Gửi bảng gốc cho cô"],"correct":[1,2],"why":"Tính và so sánh tạo ra thông tin mới từ các bản ghi. Ghi lại và gửi bảng phục vụ hai mục đích khác."}]},{"goal":"Thực hiện một chuỗi thao tác có đầu vào và kết quả.","study":{"points":["Trước khi tính, liệt kê dữ liệu đầu vào và kiểm tra đơn vị. Chỉ cộng trực tiếp các số cùng loại, cùng đơn vị.","Muốn tính trung bình, cần đủ các giá trị, cộng chúng rồi chia cho số giá trị.","Muốn người khác mở lại kết quả, hãy lưu thành tệp và gửi hoặc chia sẻ tệp đó. Chỉ xem trên màn hình chưa phải lưu trữ."],"example":"Ba lần đo có cùng đơn vị cho kết quả 12, 15, 18. Tổng là 45, trung bình là 15. Ghi cả ba số và kết quả vào bảng."},"tasks":[{"id":"T6-B02-C11","prompt":"Ba tổ báo có 8, 7 và 9 bạn đăng kí. Kết quả xử lí để biết tổng là gì?","type":"choice","choices":["3 bạn","8079 bạn","24 bạn","9 bạn"],"correct":[2],"why":"Cộng 8 + 7 + 9 = 24."},{"id":"T6-B02-C12","prompt":"Nhóm cần gửi ảnh gốc cùng kết quả đếm số chai nhựa trong ảnh. Xếp quy trình theo thứ tự thực hiện.","type":"order","steps":["Gửi ảnh đã lưu cùng kết quả đếm","Chụp ảnh các chai","Mở ảnh đã lưu và đếm","Lưu ảnh chụp thành tệp"],"sequence":[1,3,2,0],"why":"Phải có ảnh trước khi lưu, có tệp trước khi mở ra đếm và có kết quả trước khi gửi."},{"id":"T6-B02-C13","prompt":"Muốn mai cả nhóm mở lại kết quả đã tính, cách nào đáp ứng cả lưu và truyền?","type":"choice","choices":["Lưu tệp kết quả rồi gửi tệp cho nhóm","Chỉ tính lại trên giấy rồi bỏ giấy","Chỉ ghi nhớ kết quả","Chỉ xem kết quả trên màn hình"],"correct":[0],"why":"Lưu tạo bản dùng lại; gửi chuyển bản đó cho nhóm."},{"id":"T6-B02-C14","prompt":"Tổ 1 đọc 3 chai, tổ 2 đọc 5 chai, tổ 3 đọc 4 chai. Tính tổng và ghi một dòng thông báo cho lớp.","type":"practice","rubric":["Tổng 12 chai.","Thông báo ghi rõ 12 là tổng của ba tổ."]},{"id":"T6-B02-C15","prompt":"Với bài thu tiếng chim, nêu thiết bị để thu, cách lưu và cách chuyển bản ghi cho giáo viên.","type":"practice","rubric":["Thiết bị có micrô; lưu tệp âm thanh; gửi tệp qua kênh cô quy định."]}]},{"goal":"Chẩn đoán sai sót trong luồng thông tin.","study":{"points":["Khi kết quả sai, so dữ liệu đã nhập với nguồn trước. Sau đó kiểm tra phép tính hoặc điều kiện lọc, rồi kiểm tra bản đã gửi.","Một phép tính có thể đúng trên dữ liệu nhập sai. Vì thế cần kiểm tra cả đầu vào và cách xử lí.","Nếu tệp đúng vẫn còn trên máy nhưng người khác chưa xem được, hãy kiểm tra việc gửi và quyền truy cập."],"example":"Các tổ báo 4, 6, 9 nhưng bảng ghi 4, 6, 8. Tổng 18 đúng theo bảng nhưng sai theo số đã báo. Cần sửa số 8 thành 9 rồi tính lại."},"tasks":[{"id":"T6-B02-C16","prompt":"Các tổ báo 8, 7, 9 nhưng bảng ghi 8, 7, 6 rồi tính 21 đúng theo bảng. Lỗi bắt đầu ở đâu?","type":"choice","choices":["Đọc tên ba tổ","Ghi sai dữ liệu tổ 3","Phép cộng theo bảng","Truyền kết quả cho lớp"],"correct":[1],"why":"Đầu vào bị chép nhầm 9 thành 6."},{"id":"T6-B02-C17","prompt":"Bảng tổng hợp ghi 40 chai, nhưng hai phiếu gốc ghi 16 và 18 chai. Những việc nào giúp tìm và sửa sai?","type":"multi","choices":["So số trong bảng tổng hợp với hai phiếu gốc","Sửa phiếu 18 thành 24 cho khớp tổng","Tính lại tổng và sửa bảng nếu nhập hoặc tính sai","Xóa phiếu gốc sau khi nhìn thấy tổng"],"correct":[0,2],"why":"Phiếu gốc giúp đối chiếu và tính lại. Giữ phiếu để còn truy được nguyên nhân sai."},{"id":"T6-B02-C18","prompt":"Tệp đúng còn trong máy; bạn cùng nhóm chưa có bản nào. Thiếu bước gì?","type":"choice","choices":["Tính tổng lần nữa","Chuyển tệp hoặc chia sẻ đúng quyền cho bạn","Nhập dữ liệu khác","Đổi tên máy tính"],"correct":[1],"why":"Đã lưu nhưng chưa truyền tới người cần."},{"id":"T6-B02-C19","prompt":"Bạn đo 18 °C, 20 °C và 19 °C, nhưng báo 20 °C là trung bình. Tìm lỗi và sửa kết quả.","type":"practice","rubric":["Dùng giá trị lớn nhất thay vì trung bình.","(18 + 20 + 19) : 3 = 19 °C."]},{"id":"T6-B02-C20","prompt":"Sáng mai dùng lại kết quả khảo sát nhưng máy sắp tắt, kết quả chỉ hiện trên màn hình. Nêu việc cần làm ngay và cách kiểm tra.","type":"practice","rubric":["Lưu tệp.","Mở lại tệp đúng nơi và đối chiếu dữ liệu/kết quả."]}]},{"goal":"Thiết kế quy trình và kiểm tra kết quả.","study":{"points":["Lập quy trình theo việc cần đạt: thu nhận số liệu, lưu bản gốc, xử lí, kiểm tra và truyền kết quả.","Quy đổi đơn vị trước khi gộp số liệu. Nếu chưa biết một thùng có bao nhiêu quyển, cần hỏi lại trước khi cộng thùng với quyển.","Khi báo cáo, kèm số liệu gốc, đơn vị và tổng để người nhận có thể kiểm tra."],"example":"Tổ 1 góp 12 quyển, tổ 2 góp 8 quyển. Ghi riêng từng tổ, tính tổng 20 quyển, so lại rồi gửi bảng cho lớp."},"tasks":[{"id":"T6-B02-C21","prompt":"Cần báo số sách quyên góp từng tổ và tổng của lớp. Quy trình nào dễ kiểm tra?","type":"choice","choices":["Chỉ gửi tổng trước khi nhập bảng","Nhận số từng tổ, lưu bảng, tính tổng, so lại rồi gửi bảng","Hỏi một tổ, đoán các tổ khác rồi báo","Xóa số từng tổ ngay khi ghi tổng"],"correct":[1],"why":"Giữ số gốc cho phép kiểm tra kết quả."},{"id":"T6-B02-C22","prompt":"Cô cần nhận tổng số sách và có thể kiểm tra số của từng tổ. Nhóm nên làm những gì?","type":"multi","choices":["Giữ bảng số sách từng tổ","Tính tổng từ các số trong bảng","Gửi cho cô cả tổng và bảng từng tổ","Chỉ gửi ảnh bìa của một cuốn sách"],"correct":[0,1,2],"why":"Bảng theo tổ là căn cứ tính tổng. Gửi kèm bảng giúp cô kiểm tra lại kết quả."},{"id":"T6-B02-C23","prompt":"Cần báo nhanh và cho người nhận tự kiểm tra tổng. Nội dung gửi nào đủ nhất?","type":"choice","choices":["Tổng kèm bảng số theo tổ và đơn vị","Chỉ ảnh chụp người đếm","Chỉ số tổng không có đơn vị","Chỉ tên các tổ"],"correct":[0],"why":"Bảng nguồn và đơn vị cho phép kiểm tra phép cộng."},{"id":"T6-B02-C24","prompt":"Lập quy trình đếm số bạn đến trường bằng xe đạp trong từng tổ. Nêu bốn hoạt động và một cách tránh đếm trùng.","type":"practice","rubric":["Thu nhận và lưu số từng tổ.","Xử lí tổng và truyền kết quả.","Cách tránh trùng phù hợp, như mỗi bạn chỉ khai ở tổ mình."]},{"id":"T6-B02-C25","prompt":"Nhóm ghi số cây sống của ba luống là 12, 15, 11. Soạn bản báo cáo ngắn, nêu dữ liệu gốc, tổng và cách lưu để ngày mai so sánh.","type":"practice","rubric":["Giữ đủ ba giá trị; tổng 38 cây; lưu bảng có ngày và tên luống."]}]}],"extras":[]},"4":{"n":4,"title":"Mạng máy tính","pages":"16–19","stages":[{"goal":"Nhận ra mạng và các thành phần.","study":{"points":["Mạng máy tính nối các thiết bị để trao đổi dữ liệu hoặc dùng chung tài nguyên như máy in và tệp.","Máy tính, máy tính bảng và máy in mạng là thiết bị đầu cuối. Bộ chuyển mạch và điểm truy cập Wi-Fi giúp nối thiết bị.","Mạng có thể dùng cáp hoặc kết nối không dây. Phần mềm mạng thực hiện các quy tắc trao đổi thông tin."],"example":"Ba máy tính kết nối với một máy in mạng có thể gửi lệnh in đến cùng máy mà không cần ba máy in riêng."},"tasks":[{"id":"T6-B04-C01","prompt":"Mạng máy tính cần có đặc điểm nào?","type":"choice","choices":["Mọi máy phải có máy in riêng","Các thiết bị được kết nối để trao đổi dữ liệu","Mọi máy phải ở cùng một bàn","Mọi máy phải cùng hãng"],"correct":[1],"why":"Khả năng kết nối và trao đổi là dấu hiệu chính."},{"id":"T6-B04-C02","prompt":"Thiết bị nào là đầu cuối khi học sinh gửi bài?","type":"choice","choices":["Dây mạng","Điểm truy cập không dây","Bộ chuyển mạch","Máy tính của học sinh"],"correct":[3],"why":"Máy học sinh là nơi người dùng gửi dữ liệu."},{"id":"T6-B04-C03","prompt":"Thiết bị nào có thể kết nối vào mạng để gửi, nhận hoặc dùng tài nguyên chung?","type":"multi","choices":["Máy tính có cổng mạng","Máy in có chức năng kết nối mạng","Máy in chỉ có cổng USB đang đứng riêng, không nối với thiết bị nào","Dây cáp mạng chưa cắm hai đầu"],"correct":[0,1],"why":"Máy tính và máy in hỗ trợ mạng có thể tham gia mạng. Dây cáp là phương tiện kết nối."},{"id":"T6-B04-C04","prompt":"Việc nào minh họa chia sẻ thiết bị qua mạng?","type":"choice","choices":["Nhiều máy gửi lệnh đến cùng một máy in mạng","Cùng đọc một cuốn sách giấy","Mỗi bạn in trên một máy riêng","Sao tệp bằng USB giữa hai máy không nối mạng"],"correct":[0],"why":"Máy in mạng là tài nguyên dùng chung."},{"id":"T6-B04-C05","prompt":"Thành phần nào điều khiển việc truyền thông tin theo quy tắc của mạng?","type":"choice","choices":["Tờ giấy hướng dẫn","Phần mềm mạng","Bàn phím","Vỏ máy tính"],"correct":[1],"why":"Phần mềm mạng hỗ trợ việc trao đổi dữ liệu."}]},{"goal":"Phân biệt vai trò qua sơ đồ và ví dụ.","study":{"points":["Hai thiết bị ở gần nhau chưa chắc thuộc cùng một mạng. Tìm cáp mạng, điểm truy cập hoặc dấu hiệu chúng trao đổi dữ liệu.","Bộ chuyển mạch nối nhiều thiết bị bằng cáp mạng. Điểm truy cập Wi-Fi cho thiết bị không dây tham gia mạng.","Đọc sơ đồ theo đường nối. Tệp và máy in là hai loại tài nguyên có thể chia sẻ."],"example":"Trong sơ đồ Máy A → bộ chuyển mạch → Máy B, bộ chuyển mạch là thiết bị kết nối. Hai máy A và B là thiết bị đầu cuối."},"tasks":[{"id":"T6-B04-C06","prompt":"Trong sơ đồ máy A — bộ chuyển mạch — máy B, thiết bị nào kết nối hai máy?","type":"choice","choices":["Máy A","Bộ chuyển mạch","Máy B","Màn hình của A"],"correct":[1],"why":"Bộ chuyển mạch liên kết các đầu cuối."},{"id":"T6-B04-C07","prompt":"Ghép mỗi thiết bị với vai trò chính trong mạng của phòng máy.","type":"match","grouping":false,"items":["Bộ chuyển mạch","Máy in mạng","Điểm truy cập Wi-Fi"],"groups":["In tài liệu dùng chung","Kết nối các thiết bị qua các cổng có dây","Cho máy tính bảng kết nối không dây"],"assign":[1,0,2],"why":"Bộ chuyển mạch nối thiết bị bằng cáp. Máy in nhận lệnh in. Điểm truy cập cung cấp kết nối không dây."},{"id":"T6-B04-C08","prompt":"Hai máy nằm cạnh nhau nhưng không kết nối hoặc trao đổi dữ liệu. Có đủ căn cứ gọi là mạng không?","type":"choice","choices":["Có, nếu dùng cùng màu vỏ","Có, nếu cùng hãng","Không, ở gần chưa chứng minh kết nối","Có, vì có hai máy"],"correct":[2],"why":"Mạng đòi hỏi kết nối chứ không phải khoảng cách gần."},{"id":"T6-B04-C09","prompt":"Một bạn đọc tệp dùng chung; bạn khác in từ máy in mạng. Hai việc chia sẻ gì?","type":"choice","choices":["Tệp và thiết bị","Hai tệp","Hai thiết bị","Hai đường truyền"],"correct":[0],"why":"Tệp là dữ liệu; máy in

<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FPTBN Monitor - Giáo viên
    </title>


    <style>

        /* ==========================================
           RESET
        ========================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #0f172a;

            color:
                #ffffff;
        }


        body {
            min-height: 100vh;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .header {

            position: sticky;

            top: 0;

            z-index: 1000;

            min-height: 64px;

            padding:
                10px
                16px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 15px;

            background:
                #111827;

            border-bottom:
                1px solid
                #334155;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.25);
        }


        /* ==========================================
           LOGO / TITLE
        ========================================== */

        .brand {

            display: flex;

            flex-direction: column;

            gap: 3px;

            min-width: 180px;
        }


        .brand-title {

            font-size: 19px;

            font-weight: 700;

            color:
                #ffffff;
        }


        .brand-subtitle {

            font-size: 12px;

            color:
                #94a3b8;
        }


        /* ==========================================
           HEADER ACTIONS
        ========================================== */

        .header-actions {

            display: flex;

            align-items: center;

            justify-content:
                flex-end;

            gap: 8px;

            flex-wrap: wrap;
        }


        /* ==========================================
           STUDENT COUNT
        ========================================== */

        #count {

            min-width: 95px;

            padding:
                9px
                12px;

            text-align: center;

            font-size: 13px;

            font-weight: 700;

            color:
                #e2e8f0;

            background:
                #1e293b;

            border:
                1px solid
                #334155;

            border-radius:
                8px;
        }


        /* ==========================================
           BUTTON
        ========================================== */

        button {

            border: none;

            border-radius:
                8px;

            padding:
                10px
                14px;

            font-size:
                13px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                all
                0.2s ease;
        }


        button:hover {

            transform:
                translateY(-1px);

            filter:
                brightness(1.08);
        }


        button:active {

            transform:
                translateY(0);
        }


        /* ==========================================
           SHARE BUTTON
        ========================================== */

        #shareTeacher {

            color:
                #ffffff;

            background:
                #2563eb;
        }


        #shareTeacher.active {

            background:
                #dc2626;
        }


        /* ==========================================
           END CLASS
        ========================================== */

        #endClass {

            color:
                #ffffff;

            background:
                #b91c1c;
        }


        #endClass:hover {

            background:
                #dc2626;
        }


        /* ==========================================
           MAIN
        ========================================== */

        .main {

            width: 100%;

            padding:
                12px;
        }


        /* ==========================================
           TEACHER SHARE BOX

           Chỉ chiếm một khu vực nhỏ phía trên.
           Không làm ảnh hưởng nhiều tới lưới HS.
        ========================================== */

        #teacherShareBox {

            display: none;

            width: 100%;

            max-width: 420px;

            margin:
                0
                0
                12px
                0;

            padding:
                8px;

            background:
                #111827;

            border:
                1px solid
                #334155;

            border-radius:
                10px;
        }


        #teacherShareBox.active {

            display: block;
        }


        .teacher-share-title {

            margin-bottom:
                6px;

            font-size:
                12px;

            font-weight:
                700;

            color:
                #cbd5e1;
        }


        #teacherPreview {

            display: block;

            width: 100%;

            max-height: 190px;

            object-fit:
                contain;

            background:
                #000000;

            border-radius:
                6px;
        }


        /* ==========================================
           EMPTY
        ========================================== */

        #empty {

            width: 100%;

            padding:
                60px
                20px;

            text-align: center;

            color:
                #94a3b8;

            font-size:
                15px;
        }


        /* ==========================================
           STUDENT GRID

           auto-fill giúp tự động điều chỉnh
           theo kích thước màn hình.

           Trên màn hình desktop có thể hiển thị
           nhiều HS cùng lúc.
        ========================================== */

        #students {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(230px, 1fr)
                );

            gap:
                8px;

            width:
                100%;
        }


        /* ==========================================
           STUDENT CARD
        ========================================== */

        .student {

            position: relative;

            min-width: 0;

            overflow: hidden;

            background:
                #111827;

            border:
                2px solid
                #334155;

            border-radius:
                8px;

            cursor:
                pointer;

            transition:
                border-color
                0.2s ease,
                transform
                0.2s ease,
                box-shadow
                0.2s ease;
        }


        .student:hover {

            border-color:
                #64748b;

            box-shadow:
                0 5px 18px
                rgba(0, 0, 0, 0.30);
        }


        /* ==========================================
           CONNECTED CARD
        ========================================== */

        .student.connected {

            border-color:
                #22c55e;
        }


        /* ==========================================
           STUDENT TITLE
        ========================================== */

        .student-title {

            min-height:
                35px;

            padding:
                7px
                9px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                8px;

            background:
                #1e293b;

            font-size:
                12px;

            font-weight:
                700;
        }


        .student-title > span:first-child {

            flex:
                1;

            min-width:
                0;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;
        }


        /* ==========================================
           STUDENT STATUS
        ========================================== */

        .student-status {

            flex-shrink:
                0;

            font-size:
                10px;

            font-weight:
                700;

            color:
                #cbd5e1;

            white-space:
                nowrap;
        }


        /* ==========================================
           STUDENT VIDEO
        ========================================== */

        .student video {

            display:
                block;

            width:
                100%;

            aspect-ratio:
                16 / 9;

            object-fit:
                contain;

            background:
                #000000;
        }


        /* ==========================================
           EXPANDED STUDENT

           Click vào card -> teacher.js thêm
           class expanded.
        ========================================== */

        .student.expanded {

            position:
                fixed;

            z-index:
                9000;

            top:
                74px;

            left:
                12px;

            right:
                12px;

            bottom:
                12px;

            width:
                auto;

            height:
                auto;

            background:
                #020617;

            border:
                2px solid
                #38bdf8;

            border-radius:
                12px;

            box-shadow:
                0 20px 70px
                rgba(0, 0, 0, 0.8);
        }


        .student.expanded video {

            width:
                100%;

            height:
                calc(100% - 42px);

            aspect-ratio:
                auto;

            object-fit:
                contain;

            background:
                #000000;
        }


        .student.expanded
        .student-title {

            height:
                42px;

            font-size:
                14px;
        }


        /* ==========================================
           STUDENT ALERT CONTAINER
        ========================================== */

        #studentAlerts {

            position:
                fixed;

            top:
                82px;

            right:
                18px;

            width:
                330px;

            max-width:
                calc(100vw - 36px);

            z-index:
                10000;

            display:
                flex;

            flex-direction:
                column;

            gap:
                8px;

            pointer-events:
                none;
        }


        /* ==========================================
           STUDENT LEFT ALERT
        ========================================== */

        .student-alert {

            padding:
                13px
                15px;

            color:
                #ffffff;

            background:
                #7f1d1d;

            border:
                1px solid
                #ef4444;

            border-radius:
                10px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.45);

            animation:
                alertSlideIn
                0.25s ease-out;
        }


        .student-alert-title {

            margin-bottom:
                5px;

            font-size:
                14px;

            font-weight:
                700;

            color:
                #fecaca;
        }


        .student-alert-name {

            margin-bottom:
                3px;

            font-size:
                15px;

            font-weight:
                700;
        }


        .student-alert-description {

            font-size:
                12px;

            color:
                #fee2e2;
        }


        .student-alert.hide {

            opacity:
                0;

            transform:
                translateX(30px);

            transition:
                all
                0.4s ease;
        }


        @keyframes alertSlideIn {

            from {

                opacity:
                    0;

                transform:
                    translateX(40px);

            }


            to {

                opacity:
                    1;

                transform:
                    translateX(0);

            }

        }


        /* ==========================================
           TABLET
        ========================================== */

        @media (
            max-width: 900px
        ) {

            #students {

                grid-template-columns:
                    repeat(
                        auto-fill,
                        minmax(200px, 1fr)
                    );

            }

        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (
            max-width: 600px
        ) {

            .header {

                position:
                    relative;

                flex-direction:
                    column;

                align-items:
                    stretch;
            }


            .brand {

                text-align:
                    center;
            }


            .header-actions {

                justify-content:
                    center;
            }


            #students {

                grid-template-columns:
                    1fr;
            }


            #teacherShareBox {

                max-width:
                    100%;
            }


            .student.expanded {

                top:
                    10px;

                left:
                    10px;

                right:
                    10px;

                bottom:
                    10px;
            }

        }


        /* ==========================================
           TEACHER LOGIN / CLASS SELECT
        ========================================== */

        #teacherLoginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0f172a;
        }

        .teacher-login-card {
            width: 100%;
            max-width: 460px;
            padding: 28px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        .teacher-login-card h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 24px;
        }

        .teacher-login-note {
            margin-bottom: 22px;
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }

        .teacher-login-card label {
            display: block;
            margin: 12px 0 7px;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
        }

        .teacher-login-card input,
        .teacher-login-card select {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            color: #fff;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        #teacherClassRow {
            display: none;
        }

        #teacherLoginButton,
        #teacherEnterClassButton {
            width: 100%;
            min-height: 48px;
            margin-top: 16px;
            border: 0;
            border-radius: 9px;
            color: #fff;
            background: #2563eb;
            font-weight: 700;
            cursor: pointer;
        }

        #teacherLoginStatus {
            min-height: 20px;
            margin-top: 13px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        #teacherApp {
            display: none;
        }

        #teacherIdentity {
            padding: 9px 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #dbeafe;
            font-size: 12px;
            font-weight: 700;
        }

    </style>

</head>


<body>

    <section id="teacherLoginPage">
        <div class="teacher-login-card">
            <h1>👨‍🏫 Giáo viên</h1>
            <div class="teacher-login-note">
                Đăng nhập bằng email giáo viên, sau đó chọn lớp đang giảng dạy.
            </div>

            <label for="teacherEmail">Email giáo viên</label>
            <input
                id="teacherEmail"
                type="email"
                placeholder="Ví dụ: vanda3@fe.edu.vn"
                autocomplete="email"
            >

            <button id="teacherLoginButton" type="button">
                Tiếp tục
            </button>

            <div id="teacherClassRow">
                <label for="teacherClassSelect">Lớp đang giảng dạy</label>
                <select id="teacherClassSelect"></select>

                <button id="teacherEnterClassButton" type="button">
                    🎓 Vào lớp
                </button>
            </div>

            <div id="teacherLoginStatus"></div>
        </div>
    </section>

    <div id="teacherApp">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="header">


        <div class="brand">

            <div class="brand-title">
                🖥 FPTBN Monitor
            </div>

            <div class="brand-subtitle">
                Màn hình quản lý lớp học
            </div>

        </div>


        <div class="header-actions">

            <div id="teacherIdentity">Chưa vào lớp</div>

            <!-- SỐ HS -->

            <div id="count">
                0 học sinh
            </div>


            <!-- SHARE GV -->

            <button
                id="shareTeacher"
                type="button"
            >
                🖥 Chia sẻ màn hình
            </button>


            <!-- END CLASS -->

            <button
                id="endClass"
                type="button"
            >
                ⏹ Kết thúc lớp
            </button>


        </div>


    </header>


    <!-- ==========================================
         MAIN
    =========================================== -->

    <main class="main">


        <!-- ======================================
             PREVIEW MÀN HÌNH GV

             Bình thường display:none.
             Khi GV share teacher.js thêm
             class "active".
        ======================================= -->

        <section
            id="teacherShareBox"
        >

            <div
                class="teacher-share-title"
            >
                👨‍🏫 Màn hình đang chia sẻ tới học sinh
            </div>


            <video
                id="teacherPreview"
                autoplay
                muted
                playsinline
            ></video>

        </section>


        <!-- ======================================
             KHÔNG CÓ HS
        ======================================= -->

        <div id="empty">

            👨‍🎓 Chưa có học sinh trong lớp.

            <br><br>

            Khi học sinh vào lớp và chia sẻ màn hình,
            màn hình sẽ xuất hiện tại đây.

        </div>


        <!-- ======================================
             STUDENT GRID

             teacher.js sẽ tự động tạo card HS
             và append vào đây.
        ======================================= -->

        <section
            id="students"
        ></section>


    </main>


    <!-- ==========================================
         ALERT HS RỜI LỚP

         teacher.js cũng có khả năng tự tạo
         container nếu không tồn tại.
         Tuy nhiên đặt sẵn ở đây sẽ sạch hơn.
    =========================================== -->

    <div
        id="studentAlerts"
    ></div>


    </div>

    <!-- ==========================================
         SOCKET.IO

         Socket.IO server tự cung cấp file này.
    =========================================== -->

    <script
        src="/socket.io/socket.io.js"
    ></script>


    <!-- ==========================================
         TEACHER JS
    =========================================== -->

    <script
        src="/js/teacher.js"
    ></script>


</body>

</html>

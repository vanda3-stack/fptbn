<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07162a">
<meta name="description" content="CodeQuest Tin học 5. Vượt thử thách để nhận chứng nhận hoàn thành bài.">
<title>Tin học 5 · CodeQuest</title>
<style>:root {
  color-scheme: dark;
  --ink: #f2f8ff;
  --muted: #b4cbe0;
  --paper: #07162a;
  --panel: #132c47;
  --card: #17314d;
  --line: #46617c;
  --gold: #ffdb83;
  --accent: #64ecc9;
  --teal-ink: #102c32;
  --input: #0a2940;
}
*, *::before, *::after { box-sizing: border-box }
body {
  margin: 0;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% -20%, #284b79, #091c35 53%, #071424);
  font: 1rem/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1, h2, h3, h4, p { margin: 0 }
h1 { font-size: clamp(2rem, 5vw, 3.56rem); line-height: 1.09 }
h1 em { color: var(--accent); font-style: normal }
h2 { font-size: clamp(1.4rem, 3vw, 2.2rem); line-height: 1.2 }
h3 { font-size: 1.16rem; line-height: 1.4 }
p { max-width: 67ch }
a, button, input, textarea, select { color: inherit }
button, input, textarea, select { font: inherit }
button:not(:disabled), summary { cursor: pointer }
button:disabled { opacity: .58 }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px }
h1[tabindex="-1"]:focus-visible { outline: none }
[hidden] { display: none !important }
.muted, .tiny { color: var(--muted) }
.tiny { font-size: .86rem }
.sr-only, .skip:not(:focus) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap }
.skip:focus { position: fixed; top: 8px; left: 8px; z-index: 10; padding: 10px 14px; background: var(--paper) }

.header-inner, main, .site-footer > div { max-width: 1130px; margin-inline: auto; padding-inline: clamp(14px, 4vw, 40px) }
.header-inner { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 15px; border-bottom: 1px solid #334b66 }
.brand { display: grid; gap: .1rem }
main { min-height: 65vh; padding-block: 20px 42px }
.site-footer { border-top: 1px solid var(--line) }
.site-footer > div { display: flex; justify-content: space-between; gap: 12px; padding-block: 16px; color: var(--muted); font-size: .82rem }
.eyebrow { color: var(--accent); font-size: .7rem; font-weight: 900; letter-spacing: .12rem; text-transform: uppercase }
.text-link, .nav-link { color: var(--accent); text-underline-offset: .2em }

.hero { position: relative; background: linear-gradient(115deg,#1e446e,#0f2948); border: 1px solid #42668d; border-radius: 25px; overflow: hidden }
.hero-copy { position: relative; z-index: 1; padding: clamp(22px, 4vw, 42px); display: grid; justify-items: start; gap: .85rem }
.hero-desc { color: #d4e6f5; max-width: 60ch }
.hero-actions, .tool-row { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem }
.btn, .chip { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 46px; padding: .6rem .9rem; border: 1px solid var(--line); border-radius: 13px; background: var(--card); font-size: .92rem; font-weight: 750; line-height: 1.3; text-align: center; text-decoration: none; overflow-wrap: anywhere }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--teal-ink); font-weight: 800 }
.btn.primary:hover:not(:disabled) { background: #a7f0de }
.btn.subtle:hover:not(:disabled), .btn.outline:hover, .chip:hover:not(:disabled) { background: #284c65; border-color: var(--accent) }
.btn.text-btn { border-color: transparent; background: transparent; color: var(--accent); text-decoration: underline; text-underline-offset: .2em; padding-inline: 0 }
.selected:not(.pixel-cell), .answer-choice:has(:checked) { border-color: var(--accent); background: #166b58 }
.badge, .mechanic { display: inline-block; padding: .18rem .5rem; border-radius: 7px; background: #2c4e69; font-size: .82rem }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 1.8rem 0 .8rem }
.section-head .muted { max-width: 40ch }
.signal-band { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-block: 1rem }
.signal-stat, .stat-tile { display: grid; padding: .65rem .85rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px }
.signal-stat strong, .stat-tile strong { color: var(--gold); font-size: 1.15rem }
.signal-stat span, .stat-tile small { color: var(--muted); font-size: .84rem }
.filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 1rem }
.course-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.course-card { display: flex; flex-direction: column; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; text-decoration: none }
.course-card:hover { border-color: var(--accent) }
.card-visual { display: flex; justify-content: space-between; align-items: center; padding: .6rem .8rem; background: var(--card-tint); color: var(--paper) }
.card-icon { font-size: 2rem }
.card-no { font-size: .8rem; font-weight: 850 }
.card-copy { flex: 1; padding: .8rem }
.card-copy p, .card-group, .card-progress { color: var(--muted); font-size: .84rem }
.mechanic { margin-top: .45rem }
.card-track { padding: 0 .8rem .8rem }
.card-progress { display: flex; justify-content: space-between; margin-top: .35rem }
.meter { height: 7px; overflow: hidden; border-radius: 8px; background: #365570 }
.meter > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#55e9c7,#ffda81) }

.stage-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0 0 1rem }
.stage-row { display: grid; align-content: start; border-radius: 17px; overflow-wrap: anywhere }
.stage-row.done .room-button { border-color: var(--accent) }
.stage-row.locked .room-button { opacity: .68 }
.side-card { display: grid; gap: .45rem; padding: 1rem; border: 1px solid var(--line); border-radius: 15px; background: var(--panel) }
.side-card > .btn { justify-self: start }
.side-card h2 { font-size: 1.4rem }

.lesson-panel { max-width: 900px; margin-inline: auto; padding: clamp(16px, 4vw, 36px); background: var(--panel); border: 1px solid var(--line); border-radius: 22px }
.view-heading { display: grid; gap: .4rem; margin-bottom: 1rem }
.view-heading > .btn { justify-self: start }
.view-heading h1, .celebration h1 { font-size: clamp(1.55rem, 5vw, 2.45rem); line-height: 1.2 }
.review-stack, .question-card { display: grid; gap: .75rem }
.progress-dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px }
.progress-dots span { height: 8px; background: #365570; border-radius: 8px }
.progress-dots .done { background: var(--accent) }
.progress-dots .current { background: var(--gold) }
.study, .question-card, .lab-stage, .review-item { min-width: 0; padding: clamp(14px, 3vw, 25px); background: var(--card); border: 1px solid var(--line); border-radius: 17px }
.study { display: grid; align-content: start; gap: .85rem; background: #23415c; border-color: #7893aa; scroll-margin-top: 1rem }
.study h2 { color: var(--gold); font-size: 1.3rem }
.study-points { display: grid; gap: .65rem; margin: 0; padding-left: 1.3rem; color: #e0ebf8 }
.study-points li::marker { color: var(--accent) }
.study-example { display: grid; gap: .25rem; padding: .7rem .85rem; background: #152e46; border-left: 3px solid var(--accent); border-radius: 8px }
.study-example strong { color: var(--accent) }
.study-source { color: var(--muted); font-size: .8rem }

.play-panel { max-width: 1130px; padding: clamp(14px, 3vw, 28px) }
.play-panel .view-heading { grid-template-columns: minmax(0, 1fr) auto; column-gap: 1rem }
.play-panel .view-heading > .btn { grid-column: 2; grid-row: 1 / span 3; align-self: start }
.play-panel .view-heading > :not(.btn) { grid-column: 1 }
.play-panel .progress-dots { margin-bottom: 1rem }
.play-grid { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); align-items: start; gap: 1rem }
.play-grid.study-only { grid-template-columns: 1fr }
.study-wait { color: var(--muted); font-size: .9rem }
.study-meter { height: 6px; margin-top: .55rem; overflow: hidden; background: #152e46; border-radius: 8px }
.study-meter-fill { display: block; height: 100%; background: var(--accent); transform-origin: left; animation: study-read var(--study-time) linear both }
@keyframes study-read { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@media (prefers-reduced-motion: reduce) {
  .study-meter { display: none }
}
.play-panel .answer-options { grid-template-columns: 1fr }
.play-panel .question-card { scroll-margin-top: 1rem }
.play-panel .study-jump { display: none }
@media (max-width: 760px) {
  .play-grid { grid-template-columns: 1fr }
  .play-panel .study-jump:not([hidden]) { display: inline-flex; margin-bottom: .45rem }
}
@media (max-width: 420px) {
  .play-panel .view-heading { display: flex; flex-direction: column; align-items: flex-start }
}
.question-card h2 { font-size: 1.35rem; overflow-wrap: anywhere }
.answer-area, .answer-options { display: grid; gap: .65rem }
.answer-options { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0; margin: 0; border: 0; min-width: 0 }
.answer-choice { min-height: 58px; display: flex; align-items: flex-start; gap: .65rem; padding: .7rem; border-radius: 13px; border: 1px solid var(--line); background: #244460; overflow-wrap: anywhere; cursor: pointer }
.answer-choice:hover { border-color: var(--accent) }
.answer-choice input, .rubric-item input { width: 1.15rem; height: 1.15rem; flex-shrink: 0; accent-color: var(--accent) }
.letter { flex: 0 0 1.6rem; text-align: center; border-radius: 7px; background: #395d76; font-weight: 800 }
.result-card, .notice, .lab-feedback { padding: .75rem 1rem; border: 1px solid var(--line); border-radius: 13px; background: var(--card); overflow-wrap: anywhere }
.result-card p { margin-top: .3rem }
.warning, .notice { background: #4c3e27; color: #ffebc5; border-color: #9d8864 }
.success { background: #24574f; border-color: #79c6b3 }
.rubric-item { display: flex; align-items: flex-start; gap: .55rem; margin-block: .4rem }
.practice-rubric { padding: .75rem; background: var(--panel); border-radius: 10px }
.review-item summary { font-weight: 800 }
.review-item p, .review-item .table-wrap { margin-top: .6rem }
.celebration { text-align: center; border-color: #bd9f64; padding-block: clamp(26px, 6vw, 58px) }
.celebration p { margin: .75rem auto }
.celebration .tool-row { justify-content: center }
.award { display: grid; place-items: center; margin: 0 auto 1rem; width: 105px; aspect-ratio: 1; border-radius: 50%; background: #f6ce77; border: 3px solid #ffe7a8; font-size: 3.3rem; animation: award-in .35s ease-out }
@keyframes award-in { from { transform: scale(.8); opacity: .4 } }

.field { min-width: 0; display: grid; gap: .35rem }
.field-label { color: var(--muted); font-size: .86rem; font-weight: 800 }
.field input, .field textarea, .field select, .edit-table input { width: 100%; max-width: 100%; min-height: 44px; padding: .45rem .65rem; border: 1px solid var(--line); border-radius: 9px; background: var(--input); color: var(--ink) }
.field textarea { resize: vertical }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.table-wrap { max-width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: 9px }
.data-table { border-collapse: collapse; width: 100%; font-size: .9rem }
.data-table th, .data-table td { padding: .4rem .6rem; border-bottom: 1px solid var(--line); text-align: left }
.data-table th { background: var(--input) }
.data-table tr:last-child td { border-bottom: 0 }

.lab-shell{display:grid;gap:12px}
.lab-tabs{display:flex;flex-wrap:wrap;gap:8px}
.lab-tabs .chip{padding:8px 13px}
.lab-stage{border-top:5px solid var(--accent);max-width:900px}
.lab-stage h3{font-size:clamp(1.25rem,3vw,1.75rem);line-height:1.15}
.lab-instruction{color:var(--muted);margin:7px 0 14px;max-width:66ch}
.lab-play{display:grid;gap:12px}
.lab-play>.btn{justify-self:start}
.lab-feedback{margin-top:13px}
.readout{padding:8px 11px;background:var(--input);border-radius:7px;font:.83rem ui-monospace,monospace;color:var(--ink);overflow-wrap:anywhere}
.sort-board,.network-board,.mind-branches,.safety-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:8px}
.sort-bin{display:grid;gap:5px;border:1px dashed var(--line);border-top:4px solid var(--accent);border-radius:9px;background:var(--input);padding:10px}
.sort-bin ul{margin:0;padding-left:16px;font-size:.8rem}
.flow-track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.flow-track span{display:grid;place-items:center;text-align:center;min-height:45px;border:1px dashed var(--line);background:var(--input);border-radius:7px;font-size:.76rem;font-weight:790}
.flow-track .filled{background:#285267;border-style:solid;border-color:var(--accent)}
.ordered-tray{min-height:38px;display:grid;gap:5px;margin:0;padding-left:26px}
.ordered-tray li{padding:6px 8px;background:var(--input);border:1px solid var(--line);border-radius:6px}
.ordered-tray li::marker{font-weight:850;color:var(--accent)}
.ordered-tray .empty-slot{border-style:dashed;color:var(--muted)}

.pixel-pair{display:flex;gap:18px;flex-wrap:wrap}
.pixel-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(36px,48px));gap:4px;margin-top:5px}
.pixel-cell{height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:#f4f8ff;font:700 1rem ui-monospace,monospace;color:var(--teal-ink)}
.pixel-cell.selected{background:#272247;color:#fff;border-color:#272247}
.device,.safety-action,.result-title{border:1px solid var(--line);border-radius:9px;background:var(--input);padding:9px;min-height:47px;font-size:.86rem;font-weight:750;overflow-wrap:anywhere}
.device{min-height:66px;background:var(--input)}
.wire-list{margin:0;padding:9px 12px 9px 28px;border-radius:8px;border:1px solid var(--line);background:var(--input)}
.dispatch,.search-results,.binder-stack{display:grid;gap:8px}
.dispatch-row{display:grid;grid-template-columns:88px 1fr;gap:9px;align-items:center;background:var(--input);border-radius:8px;border:1px solid var(--line);padding:8px}
.signal{font:800 .69rem ui-monospace,monospace;color:var(--accent);overflow-wrap:anywhere}
.mock-browser,.mock-mail{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.browser-bar,.search-bar{display:flex;align-items:end;flex-wrap:wrap;gap:7px;padding:8px;background:var(--input)}
.browser-bar .field,.search-bar .field{flex:1;min-width:min(145px,100%)}
.mock-page,.composer{padding:12px;display:grid;gap:8px}
.mock-page h4{font-size:1.22rem}
.mock-page .btn{justify-self:start}
.mock-link{color:var(--accent);text-decoration:underline;border-color:var(--line)}
.search-bar{border-radius:9px}
.search-result{display:grid;gap:4px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--input)}
.search-result button{text-align:left}
.search-result small{padding-left:5px}
.window-bar{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:9px;background:#285267;color:var(--ink)}
.incident{display:grid;gap:5px;padding:11px;border-radius:9px;background:#4c3e27;border:1px solid #9d8864}
.incident .badge{justify-self:start}
.safety-actions{grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr))}
.mind-tree{background:var(--input);border:1px solid var(--line);border-radius:9px;padding:10px}
.mind-root{background:var(--accent);color:var(--teal-ink);padding:7px 13px;border-radius:8px;text-align:center;font-weight:820;max-width:330px;margin:0 auto 12px}
.mind-branch{border-top:3px solid var(--accent);background:var(--panel);border-radius:6px;padding:7px}
.mind-branch ul{padding-left:15px;margin:4px 0;font-size:.8rem}
.paper{color:#17241f;max-width:410px;min-height:174px;margin-inline:auto;background:white;box-shadow:0 7px 24px #1e292821;border:1px solid var(--line);padding:9px var(--paper-margin,10%) 14px;width:100%}
.paper.landscape{max-width:630px;min-height:123px}
.paper.preview{outline:2px solid var(--accent);outline-offset:3px}
.paper h4{font-size:1.18rem;margin-bottom:7px}
.paper-watermark{font-size:.64rem;letter-spacing:.13em;color:#52615b;margin-bottom:9px}
.edit-table input{min-width:58px;min-height:35px;padding:4px}
.edit-table th,.edit-table td{padding:5px}
.draft-text{color:#17241f;padding:13px;border:1px solid var(--line);border-radius:8px;background:#f8edcf;min-height:62px;font-family:Georgia,serif;font-size:1.08rem}
.draft-text mark{background:#ffce63;padding:2px}
.binder-shelf{display:flex;gap:6px;flex-wrap:wrap}
.binder-page{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:8px;background:var(--input)}
.page-number{display:grid;place-items:center;width:24px;height:26px;background:#285267;font-size:.78rem;font-weight:850;border-radius:4px}
.robot-map{display:grid;gap:7px}
.robot-track{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.track-cell{display:grid;place-items:center;min-height:43px;border:1px solid var(--line);border-radius:6px;background:var(--input);font-size:1.03rem}
.track-cell.target{border-color:var(--accent);background:#285267}
.scratch-stage{display:flex;gap:13px;align-items:center;min-height:91px;border-radius:10px;border:1px solid var(--line);background:repeating-linear-gradient(0deg,var(--input) 0 17px,var(--card) 18px 19px);padding:8px}
.scratch-cat{font-size:2.55rem}
.speech{color:#17241f;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:.9rem}
.scratch-script{display:grid;gap:4px;max-width:640px}
.scratch-hat,.scratch-block{border-radius:9px;padding:6px 9px}
.scratch-hat{background:#f2c65a;color:#402d0c;font-weight:820}
.scratch-block .field-label{color:#17241f}
.scratch-block.sb0{background:#9ed5f1}
.scratch-block.sb1{background:#ffc895}
.scratch-block.sb2{background:#e1c4ff}
@media (max-width: 850px) {
  .stage-list { grid-template-columns: repeat(3, minmax(0,1fr)) }
  .course-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 600px) {
  .answer-options, .form-grid { grid-template-columns: 1fr }
  .header-inner { align-items: flex-start; flex-direction: column; padding-block: 12px }
  .stage-list { grid-template-columns: repeat(2, minmax(0,1fr)) }
  .room-button { min-height: 138px }
  .site-footer > div, .section-head { flex-direction: column; align-items: flex-start }
  .signal-band { grid-template-columns: repeat(2, 1fr) }
  .binder-page { grid-template-columns: auto 1fr }
  .binder-page .tool-row { grid-column: 2 }
}
@media (max-width: 355px) {
  .brand { font-size: .85rem }
  .course-grid { grid-template-columns: 1fr }
  .dispatch-row { grid-template-columns: 1fr }
  .flow-track { grid-template-columns: repeat(2, 1fr) }
}
@media (prefers-reduced-motion: reduce) {
  .award { animation: none }
}

.logo { font-size: 1.45rem; font-weight: 950; letter-spacing: .025em; line-height: 1.2 }
.logo em { color: var(--accent); font-style: normal }
.brand-subtitle { color: var(--muted); font-size: .75rem }
.header-stats { display: flex; gap: .5rem; flex-wrap: wrap }
.stat-pill { padding: .42rem .7rem; border: 1px solid #466783; border-radius: 20px; background: #1a3857; font-size: .8rem; white-space: nowrap }
.hero-watermark { position: absolute; right: 6%; top: 0; font-size: clamp(5rem, 15vw, 10rem); opacity: .16; pointer-events: none }
.room-button {
  position: relative;
  display: grid;
  align-content: start;
  gap: .4rem;
  width: 100%;
  min-height: 158px;
  padding: 15px 12px;
  border: 1px solid #466785;
  border-radius: 17px;
  background: linear-gradient(140deg,#204365,#122740);
  text-align: left;
  overflow-wrap: anywhere;
}
.room-button:not(:disabled):hover { border-color: var(--accent) }
.room-button small { color: var(--muted) }
.room-icon { font-size: 2.35rem; line-height: 1.15 }
.room-seal { position: absolute; right: 10px; top: 8px; color: var(--gold) }
.stage-row > .btn { justify-self: start; margin-inline: .65rem }
.question-kind { font-size: .8rem; color: var(--gold); font-weight: 800 }
.lab-next { margin-top: 1rem }
.final-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1rem }
.certificate-view > .btn { margin-bottom: 1rem }
.certificate-card {
  display: grid;
  justify-items: center;
  gap: .8rem;
  padding: clamp(1rem, 5vw, 3rem);
  border: 5px double #c29a4c;
  border-radius: 15px;
  background: #fff8e7;
  color: #142a43;
  text-align: center;
}
.certificate-card .eyebrow { color: #1d6358 }
.certificate-card h1 { font-size: clamp(1.5rem, 4vw, 2.4rem) }
.certificate-icon { font-size: 3rem; line-height: 1 }
.certificate-recipient { color: #155344; font-weight: 850; font-size: 1.4rem; overflow-wrap: anywhere }
.certificate-recipient:empty { display: none }
.certificate-date { color: #41546b }

.chart-line { aspect-ratio: 2.4 }
.scratch-path { aspect-ratio: 1 }
.plot-edge { position: absolute; display: block; height: 3px; background: var(--accent); transform-origin: left center }
.plot-dot { position: absolute; width: .65rem; height: .65rem; border-radius: 50%; background: var(--gold); transform: translate(-50%,-50%); z-index: 1 }
.mock-pages { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 auto }
.mock-page { flex: 1 1 8rem; position: relative; background: #fff5df; color: #192a3a; min-height: 8rem; padding: .6rem .8rem; border-radius: .4rem; display: grid; gap: .5rem }
.mock-page :is(ul,ol) { margin: 0; padding-left: 1.3rem }
.mock-dark { background: #173954; color: #fff }
.mock-low { color: #788fa3 }
.mock-header, .mock-footer { display: block; min-height: .9rem; font-size: .75rem }
.mock-footer { text-align: right }
.mock-line { display: block; width: 85%; height: .2rem; background: #c3c6b9 }
.mock-document-picture { background: #b6e9dc; border-radius: .3rem; padding: .35rem; text-align: center }
.mock-cover { position: absolute; inset: 25% 10% auto }
.mock-photo { max-width: 22rem; margin: .25rem auto; aspect-ratio: 3 / 2; background: #9ed1e4; border-radius: .6rem; overflow: hidden; position: relative; isolation: isolate }
.mock-landscape { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(#86c7e1 0 64%,#6fa761 64%); transition: transform .2s,filter .2s }
.mock-sun { position: absolute; top: 14%; left: 66%; width: 16%; aspect-ratio: 1; border-radius: 100%; background: #ffdf80 }
.mock-hill { position: absolute; width: 65%; height: 48%; bottom: 10%; left: -8%; border-radius: 55% 60% 0 0; background: #52935c }
.mock-hill.back { width: 75%; left: 40%; height: 41%; background: #3d7b55 }
.mock-tree { position: absolute; bottom: 10%; left: 24%; font-size: clamp(2.4rem,12vw,5rem) }
.mock-caption { position: absolute; right: .6rem; bottom: .5rem; color: #fff; background: #142a42; border-radius: .25rem; padding: .2rem .55rem; font-weight: 700 }
.mock-caption-center { inset: 38% auto auto 20% }
.mock-caption-low { background: #cbd5cc; color: #aab9aa }
.mock-tilt { transform: rotate(-8deg) scale(.92) }
.mock-cropped { max-width: 15rem; aspect-ratio: 1 }
.mock-stretched { transform: scaleX(1.35) }
.mock-framed::after, .mock-covered::after { content: ''; position: absolute; inset: 0; border: .6rem solid #ffda77; pointer-events: none }
.mock-covered::after { background: #ffda77 }
@media (prefers-reduced-motion: reduce) { .mock-landscape { transition: none } }

.lesson-panel:not(.certificate-view) {

<script>
'use strict';
const BANK={"1":{"n":1,"code":"1","title":"Em có thể làm gì với máy tính?","pages":"5–7","stages":[{"goal":"Gọi tên công việc theo mục đích sử dụng.","study":{"points":["Máy tính giúp em học, giải trí, tìm và trao đổi thông tin, hợp tác với bạn bè và tạo sản phẩm số.","Luyện gõ phím là học. Gọi video cho bạn là trao đổi. Làm thiệp trên máy là tạo sản phẩm số.","Dùng máy tính hợp lí còn giúp bảo vệ mắt và cơ thể."],"example":"Tập gõ bằng phần mềm là một cách học kĩ năng mới."},"tasks":[{"id":"T5-B01-C01","prompt":"Mục nào tương ứng với mô tả “Tra cứu bài học và luyện tập bằng phần mềm”?","type":"choice","choices":["Học tập","Trao đổi thông tin","Tạo sản phẩm số","Cả ba mục đều có cùng vai trò."],"correct":[0],"why":"Học tập: Tra cứu bài học và luyện tập bằng phần mềm."},{"id":"T5-B01-C02","prompt":"Mục nào có đặc điểm “Gửi lời nhắn hoặc gọi video”?","type":"choice","choices":["Trao đổi thông tin","Học tập","Tạo sản phẩm số","Cả ba mục đều có đặc điểm này."],"correct":[0],"why":"Trao đổi thông tin: Gửi lời nhắn hoặc gọi video."},{"id":"T5-B01-C03","prompt":"Chọn mô tả đúng cho “Tạo sản phẩm số”.","type":"choice","choices":["Soạn thiệp hoặc dựng video","Tra cứu bài học và luyện tập bằng phần mềm","Gửi lời nhắn hoặc gọi video","Ba mô tả đều đúng."],"correct":[0],"why":"Tạo sản phẩm số: Soạn thiệp hoặc dựng video."},{"id":"T5-B01-C04","prompt":"Chọn hai việc có thể tạo ra sản phẩm số.","type":"multi","choices":["Vẽ bưu thiếp bằng phần mềm","Đọc thông báo trên trang trường","Soạn bài trình chiếu","Xem phim hoạt hình"],"correct":[0,2],"why":"Tệp thiệp và bài trình chiếu là sản phẩm em làm ra."},{"id":"T5-B01-C05","prompt":"Bạn gán mô tả “Tra cứu bài học và luyện tập bằng phần mềm” cho “Tạo sản phẩm số”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Học tập”.","Mô tả đúng cho cả ba mục.","Gán nhầm. Mô tả này thuộc “Trao đổi thông tin”.","Gán đúng cho “Tạo sản phẩm số”."],"correct":[0],"why":"Mô tả thuộc mục “Học tập”."}]},{"goal":"Phân biệt học, giải trí, trao đổi và sáng tạo.","study":{"points":["Cùng một thiết bị có thể phục vụ nhiều mục đích. Đọc tài liệu để hiểu bài, xem phim để giải trí và gửi lời nhắn để trao đổi là ba việc khác nhau.","Hỏi người dùng muốn đạt điều gì, rồi mới gọi tên hoạt động.","Một thiết bị có thể giúp làm nhiều việc. Hãy nhìn vào việc em định làm ngay lúc đó."],"example":"Lúc tìm hiểu, Minh đọc tư liệu. Khi nhóm cần góp ý, Minh gửi bản nháp cho bạn."},"tasks":[{"id":"T5-B01-C06","prompt":"Ghép từng mô tả với tên phù hợp.","type":"match","groups":["Học tập","Trao đổi thông tin","Tạo sản phẩm số"],"items":["Tra cứu bài học và luyện tập bằng phần mềm","Gửi lời nhắn hoặc gọi video","Soạn thiệp hoặc dựng video"],"assign":[0,1,2],"grouping":false,"why":"Học tập → Tra cứu bài học và luyện tập bằng phần mềm · Trao đổi thông tin → Gửi lời nhắn hoặc gọi video · Tạo sản phẩm số → Soạn thiệp hoặc dựng video."},{"id":"T5-B01-C07","prompt":"Mai mở phần mềm để sửa ảnh cho báo tường. Máy tính giúp Mai làm việc gì ngay lúc này?","type":"choice","choices":["Chỉnh sửa sản phẩm số","Trao đổi tin nhắn","Điều khiển trò chơi","Tra địa chỉ trường"],"correct":[0],"why":"Sửa ảnh là một bước tạo sản phẩm số."},{"id":"T5-B01-C08","prompt":"Chọn hai thẻ có phần tên và mô tả khớp nhau.","type":"multi","choices":["Học tập — Tra cứu bài học và luyện tập bằng phần mềm","Trao đổi thông tin — Soạn thiệp hoặc dựng video","Tạo sản phẩm số — Soạn thiệp hoặc dựng video","Tạo sản phẩm số — Gửi lời nhắn hoặc gọi video"],"correct":[0,2],"why":"B phải ghép với “Gửi lời nhắn hoặc gọi video”, còn D dùng mô tả của “Trao đổi thông tin”."},{"id":"T5-B01-C09","prompt":"Hai mô tả lần lượt là “Tra cứu bài học và luyện tập bằng phần mềm” và “Gửi lời nhắn hoặc gọi video”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Học tập” và “Trao đổi thông tin”.","Hai mô tả có cùng ý nghĩa.","Chúng mô tả lần lượt “Trao đổi thông tin” và “Học tập”.","Chúng đều mô tả “Tạo sản phẩm số”."],"correct":[0],"why":"Chúng mô tả lần lượt “Học tập” và “Trao đổi thông tin”."},{"id":"T5-B01-C10","prompt":"Chọn lời giải thích phân biệt “Học tập” với “Tạo sản phẩm số”.","type":"choice","choices":["Học tập — Tra cứu bài học và luyện tập bằng phần mềm. Tạo sản phẩm số — Soạn thiệp hoặc dựng video.","Học tập — Gửi lời nhắn hoặc gọi video. Tạo sản phẩm số — Soạn thiệp hoặc dựng video.","Học tập — Tra cứu bài học và luyện tập bằng phần mềm. Tạo sản phẩm số — Gửi lời nhắn hoặc gọi video.","Học tập — Soạn thiệp hoặc dựng video. Tạo sản phẩm số — Tra cứu bài học và luyện tập bằng phần mềm."],"correct":[0],"why":"Học tập — Tra cứu bài học và luyện tập bằng phần mềm. Tạo sản phẩm số — Soạn thiệp hoặc dựng video."}]},{"goal":"Dùng phím điều khiển và kiểm tra đường đi.","study":{"points":["Trong trò Mê cung trên Scratch, nháy cờ xanh để bắt đầu và dùng các phím mũi tên để điều khiển chú chuột từ lối vào đến lối ra.","Khi nêu ví dụ, hãy nói rõ em dùng công cụ nào và để làm gì. Chẳng hạn, dùng các phím mũi tên để điều khiển chú chuột.","Quan sát vị trí nhân vật sau từng bước. Trong mê cung, chọn đường trống tới đích."],"example":"Nếu đích ở bên phải và ô kế bên trống, phím mũi tên phải đưa nhân vật gần đích hơn."},"tasks":[{"id":"T5-B01-C11","prompt":"Xếp các việc để chơi một lượt Mê cung trên Scratch.","type":"order","steps":["Dùng phím mũi tên đưa chuột đi","Mở dự án Mê cung","Kiểm tra chuột đã tới lối ra","Nháy cờ xanh"],"sequence":[1,3,0,2],"why":"Mở dự án và khởi động trước khi điều khiển."},{"id":"T5-B01-C12","prompt":"Màn hình hiện đường trống sang phải rồi rẽ lên. Em có thể làm gì để đi đúng?","type":"multi","choices":["Dùng phím phải cho đoạn đầu","Dùng phím xuống cho đoạn rẽ lên","Quan sát nhân vật sau khi đi","Dùng phím lên tại chỗ rẽ"],"correct":[0,2,3],"why":"Hướng đi theo đường trống và được kiểm tra trên màn hình."},{"id":"T5-B01-C13","prompt":"Em muốn luyện đánh máy trước khi gõ bài. Em nên mở gì?","type":"choice","choices":["Phần mềm luyện gõ","Phần mềm tô màu","Trình phát nhạc","Dự án mê cung"],"correct":[0],"why":"Phần mềm luyện gõ hỗ trợ trực tiếp kĩ năng bàn phím."},{"id":"T5-B01-C14","prompt":"Ghép việc cần làm với công cụ phù hợp.","type":"match","groups":["Trình soạn thảo","Công cụ trình chiếu","Phần mềm vẽ"],"items":["Gõ nội dung thư mời","Làm bộ trang giới thiệu đội","Vẽ hình linh vật"],"assign":[0,1,2],"grouping":false,"why":"Chọn công cụ dựa trên sản phẩm cần tạo."},{"id":"T5-B01-C15","prompt":"Em muốn trao đổi góp ý với bạn đang ở nhà. Việc nào giúp bạn phản hồi?","type":"choice","choices":["Gửi lời nhắn và câu hỏi cụ thể","Lưu tệp trên máy rồi tắt máy","Chỉ mở bản nháp trên màn hình của em","Chơi cùng một trò nhưng ở lượt khác"],"correct":[0],"why":"Tin nhắn có câu hỏi giúp bạn hiểu điều cần góp ý."}]},{"goal":"Nhận ra công cụ và thao tác chưa phù hợp.","study":{"points":["Muốn chọn phần mềm phù hợp, hãy dựa vào việc cần làm. Phần mềm trình chiếu giúp trình bày ý tưởng, còn phần mềm luyện gõ giúp rèn thao tác bàn phím.","Xem lại mục đích nếu tên hoạt động và phần mô tả chưa khớp.","Khi một việc không thành công, kiểm tra mục đích và thao tác vừa làm."],"example":"Nếu chuột chưa đi vì dự án chưa chạy, hãy khởi động trước khi đổi phím."},"tasks":[{"id":"T5-B01-C16","prompt":"Đã mở dự án nhưng chưa nháy cờ xanh, bấm phím không thấy chuột di chuyển. Em kiểm tra gì trước?","type":"choice","choices":["Dự án đã được bắt đầu chưa","Đã vẽ một thiệp mới chưa","Đã đổi tên máy chưa","Đã in bài chưa"],"correct":[0],"why":"Cờ xanh bắt đầu lượt chơi trong dự án này."},{"id":"T5-B01-C17","prompt":"Hà ngồi sát màn hình và mỏi mắt sau khi làm bài lâu. Hai cách nào hợp lí?","type":"multi","choices":["Ngồi thẳng và điều chỉnh khoảng cách","Tạm nghỉ, nhìn ra xa rồi mới tiếp tục","Cúi sát hơn để nhìn rõ","Tăng thời gian dùng máy liên tục"],"correct":[0,1],"why":"Tư thế phù hợp và nghỉ mắt giúp dùng máy tính lành mạnh."},{"id":"T5-B01-C18","prompt":"Bạn mở trình phát nhạc để gõ một thư mời. Sửa thế nào?","type":"choice","choices":["Dùng trình soạn thảo văn bản","Dùng nút phát chậm hơn","Tăng âm lượng rồi gõ","Đổi tên bản nhạc thành Thư mời"],"correct":[0],"why":"Công cụ soạn thảo cho phép nhập và sửa chữ."},{"id":"T5-B01-C19","prompt":"Ghép trở ngại với việc xử lí trước.","type":"match","groups":["Xem lại đường","Chọn phần mềm khác","Gửi cho bạn"],"items":["Dự án đang chạy nhưng chuột gặp tường","Cần vẽ nhưng đang mở trình nghe nhạc","Đã làm tệp nhưng bạn chưa nhận"],"assign":[0,1,2],"grouping":false,"why":"Xác định đúng trở ngại để chọn bước tiếp theo."},{"id":"T5-B01-C20","prompt":"Tổ tưởng đã hoàn thành việc hợp tác vì một bạn lưu tệp. Dấu hiệu nào còn thiếu?","type":"choice","choices":["Các bạn khác nhận và góp ý được","Bản tệp nằm ở màn hình máy đó","Tệp có thêm một hình","Bạn làm xong đóng cửa sổ"],"correct":[0],"why":"Hợp tác cần các thành viên có cơ hội tham gia."}]},{"goal":"Kết hợp công cụ, giao tiếp và thói quen dùng máy tốt.","study":{"points":["Một nhóm có thể tìm tư liệu, cùng soạn bài trình chiếu rồi chia sẻ bản hoàn chỉnh. Máy tính hỗ trợ cả học tập, hợp tác và tạo sản phẩm.","Tách từng việc trong tình huống để chỉ ra máy tính đã giúp ở bước nào.","Chia việc thành khâu tìm tư liệu, tạo sản phẩm và xin góp ý. Chừa thời gian nghỉ khi dùng máy lâu."],"example":"Một bạn viết lời giới thiệu, một bạn vẽ tranh, cả nhóm xem bản ghép rồi thống nhất."},"tasks":[{"id":"T5-B01-C21","prompt":"Xếp công việc làm bảng giới thiệu đội để cả nhóm có thể góp ý trước khi nộp.","type":"order","steps":["Ghép chữ và tranh vào bảng","Nộp bản đã sửa","Thống nhất bảng cần có nội dung gì","Gửi bản nháp để các bạn góp ý"],"sequence":[2,0,3,1],"why":"Cần có yêu cầu và bản nháp trước khi góp ý, rồi mới nộp."},{"id":"T5-B01-C22","prompt":"Nhóm cần hình linh vật tự làm và lời giới thiệu đọc được. Chọn hai việc đáp ứng trực tiếp.","type":"multi","choices":["Vẽ linh vật bằng phần mềm vẽ","Chỉ tìm hình trên Internet rồi bỏ qua nguồn","Gõ lời giới thiệu vào bản nháp","Mở nhạc thay phần giới thiệu"],"correct":[0,2],"why":"Hình tự vẽ và phần chữ đáp ứng hai yêu cầu."},{"id":"T5-B01-C23","prompt":"Ghép công việc trong ngày hội với mục đích chính.","type":"match","groups":["Học tập","Trao đổi","Tạo sản phẩm"],"items":["Tra ý nghĩa các biểu tượng tái chế","Hỏi bạn đã kiểm tra bản nháp chưa","Ghép ảnh tự vẽ và lời giới thiệu thành tệp"],"assign":[0,1,2],"grouping":false,"why":"Cùng một dự án gồm nhiều việc có mục đích khác nhau."},{"id":"T5-B01-C24","prompt":"Bài trình chiếu dùng trong lớp không có mạng. Em chuẩn bị thế nào?","type":"choice","choices":["Lưu tệp và ảnh cần trình chiếu trên máy rồi mở thử","Chỉ ghi nhớ tên trang đang xem","Chỉ gửi liên kết ảnh cho chính mình","Để ảnh mở sẵn trên trang và chờ có mạng"],"correct":[0],"why":"Tệp lưu trên máy có thể được kiểm tra trước khi trình chiếu."},{"id":"T5-B01-C25","prompt":"Chọn hai dấu hiệu nhóm đã dùng máy hiệu quả trong buổi chuẩn bị.","type":"multi","choices":["Có sản phẩm mở được và đúng nội dung","Có góp ý được xử lí trước khi nộp","Dùng nhiều giờ nhất lớp","Mở càng nhiều ứng dụng càng tốt"],"correct":[0,1],"why":"Sản phẩm và phản hồi cho biết công việc đã tiến triển."}]}],"extras":[]},"2":{"n":2,"code":"2","title":"Tìm kiếm thông tin trên website","pages":"8–13","stages":[{"goal":"Nhận ra thanh địa chỉ, ô tìm trong trang và liên kết.","study":{"points":["Để vào một website đã biết địa chỉ, mở trình duyệt rồi nhập địa chỉ vào thanh địa chỉ. Trang chủ thường có các mục theo chủ đề.","Tìm thông tin thể thao có thể bắt đầu từ mục Thể thao.","Mục theo chủ đề thường gom các bài viết cùng nội dung."],"example":"Vào trang trường bằng địa chỉ đã biết rồi chọn mục Hoạt động."},"tasks":[{"id":"T5-B02-C01","prompt":"Mục nào tương ứng với mô tả “Mở website có địa chỉ đã biết”?","type":"choice","choices":["Thanh địa chỉ","Cả ba mục đều có cùng vai trò.","Liên kết kết quả","Ô tìm kiếm của website"],"correct":[0],"why":"Thanh địa chỉ: Mở website có địa chỉ đã biết."},{"id":"T5-B02-C02","prompt":"Mục nào có đặc điểm “Tìm bài trong phạm vi website đang xem”?","type":"choice","choices":["Ô tìm kiếm của website","Liên kết kết quả","Cả ba mục đều có đặc điểm này.","Thanh địa chỉ"],"correct":[0],"why":"Ô tìm kiếm của website: Tìm bài trong phạm vi website đang xem."},{"id":"T5-B02-C03","prompt":"Chọn mô tả đúng cho “Liên kết kết quả”.","type":"choice","choices":["Mở bài viết có tiêu đề phù hợp","Tìm bài trong phạm vi website đang xem","Mở website có địa chỉ đã biết","Ba mô tả đều đúng."],"correct":[0],"why":"Liên kết kết quả: Mở bài viết có tiêu đề phù hợp."},{"id":"T5-B02-C04","prompt":"Chọn hai cách tìm một bài ngay trong website đang mở.","type":"multi","choices":["Mở danh mục phù hợp","Gõ từ khóa vào ô tìm trên trang","Đổi hình nền máy","Mở thư mục Tải xuống dù chưa tải bài"],"correct":[0,1],"why":"Danh mục và ô tìm trong trang giúp tiếp cận bài viết của website."},{"id":"T5-B02-C05","prompt":"Bạn gán mô tả “Mở website có địa chỉ đã biết” cho “Liên kết kết quả”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Thanh địa chỉ”.","Gán đúng cho “Liên kết kết quả”.","Gán nhầm. Mô tả này thuộc “Ô tìm kiếm của website”.","Mô tả đúng cho cả ba mục."],"correct":[0],"why":"Mô tả thuộc mục “Thanh địa chỉ”."}]},{"goal":"Giải thích khi nào dùng danh mục, khi nào dùng từ khóa.","study":{"points":["Có hai cách tìm trong một website: duyệt các chủ đề hoặc dùng công cụ tìm kiếm của chính website đó.","Thanh địa chỉ dùng để mở website. Ô tìm kiếm trên trang dùng để tìm bài trong website.","Khi đã nhớ vài từ trong tiêu đề, dùng chính các từ ấy để tìm trong trang."],"example":"Chưa biết tên bài, em có thể bắt đầu từ mục Thư viện."},"tasks":[{"id":"T5-B02-C06","prompt":"Ghép từng mô tả với tên phù hợp.","type":"match","groups":["Thanh địa chỉ","Ô tìm kiếm của website","Liên kết kết quả"],"items":["Mở website có địa chỉ đã biết","Tìm bài trong phạm vi website đang xem","Mở bài viết có tiêu đề phù hợp"],"assign":[0,1,2],"grouping":false,"why":"Thanh địa chỉ → Mở website có địa chỉ đã biết · Ô tìm kiếm của website → Tìm bài trong phạm vi website đang xem · Liên kết kết quả → Mở bài viết có tiêu đề phù hợp."},{"id":"T5-B02-C07","prompt":"Em biết tin nằm trong mục Thể thao và muốn xem các tin gần đây trong mục đó. Em nên làm gì?","type":"choice","choices":["Mở mục Thể thao trên trang","Mở mục Tuyển sinh","Gõ lại địa chỉ trang rồi đóng","Tìm ở thư mục Hình ảnh trên máy"],"correct":[0],"why":"Danh mục cho phép xem các tin cùng chủ đề."},{"id":"T5-B02-C08","prompt":"Chọn hai thẻ có phần tên và mô tả khớp nhau.","type":"multi","choices":["Thanh địa chỉ — Mở website có địa chỉ đã biết","Ô tìm kiếm của website — Mở bài viết có tiêu đề phù hợp","Liên kết kết quả — Mở bài viết có tiêu đề phù hợp","Liên kết kết quả — Tìm bài trong phạm vi website đang xem"],"correct":[0,2],"why":"B phải ghép với “Tìm bài trong phạm vi website đang xem”, còn D dùng mô tả của “Ô tìm kiếm của website”."},{"id":"T5-B02-C09","prompt":"Hai mô tả lần lượt là “Mở website có địa chỉ đã biết” và “Tìm bài trong phạm vi website đang xem”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Thanh địa chỉ” và “Ô tìm kiếm của website”.","Hai mô tả có cùng ý nghĩa.","Chúng mô tả lần lượt “Ô tìm kiếm của website” và “Thanh địa chỉ”.","Chúng đều mô tả “Liên kết kết quả”."],"correct":[0],"why":"Chúng mô tả lần lượt “Thanh địa chỉ” và “Ô tìm kiếm của website”."},{"id":"T5-B02-C10","prompt":"Chọn lời giải thích phân biệt “Thanh địa chỉ” với “Liên kết kết quả”.","type":"choice","choices":["Thanh địa chỉ — Mở website có địa chỉ đã biết. Liên kết kết quả — Mở bài viết có tiêu đề phù hợp.","Thanh địa chỉ — Mở bài viết có tiêu đề phù hợp. Liên kết kết quả — Mở website có địa chỉ đã biết.","Thanh địa chỉ — Tìm bài trong phạm vi website đang xem. Liên kết kết quả — Mở bài viết có tiêu đề phù hợp.","Thanh địa chỉ — Mở website có địa chỉ đã biết. Liên kết kết quả — Tìm bài trong phạm vi website đang xem."],"correct":[0],"why":"Thanh địa chỉ — Mở website có địa chỉ đã biết. Liên kết kết quả — Mở bài viết có tiêu đề phù hợp."}]},{"goal":"Thực hiện quy trình tìm trong website bằng từ khóa.","study":{"points":["Nhập từ khóa vào ô tìm kiếm của website, thực hiện tìm kiếm, rồi mở kết quả phù hợp để đọc nội dung.","Đọc tiêu đề kết quả và kiểm tra bài có đúng chủ đề được giao.","Đọc tiêu đề và đoạn giới thiệu trước khi mở. Sau khi mở, kiểm tra nội dung có đúng điều cần tìm."],"example":"Tìm “lịch hội khỏe” khi muốn biết ngày tổ chức hội khỏe của trường."},"tasks":[{"id":"T5-B02-C11","prompt":"Em đã biết địa chỉ trang trường. Xếp các bước tìm thông báo hội sách bằng ô tìm trong trang.","type":"order","steps":["Mở kết quả có tiêu đề phù hợp","Gõ “hội sách” vào ô tìm trên trang","Mở website trường","Thực hiện tìm kiếm"],"sequence":[2,1,3,0],"why":"Tới đúng website, nhập từ khóa, tìm và đọc kết quả."},{"id":"T5-B02-C12","prompt":"Muốn biết giờ khai mạc hội sách năm nay, em nên xem hai chi tiết nào trong bài?","type":"multi","choices":["Năm tổ chức","Cỡ chữ của tiêu đề","Giờ khai mạc","Màu nền trang"],"correct":[0,2],"why":"Năm giúp chọn đúng đợt, giờ cho biết thời điểm."},{"id":"T5-B02-C13","prompt":"Có ba bài “Hội sách lớp 3”, “Lịch hội sách lớp 5”, “Ảnh hội sách năm ngoái”. Muốn biết ngày hội của lớp 5, mở bài nào trước?","type":"choice","choices":["Lịch hội sách lớp 5","Hội sách lớp 3","Ảnh hội sách năm ngoái","Bài có nhiều ảnh nhất"],"correct":[0],"why":"Tiêu đề cho biết đúng lớp và loại thông tin cần tìm."},{"id":"T5-B02-C14","prompt":"Ghép ý cần tìm với cụm từ khóa cụ thể.","type":"match","groups":["Lịch bơi lớp 5","Kết quả thi vẽ","Địa chỉ thư viện"],"items":["Thời gian lớp 5 đi bơi","Danh sách bạn đạt giải vẽ","Vị trí cần đến để mượn sách"],"assign":[0,1,2],"grouping":false,"why":"Từ khóa có các từ chỉ đúng chủ đề và mục đích."},{"id":"T5-B02-C15","prompt":"Bài tìm được có lịch đúng sự kiện nhưng em chưa thấy giờ. Em làm gì tiếp?","type":"choice","choices":["Đọc phần lịch chi tiết hoặc tệp lịch kèm theo","Đoán giờ từ ảnh bìa","Dùng giờ của sự kiện khác","Ghi giờ bất kì rồi gửi nhóm"],"correct":[0],"why":"Cần xem đúng phần chi tiết để lấy giờ."}]},{"goal":"Điều chỉnh từ khóa, phạm vi hoặc bài đã mở.","study":{"points":["Khi tìm theo mục chưa thấy bài cần đọc, thử dùng ô tìm kiếm. Từ khóa cụ thể giúp phân biệt những bài viết cùng chủ đề.","Thêm tên sự kiện nếu từ khóa đang quá chung.","Kết quả ít có thể do từ khóa quá hẹp hoặc gõ sai. Kết quả quá nhiều thường cần thêm từ phân biệt."],"example":"Thay “hội” bằng “hội khỏe lớp 5” khi kết quả gồm nhiều hội khác nhau."},"tasks":[{"id":"T5-B02-C16","prompt":"Em gõ “sách” và thấy hàng chục bài. Muốn tìm bài về đổi sách cũ, em sửa từ khóa ra sao?","type":"choice","choices":["Đổi sách cũ","Sách","Hội","Bài viết"],"correct":[0],"why":"Cụm cụ thể tách hoạt động đổi sách khỏi các tin khác."},{"id":"T5-B02-C17","prompt":"Ô tìm trong trang báo chưa có kết quả cho “thư việbn”. Hai việc nào nên thử?","type":"multi","choices":["Sửa từ thành “thư viện”","Xem mục Thư viện nếu trang có mục đó","Đổi hình nền máy","Chép tiêu đề đầu tiên của trang"],"correct":[0,1],"why":"Sửa lỗi gõ hoặc đổi sang duyệt danh mục."},{"id":"T5-B02-C18","prompt":"Ghép lỗi với cách xử lí phù hợp.","type":"match","groups":["Thêm từ phân biệt","Kiểm tra ngày và nội dung","Mở ô tìm trong trang"],"items":["Quá nhiều bài về cắm trại","Mở trúng tin năm trước","Đang gõ từ vào thanh địa chỉ thay vì ô tìm của trang"],"assign":[0,1,2],"grouping":false,"why":"Mỗi lỗi cần chỉnh đúng chỗ."},{"id":"T5-B02-C19","prompt":"Em gửi cho nhóm tiêu đề bài nhưng bạn không biết mở ở đâu. Bổ sung gì hữu ích nhất?","type":"choice","choices":["Đường dẫn đúng tới bài đã kiểm tra","Màu chữ của tiêu đề","Số kí tự của địa chỉ","Giờ em đọc bài"],"correct":[0],"why":"Liên kết giúp bạn mở đúng bài."},{"id":"T5-B02-C20","prompt":"Máy có hai tệp “lich.pdf”, một ở Downloads và một trên USB. Trước khi giao tệp cho nhóm em nên làm gì?","type":"choice","choices":["Mở tệp trên USB và kiểm tra có đúng lịch mới","Chọn bất kì tệp cùng tên","Đổi tên cả hai thành Anh.png","Xóa bản gốc trước khi thử"],"correct":[0],"why":"Tên giống nhau chưa đủ để xác định nội dung."}]},{"goal":"Tìm đúng phiên bản và chuyển cho người cần dùng.","study":{"points":["Các thành viên có thể chia nhau tìm tư liệu, rồi chia sẻ thông tin để hoàn thành việc chung. Sách minh họa cách chuyển tệp bằng USB.","Khi dùng USB, chờ chép xong và ngắt kết nối an toàn trước khi rút.","Khi chuyển tệp bằng USB, tìm tệp gốc, sao chép vào USB và kiểm tra bản đã chép."],"example":"Nhóm cần lịch mới. Em xác nhận ngày trên trang trường rồi kiểm tra tệp lưu trên USB."},"tasks":[{"id":"T5-B02-C21","prompt":"Nhóm chỉ cần lịch hội sách mới của lớp 5. Chọn hai dấu hiệu giúp xác nhận bài phù hợp.","type":"multi","choices":["Tiêu đề nêu hội sách lớp 5","Nội dung ghi đợt tổ chức sắp tới","Ảnh bìa màu sáng","Có nhiều bình luận hơn bài khác"],"correct":[0,1],"why":"Đúng lớp và đúng đợt là hai tiêu chí của nhóm."},{"id":"T5-B02-C22","prompt":"Xếp quy trình giao bản lịch đã tải cho bạn bằng USB.","type":"order","steps":["Kiểm tra mở được bản trong USB","Sao chép tệp lịch vào USB","Cắm USB","Mở thư mục chứa tệp lịch vừa tải"],"sequence":[2,3,1,0],"why":"Sau khi cắm, tìm bản gốc, chép và kiểm tra bản đích."},{"id":"T5-B02-C23","prompt":"Ghép nhu cầu mới với nơi tìm phù hợp nhất.","type":"match","groups":["Ô tìm trên trang","Danh mục","Thư mục trên USB"],"items":["Đã biết cụm “đổi sách” trong tiêu đề","Muốn xem chung các tin Thư viện","Muốn kiểm tra tệp đã sao chép"],"assign":[0,1,2],"grouping":false,"why":"Tìm nội dung trên trang và kiểm tra tệp lưu là hai việc khác nhau."},{"id":"T5-B02-C24","prompt":"Bài cũ có giờ 7:00. Thông báo mới của trường sửa giờ thành 7:30. Gửi nhóm thông tin nào?","type":"choice","choices":["7:30 và liên kết thông báo mới","7:00 vì đã thấy trước","Cả hai giờ mà không ghi nguồn","Giờ bất kì nằm giữa hai mốc"],"correct":[0],"why":"Thông báo mới có nội dung điều chỉnh là căn cứ cho nhóm."},{"id":"T5-B02-C25","prompt":"Trước khi gửi tệp lịch cho tổ, chọn hai cách kiểm tra.","type":"multi","choices":["Mở tệp để đọc ngày giờ","Kiểm tra tên và nơi lưu của bản sẽ gửi","Chỉ nhìn màu biểu tượng","Xóa nguồn sau khi tải"],"correct":[0,1],"why":"Đọc nội dung và xác định đúng tệp tránh gửi nhầm."}]}],"extras":[]},"3":{"n":3,"code":"3","title":"Tìm kiếm thông tin trong giải quyết vấn đề","pages":"14–18","stages":[{"goal":"Nhận ra câu hỏi phải trả lời trước khi quyết định.","study":{"points":["Thông tin giúp em ra quyết định. Trước hết, xác định việc cần giải quyết và những điều em còn chưa biết.","Muốn chọn điểm tham quan, cần biết địa điểm và điều kiện đi lại.","Thông tin hữu ích trả lời đúng câu hỏi mà nhóm đang gặp."],"example":"Muốn chọn buổi tham quan, trước tiên tìm giờ mở cửa."},"tasks":[{"id":"T5-B03-C01","prompt":"Mục nào tương ứng với mô tả “Nêu thông tin còn thiếu để ra quyết định”?","type":"choice","choices":["Xác định nhu cầu","Tìm thông tin","Cả ba mục đều có cùng vai trò.","Sử dụng thông tin"],"correct":[0],"why":"Xác định nhu cầu: Nêu thông tin còn thiếu để ra quyết định."},{"id":"T5-B03-C02","prompt":"Mục nào có đặc điểm “Chọn nguồn hoặc từ khóa phù hợp”?","type":"choice","choices":["Tìm thông tin","Sử dụng thông tin","Cả ba mục đều có đặc điểm này.","Xác định nhu cầu"],"correct":[0],"why":"Tìm thông tin: Chọn nguồn hoặc từ khóa phù hợp."},{"id":"T5-B03-C03","prompt":"Chọn mô tả đúng cho “Sử dụng thông tin”.","type":"choice","choices":["Đối chiếu kết quả với nhiệm vụ ban đầu","Nêu thông tin còn thiếu để ra quyết định","Ba mô tả đều đúng.","Chọn nguồn hoặc từ khóa phù hợp"],"correct":[0],"why":"Sử dụng thông tin: Đối chiếu kết quả với nhiệm vụ ban đầu."},{"id":"T5-B03-C04","prompt":"Lớp chọn buổi tham quan ngoài trời. Hai thông tin nào liên quan trực tiếp?","type":"multi","choices":["Dự báo thời tiết lúc đi","Màu bìa vở của lớp","Giờ mở cửa nơi tham quan","Tên bài hát bạn thích"],"correct":[0,2],"why":"Giờ mở cửa và thời tiết ảnh hưởng việc tổ chức chuyến đi."},{"id":"T5-B03-C05","prompt":"Bạn gán mô tả “Nêu thông tin còn thiếu để ra quyết định” cho “Sử dụng thông tin”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Xác định nhu cầu”.","Gán nhầm. Mô tả này thuộc “Tìm thông tin”.","Gán đúng cho “Sử dụng thông tin”.","Mô tả đúng cho cả ba mục."],"correct":[0],"why":"Mô tả thuộc mục “Xác định nhu cầu”."}]},{"goal":"Giải thích sự phù hợp giữa câu hỏi và nguồn.","study":{"points":["Thông tin cần tìm phụ thuộc vào vấn đề. Chẳng hạn, thời tiết có thể ảnh hưởng đến kế hoạch tham quan ngoài trời.","Chọn thông tin có ảnh hưởng đến quyết định của nhóm.","Có thể hỏi người biết rõ, đọc sách hoặc tìm trên website đáng tin cậy."],"example":"Để biết giờ mở cửa tuần này, xem thông báo của nơi tham quan."},"tasks":[{"id":"T5-B03-C06","prompt":"Ghép từng mô tả với tên phù hợp.","type":"match","groups":["Xác định nhu cầu","Tìm thông tin","Sử dụng thông tin"],"items":["Nêu thông tin còn thiếu để ra quyết định","Chọn nguồn hoặc từ khóa phù hợp","Đối chiếu kết quả với nhiệm vụ ban đầu"],"assign":[0,1,2],"grouping":false,"why":"Xác định nhu cầu → Nêu thông tin còn thiếu để ra quyết định · Tìm thông tin → Chọn nguồn hoặc từ khóa phù hợp · Sử dụng thông tin → Đối chiếu kết quả với nhiệm vụ ban đầu."},{"id":"T5-B03-C07","prompt":"Nhóm cần biết phòng truyền thống của trường có mở thứ Sáu không. Hỏi ai phù hợp nhất?","type":"choice","choices":["Thầy cô phụ trách phòng","Bạn chưa từng vào phòng","Người bán đồ ăn gần trường","Người kể chuyện về trường khác"],"correct":[0],"why":"Người phụ trách có thể xác nhận lịch mở."},{"id":"T5-B03-C08","prompt":"Chọn hai thẻ có phần tên và mô tả khớp nhau.","type":"multi","choices":["Xác định nhu cầu — Nêu thông tin còn thiếu để ra quyết định","Tìm thông tin — Đối chiếu kết quả với nhiệm vụ ban đầu","Sử dụng thông tin — Đối chiếu kết quả với nhiệm vụ ban đầu","Sử dụng thông tin — Chọn nguồn hoặc từ khóa phù hợp"],"correct":[0,2],"why":"B phải ghép với “Chọn nguồn hoặc từ khóa phù hợp”, còn D dùng mô tả của “Tìm thông tin”."},{"id":"T5-B03-C09","prompt":"Hai mô tả lần lượt là “Nêu thông tin còn thiếu để ra quyết định” và “Chọn nguồn hoặc từ khóa phù hợp”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Xác định nhu cầu” và “Tìm thông tin”.","Chúng mô tả lần lượt “Tìm thông tin” và “Xác định nhu cầu”.","Chúng đều mô tả “Sử dụng thông tin”.","Hai mô tả có cùng ý nghĩa."],"correct":[0],"why":"Chúng mô tả lần lượt “Xác định nhu cầu” và “Tìm thông tin”."},{"id":"T5-B03-C10","prompt":"Chọn lời giải thích phân biệt “Xác định nhu cầu” với “Sử dụng thông tin”.","type":"choice","choices":["Xác định nhu cầu — Nêu thông tin còn thiếu để ra quyết định. Sử dụng thông tin — Đối chiếu kết quả với nhiệm vụ ban đầu.","Xác định nhu cầu — Chọn nguồn hoặc từ khóa phù hợp. Sử dụng thông tin — Đối chiếu kết quả với nhiệm vụ ban đầu.","Xác định nhu cầu — Đối chiếu kết quả với nhiệm vụ ban đầu. Sử dụng thông tin — Nêu thông tin còn thiếu để ra quyết định.","Xác định nhu cầu — Nêu thông tin còn thiếu để ra quyết định. Sử dụng thông tin — Chọn nguồn hoặc từ khóa phù hợp."],"correct":[0],"why":"Xác định nhu cầu — Nêu thông tin còn thiếu để ra quyết định. Sử dụng thông tin — Đối chiếu kết quả với nhiệm vụ ban đầu."}]},{"goal":"Đặt từ khóa, chia việc và ghi lại kết quả.","study":{"points":["Khi làm việc nhóm, cùng thảo luận, chia việc và thống nhất kết quả. Có thể tìm tư liệu từ sách, hỏi người biết hoặc tra cứu trên Internet.","Mỗi bạn phụ trách một phần rồi báo lại kết quả cho cả nhóm.","Từ khóa nên có tên nơi, nội dung cần biết và mốc thời gian khi cần."],"example":"Để biết lịch tuần tới, thêm tên địa điểm và ngày dự định vào từ khóa."},"tasks":[{"id":"T5-B03-C11","prompt":"Xếp các bước quyết định có đi vườn trường chiều thứ Sáu không.","type":"order","steps":["Chọn phương án phù hợp với kết quả","Ghi điều cần biết về thời tiết và giờ mở","Tìm thông tin từ nguồn phù hợp","So thông tin với thời gian lớp rảnh"],"sequence":[1,2,3,0],"why":"Xác định nhu cầu rồi mới tìm, so và chọn."},{"id":"T5-B03-C12","prompt":"Nhóm tra giờ mở cửa và chi phí. Chọn hai việc giúp kiểm tra lại kết quả.","type":"multi","choices":["Ghi đường dẫn hoặc người đã trả lời","Ghi ngày thông tin được cập nhật","Chỉ ghi “đã tra”","Xóa hết các ghi chép"],"correct":[0,1],"why":"Nguồn và ngày giúp nhóm biết thông tin ở đâu và còn phù hợp không."},{"id":"T5-B03-C13","prompt":"Nhóm cần dự báo cho thị trấn Bình Minh vào thứ Sáu. Từ khóa nào đúng yêu cầu nhất?","type":"choice","choices":["Thời tiết Bình Minh thứ Sáu","Tin thời tiết","Địa điểm Bình Minh","Ngày thứ Sáu"],"correct":[0],"why":"Từ khóa chứa cả nơi và thời gian."},{"id":"T5-B03-C14","prompt":"Chia việc theo câu hỏi cần giải quyết.","type":"match","groups":["Giờ mở cửa","Thời tiết","Phương tiện"],"items":["Bạn tra lịch trên trang của địa điểm","Bạn đọc dự báo đúng nơi và ngày","Bạn hỏi giáo viên cách di chuyển"],"assign":[0,1,2],"grouping":false,"why":"Mỗi thành viên tìm thông tin phục vụ một tiêu chí."},{"id":"T5-B03-C15","prompt":"Lớp rảnh 14:00–15:30. Vườn mở 15:00 và chuyến xem cần 1 giờ. Kết luận nào đúng?","type":"choice","choices":["Khung giờ hiện tại không đủ","Có đủ 1 giờ sau 15:00","Đi lúc 14:00 vì vườn đã mở","Giờ mở không ảnh hưởng"],"correct":[0],"why":"Từ 15:00 đến 15:30 chỉ có 30 phút."}]},{"goal":"Phát hiện thông tin cũ, sai địa điểm hoặc thiếu điều kiện.","study":{"points":["Dùng từ khóa phù hợp để tìm thông tin, sau đó đọc và chọn nội dung giúp giải quyết nhiệm vụ.","Kết quả đúng chủ đề vẫn cần có chi tiết mà nhóm đang thiếu.","Khi hai nguồn khác nhau, xem nguồn nào có trách nhiệm cập nhật và thông tin áp dụng lúc nào."],"example":"Bảng lịch năm trước chưa đủ để quyết định chuyến đi tuần này."},"tasks":[{"id":"T5-B03-C16","prompt":"Nhóm dùng giá vé trẻ em của một bảo tàng khác. Cần sửa gì?","type":"choice","choices":["Tra giá của đúng nơi lớp định đến","Giữ giá vì cùng là bảo tàng","Đổi tên bảo tàng trên bảng mà giữ giá","Lấy trung bình hai giá chưa kiểm tra"],"correct":[0],"why":"Thông tin phải thuộc đúng đối tượng."},{"id":"T5-B03-C17","prompt":"Nhóm nhận hai  D"],"correct":[0],"why":"B đáp ứng đồng thời giờ mở và chỗ tránh mưa."},{"id":"T5-B03-C22","prompt":"Lớp dự định đi bộ tới thư viện. Hai dữ liệu nào giúp xem có kịp về trước tiết sau không?","type":"multi","choices":["Thời gian đi và về","Thời lượng hoạt động tại thư viện","Màu bìa cuốn sách đầu tiên","Số bàn trong lớp"],"correct":[0,1],"why":"Cộng thời gian di chuyển và thời gian hoạt động để so với khung giờ."},{"id":"T5-B03-C23","prompt":"Xếp cách xử lí khi địa điểm định đến vừa đổi lịch.","type":"order","steps":["So các phương án với thời gian lớp rảnh","Xác nhận lịch mới","Báo nhóm phương án đã chọn và lí do","Tìm địa điểm thay thế nếu lịch không khớp"],"sequence":[1,3,0,2],"why":"Xác nhận trước, tìm lựa chọn, so rồi thông báo."},{"id":"T5-B03-C24","prompt":"Ghép tình huống với quyết định.","type":"match","groups":["Chọn được","Hỏi thêm","Đổi phương án"],"items":["Nơi mở đúng giờ và đủ chỗ","Chưa biết nơi đó có nhận đoàn","Nơi đóng cửa suốt thời gian lớp rảnh"],"assign":[0,1,2],"grouping":false,"why":"Dữ liệu đầy đủ cho phép chốt, dữ liệu thiếu cần xác nhận."},{"id":"T5-B03-C25","prompt":"Khi báo đề xuất cho nhóm, hai nội dung nào giúp các bạn kiểm tra được?","type":"multi","choices":["Lựa chọn và lí do dựa trên thông tin","Nguồn của thông tin quan trọng","Số cửa sổ trình duyệt em mở","Màu chữ ghi chú của em"],"correct":[0,1],"why":"Bạn có thể đối chiếu lập luận và kiểm tra nguồn."}]}],"extras":[]},"4":{"n":4,"code":"4","title":"Cây thư mục","pages":"19–23","stages":[{"goal":"Nhận biết thư mục cha, thư mục con và tệp.","study":{"points":["Thư mục giúp nhóm tệp và thư mục con theo cấu trúc cây. Tệp chứa nội dung như ảnh, văn bản hoặc bài trình chiếu.","Thư mục Bài tập có thể chứa cả thư mục Tin học và một tệp ghi chú.","Một thư mục có thể chứa cả tệp và thư mục con."],"example":"Trong Lớp 5 có Ảnh và Bài tập. Hai thư mục này cùng có cha là Lớp 5."},"tasks":[{"id":"T5-B04-C01","prompt":"Mục nào tương ứng với mô tả “Chứa một hay nhiều thư mục con”?","type":"choic ple":"Nếu thường tìm theo sự kiện rồi loại tệp, tạo mỗi sự kiện với hai nhánh Ảnh và Văn bản."},"tasks":[{"id":"T5-B04-C21","prompt":"Lớp có Hội sách và Hội khỏe, mỗi sự kiện có nhiều ảnh và bài viết. Nhóm luôn tìm theo sự kiện trước. Cây nào phù hợp?","type":"choice","choices":["Mỗi sự kiện có hai nhánh Ảnh và Bài viết","Tất cả tệp để ở một chỗ","Đặt ảnh vào nhánh Bài viết","Tạo nhánh theo tên máy tính"],"correct":[0],"why":"Cấu trúc sự kiện trước phù hợp cách nhóm tìm."},{"id":"T5-B04-C22","prompt":"Sắp việc chuyển hồ sơ hội sách vào cây mới và kiểm tra.","type":"order","steps":["Mở thử tệp từ nhánh vừa đặt","Phân loại tệp theo nội dung","Tạo nhánh Ảnh và Bài viết trong Hội sách","Chuyển tệp vào nhánh phù hợp"],"sequence":[1,2,3,0],"why":"Phân loại, tạo nơi nhận, chuyển rồi kiểm tra."},{"id":"T5-B04-C23","prompt":"Giáo viên cần mở đúng bản dự thảo và bản cuối của báo cáo. Hai cách nào giúp phân biệt?","type":"multi","choices":["Thêm “nhap” và “nop” vào tên","Lưu ở hai nhánh được đặt tên rõ","Cả hai cùng tên và cùng đặt lẫn với ảnh","Đổi đuôi ngẫu nhiên"],"correct":[0,1],"why":"Tên và vị trí rõ giúp chọn đúng bản."},{"id":"T5-B04-C24","prompt":"Ghép yêu cầu tìm nhanh với nơi nên mở.","type":"match","groups":["Hội sách → Ảnh","Hội khỏe → Văn bản","Lớp 5"],"items":["Ảnh gian sách","Bản nội quy hội khỏe","Chưa rõ tệp thuộc sự kiện nào nhưng biết tệp của lớp"],"assign":[0,1,2],"grouping":false,"why":"Bắt đầu từ nhánh hẹp nếu biết, từ cha chung nếu chưa biết nhánh."},{"id":"T5-B04-C25","prompt":"Em chia sẻ vị trí tệp cho bạn. Mô tả nào rõ nhất?","type":"choice","choices":["Lớp 5 → Hội sách → Ảnh → Gian_sach.png","Ở đâu đó trong máy","Ảnh.png, không ghi nhánh","Tệp có biểu tượng màu xanh"],"correct":[0],"why":"Đường đi đủ các tầng và tên tệp giúp bạn tìm chính xác."}]}],"extras":[]},"5":{"n":5,"code":"5","title":"Bản quyền nội dung thông tin","pages":"24–28","stages":[{"goal":"Nhận ra ai tạo tác phẩm, nơi lấy và điều kiện dùng.","study":{"points":["Tác giả là người tạo ra tác phẩm. Quyền đối với tác phẩm cần được tôn trọng khi đọc, sao chép hoặc sử dụng lại nội dung.","Tên người viết bài và tên người đăng lại có thể khác nhau.","Thấy một ảnh trên mạng chưa đủ để biết em có thể đăng lại hay không."],"example":"Lan chụp bức ảnh. Trang lớp đăng ảnh do Lan chụp và ghi tên Lan."},"tasks":[{"id":"T5-B05-C01","prompt":"Mục nào tương ứng với mô tả “Người tạo ra tác phẩm”?","type":"choice","choices":["Tác giả","Giấy phép","Ghi nguồn","Cả ba mục đều có cùng vai trò."],"correct":[0],"why":"Tác giả: Người tạo ra tác phẩm."},{"id":"T5-B05-C02","prompt":"Mục nào có đặc điểm “Điều kiện người khác được sử dụng nội dung”?","type":"choice","choices":["Giấy phép","Cả ba mục đều có đặc điểm này.","Tác giả","Ghi nguồn"],"correct":[0],"why":"Giấy phép: Điều kiện người khác được sử dụng nội dung."},{"id":"T5-B05-C03","prompt":"Chọn mô tả đúng cho “Ghi nguồn”.","type":"choice","choices":["Nêu nơi lấy nội dung để người đọc tra cứu","Ba mô tả đều đúng.","Điều kiện người khác được sử dụng nội dung","Người tạo ra tác phẩm"],"correct":[0],"why":"Ghi nguồn: Nêu nơi lấy nội dung để người đọc tra cứu."},{"id":"T5-B05-C04","prompt":"Khi đọc ghi chú “Ảnh của An, đăng tại Trang lớp”, em biết được hai điều nào?","type":"multi","choices":["Ai chụp ảnh","Nơi đăng ảnh","Ảnh chắc chắn dùng lại tự do","Ảnh chụp ngày nào"],"correct":[0,1],"why":"Ghi chú cho biết tác giả và nơi đăng. Quyền dùng lại và ngày cần kiểm tra riêng."},{"id":"T5-B05-C05","prompt":"Bạn gán mô tả “Người tạo ra tác phẩm” cho “Ghi nguồn”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Tác giả”.","Gán nhầm. Mô tả này thuộc “Giấy phép”.","Mô tả đúng cho cả ba mục.","Gán đúng cho “Ghi nguồn”."],"correct":[0],"why":"Mô tả thuộc mục “Tác giả”."}]},{"goal":"Giải thích vì sao cần xem cả nguồn và điều kiện dùng.","study":{"points":["Khi muốn sử dụng nội dung của người khác, hãy xem nội dung có được phép dùng và phải đáp ứng điều kiện gì.","Kiểm tra điều kiện sử dụng trước khi đưa ảnh vào bài trình chiếu.","Trang đăng ảnh có thể khác tác giả. Nếu cho phép dùng kèm điều kiện, hãy thực hiện điều kiện đó."],"example":"Ảnh ghi “Được dùng trong bài học nếu ghi tên tác giả”. Em dùng trong bài học và ghi tên."},"tasks":[{"id":"T5-B05-C06","prompt":"Ghép từng mô tả với tên phù hợp.","type":"match","groups":["Tác giả","Giấy phép","Ghi nguồn"],"items":["Người tạo ra tác phẩm","Điều kiện người khác được sử dụng nội dung","Nêu nơi lấy nội dung để người đọc tra cứu"],"assign":[0,1,2],"grouping":false,"why":"Tác giả → Người tạo ra tác phẩm · Giấy phép → Điều kiện người khác được sử dụng nội dung · Ghi nguồn → Nêu nơi lấy nội dung để người đọc tra cứu."},{"id":"T5-B05-C07","prompt":"Trang ghi “Được dùng trong bài của lớp nếu ghi tên tác giả”. Em dùng ảnh trong bài của lớp. Làm gì?","type":"choice","choices":["Ghi tên tác giả và giữ thông tin nguồn","Xóa tên để ảnh gọn","Ghi mình là người chụp","Chỉ ghi tên trang rồi bỏ tên tác giả"],"correct":[0],"why":"Điều kiện nêu rõ cần ghi tên tác giả."},{"id":"T5-B05-C08","prompt":"Chọn hai thẻ có phần tên và mô tả khớp nhau.","type":"multi","choices":["Tác giả — Người tạo ra tác phẩm","Giấy phép — Nêu nơi lấy nội dung để người đọc tra cứu","Ghi nguồn — Nêu nơi lấy nội dung để người đọc tra cứu","Ghi nguồn — Điều kiện người khác được sử dụng nội dung"],"correct":[0,2],"why":"B phải ghép với “Điều kiện người khác được sử dụng nội dung”, còn D dùng mô tả của “Giấy phép”."},{"id":"T5-B05-C09","prompt":"Hai mô tả lần lượt là “Người tạo ra tác phẩm” và “Điều kiện người khác được sử dụng nội dung”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Tác giả” và “Giấy phép”.","Chúng mô tả lần lượt “Giấy phép” và “Tác giả”.","Hai mô tả có cùng ý nghĩa.","Chúng đều mô tả “Ghi nguồn”."],"correct":[0],"why":"Chúng mô tả lần lượt “Tác giả” và “Giấy phép”."},{"id":"T5-B05-C10","prompt":"Chọn lời giải thích phân biệt “Tác giả” với “Ghi nguồn”.","type":"choice","choices":["Tác giả — Người tạo ra tác phẩm. Ghi nguồn — Nêu nơi lấy nội dung để người đọc tra cứu.","Tác giả — Điều kiện người khác được sử dụng nội dung. Ghi nguồn — Nêu nơi lấy nội dung để người đọc tra cứu.","Tác giả — Người tạo ra tác phẩm. Ghi nguồn — Điều kiện người khác được sử dụng nội dung.","Tác giả — Nêu nơi lấy nội dung để người đọc tra cứu. Ghi nguồn — Người tạo ra tác phẩm."],"correct":[0],"why":"Tác giả — Người tạo ra tác phẩm. Ghi nguồn — Nêu nơi lấy nội dung để người đọc tra cứu."}]},{"goal":"Kiểm tra ảnh trước khi đưa vào bài giới thiệu.","study":{"points":["Ghi nguồn giúp người đọc biết nội dung được lấy ở đâu. Nếu có tên tác giả, ghi cả tên tác giả và nguồn.","Với một bức ảnh trên web, có thể ghi tác giả và địa chỉ trang đăng.","Lưu tên tác giả và nguồn khi tìm ảnh để dễ ghi công. Nếu quyền dùng chưa rõ, hỏi hoặc chọn ảnh khác đã có phép."],"example":"Ghi “Ảnh: An Nguyễn, Trang Vườn trường” khi nguồn cung cấp đủ hai chi tiết."},"tasks":[{"id":"T5-B05-C11","prompt":"Xếp các bước sử dụng một ảnh tìm trên mạng trong bản tin lớp.","type":"order","steps":["Ghi công theo điều kiện","Đọc điều kiện sử dụng","Tìm ảnh hợp nội dung","Chèn ảnh đã được phép"],"sequence":[2,1,3,0],"why":"Kiểm tra quyền dùng trước, chèn rồi ghi công."},{"id":"T5-B05-C12","prompt":"Bài giới thiệu cần ảnh công viên. Hai lựa chọn nào có căn cứ sử dụng?","type":"multi","choices":["Ảnh em tự chụp được phép đưa vào bài","Ảnh có ghi cho dùng trong bài học, em làm đúng điều kiện","Ảnh tìm thấy không rõ nguồn","Ảnh ghi chỉ tác giả được đăng"],"correct":[0,1],"why":"Ảnh tự tạo hoặc có phép rõ ràng phù hợp khi dùng đúng phạm vi."},{"id":"T5-B05-C13","prompt":"Tư liệu ghi tác giả Lâm, nguồn trang Màu Xanh. Dòng ghi công nào đầy đủ nhất?","type":"choice","choices":["Ảnh của Lâm, nguồn Màu Xanh","Ảnh đẹp của em","Ảnh Internet","Ảnh không rõ người chụp"],"correct":[0],"why":"Ghi đủ tên tác giả và nơi lấy ảnh."},{"id":"T5-B05-C14","prompt":"Ghép câu hỏi với chi tiết cần xem.","type":"match","groups":["Tác giả","Nguồn","Điều kiện dùng"],"items":["Ai vẽ tranh?","Em lấy tranh từ đâu?","Có được sửa hình không?"],"assign":[0,1,2],"grouping":false,"why":"Ba chi tiết trả lời ba câu hỏi khác nhau."},{"id":"T5-B05-C15","prompt":"Em đã xin phép dùng ảnh trong bài lớp. Muốn đưa ảnh lên trang công khai, em cần làm gì trước?","type":"choice","choices":["Xác nhận phạm vi cho phép có gồm đăng công khai","Đăng ngay vì đã dùng trong lớp","Chèn thêm khung quanh ảnh","Đổi tên ảnh"],"correct":[0],"why":"Phạm vi dùng trong lớp có thể khác phạm vi công khai."}]},{"goal":"Phát hiện ghi công sai hoặc dùng vượt điều kiện.","study":{"points":["Tôn trọng bản quyền gồm dùng nội dung được phép, ghi nguồn và giữ gìn nội dung khi sử dụng.","Nếu chưa rõ có được dùng ảnh hay không, hỏi người có quyền hoặc tìm ảnh được phép.","Ghi nguồn chỉ cho biết nơi lấy. Hãy xem tác giả cho phép dùng vào việc gì và có cho sửa không."],"example":"Nếu ghi “không chỉnh sửa”, em dùng bản nguyên vẹn trong phạm vi được phép."},"tasks":[{"id":"T5-B05-C16","prompt":"Ảnh cho dùng trong bài học nhưng yêu cầu giữ nguyên. Bạn đã cắt ảnh. Chỉnh thế nào?","type":"choice","choices":["Dùng bản nguyên vẹn theo điều kiện hoặc chọn ảnh khác phù hợp","Chỉ tăng cỡ tên tác giả","Giữ ảnh đã cắt vì đã ghi nguồn","Che phần ảnh gốc"],"correct":[0],"why":"Cắt ảnh làm thay đổi nội dung nên không phù hợp điều kiện."},{"id":"T5-B05-C17","prompt":"Bạn tải ảnh từ mạng, chưa rõ ai chụp và chưa rõ quyền dùng. Chọn hai cách xử lí hợp lí.","type":"multi","choices":["Tìm bài gốc và hỏi người có quyền cho phép","Đổi sang ảnh tự tạo hoặc ảnh có phép rõ","Đăng ngay rồi hỏi sau","Ghi tên mình vào ảnh"],"correct":[0,1],"why":"Cần xác định quyền trước hoặc thay bằng nguồn phù hợp."},{"id":"T5-B05-C18","prompt":"Ghép bản nháp với việc cần sửa.","type":"match","groups":["Bổ sung tên tác giả","Xin phép hoặc thay ảnh","Dùng trong phạm vi cho phép"],"items":["Có phép nhưng quên tên người vẽ","Trang không ghi điều kiện dùng","Chỉ được dùng trong lớp nhưng định đăng công khai"],"assign":[0,1,2],"grouping":false,"why":"Lỗi ghi công và lỗi phạm vi cần xử lí riêng."},{"id":"T5-B05-C19","prompt":"Bạn ghi “Tác giả: em” cho đoạn văn lấy nguyên từ sách. Nên làm gì?","type":"choice","choices":["Ghi đúng tác giả, kiểm tra cách dùng đoạn trích","Giữ nguyên vì em gõ lại","Chỉ đổi màu chữ","Ghi tác giả là bạn ngồi cạnh"],"correct":[0],"why":"Người nhập lại không trở thành người viết đoạn văn."},{"id":"T5-B05-C20","prompt":"Bạn mở nhầm tệp nhật kí của bạn khác khi tìm ảnh cho bài. Nên làm gì?","type":"choice","choices":["Đóng tệp và không kể lại nội dung đã thấy","Đọc tiếp rồi chia sẻ cho nhóm","Chụp lại vì tìm thấy trên máy","Chép nội dung vào bài nếu có ghi tên"],"correct":[0],"why":"Nhật kí là thông tin riêng tư. Việc mở nhầm không cho phép đọc hay chia sẻ."}]},{"goal":"Phối hợp điều kiện dùng và ghi công trước khi chia sẻ.","study":{"points":["Một bài giới thiệu có thể dùng lời văn tự viết và hình ảnh được phép sử dụng. Cần chỉ rõ phần tư liệu lấy từ nguồn khác.","Kiểm tra quyền sử dụng và phần ghi nguồn trước khi chia sẻ sản phẩm.","Khi nhiệm vụ đổi từ trình bày trong lớp sang đăng công khai, kiểm tra lại mọi tư liệu."],"example":"Ảnh được dùng công khai kèm ghi công phù hợp nếu bản tin ghi công đúng."},"tasks":[{"id":"T5-B05-C21","prompt":"Bản tin công khai cần một tranh. Hai phương án nào có thể chọn?","type":"multi","choices":["Tranh nhóm tự vẽ và thống nhất đăng","Tranh được phép đăng công khai, nhóm ghi công đúng","Tranh chỉ cho dùng ở lớp","Ảnh có tên tệp “miễn phí” nhưng không thấy điều kiện"],"correct":[0,1],"why":"Hai phương án đầu có căn cứ cho đúng phạm vi công khai."},{"id":"T5-B05-C22","prompt":"Xếp các bước sửa bản tin có ảnh chỉ cho dùng trong lớp trước khi đăng công khai.","type":"order","steps":["Thay ảnh cũ","Xác nhận ảnh thay thế được đăng công khai","Kiểm tra ghi công rồi đăng","Tìm ảnh thay thế phù hợp"],"sequence":[3,1,0,2],"why":"Tìm và kiểm tra quyền ảnh mới trước khi thay, sau đó rà lại bản tin."},{"id":"T5-B05-C23","prompt":"Ghép nhu cầu với nguồn đáp ứng đúng nhất.","type":"match","groups":["Đăng công khai","Được chỉnh màu","Chỉ trình bày trong lớp"],"items":["Ảnh cho đăng website kèm ghi tên","Ảnh cho phép chỉnh sửa","Ảnh được dùng trong tiết học, giữ nguyên"],"assign":[0,1,2],"grouping":false,"why":"Chọn tư liệu có điều kiện khớp cách dùng."},{"id":"T5-B05-C24","prompt":"Ảnh A hợp chủ đề nhưng chỉ được xem. Ảnh B hợp chủ đề và cho dùng khi ghi tác giả. Bài cần chèn một ảnh. Chọn gì?","type":"choice","choices":["Dùng B và ghi tác giả","Dùng A và đổi tên","Chèn cả A lẫn B vì cùng chủ đề","Dùng B rồi bỏ tên"],"correct":[0],"why":"B có điều kiện phù hợp và nhóm cần thực hiện điều kiện."},{"id":"T5-B05-C25","prompt":"Trước khi giao bản tin, hai mục nào nên có trong bảng kiểm?","type":"multi","choices":["Kiểm tra phạm vi dùng của từng tư liệu","Kiểm tra tên tác giả và nguồn cần ghi","Đếm số tệp tải về","Xóa các ghi chép về nguồn"],"correct":[0,1],"why":"Rà cả quyền dùng và ghi công trước khi chia sẻ."}]}],"extras":[]},"6":{"n":6,"code":"6","title":"Định dạng kí tự và bố trí hình ảnh trong văn bản","pages":"29–33","stages":[{"goal":"Nhận ra lệnh đổi cỡ, kiểu chữ và cách bố trí ảnh.","study":{"points":["Định dạng kí tự giúp thay đổi phông, kiểu, cỡ và màu chữ. Muốn đổi một phần văn bản, trước hết chọn đúng phần đó.","Có thể dùng kiểu đậm để làm nổi bật tiêu đề.","Định dạng thay đổi cách thể hiện của chữ. Hãy chọn đúng chữ trước khi đổi."],"example":"Chọn riêng dòng tên bản tin rồi bấm nút chữ đậm."},"tasks":[{"id":"T5-B06-C01","prompt":"Mục nào tương ứng với mô tả “Làm nổi bật kí tự đã chọn”?","type":"choice","choices":["Kiểu chữ đậm","Bố trí ảnh","Cả ba mục đều có cùng vai trò.","Cỡ chữ"],"correct":[0],"why":"Kiểu chữ đậm: Làm nổi bật kí tự đã chọn."},{"id":"T5-B06-C02","prompt":"Mục nào có đặc điểm “Thay đổi độ lớn kí tự”?","type":"choice","choices":["Cỡ chữ","Cả ba mục đều có đặc điểm này.","Bố trí ảnh","Kiểu chữ đậm"],"correct":[0],"why":"Cỡ chữ: Thay đổi độ lớn kí tự."},{"id":"T5-B06-C03","prompt":"Chọn mô tả đúng cho “Bố trí ảnh”.","type":"choice","choices":["Quy định vị trí ảnh so với văn bản","Ba mô tả đều đúng.","Làm nổi bật kí tự đã chọn","Thay đổi độ lớn kí tự"],"correct":[0],"why":"Bố trí ảnh: Quy định vị trí ảnh so với văn bản."},{"id":"T5-B06-C04","prompt":"Chọn hai thao tác định dạng kí tự.","type":"multi","choices":["Đổi cỡ chữ","Đổi chữ sang in nghiêng","Xóa cả dòng","Chèn một ảnh"],"correct":[0,1],"why":"Cỡ và kiểu là thuộc tính của kí tự."},{"id":"T5-B06-C05","prompt":"Bạn gán mô tả “Làm nổi bật kí tự đã chọn” cho “Bố trí ảnh”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Kiểu chữ đậm”.","Mô tả đúng cho cả ba mục.","Gán nhầm. Mô tả này thuộc “Cỡ chữ”.","Gán đúng cho “Bố trí ảnh”."],"correct":[0],"why":"Mô tả thuộc mục “Kiểu chữ đậm”."}]},{"goal":"Giải thích sự khác nhau giữa chữ, ảnh và cách bố trí.","study":{"points":["Cỡ chữ quyết định chữ lớn hay nhỏ. Kiểu chữ như đậm hoặc nghiêng làm thay đổi cách thể hiện của chữ.","Chọn cỡ lớn nếu chữ cần to hơn. Chọn đậm nếu chữ cần nổi bật hơn.","Ảnh có thể cùng dòng với văn bản hoặc bố trí để chữ chạy quanh. Hãy đọc yêu cầu trước khi chọn."],"example":"Dòng chú thích vẫn nhỏ khi em chỉ tăng cỡ tiêu đề."},"tasks":[{"id":"T5-B06-C06","prompt":"Ghép từng mô tả với tên phù hợp.","type":"match","groups":["Kiểu chữ đậm","Cỡ chữ","Bố trí ảnh"],"items":["Làm nổi bật kí tự đã chọn","Thay đổi độ lớn kí tự","Quy định vị trí ảnh so với văn bản"],"assign":[0,1,2],"grouping":false,"why":"Kiểu chữ đậm → Làm nổi bật kí tự đã chọn · Cỡ chữ → Thay đổi độ lớn kí tự · Bố trí ảnh → Quy định vị trí ảnh so với văn bản."},{"id":"T5-B06-C07","prompt":"Đề yêu cầu làm đậm tên tác giả mà giữ nguyên cỡ chữ. Nên dùng lệnh nào?","type":"choice","choices":["Bold hoặc nút B","Font Size","Insert Picture","Wrap Text"],"correct":[0],"why":"Bold đổi kiểu đậm của chữ đã chọn."},{"id":"T5-B06-C08","prompt":"Chọn hai thẻ có phần tên và mô tả khớp nhau.","type":"multi","choices":["Kiểu chữ đậm — Làm nổi bật kí tự đã chọn","Cỡ chữ — Quy định vị trí ảnh so với văn bản","Bố trí ảnh — Quy định vị trí ảnh so với văn bản","Bố trí ảnh — Thay đổi độ lớn kí tự"],"correct":[0,2],"why":"B phải ghép với “Thay đổi độ lớn kí tự”, còn D dùng mô tả của “Cỡ chữ”."},{"id":"T5-B06-C09","prompt":"Hai mô tả lần lượt là “Làm nổi bật kí tự đã chọn” và “Thay đổi độ lớn kí tự”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Kiểu chữ đậm” và “Cỡ chữ”.","Chúng mô tả lần lượt “Cỡ chữ” và “Kiểu chữ đậm”.","Chúng đều mô tả “Bố trí ảnh”.","Hai mô tả có cùng ý nghĩa."],"correct":[0],"why":"Chúng mô tả lần lượt “Kiểu chữ đậm” và “Cỡ chữ”."},{"id":"T5-B06-C10","prompt":"Chọn lời giải thích phân biệt “Kiểu chữ đậm” với “Bố trí ảnh”.","type":"choice","choices":["Kiểu chữ đậm — Làm nổi bật kí tự đã chọn. Bố trí ảnh — Quy định vị trí ảnh so với văn bản.","Kiểu chữ đậm — Thay đổi độ lớn kí tự. Bố trí ảnh — Quy định vị trí ảnh so với văn bản.","Kiểu chữ đậm — Làm nổi bật kí tự đã chọn. Bố trí ảnh — Thay đổi độ lớn kí tự.","Kiểu chữ đậm — Quy định vị trí ảnh so với văn bản. Bố trí ảnh — Làm nổi bật kí tự đã chọn."],"correct":[0],"why":"Kiểu chữ đậm — Làm nổi bật kí tự đã chọn. Bố trí ảnh — Quy định vị trí ảnh so với văn bản."}]},{"goal":"Chọn phần chữ rồi đặt thuộc tính, bố trí ảnh theo yêu cầu.","study":{"points":["Chọn đoạn chữ cần sửa rồi dùng lệnh phông, cỡ hoặc màu chữ. Có thể phối hợp vài định dạng để tạo tiêu đề dễ đọc.","Thử chọn tiêu đề và tăng cỡ chữ, rồi so với phần thân bài.","Chọn ảnh trước khi đổi cách văn bản bao quanh. Kéo góc ảnh để thu nhỏ mà giữ tỉ lệ."],"example":"Chọn ảnh cây rồi dùng tùy chọn chữ bao quanh nếu cần đặt ảnh bên cạnh đoạn."},"tasks":[{"id":"T5-B06-C11","prompt":"Xếp thao tác làm riêng tiêu đề thành chữ đậm cỡ 20.","type":"order","steps":["Kiểm tra phần thân giữ nguyên","Chọn dòng tiêu đề","Đổi cỡ 20 và bật đậm","Mở văn bản"],"sequence":[3,1,2,0],"why":"Mở tệp, chọn vùng, định dạng rồi kiểm tra."},{"id":"T5-B06-C12","prompt":"Chú thích phải nhỏ hơn tiêu đề và ở dưới ảnh. Chọn hai điều chỉnh đúng.","type":"multi","choices":["Giảm cỡ dòng chú thích đã chọn","Đặt chú thích ngay dưới ảnh","Đổi màu toàn bộ văn bản","Kéo ảnh che chú thích"],"correct":[0,1],"why":"Hai thao tác đáp ứng cỡ chữ và vị trí."},{"id":"T5-B06-C13","prompt":"Ghép yêu cầu với lệnh phù hợp.","type":"match","groups":["Cỡ chữ","Màu chữ","Bố trí ảnh"],"items":["Làm tiêu đề lớn hơn","Chuyển lời nhắc sang xanh đậm","Cho chữ chạy quanh ảnh"],"assign":[0,1,2],"grouping":false,"why":"Mỗi lệnh thay đổi một đặc điểm."},{"id":"T5-B06-C14","prompt":"Em muốn đổi màu riêng hai chữ “Vườn xanh”. Thao tác bắt đầu nào đúng?","type":"choice","choices":["Chọn đúng hai chữ “Vườn xanh”","Chọn ảnh trong bài","Chọn toàn bộ văn bản","Đặt con trỏ ở trang khác"],"correct":[0],"why":"Chọn đúng phạm vi để không đổi phần khác."},{"id":"T5-B06-C15","prompt":"Ảnh quá rộng so với trang. Muốn thu nhỏ mà hình không bị méo, em làm gì?","type":"choice","choices":["Kéo tay nắm ở góc ảnh hoặc giữ tỉ lệ khi đổi kích thước","Chỉ kéo giữa cạnh bên","Đổi màu nền","Giảm cỡ chữ tiêu đề"],"correct":[0],"why":"Thu từ góc hoặc khóa tỉ lệ giữ hình cân đối."}]},{"goal":"Tìm lỗi vùng chọn, tương phản hoặc ảnh che chữ.","study":{"points":["Có thể đổi cách bố trí ảnh so với chữ. Khi ảnh che nội dung hoặc ở sai chỗ, chọn ảnh và kiểm tra tùy chọn bố trí.","Xem chữ có bao quanh ảnh hay ảnh đang chiếm một dòng riêng.","Nếu thao tác vừa làm sai phạm vi, có thể hoàn tác rồi chọn đúng phần cần sửa."],"example":"Ảnh nằm đè lên nội dung có thể cần đổi cách bố trí hoặc thu nhỏ."},"tasks":[{"id":"T5-B06-C16","prompt":"Chỉ muốn tô màu một từ nhưng cả đoạn đổi màu. Nguyên nhân phù hợp nhất?","type":"choice","choices":["Em đã chọn cả đoạn trước khi đổi màu","Ảnh đang nằm cuối trang","Tệp vừa được lưu","Phông chữ khác máy"],"correct":[0],"why":"Định dạng áp dụng lên vùng đã chọn."},{"id":"T5-B06-C17","prompt":"Ảnh che chữ và quá lớn. Chọn hai cách sửa.","type":"multi","choices":["Đổi cách bố trí để chữ không nằm dưới ảnh","Thu ảnh theo tỉ lệ rồi xem lại","Tăng cỡ ảnh","Đổi hết chữ sang trắng"],"correct":[0,1],"why":"Sửa bố trí và kích thước trực tiếp giải quyết vấn đề."},{"id":"T5-B06-C18","prompt":"Ghép biểu hiện với cách sửa.","type":"match","groups":["Chọn lại vùng chữ","Tăng độ tương phản","Giữ tỉ lệ ảnh"],"items":["Thân bài cũng đậm theo tiêu đề","Chữ vàng nhạt trên nền trắng","Ảnh tròn bị kéo thành bầu dục"],"assign":[0,1,2],"grouping":false,"why":"Dựa vào phần bị thay đổi để chọn thao tác."},{"id":"T5-B06-C19","prompt":"Đề yêu cầu giữ màu chữ đen. Sau khi tăng cỡ, tiêu đề lại thành đỏ. Sửa gì?","type":"choice","choices":["Chọn tiêu đề và đổi riêng màu về đen","Hạ cỡ tiêu đề về như cũ","Đổi ảnh thành đen trắng","Xóa tiêu đề"],"correct":[0],"why":"Lỗi thuộc màu. Cỡ chữ có thể giữ đúng yêu cầu."},{"id":"T5-B06-C20","prompt":"Em kéo ảnh sang bên phải nhưng đoạn văn cứ xuống dưới ảnh. Kiểm tra mục nào?","type":"choice","choices":["Cách bố trí ảnh với chữ","Cỡ chữ của chú thích","Màu phông","Tên tệp"],"correct":[0],"why":"Cách bố trí quyết định chữ có thể chạy cạnh ảnh hay không."}]},{"goal":"Phối hợp tiêu đề, đoạn văn và ảnh theo yêu cầu mới.","study":{"points":["Một văn bản dễ đọc có tiêu đề rõ, chữ nhất quán và ảnh minh họa đặt gần nội dung liên quan.","Xem lại toàn trang để chắc rằng chữ và hình đều nhìn rõ.","Dùng cỡ và kiểu để tạo thứ bậc. Đặt ảnh liên quan sát đoạn cần minh họa và đọc thử cả trang."],"example":"Tiêu đề lớn, thân bài dễ đọc, ảnh cây ở cạnh đoạn mô tả cây."},"tasks":[{"id":"T5-B06-C21","prompt":"Tờ tin cần tiêu đề rõ và ảnh nằm cạnh phần mô tả. Hai điều chỉnh nào đáp ứng?","type":"multi","choices":["Tăng cỡ, làm đậm riêng tiêu đề","Cho chữ bao quanh ảnh rồi đặt cạnh đoạn mô tả","Làm đậm toàn trang","Đặt ảnh đè lên đoạn"],"correct":[0,1],"why":"Tách định dạng tiêu đề và đặt ảnh theo nội dung."},{"id":"T5-B06-C22","prompt":"Xếp thao tác chuẩn bị bản tin có ảnh để gửi.","type":"order","steps":["Xem thử cả trang và lưu","Chọn đoạn cần minh họa","Chèn ảnh phù hợp","Thu

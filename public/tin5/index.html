 const hero=add(h('section','hero mission-hero'),copy,art(mission.icon));
 const titleRow=add(h('div','section-head'),
  add(h('div'),h('p','eyebrow','BẢN ĐỒ NHIỆM VỤ'),h('h2','','5 cánh cửa tri thức')),
  h('span','tiny',roomsDone(p)+'/5 khu vực đã hoàn thành'));
 const list=h('ol','stage-list');
 mission.stages.forEach((name,i)=>{
  const final=i===4;
  const solved=Math.max(0,Math.min(5,p.count-i*5));
  const open=p.count>=i*5;
  const done=final?hasCertificate(p):solved===5;
  const roomName=final?'Thử thách cuối':name;
  const state=done?'✓':open?'✨':'🔒';
  const details=final?(solved===5?'Thực hành '+p.finalCases.length+'/2':'5 câu + thực hành'):'5 câu';
  const row=h('li','stage-row'+(done?' done':'')+(!open?' locked':''));
  const room=b('',()=>{
   if(done){if(final)certificate();else review(i)}
   else if(final&&solved===5)lab();
   else play(p.count);
  },'room-button');
  room.disabled=!open;
  const seal=h('span','room-seal',state);
  seal.setAttribute('aria-hidden','true');
  const icon=h('span','room-icon',ROOM_ICONS[i]);
  icon.setAttribute('aria-hidden','true');
  add(room,seal,icon,h('strong','',roomName),h('small','',details));
  if(!open)room.setAttribute('aria-label',roomName+' · Chưa mở');
  row.append(room);
  if(solved&&(final||!done))row.append(b('Xem lời giải',()=>review(i),'btn text-btn'));
  list.append(row);
 });
 main.replaceChildren(hero,titleRow,list);
 if(storageProblem)main.append(h('p','notice','Tiến độ sẽ mất khi em đóng trang vì trình duyệt đang chặn lưu.'));
 if(scroll)focusViewStart(title);
}
function resetLesson(){
 if(!confirm('Chơi lại từ đầu? Tiến độ và chứng nhận của bài này sẽ bị xóa trên trình duyệt.'))return;
 progress=empty();
 mem.set(lesson.n,progress);
 save(lesson.n);
 lessonPage();
}
function route(){
 attempt=null;
 const hash=location.hash;
 const match=hash.match(/^#bai-(\d+[ab]?)$/i);
 const n=STANDALONE||(match?CATALOG.find(entry=>entry.code===match[1].toLowerCase())?.n:0);
 if(BANK[n]){
  lesson=BANK[n];mission=MISSIONS[n-1];progress=get(n);
  document.title='Bài '+lesson.code+' · '+lesson.title+' | Tin học 5';
  lessonPage();
 }else{
  lesson=mission=progress=null;
  document.title='Tin học 5 · Phòng nhiệm vụ';
  home(hash==='#chuong-trinh');
 }
}
function basePanel(label,title,desc,back=()=>lessonPage()){
 const head=h('div','view-heading');
 const titleNode=h('h1','',title);
 add(head,b('☰ Bản đồ bài này',back,'btn subtle'),h('p','eyebrow',label),titleNode,desc?h('p','muted',desc):null);
 return [head,titleNode];
}
function lab(){
 if(progress.count!==TOTAL){lessonPage();return}
 if(hasCertificate(progress)){certificate();return}
 attempt=null;
 const [head,title]=basePanel('KHU VỰC 05 · THỬ THÁCH CUỐI',mission.lab,'Hoàn thành cả hai nhiệm vụ để nhận chứng nhận.');
 const box=h('div','lab-shell');
 const actions=h('div','final-actions');
 main.replaceChildren(add(h('div','lesson-panel'),head,box,actions));
 mountLab(box,mission,progress.finalCases,i=>{
  if(progress.finalCases.includes(i))return;
  progress.finalCases.push(i);
  if(!progress.lab.includes(i)){progress.lab.push(i);progress.xp+=30}
  if(progress.finalCases.length===2)progress.certificateAt=new Date().toISOString();
  save(lesson.n);
  setHeader(mission);
  if(hasCertificate(progress)){
   actions.replaceChildren(b('🏆 Nhận chứng nhận',()=>certificate(),'btn primary'));
  }
 });
 if(lesson.extras.length)actions.append(b('Bài mở rộng',()=>extra(),'btn text-btn'));
 focusViewStart(title);
}
function drawStudy(stage){
 const heading=h('h2','','Kiến thức cần nhớ');
 heading.id='study-title';
 const points=h('ul','study-points');
 for(const point of stage.study.points)points.append(h('li','',point));
 const example=add(h('div','study-example'),h('strong','','Ví dụ'),h('p','',stage.study.example));
 const panel=add(h('section','study'),heading,points,example,h('p','study-source','SGK · trang '+lesson.pages));
 panel.setAttribute('aria-labelledby',heading.id);
 return panel;
}
function hint(q,stage){
 if(q.type==='order')return 'Tìm việc phải làm trước khi có thể thực hiện bước kế tiếp.';
 if(q.type==='match')return 'Đọc từng dòng và dựa vào vai trò hoặc dấu hiệu riêng để chọn.';
 if(q.type==='multi')return 'Đối chiếu từng lựa chọn với câu hỏi. Có thể có hơn một ý đúng.';
 return stage.goal;
}
function play(index,retry=false){
 if(!Number.isInteger(index)||index<0||index>=TOTAL||index!==progress.count){lessonPage();return}
 const i=Math.floor(index/5),stage=lesson.stages[i],q=stage.tasks[index%5];
 const [head,title]=basePanel('KHU VỰC '+number(i+1)+' / 05',i===4?'Thử thách cuối':mission.stages[i],'Câu '+(index%5+1)+' / 5');
 const dots=h('div','progress-dots');
 dots.setAttribute('aria-hidden','true');
 for(let j=0;j<5;j++)dots.append(h('span',j<index%5?'done':j===index%5?'current':''));
 const study=drawStudy(stage);
 const pane=h('section','question-card');
 const jump=b('Đến câu hỏi ↓',()=>{
  pane.scrollIntoView({block:'start'});
  focus(pane.querySelector('h2'));
 },'btn text-btn study-jump');
 const grid=add(h('div','play-grid'),study);
 const session={index,q,stage,i,phase:'study',pane,study};
 attempt=session;
 const mustRead=!retry;
 jump.hidden=mustRead;
 const status=h('p','sr-only');
 status.setAttribute('role','status');
 main.replaceChildren(add(h('div','lesson-panel play-panel'),head,dots,jump,grid,status));
 focusViewStart(title);
 if(!mustRead){
  showQuestion();
  if(retry)focus(pane.querySelector('h2'));
  return;
 }

 grid.classList.add('study-only');
 const fill=h('span','study-meter-fill');
 fill.style.setProperty('--study-time',STUDY_SECONDS+'s');
 const meter=add(h('div','study-meter'),fill);
 meter.setAttribute('aria-hidden','true');
 const notice=h('p','','Đọc kiến thức trong '+STUDY_SECONDS+' giây. Câu hỏi sẽ tự mở.');
 const wait=add(h('div','study-wait'),notice,meter);
 study.append(wait);
 setTimeout(()=>{
  if(attempt!==session)return;
  wait.hidden=true;
  grid.classList.remove('study-only');
  showQuestion();
  status.textContent='Câu hỏi đã mở.';
 },STUDY_SECONDS*1000);

 function showQuestion(){
  session.phase='answer';
  drawQuestion(q,pane,stage,index);
  grid.append(pane);
  jump.hidden=false;
 }
}
function drawQuestion(q,pane,stage,index){
 const head=h('p','question-kind',q.grouping?'Phân loại':modes[q.type]);
 const prompt=h('h2','question-prompt',q.prompt);
 add(pane,head,prompt);
 if(q.table)pane.append(checkTable(q.table));
 if(q.type==='practice'){drawPractice(q,pane,()=>complete(index,q,pane,true));return}
 const area=h('div','answer-area');pane.append(area);
 const toolbar=h('div','tool-row');pane.append(toolbar);
 const submit=b('Kiểm tra',grade,'btn primary');submit.disabled=true;toolbar.append(submit);
 let valid=()=>false,correct=()=>false;
 const update=()=>submit.disabled=!valid();
 if(q.type==='number'){
  const value=input('',update,{inputMode:'numeric'});
  area.append(field('Kết quả',value));
  valid=()=>/^[+-]?\d+$/.test(value.value.trim());
  correct=()=>Number(value.value)===q.answer;
 }else if(q.type==='order'){
  const local=[];const order=stableOrder(q.steps.length,q.id);
  function drawOrder(){
   area.replaceChildren(h('p','muted','Bấm từng bước theo thứ tự. Có thể bỏ bước cuối hoặc xếp lại.'));
   tray(area,order.map(i=>q.steps[i]),local,i=>{local.push(i);drawOrder();focus(area.querySelector('.ordered-tray li:last-child'))},()=>{local.pop();drawOrder();focus(area.querySelector('.ordered-tray'))},()=>{local.splice(0);drawOrder();focus(area.querySelector('.tool-row button'))},'Thứ tự của em');
   update();
  }
  valid=()=>local.length===q.steps.length;
  correct=()=>same(local.map(i=>order[i]),q.sequence);drawOrder();
 }else if(q.type==='match'){
  const chosen=Array(q.items.length).fill(null);
  const order=stableOrder(q.groups.length,q.id);
  q.items.forEach((x,i)=>area.append(field(x,select(order.map(k=>q.groups[k]),null,v=>{chosen[i]=v;update()}))));
  valid=()=>chosen.every(x=>x!==null);correct=()=>same(chosen.map(i=>order[i]),q.assign);
 }else{
  const ids=stableOrder(q.choices.length,q.id),set=new Set(),fields=h('fieldset','answer-options');
  const legend=h('legend','sr-only',q.type==='multi'?'Chọn tất cả phương án đúng':'Chọn một phương án đúng');fields.append(legend);
  ids.forEach((idx,i)=>{
   const f=h('input');f.type=q.type==='multi'?'checkbox':'radio';f.name=q.id;f.value=String(idx);
   f.addEventListener('change',()=>{if(q.type==='choice')set.clear();if(f.checked)set.add(idx);else set.delete(idx);update()});
   fields.append(add(h('label','answer-choice'),f,h('span','letter',String.fromCharCode(65+i)),h('span','',q.choices[idx])));
  });
  area.append(fields);
  valid=()=>set.size>0;correct=()=>same([...set].sort(),[...q.correct].sort());
 }
 function grade(){
  if(attempt?.phase!=='answer'||!valid()||pane!==attempt.pane)return;
  if(correct())complete(index,q,pane,false);
  else wrong(index,q,pane,stage);
 }
}
function drawPractice(q,pane,finish){
 const intro=h('p','muted','Làm bài rồi tự đối chiếu kết quả.');
 const holder=h('div','practice-rubric');holder.hidden=true;
 const checks=[];
 const submit=b('Ghi nhận đã tự đối chiếu',()=>{if(checks.every(x=>x.checked))finish()},'btn primary');submit.disabled=true;
 q.rubric.forEach(line=>{const e=h('input');e.type='checkbox';e.addEventListener('change',()=>submit.disabled=!checks.every(x=>x.checked));checks.push(e);
  holder.append(add(h('label','rubric-item'),e,h('span','',line)))});
 holder.append(submit);
 const show=b('Mở tiêu chí tự kiểm tra',()=>{holder.hidden=false;show.hidden=true;focus(checks[0])});
 add(pane,intro,show,holder);
}
function disable(pane){pane.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=true)}
function complete(index,q,pane,self){
 if(attempt?.phase!=='answer'||index!==progress.count)return;
 attempt.phase='complete';disable(pane);
 progress.count++;
 if(!self)progress.xp+=progress.tries[index]?10:20;
 if(progress.count%5===0)progress.xp+=30;
 save(lesson.n);
 setHeader(mission);
 const end=progress.count%5===0;
 const result=add(h('div','result-card success'),h('strong','',self?'✓ Đã ghi nhận tự đối chiếu':'✓ Chính xác!'),h('p','',self?'Em đã tự kiểm tra bài theo tiêu chí.':q.why));
 result.setAttribute('role','status');
 const stageIndex=Math.floor(index/5);
 if(end&&stageIndex<4)result.append(h('p','medal',MEDALS[stageIndex]+' Huy hiệu khu vực '+(stageIndex+1)));
 const next=b(progress.count===TOTAL?'Vào thử thách thực hành':end?'Nhận huy chương':'Sang câu tiếp theo',
  ()=>end?(progress.count===TOTAL?lab():celebrateStage(stageIndex)):play(progress.count),'btn primary');
 add(pane,result,next);focus(next);
}
function wrong(index,q,pane,stage){
 attempt.phase='retry';disable(pane);
 progress.tries[index]=(progress.tries[index]||0)+1;save(lesson.n);
 const reviewNotes=b('Xem lại kiến thức',()=>{
  const study=attempt?.study;
  if(study){
   study.scrollIntoView({block:'start'});
   focus(study.querySelector('h2'));
  }
 },'btn text-btn');
 const read=add(h('div','result-card warning'),h('h3','','Đọc lại rồi thử lần nữa'),
  h('p','',hint(q,stage)),reviewNotes);
 const e=h('input');e.type='checkbox';
 const retry=b('Thử lại câu này',()=>play(index,true),'btn primary');retry.disabled=true;
 e.addEventListener('change',()=>retry.disabled=!e.checked);
 add(read,add(h('label','rubric-item'),e,h('span','','Em đã đọc lại tư liệu')),retry);pane.append(read);focus(e);
}
function solution(q){
 if(q.type==='practice')return q.rubric.join(' ');
 if(q.type==='number')return String(q.answer);
 if(q.type==='order')return q.sequence.map(i=>q.steps[i]).join(' → ');
 if(q.type==='match')return q.items.map((t,i)=>t+' → '+q.groups[q.assign[i]]).join(' · ');
 return q.correct.map(i=>q.choices[i]).join(' · ');
}
function review(i){
 attempt=null;
 const s=lesson.stages[i],solved=Math.max(0,Math.min(5,progress.count-5*i));
 const [head,title]=basePanel('BÀI '+lesson.code.toUpperCase()+' · ÔN TẬP',mission.stages[i],solved+'/5 câu đã hoàn thành.');
 const box=h('div','review-stack');box.append(drawStudy(s));
 s.tasks.slice(0,solved).forEach(q=>{
  const item=add(h('details','review-item'),h('summary','',q.prompt));
  if(q.table)item.append(checkTable(q.table));
  add(item,h('p','',solution(q)),q.why?h('p','muted',q.why):null);box.append(item);
 });
 if(!solved)box.append(h('p','muted','Lời giải sẽ xuất hiện ở đây sau khi em vượt qua từng câu.'));
 main.replaceChildren(add(h('div','lesson-panel'),head,box));focusViewStart(title);
}
function extra(){
 attempt=null;
 const q=lesson.extras[0];
 const [head,title]=basePanel('THỰC HÀNH BỔ SUNG','Bài mở rộng');
 const box=add(h('section','question-card'),h('h2','',q.prompt));
 drawPractice(q,box,()=>{
  if(!progress.extras.includes(q.id)){progress.extras.push(q.id);save(lesson.n)}
  disable(box);const result=h('p','result-card success','✓ Đã ghi nhận tự đối chiếu.');box.append(result);focus(result);
 });
 main.replaceChildren(add(h('div','lesson-panel'),head,box));focusViewStart(title);
}
function celebrateStage(i){
 attempt=null;
 const title=h('h1','','Hoàn thành khu vực '+(i+1)+'!');
 const actions=add(h('div','tool-row'),
  b('Sang khu vực tiếp theo',()=>play(progress.count),'btn primary'),
  b('Xem lời giải',()=>review(i)),
  b('Bản đồ bài này',()=>lessonPage()));
 const panel=add(h('section','lesson-panel celebration'),
  h('span','award',MEDALS[i]),title,
  h('p','muted',mission.stages[i]),actions);
 main.replaceChildren(panel);
 focusViewStart(title);
}
function certificate(){
 if(!hasCertificate(progress)){lessonPage();return}
 attempt=null;
 const title=h('h1','','Chứng nhận hoàn thành');
 const recipient=h('p','certificate-recipient');
 const name=input('',value=>{recipient.textContent=value.trim()},{maxLength:80,autocomplete:'off'});
 const date=new Intl.DateTimeFormat('vi-VN',{
  day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Asia/Ho_Chi_Minh'
 }).format(new Date(progress.certificateAt));
 const card=add(h('section','certificate-card'),
  h('span','certificate-icon','🏆'),
  h('p','eyebrow','CODEQUEST · TIN HỌC 5'),
  title,recipient,
  h('h3','','Bài '+lesson.code+' · '+lesson.title),
  h('p','','25 câu luyện tập · 2 nhiệm vụ thực hành'),
  h('p','certificate-date','Ngày hoàn thành: '+date));
 const actions=add(h('div','certificate-actions'),
  field('Tên trên chứng nhận (tùy chọn)',name),
  b('In / lưu PDF',()=>window.print(),'btn primary'));
 if(lesson.extras.length)actions.append(b('Bài mở rộng',()=>extra()));
 main.replaceChildren(add(h('div','lesson-panel certificate-view'),
  b('☰ Bản đồ bài này',()=>lessonPage()),card,actions));
 focusViewStart(title);
}
document.querySelector?.('.skip')?.addEventListener('click',e=>{e.preventDefault();main.scrollIntoView({block:'start'});focus(main)});
window.addEventListener('hashchange',route);
route();

// These controls apply to user actions in the lesson, not to browser extensions.
(() => {
 const notice=h('p','notice lesson-clipboard-notice');
 notice.setAttribute('role','status');
 notice.setAttribute('aria-atomic','true');
 document.body.append(notice);
 let hideNotice;

 function selectionTouchesLesson(){
  const selection=document.getSelection?.();
  if(!selection||selection.isCollapsed)return false;
  for(let i=0;i<selection.rangeCount;i++){
   if(selection.getRangeAt(i).intersectsNode(main))return true;
  }
  return false;
 }

 function restrictClipboard(event){
  if(!lesson||main.querySelector('.certificate-view'))return;
  const carriesSelection=['copy','cut','dragstart'].includes(event.type);
  if(!main.contains(event.target)&&!(carriesSelection&&selectionTouchesLesson()))return;
  if(event.type==='beforeinput'&&!['insertFromPaste','insertFromPasteAsQuotation','insertFromDrop'].includes(event.inputType))return;
  if(!event.cancelable)return;
  event.preventDefault();
  notice.textContent=carriesSelection
   ?'Bài học này đã tắt sao chép và cắt nội dung.'
   :'Hãy nhập câu trả lời trực tiếp. Bài học này đã tắt dán và thả nội dung.';
  clearTimeout(hideNotice);
  hideNotice=setTimeout(()=>{notice.textContent=''},4000);
 }

 for(const type of ['copy','cut','paste','dragstart','drop','beforeinput']){
  document.addEventListener(type,restrictClipboard,{capture:true});
 }
})();

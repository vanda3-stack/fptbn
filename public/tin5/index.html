9 giờ thay vì 8 giờ. Sửa điều gì trước?","type":"choice","choices":["Đổi thông tin thành 8 giờ","Đổi phông","Thêm khung","Đổi tên thư mục"],"correct":[0],"why":"Lỗi nội dung ảnh hưởng trực tiếp người đọc."},{"id":"T5-B07-C17","prompt":"Em thấy sai tên trường và hình che một câu. Chọn hai việc sửa.","type":"multi","choices":["Sửa chữ ở dòng tên trường","Đổi vị trí hoặc kích thước hình để thấy câu","Xóa tất cả đoạn","Chỉ thay tên tệp"],"correct":[0,1],"why":"Sửa nội dung và sửa bố trí đều cần thiết."},{"id":"T5-B07-C18","prompt":"Ghép lỗi với nhóm cần kiểm tra.","type":"match","groups":["Nội dung","Hình thức","Lưu tệp"],"items":["Thiếu địa điểm","Tiêu đề cùng cỡ với thân bài dù đề yêu cầu lớn hơn","Lưu sang thư mục Nhạc"],"assign":[0,1,2],"grouping":false,"why":"Mỗi lỗi có cách kiểm tra khác nhau."},{"id":"T5-B07-C19","prompt":"Đã sửa ngày trên màn hình nhưng mở tệp nộp vẫn thấy ngày cũ. Việc nên làm là gì?","type":"choice","choices":["Lưu bản vừa sửa vào đúng tệp cần nộp và mở lại","Chỉ gõ lại ngày trong tên thư mục","Đóng bản đang sửa mà không lưu","Đổi màu dòng ngày"],"correct":[0],"why":"Tệp nộp phải chứa thay đổi mới nhất."},{"id":"T5-B07-C20","prompt":"Bạn sao chép thư mời lần trước và còn sót địa điểm cũ. Dò nhanh phần nào?","type":"choice","choices":["Các thông tin thay đổi giữa hai lần tổ chức","Chỉ cỡ chữ","Chỉ biểu tượng tệp","Tên phần mềm"],"correct":[0],"why":"Khi dùng mẫu cũ cần cập nhật các thông tin sự kiện."}]},{"goal":"Giữ định dạng cần thiết và cập nhật đủ dữ liệu của sự kiện.","study":{"points":["Lưu sản phẩm với tên dễ nhận ra vào đúng thư mục. Mở lại tệp để kiểm tra văn bản đã lưu.","Kiểm tra tiêu đề, hình minh họa và tên tệp theo yêu cầu.","Khi tạo bản mới từ mẫu, lưu với tên khác nếu muốn giữ bản cũ. Sau đó rà thông tin thay đổi."],"example":"Giữ bố cục thư cũ, tạo bản mới rồi đổi ngày, giờ và phòng."},"tasks":[{"id":"T5-B07-C21","prompt":"Dùng mẫu thư cũ cho buổi đọc sách mới. Chọn hai việc cần làm.","type":"multi","choices":["Đổi tên hoạt động, giờ và nơi theo đề mới","Lưu thành tệp mới nếu cần giữ mẫu","Nộp bản cũ vì chữ đã đẹp","Xóa luôn mẫu cũ trước khi mở"],"correct":[0,1],"why":"Cập nhật nội dung và giữ mẫu khi cần dùng lại."},{"id":"T5-B07-C22","prompt":"Xếp bước tạo thư mời hội khỏe từ mẫu đang có.","type":"order","steps":["Sửa giờ, nơi và hình theo hội khỏe","Mở mẫu","Mở lại bản nộp để đối chiếu","Lưu bản riêng tên Moi_hoi_khoe"],"sequence":[1,3,0,2],"why":"Lưu bản riêng rồi sửa và kiểm tra bản sẽ nộp."},{"id":"T5-B07-C23","prompt":"Đề cần tên sự kiện, ngày, phòng và ảnh liên quan. Bản A đủ chữ nhưng ảnh sai, B thiếu ngày, C đủ chữ và ảnh đúng, D đúng ảnh nhưng thiếu phòng. Nộp bản nào?","type":"choice","choices":["Bản C","Bản A","Bản B","Bản D"],"correct":[0],"why":"Chỉ C đáp ứng cả nội dung và ảnh."},{"id":"T5-B07-C24","prompt":"Ghép tiêu chí với cách tự kiểm tra.","type":"match","groups":["Đủ nội dung","Dễ đọc","Mở đúng bản"],"items":["Đọc lại giờ và nơi","Kiểm tra chữ với ảnh trên cả trang","Mở đúng đường dẫn tệp đã lưu"],"assign":[0,1,2],"grouping":false,"why":"Bản nộp cần đúng nội dung, trình bày và tệp."},{"id":"T5-B07-C25","prompt":"Chọn hai cách giúp giáo viên mở được đúng thư mời.","type":"multi","choices":["Đặt tên tệp theo đề","Mở thử bản trong đúng thư mục nộp","Chỉ chụp màn hình tên tệp","Để hai bản khác nhau có tên giống trong thư mục nộp"],"correct":[0,1],"why":"Tên rõ và việc mở thử giúp phát hiện gửi nhầm."}]}],"extras":[]},"8":{"n":8,"code":"8a","title":"Làm quen với phần mềm đồ họa","pages":"37–42","stages":[{"goal":"Gọi tên bút, tẩy, tô màu và hình vẽ.","study":{"points":["Phần mềm đồ họa hỗ trợ vẽ, chỉnh sửa hình và viết chữ để tạo sản phẩm như tranh hoặc thiệp.","Dùng phần mềm đồ họa khi nhiệm vụ chính là tạo và chỉnh sửa hình.","Bút tạo nét tự do, còn công cụ hình tạo đường bao có sẵn."],"example":"Dùng hình bầu dục vẽ quả bóng rồi dùng bút vẽ dây."},"tasks":[{"id":"T5-B8A-C01","prompt":"Mục nào tương ứng với mô tả “Tạo nét tự do”?","type":"choice","choices":["Bút vẽ","Cả ba mục đều có cùng vai trò.","Tẩy","Tô màu"],"correct":[0],"why":"Bút vẽ: Tạo nét tự do."},{"id":"T5-B8A-C02","prompt":"Mục nào có đặc điểm “Tô vùng hoặc hình đã chọn”?","type":"choice","choices":["Tô màu","Cả ba mục đều có đặc điểm này.","Bút vẽ","Tẩy"],"correct":[0],"why":"Tô màu: Tô vùng hoặc hình đã chọn."},{"id":"T5-B8A-C03","prompt":"Chọn mô tả đúng cho “Tẩy”.","type":"choice","choices":["Xóa phần nét cần bỏ","Tạo nét tự do","Tô vùng hoặc hình đã chọn","Ba mô tả đều đúng."],"correct":[0],"why":"Tẩy: Xóa phần nét cần bỏ."},{"id":"T5-B8A-C04","prompt":"Chọn hai công cụ giúp tạo nét hoặc đường bao mới.","type":"multi","choices":["Bút vẽ","Hình bầu dục","Tẩy","Lưu tệp"],"correct":[0,1],"why":"Bút và hình vẽ đều thêm nét vào tranh."},{"id":"T5-B8A-C05","prompt":"Bạn gán mô tả “Tạo nét tự do” cho “Tẩy”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Bút vẽ”.","Gán đúng cho “Tẩy”.","Gán nhầm. Mô tả này thuộc “Tô màu”.","Mô tả đúng cho cả ba mục."],"correct":[0],"why":"Mô tả thuộc mục “Bút vẽ”."}]},{"goal":"Phân biệt vẽ nét, tô vùng và sửa nét.","study":{"points":["Mỗi công cụ phục vụ một việc. Bút vẽ tạo nét tự do, công cụ hình vẽ tạo hình có sẵn, còn tô màu giúp phủ màu một vùng.","Muốn tạo hình bầu dục đều, thử dùng hình có sẵn.","Tô màu phù hợp khi muốn phủ nhanh một vùng có đường bao kín."],"example":"Một dây bóng cong có thể vẽ bằng bút, còn thân bóng có thể dùng hình bầu dục."},"tasks":[{"id":"T5-B8A-C06","prompt":"Ghép từng mô tả với tên phù hợp.","type":"match","groups":["Bút vẽ","Tô màu","Tẩy"],"items":["Tạo nét tự do","Tô vùng hoặc hình đã chọn","Xóa phần nét cần bỏ"],"assign":[0,1,2],"grouping":false,"why":"Bút vẽ → Tạo nét tự do · Tô màu → Tô vùng hoặc hình đã chọn · Tẩy → Xóa phần nét cần bỏ."},{"id":"T5-B8A-C07","prompt":"Hình chiếc lá đã có viền kín. Muốn phủ xanh bên trong bằng một lần nháy, dùng gì?","type":"choice","choices":["Công cụ tô màu","Tẩy","Công cụ văn bản","Xoay ảnh"],"correct":[0],"why":"Tô màu phủ vùng được đường viền bao quanh."},{"id":"T5-B8A-C08","prompt":"Chọn hai thẻ có phần tên và mô tả khớp nhau.","type":"multi","choices":["Bút vẽ — Tạo nét tự do","Tô màu — Xóa phần nét cần bỏ","Tẩy — Xóa phần nét cần bỏ","Tẩy — Tô vùng hoặc hình đã chọn"],"correct":[0,2],"why":"B phải ghép với “Tô vùng hoặc hình đã chọn”, còn D dùng mô tả của “Tô màu”."},{"id":"T5-B8A-C09","prompt":"Hai mô tả lần lượt là “Tạo nét tự do” và “Tô vùng hoặc hình đã chọn”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Bút vẽ” và “Tô màu”.","Chúng mô tả lần lượt “Tô màu” và “Bút vẽ”.","Hai mô tả có cùng ý nghĩa.","Chúng đều mô tả “Tẩy”."],"correct":[0],"why":"Chúng mô tả lần lượt “Bút vẽ” và “Tô màu”."},{"id":"T5-B8A-C10","prompt":"Chọn lời giải thích phân biệt “Bút vẽ” với “Tẩy”.","type":"choice","choices":["Bút vẽ — Tạo nét tự do. Tẩy — Xóa phần nét cần bỏ.","Bút vẽ — Tạo nét tự do. Tẩy — Tô vùng hoặc hình đã chọn.","Bút vẽ — Xóa phần nét cần bỏ. Tẩy — Tạo nét tự do.","Bút vẽ — Tô vùng hoặc hình đã chọn. Tẩy — Xóa phần nét cần bỏ."],"correct":[0],"why":"Bút vẽ — Tạo nét tự do. Tẩy — Xóa phần nét cần bỏ."}]},{"goal":"Phối hợp công cụ vẽ, tô và chọn vùng.","study":{"points":["Trong Paint, chọn công cụ và màu rồi thao tác trên vùng vẽ. Có thể phối hợp hình bầu dục, nét vẽ và tô màu để vẽ bóng bay.","Chọn màu trước khi tô và nháy đúng vùng cần đổi.","Chọn công cụ, màu và vùng cần thao tác. Muốn nhân một hình, chọn đúng phần tranh đó trước khi sao chép."],"example":"Vẽ thân bóng, tô, rồi vẽ dây. Kiểm tra dây chạm phần dưới quả bóng."},"tasks":[{"id":"T5-B8A-C11","prompt":"Xếp cách vẽ quả bóng kín và tô bằng Paint.","type":"order","steps":["Nháy trong lòng hình để tô","Vẽ hình bầu dục kín","Chọn công cụ tô và màu","Chọn công cụ hình bầu dục"],"sequence":[3,1,2,0],"why":"Tạo vùng kín trước khi tô."},{"id":"T5-B8A-C12","prompt":"Muốn sao chép đúng một quả bóng trong tranh, chọn hai thao tác.","type":"multi","choices":["Dùng vùng chọn khoanh quả bóng","Sao chép rồi dán phần đã chọn","Dùng tẩy xóa quả bóng trước","Chọn toàn bộ tranh dù không cần"],"correct":[0,1],"why":"Vùng chọn giới hạn phần được sao chép."},{"id":"T5-B8A-C13","prompt":"Ghép chi tiết với công cụ.","type":"match","groups":["Hình bầu dục","Bút vẽ","Tẩy"],"items":["Thân quả bóng","Dây uốn tự do","Xóa nét thừa"],"assign":[0,1,2],"grouping":false,"why":"Chọn công cụ theo dạng chi tiết."},{"id":"T5-B8A-C14","prompt":"Muốn có quả bóng thứ hai giống hệt quả thứ nhất, làm gì nhanh nhất?","type":"choice","choices":["Chọn quả bóng, sao chép và dán rồi di chuyển","Tô nền bằng màu của bóng","Đổi tên tệp","Xoay cả tranh"],"correct":[0],"why":"Nhân bản giữ nguyên hình và màu của vùng chọn."},{"id":"T5-B8A-C15","prompt":"Em cần đặt bản sao quả bóng sang bên cạnh. Thao tác nào làm đúng?","type":"choice","choices":["Kéo vùng chọn của bản sao sang vị trí trống","Kéo toàn cửa sổ Paint","Xóa bản gốc","Kéo thanh màu"],"correct":[0],"why":"Di chuyển vùng chọn thay đổi vị trí bản sao."}]},{"goal":"Phát hiện đường bao hở, vùng chọn lệch hoặc hình bị méo.","study":{"points":["Có thể chọn một phần hình để đổi kích thước, xoay hoặc sao chép. Hãy chọn sát đối tượng cần sửa.","Nếu thao tác ảnh hưởng cả nền, kiểm tra lại vùng đang chọn.","Nếu màu lan ra nền, xem đường viền đã khép kín chưa. Nếu sao chép thừa, khoanh lại vùng cần lấy."],"example":"Một khe hở nhỏ nối vùng trong với nền bên ngoài."},"tasks":[{"id":"T5-B8A-C16","prompt":"Em nháy tô trong bóng nhưng cả nền đổi màu. Sửa gì trước?","type":"choice","choices":["Hoàn tác và khép kín chỗ hở ở viền","Đổi tên tranh","Tăng độ dày dây bóng","Tô thêm ngoài nền"],"correct":[0],"why":"Tô màu lan qua khe hở."},{"id":"T5-B8A-C17","prompt":"Bản sao bóng mang theo nửa chiếc lá bên cạnh. Chọn hai việc sửa.","type":"multi","choices":["Bỏ bản sao sai","Chọn lại sát quả bóng rồi sao chép","Chỉ đổi màu quả bóng","Chọn luôn cả vùng vẽ"],"correct":[0,1],"why":"Cần loại bản sai và giới hạn lại vùng chọn."},{"id":"T5-B8A-C18","prompt":"Ghép lỗi với việc kiểm tra.","type":"match","groups":["Viền","Vùng chọn","Tỉ lệ hình"],"items":["Màu tràn ra nền","Bản sao có vật không cần","Hình tròn bị kéo dài một phía"],"assign":[0,1,2],"grouping":false,"why":"Mỗi dấu hiệu chỉ ra phần khác nhau cần sửa."},{"id":"T5-B8A-C19","prompt":"Em muốn xóa nét chì nhỏ nhưng công cụ tô làm đổi màu cả mảng. Dùng gì?","type":"choice","choices":["Tẩy ở vùng nét nhỏ","Tô màu nền trên cả tranh","Xoay hình","Chèn văn bản"],"correct":[0],"why":"Tẩy giúp bỏ nét tại chỗ cần sửa."},{"id":"T5-B8A-C20","prompt":"Chỉ muốn xoay một hình nhưng cả tranh bị xoay. Em cần làm gì?","type":"choice","choices":["Hoàn tác, chọn riêng hình rồi xoay phần chọn","Xoay thêm một lần bất kì","Dùng tẩy toàn vùng","Tô lại màu"],"correct":[0],"why":"Giới hạn vùng chọn trước khi xoay."}]},{"goal":"Phối hợp sao chép, màu sắc và bố cục.","study":{"points":["Từ một hình đã vẽ, em có thể sao chép, thay đổi hướng hoặc kích thước để tạo nhóm hình.","Thử tạo nhiều quả bóng từ một mẫu rồi đặt chúng ở các vị trí khác nhau.","Dùng lại hình mẫu cho các hình giống nhau. Đổi màu hoặc cỡ ở từng bản sao để tạo khác biệt."],"example":"Tạo ba quả từ một mẫu, đặt lệch nhau và tô các màu riêng."},"tasks":[{"id":"T5-B8A-C21","prompt":"Muốn hai quả bóng cùng hình nhưng khác màu, chọn hai bước phù hợp.","type":"multi","choices":["Sao chép một quả bóng có viền kín","Tô lại vùng bên trong của bản sao","Xóa đường viền bản sao trước khi tô","Xoay toàn trang"],"correct":[0,1],"why":"Nhân bản giữ hình, tô vùng kín tạo màu khác."},{"id":"T5-B8A-C22","prompt":"Xếp các bước tạo hai quả bóng rồi kiểm tra đường dây.","type":"order","steps":["Tạo và tô quả đầu","Vẽ dây cho từng quả","Nhân bản và đặt quả thứ hai","Xem dây có nối đúng không"],"sequence":[0,2,1,3],"why":"Tạo các thân bóng và đặt xong trước khi vẽ, kiểm tra dây."},{"id":"T5-B8A-C23","prompt":"Ghép thay đổi trong yêu cầu với thao tác.","type":"match","groups":["Nhân bản","Đổi kích thước","Tô lại"],"items":["Thêm một quả có hình giống","Làm riêng quả thứ hai nhỏ hơn","Đổi riêng lòng quả thứ ba thành xanh"],"assign":[0,1,2],"grouping":false,"why":"Các thao tác khác nhau tác động lên hình đã chọn."},{"id":"T5-B8A-C24","prompt":"Tranh cần ba quả tách nhau và đủ chỗ vẽ dây. Cách bố trí nào phù hợp?","type":"choice","choices":["Đặt các quả cách nhau, chừa khoảng trống phía dưới","Dồn các quả chồng nhau","Đặt cả ba sát mép dưới","Che dây bằng bản sao"],"correct":[0],"why":"Khoảng trống đủ giúp vẽ và nhìn rõ các dây."},{"id":"T5-B8A-C25","prompt":"Chọn hai điểm cần xem trước khi lưu tranh bóng bay.","type":"multi","choices":["Mỗi quả giữ được đường viền kín","Không có mảng thừa do sao chép","Tên công cụ dài bao nhiêu","Đã mở nhiều cửa sổ chưa"],"correct":[0,1],"why":"Rà viền và bản sao để phát hiện lỗi hình ảnh."}]}],"extras":[]},"9":{"n":9,"code":"9a","title":"Sử dụng phần mềm đồ họa tạo sản phẩm số","pages":"43–45","stages":[{"goal":"Nhận ra vai trò của bố cục, hình trang trí và lời chúc.","study":{"points":["Khi tạo sản phẩm đồ họa, xác định mục đích và nội dung trước. Thiệp có thể gồm nền, hình trang trí và lời chúc.","Chọn lời chúc và hình trang trí phù hợp với người nhận.","Bố cục quyết định vị trí, khoảng trống và cách các phần nằm cạnh nhau."],"example":"Chừa một vùng trống ở giữa để đặt lời chúc."},"tasks":[{"id":"T5-B9A-C01","prompt":"Mục nào tương ứng với mô tả “Xác định vị trí các hình chính”?","type":"choice","choices":["Phác bố cục","Cả ba mục đều có cùng vai trò.","Vẽ và tô màu","Kiểm tra sản phẩm"],"correct":[0],"why":"Phác bố cục: Xác định vị trí các hình chính."},{"id":"T5-B9A-C02","prompt":"Mục nào có đặc điểm “Tạo các thành phần theo bố cục”?","type":"choice","choices":["Vẽ và tô màu","Kiểm tra sản phẩm","Phác bố cục","Cả ba mục đều có đặc điểm này."],"correct":[0],"why":"Vẽ và tô màu: Tạo các thành phần theo bố cục."},{"id":"T5-B9A-C03","prompt":"Chọn mô tả đúng cho “Kiểm tra sản phẩm”.","type":"choice","choices":["Soát chữ và hình trước khi lưu","Xác định vị trí các hình chính","Ba mô tả đều đúng.","Tạo các thành phần theo bố cục"],"correct":[0],"why":"Kiểm tra sản phẩm: Soát chữ và hình trước khi lưu."},{"id":"T5-B9A-C04","prompt":"Một tấm thiệp mừng sinh nhật cần truyền lời chúc. Hai thành phần nào phù hợp?","type":"multi","choices":["Lời chúc sinh nhật","Hình bánh hoặc nến trang trí","Bảng điểm cả lớp","Tên máy đang sử dụng"],"correct":[0,1],"why":"Lời chúc và hình trang trí cùng phục vụ chủ đề."},{"id":"T5-B9A-C05","prompt":"Bạn gán mô tả “Xác định vị trí các hình chính” cho “Kiểm tra sản phẩm”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Phác bố cục”.","Mô tả đúng cho cả ba mục.","Gán nhầm. Mô tả này thuộc “Vẽ và tô màu”.","Gán đúng cho “Kiểm tra sản phẩm”."],"correct":[0],"why":"Mô tả thuộc mục “Phác bố cục”."}]},{"goal":"Giải thích vì sao phải chừa chỗ cho phần chính.","study":{"points":["Bố cục là cách sắp các phần trong vùng vẽ. Nền và hình trang trí hỗ trợ nội dung chính của tấm thiệp.","Chừa khoảng trống để lời chúc dễ nhìn.","Nền, hình và chữ phối hợp để làm rõ nội dung. Chữ cần khác màu nền đủ để đọc."],"example":"Chữ xanh đậm trên nền kem thường dễ đọc hơn chữ vàng nhạt trên nền kem."},"tasks":[{"id":"T5-B9A-C06","prompt":"Ghép từng mô tả với tên phù hợp.","type":"match","groups":["Phác bố cục","Vẽ và tô màu","Kiểm tra sản phẩm"],"items":["Xác định vị trí các hình chính","Tạo các thành phần theo bố cục","Soát chữ và hình trước khi lưu"],"assign":[0,1,2],"grouping":false,"why":"Phác bố cục → Xác định vị trí các hình chính · Vẽ và tô màu → Tạo các thành phần theo bố cục · Kiểm tra sản phẩm → Soát chữ và hình trước khi lưu."},{"id":"T5-B9A-C07","prompt":"Em muốn người nhận thấy lời chúc trước. Nên bố trí thế nào?","type":"choice","choices":["Đặt lời chúc ở vùng thoáng, hình trang trí quanh mép","Đặt hình đè lên chữ","Dồn lời chúc sát góc","Đặt chữ cùng màu nền"],"correct":[0],"why":"Vùng thoáng làm phần chữ chính dễ nhận ra."},{"id":"T5-B9A-C08","prompt":"Chọn hai thẻ có phần tên và mô tả khớp nhau.","type":"multi","choices":["Phác bố cục — Xác định vị trí các hình chính","Vẽ và tô màu — Soát chữ và hình trước khi lưu","Kiểm tra sản phẩm — Soát chữ và hình trước khi lưu","Kiểm tra sản phẩm — Tạo các thành phần theo bố cục"],"correct":[0,2],"why":"B phải ghép với “Tạo các thành phần theo bố cục”, còn D dùng mô tả của “Vẽ và tô màu”."},{"id":"T5-B9A-C09","prompt":"Hai mô tả lần lượt là “Xác định vị trí các hình chính” và “Tạo các thành phần theo bố cục”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Phác bố cục” và “Vẽ và tô màu”.","Chúng mô tả lần lượt “Vẽ và tô màu” và “Phác bố cục”.","Chúng đều mô tả “Kiểm tra sản phẩm”.","Hai mô tả có cùng ý nghĩa."],"correct":[0],"why":"Chúng mô tả lần lượt “Phác bố cục” và “Vẽ và tô màu”."},{"id":"T5-B9A-C10","prompt":"Chọn lời giải thích phân biệt “Phác bố cục” với “Kiểm tra sản phẩm”.","type":"choice","choices":["Phác bố cục — Xác định vị trí các hình chính. Kiểm tra sản phẩm — Soát chữ và hình trước khi lưu.","Phác bố cục — Tạo các thành phần theo bố cục. Kiểm tra sản phẩm — Soát chữ và hình trước khi lưu.","Phác bố cục — Xác định vị trí các hình chính. Kiểm tra sản phẩm — Tạo các thành phần theo bố cục.","Phác bố cục — Soát chữ và hình trước khi lưu. Kiểm tra sản phẩm — Xác định vị trí các hình chính."],"correct":[0],"why":"Phác bố cục — Xác định vị trí các hình chính. Kiểm tra sản phẩm — Soát chữ và hình trước khi lưu."}]},{"goal":"Dùng công cụ tạo hình, màu và chữ theo bản phác.","study":{"points":["Phối hợp các công cụ vẽ, tô màu, sao chép hình và thêm chữ để hoàn thiện tấm thiệp.","Có thể sao chép một hình trang trí rồi đổi vị trí để tạo bố cục cân đối.","Phác vị trí trước rồi vẽ nền và hình. Dùng công cụ chữ để nhập lời chúc ở vùng đã chừa."],"example":"Sao chép một bông hoa đã vẽ để có hai hoa hai bên."},"tasks":[{"id":"T5-B9A-C11","prompt":"Xếp việc tạo thiệp từ trang trống đến bản có lời chúc.","type":"order","steps":["Thêm lời chúc vào vùng trống","Phác vị trí nền, hình, chữ","Kiểm tra toàn thiệp","Vẽ nền và trang trí"],"sequence":[1,3,0,2],"why":"Phác bố cục trước, tạo hình rồi đặt chữ và xem lại."},{"id":"T5-B9A-C12","prompt":"Muốn trang trí bốn góc bằng cùng mẫu sao. Chọn hai việc có ích.","type":"multi","choices":["Vẽ một ngôi sao mẫu","Chọn và sao chép sao rồi đặt ở các góc","Xóa hình mẫu trước khi sao chép","Chèn tất cả sao vào vùng lời chúc"],"correct":[0,1],"why":"Dùng bản sao để lặp lại hình và giữ chỗ cho chữ."},{"id":"T5-B9A-C13","prompt":"Ghép việc trên thiệp với công cụ.","type":"match","groups":["Công cụ chữ","Tô màu","Vùng chọn"],"items":["Nhập “Chúc mừng sinh nhật!”","Tô nền một vùng kín","Sao chép riêng một bông hoa"],"assign":[0,1,2],"grouping":false,"why":"Chữ, màu và sao chép hình cần công cụ khác nhau."},{"id":"T5-B9A-C14","prompt":"Em muốn căn lời chúc vào vùng trống đã định. Dùng công cụ nào để bắt đầu nhập?","type":"choice","choices":["Công cụ chữ","Tẩy","Tô màu","Cắt hình"],"correct":[0],"why":"Công cụ chữ cho phép nhập lời chúc vào vị trí chọn."},{"id":"T5-B9A-C15","prompt":"Một dải trang trí lặp ba hình tròn giống nhau. Cách nào giữ hình đều?","type":"choice","choices":["Vẽ một hình, sao chép và đặt các bản cách đều","Vẽ ngẫu nhiên ba hình với ba cỡ","Dùng tẩy tạo vòng","Tô cả vùng bằng một màu"],"correct":[0],"why":"Bản sao giúp giữ kích thước và hình dạng."}]},{"goal":"Tìm nguyên nhân thiệp rối hoặc khó đọc.","study":{"points":["Xem lại sản phẩm sau khi vẽ. Nếu chữ khó đọc, điều chỉnh vị trí, màu hoặc cỡ chữ.","Thử dùng màu chữ có độ tương phản rõ với nền.","Xem thiệp ở cỡ người nhận sẽ thấy. Kiểm tra chữ bị che, sai chính tả và hình lệch."],"example":"Đổi lời chúc sang màu đậm hoặc dời chữ khỏi hình trang trí nếu khó đọc."},"tasks":[{"id":"T5-B9A-C16","prompt":"Chữ trắng nằm trên nền vàng nhạt và khó đọc. Sửa gì?","type":"choice","choices":["Đổi chữ sang màu đậm tương phản với nền","Đổi chữ sang vàng nhạt hơn","Thêm hình đè lên chữ","Giảm chữ đến mức rất nhỏ"],"correct":[0],"why":"Chữ đậm màu giúp đọc rõ hơn trên nền sáng."},{"id":"T5-B9A-C17","pr 5-B9B-C01","prompt":"Mục nào tương ứng với mô tả “Đối chiếu dụng cụ với hướng dẫn trước khi làm”?","type":"choice","choices":["Chuẩn bị vật liệu","Kiểm tra đồ dùng","Cả ba mục đều có cùng vai trò.","Làm theo từng bước"],"correct":[0],"why":"Chuẩn bị vật liệu: Đối chiếu dụng cụ với hướng dẫn trước khi làm."},{"id":"T5-B9B-C02","prompt":"Mục nào có đặc điểm “Tạm dừng video để hoàn thành thao tác”?","type":"choice","choices":["Làm theo từng bước","Kiểm tra đồ dùng","Cả ba mục đều có đặc điểm này.","Chuẩn bị vật liệu"],"correct":[0],"why":"Làm theo từng bước: Tạm dừng video để hoàn thành thao tác."},{"id":"T5-B9B-C03","prompt":"Chọn mô tả đúng cho “Kiểm tra đồ dùng”.","type":"choice","choices":["So sản phẩm với mục đích và mẫu","Ba mô tả đều đúng.","Tạm dừng video để hoàn thành thao tác","Đối chiếu dụng cụ với hướng dẫn trước khi làm"],"correct":[0],"why":"Kiểm tra đồ dùng: So sản phẩm với mục đích và mẫu."},{"id":"T5-B9B-C04","prompt":"Chọn hai điều nên kiểm tra trước khi làm đồ dùng theo video.","type":"multi","choices":["Có đủ vật liệu theo mẫu","Dụng cụ phù hợp và dùng an toàn","Có bao nhiêu lượt xem trong tuần","Ảnh bìa có màu gì"],"correct":[0,1],"why":"Vật liệu và dụng cụ quyết định em có thể làm theo hay không."},{"id":"T5-B9B-C05","prompt":"Bạn gán mô tả “Đối chiếu dụng cụ với hướng dẫn trước khi làm” cho “Kiểm tra đồ dùng”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Chuẩn bị vật liệu”.","Mô tả đúng cho cả ba mục.","Gán nhầm. Mô tả này thuộc “Làm theo từng bước”.","Gán đúng cho “Kiểm tra đồ dùng”."],"correct":[0],"why":"Mô tả thuộc mục “Chuẩn bị vật liệu”."}]},{"goal":"Giải thích sự phù hợp của video với mục đích và vật liệu sẵn có.","study":{"points":["Chọn video phù hợp với vật liệu, dụng cụ và khả năng thực hiện của em.","Ưu tiên hướng dẫn cho thấy rõ vật liệu và từng bước.","Xem video một lượt, chú ý đoạn cần dụng cụ. Nhờ người lớn hỗ trợ khi có thao tác khó hoặc dụng cụ sắc."],"example":"Nếu có bìa và băng dính, chọn mẫu dùn ịnh."},{"id":"T5-B9B-C20","prompt":"Vách hộp đủ chắc nhưng đáy nhỏ hơn đồ cần để. Lỗi chính là gì?","type":"choice","choices":["Kích thước chưa phù hợp công dụng","Băng dính chưa đúng màu","Video phát quá chậm","Hộp thiếu nhãn"],"correct":[0],"why":"Đồ dùng cần vừa vật định chứa."}]},{"goal":"Cân nhắc mục đích, vật liệu và kiểm tra sử dụng.","study":{"points":["Kiểm tra xem đồ dùng đã làm có sử dụng được đúng mục đích và đủ chắc chắn hay chưa.","Nhận xét sản phẩm dựa trên công dụng và mức hoàn thiện.","Đổi vật liệu có thể làm thay đổi độ cứng. Hãy chọn mẫu phù hợp, thử nhẹ rồi mới sử dụng thường xuyên."],"example":"Khay giấy phù hợp đồ nhẹ hơn vật nặng hoặc ướt."},"tasks":[{"id":"T5-B9B-C21","prompt":"Muốn hộp tái chế đựng các mẩu giấy khô. Chọn hai tiêu chí quan trọng.","type":"multi","choices":["Hộp đủ rộng và đứng vững","Vật liệu sạch và phù hợp đồ khô","Bắt buộc có hình giống hệt video","Có càng nhiều lớp trang trí càng tốt"],"correct":[0,1],"why":"Công dụng và độ ổn định quan trọng hơn giống mẫu từng màu."},{"id":"T5-B9B-C22","prompt":"Xếp việc xử lí khi đổi từ hộp bút sang khay đựng tẩy.","type":"order","steps":["Thử với vài cục tẩy","Xác định kích thước và độ sâu cần","Chọn video khay bìa vừa vật liệu","Làm theo và chỉnh nếu cần"],"sequence":[1,2,3,0],"why":"Dựa vào nhu cầu mới để chọn mẫu và kiểm tra thực tế."},{"id":"T5-B9B-C23","prompt":"Có hộp giấy sạch, hộp giấy ướt và một tờ giấy mỏng. Muốn đựng vài bút, nên dùng vật liệu nào?","type":"choice","choices":["Hộp giấy sạch và còn cứng","Hộp giấy ướt","Tờ giấy mỏng gập một lớp","Trộn cả ba mà không kiểm tra"],"correct":[0],"why":"Hộp còn cứng phù hợp hơn để đứng và giữ bút."},{"id":"T5-B9B-C24","prompt":"Ghép đồ dùng với phép thử.","type":"match","groups":["Hộp bút","Khay tẩy","Hộp giấy vụn"],"items":["Đặt vài bút xem có đổ không","Đặt vài cục tẩy xem góc có bung không","Bỏ vài mẩu giấy khô xem có đủ chỗ không"],"assign":[0,1,2],"grouping":false,"why":"Mỗi phép thử cần phản ánh đúng công dụng."},{"id":"T5-B9  mục tiêu với khối phù hợp.","type":"match","groups":["Sự kiện","Chuyển động","Hiển thị lời nói"],"items":["Bắt đầu khi bấm cờ","Đi thêm 10 bước","Nói “Xong”"],"assign":[0,1,2],"grouping":false,"why":"Mỗi nhóm khối thực hiện một vai trò."},{"id":"T5-B10-C15","prompt":"Mèo cần đi đến đích rồi nói “Đến rồi”. Chọn chuỗi nào?","type":"choice","choices":["Di chuyển đến đích rồi Nói","Nói rồi Di chuyển","Nói hai lần","Đặt lại vị trí rồi kết thúc"],"correct":[0],"why":"Lời nói phải xảy ra sau khi đến đích."}]},{"goal":"Đọc kết quả sai và xác định khối cần đổi vị trí.","study":{"points":["Nếu nhân vật làm đúng việc nhưng sai thứ tự, so lại vị trí các khối với yêu cầu.","Sắp lại khối bị đặt sai rồi bấm cờ xanh để thử lại.","Nếu hành động đúng nhưng sai thời điểm, xem vị trí khối trong chồng."],"example":"Mèo nói “Đã tới” trước khi đi thì chuyển khối nói xuống dưới khối đi."},"tasks":[{"id":"T5-B10-C16","prompt":"Mèo đi rồi lập tức quay lại điểm đầu vì khối Đi tới điểm đầu nằm cuối. Sửa để mèo dừng ở đích?","type":"choice","choices":["Đưa khối Đi tới điểm đầu lên trước các lệnh đi","Nhân đôi khối ở cuối","Xóa cờ xanh","Đổi màu nhân vật"],"correct":[0],"why":"Khối cuối đang ghi đè vị trí vừa đạt."},{"id":"T5-B10-C17","prompt":"Lệnh Nói rời khỏi chồng cờ xanh. Khi bấm cờ, mèo chỉ đi. Chọn hai bước sửa và thử.","type":"multi","choices":["Nối khối Nói vào vị trí đúng của chồng","Bấm cờ để thử lại","Đổi tên tệp rồi giữ khối rời","Xóa nhân vật"],"correct":[0,1],"why":"Khối cần được nối vào chồng sự kiện để chạy."},{"id":"T5-B10-C18","prompt":"Ghép biểu hiện với chỗ cần sửa.","type":"match","groups":["Khối rời","Thứ tự","Vị trí đầu"],"items":["Mèo không thực hiện một lệnh nằm riêng","Mèo nói trước dù yêu cầu nói sau","Mỗi lần chạy bắt đầu ở chỗ khác"],"assign":[0,1,2],"grouping":false,"why":"Kiểm tra kết nối, thứ tự và giá trị khởi đầu."},{"id":"T5-B10-C19","prompt":"Chương trình đặt x = 0, đi sang phải 12 bước, rồi đặt x = 0 lần nữa. x cuối bằng bao nhiêu?","type":"number","answer":0,"why":"Lệnh đặt ở cuối thay vị trí vừa di chuyển."},{"id":"T5-B10-C20","prompt":"Mèo cần quay trái trước khi đi nhưng đi thẳng rồi mới quay. Đổi thế nào?","type":"choice","choices":["Đưa khối quay trái lên trước khối đi","Đặt cờ xanh sau khối đi","Thêm khối nói trước khi đi","Đổi tên khối quay"],"correct":[0],"why":"Hướng cần được đặt trước khi nhân vật di chuyển."}]},{"goal":"Chuyển yêu cầu có nhiều bước thành chồng khối và ca chạy.","study":{"points":["Mô tả hành động của nhân vật thành các bước, ghép khối tương ứng rồi đối chiếu kết quả khi chạy.","Thử một chuỗi gồm di chuyển, đổi trang phục và nói lời chào.","Viết ra trạng thái đầu, thứ tự việc và kết quả cuối. So kết quả ở hai lượt bấm cờ."],"example":"Muốn chào tại đích, kiểm tra điểm bắt đầu, đường đi và thời điểm nói."},"tasks":[{"id":"T5-B10-C21","prompt":"Lắp hoạt cảnh nhân vật xuất hiện ở giữa, quay trái, đi rồi nói.","type":"order","steps":["Đi 20 bước","Đặt nhân vật ở giữa","Nói “Xin chào”","Quay mặt sang trái"],"sequence":[1,3,0,2],"why":"Đặt vị trí và hướng trước khi đi, rồi nói."},{"id":"T5-B10-C22","prompt":"Yêu cầu mèo về điểm đầu mỗi lượt, đi rồi nói “Xong”. Chọn hai tiêu chí kiểm thử.","type":"multi","choices":["Bấm cờ lần hai và quan sát mèo về điểm đầu","Quan sát lời nói xuất hiện sau bước đi","Chỉ xem màu phông","Chỉ chạy khối Nói riêng"],"correct":[0,1],"why":"Kiểm thử cả trạng thái khởi đầu và thứ tự."},{"id":"T5-B10-C23","prompt":"Ghép lúc trong kịch bản với việc tương ứng.","type":"match","groups":["Khởi đầu","Hành động","Kết thúc"],"items":["Đặt tại vạch xuất phát","Đi tới cột cờ","Nói “Đã tới”"],"assign":[0,1,2],"grouping":false,"why":"Dùng mạch đầu, giữa và cuối để chuyển sang lệnh."},{"id":"T5-B10-C24","prompt":"Cần lời chào ở vạch xuất phát và lời “Đến rồi” tại đích. Chuỗi nào đúng?","type":"choice","choices":["Về vạch, nói chào, đi, nói đến rồi","Về vạch, đi, nói chào, nói đến rồi","Nói đến rồi, đi, về vạch","Đi, về vạch, nói chào"],"correct":[0],"why":"Hai lời nói nằm ở hai vị trí khác nhau trong trình tự."},{"id":"T5-B10-C25","prompt":"Từ x = 0, mèo đi sang phải 30 bước rồi sang trái 10 bước, không đặt lại. x cuối là bao nhiêu?","type":"number","answer":20,"why":"Vị trí tăng 30 rồi giảm 10."}]}],"extras":[]},"13":{"n":13,"code":"11","title":"Cấu trúc lặp","pages":"56–58","stages":[{"goal":"Nhận biết việc lặp lại và số lượt.","study":{"points":["Cấu trúc lặp dùng khi một việc hoặc nhóm việc được thực hiện nhiều lần. Các khối bên trong lệnh lặp là những lệnh được lặp lại.","Đánh dấu phần giống nhau giữa các lượt thực hiện.","Thân lặp là các lệnh nằm trong khối lặp. Mỗi lượt thực hiện lần lượt tất cả các lệnh đó."],"example":"Nếu vỗ cánh rồi đợi được đặt trong lặp 3, cả hai việc xảy ra 3 lần."},"tasks":[{"id":"T5-B11-C01","prompt":"Mục nào tương ứng với mô tả “Nhóm lệnh được thực hiện nhiều lần”?","type":"choice","choices":["Thân lặp","Cả ba mục đều có cùng vai trò.","Lặp liên tục","Lặp có số lần"],"correct":[0],"why":"Thân lặp: Nhóm lệnh được thực hiện nhiều lần."},{"id":"T5-B11-C02","prompt":"Mục nào có đặc điểm “Thực hiện thân lặp đúng số lần quy định”?","type":"choice","choices":["Lặp có số lần","Lặp liên tục","Thân lặp","Cả ba mục đều có đặc điểm này."],"correct":[0],"why":"Lặp có số lần: Thực hiện thân lặp đúng số lần quy định."},{"id":"T5-B11-C03","prompt":"Chọn mô tả đúng cho “Lặp liên tục”.","type":"choice","choices":["Tiếp tục thực hiện thân lặp cho đến khi dừng chương trình","Ba mô tả đều đúng.","Thực hiện thân lặp đúng số lần quy định","Nhóm lệnh được thực hiện nhiều lần"],"correct":[0],"why":"Lặp liên tục: Tiếp tục thực hiện thân lặp cho đến khi dừng chương trình."},{"id":"T5-B11-C04","prompt":"Thân lặp gồm “Di chuyển 5 bước” rồi “Đợi 1 giây”. Chọn hai việc được làm ở mỗi lượt.","type":"multi","choices":["Di chuyển 5 bước","Đợi 1 giây","Thêm một nhân vật","Đặt lại chương trình"],"correct":[0,1],"why":"Mỗi lượt chạy cả hai lệnh bên trong."},{"id":"T5-B11-C05","prompt":"Bạn gán mô tả “Nhóm lệnh được thực hiện nhiều lần” cho “Lặp liên tục”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Thân lặp”.","Gán nhầm. Mô tả này thuộc “Lặp có số lần”.","Gán đúng cho “Lặp liên tục”.","Mô tả đúng cho cả ba mục."],"correct":[0],"why":"Mô tả thuộc mục “Thân lặp”."}]},{"goal":"Chọn lặp có số lần hoặc liên tục theo yêu cầu.","study":{"points":["Khối lặp có số lần dừng sau số lượt đã đặt. Khối lặp liên tục tiếp tục chạy cho đến khi chương trình bị dừng.","Chọn lặp có số lần khi đề cho biết số lượt.","Dùng lặp có số lần cho yêu cầu xác định trước. Dùng lặp liên tục khi hoạt động phải chạy tới lúc dừng."],"example":"Nói đúng 4 lần cần lặp 4. Đổi trang phục mãi dùng lặp liên tục."},"tasks":[{"id":"T5-B11-C06","prompt":"Ghép từng mô tả với tên phù hợp.","type":"match","groups":["Thân lặp","Lặp có số lần","Lặp liên tục"],"items":["Nhóm lệnh được thực hiện nhiều lần","Thực hiện thân lặp đúng số lần quy định","Tiếp tục thực hiện thân lặp cho đến khi dừng chương trình"],"assign":[0,1,2],"grouping":false,"why":"Thân lặp → Nhóm lệnh được thực hiện nhiều lần · Lặp có số lần → Thực hiện thân lặp đúng số lần quy định · Lặp liên tục → Tiếp tục thực hiện thân lặp cho đến khi dừng chương trình."},{"id":"T5-B11-C07","prompt":"Em cần trống gõ đúng 5 tiếng rồi dừng. Chọn gì?","type":"choice","choices":["Lặp 5 lần khối phát tiếng trống đến hết","Lặp liên tục","Phát một lần","Đặt phát tiếng bên ngoài lặp 5"],"correct":[0],"why":"Khối phát tiếng phải nằm trong lặp 5."},{"id":"T5-B11-C08","prompt":"Chọn hai thẻ có phần tên và mô tả khớp nhau.","type":"multi","choices":["Thân lặp — Nhóm lệnh được thực hiện nhiều lần","Lặp có số lần — Tiếp tục thực hiện thân lặp cho đến khi dừng chương trình","Lặp liên tục — Tiếp tục thực hiện thân lặp cho đến khi dừng chương trình","Lặp liên tục — Thực hiện thân lặp đúng số lần quy định"],"correct":[0,2],"why":"B phải ghép với “Thực hiện thân lặp đúng số lần quy định”, còn D dùng mô tả của “Lặp có số lần”."},{"id":"T5-B11-C09","prompt":"Hai mô tả lần lượt là “Nhóm lệnh được thực hiện nhiều lần” và “Thực hiện thân lặp đúng số lần quy định”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Thân lặp” và “Lặp có số lần”.","Chúng đều mô tả “Lặp liên tục”.","Hai mô tả có cùng ý nghĩa.","Chúng mô tả lần lượt “Lặp có số lần” và “Thân lặp”."],"correct":[0],"why":"Chúng mô tả lần lượt “Thân lặp” và “Lặp có số lần”."},{"id":"T5-B11-C10","prompt":"Chọn lời giải thích phân biệt “Thân lặp” với “Lặp liên tục”.","type":"choice","choices":["Thân lặp — Nhóm lệnh được thực hiện nhiều lần. Lặp liên tục — Tiếp tục thực hiện thân lặp cho đến khi dừng chương trình.","Thân lặp — Nhóm lệnh được thực hiện nhiều lần. Lặp liên tục — Thực hiện thân lặp đúng số lần quy định.","Thân lặp — Tiếp tục thực hiện thân lặp cho đến khi dừng chương trình. Lặp liên tục — Nhóm lệnh được thực hiện nhiều lần.","Thân lặp — Thực hiện thân lặp đúng số lần quy định. Lặp liên tục — Tiếp tục thực hiện thân lặp cho đến khi dừng chương trình."],"correct":[0],"why":"Thân lặp — Nhóm lệnh được thực hiện nhiều lần. Lặp liên tục — Tiếp tục thực hiện thân lặp cho đến khi dừng chương trình."}]},{"goal":"Dự đoán số lần mỗi hành động được thực hiện.","study":{"points":["Đặt các lệnh cần lặp vào bên trong khối lặp rồi điền số lượt. Các lệnh ngoài khối thực hiện theo vị trí của chúng.","Muốn lặp cả di chuyển và đổi trang phục, đặt cả hai lệnh vào trong khối.","Lệnh trước hoặc sau lặp không tự nhân theo số lượt. Theo dõi riêng lệnh trong và ngoài."],"example":"Nói “Bắt đầu” rồi lặp vỗ cánh 4 lần thì chỉ chào một lần."},"tasks":[{"id":"T5-B11-C11","prompt":"Trong khối lặp 6 lần có lệnh đi 4 bước. Nhân vật luôn đi thẳng. Tổng số bước là bao nhiêu?","type":"number","answer":24,"why":"6 lượt, mỗi lượt 4 bước nên có 24 bước."},{"id":"T5-B11-C12","prompt":"Cần mèo chào một lần rồi nhảy 4 lần. Chọn hai cách đặt khối đúng.","type":"multi","choices":["Đặt Nói trước khối lặp","Đặt Nhảy trong lặp 4","Đặt Nói trong lặp 4","Đặt Nhảy sau lặp"],"correct":[0,1],"why":"Chào nằm ngoài lặp còn "items":["Lặp hết 7 lần thay vì 5","Chào cũng xảy ra 5 lần","Hành động tiếp tục dù yêu cầu dừng sau 5"],"assign":[0,1,2],"grouping":false,"why":"Ba lỗi liên quan đến các phần khác nhau của khối lặp."},{"id":"T5-B11-C19","prompt":"Khối lặp 4 có 2 lệnh đi, mỗi lệnh 3 bước, cùng hướng. Tổng số bước là bao nhiêu?","type":"number","answer":24,"why":"Mỗi lượt đi 6 bước, bốn lượt đi 24 bước."},{"id":"T5-B11-C20","prompt":"Cần nháy đèn 3 lượt rồi nói “Xong” một lần. Bạn để cả nháy và nói trong khối liên tục. Sửa thế nào?","type":"choice","choices":["Đặt nháy trong lặp 3, đặt lời “Xong” sau khối lặp","Giữ khối liên tục và đưa lời nói lên đầu thân","Đặt cả nháy và lời nói trong lặp 3","Nói “Xong” rồi mới nháy"],"correct":[0],"why":"Lặp có số lần sẽ kết thúc sau 3 lượt. Lệnh nói nằm sau khối nên chỉ chạy một lần."}]},{"goal":"Gom nhóm việc lặp, giữ hành động mở đầu và kết thúc.","study":{"points":["Có thể viết gọn một chuỗi thao tác giống nhau bằng một khối lặp.","Tìm nhóm thao tác nhỏ nhất được lặp lại rồi chọn số lượt.","Tìm đoạn giống nhau lặp nguyên cụm. Việc chỉ làm một lần phải đặt ngoài thân."],"example":"“Bắt đầu”, rồi đi–đợi ba lượt, rồi “Xong” có hai lệnh ngoài lặp."},"tasks":[{"id":"T5-B11-C21","prompt":"Xếp cách tạo màn chào, nháy đèn 4 lần, rồi báo xong.","type":"order","steps":["Đặt lặp 4 chứa một lượt nháy","Nói “Xong”","Nói “Bắt đầu”","Khi bấm cờ"],"sequence":[3,2,0,1],"why":"Lời đầu và cuối nằm ngoài lặp 4."},{"id":"T5-B11-C22","prompt":"Bảng đèn phải sáng rồi tắt 3 lượt và cuối cùng đứng yên. Chọn hai điều kiện kiểm tra.","type":"multi","choices":["Đếm đủ 3 lần sáng–tắt","Sau lần tắt cuối không bắt đầu lượt mới","Đèn cứ sáng mãi","Chỉ kiểm tra màu của nền"],"correct":[0,1],"why":"Kiểm tra cả số lượt lẫn trạng thái kết thúc."},{"id":"T5-B11-C23","prompt":"Ghép đoạn diễn biến với cấu trúc.","type":"match","groups":["Một lần trước","Trong thân lặp","Một lần sau"],"items":["Hiện tên tiết mục","Nhảy rồi đợi, thực hiện 4 lượt","Nói “Kết thúc”"],"assign":[0,1,2],"grouping":false,"why":"Tách phần không lặp ra khỏi thân."},{"id":"T5-B11-C24","prompt":"Cần đi–vỗ–đợi 4 lượt. Cách nào ngắn mà đúng?","type":"choice","choices":["Lặp 4 chứa Đi, Vỗ, Đợi theo thứ tự","Lặp 4 chỉ chứa Đi, sau đó Vỗ và Đợi","Lặp liên tục cả ba","Lặp 4 chứa Đợi, Vỗ, Đi"],"correct":[0],"why":"Phải lặp cả nhóm theo đúng thứ tự."},{"id":"T5-B11-C25","prompt":"Mèo đi 5 bước trước vòng lặp, lặp 3 lượt mỗi lượt đi 7 bước rồi đứng lại. Tổng bao nhiêu bước?","type":"number","answer":26,"why":"Lệnh đầu 5 bước và 3 lượt được 21 bước."}]}],"extras":[]},"14":{"n":14,"code":"12","title":"Thực hành sử dụng lệnh lặp","pages":"59–61","stages":[{"goal":"Nhận ra hành động nào được lặp lại trong một lượt bay.","study":{"points":["Khi một nhóm thao tác giống nhau xuất hiện nhiều lần, có thể đưa nhóm đó vào khối lặp trong Scratch.","Tìm các lệnh giống nhau trước khi đếm số lượt.","Mỗi lượt bay của vẹt có thể gồm di chuyển, đổi trang phục, đợi và bật lại ở cạnh."],"example":"Đổi sang trang phục kế tiếp tạo hình ảnh vỗ cánh."},"tasks":[{"id":"T5-B12-C01","prompt":"Mục nào tương ứng với mô tả “Tìm nhóm thao tác xuất hiện giống nhau”?","type":"choice","choices":["Nhận diện đoạn lặp","Cả ba mục đều có cùng vai trò.","Chạy thử","Đặt số lần lặp"],"correct":[0],"why":"Nhận diện đoạn lặp: Tìm nhóm thao tác xuất hiện giống nhau."},{"id":"T5-B12-C02","prompt":"Mục nào có đặc điểm “Quy định số lượt chạy nhóm lệnh”?","type":"choice","choices":["Đặt số lần lặp","Cả ba mục đều có đặc điểm này.","Nhận diện đoạn lặp","Chạy thử"],"correct":[0],"why":"Đặt số lần lặp: Quy định số lượt chạy nhóm lệnh."},{"id":"T5-B12-C03","prompt":"Chọn mô tả đúng cho “Chạy thử”.","type":"choice","choices":["Đếm kết quả để kiểm tra chương trình","Tìm nhóm thao tác xuất hiện giống nhau","Quy định số lượt chạy nhóm lệnh","Ba mô tả đều đúng."],"correct":[0],"why":"Chạy thử: Đếm kết quả để kiểm tra chương trình."},{"id":"T5-B12-C04","prompt":"Trong kịch bản vẹt bay và vỗ cánh suốt lượt, chọn hai khối thuộc thân lặp."," kiểm tra chương trình","Chạy thử — Quy định số lượt chạy nhóm lệnh"],"correct":[0,2],"why":"B phải ghép với “Quy định số lượt chạy nhóm lệnh”, còn D dùng mô tả của “Đặt số lần lặp”."},{"id":"T5-B12-C09","prompt":"Hai mô tả lần lượt là “Tìm nhóm thao tác xuất hiện giống nhau” và “Quy định số lượt chạy nhóm lệnh”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Nhận diện đoạn lặp” và “Đặt số lần lặp”.","Hai mô tả có cùng ý nghĩa.","Chúng mô tả lần lượt “Đặt số lần lặp” và “Nhận diện đoạn lặp”.","Chúng đều mô tả “Chạy thử”."],"correct":[0],"why":"Chúng mô tả lần lượt “Nhận diện đoạn lặp” và “Đặt số lần lặp”."},{"id":"T5-B12-C10","prompt":"Chọn lời giải thích phân biệt “Nhận diện đoạn lặp” với “Chạy thử”.","type":"choice","choices":["Nhận diện đoạn lặp — Tìm nhóm thao tác xuất hiện giống nhau. Chạy thử — Đếm kết quả để kiểm tra chương trình.","Nhận diện đoạn lặp — Tìm nhóm thao tác xuất hiện giống nhau. Chạy thử — Quy định số lượt chạy nhóm lệnh.","Nhận diện đoạn lặp — Quy định số lượt chạy nhóm lệnh. Chạy thử — Đếm kết quả để kiểm tra chương trình.","Nhận diện đoạn lặp — Đếm kết quả để kiểm tra chương trình. Chạy thử — Tìm nhóm thao tác xuất hiện giống nhau."],"correct":[0],"why":"Nhận diện đoạn lặp — Tìm nhóm thao tác xuất hiện giống nhau. Chạy thử — Đếm kết quả để kiểm tra chương trình."}]},{"goal":"Lắp và dự đoán kết quả của nhóm lệnh chuyển động.","study":{"points":["Trong bài thực hành Scratch, đặt nhóm lệnh cho vẹt bay vào khối lặp. Dùng lặp 10 lần hoặc lặp liên tục theo yêu cầu, rồi chạy thử để quan sát.","Quan sát từng lượt và kiểm tra kết quả cuối.","Đưa di chuyển, đổi trang phục, đợi và bật lại vào cùng thân nếu muốn chúng xảy ra mỗi lượt."],"example":"Đặt bật lại ở cạnh giúp vẹt đổi hướng khi tới rìa sân khấu."},"tasks":[{"id":"T5-B12-C11","prompt":"Trong mỗi lượt, vẹt đi, vỗ cánh, đợi rồi kiểm tra cạnh. Xếp bốn khối.","type":"order","steps":["Đợi 1 giây","Trang phục kế tiếp","Bật lại nếu chạm cạnh","Di chuyển 10 bước"],"sequence":[3,1,0,2],"why":"Ghép các khối theo đúng thứ tự của một lượt bay."},{"id":"T5-B12-C12","prompt":"Chọn hai kiểm tra sau khi chạy vẹt bay.","type":"multi","choices":["Quan sát cánh thay đổi trong khi di chuyển","Quan sát vẹt quay lại khi tới cạnh","Chỉ nhìn tên phông nền","Đếm số tệp ảnh trên máy"],"correct":[0,1],"why":"Hai kiểm tra cho thấy phần thân lặp hoạt động theo kịch bản."},{"id":"T5-B12-C13","prompt":"Thân lặp đổi trang phục một lần, lặp 8 lượt. Khối đổi trang phục chạy bao nhiêu lần?","type":"number","answer":8,"why":"Mỗi lượt chạy khối một lần."},{"id":"T5-B12-C14","prompt":"Ghép khối với tác dụng.","type":"match","groups":["Di chuyển","Trang phục","Bật lại ở cạnh"],"items":["Đổi vị trí của vẹt","Đổi tư thế cánh","Giúp đổi hướng ở rìa"],"assign":[0,1,2],"grouping":false,"why":"Các khối phối hợp để vẹt bay và không mắc ở rìa."},{"id":"T5-B12-C15","prompt":"Muốn vẹt bay và vỗ cánh cho tới khi em bấm dừng. Chọn khối bao thân nào?","type":"choice","choices":["Liên tục","Lặp lại 10","Nếu thì","Đợi 1 giây"],"correct":[0],"why":"Liên tục chạy các lệnh trong thân tới lúc dừng."}]},{"goal":"Giải thích vẹt đứng ở mép, không vỗ hoặc dừng sớm.","study":{"points":["Nếu một thao tác chỉ xảy ra một lần trong khi cần lặp, kiểm tra xem khối lệnh đó có nằm ngoài thân lặp hay không.","Sửa vị trí khối rồi chạy thử lại.","Thử từng dấu hiệu. Kiểm tra khối có nằm trong thân và chạy đúng số lượt không."],"example":"Nếu vẹt chỉ đổi trang phục trước vòng lặp, cánh sẽ không đổi trong lúc bay."},"tasks":[{"id":"T5-B12-C16","prompt":"Vẹt cứ đi tới mép mà không quay lại. Thêm gì vào mỗi lượt?","type":"choice","choices":["Bật lại nếu chạm cạnh","Nói “Tới rồi”","Tăng cỡ nhân vật","Thêm tên phông"],"correct":[0],"why":"Khối kiểm tra cạnh cần chạy trong mỗi lượt."},{"id":"T5-B12-C17","prompt":"Vẹt phải bay liên tục nhưng dừng sau 10 lượt, cánh chỉ đổi một lần. Chọn hai cách sửa.","type":"multi","choices":["Đổi lặp 10 sang liên tục","Đưa khối Trang phục kế tiếp vào thân lặp","Đưa Di chuyển ra ngoài","Giảm lượt xuống 1"],"correct":[0,1],"why":"Sửa kiểu lặp và vị trí khối đổi trang phục."},{"id":"T5-B12-C18","prompt":"Ghép triệu chứng với thông số hoặc khối.","type":"match","groups":["Thời gian đợi","Số lần lặp","Lệnh bật lại"],"items":["Cánh đổi quá chậm","Dừng sớm dù đủ thao tác mỗi lượt","Vẹt không đổi hướng ở cạnh"],"assign":[0,1,2],"grouping":false,"why":"Mỗi lỗi gợi ý một phần cần xem."},{"id":"T5-B12-C19","prompt":"Có 1 lệnh đổi trang phục trước lặp và 1 lệnh trong lặp 5. Tổng số lần đổi là bao nhiêu?","type":"number","answer":6,"why":"Một lần trước và năm lần trong thân."},{"id":"T5-B12-C20","prompt":"Bạn kéo Đợi ra ngoài khối liên tục để “đợi ở mỗi lượt”. Kết quả nào đúng?","type":"choice","choices":["Mỗi lượt sẽ không có khoảng đợi đã định","Mỗi lượt vẫn đợi đúng một giây","Vẹt đứng yên","Số lượt tự đổi thành 1"],"correct":[0],"why":"Lệnh ngoài thân không được chạy ở từng lượt."}]},{"goal":"Điều chỉnh nhóm lệnh lặp theo yêu cầu mới rồi thử.","study":{"points":["Có thể thay số lượt hoặc thay nội dung thân lặp để tạo hành động mới.","Mỗi lần đổi một yếu tố để dễ nhận ra thay đổi trong kết quả.","Muốn đổi nhịp, sửa thời gian đợi. Muốn vẽ hình kín bằng lặp, phối hợp số cạnh và góc quay."],"example":"Vẽ tam giác đều bằng ba lượt đi cùng độ dài rồi quay 120°."},"tasks":[{"id":"T5-B12-C21","prompt":"Xếp bước thử một đường vẽ lặp mới.","type":"order","steps":["Chạy và xem đường có khép kín","Đặt lặp theo số cạnh","Chọn hình cần vẽ","Lắp Đi và Quay trong thân"],"sequence":[2,1,3,0],"why":"Chọn hình rồi đặt số lượt và thân, cuối cùng chạy thử."},{"id":"T5-B12-C22","prompt":"Cần giữ vẹt bay liên tục nhưng cánh đổi chậm hơn. Chọn hai việc phù hợp.","type":"multi","choices":["Giữ khối lặp liên tục","Tăng thời gian đợi mỗi lượt","Chuyển sang lặp 1 lần","Bỏ khối đổi trang phục"],"correct":[0,1],"why":"Giữ thời lượng hoạt động và giảm nhịp bằng lệnh đợi."},{"id":"T5-B12-C23","prompt":"Ghép thay đổi muốn có với khối cần chỉnh.","type":"match","groups":["Di chuyển","Đợi","Lặp"],"items":["Tăng độ dài mỗi lần vẹt tiến","Tăng khoảng cách thời gian giữa hai lần vỗ","Dừng sau đúng 8 lượt"],"assign":[0,1,2],"grouping":false,"why":"Điều chỉnh tham số đúng với yêu cầu."},{"id":"T5-B12-C24","prompt":"Muốn vẽ hình vuông cạnh bằng nhau. Chọn thân và số lượt nào?","type":"choice","choices":["Lặp 4, mỗi lượt đi cùng độ dài rồi quay 90°","Lặp 3, quay 90°","Lặp 4, chỉ đi thẳng","Lặp 4, quay 45°"],"correct":[0],"why":"Bốn cạnh và bốn góc quay vuông đưa đường về điểm đầu."},{"id":"T5-B12-C25","prompt":"Mỗi lượt đi 8 bước và vỗ cánh một lần. Cần đủ 40 bước theo cùng hướng. Lặp bao nhiêu lượt?","type":"number","answer":5,"why":"40 chia 8 bằng 5."}]}],"extras":[]},"15":{"n":15,"code":"13","title":"Cấu trúc rẽ nhánh","pages":"62–66","stages":[{"goal":"Gọi tên điều kiện và hành động theo kết quả đúng hoặc sai.","study":{"points":["Rẽ nhánh cho phép chương trình chọn hành động dựa vào một điều kiện. Điều kiện có kết quả đúng hoặc sai.","Tìm từ “nếu” để nhận ra điều kiện trong một tình huống.","Điều kiện là câu kiểm tra. Chương trình chỉ thực hiện nhánh tương ứng với kết quả của câu kiểm tra."],"example":"Nếu chạm màu đỏ thì dừng. “Đang chạm màu đỏ?” là điều kiện."},"tasks":[{"id":"T5-B13-C01","prompt":"Mục nào tương ứng với mô tả “Câu kiểm tra cho kết quả đúng hoặc sai”?","type":"choice","choices":["Điều kiện","Nhánh đúng","Nhánh sai","Cả ba mục đều có cùng vai trò."],"correct":[0],"why":"Điều kiện: Câu kiểm tra cho kết quả đúng hoặc sai."},{"id":"T5-B13-C02","prompt":"Mục nào có đặc điểm “Lệnh thực hiện khi điều kiện đúng”?","type":"choice","choices":["Nhánh đúng","Cả ba mục đều có đặc điểm này.","Điều kiện","Nhánh sai"],"correct":[0],"why":"Nhánh đúng: Lệnh thực hiện khi điều kiện đúng."},{"id":"T5-B13-C03","prompt":"Chọn mô tả đúng cho “Nhánh sai”.","type":"choice","choices":["Lệnh thay thế khi điều kiện sai nếu được chỉ định","Câu kiểm tra cho kết quả đúng hoặc sai","Ba mô tả đều đúng.","Lệnh thực hiện khi điều kiện đúng"],"correct":[0],"why":"Nhánh sai: Lệnh thay thế khi điều kiện sai nếu được chỉ định."},{"id":"T5-B13-C04","prompt":"Chọn hai câu có thể làm điều kiện đúng hoặc sai.","type":"multi","choices":["Có chạm cạnh không?","Điểm có lớn hơn 5 không?","Hãy đi 10 bước","Nói “Xin chào”"],"correct":[0,1],"why":"Hai câu đầu cho kết quả đúng hoặc sai khi kiểm tra."},{"id":"T5-B13-C05","prompt":"Bạn gán mô tả “Câu kiểm tra cho kết quả đúng hoặc sai” cho “Nhánh sai”. Nhận xét nào đúng?","type":"choice","choices":["Gán nhầm. Mô tả này thuộc “Điều kiện”.","Gán đúng cho “Nhánh sai”.","Gán nhầm. Mô tả này thuộc “Nhánh đúng”.","Mô tả đúng cho cả ba mục."],"correct":[0],"why":"Mô tả thuộc mục “Điều kiện”."}]},{"goal":"Giải thích khi nào cần nếu thì và nếu không.","study":{"points":["Rẽ nhánh dạng thiếu dùng khối nếu thì. Rẽ nhánh dạng đủ dùng khối nếu thì nếu không để chọn một trong hai việc.","Xác định việc cần làm khi điều kiện đúng và khi điều kiện sai.","Dùng nếu thì khi chỉ có hành động cho trường hợp đúng. Dùng nếu thì nếu không khi hai trường hợp đều có việc riêng."],"example":"Nếu trời mưa thì mang ô. Nếu mưa thì chơi trong nhà, nếu không thì ra sân."},"tasks":[{"id":"T5-B13-C06","prompt":"Ghép từng mô tả với tên phù hợp.","type":"match","groups":["Điều kiện","Nhánh đúng","Nhánh sai"],"items":["Câu kiểm tra cho kết quả đúng hoặc sai","Lệnh thực hiện khi điều kiện đúng","Lệnh thay thế khi điều kiện sai nếu được chỉ định"],"assign":[0,1,2],"grouping":false,"why":"Điều kiện → Câu kiểm tra cho kết quả đúng hoặc sai · Nhánh đúng → Lệnh thực hiện khi điều kiện đúng · Nhánh sai → Lệnh thay thế khi điều kiện sai nếu được chỉ định."},{"id":"T5-B13-C07","prompt":"Nhân vật nói “Đúng” khi nhập 4 và “Thử lại” với mọi số khác. Chọn khối nào?","type":"choice","choices":["Nếu thì nếu không","Nếu thì với nhánh đúng duy nhất","Lặp 4","Chỉ khối Nói “Đúng”"],"correct":[0],"why":"Hai trường hợp đều có hành động riêng."},{"id":"T5-B13-C08","prompt":"Chọn hai thẻ có phần tên và mô tả khớp nhau.","type":"multi","choices":["Điều kiện — Câu kiểm tra cho kết quả đúng hoặc sai","Nhánh đúng — Lệnh thay thế khi điều kiện sai nếu được chỉ định","Nhánh sai — Lệnh thay thế khi điều kiện sai nếu được chỉ định","Nhánh sai — Lệnh thực hiện khi điều kiện đúng"],"correct":[0,2],"why":"B phải ghép với “Lệnh thực hiện khi điều kiện đúng”, còn D dùng mô tả của “Nhánh đúng”."},{"id":"T5-B13-C09","prompt":"Hai mô tả lần lượt là “Câu kiểm tra cho kết quả đúng hoặc sai” và “Lệnh thực hiện khi điều kiện đúng”. Nhận định nào đúng?","type":"choice","choices":["Chúng mô tả lần lượt “Điều kiện” và “Nhánh đúng”.","Chúng mô tả lần lượt “Nhánh đúng” và “Điều kiện”.","Hai mô tả có cùng ý nghĩa.","Chúng đều mô tả “Nhánh sai”."],"correct":[0],"why":"Chúng mô tả lần lượt “Điều kiện” và “Nhánh đúng”."},{"id":"T5-B13-C10","prompt":"Chọn lời giải thích phân biệt “Điều kiện” với “Nhánh sai”.","type":"choice","choices":["Điều kiện — Câu kiểm tra cho kết quả đúng hoặc sai. Nhánh sai — Lệnh thay thế khi điều kiện sai nếu được chỉ định.","Điều kiện — Lệnh thay thế khi điều kiện sai nếu được chỉ định. Nhánh sai — Câu kiểm tra cho kết quả đúng hoặc sai.","Điều kiện — Lệnh thực hiện khi điều kiện đúng. Nhánh sai — Lệnh thay thế khi điều kiện sai nếu được chỉ định.","Điều kiện — Câu kiểm tra cho kết quả đúng hoặc sai. Nhánh sai — Lệnh thực hiện khi điều kiện đúng."],"correct":[0],"why":"Điều kiện — Câu kiểm tra cho kết quả đúng hoặc sai. Nhánh sai — Lệnh thay thế khi điều kiện sai nếu được chỉ định."}]},{"goal":"Chọn phép kiểm tra, đặt lệnh vào đúng nhánh và dự đoán kết quả.","study":{"points":["Đặt biểu thức điều kiện vào ô kiểm tra rồi ghép lệnh vào nhánh phù hợp trong Scratch.","Chạy thử bằng một tình huống làm điều kiện đúng.","Đọc từ điều kiện. Nếu đúng, làm nhánh thì. Nếu sai, làm nhánh nếu không nếu có."],"example":"Với “điểm > 5”, điểm 6 vào nhánh đúng, điểm 5 vào nhánh sai."},"tasks":[{"id":"T5-B13-C11","prompt":"Xếp việc viết và thử chương trình phân loại điểm.","type":"order","steps":["Chạy thử một ca mỗi nhánh","Chọn điều kiện “Điểm > 5”","Đặt “Đạt” và “Cố lên” vào hai nhánh","Xác định hai thông báo cần hiện"],"sequence":[3,1,2,0],"why":"Từ yêu cầu chọn điều kiện và nhánh, sau đó kiểm thử."},{"id":"T5-B13-C12","prompt":"Điều kiện là “đang chạm cạnh”. Chọn hai tình huống kiểm thử khác nhau.","type":"multi","choices":["Đặt nhân vật ở giữa sân khấu","Cho nhân vật chạm cạnh phải","Chỉ đổi phông","Đổi tên tệp"],"correct":[0,1],"why":"Một ca sai và một ca đúng giúp kiểm tra cả hành vi."},{"id":"T5-B13-C13","prompt":"Phân loại điểm theo kết quả của điều kiện “Điểm > 5”.","type":"match","groups":["Đúng, nói Đạt","Sai, nói Cố lên"],"items":["Điểm 6","Điểm 5","Điểm 7","Điểm 4"],"assign":[0,1,0,1],"grouping":true,"why":"Dấu lớn hơn không tính trường hợp bằng."},{"id":"T5-B13-C14","prompt":"Nếu chạm màu xanh thì phát tiếng. Mèo đang ở vùng vàng, không chạm xanh. Chuyện gì xảy ra?","type":"choice","choices":["Khối phát tiếng trong nhánh không chạy","Phát tiếng hai lần","Tự đổi vùng sang xanh","Đi thêm 10 bước"],"correct":[0],"why":"Điều kiện sai nên bỏ qua hành động của nhánh thì."},{"id":"T5-B13-C15","prompt":"Nếu câu trả lời bằng 8 thì nói “Đúng”, nếu không nói “Thử lại”. Nhập 7 sẽ thấy gì?","type":"choice","choices":["Thử lại","Đúng","Cả hai lời","Không có lời nào"],"correct":[0],"why":"7 khác 8 nên chạy nhánh nếu không."}]},{"goal":"Dùng ca đúng, sai và bằng ngưỡng để tìm lỗi.","study":{"points":["Nếu chương trình chọn nhầm hành động, kiểm tra điều kiện và xem khối lệnh đã nằm đúng nhánh chưa.","Thử cả trường hợp đúng lẫn trường hợp sai.","Nếu đáp án bị đảo, kiểm tra có đặt lệnh nhầm nhánh không. Với ngưỡng, thử cả giá trị bằng."],"example":"Muốn tính cả điểm 5, kiểm tra điều kiện “Điểm > 4” khi điểm là số nguyên."},"tasks":[{"id":"T5-B13-C16","prompt":"Điểm 5 cần được chấp nhận nhưng điều kiện “Điểm > 5” loại điểm 5. Điểm chỉ là số nguyên. Sửa thế nào?","type":"choice","choices":["Đổi thành Điểm > 4","Đổi thành Điểm > 6","Đổi thành Điểm \u003c 5","Đổi thành Điểm = 6"],"correct":[0],"why":"  bên trong trước rồi dùng kết quả ở khối ngoài.","Muốn nhân đôi tổng, đặt khối cộng bên trong khối nhân.","Hỏi dữ liệu, lưu vào biến nếu cần, rồi ghép các khối phép tính. Thử với một số dễ tính tay."],"example":"Cạnh 3 thì diện tích hình vuông bằng 3 × 3 = 9."},"tasks":[{"id":"T5-B15-C11","prompt":"Xếp thao tác viết và thử chương trình tính diện tích hình vuông.","type":"order","steps":["Hiển thị diện tích","Hỏi cạnh và đợi nhập","Tính Cạnh × Cạnh","Lưu Câu trả lời vào Cạnh"],"sequence":[1,3,2,0],"why":"Nhận và lưu dữ liệu trước khi tính và hiển thị."},{"id":"T5-B15-C12","prompt":"Hình chữ nhật dài 6, rộng 4. Chọn hai biểu thức đúng cho yêu cầu tương ứng.","type":"multi","choices":["Diện tích: 6 × 4","Chu vi: (6 + 4) × 2","Diện tích: 6 + 4","Chu vi: 6 × 4"],"correct":[0,1],"why":"Diện tích dùng phép nhân, chu vi gấp đôi tổng dài và rộng."},{"id":"T5-B15-C13","prompt":"Scratch tính (3 + 4) × 2. Kết quả là bao nhiêu?","type":"number","answer":14,"why":"Tính tổng bên trong bằng 7 rồi nhân 2."},{"id":"T5-B15-C14","prompt":"Ghép đầu vào cạnh với diện tích tương ứng.","type":"match","groups":["4","9","16"],"items":["Cạnh 2","Cạnh 3","Cạnh 4"],"assign":[0,1,2],"grouping":false,"why":"Diện tích vuông bằng cạnh nhân cạnh."},{"id":"T5-B15-C15","prompt":"Điểm = 5. Điều kiện “Điểm + 2 > 6” có kết quả gì?","type":"choice","choices":["Đúng vì 7 lớn hơn 6","Sai vì 5 nhỏ hơn 6","Sai vì 7 bằng 6","Trả về số 6"],"correct":[0],"why":"Tính khối cộng trước, sau đó so sánh."}]},{"goal":"Dò dữ liệu đầu vào, phép toán và thứ tự khối.","study":{"points":["Nếu phép tính cho kết quả sai, kiểm tra giá trị của biến, phép toán và vị trí khối lồng.","Tính tay một bộ giá trị đơn giản rồi so với kết quả Scratch.","Khi kết quả sai, tính tay từng khối từ trong ra ngoài. Đổi đầu vào để xem lỗi có lặp không."],"example":"Với cạnh 4, diện tích 8 gợi ý đã cộng 4 + 4 thay vì nhân."},"tasks":[{"id":"T5-B15-C16","prompt":"Tính diện tích vuông cạnh 5 nhưng chương trình trả 10 do dùng Cạnh + Cạnh. Sửa gì?","type":"choice","choices":["Thay dấu cộng bằng nhân","Thay cộng bằng trừ","Đổi cạnh thành 10","Đổi tên biến mà giữ phép cộng"],"correct":[0],"why":"Diện tích hình vuông bằng tích hai cạnh."},{"id":"T5-B15-C17","prompt":"Kết quả vẫn giữ nguyên khi nhập cạnh mới. Chọn hai điều cần kiểm tra.","type":"multi","choices":["Biến Cạnh có được đặt bằng Câu trả lời mới không","Biểu thức có dùng biến Cạnh thay cho số viết sẵn không","Tên phông nền có đổi không","Số trang phục mèo có đủ không"],"correct":[0,1],"why":"Dữ liệu mới phải được lưu và được biểu thức sử dụng."},{"id":"T5-B15-C18","prompt":"Ghép hiện tượng với nơi tìm lỗi.","type":"match","groups":["Phép toán","Dữ liệu","Khối lồng"],"items":["Cần nhân nhưng đang cộng","Đọc lại cạnh của lượt trước","Nhân 4 với 2 trước dù yêu cầu cộng 2 và 3 trước"],"assign":[0,1,2],"grouping":false,"why":"Dò phép toán, đầu vào và thứ tự tính riêng."},{"id":"T5-B15-C19","prompt":"Yêu cầu tính (2 + 3) × 4, nhưng khối đang tính 2 + (3 × 4). Chương trình sai trả bao nhiêu?","type":"number","answer":14,"why":"Khối nhân bên trong trả 12, cộng thêm 2 thành 14."},{"id":"T5-B15-C20","prompt":"Phải nói “Đạt” nếu số điểm bằng 10. Bạn dùng Điểm > 10. Khi nhập 10 thấy không đạt. Sửa gì?","type":"choice","choices":["Dùng Điểm = 10","Dùng Điểm \u003c 10","Dùng Điểm > 11","Dùng Điểm + 10"],"correct":[0],"why":"Đề yêu cầu đúng bằng 10."}]},{"goal":"Lắp công thức mới, thử nhiều giá trị và kiểm tra điều kiện.","study":{"points":["Có thể dùng biểu thức số để tính kết quả và biểu thức điều kiện để quyết định hành động trong chương trình.","Thử nhiều bộ dữ liệu để kiểm tra cả kết quả tính và điều kiện.","Viết công thức trước khi lắp. Chọn giá trị thử làm lộ nhầm phép tính, chẳng hạn cạnh 3 thay vì cạnh 2."],"example":"Với cạnh 2, 2 + 2 và 2 × 2 cùng bằng 4. Cạnh 3 phân biệt được hai cách."},"tasks":[{"id":"T5-B15-C21","prompt":"Xếp cách kiểm tra chương trình tính diện tích cho hai cạnh khác nhau.","type":"order","steps":["So kết quả với phép tính tay","Viết công thức Cạnh × Cạnh","Lắp khối nhận và tính","Chạy thử với cạnh 3 và cạnh 5"],"sequence":[1,2,3,0],"why":"Có công thức rồi lắp, chạy và đối chiếu."},{"id":"T5-B15-C22","prompt":"Muốn phát hiện chương trình cộng cạnh với chính nó thay vì nhân. Chọn hai phép thử làm lộ lỗi.","type":"multi","choices":["Nhập 3 và so với 9","Nhập 5 và so với 25","Nhập 2 và chỉ kiểm tra ra 4","Chạy nhưng không đọc kết quả"],"correct":[0,1],"why":"Với 3 và 5, phép cộng và phép nhân cho kết quả khác nhau."},{"id":"T5-B15-C23","prompt":"Hình chữ nhật dài 7, rộng 3. Biểu thức (Dài + Rộng) × 2 trả bao nhiêu?","type":"number","answer":20,"why":"Tổng dài và rộng là 10, nhân 2 được 20."},{"id":"T5-B15-C24","prompt":"Ghép yêu cầu mới với biểu thức phù hợp.","type":"match","groups":["Cạnh × Cạnh","Cạnh × 4","Cạnh > 5"],"items":["Tính diện tích hình vuông","Tính chu vi hình vuông","Kiểm tra cạnh có vượt 5 không"],"assign":[0,1,2],"grouping":false,"why":"Chọn khối dựa vào đại lượng và loại kết quả cần dùng."},{"id":"T5-B15-C25","prompt":"Trò chơi chỉ tặng sao nếu tổng của A và B lớn hơn 8. Biểu thức nào đặt vào khối nếu?","type":"choice","choices":["A + B > 8","A + B","A × B > 8","A + B = 8"],"correct":[0],"why":"Cần tính tổng rồi so lớn hơn 8."}]}],"extras":[]},"18":{"n":18,"code":"16","title":"Từ kịch bản đến chương trình","pages":"78–82","stages":[{"goal":"Nhận ra nhân vật, sân khấu và hành động.","study":{"points":["Kịch bản mô tả nhân vật, sân khấu và hành động. Khi lập trình, em chuyển từng hành động hoặc điều kiện thành các khối lệnh phù hợp.","Gạch dưới các từ chỉ hành động và các từ chỉ điều kiện.","Kịch bản trả lời ai xuất hiện, ở đâu và làm gì. Nêu luật tính điểm để nhóm dễ kiểm thử."],"example":"Mèo đi theo chuột, bóng lướt trong sân khấu, điểm tăng khi mèo chạm bóng."},"tasks":[{"id":"T5-B16-C01","prompt":"Mục nào tương ứng với mô tả “Mô tả nhân vật và diễn biến”?","type":"choice","choices":["Kịch bản","Cả ba mục đều có cùng vai trò.","Chạy thử","Lập trình"],"correct":[0],"why":"Kịch bản: const h=(tag,cls='',text='')=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e};
function add(parent,...children){parent.append(...children.filter(x=>x!==null&&x!==undefined));return parent}
function b(text,fn,cls='btn subtle'){const e=h('button',cls,text);e.type='button';e.addEventListener('click',fn);return e}
function field(label,control){return add(h('label','field'),h('span','field-label',label),control)}
function select(options,current,onChange){
  const e=h('select');e.append(new Option('Chọn…',''));
  options.forEach((x,i)=>e.append(new Option(x,String(i))));
  e.value=current===null||current===undefined?'':String(current);
  e.addEventListener('change',()=>onChange(e.value===''?null:Number(e.value)));return e
}
function input(value,onInput,opts={}){const e=h('input');Object.assign(e,{value,type:'text',...opts});e.addEventListener('input',()=>onInput(e.value));return e}
function pressed(label,active,fn,cls='chip'){const e=b(label,fn,cls+(active?' selected':''));e.setAttribute('aria-pressed',String(active));return e}
const same=(a,b)=>Array.isArray(a)&&a.length===b.length&&a.every((x,i)=>x===b[i]);
const folded=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').trim();
function stableOrder(n,key){
  const arr=Array.from({length:n},(_,i)=>i);
  let seed=[...key].reduce((a,c)=>Math.imul(a^c.charCodeAt(0),16777619)>>>0,2166136261);
  for(let i=n-1;i>0;i--){seed=(Math.imul(1664525,seed)+1013904223)>>>0;const j=seed%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr
}
function checkTable(rows){
 const box=h('div','table-wrap'),table=h('table','data-table');
 rows.forEach((row,i)=>{const tr=h('tr');row.forEach(v=>{const td=h(i?'td':'th','',v);if(!i)td.scope='col';tr.append(td)});table.append(tr)});return add(box,table)
}
const LABS={};
function mountLab(host,mission,initialDone,award){
  const lab=LABS[mission.mode];let caseNo=initialDone.includes(0)&&!initialDone.includes(1)?1:0;
  let state={},msg=null,done=[...initialDone];
  const ui={
    root:host,
    nextRender(){render()},
    verdict(ok,good,retry){msg={ok,text:ok?good:retry};if(ok&&!done.includes(caseNo)){done.push(caseNo);award(caseNo)}render();host.querySelector('.lab-feedback')?.focus()},
    notify(text){msg={ok:null,text};render();host.querySelector('.lab-feedback')?.focus()},
    change(fn){return()=>{fn();msg=null;render()}},
    action(text,fn){return b(text,fn,'btn primary')}
  };
  function render(){
    const current=lab[caseNo];
    const tabs=h('div','lab-tabs');
    function showCase(i){
      if(caseNo===i)return;
      caseNo=i;state={};msg=null;render();
      host.querySelector('.lab-name')?.focus();
    }
    lab.forEach((_,i)=>{
      const tab=pressed((done.includes(i)?'✓ ':'')+'Nhiệm vụ '+(i+1),i===caseNo,()=>showCase(i));
      tab.disabled=i>0&&!done.includes(i-1);
      tabs.append(tab);
    });
    const stage=h('section','lab-stage');
    const name=h('h3','lab-name',current.title);name.tabIndex=-1;
    add(stage,name,h('p','lab-instruction',current.prompt));
    const play=h('div','lab-play');stage.append(play);
    host.replaceChildren(tabs,stage);
    const aria=h('div','sr-only');aria.id='lab-current';aria.textContent='Mô phỏng '+mission.lab;stage.prepend(aria);
    current.draw(play,state,ui);
    if(msg){
      const out=h('p','lab-feedback '+(msg.ok===true?'success':msg.ok===false?'warning':'neutral'),msg.text);
      out.tabIndex=-1;out.setAttribute('role','status');stage.append(out);
      if(msg.ok&&caseNo===0&&!done.includes(1))stage.append(b('Sang nhiệm vụ 2',()=>showCase(1),'btn primary lab-next'));
    }
  }
  render();
}

function scratchPreview(spec,indices){
 if(indices.includes(null))return h('p','muted','Chọn đủ khối để xem các ca chạy.');
 if(spec.demo==='path')return pathPreview(spec,indices);
 const choices=indices.map((i,j)=>spec.fields[j][1][i]);
 const rows=spec.cases.map(([a,b])=>{
  let output='';
  if(spec.demo==='expression'){
   const number=indices[0]===0?a+b:indices[0]===1?a-b:String(a)+String(b);
   output=indices[1]===0?'Điểm: '+number:String(number);
  }else if(spec.demo==='condition'){
   const pass=indices[0]===0?a>=b:indices[0]===1?a>b:a<b;
   output=pass?choices[1]:'Chưa đạt';
  }else if(spec.demo==='guess'){
   const secret=a,attempts=b;
   const found=attempts.indexOf(secret);
   const trace=(indices[0]===0&&found>=0?attempts.slice(0,found+1):attempts)
     .map(value=>value===secret?'Đúng':(value<secret)===(indices[1]===0)?'Thấp':'Cao');
   output=trace.join(' → ');
  }else{
   const secret=a,attempts=b;
   const found=attempts.indexOf(secret), limit=found>=0?found+1:attempts.length;
   const count=indices[0]===0?limit:indices[0]===1?limit-(found>=0?1:0):0;
   output=indices[1]===0?'Số lượt: '+count:String(count);
  }
  return [Array.isArray(b)?'Bí mật '+a+'; nhập '+b.join(', '):a+', '+b,output];
 });
 return checkTable([['Đầu vào','Kết quả mô phỏng'],...rows]);
}

function pathPreview(spec,[repeat,move,turn]){
 const choices=spec.fields.map(([,options])=>options);
 const [count,distance,angle]=[repeat,move,turn].map((index,i)=>Number.parseInt(choices[i][index],10));
 let x=0,y=0,heading=0;
 const points=[[x,y]];
 for(let i=0;i<count;i++){
  x+=distance*Math.cos(heading);y-=distance*Math.sin(heading);
  points.push([x,y]);heading+=angle*Math.PI/180;
 }
 const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]);
 const minX=Math.min(...xs),minY=Math.min(...ys);
 const span=Math.max(Math.max(...xs)-minX,Math.max(...ys)-minY,1);
 const screen=points.map(([px,py])=>[10+(px-minX)*80/span,10+(py-minY)*80/span]);
 const board=h('div','scratch-path');
 board.setAttribute('aria-hidden','true');
 for(let i=1;i<screen.length;i++)segment(board,screen[i-1],screen[i]);
 const closed=Math.hypot(x,y)<.01;
 return add(h('div'),board,h('p','',count+' nét · '+(closed?'đường khép kín':'đường chưa khép kín')));
}

function formulaValue(formula,data){
 const factors=/^=(\$?[A-Z]\$?[1-9]\d*)\*(\$?[A-Z]\$?[1-9]\d*)$/.exec(formula);
 if(!factors)return NaN;
 return data[factors[1].replace(/\$/g,'')]*data[factors[2].replace(/\$/g,'')];
}
function makeFormula(spec){
 return {title:spec.title,prompt:spec.prompt,draw(box,state,ui){
  state.formulas??=spec.answers.map(()=>'');
  const form=h('div','form-grid');
  spec.answers.forEach((_,i)=>form.append(field('Công thức ô D'+(i+2),
   input(state.formulas[i],value=>{state.formulas[i]=value},{maxLength:25,spellcheck:false,autocomplete:'off'}))));
  const data=spec.rows.map(row=>Object.entries(row).map(([key,value])=>key+'='+value).join(', '));
  const results=spec.rows.map((row,i)=>[data[i],...(state.results?.[i]??spec.answers.map(()=>null))
   .map(value=>value===null?'—':Number.isFinite(value)?String(value):'Không tính được')]);
  const run=ui.action('Chạy công thức',()=>{
   const formulas=state.formulas.map(text=>text.trim().toUpperCase().replace(/\s+/g,''));
   state.results=spec.rows.map(row=>formulas.map(formula=>formulaValue(formula,row)));
   const ok=formulas.every((formula,i)=>spec.answers[i].includes(formula));
   ui.verdict(ok,'Công thức giữ đúng tham chiếu và chạy được trên cả hai ca.',spec.hint);
  });
  add(box,form,checkTable([['Dữ liệu vào',...spec.answers.map((_,i)=>'D'+(i+2))],...results]),run);
 }};
}

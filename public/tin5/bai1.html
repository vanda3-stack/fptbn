<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11283f">
<title>Máy tính làm được gì? · Tin học 5</title>
<style>
:root {
  color-scheme: dark;
  --ink: #f4f8ff;
  --muted: #c3d6ea;
  --paper: #11283f;
  --panel: #18334d;
  --card: #213f59;
  --line: #66849e;
  --gold: #ffda82;
  --teal: #85e1cc;
  --teal-ink: #102c32;
}
* { box-sizing: border-box }
body {
  margin: 0;
  color: var(--ink);
  background: radial-gradient(ellipse at top, #254765, var(--paper) 720px);
  font: 600 1rem/1.6 Nunito, ui-rounded, system-ui, sans-serif;
}
h1, h2, h3, p { margin: 0 }
h1 { font-size: clamp(2.5rem, 7vw, 5rem); letter-spacing: -.055em; line-height: 1.04; color: var(--gold) }
h2 { font-size: clamp(1.45rem, 3vw, 2.2rem); line-height: 1.2 }
h3 { font-size: 1.16rem; line-height: 1.4 }
p { max-width: 67ch }
button, input { font: inherit }
button {
  cursor: pointer;
  color: inherit;
  text-align: left;
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  padding: .65rem .95rem;
}
button:disabled { cursor: default }
button:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 4px;
}
.primary { color: var(--teal-ink); background: var(--teal); border-color: transparent; font-weight: 800 }
.primary:hover:not(:disabled) { background: #a7f0de }
.primary:disabled { opacity: .58 }
.secondary:hover:not(:disabled), .stage:hover:not(:disabled) { border-color: var(--teal); background: #284c65 }
[hidden] { display: none !important }

header, main { max-width: 1160px; margin: auto; padding-inline: clamp(14px, 4vw, 40px) }
header { min-height: 76px; display: flex; justify-content: space-between; align-items: center; gap: 14px }
.brand, .medalCount { display: flex; align-items: center; gap: .5rem; font-weight: 800 }
.brandMark { background: var(--card); border-radius: 12px; padding: .3rem .55rem; font-size: 1.4rem }
.medalCount { background: var(--panel); border: 1px solid var(--line); border-radius: 100px; padding: .35rem .8rem; white-space: nowrap }
.hero { display: grid; grid-template-columns: 1.45fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 26px; overflow: hidden }
.heroCopy { padding: clamp(22px, 5vw, 54px); display: grid; justify-items: start; gap: 1rem }
.heroCopy p { font-size: 1.12rem; color: var(--muted) }
.eyebrow { font-size: .82rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.art { min-height: 265px; background: #ffdb76; position: relative; overflow: hidden }
.art img { height: 100%; width: 100%; object-fit: cover; position: absolute; inset: 0 }
.sectionTitle { margin: 2rem 0 .8rem }
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px }
.stage { min-height: 132px; display: grid; align-content: start; gap: .3rem }
.stage:disabled { background: #1a334a; color: var(--muted); border-color: #536d84 }
.stage[data-done=true] { background: #22514f; border-color: #79c6b3 }
.stageIcon { font-size: 1.6rem }
.stage small { color: var(--muted); font-size: .83rem }
.homeFoot { margin: 1rem 0 2rem }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; margin: 0 auto 2rem; padding: clamp(16px, 4vw, 36px); max-width: 900px }
.panelTop, .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.panelTop { margin-bottom: 1rem }
.dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 0 0 1rem }
.dots span { height: 8px; background: #365570; border-radius: 8px }
.dots .done { background: var(--teal) }
.dots .current { background: var(--gold) }
.reading {
  --arc: 0deg;
  position: relative;
  isolation: isolate;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: clamp(16px, 4vw, 25px);
  display: grid;
  gap: .65rem;
}
.reading.active::after {
  content: "";
  position: absolute;
  inset: -1px;
  padding: 4px;
  border-radius: inherit;
  pointer-events: none;
  background: conic-gradient(#b5efe5 0deg, #43bbad var(--arc), #57738b var(--arc));
  mask: linear-gradient(white 0 0) content-box, linear-gradient(white 0 0);
  mask-composite: exclude;
}
.reading h3 { color: var(--gold) }
.readingTitle { display: flex; align-items: center; gap: .55rem }
.readingStatus, .subtle { font-size: .94rem; color: var(--muted) }
.examples { display: flex; flex-wrap: wrap; gap: .45rem }
.example { background: #2c4e69; border-radius: 9px; padding: .2rem .55rem; font-size: .9rem }
.prompt { margin-top: 1.2rem; display: grid; gap: .55rem }
.context { margin: 0; padding-left: 1.3rem }
.options { margin: .75rem 0 1rem; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: .65rem }
.option { display: flex; align-items: flex-start; gap: .65rem; min-height: 58px; overflow-wrap: anywhere }
.option:hover:not(:disabled), .option[aria-pressed=true] { border-color: var(--teal); background: #285267 }
.option[data-correct=true] { background: #24574f; border-color: var(--teal) }
.letter { flex: 0 0 1.65rem; text-align: center; background: #395d76; border-radius: 7px; font-weight: 800 }
.fillAnswer { color: var(--ink); background: #112b43; width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: .6rem .85rem }
.notice { border-radius: 13px; padding: .8rem 1rem; margin: .65rem 0; background: #4c3e27; color: #ffebc5 }
.notice.correct { background: #24574f; color: var(--ink) }
.retryPanel { margin: .75rem 0; border-color: #9d8864 }
.retryCheck { display: flex; align-items: center; gap: .6rem; margin: .3rem 0 .85rem }
.retryCheck input { width: 1.25rem; height: 1.25rem; accent-color: var(--teal); flex-shrink: 0 }
.orderBox { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 14px; padding: .85rem; background: #142e47 }
.orderBox ol { margin: .5rem 0; padding-left: 1.6rem }
.orderBox li + li { margin-top: .3rem }
.orderTools { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .55rem }
.orderTools button:disabled, .stepChoice:disabled { opacity: .53 }
.reviewItem { border: 1px solid var(--line); border-radius: 13px; padding: .75rem; margin: .7rem 0; background: var(--card) }
.reviewItem summary { cursor: pointer; font-weight: 800 }
.reviewItem p { margin: .5rem 0 }
.reviewItem ul { padding-left: 1.3rem }
.celebration { text-align: center; border-color: #bd9f64; padding-block: clamp(28px, 6vw, 58px) }
.celebration h2 { color: var(--gold) }
.celebration p { margin: .75rem auto }
.celebration .actions { justify-content: center; margin-top: 1.4rem }
.award { display: grid; place-items: center; margin: 0 auto 1rem; width: 112px; aspect-ratio: 1; border-radius: 50%; background: #f6ce77; border: 3px solid #ffe7a8; font-size: 3.5rem; animation: award-in .35s ease-out }
@keyframes award-in { from { transform: scale(.8); opacity: .4 } }
@media (max-width: 850px) { .stages { grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)) } }
@media (max-width: 600px) {
  .hero, .options { grid-template-columns: 1fr }
  .art { min-height: 175px }
  .art img { object-position: center 49% }
  .stage { min-height: 112px }
}
@media (prefers-reduced-motion: reduce) {
  .reading.active::after { background: #74d1c2 }
  .award { animation: none }
}
</style>

      "🧩 Sửa nhãn"
    ]
  },
  {
    "knowledge": "Một nhóm có thể tìm tư liệu, cùng soạn bài trình chiếu rồi chia sẻ bản hoàn chỉnh. Máy tính hỗ trợ cả học tập, hợp tác và tạo sản phẩm.",
    "hint": "Tách từng việc trong tình huống để chỉ ra máy tính đã giúp ở bước nào.",
    "pages": "6–7",
    "examples": [
      "📚 Tra cứu",
      "🎨 Làm áp phích",
      "📨 Gửi cho bạn"
    ]
  }
];
const icons=["🌱","🧩","🛠️","🔎","🚀"];
const optionIcons={"Học tập":"📚","Trao đổi thông tin":"💬","Tạo sản phẩm số":"🎨"};
const trophies=["🥉","🥈","🥇","🏅","🏆"];
const storageKey="tin5-bai1-progress-v1";
const blank=()=>({level:0,step:0});
let progress=blank();
try{
  const saved=JSON.parse(localStorage.getItem(storageKey));
  if(Number.isInteger(saved?.level)&&saved.level>=0&&saved.level<=levels.length&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<5)progress=saved;
}catch{}
const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(progress))}catch{}};
const normalizeText=text=>text.normalize("NFD").replace(/\p{M}/gu,"").toLowerCase().replaceAll("đ","d").trim().replace(/\s+/g," ");
let activeLevel=0,activeStep=0,frame=0,phase="home",picked=new Set(),ordered=[];
const show=(screen)=>{
  cancelAnimationFrame(frame);
  phase=screen;
  for(const name of ["home","game","review","celebration"])byId(name).hidden=name!==screen;
};
function home(){
  show("home");
  byId("medals").textContent=progress.level+"/5 huy chương";
  byId("reset").hidden=!(progress.level||progress.step);
  byId("start").textContent=progress.level===5?"Xem lại cấp cuối":progress.level||progress.step?"Tiếp tục":"Bắt đầu";
  const list=byId("stages");
  list.replaceChildren();
  levels.forEach((level,i)=>{
    const done=i<progress.level;
    const card=node("button","","stage");
    card.dataset.done=done;
    card.disabled=i>progress.level;
    const icon=node("span",done?trophies[i]:icons[i],"stageIcon");
    icon.setAttribute("aria-hidden","true");
    card.append(icon,node("strong",level.name),node("small",done?"Xem lời giải":card.disabled?"🔒 Chưa mở":progress.step?progress.step+"/5 câu đã xong":"Sẵn sàng"));
    card.onclick=()=>done?review(i):play(i,progress.step);
    list.append(card);
  });
}
function play(level,step,retrying=false){
  show("game");
  activeLevel=level;activeStep=step;picked=new Set();ordered=[];
  const item=levels[level].questions[step];
  byId("position").textContent="Cấp "+(level+1)+" / 5 · Câu "+(step+1)+" / 5";
  byId("stageTitle").textContent=levels[level].name;
  byId("stageTitle").focus();
  const dots=byId("dots");dots.replaceChildren();
  for(let i=0;i<5;i++)dots.append(node("span","",i<step?"done":i===step?"current":""));
  const card=byId("reading");
  const {knowledge,hint,pages,examples}=study[level];
  byId("material").textContent=knowledge;
  byId("studyHint").textContent="Gợi ý — "+hint;
  byId("studyRef").textContent="Tham chiếu — SGK Tin học 5, Bài 1, trang "+pages+".";
  byId("examples").replaceChildren(...examples.map(example=>node("span",example,"example")));
  byId("readingTitle").textContent="📖 Nội dung học";
  byId("retryPanel").hidden=true;
  byId("retryConfirm").checked=false;
  byId("retry").disabled=true;
  byId("status").textContent="Câu hỏi sẽ hiện khi viền màu chạy đủ một vòng.";
  byId("kind").textContent=item.kind.split(" · ")[0];
  byId("prompt").textContent=item.prompt;
  byId("context").replaceChildren(...item.context.map(line=>node("li",line)));
  byId("context").hidden=!item.context.length;
  byId("instruction").textContent=item.steps?"Bấm lần lượt từng bước theo thứ tự em chọn.":item.wordCount?"Điền "+item.wordCount+" từ vào chỗ trống.":item.correct.length>1?"Chọn tất cả phương án phù hợp.":"Chọn một phương án.";
  const list=byId("options");list.replaceChildren();list.inert=false;
  if(item.steps){
    const box=node("div","","orderBox");
    const sequence=node("ol");
    sequence.setAttribute("aria-live","polite");
    const empty=node("p","Các bước em chọn sẽ hiện ở đây.","subtle");
    const tools=node("div","","orderTools");
    const undo=node("button","Bỏ bước cuối","secondary");
    const clear=node("button","Xếp lại từ đầu","secondary");
    tools.append(undo,clear);
    box.append(node("strong","Thứ tự của em"),empty,sequence,tools);
    const buttons=item.steps.map((step,i)=>{
      const button=node("button",step,"option stepChoice");
      button.onclick=()=>{
        if(phase!=="answer"||ordered.includes(i))return;
        ordered.push(i);updateOrder();
      };
      return button;
    });
    function updateOrder(){
      sequence.replaceChildren(...ordered.map(i=>node("li",item.steps[i])));
      empty.hidden=ordered.length>0;
      buttons.forEach((button,i)=>button.disabled=ordered.includes(i));
      undo.disabled=clear.disabled=!ordered.length;
      byId("submit").disabled=ordered.length!==item.steps.length;
    }
    undo.onclick=()=>{if(phase==="answer"){ordered.pop();updateOrder()}};
    clear.onclick=()=>{if(phase==="answer"){ordered=[];updateOrder()}};
    list.append(box,...buttons);
    updateOrder();
  }else if(item.acceptedText){
    const input=node("input","","fillAnswer");
    input.id="fillAnswer";
    input.type="text";
    input.placeholder="Nhập cụm từ";
    input.autocomplete="off";
    input.spellcheck=false;
    input.setAttribute("aria-label","Nhập đáp án");
    input.setAttribute("aria-describedby","instruction");
    input.oninput=()=>{byId("submit").disabled=!input.value.trim()};
    input.onkeydown=event=>{
      if(event.key==="Enter"&&!event.isComposing)byId("submit").click();
    };
    list.append(input);
  }else item.options.forEach((text,i)=>{
    const button=node("button","","option");
    button.append(node("span","ABCD"[i],"letter"),node("span",text));
    if(optionIcons[text]){
      const visual=node("span",optionIcons[text]);
      visual.setAttribute("aria-hidden","true");
      button.append(visual);
    }
    button.setAttribute("aria-pressed","false");
    button.onclick=()=>{
      if(phase!=="answer")return;
      if(item.correct.length===1)picked=new Set([i]);
      else if(picked.has(i))picked.delete(i);
      else picked.add(i);
      for(const [index,option] of [...list.children].entries())option.setAttribute("aria-pressed",picked.has(index));
      byId("submit").disabled=!picked.size;
    };
    list.append(button);
  });
  for(const id of ["question","feedback","submit","next","reviewCurrent"])byId(id).hidden=true;
  byId("submit").disabled=true;
  function unlock(){
    card.classList.remove("active");
    byId("status").textContent="Câu hỏi đã mở. Em có thể xem lại nội dung khi trả lời.";
    byId("question").hidden=false;
    byId("submit").hidden=false;
    byId("reviewCurrent").hidden=step===0;
    phase="answer";
    if(retrying)byId("prompt").focus();
  }
  if(retrying){unlock();return}
  phase="reading";
  card.style.setProperty("--arc","0deg");card.classList.add("active");
  const deadline=performance.now()+15000;
  function tick(now){
    if(phase!=="reading")return;
    const ratio=Math.max(0,Math.min(1,1-(deadline-now)/15000));
    card.style.setProperty("--arc",ratio*360+"deg");
    if(ratio<1){frame=requestAnimationFrame(tick);return}
    unlock();
  }
  frame=requestAnimationFrame(tick);
}
function review(level){
  show("review");
  byId("reviewTitle").textContent=(level<progress.level?trophies[level]+" ":"")+"Xem lại · "+levels[level].name;
  byId("reviewTitle").focus();
  const limit=level<progress.level?5:progress.step;
  const list=byId("reviewItems");
  list.replaceChildren();
  levels[level].questions.slice(0,limit).forEach((item,i)=>{
    const detail=node("details","","reviewItem");
    detail.append(node("summary","Câu "+(i+1)+" · "+item.kind),node("p",item.prompt+(item.wordCount?" (Điền "+item.wordCount+" từ.)":"")));
    if(item.context.length){
      const context=node("ul");
      context.append(...item.context.map(line=>node("li",line)));
      detail.append(context);
    }
    const answers=node("ul");
    if(item.steps)item.order.forEach((index,j)=>answers.append(node("li",(j+1)+". "+item.steps[index])));
    else if(item.acceptedText)answers.append(node("li","Đáp án: "+item.acceptedText[0]));
    else item.options.forEach((text,i)=>answers.append(node("li","ABCD"[i]+". "+text+(item.correct.includes(i)?" ✓":""))));
    detail.append(answers,node("p",item.why));
    list.append(detail);
  });
}
byId("submit").onclick=()=>{
  if(phase!=="answer")return;
  const item=levels[activeLevel].questions[activeStep];
  const input=byId("fillAnswer");
  if(item.steps?ordered.length!==item.steps.length:item.acceptedText?!input.value.trim():!picked.size)return;
  const correct=item.steps?item.order.every((index,j)=>ordered[j]===index):item.acceptedText
    ?item.acceptedText.some(answer=>normalizeText(answer)===normalizeText(input.value))
    :picked.size===item.correct.length&&item.correct.every(i=>picked.has(i));
  const feedback=byId("feedback");
  feedback.hidden=false;
  feedback.classList.toggle("correct",correct);
  if(!correct){
    phase="retry";
    const {knowledge,hint,pages}=study[activeLevel];
    byId("retryMaterial").textContent=knowledge;
    byId("retryHint").textContent="Gợi ý — "+hint;
    byId("retryRef").textContent="Tham chiếu — SGK Tin học 5, Bài 1, trang "+pages+".";
    for(const id of ["submit","feedback","reviewCurrent"])byId(id).hidden=true;
    byId("options").inert=true;
    byId("retryPanel").hidden=false;
    byId("retryTitle").focus();
    return;
  }
  phase="correct";
  feedback.textContent="Chính xác! "+item.why;
  byId("options").inert=true;
  if(!item.steps)[...byId("options").children].forEach((control,i)=>{control.dataset.correct=Boolean(item.acceptedText||item.correct.includes(i))});
  progress=activeStep===4?{level:activeLevel+1,step:0}:{level:activeLevel,step:activeStep+1};
  save();
  byId("medals").textContent=progress.level+"/5 huy chương";
  byId("submit").hidden=true;
  byId("reviewCurrent").hidden=true;
  if(activeStep===4){celebrate(activeLevel);return}
  byId("next").hidden=false;
  byId("next").focus();
};
function celebrate(level){
  show("celebration");
  byId("award").textContent=trophies[level];
  byId("celebrationTitle").textContent="Em đã vượt qua cấp "+(level+1)+"!";
  byId("celebrationMessage").textContent="Em nhận được huy chương “"+levels[level].name+"” sau khi trả lời đúng cả 5 câu."+(level===levels.length-1?" Em đã hoàn thành tất cả các cấp!":"");
  byId("awardNext").hidden=level===levels.length-1;
  byId("awardNext").onclick=()=>play(progress.level,progress.step);
  byId("awardReview").onclick=()=>review(level);
  byId("celebrationTitle").focus();
}
byId("retryConfirm").onchange=()=>{byId("retry").disabled=!byId("retryConfirm").checked};
byId("retry").onclick=()=>{
  if(phase==="retry"&&byId("retryConfirm").checked)play(activeLevel,activeStep,true);
};
byId("next").onclick=()=>play(activeLevel,activeStep+1);
byId("reviewCurrent").onclick=()=>review(activeLevel);
byId("start").onclick=()=>progress.level===5?review(4):play(progress.level,progress.step);
byId("reset").onclick=()=>{if(confirm("Đặt lại toàn bộ tiến độ của Bài 1?")){progress=blank();save();home()}};
document.querySelectorAll("[data-home]").forEach(button=>button.onclick=home);
home();
</script>
</body>
</html>

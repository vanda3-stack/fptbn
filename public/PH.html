<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theo dõi học tập · FPTBN</title><link rel="icon" href="/assets/branding/favicon.png"><link rel="stylesheet" href="/ot/parent.css?v=parent-events4"></head>
<body><header class="parent-header"><a href="/PH.html"><img src="/assets/branding/logo_fpt_school.png" alt="FPT Schools"></a><button id="parentLogout" hidden>Đăng xuất</button></header>
<main><section id="parentLogin" class="parent-login"><img src="/assets/branding/logo-full.png" alt="FPTBN Monitor"><h1>Phụ huynh</h1><form id="parentForm"><label for="parentUsername">Mã học sinh</label><div class="parent-code"><span aria-hidden="true">FBN</span><input id="parentUsername" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="off" required placeholder="12345" aria-label="Năm chữ số trong mã học sinh"><span aria-hidden="true">PH</span></div><p id="parentError" role="alert"></p><button class="primary" type="submit">Đăng nhập</button></form></section>
<section id="parentDashboard" hidden>
<div class="dashboard-heading"><div class="child-info"><span class="eyebrow">THEO DÕI HỌC TẬP</span><strong id="childName"></strong><span id="childClass"></span></div><div class="monitor-actions"><button id="parentReconnect" type="button">Kết nối lại</button><button id="parentFloating" type="button" aria-describedby="floatingHelp">Mở cửa sổ nổi</button></div></div>
<div class="monitor-layout"><section class="monitor-main" aria-label="Màn hình của con"><div class="monitor-toolbar"><p id="parentStatus" role="status">Đang kết nối…</p></div><div id="screenStage" class="screen-stage" role="button" tabindex="0" aria-label="Bấm vào màn hình để xem toàn màn hình"><video id="childScreen" autoplay muted playsinline hidden></video><img id="childPreview" alt="Màn hình học sinh" hidden><p id="screenPlaceholder">Đang chờ con chia sẻ màn hình.</p></div><p id="floatingHelp" class="monitor-help" role="status"></p></section>
<aside class="monitor-sidebar" aria-label="Trạng thái học tập"><section id="demoAttention" class="demo-attention" hidden aria-label="Trạng thái ôn tập"><div><span class="eyebrow">THEO DÕI HIỆN TẠI</span><div class="study-event"><span class="study-label">TAB ÔN TẬP</span><div class="study-status-row"><p id="demoAttentionMessage" role="status" aria-live="polite"></p><span id="demoAttentionClock" class="study-time"></span></div></div><div id="screenSharingStatus" class="study-event" hidden><span class="study-label">MÀN HÌNH MÁY TÍNH</span><div class="study-status-row"><p id="screenSharingMessage" role="status"></p><span id="screenSharingTime" class="study-time"></span></div></div></div><button id="demoAttentionSound" type="button" aria-pressed="false">Bật âm báo</button></section><details id="demoHistory" class="demo-history" hidden><summary>Lịch sử cảnh báo <span id="demoHistoryCount"></span></summary><p id="demoHistorySave"></p><p id="demoHistoryEmpty">Chưa có cảnh báo trong phiên theo dõi.</p><div class="demo-history-scroll"><table><thead><tr><th>Sự kiện</th><th>Thời điểm ghi nhận</th><th>Quay lại / chia sẻ lại</th><th>Thời gian gián đoạn</th></tr></thead><tbody id="demoHistoryRows"></tbody></table></div></details></aside></div>
</section></main>
<script src="/socket.io/socket.io.js"></script><script src="/ot/family.js?v=20261023g"></script><script src="/ot/codes.js?v=8"></script><script src="/ot/demo-attention.js?v=parent-events4"></script><script src="/ot/parent.js?v=parent-events4"></script><script src="/ot/parent-floating.js?v=parent-events4"></script></body></html>

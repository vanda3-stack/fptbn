name: Test VPS SSH connection (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ssh:
    name: Verify deployment SSH (read only)
    if: github.ref == 'refs/heads/feature/outline-essay-grading'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          for key in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing secret $key"
              exit 1
            fi
          done
      - name: Prepare SSH credentials
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
      - name: Connect and check read-only permissions
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ] || exit 1
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p "$PORT" \
            "$VPS_USER@$VPS_HOST" \
            'set -eu; echo "SSH LOGIN SUCCESS"; whoami; test -r /home/u_fptbnmonitoronline_fa061ae2/fptbnmonitor.online/server.js && echo "APP READ ACCESS OK"; sudo -n /usr/bin/systemctl is-active vpanel-node@1-2.service'

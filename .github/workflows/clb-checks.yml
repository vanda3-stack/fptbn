name: CLB checks (no deployment)
on:
  push:
    branches: [feature/outline-essay-grading]
    paths: ["server.js", "lib/clb-room.js", "public/clb.html", "public/js/student.js", "public/js/teacher.js", "public/x.html", "test/clb-room.test.js", "test/exam-room-ui.test.js", "test/essay-cloze-flow.test.js", "test/ot-speech-essay.test.js", "test/ot-report-sharing.test.js", ".github/workflows/clb-checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Syntax and tests (no VPS access)
        run: |
          node --check server.js
          node --check public/js/student.js
          node --check public/js/teacher.js
          node --check lib/clb-room.js
          node --test test/clb-room.test.js test/exam-room-ui.test.js
          npm test
